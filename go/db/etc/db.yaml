Name: db.rpc
ListenOn: 0.0.0.0:6000
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: db.rpc
ZoneId: 1
# 存盘接口的预算要大于 SQL 锁等待(10s):zrpc 默认 2s 就取消,取消就是结果未知。
MethodTimeouts:
  - FullMethod: /playerstore.PlayerStore/SavePlayer
    Timeout: 12s
  - FullMethod: /playerstore.PlayerStore/LoadAndClaim
    Timeout: 12s
ServerConfig:
  # 存盘接口要求环境变量 MMORPG_PLAYER_STORE_SECRET_SCENE(至少 32 字节),库里要有 player_store 表。
  PlayerStore: {}
  JsonPath: "../../generated/data/mysql_database_table_list.json"
  Database:
    # 后端档位 tidb | mysql,不写就是 tidb;tidb 档固定 leader 严格读,mysql 档必须连主库。
    Backend: tidb
    Hosts: "127.0.0.1:3306"
    User: "root"
    Passwd: "Mmorpg#2026db"
    # ── 库名白名单(启动期硬断言)────────────────────────────────────
    # DBName 由 ZoneId 现拼(zone_{ZoneId}_db),而 ZoneId 是最容易填错的字段:
    # 填错一位就会在生产实例上静默建出新库、建全套表、把玩家数据写进去且无人
    # 看到报错。所以启动时会 SELECT DATABASE() 并要求它落在这份**与 ZoneId
    # 无关的外部清单**里,不在就拒启。
    # 解析优先级:环境变量 DB_ALLOWED_DATABASES > AllowedDatabasesFile > 本字段。
    # 生产部署请在 Deployment 上注入 DB_ALLOWED_DATABASES,不要依赖本文件。
    AllowedDatabases: []
    # AllowlistEnforcement=warn 表示「三个来源全空时打 WARN 放行」。
    # ⚠️ 本文件是**本地/dev 配置**(127.0.0.1 + MetricsListenAddr 都是 dev 默认),
    # 本地 go_services.ps1 会按 -Zone 改写 ZoneId,写死清单反而挡住多 zone 调试。
    # 生产配置一律不要带这一行(缺省即 strict = 拒启)。
    AllowlistEnforcement: warn
    # ── 启动期 DDL 开关(默认全关)──────────────────────────────────
    # 历史行为等价于两个都 true:InitDB() 会逐张跑 CreateOrUpdateTable。
    # 多 zone × 多副本同时启动会对同一张大表并发 ALTER,MDL 阻塞会让整个 zone
    # 的存盘停摆;proto2mysql 还会在类型不匹配时自动 MODIFY COLUMN,
    # 无版本记录、无 lock 超时。生产改为部署阶段跑:
    #     go run ./cmd/migrate -f etc/db.yaml -command up
    # 本地 go_services.ps1 启动 db 时设 DB_AUTO_MIGRATE_SCHEMA=1(zone 库由 deploy/mysql-init 预建),
    # 其余场景要临时打开也用环境变量 DB_AUTO_CREATE_DATABASE=1 / DB_AUTO_MIGRATE_SCHEMA=1。
    AutoCreateDatabase: false
    AutoMigrateSchema: false
    Migration:
      LockWaitSeconds: 5           # MDL 等待上限:撞上长事务时秒级失败,别堵死整表
      InnodbLockWaitSeconds: 5     # 行锁等待上限
      StatementTimeoutSeconds: 300 # 单条 DDL 硬超时,超时后旁路 KILL QUERY
      AdvisoryLockSeconds: 60      # GET_LOCK 等待:多副本同时部署时后到的排队
    # ── 业务连接池的超时与会话级锁等待 ──
    # 本 zone 库与按需打开的落点库都用这组值;迁移入口(cmd/migrate)与建库不用(DDL 可能合法地跑几分钟)。
    # 不写或写 0 取默认值(即下面这几个数);写负数表示不设。K8s 的 ConfigMap 不写这几项,走默认值。
    # 会话级锁等待必须短于读超时:客户端读超时撤不回已经发出的语句,让服务端先以 1205 中止排队中的语句,
    # 超时之后才不会留下事后生效的在途写。本地打开 AutoMigrateSchema 时启动期建表 / 补列也走这个池,大表上可能撞读超时。
    DialTimeoutSeconds: 5
    ReadTimeoutSeconds: 30
    WriteTimeoutSeconds: 30
    SessionLockWaitSeconds: 10       # MySQL lock_wait_timeout(元数据锁);TiDB 是否接受未核实,不接受时写 -1
    SessionInnodbLockWaitSeconds: 10 # MySQL innodb_lock_wait_timeout(行锁)
    MaxOpenConn: 60 # K8s 上所有 zone 的 go/db、data_service、gateway 与全局的 friend、trade 共用同一台库,
                    # 本池 × 副本数(2)× zone 数是总账里最大的一项。改这个值必须重算总账:
                    # tools/scripts/k8s_deploy.ps1 的 Get-MysqlConnectionLedger(部署时打印 "MySQL connection ledger"),
                    # 契约测试钉住「规划峰值 ≤ deploy/k8s/manifests/infra/mysql.yaml 的 max_connections」。
    MaxIdleConn: 20
    Net: ""

# ── 玩家存储落点(docs/design/player-storage-placement.md §6)────────────────
# 认领和实体已没的空行释放读全局库 player_route 的 storage_id 选库,全局库名取写者配置的 AuthoritySchema,这里不用配。
# 没有路由行或 storage_id 为 NULL 一律拒绝,不回落 home_zone 或本 zone 库;行被冻结(搬库中)→ 暂不可用。
Placement:
  # 允许按需打开 zone_{1..999999}_db / player_store_{>=1000000}_db 两个家族的库(不在上面的
  # 库名白名单里也行)。按需打开只 Ping + 只读 schema 闸,**从不建库**,白名单防「ZoneId 填错
  # 静默建新库」的语义不变。设 false 时,本 zone 库之外的每个落点库都必须写进白名单。
  AllowStoreFamilies: true
  # 额外落点库(本 zone 库之外)的连接池,**每个库一个池**,按库所属家族分两个旋钮(本 zone 库仍用上面的 Database.MaxOpenConn):
  #   ZoneStore*    —— zone 家族库 zone_{1..999999}_db:冷缓存访客读、合服 pin 后的源区库。最坏情形每个实例会打开其余全部
  #                    zone 的库,预算随 zone 数平方增长(总账见 tools/scripts/k8s_deploy.ps1 Get-MysqlConnectionLedger)。
  #   NonZoneStore* —— 非 zone 落点库 player_store_{>=1000000}_db(Phase 2)。大部分玩家搬进来后它是瓶颈,按压测单独调大,
  #                    不连带放大访客池;调大前先重做总账规划档。
  # 旧键 ExtraStoreMaxOpenConn / ExtraStoreMaxIdleConn 仍认:新键没写时两类库都回落到它,新配置不要再写。
  ZoneStoreMaxOpenConn: 8
  ZoneStoreMaxIdleConn: 2
  NonZoneStoreMaxOpenConn: 8
  NonZoneStoreMaxIdleConn: 2
  # 额外落点库池里空闲超过这么多秒的连接即关闭(SetConnMaxIdleTime):冷库的池回到 0 条,不按 MaxIdleConn 常驻。
  # ConnMaxLifetime 仍是 5 分钟,本值大于 300 等于不生效。
  ExtraStoreConnMaxIdleSeconds: 60

# Prometheus /metrics endpoint. Dev default; disable for prod by setting
# empty string. Exposes db_player_store_requests_total{op,result}, db_player_store_seconds{op},
# db_player_store_row_bytes{kind} and the placement store and pool gauges.
MetricsListenAddr: ":9160"
