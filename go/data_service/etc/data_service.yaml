Name: dataservice.rpc
ListenOn: 0.0.0.0:9000
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: dataservice.rpc

# C++ 约定的 etcd 注册(node-id-overhaul-plan §6.4 Phase 5,internal/noderegistry):除了 go-zero 自己的
# dataservice.rpc 键(C++ 看不见),data_service 还按 C++ NodeInfo 约定写两把 key,挂同一把租约:
#   DataServiceNodeService.rpc/zone/<ZoneId>/node_type/26/node_id/<N>   → protojson NodeInfo(ip:port)
#   DataServiceNodeService.rpc/allocated/node_type/26/node_id/<N>       → node uuid(node_id 跨 zone 唯一占位)
# scene 靠它发现 data_service 并调 AllocateIdSegment 领 item / txlog / snapshot 号段,发现不到就永远过不了
# DependencyGate,所以注册失败在启动期是致命的(panic,与 scene_manager 同)。注册在 gRPC 端口真正 accept 之后。
# 对外 IP:POD_IP 环境变量优先(K8s Downward API),否则 ListenOn 的 host,0.0.0.0 时取本机非 loopback IP。
# ZoneId:DataServiceNodeService 不是 zone-scoped 节点类型,C++ 发现侧不按 zone 过滤,填哪个 zone 都能被发现;
#   写 Pod 所在的 zone 只是排障时对得上号。可省略(默认 0);k8s ConfigMap 写部署 zone。
# LeaseTTL:上面那把租约的 TTL(秒),与 scene_manager / match 同形;k8s ConfigMap 从这里镜像。
ZoneId: 1
LeaseTTL: 60

# 全球服务不允许缺失权威store时带病注册；历史MySQL/Redis工具仅显式LegacyNonGlobal。
Store:
  Required: true

AccountDirectory:
  MaxPlayersPerAccount: 5
  # 账号目录独立 SQL 池的连接上限(每次登录的 ReadAccountDirectory 在这个池上开一个悲观事务)。缺省 = 8;
  # 合法 [1, 128](128 = shared/authoritysql 的单池硬上限),越界不装配目录、全球服务拒启。
  # 与 SnapshotMySQL / PlayerName / RouteStore 的池一样计入全局库连接总账:k8s_deploy.ps1 从本键读取,调大前先核 max_connections。
  MaxOpenConn: 8
  RoleTradeRequireGuildExit: true
  RoleTradeGuildSchema: mmorpg_guild
  RoleTradeTradeSchema: mmorpg_trade
  RoleTradeMailSchema: mmorpg_mail
  RoleTradeMatchSchema: mmorpg_match
  RoleTradeInboxSchema: mmorpg_player_inbox
  RoleTradeSQLProof:
    Enabled: true
    # 和go/db同一份外部正规库白名单；未提供时拒启，绝不从Regions/当前Zone猜storage。
    AllowedDatabasesEnv: DB_ALLOWED_DATABASES
    AllowedStorageIDs: []

# Prometheus /metrics(internal/metrics/metrics.go)。留空 = 不开端口。
# 9260 不与其它服务撞号
# (login 9101 / scene_manager 9150 / db 9160 / match 9170 / friend 9180 / player_locator 9190 /
#  路由服 9200 / chat 9210 / guild 9220 / trade 9230 / mail 9240 / rank 9250)。
# 必须保持顶层单行:go_services.ps1 -Zone 按与 ListenOn 相同的规则位移它。k8s ConfigMap 本批不镜像(07 §7.9.1 前提缺口)。
MetricsListenAddr: ":9260"

# Global mapping Redis: stores player_id → home_zone_id (player:zone:{id})。
#
# ⚠ 这里**没有 DB 键**,而且不能加:go-zero 的 redis.RedisConf 只有
#   Host / Type / User / Pass / Tls / NonBlock / PingTimeout,压根没有 DB 字段。
#   以前这里写着 `DB: 15`,go-zero 的 unmarshaler 按结构体字段取值、不认多余键,
#   于是那一行被**静默忽略**,映射实际一直落在 **DB 0**(已实测确认)。
#   删掉它是为了让文件与运行时一致 —— 留着比没有更危险:
#   tools/merge_zone 有 -mapping-redis-db 参数,运维照着这份 yaml 填 15,
#   工具读写的就是一个 data_service 从来不看的库,却报"成功"。
#   真要分库,得先给 config.Config 加一段自带 DB 的结构(不能用 go-zero 的 RedisConf),
#   同时改 tools/merge_zone 与所有直连这把 Redis 的运维脚本。
MappingRedis:
  Host: 127.0.0.1:6379
  Type: node

# Snapshot MySQL (player_snapshot / transaction_log 审计库)
SnapshotMySQL:
  # 后端档位 tidb | mysql,不写就是 tidb;mysql 档必须连主库。
  Backend: tidb
  Host: "127.0.0.1:3306"
  User: "appuser"
  Password: "apppass123"
  DBName: "mmorpg_global"
  MaxOpenConn: 5
  MaxIdleConn: 2

# 玩家名字注册表(全服唯一,docs/design/guild-phase2/03-names.md §3)。
# 表 player_name 就在上面这个全局库里(SnapshotMySQL),这一段只配**运行参数**;
# 玩法数值(2–12 字、生成名前缀)在配表 RoleNameRule 里,由 login 把关,不在这里。
#
# 整段可以不写:每个键的零值都当"没配",由代码填下面这些默认值
# (internal/config/config.go 的 PlayerNameConfig.Normalize,装配在 NewServiceContext)。
# 这里显式写出来是为了压测时好调,以及让"线上到底用了多少"一眼可见。
# 写了但写错(负数 / MaxIdleConn > MaxOpenConn / ReleaseWindow 超过 24h)= 名字 store
# 不装配,建角全线拒绝(fail-closed),启动日志里有一条 ERROR 说明是哪个键。
PlayerName:
  MaxOpenConn: 20      # 独立连接池:建角每次一条同步 INSERT,不与快照/号段抢那 5 条连接
  MaxIdleConn: 5
  # 不带 x-admin-token 的 ReleasePlayerName 只能删这么新的登记。这是**安全边界**:
  # 该 RPC 在内网无鉴权可达,窗口只需覆盖 login 建角失败后的补偿(立即一次 + 约 10s 后
  # 一次),10 分钟已极宽裕;调大等于把"能被匿名释放的在役角色"范围一起调大。
  # 运维清孤儿走 admin token 那条路(不限登记时间),不要为此改这个值。
  ReleaseWindow: 10m
  CacheTTL: 24h        # player:name:{id} 正缓存;v1 不支持改名,名字内容不会变
  NegativeCacheTTL: 60s # "库里确实没这个 id 的名字"的负缓存,挡住老角色每次开面板都回源

# 运维 RPC 的共享口令。调用方放在 gRPC metadata 的 `x-admin-token` 里。
# 这个 token 现在只守 ReleasePlayerName 的运维路径(不限登记时间的释放)。
#
# **不写这一行(或写空串)= 这些 RPC 整体停用**,不是免鉴权。这是刻意的默认值:
# data_service 在集群内网无鉴权可达,默认敞开意味着任何能拨到它的进程都能释放任意玩家的名字。
# 维护窗口里临时下发,窗口结束撤掉;生产建议由 k8s Secret 注入而不是明文写在这里。
#
# AdminToken: ""


# 玩家归属 / 落点映射的提交点(docs/design/player-route-mapping-durability-proposal.md §4、§11.2)。
# 当前全球默认db_first：TiDB player_route提交，再按maprev发布缓存。redis仅显式LegacyNonGlobal隔离工具。
# 下述P1–P5是存量导入历史步骤；不能据此关闭现役global的SQL proof/Arm/read-ready。
# 全新环境先迁移global及全部白名单玩家库，再起DS自然reconcile-ready，最后起DB/login；任何历史必须先正规导入/audit。
# 存量从 redis 导入 db_first 的历史前提(缺一不可；全新空库仍须通过空库证明):
#   1) 已在冻结窗口内(proposal §13.4 的 P1–P3):P4 之前不跑 merge_zone 任何写模式(merge/unmerge/relocate/pin-placement/backfill);
#      P4 起只许第 2 批新版 merge_zone 并显式 -route-source=db -route-db-dsn,旧二进制禁用;Arm=true 之前 `audit -require-maprev`
#      退出 0(P3);
#   2) P1 导入完成且 audit 为 0:
#        go run ./cmd/route_tool -f etc/data_service.yaml import-from-redis -dry-run=false
#        go run ./cmd/route_tool -f etc/data_service.yaml audit
#   3) mapping Redis 为 noeviction + appendonly yes、版本 ≥ 7.2(WAITAOF);
#   4) 建角压测已出 W1 p99 与发布未确认率(AGENTS.md §6)。
# 非法值 = 拒启。WAITAOF 两项都显式写 0 = 不等落盘(只给没有 AOF 的环境 / 单测用)。WaitAOFNumReplicas:K8s 上由
# k8s_deploy.ps1 按共享 Redis 形态渲染(单实例 0、高可用 1,与 go/db 同一个函数),本文件保持 0 给本机 compose 单实例:
# 写 1 时本机没有副本可等,db_first 下每次发布都确认不足(ErrRoutePublishNotDurable)。
# K8s 上 k8s_deploy.ps1 渲染 Mode / ReadRequiresReady / Reconcile.ArmReadyMarker,
#   取 -RouteStoreMode / -RouteReadRequiresReady / -RouteReconcileArm,不镜像本文件;MaxOpenConn / MaxIdleConn / WaitAOFTimeoutMs
#   取本文件,这里改了下次部署就生效。
# MergedZoneRefreshSec:定时重读 zone_merged_into 的周期(秒),[1, 60]。GetPlayerHomeZone / BatchGetPlayerHomeZone 用它把归属解析成
#   最终区(别名合服,docs/design/player-data-tidb-scaling-plan.md §7.1),这个周期就是滞后上限;tools/merge_zone 写完映射后等 2 个周期
#   再跑业务合并任务。启动时读不到拒启,之后读失败保留旧值、打 ERROR 与 data_service_merged_zone_refresh_total{result="error"}。
# PublishRedisPoolSize(2026-10-20):db_first 下 W1 发布 + WAITAOF 专用 go-redis 客户端的池上限(连 MappingRedis 同一个实例,
#   与读路径的 go-zero 客户端分池、不经熔断器);缺省 20 的论证见 internal/config DefaultRouteStorePublishRedisPoolSize。
#   redis 模式不建、不开连接;db_first 下每个副本最多多占 mapping Redis 这么多条连接(进共享 Redis 连接总账)。
RouteStore:
  Mode: db_first
  MaxOpenConn: 20
  MaxIdleConn: 5
  PublishAttempts: 3
  WaitAOFNumLocal: 1        # 本机 compose redis 开着 --appendonly yes(deploy/docker-compose.yml)
  WaitAOFNumReplicas: 0
  WaitAOFTimeoutMs: 1500
  PublishRedisPoolSize: 20
  MergedZoneRefreshSec: 5
  # 第 3 批读方门禁(docs/handoff/launch-readiness-20261013/spec_D1_batch1b2_2_3.md §5.2):true 时归属查询只在就绪标记
  # 绑定本实例身份时信任缓存,否则回源全局库 player_route(库故障回 Unavailable,绝不 NotFound)。只许 db_first(否则拒启)。
  # 打开时启动期试跑一次读脚本:跑不起来、或 route store 没装配起来,不论 Store.Required 都拒启;探针结论是 not_master /
  # identity_unavailable(MappingRedis 不是主、或脚本里取不到 INFO 身份)时照常启动但记 ERROR —— 标记对该实例永远挂不上,读全部回源库。
  # 全球配置默认开启；历史 P5 描述存量导入顺序，不授权现役全球服务退回 redis 或绕开 ready 门禁。
  ReadRequiresReady: true
  # 对账 leader(第 1b-2 批,docs/handoff/launch-readiness-20261013/spec_D1_batch1b2_2_3.md §4、§13.1;internal/routereconcile)。
  # 除全球显式开启 ArmReadyMarker 外，其余为组件默认值；非法值不论 Mode 都拒启(internal/config RouteReconcileConfig.validate)。
  #   - 只在 Mode=db_first 时运行:redis 模式不构造 leader、不建它的 Redis 客户端、不碰任何控制键(mapping:route:ready / warm / watermark)。
  #     db_first 下租约(route_reconcile)选出全服唯一的 leader:补发已提交未发布的孤儿行、每拍做库回档检测(水位键 M3)。
  #   - ArmReadyMarker:全球默认 true，**全服同值**；存量仍须完成二次导入、audit -require-maprev，
  #     全新环境须证明全部白名单玩家库无历史。此开关不跳过上述检查或水位回档检查。
  #     共享同一全局库的所有 data_service 副本必须取同一个值；false 会撤掉现存就绪标记，不能作为全球降级开关。
  #   - 在线清库(tools/scripts/currency_crash_window.ps1、stress_round19.ps1)之前,db_first 下**必须先停 data_service**:
  #     那两个脚本先 FLUSHALL 再清表、复位 route_reconcile,运行中的 leader 会把将被清掉的行推回刚清空的 Redis,
  #     或把水位复位误判成回档而冻结建角。
  #   - Enabled: false 不构造 leader、不再检测回档，也**不撤**现存就绪标记；全球读方门禁开启时该组合拒启。
  #     全球环境停机维护应先停依赖服务，不能关闭读方门禁以维持写入。RedisPoolSize 是 leader 独立 go-redis 池上限(进共享连接总账)。
  Reconcile:
    Enabled: true
    ArmReadyMarker: true
    LeaseMs: 10000
    RenewIntervalMs: 3000
    TickIntervalMs: 1000
    IncrementalIntervalMs: 30000
    IncrementalOverlapMs: 15000
    RepairLookbackMs: 60000
    RollbackToleranceMs: 0
    PushBatch: 500
    PushMaxRowsPerSec: 20000
    RedisPoolSize: 4
    AssumeNoEviction: false
    FreezeTimeoutMs: 5000
    RedisFailureReleaseMs: 10000
    ArmingBlockedReportLimit: 1000

# 全局库的建表策略:八张表都在 rollback_database_table.proto 里有 message:transaction_log / player_snapshot /
# rollback_audit_log / player_name + 路由表(player_route / zone_merged_into / route_meta /
# route_reconcile,映射持久化第 1a 批;proto 2026-10-19 补)。
# 其中 player_name 走 schema.go 里手写的 bootstrap DDL(proto2mysql 把 string 渲染成
# MEDIUMTEXT,而 player_name 的唯一键必须建在 VARCHAR 上),迁移对它只做列漂移校验;
# 路由表同样走手写 DDL,迁移按 proto 只守列名与主键,并种 route_meta / route_reconcile(id=1)。redis 模式同样依赖它们建成。
# TiDB 上建表之后另跑 `route_tool -f <yaml> tidb-prepare -zones=<全部 zone> -dry-run=false` 预切路由表(MySQL 自动跳过)。
# AutoMigrate=true:启动时按 proto(rollback_database_table.proto)用 proto2mysql 建表/补列。
# 生产必须**显式**设 false(多副本并发 ALTER 会互相 MDL 阻塞),改在部署阶段跑一次:
#   data_service -f etc/data_service.yaml -migrate
# 整段 `Schema:` 缺失(或写成 `Schema: {}`)时按 true 处理 —— 安全默认是"表一定在"。
# 注意这不是 go-zero 的 default 标签给的:go-zero 不下钻一个未出现的 optional 结构,
# 所以 AutoMigrate 在代码里是 *bool,nil = 没配 = 建表(见 internal/config/config.go)。
Schema:
  AutoMigrate: true

# 发号器(AllocateIdSegment),设计见 docs/design/player-data-tidb-scaling-plan.md §6,运维见 docs/ops/id-issuer-runbook.md。
# 发号器从内存切号段,只在预留新块时写两份记录;任何一份丢失或回退,另一份都盖得住发过的号。
#   AllowAutoSeed: 两份记录都不存在时是否自动初始化。
#     **生产必须保持 false / 不写**(整段缺失 = false):拒绝发号、不写任何记录,由部署步骤跑
#     `data_service -f <yaml> -id-issuer-init` 显式初始化。两份都不存在可能是两套 etcd 同时丢了数据,这个判断要留给人。
#     这里 dev 设 true,是为了空环境起了就能建角;k8s ConfigMap 按 profile 镜像(dev 取服务 yaml,staging/prod 固定 false)。
#   Tags: 允许发号的 biz_tag。没配 = 代码默认清单(config.DefaultIdSegmentTags)。所有种类共用一个计数器,清单只用来拦住拼错的 tag。
#     新增永久身份 = 在这里、代码默认清单与 k8s_deploy.ps1 data-service ConfigMap 同加。
#     trade_listing 是聚宝斋 listing_id,guild_asset_op 是帮会资产指令 op_id,mail 是 mail_id / sys_mail_id。
#   Issuer.Region: 地域码 0..63,写进计数器最高位。开始发号之后不能改。
#   Issuer.PrimaryEtcd / SecondaryEtcd: 放两份记录的两套 etcd。生产必须各配一套,地址不能有交集。
#     dev 可以不写,回落到上面的 Etcd.Hosts,两份记录放同一套 etcd 的不同键。
IdSegment:
  AllowAutoSeed: true      # dev only;生产必须 false
  Tags: [player, guild, item, txlog, snapshot, trade_listing, guild_asset_op, friend_request, trade_asset_op, mail, mail_asset_op, rank_board, rank_settlement, rank_reward, battle, snapshot_row, rollback_audit]

# C++ scene 产出的交易流水 / 玩家快照落库消费者。Brokers 留空 = 不消费(本地无 Kafka 合法)。
# Kafka 不可达不影响 Load/Save,只记日志并每 30s 后台重试。
#
# 真正使用的 topic 名 = <基名>_g<TopicGeneration>,即默认
#   transaction_log_topic_g1 / player_snapshot_topic_g1
# C++ 生产者(cpp/libs/modules/{transaction_log,snapshot}/*.h 里的 topic 常量)必须用同样的名字。
# 为什么连第一代也带后缀:broker 开着 auto.create.topics.enable 且 num.partitions=1
# (deploy/docker-compose.yml KAFKA_NUM_PARTITIONS=1),生产者一发消息就把**裸名字**的 topic
# 自动建成 1 分区;EnsureTopics 拿 6/3 的契约去比只会永远报 partition contract mismatch,
# 两条消费者一条都起不来。带代号的名字与那两个自动建出来的裸 topic 互不相干。
# 部署侧应当预建这两个 topic 并给足分区(6 / 3),别依赖自动创建。
#
# 分区数是不可变契约(EnsureTopics 会拒绝与 broker 现状不一致的值),现在就定够。
# 要改分区数 = TopicGeneration +1(换一批新 topic,老 topic 排空后删),
# **绝不**原地扩分区:扩分区会重映射 key=player_id 的哈希,同一玩家的流水顺序就断了。
Kafka:
  Brokers:
    - 127.0.0.1:9092
  TopicGeneration: 1
  TransactionLogTopic: transaction_log_topic   # 基名;有效名带 _g<TopicGeneration>
  TransactionLogPartitions: 6
  TransactionLogConsumerGroup: data_service-transaction-log
  SnapshotTopic: player_snapshot_topic         # 基名;同上
  SnapshotPartitions: 3
  SnapshotConsumerGroup: data_service-player-snapshot
  RetentionMs: 2592000000   # 30 天:消费者因 DB 故障停下期间的积压必须在此窗口内补完
  # ── player_snapshot 消费者的批量 / 并发旋钮与 lag 探针(G2a,internal/config KafkaConfig)──
  # 下面四个 Snapshot* 键写的是代码默认值 = 2026-10-12 之前的逐条串行行为;不写(或整段 Kafka 缺失)效果相同。
  # 越界 = data_service 拒启(exit 1)。改成建议开服值(16 / 4194304 / 200 / 2)要等压测对比表(AGENTS §6,
  # stress_summarize 的审计段)与内存护栏(GOMEMLIMIT / limits)都拍板之后,见 docs/ops/audit-topic-generation-bump-runbook.md。
  SnapshotBatchMaxRows: 1            # 每分区一批最多几条消息,[1,256];1 = 逐条落、逐条提交(现状)。建议开服值 16
  SnapshotBatchMaxBytes: 4194304     # 一批 data 字节软上限,[65536,33554432];加入后检查,最多超出一条。建议开服值 4194304
  SnapshotFlushIntervalMs: 0         # 批非空后最多再等多久凑批,[0,5000];0 = 不等,只拼已排队的。建议开服值 200
  SnapshotMaxInflightFlushes: 1      # 本实例同时落库的分区数,[1, SnapshotMySQL.MaxOpenConn-1];不新增连接。建议开服值 2
  # 消费组 lag / 保留期丢失量探针周期(ms),0 = 关,否则 [5000,600000]。只读 broker 元数据、不碰消费与落库,
  # 刻意默认打开:没有它 data_service_kafka_consumer_lag_messages / retention_gap_messages 不出数,积压与保留期告警全哑。
  LagProbeIntervalMs: 30000
