Name: mail.rpc
ListenOn: 127.0.0.1:50900
AdvertiseHost: 127.0.0.1
Mode: dev
Timeout: 3500
ZoneId: 1
Etcd:
  Hosts: [127.0.0.1:2379]
MetricsListenAddr: 127.0.0.1:9240
DSNEnv: MMORPG_MAIL_SQL_DSN
Backend: tidb
MaxOpenConns: 16
AutoMigrate: false
TableDir: ../../generated/tables
SharedRedisAddr: 127.0.0.1:6379
# 玩家域 Redis(docs/design/redis-player-store-cluster.md §5.8):提醒读会话,资产定位读位置。
# 不写 Addrs = 指向上面的 SharedRedisAddr。集群部署写种子地址并打开 Cluster:
#   Addrs: [127.0.0.1:7000, 127.0.0.1:7001, 127.0.0.1:7002]
#   Cluster: true
#   PasswordEnv: MMORPG_MAIL_REDIS_PASSWORD
# PoolSizePerNode 是每个节点的连接池上限,单实例即总上限。读写与取连接 300ms、拨号 1s 沿用这条路径原来的口径。
PlayerRedis:
  PoolSizePerNode: 8
KafkaBrokers: [127.0.0.1:9092]
AssetSecretEnv: MMORPG_ASSET_OP_SECRET_MAIL
DataServiceRpc:
  Endpoints: [127.0.0.1:9000]
  Timeout: 2000
# 读玩家所在的帮,给帮会文本邮件判可见。guild 没起时邮件照常起服,这一次按没有帮算(mail_guild_lookup_failures_total)。
GuildRpc:
  Endpoints: [127.0.0.1:50300]
  Timeout: 500
  NonBlock: true
Producers:
  admin: MAIL_PRODUCER_SECRET_ADMIN
  rank: MAIL_PRODUCER_SECRET_RANK
  guild: MAIL_PRODUCER_SECRET_GUILD
  # C++ scene 把两包都放不下的战斗掉落寄进邮箱(docs/design/battle-overflow-mail.md),sender_kind = 5。
  battle: MAIL_PRODUCER_SECRET_BATTLE
  # go/match 投递群仙问道赛赛季奖励的附件(docs/planning/season-team-tournament-v1.md 第七节),sender_kind = 6。
  match: MAIL_PRODUCER_SECRET_MATCH
# 双人复核(docs/design/admin-identity-and-dual-control.md §5.5):ApprovalRequiredCallers 里的调用方发件必须带后台的批准记录,
# 缺了回 PermissionDenied;不写 = 只有 admin(admin 恒在其中)。本机开发要用 mailadmin 不带记录发信时,临时加一行
# AdminAllowUnapproved: true。本文件整份进 K8s ConfigMap,不能提交成 true。
Log:
  ServiceName: mail
  Mode: console
  Level: info

KillSwitchPrefix: /mmorpg/killswitch/
Mail:
  MaxPersonalMailsPerPlayer: 200
  MaxActiveSystemMails: 100
  MaxPersonalMailTtlDays: 30
  MaxSystemMailTtlDays: 30
  # 每个帮会同时有效的帮会邮件上限,按帮计数,不占全服的 MaxActiveSystemMails(缺口清单第 27 条)
  MaxActiveGuildMailsPerGuild: 20
Sweep:
  Mode: report_only
  Interval: 5m
  RetentionDays: 7
  BatchLimit: 1000

# 链路追踪阶段三(docs/design/distributed-tracing.md §10.3):go-zero 把 span 经 OTLP/gRPC 送本机 Alloy
# (deploy/docker-compose.observability.yml,dev.bat obs 起),Alloy 尾部采样后存进 Tempo。Name 与 Loki 的 service 标签同值。
# 头部全采(Sampler 1.0),取舍在采集器。Alloy 没起时导出器在后台重连、丢 span,不影响业务;不想导出就加 Disabled: true。
# K8s 上由 k8s_deploy.ps1 按是否部署了节点采集器重写整段(New-GoSvcConfigMapYaml),不搬本机这个地址。
Telemetry:
  Name: mail
  Endpoint: 127.0.0.1:4317
  Sampler: 1.0
  Batcher: otlpgrpc
