Name: matchservice.rpc
Mode: dev
# 客户端请求的原角色身份只从 login 同一实例 / DB 核对,必须开启。本机 go_services.ps1 按 login 的配置派生这两项。
GlobalLoginSessions: true
LoginRedis:
  Addrs: [127.0.0.1:6379]
  DB: 0
  PasswordEnv: MMORPG_LOGIN_REDIS_PASSWORD
  PoolSizePerNode: 8
# 排队、占用、成局、评分与组队的权威都在这个 SQL 库,开发环境与生产同一份代码,所有副本连接同一库,缺配置不能起服。
# 这里写的是 TiDB 入口;本机起 go_services.ps1 / start_game.ps1 默认连 MySQL 容器(Backend: mysql,派生配置改写)。
# 库、表与开发密钥由启动脚本准备:库 mmorpg_match 预建,表用 match -migrate 迁移(与 guild 互相核对对方的表)。
# 密钥只从环境读取,MATCH_PROBE_SECRET 须与各机房 battle 一致且至少 32 字节。
GlobalMatch:
  Backend: tidb
  Host: 127.0.0.1:4000
  User: root
  Database: mmorpg_match
  AccountRoleSchema: mmorpg_global
  GuildTrialSchema: mmorpg_guild
  PasswordEnv: MATCH_MYSQL_PASSWORD
  ProbeSecretEnv: MATCH_PROBE_SECRET
  CrossRegionWaitSeconds: 30
  HardLatencyMs: 180
  ProbeTTLSeconds: 120
  # 匹配范围逐级放宽(docs/design/global-match-hierarchical-pools.md §3.2):先同 zone,等满 10 秒可同大区,
  # 等满 20 秒可全服。提交点规则,进全局策略指纹,改动须停全部副本后受控调整。初值待按真实等待分布定标。
  ScopeGroupAfterSeconds: 10
  ScopeGlobalAfterSeconds: 20
  # 每副本同时备战的成局上限、按池读单排票的页大小。
  GatherSlots: 256
  PoolPageSize: 512
  RankEndpoint: 127.0.0.1:51100
  RankSecretEnv: RANK_PRODUCER_SECRET_MATCH
  # 终局发件箱(整局结果发 Kafka、个人结算入 Inbox)的投递节拍、每轮批量与并发;默认与 2026-10-30 之前写死的行为一致。
  # 批量 1..256、并发 1..32,越界拒启。一轮从读 SQL 时刻起 26 秒内没轮到认领的行留给下一轮(认领租约 30 秒)。
  OutcomeOutbox:
    IntervalMs: 2000
    ResultBatch: 8
    FirstBatch: 4
    WaitingBatch: 4
    Concurrency: 1
ListenOn: 127.0.0.1:50500
# zrpc 服务端超时(毫秒),对同一 server 上的 MatchService 与 ClientPlayerTeam 都生效。2026-10-14 由 5000 改为 4000
# (docs/design/client-request-ordering.md O10 / §5):预算链要求「目标 Timeout + 1000 ≤ 路由服 ForwardTimeoutMs(5000)」。
# 路由服先回超时、match handler 却还在跑,gate 会放行同一会话的下一条请求,这一条的写晚落地就会乱序。
# 客户端请求路径上的写一律用请求 ctx(入队 / 取消 / 挑战 / 观战),截止之后不再发出;
# WatchBattle 的 AddObserver 也从请求 ctx 派生截止时间,不再在客户端收到失败之后继续绑定观战(原「保持 5000」的理由见
# team-system.md §A.3 第 7 条及其 2026-10-14 更正)。K8s ConfigMap 从这里镜像;部署门禁 Assert-RouterForwardBudget 核对。
Timeout: 4000
# 终局原事件、原账号与签名不进入请求体日志；保留方法和耗时。
Middlewares:
  StatConf:
    IgnoreContentMethods:
      - /match.MatchInternal/CommitBattleOutcome
      - /match.MatchInternal/CancelActivityBattle
      - /match.MatchInternal/SetSpectateFeatured
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: matchservice.rpc

# ---- 双存储(设计文档 cross-zone-matchmaking.md D2)----
# Redis:既有共享库。MatchRedis 不配时私有 key 的回落目标,PlayerRedis 不写 Addrs 时玩家域的落点。
# MatchRedis:match 私有协调 key(spectate:* 观战索引、档位与配额)的存储,可指向
#   Redis Cluster。不配即回落到 Redis(两类 key 同一实例,本地单库形态)。
Redis:
  Host: 127.0.0.1:6379
  Type: node
  Key: matchservice

# 玩家域 Redis(docs/design/redis-player-store-cluster.md §5.7、§5.8):跨运行时契约 key(player:{id}:location /
#   player:session:{id} / battle:lock:{id}),写者是 scene_manager / player_locator / C++ scene,match 只读;
#   player:{id}:sync_digest 由组队 bump。不写 Addrs = 指向上面的 Redis 实例。集群部署写种子地址并打开 Cluster:
#     Addrs: [127.0.0.1:7000, 127.0.0.1:7001, 127.0.0.1:7002]
#     Cluster: true
# PoolSizePerNode 是每个节点的连接池上限,单实例即总上限。读写 3s、取连接 4s、拨号 5s 沿用这条路径换句柄之前的口径。
PlayerRedis:
  PoolSizePerNode: 20

# 本地集群样例(docker compose --profile redis-cluster,6 节点 3 主 3 从):
# Host 逗号分隔多个种子地址,Type 必须是 cluster。
MatchRedis:
  Host: 127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002,127.0.0.1:7003,127.0.0.1:7004,127.0.0.1:7005
  Type: cluster
# C++ 约定 etcd 注册路径用的 zone id。MatchNodeService 不是 zone-scoped 节点类型,
# gate 连的是全 zone 的 match 实例(随机路由);zone 只影响 etcd 注册路径,
# 匹配池全局不分 zone。本地 dev-start-zones 每 zone 起一份 = 多实例。
ZoneId: 1

# etcd 节点注册 keepalive 的租约 TTL(秒)。
LeaseTTL: 60

# battle_id / challenge_id / team_id 的号段(biz_tag = battle,向 data_service 的发号器申请)。
# Step 只是初值,客户端按每段用掉的时长在 [MinStep, MaxStep] 内调整。必须写 Enabled: true,没写起服即拒绝。
IdSegment:
  Enabled: true
  Step: 1000
  MinStep: 100
  MaxStep: 100000

Kafka:
  Brokers:
    - 127.0.0.1:9092

# 挑战邀请/结果 S2C 走 Kafka gate-{id} 推送时 writer 侧的一次同步 produce 超时(秒)。
# 推送不受请求截止约束(有意,2026-10-15 记):ChallengePlayer / RespondChallenge 在提交点(挑战记录已在 SQL 提交)
# 之后才推,推送用独立的 pushTimeout(5s,push.go),与本值一样大于上面的 Timeout 4000。所以可能出现「路由服已向
# 客户端回超时、邀请随后仍推到目标」,推送失败的 cleanup 也可能在截止之后执行。记录在截止前已合法提交,这只是
# 回执与推送的先后不一致,不破坏数据;改成跟随请求 ctx 会让「已提交的挑战」反而推不出去,代价更大。
# 见 docs/design/client-request-ordering.md §5。
KafkaWriteTimeoutSeconds: 5

# 按池撮合循环的间隔(毫秒)。
MatcherIntervalMs: 500

# 场景发起 PK(切磋)记录的 TTL(秒),超时未应答自动作废(设计文档 §3.1b)。
ChallengeTTLSeconds: 60

# 一局备战预算的下限(秒)。实际预算取 max(该值, 按组大小算的最坏链路),决定 scene 侧 PREPARING 的作废期限与组队开战锁时长(决策 D5)。
MatchedTicketTTLSeconds: 30

# 战斗配表指纹比对策略(设计决策 D14):scene 在 PrepareBattle 响应里回报本节点六张
# 战斗表的内容指纹,gather 收齐后比对全员一致才透传给 battle。
#   off     不比对、不透传;
#   warn    不一致 / 部分为空只记 Error 日志 + match_table_fingerprint_mismatch_total,照常开局;
#   enforce 不一致视为 prepare 失败:与多数派不一致者的单排票终止,其余成员保留原入队时刻回队,已冻结者解冻。
# 灰度期用 warn 观察指标,各 zone 表版本对齐后再切 enforce。
TableFingerprintMode: warn

# 匹配入口白名单与人数上限来自导表产物(2026-10-24 起,docs/design/global-match-hierarchical-pools.md §7):
# PlayMode 表一行 = 一个 (模式, 怪物战斗模板) 组合可以排队或开战,Dungeon 表描述怪物组与战斗时长,
# ZoneGroup 表描述大区。原 PveTeamSizeByConfigId 已删除:开新本、调人数只改表,不改本配置,也不需要停全部副本。
TableDir: ../../generated/tables

# Prometheus /metrics 端口。9101=login / 9150=scene_manager / 9160=db 已占,match 用 9170。
# 置空可关闭。本机多实例时由 go_services.ps1 按实例派生不同端口。
MetricsListenAddr: ":9170"

# ---- 评分匹配(设计文档 cross-zone-matchmaking.md §11)----
# 评分存 SQL 权威库的 match_rating(默认 1500),入账幂等靠 match_rating_applied。
# RatingEnabled:消费 Kafka 对局结果更新 Elo;关闭后评分停在 1500,匹配退化为纯等待序。
RatingEnabled: true
# battle 节点发 BattleResultEvent 的 topic(全局无 zone 段,key=battle_id),与 C++
# battle_room_manager.cpp 的 kMatchResultsTopic 一致;启动时确保存在。分区数是不可变契约。
ResultTopic: match-results
ResultTopicPartitions: 3
# 消费组:多实例同组分摊分区,每条结果只被一个实例消费。
ResultConsumerGroup: match-rating
# 容差曲线 tol = min(Max, Base + floor(等待秒 / StepSeconds) × StepDelta):
# 100 起、每 5s 放宽 100、上限 1000。PVE 组队不看评分(容差 ∞,纯等待序)。
RatingToleranceBase: 100
RatingToleranceStepSeconds: 5
RatingToleranceStepDelta: 100
RatingToleranceMax: 1000
# 终态兜底:锚点已等 ≥ 该秒数时容差 = ∞(纯等待序),分差再大也必配;分差超过
# RatingToleranceMax 的两人不会永久饥饿。0 / 漏配按默认 90。
RatingToleranceMaxWaitSeconds: 90
# 回合打满按平局:C++ 引擎回合打满一律判 SIDE_B_WIN(PVE 规则),PVP 照胜负结算会让
# 锚点 / 高分方系统性扣分;total_rounds ≥ 该值的胜负结果按 0.5 结算。默认 300 =
# C++ kDefaultMaxRounds;0 关闭。配了 DungeonTable.time_limit 的配置按下面的 map 覆盖。
RatingDrawRoundCap: 300
# RatingDrawRoundCapByConfigId:
#   "1": 300

# ---- 组队(docs/design/team-system.md;team 模块与 MatchService 同进程、同端口)----
# AllowCrossZone:是否允许不同 home zone 的玩家同队。默认 false:申请 / 审批 / 邀请 / 接受邀请
#   比对对方 home zone 与队伍 zone,不一致回 TeamCrossZoneDenied。从 true 改回 false 只拦新增。
#   靠改这里 + 重启所有 match 实例切换;混跑窗口看 team_cross_zone_allowed gauge(J-13a)。
# FillQueueDisabled:关闭队伍补位匹配(docs/design/team-backfill-matching.md §4.6)。默认 false = 开放。
#   置 true 并重启所有 match 实例后:带「目标人数 > 当前人数」的整队开战回 TeamDungeonNotOpen,
#   客户端不再给出目标人数选项;已经在队列里的补位单不受影响(照常可取消、可成组),直接开战不受影响。
#   混跑窗口看 team_fill_queue_disabled gauge。
Team:
  AllowCrossZone: false
  FillQueueDisabled: false

# ---- 观战分级扩容(docs/design/battle-spectate-tiered-fanout.md §15.6 / §15.7)----
# RelayEnabled:L1 中继 / L2 广播的部署级开关(Q6)。只在全部 battle 与 gate 共用一个 Kafka 集群时打开:帧经 gate-spectate_g<N> /
#   spectate-bcast_g<N> 从 battle 到 gate,跨集群收不到且不报错。关闭时观众只走 L0 直连,满了回 MatchSpectateFull。
#   本机只有一个 Kafka,打开;K8s 上不镜像本行,由 k8s_deploy.ps1 的 New-MatchSpectateYaml 按部署拓扑写。
# BroadcastMaxConcurrent:全服同时处于 L2 的场次上限 B,0 = 不开 L2。
# BroadcastAutoGateThreshold:本场中继 gate 数达到它就自动升 L2(G_min),0 = 只认运营标记(featured)。
# TicketTTLSeconds:观战凭证有效期(秒)。
# TicketSecret:观战凭证 HMAC 密钥,必须与 bin/etc/base_deploy_config.yaml 的 SpectateTokenSecret 同值,否则订阅全部被 gate 拒绝;
#   至少 32 字节、不许含空白,且与 gate / battle 令牌密钥都不同。
# OpsCallerSecret:运营入口 SetSpectateFeatured 的调用方验签密钥(serviceauth 调用方 ops)。空 = 入口关闭,一律 PermissionDenied;非空至少 32 字节。
# 这两把在这里只是本机 dev 值;K8s 由环境变量 MMORPG_SPECTATE_TOKEN_SECRET / MMORPG_MATCH_OPS_CALLER_SECRET 注入。
Spectate:
  RelayEnabled: true
  BroadcastMaxConcurrent: 4
  BroadcastAutoGateThreshold: 32
  TicketTTLSeconds: 60
  TicketSecret: "local-dev-spectate-token-secret-a1b2c3d4e5f60718"
  OpsCallerSecret: "local-dev-match-ops-caller-secret-0f1e2d3c4b5a6978"

# data_service gRPC 客户端(etcd 发现):领号段、查玩家昵称与展示资料。
# 玩家归属和合服映射不走这里,直接读全局库(GlobalMatch.AccountRoleSchema 的 player_route、zone_merged_into)。
# NonBlock: true 是硬要求:客户端在 ServiceContext 里构造,早于节点注册与起服;阻塞建连会让
#   data_service 没起时整个 match(排队 / 切磋 / 观战)起不来。Go 侧对 false 也会强制改成 true。
# Timeout: 1500 小于 team 自己的 3500ms 请求预算。
# 注意:顶层 Timeout 原先「保持 5000 不改」(WatchBattle 同步链最坏 >4s,team-system.md §A.3 第 7 条);
# 2026-10-14 已改为 4000,理由见文件顶部 Timeout 注释。
# 本地 -Zone 派生会把 Key 改成 dataservice.rpc.z<N>(go_services.ps1),与同 zone 的 data_service 配对,
#   和 guild / login 同一形态。
DataServiceRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: dataservice.rpc
  Timeout: 1500
  NonBlock: true
  Middlewares:
    Breaker: false
