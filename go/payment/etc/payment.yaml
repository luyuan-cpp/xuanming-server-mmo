# 支付服务的本地开发配置(docs/design/payment-recharge.md §22.9)。密钥一律只写环境变量名,值不进本文件。
# 生产与预发:Mode 固定 pro,真钱渠道要先过合规闸(§12、§22.8),密钥经 K8s Secret 注入。
Name: payment.rpc
ListenOn: 127.0.0.1:51200
AdvertiseHost: 127.0.0.1
Mode: dev
Timeout: 3500
ZoneId: 1
Etcd:
  Hosts: [127.0.0.1:2379]
MetricsListenAddr: 127.0.0.1:9280
KillSwitchPrefix: /mmorpg/killswitch/
DSNEnv: MMORPG_PAYMENT_SQL_DSN
Backend: tidb
MaxOpenConns: 16
AutoMigrate: false
# 只在 Payment.Compliance.MinorSpendingGate=realname 时连:建意图前按玩家读账号上的实名(GetAccountRealName)。
DataServiceRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: dataservice.rpc
  Timeout: 2000
  NonBlock: true
Log:
  ServiceName: payment
  Mode: console
  Level: info

Payment:
  # 渠道回调的监听地址;本机联调直接打它。K8s 上由部署脚本改成 0.0.0.0:18130,经 Service payment-notify 与外部负载均衡暴露为 https://<支付域名>/notify/<渠道>。
  NotifyListenAddr: 127.0.0.1:18130
  # 微信支付、支付宝下单时带的回调根地址(公网 https)。本机联调只开 devpay 时可以不填。
  NotifyBaseURL: ""
  Mall:
    BaseURL: http://127.0.0.1:18120
    PaymentSubject: payment-adapter
    PaymentSecretEnv: COMMERCE_PAYMENT_SECRET
    TimeoutMs: 2500
  # 每种发行形态开放的渠道,按展示顺序。iOS App 只能挂 apple(苹果审核规则 3.1.1)。
  Platforms:
    - Platform: android_app
      Channels: [devpay]
    - Platform: ios_app
      Channels: [devpay]
    - Platform: wechat_minigame
      Channels: [devpay]
    - Platform: douyin_minigame
      Channels: [devpay]
    - Platform: desktop
      Channels: [devpay]
  # 商城 SKU 在按商品定价的渠道上的商品号(App Store / Google Play / 微信小游戏道具 ID);没登记的 SKU 不能走这些渠道。
  Products: []
  # 合规闸(docs/design/real-name-anti-addiction.md §5.6):none = 不接实名,生产模式下 App 渠道拒启;
  # realname = 建意图前按账号目录的实名执行未成年人充值限额(要 DataServiceRpc 与 MMORPG_ACCOUNT_DIRECTORY_SECRET_PAYMENT),App 渠道才能在生产开;
  # overseas = 部署在中国大陆以外,不读实名,App 渠道照开。
  Compliance:
    MinorSpendingGate: none
    # 未成年人单日累计上限(分),0 = 不设;数字待负责人定(充值设计 §18 第 7 条)。
    DailyLimitFenAge8To16: 0
    DailyLimitFenAge16To18: 0
  DevPay:
    Enabled: true
    SecretEnv: PAYMENT_DEVPAY_SECRET
  WechatPay:
    Enabled: false
    AppID: ""
    MchID: ""
    MerchantSerialNo: ""
    PlatformPublicKeyID: ""
    PrivateKeyEnv: PAYMENT_WECHATPAY_PRIVATE_KEY
    APIv3KeyEnv: PAYMENT_WECHATPAY_APIV3_KEY
    PlatformPublicKeyEnv: PAYMENT_WECHATPAY_PUBLIC_KEY
    Description: 游戏商品
  Alipay:
    Enabled: false
    AppID: ""
    SellerID: ""
    PrivateKeyEnv: PAYMENT_ALIPAY_PRIVATE_KEY
    PublicKeyEnv: PAYMENT_ALIPAY_PUBLIC_KEY
    Subject: 游戏商品
  WechatMinigame:
    Enabled: false
    AppID: ""
    OfferID: ""
    Env: 0
    AppSecretEnv: PAYMENT_WECHAT_MINIGAME_APP_SECRET
    AppKeyEnv: PAYMENT_WECHAT_MINIGAME_APP_KEY
    PushTokenEnv: PAYMENT_WECHAT_MINIGAME_PUSH_TOKEN
  DouyinMinigame:
    Enabled: false
    AppID: ""
    PushTokenEnv: PAYMENT_DOUYIN_PUSH_TOKEN
  Apple:
    Enabled: false
    BundleID: ""
    AppAppleID: 0
    IssuerID: ""
    KeyID: ""
    AllowSandbox: true
    PrivateKeyEnv: PAYMENT_APPLE_PRIVATE_KEY
    RootCertificatesEnv: PAYMENT_APPLE_ROOT_CERTIFICATES
    Test:
      Accept: true
  Google:
    Enabled: false
    PackageName: ""
    PushAudience: ""
    PushServiceAccount: ""
    ServiceAccountEnv: PAYMENT_GOOGLE_SERVICE_ACCOUNT
    Test:
      Accept: true

# 链路追踪阶段三(docs/design/distributed-tracing.md §10.3):go-zero 把 span 经 OTLP/gRPC 送本机 Alloy
# (deploy/docker-compose.observability.yml,dev.bat obs 起),Alloy 尾部采样后存进 Tempo。Name 与 Loki 的 service 标签同值。
# 头部全采(Sampler 1.0),取舍在采集器。Alloy 没起时导出器在后台重连、丢 span,不影响业务;不想导出就加 Disabled: true。
# K8s 上由 k8s_deploy.ps1 按是否部署了节点采集器重写整段(New-GoSvcConfigMapYaml),不搬本机这个地址。
Telemetry:
  Name: payment
  Endpoint: 127.0.0.1:4317
  Sampler: 1.0
  Batcher: otlpgrpc
