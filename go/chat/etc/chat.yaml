# Chat 服务配置(契约 zone_contract_v1 §3/§4/§7/§9)
# 全局服务:全服一份、多副本;客户端只经 gate → 路由服到达(路由模式)。
Name: chat.rpc
ListenOn: 127.0.0.1:50700

# 聊天原件库的连接；这里只写环境变量名。
DSNEnv: CHAT_AUTHORITY_DSN
# 后端档位 tidb | mysql,不写就是 tidb;mysql 档必须连主库。
Backend: tidb
MaxOpenConns: 16
# 身份校验调目录的 GetRoleFenceState,调用方密钥在环境变量 MMORPG_ROLE_FENCE_SECRET_CHAT。
DataServiceRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: dataservice.rpc
  Timeout: 1500
  NonBlock: true
# 身份校验结果的进程内缓存秒数,发送和拉取不再每条都打 RPC。0 = 每次都校验。
# 代价:角色被挂牌或过户之后,旧会话最多还能发这么久的聊天(聊天不是资产)。
ActorVerifyTTLSeconds: 30
# 世界频道近窗快照的最长使用时长(毫秒),上限 5000。0 = 每次拉取都直读 SQL。
# 世界频道全服一条流:开着时每个副本每这么久至多读一次库,读量与在线人数无关。
# 代价:别的副本上刚发的消息最多晚这么久才出现在历史里;本副本自己的提交立刻可见。
# 设计见 docs/design/chat-world-channel-fanout.md §3。
WorldHistoryCacheMs: 500
# 世界频道推送(同一设计 §4):世界频道每条首次提交后往 chat-world-bcast_g<N> 写一条,每台 gate 推给本机在线玩家。
# Brokers 为空 = 不推,客户端只能靠拉历史看到新消息。topic 代号读环境变量 KAFKA_COMMAND_TOPIC_GENERATION
# (与命令 topic 同源),start_game.ps1、docker 调试 compose 与 k8s_deploy.ps1 都会注入。
Kafka:
  Brokers:
    - "localhost:9092"

# zrpc 服务端整体超时(毫秒)。必须 ≤ 路由服 ForwardTimeoutMs(5000)− 1000:
# chat 要先于路由服超时把 in-band 结果回去,否则"写入已生效 + 客户端看到失败"会诱发重发。
# config.Validate 拒绝 0 与 >4000。
Timeout: 4000

# etcd:只给 shared/noderegistry 注册 ChatNodeService.rpc/... 与 shared/killswitch 用。
# Key 必须留空(契约 D-13):v1 没有 Go 调用方按 go-zero key 发现 chat,填了 Key 会让 go-zero
# 额外注册 chat.rpc,且被 go_services.ps1 -Zone 按 .z<N> 切分。config.Validate 拒绝非空 Key。
# ⚠ 这里必须**显式写 Key: ""**,不能整行省略:go-zero 的 EtcdConf.Key 不是 optional,
# Etcd 段存在而缺 Key 时 conf 加载直接报 "Etcd.Key" is not set(core/mapping
# processNamedFieldWithoutValue)。空串 → HasEtcd()=false → 不注册 go-zero key;
# -Zone 的改写正则只匹配 "Key: <id>.rpc",空串不会被改。
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: ""

# go-zero Stat 拦截器默认按 INFO 打每个请求的整包 JSON:SendChat 请求体就是聊天正文(含私聊),
# 不应落日志。只屏蔽内容,不关 Stat —— 慢调用告警照常保留。
Middlewares:
  StatConf:
    IgnoreContentMethods:
      - /chatpb.ClientPlayerChat/SendChat

# chat 不连 Redis:发送决定、限速与历史读取都在 SQL 原件库(当前合同见设计§19)。
# zrpc.RpcServerConf 自带的 Redis 段是 optional,只在 Auth=true 时用,chat 不开 Auth,所以不写;ChatRedis 段已删。

# etcd 注册路径 <Prefix>/zone/<z>/... 用的 zone id;必填非 0。chat 是全局服务,
# zone 只影响注册路径,业务代码禁止读它做分支(契约 §0)。K8s 由 ConfigMap 注入 CurrentZoneId。
ZoneId: 1

# etcd 节点注册租约 TTL(秒)= 崩溃场景的切换窗口(路由服 PickRandom 不看连接状态)。
LeaseTTL: 60

# Prometheus /metrics。端口分工:9101 login / 9150 scene_manager / 9160 db / 9170 match /
# 9180 friend / 9190 player_locator / 9200 路由服 / 9210 chat。置空关闭。
# 指标:chat_send_total{channel,outcome} / chat_pull_total{channel,outcome},
# 以及 shared/serverbase 的 rpc_inband_*、shared/killswitch 的 killswitch_blocked_total。
MetricsListenAddr: ":9210"

# ---- 聊天阈值(契约 §3/§9;k8s_deploy.ps1 用 Get-AuthoritativeScalar 从本文件读)----
# 单条内容最大字节数(不是字符数:512 字节 ≈ 170 个汉字)。gate 对整包 >1024B 先拒一道。
MaxContentBytes: 512
# 每玩家每秒最多发几条(gate 每会话每消息号 3 次/秒是第一道)。
RateLimitPerSecond: 5
# 同一名玩家相邻两条世界频道消息的最短间隔(毫秒),0 = 不限;只管世界频道。世界频道一条消息要推给全服在线玩家,
# 这个间隔把全服世界消息量压在「在线人数 ÷ 间隔」之内。K8s ConfigMap 逐字镜像这一行。
WorldChannelCooldownMs: 5000
# 每个SQL频道窗口最多可见的最近条数。
HistoryMaxEntries: 200
# 频道闲置窗口TTL(秒)，保持每次接受续期语义；显示过期不删除原UUID收据。原件本身保留 30 天后由库删除(TiDB TTL),
# 所以本值最大 2505600(29 天)。
HistoryTTLSeconds: 604800
# PullChatHistory.limit=0 时的默认条数与上限。
# HistoryMaxLimit最多200；HistoryMaxEntries可独立增大容量，一次读取仍最多200。
HistoryDefaultLimit: 20
HistoryMaxLimit: 50
# 旧配置兼容字段；SQL成功幂等收据随原件保留 30 天，此值不控制删除。
RequestIdTTLSeconds: 60

# RPC 级热关停(shared/killswitch)规则在 etcd 里的前缀。
# 留空 = 用默认前缀 /mmorpg/killswitch/,且前缀下没有 key 时全部放行。
# 关停发言:etcdctl put /mmorpg/killswitch/chatpb.ClientPlayerChat/SendChat '{"deny":true,"reason":"..."}'
# 关停整个服务:etcdctl put /mmorpg/killswitch/chatpb.ClientPlayerChat/'*' true
# 恢复:etcdctl del 对应的 key。
KillSwitchPrefix: ""
