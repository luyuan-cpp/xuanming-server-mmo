# 聚宝斋 trade 服务配置(docs/design/jubaozhai-market.md;契约 microservice-zone-contract-20260914 §2/§3/§4/§7;D-14)
# 全局服务:全服一份、多副本;客户端只经 gate → 路由服到达(路由模式)。
# 本文件的键名与 internal/config/config.go 的 json tag 逐字一致;k8s_deploy.ps1 的 trade ConfigMap 里写出来的键也逐字一致,
# ConfigMap 已镜像完整 AssetOp / Commerce / Mall 参数；生产要求显式 TiDB 地址、global 和资产通道。
# 本地 dev 的旧只读目录配置不代表全球交易已启用；细节见 internal/config/config.go 包头注释。
Name: trade.rpc
ListenOn: 127.0.0.1:50800

# zrpc 服务端整体超时(毫秒)。必须 ≤ 路由服 ForwardTimeoutMs(5000)− 1000(契约 §3),
# config.Validate 拒绝 <1000 与 >4000。
# 逻辑层整请求 I/O 预算 = Timeout − 500ms(config.InBandReplyReserve):依赖变慢时先在预算内
# in-band 回 kServiceUnavailable,不让 go-zero 超时拦截器抢先回 DeadlineExceeded(P1-9)。
Timeout: 4000

# go-zero 的 Mode 默认是 pro。TradeAdmin.SeedListing 只在 dev / test 下可用,本地必须显式写 dev,
# 否则 robot trade-smoke 播种会得到 PermissionDenied。K8s 非 dev 档由 ConfigMap 固定为 pro。
Mode: dev

# etcd:只给 shared/noderegistry 注册 TradeNodeService.rpc/... 与 shared/killswitch 用。
# Key 必须显式写空串(契约 D-13):不能整行省略(go-zero EtcdConf.Key 非 optional),
# 填了 Key 会让 go-zero 额外注册 trade.rpc。config.Validate 拒绝非空 Key。
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: ""

# etcd 注册路径 <Prefix>/zone/<z>/... 用的 zone id;必填非 0。trade 是全局服务,
# zone 只影响注册路径,业务代码禁止读它做分支(契约 §0)。
# ⚠ 顶层唯一一处 ZoneId,且必须写在任何嵌套段之前:go_services.ps1 -Zone 只改写文件里第一处 ZoneId。
ZoneId: 1

# etcd 节点注册租约 TTL(秒)= 崩溃场景的切换窗口(路由服 PickRandom 不看连接状态)。
LeaseTTL: 60

# Prometheus /metrics。端口分工:9210 chat / 9220 guild / 9230 trade。置空关闭。
# 必须是顶层单行:-Zone 的端口位移正则只认这个形状。
# 指标:trade_home_zone_lookup_total{result} / trade_seed_listing_total{result},
# 以及 shared/serverbase 的 rpc_inband_*、shared/killswitch 的 killswitch_blocked_total。
MetricsListenAddr: ":9230"

# RPC 级热关停(shared/killswitch)规则在 etcd 里的前缀。
# 留空 = 用默认前缀 /mmorpg/killswitch/,且前缀下没有 key 时全部放行。
# 关停浏览:etcdctl put /mmorpg/killswitch/trade.ClientPlayerJubaozhai/BrowseListings '{"deny":true,"reason":"..."}'
# 关停整个客户端服务:etcdctl put /mmorpg/killswitch/trade.ClientPlayerJubaozhai/'*' true
# 恢复:etcdctl del 对应的 key。
KillSwitchPrefix: ""

# ---- 独占库 mmorpg_trade(D-14 第 1、5 条)----
# 库由 deploy/mysql-init/00_init_zone_dbs.sql 预建(存量卷需手工执行那两行);表由 schemamigrate 按
# proto/trade/trade_table.proto 建。DBName 必须等于代码常量 mmorpg_trade(config.Validate 断言)。
# 本地凭据与 go/data_service/etc/data_service.yaml 的 SnapshotMySQL 同账号;K8s 由 ConfigMap 注入。
MySQL:
  Host: 127.0.0.1:3306
  User: appuser
  Password: apppass123
  DBName: mmorpg_trade
  MaxOpenConn: 20
  MaxIdleConn: 5

# 建表策略(D-14 第 4 条):
#   AutoMigrate 不写或 false:常驻启动只核对；表由独立 -migrate 预建。
#     出错或出现需人工项(类型漂移 / 缺主键)即拒绝启动。
#   false:启动时只跑一次只读 plan,有待执行语句或需人工项就拒绝启动,并打印补救命令
#     trade -f etc/trade.yaml -migrate
# K8s 非 dev 档由 ConfigMap 固定 false,表由 trade-migrate Job 建。
Schema:
  AutoMigrate: false

# data_service 客户端:查玩家 home_zone(BatchGetPlayerHomeZone)与领 listing_id 号段(AllocateIdSegment)。
# 无条件拨号,是 P1 的硬依赖。这里写 Key: dataservice.rpc 不违反 D-13:D-13 禁止的是指向**全局服务**的
# RpcClient Key,data_service 按 zone 部署(port-decisions D-13 原文)。
# -Zone N 时本行会被改写为 dataservice.rpc.zN,连本 zone 的 data_service;映射存储是全局 Redis,行为等价。
DataServiceRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: dataservice.rpc
  Timeout: 3000
  NonBlock: true
  Middlewares:
    Breaker: false

# listing_id 号段(shared/idsegment.Conf,biz_tag = trade_listing)。
# Enabled 必须 true、FallbackToSnowflake 必须 false:trade 没有 snowflake 可回退,号段失败即本次上架失败。
# biz_tag 必须登记进 data_service 的 BootstrapTags,否则生产(AllowAutoSeed=false)发号被拒。
IdSegment:
  Enabled: true
  Step: 100
  MinStep: 10
  MaxStep: 1000
  FallbackToSnowflake: false

# 市场参数(设计 §3/§8)。
#   Scope: zone   浏览 / 详情 / 收藏按调用者 home_zone 过滤,别区商品对调用者"不存在",zone_filter 被忽略;
#          global 全服可见,zone_filter≠0 时按它过滤。
#   页长上限 20;页码上限 100(防深分页扫表);每玩家收藏上限 100(软上限,见 SetFavorite 注释)。
Market:
  Scope: zone
  DefaultPageSize: 20
  MaxPageSize: 20
  MaxPage: 100
  MaxFavoritesPerPlayer: 100

# 共享单库 Redis(与 C++ scene / scene_manager 同一实例)。通用资产通道(guild-phase2/04-asset-channel.md §S4)在这里:
#   读位置键 player:{id}:location —— scene_manager 写,值是 PlayerLocation protobuf;据此定位玩家所在 scene 节点,
#     再直连该节点的 SceneNodeGrpc 调 AssetDebit / AssetCredit / AssetAbortDebit;
#   订阅落地唤醒频道 assetop:wake(scene 发布),另写唤醒去重键 assetop:wake:trade:{id}
#     与维护选主锁 trade:assetop:maintenance:leader。
#
# 段名不能改成 Redis:go-zero 的 zrpc.RpcServerConf 已经有同名字段,加载期会报 conflict key Redis。
# DB 必须是 **0**(位置键所在库);指到别的实例或别的库 = 永远找不到人 = 托管 / 交付永远悬挂,
# 所以 config.Validate 拒绝空 Host。
SharedRedis:
  Host: 127.0.0.1:6379
  Password: ""
  DB: 0
  # go-redis 连接池上限(P0-E 第 3 批,共享 Redis 连接总账)。0 / 不写 = go-redis 缺省 10 × GOMAXPROCS,
  # 随 CPU limit 漂移(本机 Windows 上是 10 × 核数);负数 config.Validate 拒启。20 = K8s 上 GOMAXPROCS 按 2 时的缺省值。
  # 落地唤醒的 Pub/Sub 连接不占池名额。tools/scripts/k8s_deploy.ps1 把它镜像进 trade ConfigMap(要求正整数),
  # Redis 连接总账读同一个键:改它看部署时打印的 "Redis connection ledger" 一行。
  PoolSize: 20

# ---- 通用资产通道开关(guild-phase2/04-asset-channel.md §S4)----
# **默认关闭,整段缺失也是关闭**(go-zero 不给缺席的 optional 嵌套段回填 default)。
# 这是代码级的默认拒绝:一份配置被抄到预发 / 生产时,少抄这一段的结果是"通道关着",
# 不是"通道悄悄开着"。本地默认也保持 false —— 抄走这份文件同样带不走一个打开的开关。
#
# 关闭时:不拨上面的 SharedRedis、不建 scene 节点镜像、不起 outbox 重投循环;
#         浏览 / 详情 / 收藏照常,上架托管与交付一律以错误返回。
# 打开时:Enabled 改 true,并确保本进程环境里有 SecretEnv 指定的那把密钥 ——
#         缺失或去空白后不足 32 字节 → **trade 拒绝启动**(fail-closed,不降级)。
#
# 密钥**只从环境变量读**,绝不写进本文件 / ConfigMap / 仓库(§4.32):
#   本机 dev:先跑 tools/scripts/start_game.ps1(或 cpp_nodes.ps1 -Command start),
#            它会生成并注入 MMORPG_ASSET_OP_SECRET_GUILD / _TRADE,值落在 gitignore 的
#            run/secrets/assetop-dev.env,首次生成后复用,scene 与 Go 服务共用同一把;
#   预发 / 生产:必须由部署侧注入(≥32 字节,且不得与其它密钥相同,§4.43 第 29 项)。
# `Secret` 是保留键:写了任何值都会被 config.Validate 当场拒启,免得密钥被静默忽略后
# 留在仓库和 ConfigMap 里。
#
# 规格 90-consistency.md 的 Y-06 还要求 8 个重投循环字段(ReconcileIntervalMs / ReconcileBatch / Workers /
# LeaseMs / OpBudgetMs / MaxBackoffMs / PoisonDelayMs / LedgerReadMinAttempts),**仍未接线**,所以不在这里写 ——
# 写了也不会生效,而"改了没反应的配置"比没有配置更难查。当前值由 internal/reconcile 的常量固定(§4.37)。
#
# 落地恢复(docs/design/landing-recovery-sync-digest.md §6.4)的键**已接线**,与 guild 的 AssetOp 段同名同默认
# (默认值的事实源是 shared/assetop.DefaultLoopConfig 与 shared/assetopwake 的 Default*):
#   停放档 / 自动放弃 / 日对账 / 落地唤醒只在 Enabled=true 时生效与校验;
#   终态行清理(Cleanup*)与 Enabled 独立(同 guild):通道关着时历史终态行照样要清。
# 日对账与自动放弃由多副本里经 Redis 选主(SharedRedis 上的 trade:assetop:maintenance:leader)选出的一个副本执行;
# 落地唤醒订阅 SharedRedis 上的 assetop:wake 频道(scene 在玩家进场完成时发布)。
#
# 键名与 internal/config/config.go 的 json tag 逐字一致。k8s_deploy.ps1 的 trade ConfigMap 只镜像 Enabled(所有档位固定 false)
# 与 SecretEnv,下面的落地恢复与 Cleanup* 键刻意不镜像:Enabled 固定 false 时落地恢复参数没有消费者;CleanupEnabled 在 K8s 上
# 缺省 false(通道从未开过,没有行可清)。打开 K8s 通道时要把这些键连同 Enabled=true 一起补进 ConfigMap。
AssetOp:
  Enabled: false
  SecretEnv: MMORPG_ASSET_OP_SECRET_TRADE
  # 资产 SQL 提交证据开关(docs/design/db-write-fencing-mysql.md §6.6 / §8.7)。不写或 false = HEAD 口径:在线按 scene
  # 回包的 durable 终结,离线读账本与自动放弃读 Redis 父键 blob。true = 终结只认 go/db 发布的 SQL 提交证据,
  # 自动放弃要 blob 与证据都确认未见。
  # !! trade 是全服服务:只有它会投递到的 zone 全部已切 go/db Fencing.Mode=dual、已上新版 C++,并观察到证据在持续发布
  # 之后才打开;打开前接受「已离线、尚无证据的玩家待办要等他再次存盘」。下面 Commerce 白名单或 Mall.URL 非空时
  # 必须打开(合同终结只认 SQL 证据,config.Validate 拒启)。回退顺序:先改回 false,再把 zone 切回 legacy 或回退 C++。
  RequireSQLCommit: false
  # 离线停放档(§6.1):连续投递 5 次仍"玩家没有位置"的行改为约 30 分钟一次(±20%),玩家上线由落地唤醒立刻处理。
  # OfflineAfterAttempts=0 关闭停放档;OfflineBackoffMs 必须在 [60000(重投退避封顶), 86400000] 内。
  OfflineAfterAttempts: 5
  OfflineBackoffMs: 1800000
  # 自动放弃(§6.3):PENDING 超过 180 天、玩家无位置、距最后一次可能的发送超过 1 小时、已落盘账本确认 scene 从未见过,
  # 才终结为 ABANDONED。0 = 关闭;非 0 时 ≥ 30。trade 的对侧账尚未实现(P3),放弃只终结并留痕,
  # 且只处理 TRADE_DEBIT(上架托管)行;TRADE_CREDIT(交付 / 回退)在对侧账落地之前一律不放弃(data.AssetOpRepo 存储层拦)。
  # **滚动升级**:新二进制全量上线之前必须写 0(旧实例的发送不推进 last_send_ms),全量之后再改回 180。
  AbandonAfterDays: 180
  AbandonSafetyGapMs: 3600000
  AbandonBatch: 200
  AbandonIntervalMs: 3600000
  # 日对账(§6.2,只读):每 24 小时把 PENDING 行按 online_retry / offline / alert / abandon_candidate 计数,
  # 刷 assetop_pending_rows{class} 与 assetop_pending_class_oldest_age_seconds{class}。0 = 不跑。
  AuditIntervalMs: 86400000
  # 落地唤醒订阅(§5.3),键与默认值同 guild 的 AssetOp.Wake:订阅 SharedRedis 上的 assetop:wake,玩家进场完成后
  # 立即重投他的 PENDING 行,不再等退避 / 停放档。唤醒只是提示,丢了退回原退避,只慢不错。
  # Enabled 不写 = 开;Concurrency 不写 = 4([1, 64],满了直接丢);TimeoutMs 不写 = 10000
  # (必须大于单行预算 2500ms:写 0 或 [5000, 60000])。跨副本去重窗口固定 5 秒(对齐 scene 的合并窗口),不开放配置。
  Wake:
    Enabled: true
    Concurrency: 4
    TimeoutMs: 10000
  # 终态行清理(每个副本都跑,删除幂等,PENDING 与 APPLIED_PARTIAL 永不删;ABANDONED 与其它终态一样 30 天后删)。
  CleanupEnabled: true
  CleanupIntervalMinutes: 10
  TerminalRetentionDays: 30

# 发布前配置真实服务端白名单与可读名称；空名单拒绝交易任何模板。
Commerce:
  ItemConfigs: []
  ItemTitles: {}
  PetConfigs: []
  CurrencyTypes: []
  AllowInstances: false
Mall:
  URL: ""
  GatewaySecretEnv: COMMERCE_GATEWAY_SECRET
  DeliverySecretEnv: COMMERCE_DELIVERY_SECRET

# 全局角色目录与交易表必须位于同一TiDB集群；不是玩家分片库。
AccountRoleSchema: testdb
Rmb:
  Enabled: false
  GlobalLoginSessions: false
  LoginRedis:
    Host: ""
    DB: 0
    PoolSize: 8
  # 默认仅金币0；钻石1需显式开启；绑定币2永远禁售。
  CurrencyTypes: [0]
