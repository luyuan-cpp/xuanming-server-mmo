# Guild Service Configuration
Name: guild.rpc
Mode: dev
AccountRoleSchema: mmorpg_global
# 同主TiDB连接池跨库只读核验真实Match/Team表；缺表或配置缺失拒启。
MatchAuthoritySchema: mmorpg_match
# 必须指向login实际使用的同一全局实例/DB；不能按gateNodeId猜zone或回退本地缓存。
GlobalLoginSessions: true
LoginRedis:
  Addrs: [127.0.0.1:6379]
  Password: ""
  DB: 0
  PoolSizePerNode: 8
ListenOn: 127.0.0.1:50300
# zrpc 服务端整体超时(毫秒):≤ 路由服 ForwardTimeoutMs(5000)− 1000 = 4000
# (docs/design/guild-phase2/00-contract.md §2)。另须 ≥ DataServiceRpc.Timeout + 1500(归属区查询)
# + 500(回包余量);config.Validate 强制。
Timeout: 4000

# 每玩家的入帮申请尝试配额：固定 60 秒，重复刷新和业务拒绝也消耗；有效范围 1–600。
# Redis 配额故障时放行并计 error；SQL 内的申请数量与成员上限仍严格校验。
ApplicationQuotaPerMinute: 10

# 刻意不写 go-zero 的 Etcd.Key(port-decisions D-13):guild 是全局服务,客户端经 gate → client_rpc_router
# 按 GuildNodeService.rpc/ 前缀的 NodeInfo 找到它(internal/node),没有任何 Go 服务按 go-zero key 发现 guild;
# 写了反而会被本地 go_services.ps1 -Zone 加上 .z<N> 后缀,把同一个全局服务切成按 zone 的碎片。

# Global Redis (not per-zone — guilds are cross-zone)
# 三段 Redis 的 PoolSize 是各自 go-redis 连接池上限(P0-E 第 3 批):0 / 不写 = go-redis 缺省 10 × GOMAXPROCS,
# 随 CPU limit 漂移(本机 Windows 上是 10 × 核数);负数 config.Validate 拒启。20 = K8s 上 GOMAXPROCS 按 2 时的缺省值。
# guild 现在没有 K8s 清单、不进共享 Redis 连接总账;接入 K8s 时要在 tools/scripts/k8s_deploy.ps1 镜像这三个键并记账。
# DB 用 0(2026-10-23 由 2 改为 0,上线前改、不搬数据):Redis Cluster 只有 DB 0,guild 私有键都带
# guild: / guild_rank: / player_guild: 前缀,与共享库 DB 0 上的其他键族不冲突(shared-redis-split-by-purpose.md §25.3)。
RedisClient:
  Host: 127.0.0.1:6379
  Password: ""
  DB: 0
  PoolSize: 20

# 控制域:assetop:wake 频道(scene 发布,AssetOp.Wake 订阅)与它的跨副本去重键。玩家键已移到下面的 PlayerRedis。
PlayerLocatorRedis:
  Host: 127.0.0.1:6379
  Password: ""
  DB: 0
  PoolSize: 20

# 玩家域 Redis(docs/design/redis-player-store-cluster.md §5.7、§5.8):会话、位置、战斗锁、同步摘要。
# 不写 Addrs = 指向上面的 PlayerLocatorRedis 实例。集群部署写种子地址并打开 Cluster:
#   Addrs: [127.0.0.1:7000, 127.0.0.1:7001, 127.0.0.1:7002]
#   Cluster: true
# PoolSizePerNode 是每个节点的连接池上限,单实例即总上限。落地恢复摘要另有固定 4 条的专用池。
PlayerRedis:
  PoolSizePerNode: 20

# ---- 独占库 mmorpg_guild(D-14 §1/§5,§8 已修订)----
# 库由 deploy/mysql-init/00_init_zone_dbs.sql 预建(存量卷需 root 手工执行那两行);表由 go/schemamigrate
# 按 proto/guild/guild_db.proto 建。DSN 库名必须是 mmorpg_guild(config.Validate 断言)。
# 账号用 appuser(与 go/trade/etc/trade.yaml 同账号,只对独占库有 ALL 权限)。
MySQL:
  # 角色归属与帮会资产共用同一事务域。后端档位 tidb | mysql,不写就是 tidb;mysql 档必须连主库。
  Backend: tidb
  DataSource: "appuser:apppass123@tcp(127.0.0.1:3306)/mmorpg_guild?charset=utf8mb4&parseTime=true&loc=Local"
  # 连接池上限(每个副本)。不写 = 20 / 5;MaxIdleConn ≤ MaxOpenConn。K8s ConfigMap 从这两个键镜像,
  # MySQL 连接总账(k8s_deploy.ps1 Get-MysqlConnectionLedger)按 MaxOpenConn × 副本数记账。
  MaxOpenConn: 20
  MaxIdleConn: 5

# 建表策略(D-14 §4):不写或 true = 启动时 schemamigrate.Up(GET_LOCK 串行,锁忙重试 3 次);
# false = 只跑只读 Plan,不干净就拒绝启动,并提示 `guild -f etc/guild.yaml -migrate`。K8s 非 dev 档固定 false。
Schema:
  AutoMigrate: false

Node:
  ZoneId: 1
  # LeaseTTL(秒):与 chat / client_rpc_router / data_service / login / match / player_locator /
  # scene_manager 对齐成 60。原值 500 来自 2025-09 的 5575b505f,没留取值理由。
  # 它决定的是**非优雅死亡**后 etcd key 的滞留时长:500 意味着崩溃的实例在服务发现里挂 8 分多钟,
  # 期间路由服仍会把客户端请求投给它。丢租约后 node.go:246 的 watchKeepAlive 会走 reRegister 重新注册,
  # 所以缩短 TTL 不会让活着的实例掉出注册表。
  LeaseTTL: 60

Registry:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    DialTimeout: 5s

Cache:
  DefaultTTL: 30m
  MaxMembers: 500

Kafka:
  Brokers:
    - "localhost:9092"

# DataService gRPC client (discovered via etcd,与 login 的 PlayerLocatorRpc 同一写法)。
# guild 用它查角色归属区(GetPlayerHomeZone)、读合服映射(GetMergedZones)及领取 guild_id 号段(AllocateIdSegment)。
# 配置目标即拨号,IdSegment.Enabled=false 只关闭号段发号,不关闭归属区查询。
# NonBlock: true —— 建客户端不等 data_service。启动时读合服映射会等它,最多 60 秒,读不到拒绝启动;
# 起来之后 data_service 不可用只影响当时的请求:合服映射继续用旧值,领段失败即拒绝建帮。
DataServiceRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: dataservice.rpc
  # 单次 data_service 调用上限(归属区查询 / 领号段)。与 Timeout 的预算关系见上;Validate 强制 [500, 3000]。
  Timeout: 2000
  NonBlock: true
  Middlewares:
    Breaker: false

# guild_id 号段发号(docs/design/node-id-overhaul-plan-20260908.md §6)。
# Enabled:**只有显式写 true 才开**;整块不写 = 关 = 发不出 id,建帮一律失败。
# Step:**初始**领段长度;之后按 Leaf 口径动态调整 —— 一段不到 15 分钟用完则下次翻倍,
#   超过 30 分钟则减半,夹在 [MinStep, MaxStep] 内(缺省 [10, 1000])。每天重启一次时浪费
#   最多两段(当前段 + 预取段),动态 step 把它压到最小;双 buffer 意味着库倒下后还能发完两段。
# 号段失败即建帮失败(tip kGuildIdGenUnavailable),没有回退:发号打散之后与 snowflake 的值域不再不相交。
IdSegment:
  Enabled: true
  Step: 100
  MinStep: 10
  MaxStep: 1000

# ---- 帮会资产通道(B5b,docs/design/guild-phase2/05-economy.md §5.29;循环参数见 90-consistency.md Y-06)----
# 捐献扣货币、商店兑换发物品都经这条通道投给玩家所在的 scene(AssetDebit / AssetCredit)。
#
# Enabled:**只有显式写 true 才开**;整段不写 = 关(代码默认 false,fail-closed)。关着时捐献 / 兑换
#   一律回 kGuildAssetPending、不生成指令,升级与两个读接口照常。本地 dev 打开;共享 / 预发 / 生产必须先满足
#   08-save-owner-fence.md §8.3 的六条门禁,K8s ConfigMap 是否打开由 BK8s 批次决定,不满足门禁一律 false。
# 签名密钥**只**从环境变量 MMORPG_ASSET_OP_SECRET_GUILD 读,本段没有、也不许加存放密钥的键:
#   本机由 tools/scripts/go_services.ps1 / start_game.ps1 从 run/secrets/assetop-dev.env 注入(与 scene 验签同一把);
#   Enabled=true 而缺密钥、或去首尾空白后短于 32 字节,启动即拒绝。
# 玩家定位读的是上面 PlayerRedis 里的 player:{id}:location:它必须与 scene / scene_manager 写这把键的是
#   同一个存储域。指错的表现是所有玩家"不在线"、指令永远 PENDING,且不报错。
# 另依赖 IdSegment.Enabled=true 与 DataServiceRpc:op_id 由号段 biz_tag=guild_asset_op 发,无 snowflake 回退
#   (config.Validate 强制)。
AssetOp:
  Enabled: true
  # 重投循环节律。Workers 是**每个副本**同时压向 scene 的资产 RPC 上限(资产 RPC 在 scene 的 EventLoop 上同步执行,
  # 调大会挤占逻辑帧,见 assetop.LoopConfig.Workers 注释),扩副本或调大前先复核;ReconcileBatch 必须 ≥ Workers。
  ReconcileIntervalMs: 2000
  ReconcileBatch: 100
  Workers: 8
  # 行级租约,必须 ≥ OpBudgetMs + 2000。捐献 / 兑换插行时也用它当"提交后同步投递期间循环看不见这一行"的时长,
  # 所以还必须满足 LeaseMs + ReconcileIntervalMs < 配表 GuildRule.asset_op_deadline_seconds(启动期校验)。
  LeaseMs: 10000
  # 单行预算(同步投递与重投共用),其中 700ms 固定留给落库。
  OpBudgetMs: 2500
  # 退避封顶,也是 scene 回 UNKNOWN 的行的重排间隔;退避基数在配表 GuildRule.asset_op_retry_base_ms,不得大于本值。
  MaxBackoffMs: 60000
  # payload 解不开的毒行推迟多久再看。
  PoisonDelayMs: 3600000
  # 连续几次投不出去之后才读已落盘账本(B5d 接上 Ledger 之前不生效)。
  LedgerReadMinAttempts: 3
  # 终态行 / 过期计数行清理(goroutine guild.asset_op_cleanup,每个副本都跑,删除幂等,PENDING 与
  # APPLIED_PARTIAL 永不删)。TerminalRetentionDays 同时是 B5d 回档检查可追溯窗口的下界,调小前先看
  # 07-rollback-fail-closed.md §7.4.2。
  CleanupEnabled: true
  CleanupIntervalMinutes: 10
  TerminalRetentionDays: 30
  CounterRetentionDays: 30
  # ---- 落地恢复(docs/design/landing-recovery-sync-digest.md §5.3 / §6)----
  # 离线停放档:本次结局是本地 NOT_HERE、位置键不存在、且已投递 ≥ OfflineAfterAttempts 次,下一次投递推到约
  #   OfflineBackoffMs(±20% 抖动)之后;玩家上线由下面的落地唤醒立即重投。OfflineAfterAttempts 写 0 = 关闭停放档。
  #   OfflineBackoffMs 必须 ≥ MaxBackoffMs、≤ 86400000。
  OfflineAfterAttempts: 5
  OfflineBackoffMs: 1800000
  # 自动放弃(ABANDONED):PENDING 超过 AbandonAfterDays 天、玩家无位置、距最后一次可能的发送超过 AbandonSafetyGapMs、
  #   已落盘账本确认 scene 从未见过这条 seq 时终结,对侧账同 REJECTED / ABORTED(捐献退次数、兑换退帮贡与限购、
  #   活动发奖作废只留审计行)。不可逆:AbandonAfterDays 写 0 = 关闭,非 0 时 ≥ 30。
  # !! 滚动升级:旧版实例的发送不推进 last_send_ms。从不认识 last_send_ms 的旧版本升级时,先把 AbandonAfterDays 写 0
  #   全量上线新二进制,确认没有旧实例在跑之后再改回 180(设计 §6.3「滚动升级」)。本项目尚未上线,首发直接开启。
  # 另需 DataServiceRpc(离线读账本;Enabled=true 时 config.Validate 已强制),缺了放弃不运行(只打一条 INFO)。
  # 「玩家无位置」只看上面 PlayerRedis 里的 player:{id}:location 是否存在,不依赖 scene 节点镜像(etcd):
  #   etcd 缺失或镜像未同步时,有位置记录的玩家投递发不出去、行留在 PENDING,但放弃仍按其余条件照常进行。
  #   要停掉放弃只能把 AbandonAfterDays 写 0。
  # AbandonSafetyGapMs ≥ 600000 且 ≥ LeaseMs;AbandonBatch 是每轮候选上限 [1, 1000];AbandonIntervalMs ∈ [60000, 86400000]。
  AbandonAfterDays: 180
  AbandonSafetyGapMs: 3600000
  AbandonBatch: 200
  AbandonIntervalMs: 3600000
  # 日对账(只读):把 PENDING 行分成 online_retry / offline / alert / abandon_candidate 四类,刷新
  #   assetop_pending_rows 与 assetop_pending_class_oldest_age_seconds。写 0 = 不跑;非 0 时 ∈ [60000, 604800000]。
  # 对账与放弃只在选主当选的一个副本上跑(锁 guild:assetop:maintenance:leader 在上面的 RedisClient 里)。
  AuditIntervalMs: 86400000
  # 落地唤醒:订阅核心 Redis(上面的 PlayerLocatorRedis,scene 在同一实例上 PUBLISH assetop:wake <player_id>),
  #   玩家进场完成后立即重投他的 PENDING 行,不再等退避 / 停放档。唤醒只是提示,丢了退回原退避,只慢不错。
  # Enabled 不写 = 开;Concurrency 不写 = 4([1, 64],满了直接丢);TimeoutMs 不写 = 10000(必须 ≥ 2 × OpBudgetMs、≤ 60000:
  #   唤醒先列出该玩家的未决行,剩余预算够一整个 OpBudget 才领下一行,下界再小就会一行不领、静默退化)。
  Wake:
    Enabled: true
    Concurrency: 4
    TimeoutMs: 10000

# ---- 帮会同道历练(B6b,docs/design/guild-phase2/06-activities.md §6.22)----
# 确认开战:邀请房间全员同意后,guild 调 match 内部服务 MatchInternal.StartActivityBattle 拿 battle_id。
# 整段删掉 = 历练未开放(视图显示未开放、两个历练写接口回 GuildActivityNotOpen);灯会 / 团圆不受影响。
# 本地 go_services.ps1 -Zone N 会把 Key 改成 matchservice.rpc.zN,guild 只连该 zone 的 match;匹配池全局共享,不影响功能。
# NonBlock:match 是弱依赖,它没起时 guild 照常起服,开战回 GuildTrialServiceBusy(tip,不是 gRPC 错误);
#   代码里建客户端时也会强制 NonBlock,这里显式写出只为所见即所得。
# Timeout:单次调 match 的上限(毫秒),config.Validate 强制 [300, 2000],越界拒绝启动。
#   实际预算 = min(Timeout, 本次请求的剩余时间 − 500ms),不足 300ms 就不调 match、直接回 GuildTrialServiceBusy;
#   所以 Timeout 本身小于 300 等于"每次开战都不调 match",历练看着开放却永远开不了战 —— 下限就是为了挡住它。
MatchRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: matchservice.rpc
  Timeout: 1500
  NonBlock: true
  Middlewares:
    Breaker: false

# 历练的后台节律与对局结果消费。
#   TrialResultOverdueSeconds:对局登记多久后仍无结果,巡检器去读 MatchAuthoritySchema 库的 SQL 终局(match_battle_completion)兜底。
#   TrialAbandonSeconds:多久后仍无结果也无终局则判 EXPIRED(迟到的结果仍可结算);必须 ≥ 上一项 + 600,≤ 604800(7 天)。
#   TrialSweepIntervalSeconds:巡检间隔 [10, 600];多副本靠全局 Redis 的 guild:trial:sweep:lease 互斥。
#   OwedLoopIntervalSeconds:待入队物品循环间隔 [1, 60](结算时未决指令已满者的物品,等窗口有空位再入队)。
# 战斗锁读的是上面的 PlayerLocatorRedis:它必须与 scene 的 zone Redis(K8s 的 SharedRedis)**同一实例同一 DB**。
Activity:
  TrialResultOverdueSeconds: 420
  TrialAbandonSeconds: 3600
  TrialSweepIntervalSeconds: 60
  OwedLoopIntervalSeconds: 10
  # 结果消费:**只有显式写 Enabled: true 才开**;不写这一段、或没配上面的 Kafka.Brokers = 不消费 = 历练未开放
  # (没有结算就不许开战)。Topic / Partitions 必须与 match 的 ResultTopic / ResultTopicPartitions 相同。
  TrialResult:
    Enabled: true
    Topic: match-results
    Partitions: 3
    # 刻意不加引号:go_services.ps1 -Zone 只给带引号的 GroupID 加 _zN。
    # guild 是全局服务、match-results 是全局 topic,本地多个 guild 进程必须同组分摊分区,而不是各组各跑一遍结算。
    GroupID: guild-trial

# RPC 级热关停(shared/killswitch)规则在 etcd 里的前缀。
# 留空 = 用默认前缀 /mmorpg/killswitch/,且前缀下没有 key 时全部放行。
# 关停某个方法:etcdctl put /mmorpg/killswitch/guildpb.GuildService/CreateGuild '{"deny":true,"reason":"..."}'
# 关停整个服务:etcdctl put /mmorpg/killswitch/guildpb.GuildService/'*' true
# 恢复:etcdctl del 对应的 key。
KillSwitchPrefix: ""

# 部署级集群号(snowflake worker 段的 cluster 位,0..31)。运维按集群一次性设定,策划不碰;
# 单集群 / 存量布局保持 0。两个集群共用一个 etcd 也不撞号。
ClusterId: 0

# snowflake 槽位本地缓存目录:etcd 启动时不可达、缓存在 2h 内则用缓存的槽起服。留空关闭。
SnowflakeCacheDir: ../../run/snowflake

# Prometheus 抓取端点,由 go-zero core/service 自带的 agent 暴露(不要另起 promhttp)。
# 端口分工:login 9101 / scene_manager 9150 / db 9160 / friend 9180 / player_locator 9190 /
# client_rpc_router 9200 / chat 9210 / guild 9220(原 9170 与 match 撞号,本机同时起两者时后起者的
# /metrics 绑不上)。dev 下绑 127.0.0.1,避免指标泄到本机以外;
# staging/prod 改绑 0.0.0.0 让 Prometheus / Grafana 抓得到。
# 留空 Host 即彻底关闭 /metrics(go-zero 的 StartAgent 直接 return)。
#
# 除 go-zero 自带的 rpc_server_* 外,本服务还暴露 shared/serverbase 的一组指标:
#   rpc_inband_fault_total{method,source,code}  - 响应体业务码判定为服务端故障
#   rpc_inband_reject_total{method,source}      - 正常业务拒绝(公会满、非会长……)
#   rpc_inband_unknown_code_total{method,source}- 码表漂移信号,正常应恒 0
#   rpc_duration_seconds{method,status}         - 把 in-band 定性算进去的耗时/成功率
# 以及 shared/safego 的 safego_panic_total{point}(压测期应恒 0)。
Prometheus:
  Host: 127.0.0.1
  Port: 9220
  Path: /metrics
