Name: rank.rpc
ListenOn: 127.0.0.1:51100
AdvertiseHost: 127.0.0.1
Mode: dev
Timeout: 3500
ZoneId: 1
Etcd:
  Hosts: [127.0.0.1:2379]
MetricsListenAddr: 127.0.0.1:9250
DSNEnv: MMORPG_RANK_SQL_DSN
Backend: tidb
MaxOpenConns: 16
AutoMigrate: false
TableDir: ../../generated/tables
DataServiceRpc:
  Endpoints: [127.0.0.1:9000]
  Timeout: 2000
MailRpc:
  Endpoints: [127.0.0.1:50900]
  Timeout: 1800
MailSecretEnv: MAIL_PRODUCER_SECRET_RANK
# 必须与 go/mail/etc/mail.yaml 的 Mail.MaxPersonalMailTtlDays 同值(rank 读不到邮件配置;config_test.go 核对两份)。
# 封榜写出的奖励邮件过期时刻 = 封榜 + min(30 天, 本值),写定后不随配置变化;越出 2~365 拒启(发件时至少剩 24 小时可领,1 天发不出)。改邮件有效期时两边同批改。
MailMaxPersonalMailTtlDays: 30
Producers:
  match: RANK_PRODUCER_SECRET_MATCH
  admin: RANK_PRODUCER_SECRET_ADMIN
Log:
  ServiceName: rank
  Mode: console
  Level: info

KillSwitchPrefix: /mmorpg/killswitch/

# 链路追踪阶段三(docs/design/distributed-tracing.md §10.3):go-zero 把 span 经 OTLP/gRPC 送本机 Alloy
# (deploy/docker-compose.observability.yml,dev.bat obs 起),Alloy 尾部采样后存进 Tempo。Name 与 Loki 的 service 标签同值。
# 头部全采(Sampler 1.0),取舍在采集器。Alloy 没起时导出器在后台重连、丢 span,不影响业务;不想导出就加 Disabled: true。
# K8s 上由 k8s_deploy.ps1 按是否部署了节点采集器重写整段(New-GoSvcConfigMapYaml),不搬本机这个地址。
Telemetry:
  Name: rank
  Endpoint: 127.0.0.1:4317
  Sampler: 1.0
  Batcher: otlpgrpc
