# Base RPC service config
Name: login.rpc
# dev:本地联调配置。DevPasswordAuth 的启动门禁要求 Mode=dev/test;
# 生产部署走 deploy/ 下的受管配置,不复用本文件。
Mode: dev
ListenOn: 127.0.0.1:53000
# zrpc 服务端超时(毫秒)。2026-09-29 由笔误 100000 改为 10000;2026-10-14 再改为 4000
# (docs/design/client-request-ordering.md O10 / §5,用户拍板 Q2=B)。
# 为什么是 4000:生产走路由模式,路由服以 ForwardTimeoutMs(5000)调 login,deadline 经 gRPC 传播,
# 10000 在路由模式下本来就不生效,handler 实际只有约 5s。预算链要求「目标 Timeout + 1000 ≤ ForwardTimeoutMs」,
# 这样路由服回超时的时候 login handler 的 ctx 已经取消、不会再发出新的写;否则 gate 放行同一会话的下一条请求后,
# 这一条仍可能晚落地,顺序就乱了。由 tools/scripts/k8s_deploy.ps1 的 Assert-RouterForwardBudget 在部署前核对。
# CreatePlayer 持锁后串行四跳跨进程调用,按 handler 截止分摊(2026-11-10,internal/logic/pkg/createbudget;
# client-request-ordering.md §5.3),不再是各跳固定超时相加(原先 发号 3s + 名字 3s + player_route 3s,名义之和远超 4s):
#   第 i 跳的截止 = min(开始时刻 + 本跳上限, handler 截止 − Σ后面每一跳(下限 + 50ms 跳间间隙));
#   剩下的不够本跳下限就不发这一跳(写一个都不发出去),建角以 kLoginDataSerializeFailed 失败、已登记的名字释放,客户端重试。
#   各跳 上限 / 下限(毫秒):发号 300 / 0;名字登记 1700 / 800(一次 + 结果未知时同名重试一次 = 2 × 800 + 100 调度余量,
#   下限 = 单次登记预算,同名重试仍要求剩余 ≥ 800);player_route 登记 800 / 800(下方 HomeZone.RegisterTimeout);
#   SQL 账号目录提交 800 / 800(提交点一定拿满上限,结果未知时的强读回另走独立 1s)。
#   推导:本地余量 250(读登录态、拿建角锁、读 SQL 账号目录)+ 300 + 1700 + 800 + 800 + 3 个跳间间隙 150 = 4000 ≤ Timeout。
#   前置步骤与跳间都在余量之内时每一跳拿满自己的上限;超出时先截短发号,截到放不下后面的下限就在发号前放弃。
#   login 启动时核对「本地余量 + 各跳上限 + 跳间间隙 ≤ Timeout」,不满足拒绝启动:调大 RegisterTimeout 或调小本值之前先按上式重算;
#   本值也不能再大(上面的 I1)。
# EnterGame 的预加载链在 RPC 返回之后后台跑(chainBudget 5min),不受本值约束。
# 上限约束(上游比下游宽):gate 直连 login 的 C++ deadline = bin/etc/base_deploy_config.yaml 的
# GrpcClient.CallDeadlineMs.LoginNodeService(12000),必须 >= 本值 + 2000,由 Assert-GrpcClientDeadlineBudget 核对。
# K8s ConfigMap 从这里镜像;deploy/login-stack.linux/login.yaml 另有一份,同步改。
Timeout: 4000

# Canonical go-zero RPC registration/discovery settings.
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: login.rpc

# Node config (with login duration limits)
Node:
  ZoneId: 1
  SessionExpireMin: 30 # Session idle timeout. Sized to cover the worst-case
                       # Login→CreatePlayer→EnterGame RPC chain under load.
                       # 1 min was too tight for >1k-robot stress tests,
                       # causing login_session:{sid} to expire mid-flow and
                       # surface as kLoginEnterGameGuid on EnterGame.
  MaxLoginDevices: 3 # Max concurrent login devices per account
  # etcd 节点注册租约(秒)。gate 从注册表里**随机**挑一个 login 实例,实例只在 etcd key 被删时才
  # 从 gate 的表里摘掉;进程非优雅死亡(OOMKill / 节点宕机)时 key 要等租约到期才消失。
  # 原值 500:replicas 2 时一个副本崩溃,约一半登录请求会打到死实例,持续 8 分多钟。
  # 60 与 chat / match / scene_manager / trade / data_service 的现行值一致(续租间隔 = TTL/3 = 20s)。
  # 不会因 etcd 短暂抖动而永久掉线:租约丢失后 NodeRegistry.reRegister 无限重试(带退避)、
  # 用事务 CAS 重新挂 key 并重启续租;优雅下线走 Close() 主动删 key,不受此值影响。
  LeaseTTL: 60
  QueueShardCount: 50 # Queue shard count
  # Login duration limit (max online time per session)
  MaxLoginDuration: 5m # Max login duration (forced logout on timeout)
  LogoutGraceTime: 5s # Grace period to notify player before timeout
  RedisClient:
    Host: 127.0.0.1:6379
    Password: ""
    DB: 0
    DefaultTTL: 24h
    DialTimeout: 3s
    ReadTimeout: 3s
    WriteTimeout: 3s
    # go-redis 连接池上限(P0-E 第 3 批,共享 Redis 连接总账)。0 / 不写 = go-redis 缺省 10 × GOMAXPROCS,
    # 随 CPU limit 漂移(本机 Windows 上是 10 × 核数)。20 = K8s 上 GOMAXPROCS 按 2 时的缺省值,显式写出后不再随 CPU limit 变。
    # 任务结果 Pub/Sub 专用连接不占池名额。tools/scripts/k8s_deploy.ps1 把它镜像进 login ConfigMap(要求正整数),
    # Redis 连接总账读同一个键:改它看部署时打印的 "Redis connection ledger" 一行。池等满会排队(go-redis PoolTimeout)。
    PoolSize: 20
  # QueueRedis(可选,G4a 第 1a 批):排队、准入与放行锁所在的 Redis。本机单实例不写,即与上面 RedisClient 共用同一个 client;
  # K8s 上由 tools/scripts/k8s_deploy.ps1 -RedisSplit queue 整段渲染(字段同 RedisClient,全部必填,含 PoolSize)。
  # gate 排空标记不在这里,始终在 RedisClient(shared-redis-split-by-purpose.md §25.3)。

# 玩家域与登录域(docs/design/redis-player-store-cluster.md §5.7、§10.2)。上面的 Node.RedisClient 只剩控制域:账号锁、gate 排空标记。
#   PlayerRedis:player_locker、login_idempotent、login_generation。
#   LoginRedis:连接栅栏、登录态、设备集、账号索引、令牌、令牌家族、口令配额。
# 没写 Addrs 时都指向 Node.RedisClient 那一个实例,地址、口令、库号、超时跟着它。上 Redis Cluster 时写 Addrs(集群种子)+ Cluster: true,
# 两段结构相同,可以指向同一个集群,也可以拆开。这里只把连接池上限写明:每节点每句柄(单实例即总数),沿用单实例阶段的现值。
PlayerRedis:
  PoolSizePerNode: 20
LoginRedis:
  PoolSizePerNode: 20

# Distributed lock config
Locker:
  # AccountLockTTL 要盖住 CreatePlayer 持锁后的耗时,否则锁在建角中途过期、同账号的第二个建角请求就能并发跑起来。
  # 持锁后的耗时(2026-11-10 按截止分摊重算,原先按「发号 3s + 名字 3s + player_route 3s + 账号 blob 三次 Redis」估的
  # 推导已随账号 blob 改为 SQL 账号目录、子预算按截止分摊而作废):
  #   - handler 之内:发号 / 名字登记 / player_route 登记 / SQL 账号目录提交四跳按 handler 截止分摊(本文件顶部 Timeout 注释),
  #     读登录态、拿锁、读 SQL 账号目录、提交前复核锁令牌的 Redis 命令也都用 handler ctx。建角锁与这些键都在 LoginRedis 上,
  #     它的客户端用 ctx 截止约束套接字读写、不自动重发(shared/playerredis:ContextTimeoutEnabled、MaxRetries=-1),
  #     所以全部截在 Timeout(4s)之内;
  #   - handler 截止之后只剩补偿与收尾,各走独立 ctx:提交结果未知时的强读回 1s,或名字补偿释放 1s(结果未知时的第二次释放
  #     在 10s 后异步发,不持锁);然后释放建角锁(1s ctx,同样截在 1s)。
  #   合计最坏约 4 + 1 + 1 = 6s,20 盖得住。
  # **20 不是硬上界**,不要把它读成「有余量的保证」:上式没算调度与 GC 停顿;给 LoginRedis 配了 DisableContextTimeout 时
  # ctx 不再约束套接字读写,单条命令最长等满 ReadTimeout(3s),最坏约 4 + 3 + 1 + 3 = 11s。超出 TTL 之后的正确性不靠这个数:
  # 角色上限与唯一归属由 SQL 账号目录的事务裁决,提交前还按令牌复核建角锁
  # (createplayerlogic.go persistAccountRole),锁已易主就不提交、释放名字。后果最多是这次建角失败,不会覆盖别人的写入,
  # 也不会放出重名。
  # tools/scripts/k8s_deploy.ps1 从本文件读这个值,自动跟随;deploy/login-stack.linux 那份是 30。
  AccountLockTTL: 20 # 秒;不是硬上界,见上
  # PlayerLockTTL is the base TTL of the player lock. The EnterGame chain runs
  # a heartbeat goroutine that renews the lock at TTL/3 intervals, so this
  # only needs to survive a short Redis blip plus one heartbeat miss. If the
  # login process crashes mid-chain, the lock auto-expires after ~TTL.
  PlayerLockTTL: 120 # 120 seconds (heartbeat renews every ~40s)
  # 2026-05-25 stress: 30s 在 45k 浪涌下被 Redis QPS 飙升压挤,
  # heartbeat goroutine 一帧调度延迟超过 30s 就丢锁,触发 65k 次
  # `EnterGame lost lock mid-chain`(见 postmortem §L.3)。120s 给
  # heartbeat 4× 容错,稳态 prod 下不会增加锁占用 —— EnterGame
  # 链路正常完成在 ~3s,锁会被显式释放,不依赖 TTL。

# Account config
Account:
  MaxDevicesPerAccount: 3
  # 账号角色目录 account:<account> 长期保留；旧 CacheExpire 配置已弃用。

# Legacy/internal etcd client settings used by custom node helpers.
# Keep Hosts/Key aligned with top-level Etcd to avoid split-brain discovery.
Registry:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: login.rpc
    DialTimeout: 10s

# Timeout config
#
# 2026-05-24 stress: ServiceDiscoveryTimeout used to be 3s (per
# pkg/node/watcher.go default). Under 45k open-server burst the etcd
# kv.Get on the gate-prefix occasionally took >5s when etcd's auto-sync
# was probing stale advertise URLs (see postmortem §3). Bumped to 30s so
# AssignGate fast-path stops surfacing as "no gate available" purely
# because the discovery probe lost the race against the per-call deadline.
# 30s is conservative — production prod-tier latency is sub-100ms; the
# headroom only matters when something is already misbehaving.
Timeouts:
  EtcdDialTimeout: 30s
  ServiceDiscoveryTimeout: 30s
  RoleCacheExpire: 24h
  TaskManagerCleanInterval: 5s # Task manager cleanup interval
  TaskBatchExpireTime: 10s # Task batch expiration time
# PlayerLocator gRPC client (discovered via etcd)
# NonBlock: true —— 启动时不阻塞拨号。go-zero v1.9.2 的缺省是 false:对端 3s 内连不上,MustNewClient 就让 login 退出,
# 服务之间互相等就成了冷启动的连锁 CrashLoop(docs/design/infra-reconnect-overview.md §1.6、§4 R5)。
# 不是降级:player_locator 不可用期间,依赖它的调用照样按 Timeout 失败。
PlayerLocatorRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: playerlocator.rpc
  Timeout: 5000
  NonBlock: true
  Middlewares:
    Breaker: false

# SceneManager gRPC client (discovered via etcd)
SceneManagerRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: scenemanagerservice.rpc
  # 调用方超时必须 ≥ scene_manager 服务端 zrpc Timeout(scene_manager_service.yaml,8000)+ 2000:服务端自己的超时
  # 应答要能回到 login。以前是 5000 < 8000,scene_manager 还在落点 / 推路由时 login 就按失败收口、给客户端推 3023,
  # 服务端随后却可能已放行(结果未知)。与 C++ deadline ≥ Timeout + 2000 同一条规则(cross-zone-scene-travel.md §13.5);
  # 由 tools/scripts/tests/k8s_deploy_contract.tests.ps1 守着,K8s ConfigMap 从这里镜像。
  Timeout: 10000
  # NonBlock: true —— 理由同 PlayerLocatorRpc:scene_manager 没起不能让 login 起不来。
  NonBlock: true
  Middlewares:
    Breaker: false

# DataService gRPC client (discovered via etcd)。login 用它:领 PlayerId 号段
# (AllocateIdSegment)、建角登记归属 zone(RegisterPlayerZone)、登录 / 进游戏查归属
# zone(GetPlayerHomeZone / BatchGetPlayerHomeZone,见 HomeZone 块)、建角登记 / 补偿释放
# 角色名(ReservePlayerName / ReleasePlayerName,全服唯一,登记失败建角整体失败)、
# 角色列表与进游戏缺名时回源(BatchGetPlayerName,失败只是名字显示为空)。
# NonBlock: true —— 号段与归属查询都是弱依赖(设计稿 §6.5):data_service 没起时 login
# 照常起服,领段失败即拒绝建角。
# Middlewares.Breaker: true —— 归属查询串在**每次登录**的角色列表上。最难受的不是
# data_service 干净地下线(那样 etcd 掉键、连接直接被摘掉),而是它**死了但键还在**:
# 进程僵住 / 机器失联时,etcd 租约到期前那个 endpoint 仍在候选池里,go-zero 照样往它
# 派请求,于是每一次 Login 都白等满 RoleListLookupTimeout 才回退到建角 zone ——
# 全服登录延迟凭空抬高一个超时,一直抬到 etcd 把键摘掉为止。熔断器让失败到达阈值后
# 直接快速失败(homezone 按「不可用→保留存量 zone」处理),半开探测恢复后自动回来。
DataServiceRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: dataservice.rpc
  Timeout: 3000
  NonBlock: true
  Middlewares:
    Breaker: true

# PlayerId 号段发号(docs/design/node-id-overhaul-plan-20260908.md §6)。
# Enabled:**只有显式写 true 才开**;整块不写 = 关 = 发不出 id,建角一律失败。
# Step:**初始**领段长度;之后按 Leaf 口径动态调整 —— 一段不到 15 分钟用完则下次翻倍,
#   超过 30 分钟则减半,夹在 [MinStep, MaxStep] 内(缺省 [10, 1000])。每天重启一次时浪费
#   最多两段(当前段 + 预取段),动态 step 把它压到最小;双 buffer 意味着库倒下后还能发完两段。
# 号段失败即建角失败(tip kLoginDataSerializeFailed),没有回退:发号打散之后与 snowflake 的值域不再不相交。
IdSegment:
  Enabled: true
  Step: 100
  MinStep: 10
  MaxStep: 1000

# 合服后的 zone 归属修正(internal/logic/pkg/homezone)。走 DataServiceRpc 查
# player_route 映射。
#
# RefreshRoleListDisabled(反向命名,整块不写 = 开):Login 用映射覆盖角色列表的
#   zone_id。这是合服后的**主修正机制**——客户端按它选区就直接连到归属 zone 的 gate。
#   查询失败 / 映射为 0 一律保留建角 zone,不会拒绝登录;只在 homezone 自身需要止血时关。
# RedirectOnEnterEnabled(正向命名,整块不写 = 关):EnterGame 按归属 zone 触发
#   scene_manager 的跨区重定向(gate 推 msg 124 SceneClientPlayerCommonRedirectToGate)。
#   ⚠️ 客户端实现 msg 124 之前**必须保持 false**:EnterGame RPC 在重定向时已回成功并清掉
#   登录会话,客户端不按 124 换 gate 就会卡死。Unity 端目前只有未实现的 partial;
#   参考实现是 robot/pkg/redirect.go FollowRedirect +
#   robot/logic/handler/scene_client_player_common_redirect_to_gate.go。
#   打开后也只对「首次登录且没有在场 scene」生效,重连 / 顶号永远回原 scene。
# RoleListLookupTimeout:Login 角色列表那一次批量查询的预算(串在每次登录上,要短)。
#   角色列表缺名回源 BatchGetPlayerName 也用这个值:两次查询串行、各自计时,
#   缺名账号(B3a 之前建的老角色)最坏 2×,全部有名的账号仍只有一跳。
# EnterLookupTimeout:EnterGame 那一次单查的预算(异步链路,可宽)。
# RegisterTimeout:CreatePlayer 登记 player_route 这一跳的上限与下限(写失败建角整体失败;拿不满它就不发)。
#   按 handler 截止分摊,与名字登记、SQL 账号目录提交同档 800ms;四跳之和放进 Timeout 的推导见本文件顶部,
#   login 启动时核对,调大到放不下就拒绝启动。原值 3s 名义上就超出了整个 handler 预算(2026-11-10 改)。
#   不写 = homezone.DefaultRegisterTimeout(800ms),K8s ConfigMap 与 deploy/login-stack.linux 不渲染本块,走缺省。
HomeZone:
  RefreshRoleListDisabled: false
  RedirectOnEnterEnabled: false
  RoleListLookupTimeout: 500ms
  EnterLookupTimeout: 1500ms
  RegisterTimeout: 800ms

# ─────────────────────────────────────────────────────────────────────────
# 建角钉存储落点(docs/design/player-data-tidb-scaling-plan.md §7.2;player-storage-placement.md §8.3)
#
# CreatePlayer 在同一次 RegisterPlayerZone 里把归属和落点写进 player_route 的同一行。
# 存档库和区脱钩:每个地域固定 StorageShards 个存档库 player_store_{1000000 + Region×1000 + 片号}_db,
# 新号按 player_id % StorageShards 选库,和 login 所在的区无关。
#   Region:地域码,与 data_service 发号器的 Issuer.Region 同值;0 只给 dev、test。
#   StorageShards:本地域的存档库数 K(1..1000),上线后不能改。本机、docker 调试栈用 1(player_store_1000000_db)。
# 启动还需独立MMORPG_ACCOUNT_DIRECTORY_SECRET_LOGIN环境凭据，沿serviceauth正规格式校验，不记录其值。
#   启动日志 "[placement] new players go to region ..." 是核对依据。
Placement:
  Region: 0
  StorageShards: 1

# ─────────────────────────────────────────────────────────────────────────
# HMAC 密钥治理(见 internal/config/secrets.go 包注释)
#
# 一个用途一把钥匙,每把都支持三段式不停服轮换:
#   ① 新密钥先进 Additional/AdditionalEnv(全部实例都能"验") →
#   ② 提升为 Env/Value(开始用新密钥"签") →
#   ③ 旧密钥从 Additional 摘掉。
# 每一步都能单独滚动发布,任意时刻新旧凭据都验得过。
#
# ⚠️ 生产模式(Mode 不是 dev/test)的启动门禁:
#   - 密钥不得为空、不得是占位串、不得短于 32 字节;
#   - 三把密钥的主密钥两两不得相同;
#   - 违反任意一条 **直接拒绝启动**(见 login.go 里的 ResolveSecrets)。
# 生产请只填 Env(环境变量名),把密钥留在 K8s Secret 里,别写进本文件
# —— 与 PasswordAuth.DSNEnv / DevPasswordAuth.SharedSecretEnv 同一套纪律。
#
# ⚠️ 本文件里的 Value 一律以 "local-dev-" 开头,而 "local-dev" 被登记在
# secrets.go 的占位前缀表里 —— 也就是说**这些值在生产模式下必定被拒绝**。
# 这是刻意的:凡是进过 git 的密钥都等于公开值,不能有任何路径让它上生产。
# 生产写法是把 Env 这行取消注释、Value 删掉:
#     GateToken:
#       Env: "LOGIN_GATE_TOKEN_SECRET"
# 注意 Env 一旦填了,对应环境变量缺失会**直接报错**(不会静默回落到 Value),
# 所以本地默认配置里保持注释状态。
Secrets:
  # GateToken:签发给客户端、由 cpp gate 校验的连接票据。
  # 换这把密钥必须和 bin/etc/base_deploy_config.yaml 的 gate_token_secret
  # 同步(gate 侧目前只认单把,所以顺序是"先让 gate 认新密钥,再切这里")。
  GateToken:
    # Env: "LOGIN_GATE_TOKEN_SECRET"
    Value: "local-dev-gate-token-secret-0123456789abcdef"
    # 轮换期把上一把密钥放这里,只验不签:
    # AdditionalEnv:
    #   - "LOGIN_GATE_TOKEN_SECRET_PREV"
  # QueueToken:登录排队的不透明 token,login 自签自验。
  # 原来它复用 GateTokenSecret(见 docs/design/login-queue-2026-05.md:194),
  # 信任域没拆 —— 现在拆开,一处泄露不再牵连另一处。
  # (2026-10-18 补注)轮换的「摘旧密钥」一步须在新主密钥全量生效后至少等 24h(排队令牌的绝对上限
  # loginqueue.queueTokenMaxAge),否则仍在排队的玩家会被判 bad_signature、打回队尾。
  QueueToken:
    # Env: "LOGIN_QUEUE_TOKEN_SECRET"
    Value: "local-dev-queue-token-secret-0123456789abcdef"

# 内部调用方验签策略。
# **任何运行模式都强制验签,这里没有开关能关掉它**(dev/test 与生产同一条路径)。
# 验签公钥不在这份配置里:login 读环境变量 MMORPG_INTERNAL_AUTH_PUBLIC_KEYS(gate 的 Ed25519 公钥列表),
# 缺了拒绝启动。本机由 tools/scripts/lib/gate_identity_environment.ps1 注入开发公钥,K8s 由部署脚本注入
# (docs/design/gate-online-identity.md §4、§10.1)。
InternalAuth:
  MaxClockSkew: 30s
  MaxNonceEntries: 500000
  # 留空表示不限制调用方名字(签名仍然必须验过)。
  # AllowedCallers:
  #   - "gate"
  #   - "gateway"

# ⚠️ 已废弃:单个 string 无法不停服轮换,而且 gate/queue 两种 token 共用它。
# 保留只为兼容仓外的 deploy/*.yaml 与 tools/scripts/k8s_deploy.ps1;
# 配了 Secrets.GateToken 之后这行就不再生效。新部署不要再写它。
# GateTokenSecret: ""

# Access/refresh token TTL (WeChat/QQ game login style dual-token)
# Access token: used for reconnect without re-auth from third-party (default 2h)
# Refresh token: used to silently renew access token (default 30d)
TokenConfig:
  AccessTokenTTL: 2h
  RefreshTokenTTL: 720h  # 30 days
  # 旧 refresh token 被轮换后仍可重放的宽限窗口:窗口内同一旧 token 再来,返回同一对新令牌
  # (回包丢失后的重试不必重新登录)。0 = 严格一次性;上限 60s、整毫秒,越界拒绝启动。
  # 见 docs/design/dual-token-authentication.md「轮换重试的宽限窗口」。
  RefreshReuseGrace: 30s
  # 已轮换的旧 refresh token 再次出现(窗口外,或窗口内而它换出的新 refresh 已被轮换走)→ 吊销那次登录的
  # 整条令牌线(含 access);同账号其他设备不受影响。false = 只观测(照常检测、记指标与日志,不吊销)。
  # 不要与 RefreshReuseGrace: 0 同时开:那样同一请求并发两次就会触发吊销。见同文「令牌家族、重用检测与家族吊销」。
  # 整个 TokenConfig 块可以不写(K8s ConfigMap 就不写):每个字段都按与这里相同的默认值取。
  RefreshReuseRevoke: true

# 旧路径「客户端 → cpp gate(TCP)→ ClientPlayerLogin.Login,用口令 / 第三方凭据首认证」
# 的 kill switch(ARCH §12)。默认 true 保持现状;login_auth_path_total{path="legacy"}
# 降到约定阈值以下后在 T+2 置 false。置 false 后 gate 上的凭据登录在认证之前就回
# kLoginUnknownError(不消耗第三方 code、不抢账号锁,凭据真假都回这个码);
# 新 HTTP 入口(Java Gateway POST /api/login)与 gate 上 auth_type=access_token 的会话绑定
# (新流程必经一步,login_session 唯一写入点)都不受影响。
LegacyGateLoginEnabled: true

# Prometheus scrape endpoint, exposed by go-zero core/service. Bind to
# 0.0.0.0 in staging/prod so Grafana / Prometheus can reach it; on dev
# we keep it on 127.0.0.1 to avoid leaking metrics outside localhost.
# The login_auth_path_total counter (see deprecation.go) is the
# T+1 exit-criterion signal — Grafana JSON template lives in
# docs/ops/grafana-login-path-deprecation.json.
Prometheus:
  Host: 127.0.0.1
  Port: 9101
  Path: /metrics

# EnterGame 异步入场链的 goroutine 池(名字是预加载时代留下的)。
# Size: 同时在跑的入场链上限。Submit 非阻塞,池满时不启动这条链,EnterGame 回 kLoginInProgress,客户端重试。
#       看 entergame_total{result="pool_saturated"},[preload-pool] 日志的 dropped_delta 是次要信号。
# StatsInterval: periodic pool snapshot log (running/free/cap, drop counter).
#       Set to 0 to disable.
PreloadPool:
  Size: 256
  StatsInterval: 30s

# Production password auth is opt-in and reads Argon2id PHC hashes from the
# authoritative MySQL user_accounts.password column on EVERY password login.
# The DSN (including DB credentials) must come from the named environment
# variable and should grant SELECT on user_accounts only; never put the DSN
# itself in this file. Disabled means fail-closed, while third-party/access-token
# auth remains available.
PasswordAuth:
  Enabled: false
  DSNEnv: "LOGIN_PASSWORD_AUTH_DSN"
  MaxOpenConns: 20
  MaxIdleConns: 10
  # Each Argon2id verification uses 64 MiB. Per-process KDF working set is
  # approximately KDFConcurrency * 64 MiB. Default 2 = ~128 MiB; hard max 8.
  KDFConcurrency: 2
  # Waiting for a KDF slot is bounded and context-aware; overload fails closed.
  KDFWaitTimeout: 500ms
  # 跨副本账号失败门，必须共用不可淘汰的 Redis；单账号在途租期固定 30s。
  FailureLimit: 5
  FailureWindow: 15m
  FailureLock: 5m

# Local robots and the Unity dev client use this explicit development-only
# gate: the shared secret must come from an environment variable and only the
# listed account prefixes are accepted. It is rejected at startup unless
# go-zero Mode is dev or test; production mode cannot enable it. PasswordAuth
# and DevPasswordAuth are mutually exclusive.
# 启动 login 前先设(密码=该密钥):
#   PowerShell: $env:LOGIN_DEV_PASSWORD_SHARED_SECRET='<local-only-secret>'
DevPasswordAuth:
  Enabled: true
  SharedSecretEnv: "LOGIN_DEV_PASSWORD_SHARED_SECRET"
  AllowedAccountPrefixes:
    - "robot_"
    - "dev_"

# Third-party auth provider config (all optional).
# Password is disabled by default (see PasswordAuth above). Third-party
# providers can still be enabled independently.
#
# Roll-out order for a new provider (e.g. WeChat):
#   1. Provision AppId/AppSecret on the 3rd-party platform.
#   2. Inject secrets via K8s Secret -> env var; reference with ${VAR} below.
#   3. Uncomment the section and redeploy login.rpc only; gateway/gate need no changes.
#   4. Smoke-test via the Java Gateway POST /api/login with auth_type:"wechat".
#   5. Enable the public /api/login flow for the zone.
AuthProviders:
  SaToken:
    TokenName: satoken
    LoginType: login
    Redis:
      Host: 127.0.0.1:6379
      Password: ""
      DB: 0
      DefaultTTL: 24h
      DialTimeout: 3s
      ReadTimeout: 3s
      WriteTimeout: 3s
#   # WeChat Open Platform (mobile/PC SDK). The client SDK returns an OAuth `code`
#   # (valid 10 min, one-time-use). LoginRequest{auth_type:"wechat", auth_token:<code>}.
#   # Account identity = "wx_<unionid>". 拿不到 unionid 时缺省拒绝登录(故障码 LoginAuthProviderUnavailable),
#   # 只有显式 RequireUnionId: false 才回落 "wx_<openid>"(多应用下会分裂账号,见 config.WeChatAuthConf)。
#   # login 不展开 "${VAR}":密钥只写环境变量名(AppSecretEnv),写成 "${...}" 会拒绝启动;
#   # 内联 AppSecret 只在 Mode=dev/test 放行,Endpoint 在其余 Mode 只接受 https://。
#   WeChat:
#     AppId: "wx0123456789abcdef"
#     AppSecretEnv: "LOGIN_WECHAT_APP_SECRET"
#   # QQ Connect (https://connect.qq.com/). The SDK passes `access_token`
#   # (NOT a code) as auth_token. Account identity = "qq_<unionid>",unionid 规则同上。
#   # 不需要 AppKey(provider 只调 /oauth2.0/me 并校验 client_id == AppId);应用没有 unionid 权限时
#   # 写 RequestUnionId: false 且必须同时写 RequireUnionId: false。
#   QQ:
#     AppId: "101234567"
#   # NetEase URS — provider is currently a stub (see auth-provider-framework.md).
#   NetEase:
#     AppKey: "${NETEASE_APP_KEY}"
#     AppSecret: "${NETEASE_APP_SECRET}"

# AssignGate login queue (Redis ZSET-backed). When Enabled=false (default),
# AssignGate signs and returns a gate token immediately, just like the legacy
# behavior. When Enabled=true:
#   - capacity per zone = zone_config.capacity (the gateway's zone directory, published to etcd
#     /mmorpg/zone_policy/zone/<id> and read by this login; 2026-11-10 起这是唯一来源,本文件不再配区容量),
#     capped at what the zone's gates hold at 90% of max_connections; gate PlayerCount is the online count
#   - over-capacity callers are enqueued and receive a queue_token; clients
#     poll QueryQueueStatus until the dispatcher promotes them.
#   - reconnect/replace callers (existing PlayerSession) bypass the queue.
#
# Roll-out checklist:
#   门槛(2026-10-15):打开排队之前,docs/handoff/launch-readiness-20261013/spec_G4b.md §7「合入门槛」的三项
#      (G1b 多 zone 用例与 G4b-G 由 Codex 跑绿、spec_G4b-G.md §8.4 真实 Redis 冒烟记进 docs/PROGRESS.md)必须都已满足。
#      K8s 部署由 tools/scripts/k8s_deploy.ps1 的 $script:LoginQueueMergeGateCleared 机械拦截(未清时各档位排队都关、
#      -LoginQueue on 拒绝);手改本文件或 ConfigMap 的 Enabled 同样违规,脚本拦不住。清门槛本身的冒烟用 scratchpad 里的
#      配置副本,本文件 Enabled 保持 false。
#   0. 先在 Enabled=false 下把所有 zone 的 login 升到 2026-10-13(G4b-G,含 G1b)之后的版本,再打开 Enabled。
#      排队开着混跑时:同一个 zone 可能短暂两个 leader(G1b);新旧两种在途占位键互不可见,旧版副本放行 / 取走的
#      部分仍按旧版超发(G4b-G)。不丢人、不重复放行(docs/design/login-queue-2026-05.md §7.1 与「在途占位的生命周期」)。
#      (2026-10-18 补注)升级到 2026-10-18(放行脚本先判在队、空闲 TTL)这一版、以及从它回滚,都必须在 Enabled=false
#      下滚完:排队开着混跑时,旧版 leader 弹出、尚未写完的条目会被新版判为 queue_gone 并打回队尾,上面「不丢人」在
#      本版本的升级窗口里不成立。
#   1. Deploy with Enabled=false → verify no behavior change.
#   2. Set zone_config.capacity for each live zone (PUT /admin/zones/<id> on the gateway; use observed
#      peak * 0.9 as the initial value; tune from there) and size gate replicas so that
#      replicas * GateMaxConnections * 90% >= capacity (login_queue_capacity shows the effective value).
#   3. Flip Enabled=true on one canary login pod, watch admit/queue counters.
#   4. Roll out fleet-wide.
#
# DispatchInterval too low burns Redis QPS without improving fairness;
# 1s is the sweet spot since gate PlayerCount only refreshes every 10s
# via etcd (cpp/nodes/gate/main.cpp playerCountReportTimer).
#
# AdmitTTL:放行槽等客户端来取的时限,也是没人来取时在途占位的寿命。取走之后(以及快速通道当场
# 交票之后)占位只再留 20s —— 代码常量 loginqueue.defaultHandoffGrace,不是配置(G4b-G;2026-10-13 定 15s,
# 10-15 改为 20s,即 gate 两个上报周期)。
# 占位键的整键 TTL 只做垃圾回收、只增不减:各副本写占位时,剩余 TTL 不足自己的 max(AdmitTTL, 20s) + 1min
# 才续上(2026-10-15 起;此前是无条件续期)。所以排队开着时也可以滚动调整 AdmitTTL,新旧值并存不会让整键
# 先于未到期的占位消失;调小之后,已续上的较大整键 TTL 要自然走完才收敛(只影响 zone 下线后键多留多久)。
#
# Enabled=true 时 DispatchInterval、DispatcherLockTTL 必须为正(loginqueue.NewDispatcher 校验),否则起服失败;
# 代码里的默认值(1s / 30s)只在键缺省时生效,显式写 0s 不会回落到默认值,也不是「关掉」。
# (2026-10-15 补注)QueueEntryTTL 同样必须为正,AdmitTTL 不小于 1ms(loginqueue.ValidateTTLs),否则起服失败。
#
# (2026-10-18 补注)QueueEntryTTL 改为空闲 TTL:meta、token 索引与队列键自最后一次成功的排队中查询(或入队)起算,
# 至少保留 QueueEntryTTL、至多 1.25 倍,持续轮询的人不会因为等满 1h 被弹回队尾。排队令牌改为固定 24h 签名过期
# (loginqueue.queueTokenMaxAge),不再等于 QueueEntryTTL。QueueEntryTTL 取值须在 [1s, 24h],否则起服失败。
# 本版本以及从它回滚,都必须在 Enabled=false 下滚完(见上面上线清单第 0 步的补注)。
Queue:
  Enabled: false
  DispatchInterval: 1s
  AdmitTTL: 60s
  QueueEntryTTL: 1h
  SoftCapMultiplier: 1.5
  DefaultRetryAfterMs: 2000
  DispatcherLockTTL: 30s
  # 出队 leader 锁键的前缀:实际锁键 = <DispatcherLockKey>:zone:<Node.ZoneId>,每个 zone 一个 leader
  # (2026-10-12 G1b;此前全服一把,多 zone 共用 Redis 时只有 leader 所在 zone 出队)。各 zone 照写这个默认值即可;
  # 同一 zone 的副本必须同值,否则该 zone 会长期双 leader。
  DispatcherLockKey: "dispatcher:lock:login_queue"
  # 区容量不在这里配:只认区服目录 zone_config.capacity(见上面第一段)。读不到区服策略时
  # FreeSlots 退回 PlayerCount * SoftCapMultiplier,仍按 gate 承载封顶。

# 控制面命令的生产者。login 只生产不消费。
Kafka:
  Brokers:
    - "127.0.0.1:9092"
  DialTimeout: 10s
  ReadTimeout: 30s
  WriteTimeout: 10s

# 下发 gate 地址时是否必须用 gate 自报的客户端可达地址(NodeInfo.clientEndpoint,集群外入口 D78)。
# false = gate 没自报就回落 endpoint(PodIP),本地开发 / podip 模式用它;
# true = 没自报的 gate 直接跳过(external 模式)。K8s 下由 k8s_deploy.ps1 按 -ClientEntryMode 覆盖。
# 打开前先确认本 zone 所有 gate 都已带 clientEndpoint,否则登录会无 gate 可分。
RequireClientEndpoint: false

# gate 排空判定(集群外入口 D87):已标 gate:{id}:draining 的 gate 在线掉到阈值或等到期限后,
# login 写上 gate:{id}:drained,k8s_gate_drain.ps1 看到它才删 Pod。整块可缺省,缺省即下面这组值。
# Deadline 必须小于 draining 标记的 TTL(k8s_gate_drain.ps1 -DrainTtlSeconds,默认 1800s),
# 否则 draining 先过期、drained 永远等不到。
GateDrain:
  Interval: 5s            # 判定周期;0 = 关闭(排空脚本只能等到超时)
  DrainedBelowPlayers: 0  # 在线 <= 它即判定排空
  Deadline: 25m           # 从标 draining 起等这么久还剩人也判定可缩容(打 ERROR);0 = 只认人走干净
  # 排空时把在线连接按限速迁到同 zone 其他 gate(msg 124 + 租约内重连回原场景,
  # docs/design/gate-drain-session-migration.md)。子块可缺省,缺省即下面这组值。
  Migrate:
    Enabled: false        # 第一批默认关;客户端「成功进场后跳数清零」与 robot 集成跑过之后再开
    RatePerSecond: 20     # 每台排空中的 gate 每秒最多发起的迁移数;0 等同关闭
    StartAfter: 0s        # 标记 draining 之后多久开始迁移,留给玩家自然下线
