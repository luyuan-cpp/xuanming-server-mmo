# player_locator service config
Name: playerlocator.rpc
ListenOn: 127.0.0.1:51200
Timeout: 10000

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: playerlocator.rpc

RedisClient:
  Host: 127.0.0.1:6379
  Password: ""
  DB: 0

Kafka:
  Brokers:
    - 127.0.0.1:9092

Node:
  ZoneId: 1
  LeaseTTL: 500

Registry:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    DialTimeout: 5s

Lease:
  DefaultTTLSeconds: 30
  PollInterval: 1s
  BatchSize: 100

# SceneManager gRPC client (via etcd discovery).
# Used to call LeaveScene when a player's disconnect lease expires.
SceneManagerRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: scenemanagerservice.rpc
  Timeout: 3000

# Prometheus 抓取端点,由 go-zero core/service 自带的 agent 暴露(不要另起 promhttp)。
# 端口分工:login 9101 / scene_manager 9150 / db 9160 / guild 9170 / friend 9180 /
# player_locator 9190。dev 下绑 127.0.0.1,避免指标泄到本机以外;
# staging/prod 改绑 0.0.0.0 让 Prometheus / Grafana 抓得到。
# 留空 Host 即彻底关闭 /metrics(go-zero 的 StartAgent 直接 return)。
#
# 本服务没有 in-band 业务码(PlayerLocator 的响应要么是 Empty,要么用
# ReconnectResponse.success + 自由文本 error_message),失败一律走 gRPC status。
# 所以 shared/serverbase 在这里主要提供统一的 rpc_duration_seconds{method,status},
# 其中 status=transport_error 就是真实失败率。另外还有:
#   safego_panic_total{point}  - 后台循环(租约监视 / 会话对账)被兜住的 panic,应恒 0
Prometheus:
  Host: 127.0.0.1
  Port: 9190
  Path: /metrics
