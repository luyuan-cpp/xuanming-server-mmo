# player_locator service config
Name: playerlocator.rpc
ListenOn: 127.0.0.1:53200
Timeout: 10000

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: playerlocator.rpc

RedisClient:
  Host: 127.0.0.1:6379
  Password: ""
  DB: 0
  # go-redis 连接池上限(P0-E 第 3 批,共享 Redis 连接总账)。0 / 不写 = go-redis 缺省 10 × GOMAXPROCS,
  # 随 CPU limit 漂移(本机 Windows 上是 10 × 核数)。20 = K8s 上 GOMAXPROCS 按 2 时的缺省值,显式写出后不再随 CPU limit 变。
  # tools/scripts/k8s_deploy.ps1 把它镜像进 player-locator ConfigMap(要求正整数),Redis 连接总账读同一个键:
  # 改它看部署时打印的 "Redis connection ledger" 一行。
  PoolSize: 20

# 玩家域 Redis(会话、断线租约、gate 索引、分片登记),上线后是 Redis Cluster,设计见 docs/design/redis-player-store-cluster.md §5.7、§5.9。
# 整段不写时指向上面 RedisClient 这个单实例,沿用它的 PoolSize,开发环境不用改。要拆开时写:
# PlayerRedis:
#   Addrs:
#     - 127.0.0.1:7000     # Cluster 下是种子地址
#   Cluster: true
#   Password: ""           # 或 PasswordEnv: 环境变量名
# PoolSizePerNode 是每个节点的连接池上限,tools/scripts/k8s_deploy.ps1 把它镜像进 ConfigMap,玩家域连接总账读同一个键。
PlayerRedis:
  PoolSizePerNode: 20

Kafka:
  Brokers:
    - 127.0.0.1:9092

Node:
  ZoneId: 1
  # etcd 节点注册租约(秒)。原值 500:进程崩溃后注册信息与 node_id 槽位要滞留 8 分多钟才释放。
  # 60 与 chat / match / scene_manager / trade / data_service 的现行值一致。租约丢失后
  # internal/node 的 reRegister 会重新注册并重启续租,不会因 etcd 短暂抖动永久掉线。
  LeaseTTL: 60

Registry:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    DialTimeout: 5s

Lease:
  DefaultTTLSeconds: 30
  PollInterval: 1s
  BatchSize: 100
  # ScanRoundSeconds: LeaseMonitor 探测完持有的全部 slot 用多久,默认 16,同样只写注释不写值。
  #   全服的探测量是 2 × 16384 / 本值 条 ZCOUNT 每秒,与副本数无关;租约到期后最迟晚这么久才被认领。
  # 会话对账(按 gate 实例建的会话索引,死 gate 清扫按段分给各副本,写者检查与补建 / 审计由一个 leader 跑,
  # docs/design/player-locator-gate-session-index.md)。
  # 下面各项**刻意只写注释、不写值**:事实源是 internal/config/config.go 的默认值(Normalized),
  # K8s ConfigMap 同样不写;这些项必须全服一致,改默认值就改代码。
  # config_test.go 的 TestEtcYamlLeavesReconcileToCodeDefaults 守着这条,往这里加值会红。
  #   ReconcileIntervalSeconds: 清扫与 leader 每拍的周期,默认 60;-1 关闭整个对账。
  #     它也是就绪标记租约(3.5 拍)与让位门槛(连续 3 拍失败或 3 拍无成功)的基准。
  #   Reconcile:
  #     AuditIntervalSeconds: 索引就绪后定期审计的周期,默认 86400;-1 = 就绪后不再审计(未就绪时照常补建)。
  #       审计 = 限速的全键 SCAN 补漏成员 + 各 gate 索引的脏成员清理,时机记在 Redis,换主不重置。
  #     ScanCount: 补建 / 审计每页 SCAN、SSCAN 的 COUNT,默认 1000。
  #     ScanPagesPerSecond: 补建 / 审计每秒最多几页,默认 200;负数不限速(只给本机与单测)。
  #     MaxTransitionsPerSecond: 每个副本把死 gate 上 ONLINE → DISCONNECTING 的速率上限,默认 1000;负数不限速。
  #       每拍只用半个拍长去转换,大面积 gate 故障时每个副本的持续速率约为它的一半,估恢复时间按一半乘持段副本数(设计文档 §7)。
  #     DeadGateMembersPerRound: 每个副本一拍最多检查多少个死 gate 索引成员,默认 30000,超出留到下一拍。

# SceneManager gRPC client (via etcd discovery).
# Used to call LeaveScene when a player's disconnect lease expires.
SceneManagerRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: scenemanagerservice.rpc
  Timeout: 3000

# RPC 级热关停(shared/killswitch)规则在 etcd 里的前缀。
# 留空 = 用默认前缀 /mmorpg/killswitch/,且前缀下没有 key 时全部放行。
# 关停某个方法:etcdctl put /mmorpg/killswitch/playerlocator.PlayerLocator/GetLocation '{"deny":true,"reason":"..."}'
# 关停整个服务:etcdctl put /mmorpg/killswitch/playerlocator.PlayerLocator/'*' true
# 恢复:etcdctl del 对应的 key。
# ⚠️ SetSession / SetDisconnecting 是会话租约链的写入点,关掉会留下永久 ONLINE 的
# 会话(只能靠会话对账扫描事后补),止血请优先关只读方法。
KillSwitchPrefix: ""

# Prometheus 抓取端点,由 go-zero core/service 自带的 agent 暴露(不要另起 promhttp)。
# 端口分工:login 9101 / scene_manager 9150 / db 9160 / guild 9170 / friend 9180 /
# player_locator 9190。dev 下绑 127.0.0.1,避免指标泄到本机以外;
# staging/prod 改绑 0.0.0.0 让 Prometheus / Grafana 抓得到。
# 留空 Host 即彻底关闭 /metrics(go-zero 的 StartAgent 直接 return)。
#
# 本服务没有 in-band 业务码(PlayerLocator 的响应要么是 Empty,要么用
# ReconnectResponse.success + 自由文本 error_message),失败一律走 gRPC status。
# 所以 shared/serverbase 在这里主要提供统一的 rpc_duration_seconds{method,status},
# 其中 status=transport_error 就是真实失败率。另外还有:
#   safego_panic_total{point}  - 后台循环(租约监视 / 会话对账)被兜住的 panic,应恒 0
#   player_locator_reconcile_* / player_locator_gate_index_* / player_locator_slot_shard_segments - 会话对账;
#     口径见 internal/logic/reconcile_metrics.go 文件头与设计文档 §9
Prometheus:
  Host: 127.0.0.1
  Port: 9190
  Path: /metrics
