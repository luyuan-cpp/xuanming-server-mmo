syntax = "proto3";

// TestMultiKey 表的权威 schema。源表 data/TestMultiKey.xlsx。
//
// 本文件不参与 protoc 编译,也不进任何语言的构建;导表器直接文本解析它。
// 字段号是从 generated/code/proto/testmultikey_table.proto 抄来的现状值,**只增不改、删字段用 reserved**。

package mmorpg.cfgtable.v1;

import "cfg_options.proto";

message TestMultiKeytestobj1 {
  uint32 testobj1_key = 1;
  uint32 testobj1_value = 2;
}

message TestMultiKeyTable {
  option (cfg_sheet)       = "TestMultiKey";
  option (cfg_source_file) = "TestMultiKey.xlsx";
  option (cfg_primary_key) = "id";

  uint32 id = 1 [(cfg_multi) = true];
  map<string, string> tag1 = 12 [(cfg_slots) = 2];
  // 免疫tag
  map<string, string> immune_tag1 = 13 [(cfg_slots) = 2];
  // 等级
  uint32 level = 2 [(cfg_index) = true];
  // 等级
  repeated TestMultiKeytestobj1 testobj1 = 14 [(cfg_slots) = 4];
  repeated uint32 effect = 3 [(cfg_slots) = 6];
  string string_key = 4 [(cfg_key) = true];
  uint32 uint32_key = 5 [(cfg_key) = true];
  int32 int32_key = 6 [(cfg_key) = true];
  string m_string_key = 7 [(cfg_multi) = true, (cfg_key) = true];
  uint32 m_uint32_key = 8 [(cfg_multi) = true, (cfg_key) = true];
  int32 m_int32_key = 9 [(cfg_multi) = true, (cfg_key) = true];
  // FK to Test table
  uint32 test_ref = 10 [(cfg_fk) = "Test"];
  // GFK to Test table
  repeated uint32 test_refs = 11 [(cfg_slots) = 2, (cfg_gfk) = "Test"];
}
