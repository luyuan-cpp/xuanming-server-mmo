syntax = "proto3";

// Dungeon 表的权威 schema。源表 data/Dungeon.xlsx。
//
// 本文件不参与 protoc 编译,也不进任何语言的构建;导表器直接文本解析它。
// 字段号是从 generated/code/proto/dungeon_table.proto 抄来的现状值,**只增不改、删字段用 reserved**。

package mmorpg.cfgtable.v1;

import "cfg_options.proto";

message DungeonTable {
  option (cfg_sheet)       = "Dungeon";
  option (cfg_source_file) = "Dungeon.xlsx";
  option (cfg_primary_key) = "id";

  uint32 id = 1;
  // FK -> BaseScene.id
  uint32 scene_id = 2 [(cfg_fk) = "BaseScene"];
  uint32 max_team_size = 3;
  uint32 time_limit = 4;
  // FK -> Monster.id(重复列,占 3 格)。源表 opts 写的是 fk:Monster。
  repeated uint32 monster = 5 [(cfg_slots) = 3, (cfg_fk) = "Monster"];
}
