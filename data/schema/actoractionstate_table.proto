syntax = "proto3";

// ActorActionState 表的权威 schema。源表 data/ActorActionState.xlsx。
//
// 本文件不参与 protoc 编译,也不进任何语言的构建;导表器直接文本解析它。
// 规范化规则表:每行显式声明一条 (id=action_id, state_id) -> (state_mode, state_tip) 规则,
// 新增状态只需在 Excel 追加行,不再依赖定长槽位 cfg_slots,彻底消除列位错位风险。
// 字段号 2("state") 为旧定长槽位结构,按规则 reserved 不复用。

package mmorpg.cfgtable.v1;

import "cfg_options.proto";

message ActorActionStateTable {
  option (cfg_sheet)       = "ActorActionState";
  option (cfg_source_file) = "ActorActionState.xlsx";
  option (cfg_primary_key) = "id";

  reserved 2;
  reserved "state";

  // 动作 ID(eActorAction: 0=UseSkill, 1=JoinFollow, 2=MountActor, 3=UnmountActor)
  uint32 id = 1 [(cfg_multi) = true];
  int32 constants_name = 9001 [(cfg_owner) = "constants_name"];
  // 状态 ID(eActorState: 0=Combat, 1=TeamFollow, 2=Mounted)
  uint32 state_id = 3;
  // 互斥模式: 0=互斥拒绝(kActionStateMutualExclusion), 1=允许(kActionStatePermitted), 2=打断当前状态(kActionStateInterrupt)
  uint32 state_mode = 4;
  // 互斥拒绝时返回给客户端的 tip 错误码(state_mode=0 时生效;非互斥行填 kSuccess=1000)
  uint32 state_tip = 5 [(cfg_tip_ref) = true];
}
