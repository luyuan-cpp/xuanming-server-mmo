syntax = "proto3";

// Test 表的权威 schema。源表 data/Test.xlsx。
//
// 本文件不参与 protoc 编译,也不进任何语言的构建;导表器直接文本解析它。
// 字段号是从 generated/code/proto/test_table.proto 抄来的现状值,**只增不改、删字段用 reserved**。

package mmorpg.cfgtable.v1;

import "cfg_options.proto";

message Testtestobj {
  uint32 testobj_key = 1;
  uint32 testobj_value = 2;
}

message TestTable {
  option (cfg_sheet)       = "Test";
  option (cfg_source_file) = "Test.xlsx";
  option (cfg_primary_key) = "id";

  uint32 id = 1;
  map<string, string> tag = 4 [(cfg_slots) = 2];
  // 免疫tag
  map<string, string> immune_tag = 5 [(cfg_slots) = 2];
  // 等级
  uint32 level = 2;
  // 等级
  repeated Testtestobj testobj = 6 [(cfg_slots) = 4];
  repeated uint32 effect = 3 [(cfg_slots) = 6];
}
