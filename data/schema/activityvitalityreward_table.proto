syntax = "proto3";
package mmorpg.cfgtable.v1;
import "cfg_options.proto";
message ActivityVitalityRewardTable {
  option (cfg_sheet) = "ActivityVitalityReward";
  option (cfg_source_file) = "ActivityVitalityReward.xlsx";
  option (cfg_primary_key) = "id";
  uint32 id = 1;
  uint32 rule_id = 2 [(cfg_fk) = "ActivityVitalityRule"];
  uint32 required_points = 3;
  uint32 reward_id = 4 [(cfg_fk) = "Reward"];
}
