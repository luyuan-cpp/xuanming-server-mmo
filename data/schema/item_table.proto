syntax = "proto3";

// Item 表的权威 schema。源表 data/Item.xlsx。
//
// 本文件不参与 protoc 编译,也不进任何语言的构建;导表器直接文本解析它。
// 字段号是从 generated/code/proto/item_table.proto 抄来的现状值,**只增不改、删字段用 reserved**。

package mmorpg.cfgtable.v1;

import "cfg_options.proto";

// 装备基础属性的一条(docs/design/equipment-attributes.md §2.5)。
// 消息名 = 表名 + 字段名、子字段名 = 字段名 + "_" + 子列名、号必须是 1..N 连续 —— 都是导表器的硬约束。
// base_attr_id 指向 EquipAttribute.id,但**不设外键**:导表器的外键 / 索引只认主消息上的标量列,
// 写在子消息列上会让生成的 Load() 去调主消息上不存在的访问器(row_data.base_attr_id())。
// 所以导表期**不校验**这一列的引用完整性,填错的 id 要靠运行期的启动表校验
// (PlayerEquipSystem::InstallItemInitializer,设计文档 §4.3 / §10)发现。
message Itembase_attr {
  // 属性 id(EquipAttribute.id);空槽整槽留空
  uint32 base_attr_id = 1;
  // 数值;单位随该属性的 percent(0 = 点数,1 = 整数百分点)
  uint32 base_attr_value = 2;
}

message ItemTable {
  option (cfg_sheet)       = "Item";
  option (cfg_source_file) = "Item.xlsx";
  option (cfg_primary_key) = "id";

  uint32 id = 1;
  // 最大堆叠数量
  uint32 max_stack_size = 2;
  // 装备部位:0=不是装备。>0=该部位编号。部位的含义(手镯/头/胸…)以及每个部位有几个槽,全部由数据定义 —— 槽位表 EquipSlot 决定哪个槽接受哪个部位,代码里不写死
  uint32 equip_kind = 3;
  // 回合制战斗内可用:0=不可用,1=可用。只有它非 0 的物品才会进 BattlePlayerSnapshot.items 消耗副本,引擎也按它拒绝 ITEM 行动
  uint32 battle_usable = 4;
  // 战斗内使用回复的生命值(0=不回血)。按当前属性单位(血量千级)填
  uint64 battle_heal_hp = 5;
  // 战斗内使用回复的法力值(0=不回蓝)。按当前属性单位(法力 ×4)填
  uint64 battle_heal_mp = 6;
  // 物品名(下发客户端)
  string name = 7;
  // 描述(下发客户端 tooltip)
  string description = 8;
  // 图标 Resources 路径(UI/ 开头,不带扩展名);空 = 客户端兜底图标
  string icon_key = 9;
  // 佩戴等级,同时是查属性上限(EquipAttributeCap)用的装备等级
  uint32 equip_level = 10;
  // 职业要求(Class.id);0 = 不限
  uint32 equip_class = 11;
  // 随机属性池(EquipAffixPool.pool_id,不是那张表的主键,所以不设外键);0 = 不掷
  uint32 affix_pool = 12;
  // 掷值规则。FK -> EquipAffixRule.id;0 = 不掷
  uint32 affix_rule = 13 [(cfg_fk) = "EquipAffixRule"];
  // 基础属性:每槽 (EquipAttribute.id, 数值),最多 3 条;用不到的槽留空,不要填 0
  repeated Itembase_attr base_attr = 14 [(cfg_slots) = 3];
}
