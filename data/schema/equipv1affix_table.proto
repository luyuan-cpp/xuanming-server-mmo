syntax = "proto3";

// 首发定向词条的权威 schema。旧随机属性池与取值规则不使用本表。
package mmorpg.cfgtable.v1;
import "cfg_options.proto";

message EquipV1AffixTable {
  option (cfg_sheet) = "EquipV1Affix";
  option (cfg_source_file) = "EquipV1Affix.xlsx";
  option (cfg_primary_key) = "id";
  // 持久实例按 id 引用词条；已有 id 不删除、不改成另一种效果。
  option (cfg_ids_permanent) = true;

  uint32 id = 1;
  // 1 方向、2 效能、3 通用。只定义词条类别，不借用旧颜色档。
  uint32 pool = 2 [(cfg_index) = true];
  // 1 物攻、2 法攻、3 气血、4 速度、5 治疗、6 护盾、7 物暴、8 法暴、
  // 9 抗物、10 抗法、11 障碍命中、12 障碍抵抗、13 分类减耗。
  uint32 effect = 3;
  // 标量效果为 0。障碍：1 封灵、2 封法、3 封物、4 混乱、5 昏睡、6 冰冻、7 中毒。
  // 减耗：1 物攻、2 法攻、3 治疗、4 护盾、5 封灵、6 封法、7 封物、8 混乱、
  // 9 昏睡、10 冰冻、11 毒系、12 功能辅助。
  uint32 effect_param = 4;
  // 固定值，万分比整数。概率与抵抗显示为百分点，其余显示为百分比。
  uint32 value_permyriad = 5;
  // 此词条对应效果由首发装备提供的全身上限，单位同 value_permyriad。
  uint32 source_cap = 6;
  string name = 7;
  string description = 8;
  uint32 material_id = 9 [(cfg_fk) = "Item"];
  uint32 material_count = 10;
}
