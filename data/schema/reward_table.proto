syntax = "proto3";

// Reward 表的权威 schema。源表 data/Reward.xlsx。
//
// 本文件不参与 protoc 编译,也不进任何语言的构建;导表器直接文本解析它。
// 字段号是从 generated/code/proto/reward_table.proto 抄来的现状值,**只增不改、删字段用 reserved**。

package mmorpg.cfgtable.v1;

import "cfg_options.proto";

message Rewardreward {
  uint32 reward_item = 1;
  uint32 reward_count = 2;
}

message RewardTable {
  option (cfg_sheet)       = "Reward";
  option (cfg_source_file) = "Reward.xlsx";
  option (cfg_primary_key) = "id";

  uint32 id = 1 [(cfg_bit_index) = true];
  repeated Rewardreward reward = 2 [(cfg_slots) = 2];
}
