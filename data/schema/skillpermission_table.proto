syntax = "proto3";

// SkillPermission 表的权威 schema。源表 data/SkillPermission.xlsx。
//
// 本文件不参与 protoc 编译,也不进任何语言的构建;导表器直接文本解析它。
// 字段号是从 generated/code/proto/skillpermission_table.proto 抄来的现状值,**只增不改、删字段用 reserved**。

package mmorpg.cfgtable.v1;

import "cfg_options.proto";

message SkillPermissionTable {
  option (cfg_sheet)       = "SkillPermission";
  option (cfg_source_file) = "SkillPermission.xlsx";
  option (cfg_primary_key) = "id";

  uint32 id = 1;
  repeated uint32 skill_type = 2 [(cfg_slots) = 6, (cfg_tip_ref) = true];
}
