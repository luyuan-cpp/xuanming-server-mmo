syntax = "proto3";

// ActorActionCombatState 表的权威 schema。源表 data/ActorActionCombatState.xlsx。
//
// 本文件不参与 protoc 编译,也不进任何语言的构建;导表器直接文本解析它。
// 字段号是从 generated/code/proto/actoractioncombatstate_table.proto 抄来的现状值,**只增不改、删字段用 reserved**。

package mmorpg.cfgtable.v1;

import "cfg_options.proto";

message ActorActionCombatStatestate {
  uint32 state_mode = 1;
  uint32 state_tip = 2;
}

message ActorActionCombatStateTable {
  option (cfg_sheet)       = "ActorActionCombatState";
  option (cfg_source_file) = "ActorActionCombatState.xlsx";
  option (cfg_primary_key) = "id";

  uint32 id = 1;
  int32 constants_name = 9001 [(cfg_owner) = "constants_name"];
  repeated ActorActionCombatStatestate state = 2 [(cfg_slots) = 3];
}
