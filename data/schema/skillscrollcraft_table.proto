syntax = "proto3";

// 率土式分卷宗永久技能制书配置表。源表 data/SkillScrollCraft.xlsx。
package mmorpg.cfgtable.v1;
import "cfg_options.proto";

message SkillScrollCraftTable {
  option (cfg_sheet) = "SkillScrollCraft";
  option (cfg_source_file) = "SkillScrollCraft.xlsx";
  option (cfg_primary_key) = "id";
  option (cfg_hot_reload) = true;

  // 卷宗编号（对应 Skill.scroll_id）。
  uint32 id = 1;
  // 卷宗名称（如 五行本源卷 / 首发绝学卷 / 兵法成长卷）。
  string name = 2;
  // 卷宗说明。
  string description = 3;
  // 稀有度层级：0 = 常规卷宗（支持随机/定向拓印与拆页），1 = 稀世绝学卷宗（双轨定向合成，占比硬锁 <= 10%）。
  uint32 rarity_tier = 4;
  // 通用悟道残页物品 ID（3406）。
  uint32 fragment_item_id = 5 [(cfg_fk) = "Item"];
  // 常规随机拓印消耗残页数（稀世卷宗为 0）。
  uint32 random_fragment_count = 6;
  // 常规随机拓印消耗银两。
  uint64 random_gold_cost = 7;
  // 常规定向拓印消耗残页数（稀世卷宗为 0）。
  uint32 targeted_fragment_count = 8;
  // 常规定向拓印消耗银两。
  uint64 targeted_gold_cost = 9;
  // 多余未学常规书拆页返还的通用悟道残页数（80% = 16，稀世为 0）。
  uint32 dismantle_fragment_count = 10;
  // 稀世绝学残卷物品 ID（3407，常规卷宗为 0）。
  uint32 rare_scroll_item_id = 11;
  // 稀世绝学残卷消耗数。
  uint32 rare_scroll_count = 12;
  // 稀世绑定天工秘墨物品 ID（3408，常规卷宗为 0）。
  uint32 rare_ink_item_id = 13;
  // 稀世天工秘墨消耗数。
  uint32 rare_ink_count = 14;
  // 稀世定向制书消耗银两。
  uint64 rare_gold_cost = 15;
  // 是否启用（1 = 启用，0 = 停用）。
  uint32 enabled = 16;
}
