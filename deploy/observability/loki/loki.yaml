# Loki 单机(single-binary)配置:本地开发用,日志落在容器内 /loki(docker 卷 loki-data)。
# 只保留 7 天;时间戳早于 7 天的旧行直接拒收(本机日志文件可能几周没清,旧行没必要入库)。
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

ingester:
  # 为什么首次接入时旧日志要等几分钟才查得到:
  # 单机模式(target=all)下,querier 对「now - ingester.query_store_max_look_back_period」以内的时间段
  # 只查 ingester 内存,更早的只查落盘存储。这个窗口由 Loki 自己按 max_chunk_age + 41m 算出来
  # (本机 2h41m,见 http://localhost:3100/config),配置文件里写不小于它的正值会直接启动失败。
  # Alloy 首次会把几小时前的旧日志一次灌进来,它们时间戳老、又还在内存里没落盘,所以两头都查不到;
  # 把闲置落盘时间从默认 30m 缩到 3m,让这些块尽快进存储(本机实测 7 分钟内全部可查)。
  # 实时写入的新日志不受影响,立刻可见。
  #
  # 注意:querier.query_ingesters_within 这个键在 3.5 仍然存在(顶层 querier 段,默认 3h),
  # 当初容器反复重启是因为把它错写进了 limits_config,不是因为这个键被删了。
  # 想让任意时间段都查 ingester,可以在 querier 段调大它,或设
  # ingester.query_store_max_look_back_period: -1(仅限本地 filesystem 单机,别照搬到集群)。
  chunk_idle_period: 3m
  max_chunk_age: 2h

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h   # 超过 7 天的旧行不收,和下面的保留天数对齐(否则收进来也会很快被删掉)
  retention_period: 168h              # 只留 7 天
  allow_structured_metadata: true
  volume_enabled: true                # Grafana「日志量」面板 / Logs Drilldown 需要
  discover_log_levels: true           # 没打 level 标签的行由 Loki 自己猜一个 detected_level
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 32MB
  max_query_series: 2000

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  retention_delete_delay: 2h

pattern_ingester:
  enabled: true                       # Grafana Logs Drilldown 的「模式」视图

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

analytics:
  reporting_enabled: false
