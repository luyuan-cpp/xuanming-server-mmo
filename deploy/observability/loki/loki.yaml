# Loki 单机(single-binary)配置:本地开发用,日志落在容器内 /loki(docker 卷 loki-data)。
# 只保留 7 天;时间戳早于 7 天的旧行直接拒收(本机日志文件可能几周没清,旧行没必要入库)。
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

ingester:
  # Loki 3.5 只向 ingester 内存查「最近约 max_chunk_age + chunk_idle_period」这一段;
  # 首次接入时 Alloy 会把几小时前的旧日志一次灌进来,这些老时间戳的块在内存里
  # 没落盘前查不到。把闲置落盘时间从默认 30m 缩短到 3m,旧日志要晚几分钟才出现(本机实测 7 分钟内);
  # 实时写入的新日志不受影响,立刻可见。(3.x 已没有 query_ingesters_within 这个键)
  chunk_idle_period: 3m
  max_chunk_age: 2h

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h   # 超过 7 天的旧行不收,和下面的保留天数对齐(否则收进来也会很快被删掉)
  retention_period: 168h              # 只留 7 天
  allow_structured_metadata: true
  volume_enabled: true                # Grafana「日志量」面板 / Logs Drilldown 需要
  discover_log_levels: true           # 没打 level 标签的行由 Loki 自己猜一个 detected_level
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 32MB
  max_query_series: 2000

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  retention_delete_delay: 2h

pattern_ingester:
  enabled: true                       # Grafana Logs Drilldown 的「模式」视图

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

analytics:
  reporting_enabled: false
