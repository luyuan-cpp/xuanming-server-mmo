# ────────────────────────────────────────────────────────────────
# Container-side override of go/login/etc/login.yaml for the
# docker-compose.login-stack.yml setup.
#
# Why an override (not env vars only): go-zero reads its config via
# conf.MustLoad, which has limited env-substitution support compared
# to Spring Boot. Keeping a full yaml here is simpler than chasing
# every nested key through env-var indirection.
#
# How this differs from the in-tree go/login/etc/login.yaml:
#   - Etcd / Kafka / Redis hosts point at host.docker.internal (so the
#     docker-compose.yml infra stack on the host is reachable).
#   - ListenOn changed back to :51000 (Hyper-V port reservation is
#     a Windows-host problem; Linux containers don't hit it).
#   - AuthProviders.WeChat / QQ have Endpoint pointed at the sibling
#     sandbox-mock container so the OAuth chain runs offline.
#   - Prometheus block enabled on 0.0.0.0:9101 (container-internal)
#     so the host-published :9101 scrape works.
#   - SnowflakeCacheDir pinned to /tmp/snowflake (image WORKDIR is /app,
#     so the Go default ../../run/snowflake would land on /run/snowflake).
#   - DataServiceRpc discovers data_service through the host etcd; this
#     compose has no data_service container, see the block below.
#
# To switch from sandbox-mock to real WeChat/QQ:
#   - delete AuthProviders.WeChat.Endpoint
#   - delete AuthProviders.QQ.Endpoint
#   - put the real AppId in the block; replace AppSecret with
#     AppSecretEnv: "LOGIN_WECHAT_APP_SECRET" and pass that variable to
#     the container (inline AppSecret is accepted only because Mode=dev;
#     any other Mode refuses to start, and "${VAR}" is never expanded)
#   - restart only the `login` container
# ────────────────────────────────────────────────────────────────

Name: login.rpc
Mode: dev
ListenOn: 0.0.0.0:51000
Timeout: 4000 # 与 go/login/etc/login.yaml 同值(2026-10-14 由 10000 改为 4000:预算链要求 ≤ 路由服 ForwardTimeoutMs - 1000,见 docs/design/client-request-ordering.md §5)

Etcd:
  Hosts:
    - host.docker.internal:2379
  Key: login.rpc

Node:
  ZoneId: 1
  SessionExpireMin: 30
  MaxLoginDevices: 3
  LeaseTTL: 500
  QueueShardCount: 50
  MaxLoginDuration: 5m
  LogoutGraceTime: 5s
  RedisClient:
    Host: host.docker.internal:6379
    Password: ""
    DB: 0
    DefaultTTL: 24h
    DialTimeout: 3s
    ReadTimeout: 3s
    WriteTimeout: 3s

Snowflake:
  Epoch: 1721473263000
  NodeBits: 13
  StepBits: 9

# 部署级集群号(PlayerId 13 位 node 段的 cluster 位)。单机 compose 栈保持 0,
# 与 go/login/etc/login.yaml 一致;两个集群共用一个 etcd 也不撞号。
ClusterId: 0

# PlayerId 槽位本地缓存目录(docs/design/node-id-overhaul-plan-20260908.md §3.5):
# etcd 启动时不可达、缓存在 2h 内则用缓存的槽起服。镜像 WORKDIR 是 /app,Go 默认的
# ../../run/snowflake 会落到 /run/snowflake;与 K8s ConfigMap 一样显式指到 /tmp/snowflake
# (容器内可写,不挂卷:缓存是本容器自己的启动期草稿,重建容器就重新申领)。留空关闭。
SnowflakeCacheDir: /tmp/snowflake

Locker:
  AccountLockTTL: 30
  PlayerLockTTL: 30

Account:
  MaxDevicesPerAccount: 3
  MaxPlayersPerAccount: 5
  CacheExpire: 10m

Registry:
  Etcd:
    Hosts:
      - host.docker.internal:2379
    Key: login.rpc
    DialTimeout: 5s

Timeouts:
  EtcdDialTimeout: 5s
  ServiceDiscoveryTimeout: 10s
  TaskWaitTimeout: 30s
  LoginTotalTimeout: 30s
  RoleCacheExpire: 10m

PlayerLocatorRpc:
  Etcd:
    Hosts:
      - host.docker.internal:2379
    Key: playerlocator.rpc

SceneManagerRpc:
  Etcd:
    Hosts:
      - host.docker.internal:2379
    Key: scenemanagerservice.rpc

# DataService gRPC client (discovered via etcd)。PlayerId 号段(DataService.AllocateIdSegment)、角色名登记,
# 以及每次登录角色列表上的归属查询(BatchGetPlayerHomeZone)共用这一条连接(2026-10-18 更正:原注释「只用它领号段」已过时)。
# NonBlock: true —— 号段是弱依赖(设计稿 §6.5):data_service 没起时 login 照常起服,
# 领段失败即拒绝建角。
# Breaker: true —— 与 go/login/etc/login.yaml、K8s ConfigMap 一致(2026-10-18 起):data_service 僵住但 etcd 键还在时,
# 登录的归属查询快速失败、按「保留建角 zone」放行,不让每次登录都白等满查询预算。
# ⚠️ 本 compose 栈没有 data_service 容器:要走建角,得在宿主上起 go/data_service
# (它注册到同一个 host.docker.internal:2379 的 etcd,这里就能发现它),
# 且宿主 MySQL 里要有它的库(deploy/mysql-init/00_init_zone_dbs.sql 建的 testdb)。
DataServiceRpc:
  Etcd:
    Hosts:
      - host.docker.internal:2379
    Key: dataservice.rpc
  Timeout: 3000
  NonBlock: true
  Middlewares:
    Breaker: true

# PlayerId 号段发号(docs/design/node-id-overhaul-plan-20260908.md §6),与 go/login/etc/login.yaml 同值。
# Enabled:**只有显式写 true 才开**;整块不写 = 关 = 发不出 id,建角一律失败。
# Step:每次领段长度,按「10 分钟峰值建角量」配;双 buffer 意味着库倒下后还能发完两段。
# 号段失败即建角失败(tip kLoginDataSerializeFailed),靠 data_service 的可用性兜底,没有回退。
IdSegment:
  Enabled: true
  Step: 100

# ─────────────────────────────────────────────────────────────────────────
# 建角钉存储落点(docs/design/player-storage-placement.md §8.3 / §13)
#
# PinOnCreate:true = CreatePlayer 在同一次 RegisterPlayerZone 里让 data_service 与 player:zone
#   原子一起写 player:placement = "{storage}:1"。全球服务必须显式 true,缺键或 false 拒启。
# NewPlayerStorageId:新号钉到哪个落点库;0 = 本 login 所在 zone(Node.ZoneId);
#   1..999999 = zone_{id}_db,>=1000000 = player_store_{id}_db(Phase 2 全局库填 1000000)。
#   启动日志 "[placement] pin_on_create=..." 是核对依据。
Placement:
  PinOnCreate: true
  NewPlayerStorageId: 0

GateTokenSecret: "change-me-in-production-use-a-strong-random-key"
TableDir: "/app/data"

# Default to true preserves backward compatibility; flip to false
# once T+1 telemetry shows the legacy_login_count is below threshold.
# See ARCH §12 + docs/notes/todo.md #224.
# 只关 gate 上的口令 / 第三方凭据登录;gate 上 auth_type=access_token 的
# 会话绑定(新流程必经一步)不受影响;被关的请求在认证之前就回 kLoginUnknownError,
# 见 go/login/etc/login.yaml 同名项。
LegacyGateLoginEnabled: true

TokenConfig:
  AccessTokenTTL: 2h
  RefreshTokenTTL: 720h

# 只供这个本地 compose 栈的 robot_ 冒烟/压测账号使用。共享密钥本身由
# compose 从宿主环境传入，绝不能写进此文件；Mode=dev 是第二道启动门禁。
DevPasswordAuth:
  Enabled: true
  SharedSecretEnv: "LOGIN_DEV_PASSWORD_SHARED_SECRET"
  AllowedAccountPrefixes:
    - "robot_"

# Prometheus scrape — exposed to the host via port 9101 in compose.
Prometheus:
  Host: 0.0.0.0
  Port: 9101
  Path: /metrics

AuthProviders:
  # WeChat — points at sandbox-mock for offline e2e. Replace with
  # real AppId + AppSecretEnv and delete the Endpoint line for production.
  # RequireUnionId 缺省 true:mock 只对以 U 开头的 code 返回 unionid,其余 code 会被拒绝(故障码 LoginAuthProviderUnavailable)。
  WeChat:
    AppId: "wx_sandbox_appid"
    AppSecret: "sandbox_secret_keep_it_local"
    Endpoint: "http://sandbox-mock:18090"

  # QQ — same pattern as WeChat. AppId 必须等于 sandbox-mock 固定返回的 client_id(100000001,
  # go/login/cmd/sandbox_mock),否则每次都按 client_id mismatch 拒绝。QQ 不需要 AppKey。
  QQ:
    AppId: "100000001"
    Endpoint: "http://sandbox-mock:18090"

Kafka:
  Brokers:
    - host.docker.internal:9092
  DialTimeout: 10s
  ReadTimeout: 30s
  WriteTimeout: 30s

PreloadPool:
  Size: 256
  StatsInterval: 30s
