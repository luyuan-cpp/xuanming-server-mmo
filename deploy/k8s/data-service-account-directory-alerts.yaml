# Prometheus alert rules for 账号目录里「失败只记日志、不改结局」的几步与后台收尾(data_service)。
#
# 来源:docs/design/guild-phase2/03-names.md §3.4a(名字行「预留 → 绑定」、删角释放名字)、
#       docs/design/horizontal-scale-logical-db.md §5.2(后台判陈旧标保留的建角 ref)、docs/ops/mysql-backup-pitr-runbook.md §4.1a(核账)。
# 指标定义(名字以代码为准,本文件只引用;tools/scripts/tests/data_service_account_directory_alerts_contract.tests.ps1 从源码核对):
#   - go/data_service/internal/metrics/account_directory.go(装配时 PrimeAccountDirectory 以 0 预置全部计数序列):
#       data_service_account_role_name_bind_failures_total{reason}      建角提交之后名字没绑上;reason 取值在 store.NameBindFailureReasons
#       data_service_account_role_removal_settle_failures_total{step}   删角墓碑之后的收尾没做完(前台删角与后台收尾都计);step 取值在 store.RemovalSettleSteps
#       data_service_account_role_removal_resume_total{result}          后台 ResumeRemovals 每一行的结局 finished | abandoned | unsettled | failed
#       data_service_account_role_ref_held                              后台判陈旧标了保留、等人处理的建角 ref 条数(各账号片合计,每个副本报同一个值)
#   - go/data_service/internal/metrics/metrics.go:
#       data_service_account_role_ref_tombstone_held_total              新标成保留的建角 ref 条数(同一条只计一次;只进看板,告警按上面的 gauge)
#
# Install as a PrometheusRule CR (kube-prometheus stack),与 owner-epoch-alerts.yaml 同法:
#   kubectl apply -n observability -f deploy/k8s/data-service-account-directory-alerts.yaml
#
# Scrape prerequisites(未满足时下面全部是哑的):同 data-service-route-alerts.yaml 文件头 —— data_service 只有 Prometheus 注解
#   (manifests/go-svc/data-service.yaml 的 prometheus.io/scrape|port|path,:9260),没有 ServiceMonitor / PodMonitor;规则按 namespace 分组
#   (data_service 一个 zone 一个 namespace),改用按注解抓取的 job 时 relabel 必须写出 namespace。
#
# 口径:
#   - 这几步失败都不改业务结局(角色照样建成、删角照样成功),所以都是 warning;但每一次都意味着名字或 ref 停在要人看的状态,
#     健康时这些计数恒为 0、保留 ref 恒为 0,故按「出现即报 / 持续即报」定,不依赖压测基线。
#   - 一次性的失败(绑定、删角释放名字)按 15 分钟窗口里出现过就报,for 1m 滤掉单次抓取抖动;后台每分钟重试的(收尾、保留 ref)
#     要持续 15 分钟才报:后台补上了就不该把人叫起来。
#   - 逐条的 player_id 只在日志里(不进 label,AGENTS.md §9)。
#
# Severity conventions(与 scene-manager-alerts.yaml 相同):
#   critical = pager, someone wakes up
#   warning  = next-business-hours channel
#   info     = dashboard annotation / trend signal
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: data-service-account-directory-alerts
  labels:
    app: data-service
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: data-service.account-directory
      interval: 30s
      rules:
        # 建角已经提交,名字行却还是预留态(或者名字在别人名下)。角色照样能玩;预留态的名字仍受释放之前的证明保护,
        # 但不是「只有删角能释放」。taken / conflict 是一名两角或 ID 复用,要人裁决。
        - alert: DataServiceRoleNameBindFailed
          expr: |
            sum by (namespace, reason) (increase(data_service_account_role_name_bind_failures_total[15m])) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 有建成的角色名字没绑上({{ $labels.reason }})"
            description: >-
              过去 15 分钟约 {{ $value | printf "%.0f" }} 次。逐条的 player 在 data_service 日志 `[player-name] name of a committed role is not bound` 行。
              error / role_mismatch / role_removed / rules_changed:同一建角重放会补上;不重放就跑 create_residual(plan,再 -mode apply -repair name),
              它报 name_unbound 并置为已绑定。taken / conflict:名字登记在别的角色名下,两边都不动,记工单交负责人定(v1 没有改名)。

        # 删角墓碑已提交,释放名字或删 account_role_removal 那一行失败。名字留在已删的角色名下,别人登记不了,不会一名两角;
        # 后台 ResumeRemovals 每分钟接着做,补上了这条会在 15 分钟后自己消失。
        - alert: DataServiceRemovedRoleNameReleaseFailed
          expr: |
            sum by (namespace, step) (increase(data_service_account_role_removal_settle_failures_total[15m])) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 删角之后的收尾失败({{ $labels.step }})"
            description: >-
              过去 15 分钟约 {{ $value | printf "%.0f" }} 次。release_name 多半是名字片不可达或被冻结,drop_removal_row 是玩家片写失败;
              逐条的 player 在 `[player-name] name of a removed role is not released yet` / `[account-role-removal] removal row of a settled role not dropped` 行。
              后台收尾会重试;同时响 DataServiceRoleRemovalResumeStuck 说明重试也没成,按那一条处理。

        # 后台删角收尾持续没做完:收尾失败(unsettled,墓碑已提交、名字没放)或删角本身做不下去(failed,参与者不可达、库出错)。
        - alert: DataServiceRoleRemovalResumeStuck
          expr: |
            sum by (namespace, result) (increase(data_service_account_role_removal_resume_total{result=~"unsettled|failed"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 后台删角收尾持续没做完({{ $labels.result }})"
            description: >-
              已持续 15 分钟,过去 15 分钟约 {{ $value | printf "%.0f" }} 行。unsettled:墓碑已提交,名字片或玩家片还写不进去,名字暂时没人能用;
              查名字片 / 玩家片是否被搬库冻结(route_meta.writable)或不可达。failed:删角的两阶段做不下去,查参与者(guild、trade、mail、match、
              player_inbox、friend、流水库)是否就绪。日志 `[role-fence] resume removals` 行有每一轮的计数。
              名字片恢复点早于删角释放留下的名字不在这里(小表那一行已删):跑 create_residual,它报 removed_role_name。

        # 后台判陈旧留下、等人处理的建角 ref:角色行不在,却有提交过的证据(名字已绑定、存档进过场、别的账号上有 ACTIVE ref)或证据核不全。
        # 多集群恢复点错开时才会有;标了保留的不再占扫描名额,只在复核名额里轮着重判,人把角色行补回来之后会自己收掉。
        - alert: DataServiceRoleRefHeldForReview
          expr: |
            max by (namespace) (data_service_account_role_ref_held) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 有建角 ref 留着等人处理"
            description: >-
              现在 {{ $value | printf "%.0f" }} 条,已持续 15 分钟。角色行不在,但角色像是提交过:后台不写墓碑(墓碑不可逆)。
              按 docs/ops/mysql-backup-pitr-runbook.md §4.1a「反方向残留」处理:
              逐条的 player 和证据在 data_service 日志 `[account-role-ref] stale create ref kept without a tombstone` 行,
              也可以按账号片查 `SELECT account,player_id,held_reason FROM account_role_ref WHERE state=1 AND held_ms>0`。
              能把玩家片恢复到更靠近 T 的点就补回角色行,复核一轮之内自动补 ACTIVE、计数降回 0;不能就记工单交负责人定。
