# gateNodePortBase(D88):external + NodePort 时 gate-<i> 的 nodePort = gateNodePortBase + i。
# 10 个 zone 按步长 8 错开(30000、30008 … 30072),全部收在 K8s 静态子段 30000-30085 内,
# 每 zone 的 gate 扩到 8 副本前都不重叠;podip 模式不读它。键单独占一行、行尾不写注释。
zones:
  - name: zone-1
    zoneId: 1
    gateNodePortBase: 30000
    replicas:
