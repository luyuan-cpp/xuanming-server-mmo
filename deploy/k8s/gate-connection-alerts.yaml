# gate 客户端连接准入的告警(docs/design/gate-connection-admission-control.md P1-1 ~ P1-4)。
#
# 指标由 gate 的 Prometheus 出口导出(环境变量 MMORPG_METRICS_PORT,k8s_deploy.ps1 -CppMetricsPort 缺省 9400),
# 定义在 cpp/nodes/gate/handler/rpc/connection_admission.cpp 的 CollectMetrics:
#   - gate_connections_current / gate_connections_max:会话数与生效上限;
#   - gate_unauthenticated_connections:还没验签的连接数。握手期限是 10 秒,正常客户端毫秒级验签,
#     这个数「高且不周转」就是有连接占着位置不验签;「低但 gate_accepted_total 涨得快」是正常洪峰;
#   - gate_accepted_total:接纳的连接,rate() 就是新建连接速率;
#   - gate_rejected_total{reason}:被拒的连接,reason ∈ capacity / accept_rate / shutting_down / not_ready / no_token_secret;
#   - gate_handshake_duration_ms:建连到验签成功的耗时直方图;
#   - gate_preauth_reaped_total:建连满握手期限仍未验签、被关掉的连接。
# 规则引用的指标名与 reason 取值由 tools/scripts/tests/gate_connection_alerts_contract.tests.ps1 对照 C++ 源码钉住。
# 处置见 docs/ops/gate-kernel-tuning-runbook.md §3.2。
#
# 安装(与其余告警文件相同,手工 apply):
#   kubectl apply -n observability -f deploy/k8s/gate-connection-alerts.yaml
#
# Severity conventions(与 scene-manager-alerts.yaml 相同):
#   critical = pager, someone wakes up
#   warning  = next-business-hours channel
#   info     = dashboard annotation / trend signal
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gate-connection-alerts
  labels:
    app: gate
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: gate.connections
      interval: 30s
      rules:
        # 会话数逼近上限。login 挑 gate 时在 90% 就剔除这台(gate-load-balancing-design.md),持续高于 90% 说明
        # 这个 zone 的 gate 台数不够,或者有流量绕过了 login 的分配。
        - alert: GateConnectionsNearCapacity
          expr: |
            max by (namespace, instance) (gate_connections_current / gate_connections_max) > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的 {{ $labels.instance }} 会话数已超过连接上限的 90%({{ $value | printf \"%.2f\" }})"
            description: >-
              先看同 zone 其余 gate 的 gate_connections_current:都高就加 gate 台数或调大 GateMaxConnections
              (同时核对 fd 上限与内存限额);只有这一台高,对照 gate_unauthenticated_connections 看是不是被未验签连接占住。
            runbook_url: docs/ops/gate-kernel-tuning-runbook.md

        # 满员拒绝发生了:新连接在 accept 之后被 RST。玩家看到的是连不上这台 gate。
        - alert: GateRejectingAtCapacity
          expr: |
            sum by (namespace, instance) (increase(gate_rejected_total{reason="capacity"}[5m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的 {{ $labels.instance }} 因满员拒绝了新连接({{ $value | printf \"%.0f\" }} 条 / 5 分钟)"
            description: >-
              这台 gate 的会话数到了上限。gate_unauthenticated_connections 占比高说明位置被不验签的连接占着
              (它们最多活 10 秒,看 gate_preauth_reaped_total 是否同步上涨);占比低说明是真实玩家满了,加台数。
            runbook_url: docs/ops/gate-kernel-tuning-runbook.md

        # 新建连接速率闸在拒绝。缺省桶深等于连接上限、持续速率是上限的 1%/秒:一台 gate 从零接满不会碰到它,
        # 碰到说明短时间内的建连量超过了「一整台 + 周转」,要么是不停建连又断开的流量,要么是阈值相对真实洪峰偏低。
        - alert: GateAcceptRateLimited
          expr: |
            sum by (namespace, instance) (increase(gate_rejected_total{reason="accept_rate"}[5m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的 {{ $labels.instance }} 新建连接超过速率上限,已拒绝 {{ $value | printf \"%.0f\" }} 条 / 5 分钟"
            description: >-
              用两个指标区分洪峰与攻击:gate_unauthenticated_connections 低、gate_handshake_duration_ms 正常,
              说明连进来的都在正常验签,是真实洪峰,按运维手册用 GATE_ACCEPT_RATE_PER_SECOND / GATE_ACCEPT_BURST 调高;
              未验签连接数高、gate_preauth_reaped_total 上涨,说明是只建连不验签的流量,速率闸在按设计工作,去上游(L4 / 防火墙)处置来源。
            runbook_url: docs/ops/gate-kernel-tuning-runbook.md

        # 未验签连接长期占着位置。正常客户端建连后毫秒级验签,未验签连接数平时接近 0;
        # 速率闸把只建连不验签的来源稳态下压在上限的 10% 以内,持续高于 5% 就是有这样的来源在持续建连。
        - alert: GateUnauthenticatedConnectionsHigh
          expr: |
            max by (namespace, instance) (gate_unauthenticated_connections / gate_connections_max) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的 {{ $labels.instance }} 未验签连接占连接上限的 {{ $value | printf \"%.2f\" }},已持续 2 分钟"
            description: >-
              有连接建连后不发验签请求、占着会话位置直到 10 秒握手期限。看 gate 日志里采样的
              `[ClientHeartbeat] connection rejected (sampled), reason=handshake_timeout` 与
              `Client connections accepted (sampled)` 行里的 latest_peer 找来源;login / 路由服故障导致客户端拿不到票据时
              不会出现这种形态(那时客户端根本不会来连 gate)。
            runbook_url: docs/ops/gate-kernel-tuning-runbook.md

        # 握手期限在持续收割连接:每秒超过 1 条、持续 5 分钟。偶发的收割(客户端建连后网络断了)是常态,持续的不是。
        - alert: GatePreauthConnectionsReaped
          expr: |
            sum by (namespace, instance) (rate(gate_preauth_reaped_total[5m])) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的 {{ $labels.instance }} 持续关闭未验签连接({{ $value | printf \"%.1f\" }} 条 / 秒)"
            description: >-
              建连满 10 秒仍未验签的连接在被持续关闭。对照 gate_handshake_duration_ms:P99 也在变慢说明是网络或 gate 自身卡顿
              让正常客户端来不及验签(看 loop 延迟与 CPU);P99 正常说明这些连接本来就不打算验签,按 GateUnauthenticatedConnectionsHigh 处置。
            runbook_url: docs/ops/gate-kernel-tuning-runbook.md

        # 握手变慢:验签成功的连接里 P99 超过 3 秒。握手期限是 10 秒,P99 到 3 秒说明正常客户端离被误关已经不远。
        - alert: GateHandshakeSlow
          expr: |
            histogram_quantile(0.99, sum by (namespace, instance, le) (rate(gate_handshake_duration_ms_bucket[5m]))) > 3000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的 {{ $labels.instance }} 握手 P99 为 {{ $value | printf \"%.0f\" }} 毫秒,已持续 10 分钟"
            description: >-
              建连到验签成功的耗时变长。gate 的验签是同步的本地计算,耗时主要在客户端到 gate 的网络与 gate 的 loop 排队:
              看这台 gate 的 CPU、loop 延迟与下行积压;多台 gate 同时变慢多半是客户端网络或入口 LB 的问题。
              握手期限(client_liveness.h 的 handshakeTimeout)要不要调,以这个直方图的 P99.9 为准。
            runbook_url: docs/ops/gate-kernel-tuning-runbook.md
