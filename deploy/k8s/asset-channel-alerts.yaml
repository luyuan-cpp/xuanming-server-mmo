# Prometheus alert rules for the asset channel (通用资产通道) and guild trial results (帮会历练结果).
#
# 来源:docs/design/landing-recovery-sync-digest.md §6.5(超窗处置与对账);
#       资产通道本身见 docs/design/guild-phase2/04-asset-channel.md(§4.38 的原三条规则在此按类别重写)。
#
# Install as a PrometheusRule CR (kube-prometheus stack),与 owner-epoch-alerts.yaml 同法:
#   kubectl apply -n observability -f deploy/k8s/asset-channel-alerts.yaml
#
# Scrape prerequisites:
#   - guild / trade 的指标端口已开放并有 ServiceMonitor / PodMonitor 指向它。
#     guild 目前在 K8s 上没有部署清单;trade 的资产通道默认关闭(AssetOp.Enabled=false)。
#     这两件事落地之前,本文件里 assetop_* 与 guild_trial_* 规则不会触发。
#   - assetop_* 的 service 是 ConstLabel(guild / trade / mail / data_service),按服务区分时用 by (service)。
#     data_service 随 zone 部署(每个 zone namespace 一份),按片分工的成员表也只圈本 zone,所以 asset-channel.work-shards
#     组按 (namespace, service) 聚合;guild / trade / mail 是全局服务,只在 infra namespace 一份,加上 namespace 结果不变。
#   - trade_commerce_* 只由 trade 暴露,同样要等 trade 的资产通道打开(AssetOp.Enabled=true)才会有数据。
#
# 为什么「最老年龄」只看 online_retry 类:离线玩家的 PENDING 行会把不分类的
# assetop_pending_oldest_age_seconds 永久推高(停放档 30 分钟一次、180 天后才放弃),
# 按 04 §4.38 的原规则会常响。按类拆分的 gauge 由每日对账(Auditor,leader 副本)刷新。
#
# scene / battle 等 C++ 节点有 Prometheus 出口(环境变量 MMORPG_METRICS_PORT,k8s_deploy.ps1 -CppMetricsPort 缺省 9400),
# scene 已导出 scene_travel_handoff_*、scene_owner_epoch_events_total{event}、scene_player_store_save_refused_total{result}
# (cpp/libs/services/scene/player/system/player_ownership_metrics.{h,cpp})。但下面这些结算类信号目前没有导出,
# 仍只存在于结构化日志(metric=...),而 Loki ruler 目前没有挂载规则目录、也没有 alertmanager_url。
# 下列 LogQL 先作为值班固定查询,ruler 接线(上线批 BK8s)之后转为规则;哪个信号导出成指标了,就把它的查询改成 PromQL 规则。
# 流选择器与 player-inbox-alerts.yaml 同一写法:C++ 业务日志由每个 Pod 的 Alloy sidecar 读文件送 Loki
# (k8s_deploy.ps1 Get-CppLogSidecarConfigAlloy),流标签只有 env / namespace / pod / zone / service / job / lang / level,
# **没有 app**:写成 {app="battle"} 的查询匹配不到任何流,恒为空。battle 写 {job="cpp_nodes", service="battle"}
# (三种 battle 编排都挂同一个 sidecar,全局池的 zone 是 "global"),scene 写 {job="cpp_nodes", service="scene"};
# service 取自日志文件名前缀(NodeTypeToShortName)。本机观测台(deploy/observability/alloy/config.alloy)同一写法可用。
# 契约测试 k8s_deploy_contract.tests.ps1「LogQL 契约」逐条核对下面用到的标签都在 sidecar 配置里。
#   critical: count_over_time({job="cpp_nodes", service="battle"} |= "metric=battle_personal_settlement_staging_exhausted_rooms" [10m]) > 0
#             SQL 终局迟迟没有决定的房间(原件无效、或越过了快速重放跨度)留在节点上,节点不会自然排空(metric 名沿用已登记的值班查询)。
#             滞留定时器每 60s 报一行 sql_unconfirmed=滞留房间数 stuck_total=同值 node_rooms=本节点房间总数,正文列出 battle_id,
#             房间清掉之前一直会响。前因是一次性的 metric=battle_sql_outcome_unconfirmed(越过快速重放跨度)与
#             metric=battle_sql_outcome_source_invalid(终局原件生成失败)。
#             处置:先查 match 是否可达、CommitBattleOutcome 为什么没有决定,再分三步,不要直接删 Pod
#             (会把同节点上正在打的房间一起作废):
#               1. kubectl -n mmorpg-infra label gs <name> mmorpg.io/drain=true(进程 5s 内读到,拒绝新房间);
#               2. 等提醒行的 node_rooms 降到与 stuck_total 相等(其余房间打完,单局时长上限见 go/match/internal/catalog 的 MaxBattleSeconds,当前 3600s);
#               3. kubectl -n mmorpg-infra delete gs <name>,优雅停机由 AbortAllRooms 清房。
#             慢速重放满跨度仍无决定时房间自己会删(metric=battle_sql_outcome_abandoned),不发布任何终局,由 match 凭持久原件裁决。
#   critical: count_over_time({job="cpp_nodes", service="battle"} |= "metric=battle_sql_outcome_key_unavailable" [10m]) > 0
#             没有终局提交密钥(MMORPG_MATCH_OUTCOME_SECRET_BATTLE),这个节点的终局协议停用,对局结果提交不了。
#   critical: count_over_time({job="cpp_nodes", service="battle"} |~ "metric=battle_settlement_source_(invalid|missing|member_mismatch)" [10m]) > 0
#             个人结算原件生成失败或与成员对不上:source_invalid 时终局保持未知;missing / member_mismatch 时不派发终局。正文没有玩家明细,按时间对 match 库。
#   warning : count_over_time({job="cpp_nodes", service="battle"} |= "metric=battle_sql_outcome_unflushed_at_shutdown" [10m]) > 0
#             节点停机时还有没落定的终局,逐局一行。出站通道已关,由 match 凭持久原件裁决;按 battle_id 核对 match_battle_completion。
#   warning : count_over_time({job="cpp_nodes", service="scene"} |= "metric=battle_settlement_item_guid_shortage" [10m]) > 0
#             物品号段不够发这局的掉落,整份结算延后到号段够用(不丢);预检判出不足时已主动续段(GuidSegmentClient::RequestTopUp),
#             持续出现查发号器与 data_service。
#   warning : count_over_time({job="cpp_nodes", service="scene"} |= "metric=battle_freeze_hold_cap_reached" [10m]) > 0
#             (2026-11-06,r2-v1#1 残余)FIGHTING 冻结到期查 SQL 终局后续冻,续到上限(到期 + 15 分钟)仍没应用就照常解冻并打这一行:
#             要么 match 写了 COMPLETE 而收件箱一直没投到,要么有原件却迟迟没有终局(match 不可用或 ABORT 补写滞后)。
#             解冻只放开人:这一局带进战斗的道具仍被预留押着(2026-11-10),结算再到照样从预留里扣,不再按持有量夹紧;
#             正文有 battle_id,按它核对 match_battle_completion 与收件箱。设计见 docs/design/turn-battle-gap-closure.md §11
#             与 docs/design/battle-item-reservation.md。
#   warning : count_over_time({job="cpp_nodes", service="scene"} |= "metric=battle_item_hold_overdue" [10m]) > 0
#             (2026-11-10)冻结已经不在,这一局带进战斗的道具还押在预留里,越过「冻结到期 + 15 分钟」仍没收尾,每局每 10 分钟一行。
#             预留只在结算应用、或 SQL 终局是 ABORT / 没有可裁决原件时释放;COMPLETE、终局未定、查不到都留着,没有上限,
#             这段时间玩家转不走、用不掉押着的那几样道具(人照常能玩)。前因与上一条相同:收件箱迟迟没投到,或 match 不可用。
#             正文有 player_id 与 battle_id,按 battle_id 核对 match_battle_completion 与收件箱;处置见 docs/ops/player-inbox-runbook.md §6.1。
#   warning : count_over_time({job="cpp_nodes", service="scene"} |= "metric=battle_terminal_query_unknown" [10m]) > 20
#             scene 查不到 match 的终局(MatchInternal.GetBattleTerminalDecision:没发出去、传输失败、回包验签不过、带内 retry),
#             按「结果未知」续冻,会一直拖到续冻上限。查 scene 的场景密钥与 match 是否同源、scene 能否发现并连上 match、match 是否可用;
#             偶发属正常(在途超时也计),阈值 20 / 10 分钟是占位,压测出基线后校准。
#   warning : count_over_time({job="cpp_nodes", service="scene"} |= "[AssetOp]" |= "metric=persist_version_skew" [10m]) > 0
#             (2026-10-30,混版本持久字段保护第 6 批)资产通道遇到本版本解释不了的东西,回 RETRY + reason 1006
#             (kFeatureUnavailable)、不记账:where=asset_debit 是按数量扣出只有算上带更新版本字段的物品才够,
#             where=asset_currency 是包里的币种本版本不认识;2026-11-11 起另有 where=asset_request(请求带本版本
#             不认识的字段,行里带 field=<消息#字段号>)与 where=asset_config(物品 / 宝宝配置号不在本节点的 Item / Pet
#             表里,带 table / config_id;表行只增不删,只可能是更新版本或尚未热更到本节点的行)。
#             Go 行上表现为 PENDING、last_reason=1006。
#             滚动发布或热更期间属预期,升级 / 热更走完自然收口;发布已走完仍持续 → 查是否有 scene 停在旧版本、被回滚,
#             或(asset_config)这个节点的配置没有热更到。
#             不要人工终结这类行:入账没有 Abort 栅栏,人工终结还会在流上留下永久的洞(04 §4.38)。聚宝斋托管卡在这里时,
#             卖家可以撤单收口。
#
# Severity conventions(与 scene-manager-alerts.yaml 相同):
#   critical = pager, someone wakes up
#   warning  = next-business-hours channel
#   info     = dashboard annotation / trend signal
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: asset-channel-alerts
  labels:
    app: guild
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: asset-channel.correctness
      interval: 30s
      rules:
        # scene 回 UNKNOWN:配置不一致 / 纪元过期 / 跳号 / 验签失败。该行每 MaxBackoff 重排一次、永不终结,
        # 必须有人看。处置见 04-asset-channel.md 第 10 部分 4.38 与 cmd/assetopfix。
        - alert: AssetOpUnknownOutcome
          expr: |
            sum by (service) (increase(assetop_unknown_total[10m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.service }} 的资产指令收到 UNKNOWN 结局"
            description: >-
              过去 10 分钟 {{ $labels.service }} 收到约 {{ $value | printf "%.0f" }} 次 scene 回 UNKNOWN。
              这类行不会自动终结。按 docs/design/guild-phase2/04-asset-channel.md 第 10 部分 4.38 排查
              (配置 / 纪元 / 跳号 / 验签),必要时用 assetopfix 人工终结(须凭 scene 流水 correlation_id)。

        # 同一 seq 两次查询给出不同终结结局,违反不变量 I2。
        - alert: AssetOpOutcomeFlip
          expr: |
            sum by (service) (increase(assetop_outcome_flip_total[10m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.service }} 的资产指令结局发生翻转(违反 I2)"
            description: >-
              同一 (player, stream, seq) 先后得到不同的终结结局。账本只在 player_store 里,旧持有者的写被 go/db 按写权拒绝,
              所以这必定是代码缺陷或库被回档 / 改动过。保留现场,对照 scene 流水与 guild_asset_op 行,不要人工终结。

        # 部分发放:不做对侧账,转人工补偿(X-15)。
        - alert: AssetOpAppliedPartial
          expr: |
            sum by (service) (increase(assetop_partial_total[1h])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service }} 出现部分发放的资产指令"
            description: >-
              过去 1 小时有 {{ $value | printf "%.0f" }} 条资产指令以 APPLIED_PARTIAL 终结,
              需要人工补偿(帮会侧对侧账不做)。

        # payload 解不开(毒行):每次推迟 1 小时,无限次。
        - alert: AssetOpPayloadDecodeError
          expr: |
            sum by (service) (increase(assetop_store_errors_total{op="decode"}[1h])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service }} 有解不开的资产指令 payload"
            description: >-
              毒行会每小时重试一次且永不终结。多半是新旧版本的 payload 格式不兼容,按 op_id 查行后人工处置。

    - name: asset-channel.backlog
      interval: 60s
      rules:
        # 在线重试类的最老未决行超过 1 小时:玩家在线却一直结算不掉。
        # 由每日对账(Auditor)刷新,两次对账之间数值不变;for 只防抖动。
        - alert: AssetOpOnlineRetryStuck
          expr: |
            max by (service, stream) (assetop_pending_class_oldest_age_seconds{class="online_retry"}) > 3600
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service }}/{{ $labels.stream }} 有在线重试超过 1 小时的资产指令"
            description: >-
              最老的 online_retry 类 PENDING 行已存在 {{ $value | printf "%.0f" }} 秒。
              玩家在线时正常 1 分钟内应当终结;检查该玩家是否长期处于战斗 / 冻结 / 加载未完成,
              以及 scene 的资产 RPC 拒绝原因(assetop_rpc_total)。
              行上 last_reason=1006(kFeatureUnavailable)是版本错位(混版本持久字段保护第 6 批):scene 遇到本版本
              解释不了的物品字段或币种,先确认 scene 滚动是否走完,不要人工终结;scene 侧日志见文件头
              metric=persist_version_skew 那条查询。

        - alert: AssetOpAlertClassRows
          expr: |
            max by (service, stream) (assetop_pending_rows{class="alert"}) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service }}/{{ $labels.stream }} 有告警类资产指令未处置"
            description: >-
              {{ $value | printf "%.0f" }} 行处于 UNKNOWN / 结局翻转 / 毒行状态,不会自动终结。

        # 自动放弃是不可逆的业务处置(奖励作废,帮会侧退回限购与帮贡),每天提醒一次以便审计与人工补偿。
        - alert: AssetOpAbandoned
          expr: |
            sum by (service, stream) (increase(assetop_abandoned_total[1d])) > 0
          for: 0m
          labels:
            severity: info
          annotations:
            summary: "{{ $labels.service }}/{{ $labels.stream }} 有资产指令被自动放弃"
            description: >-
              过去 1 天有 {{ $value | printf "%.0f" }} 条 PENDING 超过 180 天且玩家仍不在线的资产指令
              被终结为 ABANDONED(docs/design/landing-recovery-sync-digest.md §6.3)。
              如需补偿,以审计行与 scene 流水为依据人工处理。

    # 重投到期扫描的按片分工(缺口清单第 25 条,docs/design/assetop-redelivery-sharding-20261110.md §3、§12)。
    # assetop_owned_shards 是每个 stable 副本此刻负责的片数,只有绑了分工的重投循环才报(guild / trade / mail / data_service),
    # 同一服务各副本之和应为 64(go/shared/workshard 的 Shards)。按 (namespace, service) 聚合:data_service 每个 zone 一份,
    # 成员表只圈本 zone;全局服务只在 infra namespace。成员表变化(扩缩容、滚动)的几秒里会多或少几片,for 只防这段抖动。
    # 低于 64 = 有片没人扫:多半是在 etcd 登记着却不跑重投循环的副本(滚动修改 AssetOp.Enabled / Recall.Enabled 的窗口),
    # 或循环没起来。高于 64 只是重复扫(某副本连续 30 秒读不到成员表就做全部片),不告警。
    # 盲区:副本的循环卡死时 gauge 停在旧值,和仍为 64,这两条都不响;由下面 asset-channel.loop-liveness 组的 AssetOpRedeliveryLoopStalled 按副本报。
    - name: asset-channel.work-shards
      interval: 60s
      rules:
        - alert: AssetOpOwnedShardsMissing
          expr: |
            sum by (namespace, service) (assetop_owned_shards) < 64
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} 的资产指令重投有片没人扫"
            description: >-
              各 stable 副本负责的到期扫描片数加起来只有 {{ $value | printf "%.0f" }} 片(应为 64)。
              没人扫的片里,首投没走完的行只剩提交后的同步投递与玩家重新上线时的落地唤醒,在线玩家的重试停住,资产到账被拖住(不丢)。
              对比该服务在 etcd 本 zone 前缀下登记的 stable 实例与报这个 gauge 的副本:登记着却没有序列的那个,
              查它的 AssetOp.Enabled(data_service 是 Recall.Enabled)是否与其余副本一致、重投循环是否起来、指标是否被抓取;
              同时看 assetop_pending_oldest_age_seconds,片没人扫时它会持续上涨。

        # 缺口持续半小时以上且该服务有等了半小时以上的未决行:成员表不会自己变,缺口不会自愈,要人处置。
        # 离线玩家的停放行本来就会让最老年龄常年偏高,所以第二个条件在实践中几乎总成立,这条是按持续时间升级的同一缺口。
        - alert: AssetOpOwnedShardsMissingBacklogAging
          expr: |
            (sum by (namespace, service) (assetop_owned_shards) < 64)
            and on (namespace, service)
            (max by (namespace, service) (assetop_pending_oldest_age_seconds) > 1800)
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} 的资产指令重投缺片已超过半小时"
            description: >-
              到期扫描缺片已持续超过 35 分钟(当前只有 {{ $value | printf "%.0f" }} 片有人扫,应为 64),且该服务最老的未决资产指令已超过 30 分钟。
              缺片不会自愈:登记着却不跑重投循环的副本不退出、不恢复,它名下的片就一直没人扫;trade 的合同推进与收据 ACK 用同一份成员表,
              托管资产也会跟着停在合同里。先按 AssetOpOwnedShardsMissing 找出那个副本,让它的配置与其余副本一致后重启,或把它缩掉。

    # 周期循环的活性(缺口清单第 25 条第四批,docs/design/assetop-redelivery-sharding-20261110.md §14.3)。
    # 每个循环一个「最近一次跑完一轮的时刻」gauge(Unix 秒):起来时写一次,每跑完一轮写一次(这一轮成败都写,panic 的那一轮不写),
    # 循环退出时删掉序列。没起循环(canary、Recall.Enabled=false)或已经停掉循环(停机排空)的副本没有序列,不会误报。
    # 按副本逐条判,不聚合:分片之后一个副本卡住,别的副本照常推进,max() 看不出来;卡住的副本名下的片没人做,
    # 而 assetop_owned_shards 之和仍是 64(上面 work-shards 组的盲区)。
    # 阈值按「一轮最长要跑多久」取若干倍:
    #   - 重投一轮最长约 Interval + ceil(Batch / Workers) × OpBudget,默认 2 + 13 × 2.5 ≈ 35 秒;guild 把间隔、单行预算调到上限
    #     (60 秒、10 秒)时约 190 秒。300 秒都盖得住;再调大 Batch 时要复核。
    #   - 回收派发间隔 1 秒、一轮总预算 30 秒(recallDispatchRoundLimit),300 秒约 10 轮。
    # mail 过期清理的同类规则 MailSweepStalled 在 mail-alerts.yaml。契约测试 tools/scripts/tests/loop_liveness_alerts_contract.tests.ps1
    # 钉住指标名、按副本判的式子与阈值和代码常量的关系。
    - name: asset-channel.loop-liveness
      interval: 60s
      rules:
        - alert: AssetOpRedeliveryLoopStalled
          expr: |
            time() - assetop_loop_last_run_unixtime > 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} 有副本的资产指令重投循环卡住了"
            description: >-
              副本 {{ $labels.pod }} 的重投循环已经 {{ $value | printf "%.0f" }} 秒没有跑完一轮(正常不超过几十秒)。
              它在 etcd 里还登记着、占着自己那几片,这几片里在线玩家没走完的资产指令没人重投,资产到账被拖住(不丢)。
              先看这个副本的 goroutine 栈与 safego_panic_total{point="assetop.reconcile_tick"}(每一轮都 panic 也会停住),
              再重启它或把它缩掉:它从 etcd 摘掉之后,它的片由别的副本接手。

        - alert: RecallDispatchLoopStalled
          expr: |
            time() - data_service_recall_dispatch_last_run_unixtime > 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 有 data_service 副本的 GM 回收派发循环卡住了"
            description: >-
              副本 {{ $labels.pod }} 的回收派发循环已经 {{ $value | printf "%.0f" }} 秒没有跑完一轮(间隔 1 秒,一轮至多 30 秒)。
              它名下那几片的 PLANNED 回收行没人派发,GM 回收停在计划里(不丢,也不会重复扣)。
              先看 safego_panic_total{point="data_service.recall.dispatch"} 与这个副本的 goroutine 栈,再重启它或把它缩掉。

    # 交易合同推进(go/trade commerce.Engine.Tick,docs/design/jubaozhai-market.md §15.3,2026-10-22 补)。
    # 指标没有 service 标签(只有 trade 一个服务);每个副本各自计数,所以用 sum。
    # 处置统一见 docs/ops/trade-commerce-quarantine-runbook.md。
    - name: trade-commerce.contracts
      interval: 60s
      rules:
        # 隔离为 Manual 之后托管资产一直扣在合同里,没有自动出口,必须有人看。
        - alert: TradeCommerceQuarantined
          expr: |
            sum(increase(trade_commerce_quarantined_total[10m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "trade 有交易合同因确定性坏数据被隔离为人工"
            description: >-
              过去 10 分钟有约 {{ $value | printf "%.0f" }} 条交易合同(含被移出盘口的坏对手单)被隔离为 Manual。
              托管资产仍在合同里,隔离时在途的托管扣款已截止改发 Abort。按日志
              "[Commerce] Contract quarantined as manual" / "Market counterparty quarantined" 取 commerce_id 与原 stage,
              按 docs/ops/trade-commerce-quarantine-runbook.md 对账;不得手改 trade_commerce / trade_asset_op 行。

        # 参与角色已换主 / 被另一条挂单冻结 / 目录行不合格:合同与对方的托管一直扣着,每 5 分钟复查一次。
        - alert: TradeCommerceRoleConflict
          expr: |
            sum(increase(trade_commerce_tick_row_failures_total{class="role_conflict"}[1h])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "trade 有交易合同因参与角色换主或被冻结而停住"
            description: >-
              过去 1 小时有约 {{ $value | printf "%.0f" }} 次合同推进撞上 role_conflict(每条停住的合同约每 5 分钟一次)。
              按日志 "[Commerce] Contract blocked by a party role" 取 commerce_id,
              按 docs/ops/trade-commerce-quarantine-runbook.md 判断是暂时冻结还是已换主。

        # 一般暂时失败持续不断:存储 / 号段 / 依赖 RPC 长时间不可用,或某几条合同反复卡满子预算。
        # 单条失败会推迟 10s±20%,偶发锁冲突不会让每个 5 分钟窗口都有失败。
        - alert: TradeCommerceRetryFailuresPersistent
          expr: |
            sum(rate(trade_commerce_tick_row_failures_total{class="retry"}[5m])) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "trade 交易合同推进持续出现暂时失败"
            description: >-
              最近 30 分钟每个 5 分钟窗口都有 retry 类推进失败(当前约 {{ $value | printf "%.2f" }} 次/秒)。
              按日志 "[Commerce] Contract step failed" 的 commerce_id 与错误原因排查存储、号段与依赖 RPC。

        # 撮合在 taker 推进之后失败(不含乐观冲突):不推迟、下一轮重撮,持续出现说明盘口被挡住。
        - alert: TradeCommerceMarketMatchFailing
          expr: |
            sum(rate(trade_commerce_market_match_failures_total{class!="conflict"}[5m])) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "trade 市场订单撮合持续失败"
            description: >-
              最近 30 分钟每个 5 分钟窗口都有撮合失败。按日志 "[Commerce] Market match failed" 的 taker_id 与 class 排查;
              class=role_conflict 多半是盘口上对手单的角色被另一条挂单冻结(该单不会被自动移出盘口)。

        # Due 每轮都没取完:推进吞吐跟不上,或有行反复卡满子预算(此时 retry 类失败也会同时上涨)。
        - alert: TradeCommerceTickTruncated
          expr: |
            sum(rate(trade_commerce_tick_truncated_total[5m])) > 0.5
          for: 15m
          labels:
            severity: info
          annotations:
            summary: "trade 合同推进每轮都用完预算"
            description: >-
              最近 15 分钟各副本合计每秒有超过 0.5 轮推进在预算用完时 Due 里还有合同没开始推进
              (每个副本每秒一轮,单副本即超过一半的轮次)。
              合同仍会在后续轮次推进,但到期处理会变慢;检查 TiDB 延迟、retry 类失败与副本数。

    - name: guild-trial.results
      interval: 60s
      rules:
        # 只有持巡检租约的副本报真实值,其余副本为 0,所以用 max。
        - alert: GuildTrialResultOverdue
          expr: |
            max(guild_trial_result_overdue) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "帮会历练有超时未结算的对局"
            description: >-
              {{ $value | printf "%.0f" }} 局登记超过阈值仍未拿到结果。检查 match 库 match_battle_completion 的终局、
              match 的终局发件箱(match_outcome_outbox_backlog_rows)、guild 对 Kafka match-results 的消费与巡检器日志。
              guild 停机超过 7 天的胜场不补发,属已接受偏差。

        - alert: GuildTrialOwedBacklog
          expr: |
            max(guild_trial_owed_rows) > 1000
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "帮会历练奖励待入队积压超过 1000 行"
            description: >-
              guild_trial_reward_owed 积压 {{ $value | printf "%.0f" }} 行(计到 10000 封顶)。
              说明得奖者的资产指令窗口(MaxPending=16)长期占满,检查这些玩家的 PENDING 行是否卡在离线停放档。
