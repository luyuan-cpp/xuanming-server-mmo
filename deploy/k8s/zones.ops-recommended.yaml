zones:
  - name: yesterday
    zoneId: 101
    # external + NodePort 时 gate-<i> 的 nodePort = gateNodePortBase + i(见文末第 8 条)。
    gateNodePortBase: 30000
    replicas:
      centre: 1
      gate: 3
      # Role-split scene pools (matches scene_manager StrictNodeTypeSeparation=true).
      scene_world: 2    # SceneNodeType=0, persistent main world channels
      scene_instance: 2 # SceneNodeType=1, on-demand dungeons / battlegrounds

  - name: today
    zoneId: 102
    gateNodePortBase: 30010
    replicas:
      centre: 1
      gate: 3
      scene_world: 2
      scene_instance: 2

# Ops recommendation:
# 1. Keep centre=1 unless you have already validated multi-centre semantics.
# 2. Start with gate=3 and scene_world=2 / scene_instance=2 per zone. gate=3 is the
#    smallest count that holds the default zone capacity (zone_config.capacity
#    45000): each gate takes 90% of GateMaxConnections 20000 = 18000 before the
#    login queue starts holding players, and 2 gates top out at 36000 (2026-11-10,
#    docs/design/zone-full-handling.md). Size gates as
#    replicas * 18000 >= zone_config.capacity, or lower the zone capacity.
#    Legacy `scene: 4` still works if the
#    orchestration script you use does not yet understand the split form;
#    in that case set scene_manager StrictNodeTypeSeparation=false during
#    the transition window.
# 3. Scale scene_instance first - dungeons and battlegrounds are bursty and
#    stateful-per-instance, while main-world channels are relatively steady.
# 4. Use YAML as the operational source of truth; keep JSON only for tool interop.
# 5. Managed cloud K8s: prefer -GateServiceType LoadBalancer.
# 6. Self-hosted/bare metal K8s: prefer -GateServiceType NodePort behind an external L4 LB.
# 7. Do not default every cluster to LoadBalancer; if the cluster lacks a mature
#    LB implementation, NodePort + external L4 LB is usually the more stable
#    production choice.
# 8. gateNodePortBase(每个 zone 一个,D88)只在 -ClientEntryMode external +
#    -GateServiceType NodePort 时生效:gate-<i> 的 nodePort = gateNodePortBase + i,
#    占用 [base, base + gate 副本数 - 1]。多 zone 时每个 zone 必须显式写,各段不能重叠
#    (否则预检拒绝部署);全部收在 K8s 静态子段 30000-30085 内,并给 gate 扩容留余量
#    (这里每 zone 留 10 个口)。键单独占一行、行尾不写注释(k8s_deploy.ps1 的 YAML
#    回退解析只认这种写法)。
