# match 终局发件箱「个人结算首投收件箱」的积压告警(2026-11-06,数据覆写审计 R2 r2-v1#1 残余窗口;
# docs/design/turn-battle-gap-closure.md §11.2)。安装方式与 match-alerts.yaml 相同:
#   kubectl apply -n observability -f deploy/k8s/match-outcome-outbox-alerts.yaml
# 抓取前提:同 match-alerts.yaml(按注解抓取 match 指标端口 9170 的 job 或 PodMonitor)。没有序列时规则不触发,和「一切正常」长得一样;
# 序列只在全球匹配开着时出现(staging / prod 部署强制开)。
# 本文件里以 match 加下划线开头的词都会被契约测试当成指标名核对,注释里不要写这种形状的文件名或表名。
#
# 读数:每个 match 副本每分钟用 COUNT / MIN 读一次 SQL(logic/global_expired_audit.go),最老一行的年龄从 COMPLETE 提交
# (个人结算源行的归档时刻)算到读数时刻。所有副本读同一份 SQL、报同一个数,规则一律取 max;某副本读失败时它的 gauge
# 保留上一次的值、照样参与 max —— 偏保守,宁可多报(读失败的副本日志有 global outcome outbox backlog read failed)。
# 只看 kind 为 first(还没进收件箱):waiting 是已入箱、等玩家应用,离线玩家会长期停在那里,年龄不代表积压。
#
# 阈值与 scene 的冻结时刻对齐(常量在 cpp/libs/services/scene/battle/system/player_battle.h,契约测试核对):
#   - FIGHTING 冻结到期 = 截止 + 60s 终局宽限 + 60s 收件箱投递余量(FreezeExpiresAtMs)。打满时限的局在截止之后才 COMPLETE
#     (强制平局),结算要在截止后约 120s 内被 scene 应用;收件箱拉取退避封顶 60s,所以首投要在提交后 60s 内完成。
#     再晚,到期时 scene 查到 SQL 终局为 COMPLETE 而本地还没应用,就续冻(冻结与战斗锁每 30s 续一拍):这名玩家排不了队、
#     资产通道回 RETRY。warning 的阈值因此取投递余量(60s),契约测试要求它不超过 kInboxSettlementDeliveryMarginMs。
#   - 续冻上限 = 到期后 15 分钟(kFreezeHoldCapMs),打满时限的局约在 COMPLETE 之后 16 分钟到上限;到上限 scene 告警解冻
#     (battle_freeze_hold_cap_reached),之后才到的结算按当时持有量夹紧消耗 —— 交易或帮会资产通道开着时可逐局刷「药白喝」。
#     critical 取 300s:加上 for 与读数、抓取、评估延迟,约在落后 6~8 分钟时触发,离上限还有约 8~10 分钟。
#     契约测试要求 critical 阈值离续冻上限至少 10 分钟(告警链路约 3 分钟 + 改参数滚动或扩副本约 5 分钟 + 排空)。
#   改 scene 的续冻上限或投递余量时,同步改这里的阈值与契约测试。
# 健康时首投在一轮(缺省 2s)内完成;入箱失败一次要等 30s 认领租约到期才重投,偶发失败不会让最老一行连续 2 分钟超过 60s。
# 处置见 docs/ops/player-inbox-runbook.md §6.1「Match 个人结算首投积压」。
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: match-outcome-outbox-alerts
  labels:
    app: match
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: match.outcome-outbox
      interval: 30s
      rules:
        # for 2m:gauge 每分钟刷新一次,连续三次读数都超过 60s 才报。单行卡住时约在它落后 3 分钟报出;
        # 持续积压(最老一行不断被新的替换、但总在 60s 以上)在积压形成 2 分钟后报出。
        - alert: MatchSettlementInboxLagging
          expr: |
            max(match_outcome_outbox_oldest_pending_age_seconds{kind="first"}) > 60
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "个人结算进收件箱落后超过 60 秒,打满时限的局开始续冻"
            description: >-
              最老一条还没进收件箱的个人结算已等了 {{ $value | printf "%.0f" }} 秒(从 COMPLETE 提交算起),连续 2 分钟超过 60 秒。
              打满时限的局到期时结算还没到,scene 会续冻这些玩家(排不了队、资产通道回 RETRY,scene 日志 battle_freeze_held),
              结算一到自动解冻。按 outcome 分组看 match_outcome_outbox_delivery_total 的首投结局:失败在涨查收件箱
              (Match 签名密钥、可用性);没有失败而 match_outcome_outbox_backlog_rows 在涨是吞吐不够,
              调大 GlobalMatch.OutcomeOutbox 的批量与并发,或加副本。处置见 player-inbox-runbook.md §6.1。

        # for 1m:年龄本身已经是累计量,300s 说明最老一行已经等了 5 分钟;for 只用来挡掉单次陈旧读数。
        - alert: MatchSettlementInboxStalled
          expr: |
            max(match_outcome_outbox_oldest_pending_age_seconds{kind="first"}) > 300
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "个人结算进收件箱落后超过 5 分钟,约 10 分钟后 scene 续冻到上限"
            description: >-
              最老一条还没进收件箱的个人结算已等了 {{ $value | printf "%.0f" }} 秒。scene 的续冻上限是冻结到期后 15 分钟,
              打满时限的局约在 COMPLETE 之后 16 分钟到上限;到上限照常解冻,之后才到的结算按当时持有量夹紧消耗,
              交易或帮会资产通道开着时可被逐局利用。积压条数少而年龄一直涨是个别行卡住(看首投结局里的 corrupt 与 failed),
              条数多是吞吐不够或收件箱整体不可用。先止血(恢复收件箱、调大批量与并发或加副本),再查根因;
              处置见 player-inbox-runbook.md §6.1。
