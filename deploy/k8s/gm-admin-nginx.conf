# GM 后台前端容器的 nginx 主配置,打进镜像的 /etc/nginx/gm-admin.conf(deploy/k8s/Dockerfile.gm-admin)。
# 清单以 ["nginx", "-c", "/etc/nginx/gm-admin.conf", "-g", "daemon off;"] 起它:uid 10001、根文件系统只读,
# 可写的只有挂在 /tmp 的 emptyDir,pid 与全部 *_temp_path 都指到那里。不写 user:非 root 主进程下它只会被忽略并告警。
# 浏览器只访问这里(与后端同源):静态页在 /app/web,/jeecgboot/ 反代同 Pod 后端 127.0.0.1:18090/jeecg-boot/,
# 与本机 .env.gm 的 VITE_PROXY 同一映射;前端按 gmk8s 模式构建,接口地址就是相对路径 /jeecgboot。

# 后台访问量小,一个 worker 足够;auto 会按节点核数起进程。
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # 本机 Vite 代理不限请求体;nginx 缺省 1m 会把大批量草稿挡成 413,取上游 multipart 上限 10MB(application-prod.yml)。
    client_max_body_size 10m;

    # 上游右上角通知走 WebSocket(/jeecgboot/websocket/<id>,55 秒一次心跳),要把 Upgrade 透传给后端。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # index.html 每次回源校验:升级后旧页面引用的带哈希 js 已不在新镜像里,浏览器按启发式缓存旧 index.html 会白屏。
    # 值为空时 add_header 不输出该头,其余响应(含反代的)照旧。
    map $uri $gm_cache_control {
        default     "";
        /index.html no-cache;
    }

    server {
        listen 3101;
        root /app/web;

        # 内容安全策略(Content-Security-Policy)先不加:JeecgBoot 前端有内联脚本(index.html 的加载页、PWA 注册),
        # 写不对会白屏,要加先在浏览器里逐页核对。
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control $gm_cache_control always;

        # kubelet 探针:只说明 nginx 在,不经后端(后端容器有自己的探针,直连 18090)。
        location = /healthz {
            access_log off;
            return 200;
        }

        # 后端 actuator 不给浏览器。Tomcat 会先剥掉路径段里的 ;参数 再归一化,/jeecgboot/x/..;/actuator 这类路径
        # 能绕过只看前缀的规则,所以经后端的路径里带 ;(含 %3B)一律拒绝;上游接口不用路径参数。
        location ~ "^/jeecgboot/.*;" {
            return 404;
        }
        location ~* ^/jeecgboot/actuator(/|$) {
            return 404;
        }

        location /jeecgboot/ {
            proxy_pass http://127.0.0.1:18090/jeecg-boot/;
            proxy_http_version 1.1;
            # 带端口的原 Host:上游 CommonUtils.getBaseUrl 按它拼地址,缺端口会落到 80。
            proxy_set_header Host $http_host;
            # 来源地址只取这一跳看到的对端,覆盖客户端自带的 X-Forwarded-For / X-Real-IP:上游 IpUtils 取 X-Forwarded-For 的第一个地址
            # 进后台日志与审计,追加写法下浏览器自己带一个头就能伪造。前面没有可信代理(经 port-forward 进来,不建 Ingress);
            # 以后加内部入口时,改成只信那个入口给的头(set_real_ip_from + real_ip_header),不要改回追加。
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # 后端单次调下游预算 5 秒,但一次请求能串多次(批量活动发奖:建 1 + 导入至多 10 片 + 封存 1,单飞租约 120 秒);
            # 读超时取 120 秒,也高于通知 WebSocket 的心跳间隔。
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
