# 现役排行榜采用 SQL 代次、封榜与持久邮件奖励；历史 Redis 消费延迟、ZCARD、版本表不再是运行时事实。
# 多副本 counter 用 sum(rate/increase)，奖励延迟取 max；只有成功 SQL 查询才发布延迟样本。
# 延迟覆盖已到期且未持租约的奖励，短租约到期后重新可见。查询失败保旧，另由扫描失败告警覆盖。
# 须抓取 rank Pod metrics；进程或抓取缺失沿现有 Deployment/探针告警处理。
# 所有 label 仅有限 operation/outcome，不得增加玩家、榜ID或请求ID。
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rank-alerts
  labels:
    app: rank
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: rank.sql
      interval: 60s
      rules:
        - alert: RankWriteFailing
          expr: |
            sum(rate(rank_write_total{outcome="error"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "排行榜 SQL 写入持续失败"
            description: >-
              Open/Submit/Freeze/Remove/Delete 最终返回持续出现 SQL 或提交结果未知错误。
              查 TiDB 连接、锁等待与服务错误；ok 为已确认提交，replay 单列，不能据 error 自动重做未知事务。

        - alert: RankRewardScanFailing
          expr: |
            sum(rate(rank_reward_scan_total{outcome="error"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "排行榜持久奖励查询持续失败"
            description: "工作器无法按 status,next_attempt_ms 索引读待办；延迟保留上次成功观测，不能解释为当前空队列。"

        - alert: RankRewardOverdue
          expr: |
            max(rank_reward_due_delay_seconds) > 900
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "排行榜可领取奖励超过 15 分钟未投递"
            description: "SQL 最早可领取奖励已超过原 next_attempt_ms 15 分钟；核 rank→mail RPC、签名与终态提交，不清空原意图。"

        - alert: RankRewardDispatchFailing
          expr: |
            sum(rate(rank_reward_dispatch_total{outcome=~"error|unknown|rejected"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "排行榜邮件奖励持续未能确认投递"
            description: "error 为 SQL/签名等失败，unknown 为邮件结果未知，rejected 为业务拒绝；仅邮件ID与 SQL 终态都确认才计 delivered，沿原 reward_id 恢复。"

        # 首次抓取前已增长时 increase 不可见；第二项覆盖进程启动后的固定窗口。
        - alert: RankRewardInvalidPayload
          expr: |
            sum(increase(rank_reward_dispatch_total{outcome="invalid"}[15m])) > 0
            or
            sum(rank_reward_dispatch_total{outcome="invalid"} and on(instance) (time() - process_start_time_seconds) < 900) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "排行榜持久奖励附件无法解析"
            description: "封榜奖励原件出现坏附件，工作器保留原意图并延后重试；核封榜来源与受控修复，不能跳奖或删除待办。"
