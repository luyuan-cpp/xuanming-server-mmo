# Prometheus alert rules for the control Redis Cluster(控制 Redis Cluster,deploy/k8s/manifests/infra/redis-cluster.yaml,name=redis-control)。
#
# 来源:docs/design/redis-cluster-all-domains-20261110.md §7(控制域上 Cluster)、§10 第 6a 批;持久性、故障转移与扩缩容的口径同玩家域
# (docs/design/redis-player-store-cluster.md §7、§8),两套集群同一份模板、同一套部署函数;处置见 docs/ops/redis-player-cluster-runbook.md(两套集群共用)。
# 本文件与 redis-player-alerts.yaml 一条对一条:规则名前缀、组名、pod 选择器与说明文字不同,表达式、for、severity 相同。改一边的阈值时两边一起改
# (契约测试 redis_player_cluster_contract 逐条比对两份文件)。
# 单实例控制域(redis、redis-ha、redis-queue-g<N>、redis-ctl-g<N>、redis-match-cluster)的规则在 deploy/k8s/redis-alerts.yaml,不在这里。
#
# 控制集群放的是除玩家域、登录域与 match 私有键之外的全部 Redis 用途(场景路由、排队、选主与租约、gate 标记、限流、资产操作唤醒等,清单见设计 §7)。
# 缺口第 34 条第 6b 批把各服务接上之前没有客户端,下面的规则照样有数据(exporter 只看节点本身),集群本身的故障照常报。
#
# Install as a PrometheusRule CR (kube-prometheus stack),与 redis-alerts.yaml 同法:
#   kubectl apply -n observability -f deploy/k8s/redis-control-alerts.yaml
#
# Scrape prerequisites:
#   - redis-control 的每个 Pod 带 redis-exporter sidecar,指标端口 9121,Pod 模板带 prometheus.io/scrape|port|path 注解。还需要一个指向该端口的
#     PodMonitor(或按注解抓取的配置),否则下面全部规则没有数据:空表达式不报错,和「一切正常」长得一样。
#   - namespace、pod 两个 label 由抓取配置附加。规则用 pod=~"redis-control-[0-9]+" 限定在本集群,不用任何玩家维度(低基数)。
#
# 指标名同 redis-player-alerts.yaml(已对照 redis_exporter v1.62.0 源码核对,还没有对着运行中的 exporter 验证)。部署后逐个对着 exporter 的 /metrics
#   核对,对不上两份文件一起改 —— 指标名写错的规则不报错,只是永远不响。
#
# 阈值与 for 时长同 redis-player-alerts.yaml(2026-11-12 定),压测出基线后可调(AGENTS.md §6:容量结论仍以压测对比为准)。
#
# Severity conventions(与 scene-manager-alerts.yaml 相同):
#   critical = pager, someone wakes up
#   warning  = next-business-hours channel
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: redis-control-alerts
  labels:
    app: redis-control
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: redis.control-cluster
      interval: 30s
      rules:
        # exporter 连不上本 Pod 的 redis-server:节点挂了、在重放 AOF,或口令不对。主节点挂了副本约 5s + 选举后接管,这条告警说明节点持续不可用;
        # 这一片再失去一个节点就没有副本可切。
        - alert: RedisControlNodeDown
          expr: |
            redis_up{pod=~"redis-control-[0-9]+"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "控制 Redis 节点 {{ $labels.namespace }}/{{ $labels.pod }} 不可达"
            description: "redis_exporter 连不上本 Pod 的 redis-server 已超过 1 分钟。先看该 Pod 的 redis 容器日志(是否在重放 AOF、是否 OOMKill),再看 Secret redis-control-auth。处置见 docs/ops/redis-player-cluster-runbook.md「节点故障」。"

        # 节点自己报告的集群状态不是 ok:与多数派失联(这个节点停止服务)、或全部主节点失联。cluster-require-full-coverage no 时一片全挂不会让它变成 fail,
        # 那一种情况看下面的 RedisControlSlotsNotCovered。
        - alert: RedisControlClusterStateNotOk
          expr: |
            redis_cluster_state{pod=~"redis-control-[0-9]+"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "控制 Redis 节点 {{ $labels.namespace }}/{{ $labels.pod }} 报告集群状态非 ok"
            description: "cluster_state 不是 ok 已超过 1 分钟:这个节点上的 slot 回 CLUSTERDOWN,落在这些 slot 的控制键(场景路由、排队、租约等)读写失败。多个节点同时亮多半是网络分区。处置见手册「节点故障」。"

        # slot 没有全覆盖。这是「一片主从都挂了」的唯一信号:cluster_state 这时还是 ok,其余 slot 照常服务,这 1/M 的控制键全部失败。
        # 取全部节点里最小的读数:节点之间在 gossip 收敛前可能不一致,持续 1 分钟仍缺就是真的缺。
        # 读数是 16384 也不代表没有问题:新节点加入、迁移时 assigned 不变,所以只把它当下限。
        - alert: RedisControlSlotsNotCovered
          expr: |
            min by (namespace) (redis_cluster_slots_ok{pod=~"redis-control-[0-9]+"}) < 16384
            or
            min by (namespace) (redis_cluster_slots_assigned{pod=~"redis-control-[0-9]+"}) < 16384
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "控制 Redis Cluster {{ $labels.namespace }} 有 slot 没有可用的主节点"
            description: "cluster_slots_ok 或 cluster_slots_assigned 低于 16384。落在这些 slot 的控制键读写全部失败(回 CLUSTERDOWN Hash slot not served),同一个 hash tag(如一个 zone 的 {ctl:<zone>})下的键整组失败,其余不受影响。先 redis-cli --cluster check 看缺哪一段;处置见手册「节点故障」的「一片主从都挂了」。不要直接跑 --cluster fix,它可能把缺的 slot 分给空节点,旧数据就回不来了。"

        # 节点数比部署时少:有节点失联被标记 fail,或者节点被移出了集群。known_nodes 在扩容时会变大,只比自己的历史没有意义,所以只比最大值 ——
        # 节点之间读数不一致说明有节点没有与其他节点收敛。
        - alert: RedisControlNodesDisagree
          expr: |
            max by (namespace) (redis_cluster_known_nodes{pod=~"redis-control-[0-9]+"})
            !=
            min by (namespace) (redis_cluster_known_nodes{pod=~"redis-control-[0-9]+"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "控制 Redis Cluster {{ $labels.namespace }} 的节点对成员表没有收敛"
            description: "各节点的 cluster_known_nodes 不一致已超过 10 分钟。扩容入群刚做完的几秒内是正常的,持续不收敛多半是某个节点的集群总线端口不通(Service 的 16379),或 CLUSTER FORGET 只在部分节点上做了。处置见手册「核对清单」。"

        # 从节点与主节点断链。这一片在此期间没有可切的副本,主再挂就丢这一片的可用性。
        - alert: RedisControlReplicaLinkDown
          expr: |
            redis_master_link_up{pod=~"redis-control-[0-9]+"} == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "控制 Redis 从节点 {{ $labels.namespace }}/{{ $labels.pod }} 与主节点断链"
            description: "master_link_status 为 down 已超过 2 分钟。全量同步期间也会这样,持续更久看 Secret redis-control-auth(副本靠 --masterauth 连主)与主节点的 client-output-buffer。"

        # 内存逼近 maxmemory。控制集群同样一律 noeviction:写满后写命令直接报 OOM,不会静默淘汰租约、路由这类键。先于上限告警,给扩容留时间。
        - alert: RedisControlMemoryNearMax
          expr: |
            redis_memory_max_bytes{pod=~"redis-control-[0-9]+"} > 0
            and
            redis_memory_used_bytes{pod=~"redis-control-[0-9]+"} / redis_memory_max_bytes{pod=~"redis-control-[0-9]+"} > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "控制 Redis 节点 {{ $labels.namespace }}/{{ $labels.pod }} 内存超过 maxmemory 的 80%"
            description: "used_memory / maxmemory 持续 5 分钟高于 80%。noeviction 下写满即拒写。按手册「扩容」加主节点、迁 slot;不要改成淘汰型策略(淘汰租约或路由键等于静默丢状态)。只有一个节点高说明 slot 分布不均或某个 hash tag 过热,按手册核对每主 slot 数与键数。"

        # 已经有写命令因为写满被拒。不是「快满了」,是已经在丢写。
        - alert: RedisControlOomRejected
          expr: |
            increase(redis_errors_total{pod=~"redis-control-[0-9]+", err="OOM"}[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "控制 Redis 节点 {{ $labels.namespace }}/{{ $labels.pod }} 出现 OOM 拒写"
            description: "5 分钟内有写命令被 noeviction 拒绝,落在这个节点的控制写(续租、路由登记、排队)持续失败。立即按手册「扩容」处理,或排查异常增长的键族。"

        # 新连接被拒:每节点连接数撞到 maxclients。加主节点没有用,连接数只取决于客户端进程数。
        - alert: RedisControlConnectionsRejected
          expr: |
            increase(redis_rejected_connections_total{pod=~"redis-control-[0-9]+"}[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "控制 Redis 节点 {{ $labels.namespace }}/{{ $labels.pod }} 拒绝了新连接"
            description: "5 分钟内有连接因 maxclients 被拒。对照部署时打印的 Redis control connection ledger 一行核对总账,在线 CONFIG SET maxclients 先止血,再按手册改 MAXCLIENTS 并滚动。到线后 redis-cli 自己也连不上。"

        - alert: RedisControlConnectionsNearMax
          expr: |
            redis_config_maxclients{pod=~"redis-control-[0-9]+"} > 0
            and
            redis_connected_clients{pod=~"redis-control-[0-9]+"} / redis_config_maxclients{pod=~"redis-control-[0-9]+"} > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "控制 Redis 节点 {{ $labels.namespace }}/{{ $labels.pod }} 连接数超过 maxclients 的 80%"
            description: "connected_clients / maxclients 持续 5 分钟高于 80%,与 k8s_deploy.ps1 控制集群连接总账的 80% 水位同口径。加主节点不会降低每节点连接数;降 PoolSizePerNode、减副本,或抬 MAXCLIENTS。"

        # AOF 最近一次写失败(磁盘满、IO 错误)。持久化失效时节点重启会丢数据;副本一起满的话主从都丢。
        - alert: RedisControlAofWriteFailed
          expr: |
            redis_aof_last_write_status{pod=~"redis-control-[0-9]+"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "控制 Redis 节点 {{ $labels.namespace }}/{{ $labels.pod }} AOF 写失败"
            description: "aof_last_write_status 不是 ok 已超过 1 分钟。检查 PVC 容量与节点磁盘;节点此时重启会丢最近的控制写(路由、租约回到旧值)。扩盘按手册。"
