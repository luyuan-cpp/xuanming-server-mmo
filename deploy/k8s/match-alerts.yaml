# match 按池撮合的告警(docs/design/global-match-hierarchical-pools.md §5、§14),后台循环的活性(组 match.loop-liveness,
# docs/design/assetop-redelivery-sharding-20261110.md §14.10),以及保留期清理的失败与逾期(组 match.retention,
# docs/design/battle-script.md §6.4)。安装方式与 rank / mail 相同:
#   kubectl apply -n observability -f deploy/k8s/match-alerts.yaml
# 抓取前提:集群里要有按注解抓取 match 指标端口(9170,go/match/etc 下服务配置的 MetricsListenAddr)的 job 或 PodMonitor;
# 本文件里以 match 加下划线开头的词都会被契约测试当成指标名核对,注释里不要写这种形状的文件名。
# 没有序列时规则不触发,和「一切正常」长得一样。
# label 只用模式、范围层级、机房阶段与有限的结果枚举(go/match/internal/metrics/pool.go 的 PoolClaim* 常量),不含玩家号、对局号或模板号。
# 正确性不靠这些告警:同一玩家不进两局由提交事务保证,这里报的都是"排队池不成局 / 成局变慢"。
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: match-alerts
  labels:
    app: match
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: match.pool
      interval: 30s
      rules:
        - alert: MatchPoolsUnowned
          expr: |
            sum(match_pool_owned) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "没有任何 match 副本在撮合排队池"
            description: >-
              全部副本负责的池数之和为 0。池归属按 etcd 里注册的 MatchNodeService 实例做最高随机权重哈希:
              成员表为空时每个副本都撮合全部池,不会触发本条;触发说明成员表非空、但没有一个副本在表里认出自己
              (注册失败,或注册的实例 UUID 与本进程记的不一致),排队池没有写者,只剩单人档入队即开局。
              核 match 的注册日志与 etcd 里 MatchNodeService 前缀下的键。

        - alert: MatchPoolRoundSlow
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(match_pool_round_seconds_bucket[5m]))) > 0.4
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "按池撮合一轮的 p99 超过轮间隔的 0.8 倍"
            description: >-
              轮间隔缺省 500ms(MatcherIntervalMs),p99 超过 400ms 说明读页、成组、提交跟不上节拍,排队会越积越长。
              这是设计 §5.6 第 1 条的观察信号:先按压测汇总定位读页还是提交慢,再决定是否按机房拆写者。

        - alert: MatchPoolNoBattleNode
          expr: |
            sum by (mode) (rate(match_pool_claim_total{outcome="no_node"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "成组之后目标机房没有可选的 battle 节点"
            description: >-
              组已凑齐,但机房内的 battle 节点都在本副本熔断中或自报不接新房,这一组留到下一轮。
              核该机房 battle 节点数量、排空与 Agones 分配。

        - alert: MatchPoolGatherSlotsFull
          expr: |
            sum by (mode) (rate(match_pool_claim_total{outcome="no_slot"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "备战并发已满,成组的局留到下一轮"
            description: >-
              本副本同时备战的成局数达到 GlobalMatch.GatherSlots。核 scene 备战与 battle 建房耗时;
              容量不够时加副本,不要只调大槽数掩盖下游变慢。

    # 后台循环的活性(2026-11-12,缺口清单第 25 条第六批,docs/design/assetop-redelivery-sharding-20261110.md §14.10)。
    # 经 StartSourceLoop / StartRelayLoop 起的循环(撮合、成局推进、到期终局恢复、整队维护、观战维护等)与投榜循环
    # 各报一条「最近一次跑完一轮的时刻」,point 是循环的点位名。按副本、按点位逐条判,不聚合:撮合与投榜按片分给各副本,
    # 一个副本的循环停住,别的副本照常推进,聚合会把它盖住。没起这个循环的副本、循环已经有意停止的副本没有序列,不会误报。
    # 阈值 300 秒:现有循环最长 1 分钟一拍、一轮预算最长 30 秒(StartSourceLoop 的注释),300 秒是它们的 3 倍以上。
    # 每一轮都 panic 时这条会响,同时还有 go-background-alerts.yaml 的 GoBackgroundPanicRecovered;终局发件箱另有一条,
    # 在 match-outcome-outbox-alerts.yaml。
    - name: match.loop-liveness
      interval: 60s
      rules:
        - alert: MatchBackgroundLoopStalled
          expr: |
            time() - match_loop_last_run_unixtime > 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} 的 match 后台循环 {{ $labels.point }} 超过 5 分钟没有跑完一轮"
            description: >-
              这个副本的 {{ $labels.point }} 已经 {{ $value | printf "%.0f" }} 秒没有跑完一轮:卡在某一轮里不返回、每一轮都 panic,
              或循环意外退出(序列停在退出的那一刻)。撮合与投榜按片分工,停住的副本名下的撮合段、投榜片没人做,
              这些段的排队不成局、排名不更新,别的副本照常推进。先按点位名查这个 Pod 的日志(goroutine_panic 事件带栈),
              再看它连的库与 Redis;查不出就重启这个 Pod,它的片会换到别的副本。

    # 保留期清理(到期删除)的失败与逾期(2026-11-20,docs/design/battle-script.md §6.4)。两个清理循环各一分钟一轮、每个 stable 副本
    # 各跑各的:观战意图(purge="spectator_intent")与剧本审核流水(purge="battle_script_review")。上一组的循环活性只看
    # 「有没有跑完一轮」,成败都算;一轮接一轮地失败、或跑着但没删掉,要靠这一组看出来。
    - name: match.retention
      interval: 60s
      rules:
        # 按副本、按清理逐条判,不聚合。一个副本一小时 60 轮,门槛 30 = 过去一小时有一半以上的轮次失败;再持续 1 小时才报,
        # 库短暂不可用、偶发的写冲突不会响。搬库冻结窗口里被写者闸门拒绝的轮次不计失败(那一轮确定没写),搬大库也不会响。
        - alert: MatchRetentionPurgeFailing
          expr: |
            increase(match_retention_purge_failures_total[1h]) > 30
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} 的保留期清理 {{ $labels.purge }} 持续失败"
            description: >-
              过去一小时这个副本的清理失败了 {{ $value | printf "%.0f" }} 轮(一分钟一轮)。到期的行下一轮还在,数据不会错,只是没有按期删除:
              剧本审核流水过了保留期仍留着玩家写的正文,观战意图表一直涨。查这个 Pod 的日志 `[retention] {{ $labels.purge }} purge failed`
              后面带的错误:库不可达,或清理用的索引被删(读页超时)。搬库冻结窗口不计入这里(日志是 `purge paused: writer gate frozen`)。
              只有一个副本在响时别的副本仍在删,先看这个 Pod 连库是否正常。

        # 清理的结果(只有剧本审核流水报):每轮清理之后各副本报表里现存最老一行的审核时刻(表是空的报读的那一刻),以及生效的保留期。
        # 报的是时刻不是年龄,年龄在这里用 time() 减:副本读不动库时它照样变老。各副本报的都是「现存最老一行不早于它」的下界,
        # 取最大的那个最准。最老一行比保留期还老一天以上、持续 1 小时 = 到期的行没有删掉。
        # 观战意图不报这一项:请求头的行有意一直留着,最老一行没有意义。
        - alert: MatchRetentionBehind
          expr: |
            time() - max by (purge) (match_retention_oldest_unixtime)
              > on (purge) max by (purge) (match_retention_max_age_seconds) + 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "保留期清理 {{ $labels.purge }} 没有按期删除:最老一行比保留期还老一天以上"
            description: >-
              最老一行的年龄 {{ $value | printf "%.0f" }} 秒。剧本审核流水存着玩家写的正文,保留期(BattleScript.ReviewRetentionDays,缺省 180 天)
              是写给玩家的承诺,账号注销之后也按它删。先看 MatchRetentionPurgeFailing 与 MatchBackgroundLoopStalled 有没有在响
              (清理失败或循环停住);都没响就是清理在跑但没删掉,查审核流水表上 (reviewed_ms, script_id, revision) 索引还在不在。
              刚把保留期调短时积压的行按每分钟约 2 万行清,一天内清不完才会走到这里。
