# match 按池撮合的告警(docs/design/global-match-hierarchical-pools.md §5、§14),以及后台循环的活性(组 match.loop-liveness,
# docs/design/assetop-redelivery-sharding-20261110.md §14.10)。安装方式与 rank / mail 相同:
#   kubectl apply -n observability -f deploy/k8s/match-alerts.yaml
# 抓取前提:集群里要有按注解抓取 match 指标端口(9170,go/match/etc 下服务配置的 MetricsListenAddr)的 job 或 PodMonitor;
# 本文件里以 match 加下划线开头的词都会被契约测试当成指标名核对,注释里不要写这种形状的文件名。
# 没有序列时规则不触发,和「一切正常」长得一样。
# label 只用模式、范围层级、机房阶段与有限的结果枚举(go/match/internal/metrics/pool.go 的 PoolClaim* 常量),不含玩家号、对局号或模板号。
# 正确性不靠这些告警:同一玩家不进两局由提交事务保证,这里报的都是"排队池不成局 / 成局变慢"。
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: match-alerts
  labels:
    app: match
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: match.pool
      interval: 30s
      rules:
        - alert: MatchPoolsUnowned
          expr: |
            sum(match_pool_owned) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "没有任何 match 副本在撮合排队池"
            description: >-
              全部副本负责的池数之和为 0。池归属按 etcd 里注册的 MatchNodeService 实例做最高随机权重哈希:
              成员表为空时每个副本都撮合全部池,不会触发本条;触发说明成员表非空、但没有一个副本在表里认出自己
              (注册失败,或注册的实例 UUID 与本进程记的不一致),排队池没有写者,只剩单人档入队即开局。
              核 match 的注册日志与 etcd 里 MatchNodeService 前缀下的键。

        - alert: MatchPoolRoundSlow
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(match_pool_round_seconds_bucket[5m]))) > 0.4
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "按池撮合一轮的 p99 超过轮间隔的 0.8 倍"
            description: >-
              轮间隔缺省 500ms(MatcherIntervalMs),p99 超过 400ms 说明读页、成组、提交跟不上节拍,排队会越积越长。
              这是设计 §5.6 第 1 条的观察信号:先按压测汇总定位读页还是提交慢,再决定是否按机房拆写者。

        - alert: MatchPoolNoBattleNode
          expr: |
            sum by (mode) (rate(match_pool_claim_total{outcome="no_node"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "成组之后目标机房没有可选的 battle 节点"
            description: >-
              组已凑齐,但机房内的 battle 节点都在本副本熔断中或自报不接新房,这一组留到下一轮。
              核该机房 battle 节点数量、排空与 Agones 分配。

        - alert: MatchPoolGatherSlotsFull
          expr: |
            sum by (mode) (rate(match_pool_claim_total{outcome="no_slot"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "备战并发已满,成组的局留到下一轮"
            description: >-
              本副本同时备战的成局数达到 GlobalMatch.GatherSlots。核 scene 备战与 battle 建房耗时;
              容量不够时加副本,不要只调大槽数掩盖下游变慢。

    # 后台循环的活性(2026-11-12,缺口清单第 25 条第六批,docs/design/assetop-redelivery-sharding-20261110.md §14.10)。
    # 经 StartSourceLoop / StartRelayLoop 起的循环(撮合、成局推进、到期终局恢复、整队维护、观战维护等)与投榜循环
    # 各报一条「最近一次跑完一轮的时刻」,point 是循环的点位名。按副本、按点位逐条判,不聚合:撮合与投榜按片分给各副本,
    # 一个副本的循环停住,别的副本照常推进,聚合会把它盖住。没起这个循环的副本、循环已经有意停止的副本没有序列,不会误报。
    # 阈值 300 秒:现有循环最长 1 分钟一拍、一轮预算最长 30 秒(StartSourceLoop 的注释),300 秒是它们的 3 倍以上。
    # 每一轮都 panic 时这条会响,同时还有 go-background-alerts.yaml 的 GoBackgroundPanicRecovered;终局发件箱另有一条,
    # 在 match-outcome-outbox-alerts.yaml。
    - name: match.loop-liveness
      interval: 60s
      rules:
        - alert: MatchBackgroundLoopStalled
          expr: |
            time() - match_loop_last_run_unixtime > 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} 的 match 后台循环 {{ $labels.point }} 超过 5 分钟没有跑完一轮"
            description: >-
              这个副本的 {{ $labels.point }} 已经 {{ $value | printf "%.0f" }} 秒没有跑完一轮:卡在某一轮里不返回、每一轮都 panic,
              或循环意外退出(序列停在退出的那一刻)。撮合与投榜按片分工,停住的副本名下的撮合段、投榜片没人做,
              这些段的排队不成局、排名不更新,别的副本照常推进。先按点位名查这个 Pod 的日志(goroutine_panic 事件带栈),
              再看它连的库与 Redis;查不出就重启这个 Pod,它的片会换到别的副本。
