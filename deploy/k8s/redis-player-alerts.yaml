# Prometheus alert rules for the player-domain Redis Cluster(玩家域 Redis Cluster,deploy/k8s/manifests/infra/redis-player-cluster.yaml)。
#
# 来源:docs/design/redis-player-store-cluster.md §7(持久性与故障转移)、§8(扩缩容);处置见 docs/ops/redis-player-cluster-runbook.md。
# 控制域(redis、redis-ha、redis-queue-g<N>、redis-match-cluster)的规则在 deploy/k8s/redis-alerts.yaml,不在这里。
#
# Install as a PrometheusRule CR (kube-prometheus stack),与 redis-alerts.yaml 同法:
#   kubectl apply -n observability -f deploy/k8s/redis-player-alerts.yaml
#
# Scrape prerequisites:
#   - redis-player 的每个 Pod 带 redis-exporter sidecar,指标端口 9121,Pod 模板带 prometheus.io/scrape|port|path 注解。还需要一个指向该端口的
#     PodMonitor(或按注解抓取的配置),否则下面全部规则没有数据:空表达式不报错,和「一切正常」长得一样。
#   - namespace、pod 两个 label 由抓取配置附加。规则用 pod=~"redis-player-[0-9]+" 限定在本集群,不用任何玩家维度(低基数)。
#
# 指标名按 redis_exporter v1.62.0 的命名凭记忆写成,**未在本机核实**(同 redis-alerts.yaml):redis_up、redis_cluster_state、redis_cluster_slots_assigned、
#   redis_cluster_slots_ok、redis_cluster_known_nodes、redis_memory_used_bytes、redis_memory_max_bytes、redis_errorstat_total{err}、
#   redis_rejected_connections_total、redis_connected_clients、redis_config_maxclients、redis_aof_last_write_status、redis_master_link_up、
#   redis_instantaneous_ops_per_sec。部署后逐个对着 exporter 的 /metrics 核对,对不上就改这里 —— 指标名写错的规则不报错,只是永远不响。
#
# 阈值与 for 时长是占位值,**待压测确认**(设计 §14.3、AGENTS.md §6:没有压测对比不下容量结论)。
#
# Severity conventions(与 scene-manager-alerts.yaml 相同):
#   critical = pager, someone wakes up
#   warning  = next-business-hours channel
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: redis-player-alerts
  labels:
    app: redis-player
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: redis.player-domain
      interval: 30s
      rules:
        # exporter 连不上本 Pod 的 redis-server:节点挂了、在重放 AOF,或口令不对。主节点挂了副本约 5s + 选举后接管,这条告警说明节点持续不可用;
        # 这一片再失去一个节点就没有副本可切。
        - alert: RedisPlayerNodeDown
          expr: |
            redis_up{pod=~"redis-player-[0-9]+"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "玩家域 Redis 节点 {{ $labels.namespace }}/{{ $labels.pod }} 不可达"
            description: "redis_exporter 连不上本 Pod 的 redis-server 已超过 1 分钟。先看该 Pod 的 redis 容器日志(是否在重放 AOF、是否 OOMKill),再看 Secret redis-player-auth。处置见 docs/ops/redis-player-cluster-runbook.md「节点故障」。"

        # 节点自己报告的集群状态不是 ok:与多数派失联(这个节点停止服务)、或全部主节点失联。cluster-require-full-coverage no 时一片全挂不会让它变成 fail,
        # 那一种情况看下面的 RedisPlayerSlotsNotCovered。
        - alert: RedisPlayerClusterStateNotOk
          expr: |
            redis_cluster_state{pod=~"redis-player-[0-9]+"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "玩家域 Redis 节点 {{ $labels.namespace }}/{{ $labels.pod }} 报告集群状态非 ok"
            description: "cluster_state 不是 ok 已超过 1 分钟:这个节点上的 slot 回 CLUSTERDOWN,C++ 路由层预算耗尽后按空应答上报,对应玩家的进场与交接失败。多个节点同时亮多半是网络分区。处置见手册「节点故障」。"

        # slot 没有全覆盖。这是「一片主从都挂了」的唯一信号:cluster_state 这时还是 ok,其余 slot 照常服务,这 1/M 的玩家全部失败。
        # 取全部节点里最小的读数:节点之间在 gossip 收敛前可能不一致,持续 1 分钟仍缺就是真的缺。
        # 读数是 16384 也不代表没有问题:新节点加入、迁移时 assigned 不变,所以只把它当下限。
        - alert: RedisPlayerSlotsNotCovered
          expr: |
            min by (namespace) (redis_cluster_slots_ok{pod=~"redis-player-[0-9]+"}) < 16384
            or
            min by (namespace) (redis_cluster_slots_assigned{pod=~"redis-player-[0-9]+"}) < 16384
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "玩家域 Redis Cluster {{ $labels.namespace }} 有 slot 没有可用的主节点"
            description: "cluster_slots_ok 或 cluster_slots_assigned 低于 16384。落在这些 slot 的玩家读写全部失败(回 CLUSTERDOWN Hash slot not served),其余玩家不受影响。先 redis-cli --cluster check 看缺哪一段;处置见手册「节点故障」的「一片主从都挂了」。不要直接跑 --cluster fix,它可能把缺的 slot 分给空节点,旧数据就回不来了。"

        # 节点数比部署时少:有节点失联被标记 fail,或者节点被移出了集群。known_nodes 在扩容时会变大,只比自己的历史没有意义,所以只比最大值 ——
        # 节点之间读数不一致说明有节点没有与其他节点收敛。
        - alert: RedisPlayerNodesDisagree
          expr: |
            max by (namespace) (redis_cluster_known_nodes{pod=~"redis-player-[0-9]+"})
            !=
            min by (namespace) (redis_cluster_known_nodes{pod=~"redis-player-[0-9]+"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "玩家域 Redis Cluster {{ $labels.namespace }} 的节点对成员表没有收敛"
            description: "各节点的 cluster_known_nodes 不一致已超过 10 分钟。扩容入群刚做完的几秒内是正常的,持续不收敛多半是某个节点的集群总线端口不通(Service 的 16379),或 CLUSTER FORGET 只在部分节点上做了。处置见手册「核对清单」。"

        # 从节点与主节点断链。这一片在此期间没有可切的副本,主再挂就丢这一片的可用性。
        - alert: RedisPlayerReplicaLinkDown
          expr: |
            redis_master_link_up{pod=~"redis-player-[0-9]+"} == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "玩家域 Redis 从节点 {{ $labels.namespace }}/{{ $labels.pod }} 与主节点断链"
            description: "master_link_status 为 down 已超过 2 分钟。全量同步期间也会这样(每主 25 GB 量级是分钟级),持续更久看 Secret redis-player-auth(副本靠 --masterauth 连主)与主节点的 client-output-buffer。"

        # 内存逼近 maxmemory。玩家域一律 noeviction:写满后写命令直接报 OOM,不会静默淘汰。先于上限告警,给扩容留时间(§7)。
        - alert: RedisPlayerMemoryNearMax
          expr: |
            redis_memory_max_bytes{pod=~"redis-player-[0-9]+"} > 0
            and
            redis_memory_used_bytes{pod=~"redis-player-[0-9]+"} / redis_memory_max_bytes{pod=~"redis-player-[0-9]+"} > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "玩家域 Redis 节点 {{ $labels.namespace }}/{{ $labels.pod }} 内存超过 maxmemory 的 80%"
            description: "used_memory / maxmemory 持续 5 分钟高于 80%。noeviction 下写满即拒写。按手册「扩容」加主节点、迁 slot;不要改成淘汰型策略(玩家态不允许淘汰)。只有一个节点高说明 slot 分布不均,按手册核对每主 slot 数与键数。"

        # 已经有写命令因为写满被拒。不是「快满了」,是已经在丢写。
        - alert: RedisPlayerOomRejected
          expr: |
            increase(redis_errorstat_total{pod=~"redis-player-[0-9]+", err="OOM"}[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "玩家域 Redis 节点 {{ $labels.namespace }}/{{ $labels.pod }} 出现 OOM 拒写"
            description: "5 分钟内有写命令被 noeviction 拒绝。C++ 路由层把 OOM 归为未执行、按时间预算重试,耗尽后按空应答上报,落在这个节点的玩家进场、交接持续失败。立即按手册「扩容」处理,或排查异常增长的键族。"

        # 新连接被拒:每节点连接数撞到 maxclients。加主节点没有用(§6.3),连接数只取决于客户端进程数。
        - alert: RedisPlayerConnectionsRejected
          expr: |
            increase(redis_rejected_connections_total{pod=~"redis-player-[0-9]+"}[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "玩家域 Redis 节点 {{ $labels.namespace }}/{{ $labels.pod }} 拒绝了新连接"
            description: "5 分钟内有连接因 maxclients 被拒。对照部署时打印的 Redis player connection ledger 一行核对总账,在线 CONFIG SET maxclients 先止血,再按手册改 MAXCLIENTS 并滚动。到线后 redis-cli 自己也连不上。"

        - alert: RedisPlayerConnectionsNearMax
          expr: |
            redis_config_maxclients{pod=~"redis-player-[0-9]+"} > 0
            and
            redis_connected_clients{pod=~"redis-player-[0-9]+"} / redis_config_maxclients{pod=~"redis-player-[0-9]+"} > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "玩家域 Redis 节点 {{ $labels.namespace }}/{{ $labels.pod }} 连接数超过 maxclients 的 80%"
            description: "connected_clients / maxclients 持续 5 分钟高于 80%,与 k8s_deploy.ps1 玩家域连接总账的 80% 水位同口径。加主节点不会降低每节点连接数;降 PoolSizePerNode、减副本,或抬 MAXCLIENTS。"

        # AOF 最近一次写失败(磁盘满、IO 错误)。持久化失效时节点重启会丢数据;副本一起满的话主从都丢。
        - alert: RedisPlayerAofWriteFailed
          expr: |
            redis_aof_last_write_status{pod=~"redis-player-[0-9]+"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "玩家域 Redis 节点 {{ $labels.namespace }}/{{ $labels.pod }} AOF 写失败"
            description: "aof_last_write_status 不是 ok 已超过 1 分钟。检查 PVC 容量与节点磁盘;scene_manager 铸造 owner_epoch 的 WAITAOF 此时确认不足,这 1/M 的玩家首登与换节点回 7。扩盘按手册。"
