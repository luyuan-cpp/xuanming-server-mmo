# Prometheus alert rules for owner_epoch 铸造(玩家存盘的属主代次,由 scene_manager 铸造)。
#
# 来源:docs/design/zone-redis-regression-guard-20261022.md §7(铸造的落盘确认与墙钟地板);
#       代次怎么用见 docs/design/player-save-direct-commit.md §3 / §4:写权判定在 go/db 的提交事务里,
#       认领时把库里的代次抬上去,老持有者的下一笔立刻被拒,不依赖 Redis 里的任何判定。
#
# Install as a PrometheusRule CR (kube-prometheus stack),与 scene-manager-alerts.yaml 同法:
#   kubectl apply -n observability -f deploy/k8s/owner-epoch-alerts.yaml
#
# Scrape prerequisites:
#   - scene_manager 的指标端口(本地惯例 ":9150",AGENTS.md §6.1)。
#   - A ServiceMonitor or PodMonitor pointed at that port.
#
# go/db 侧的写权结局记在 db_player_store_requests_total{op,result},result 取 proto 枚举名
# (SAVE_PLAYER_STALE_OWNER / SAVE_PLAYER_NOT_HOLDER / SAVE_PLAYER_UNCLAIMED / SAVE_PLAYER_OLDER_SEQ /
# LOAD_AND_CLAIM_STALE_OWNER / LOAD_AND_CLAIM_NOT_HOLDER 等)。告警在 player-store-alerts.yaml。
#
# scene 侧也有 Prometheus 出口(环境变量 MMORPG_METRICS_PORT,k8s_deploy.ps1 -CppMetricsPort 缺省 9400),
# 已导出 scene_owner_epoch_events_total{event}(含旧持有者被拒 stale_owner_write_rejected)、
# scene_travel_handoff_*、scene_player_store_save_refused_total{result}
# (cpp/libs/services/scene/player/system/player_ownership_metrics.{h,cpp}),本文件暂未给它们写规则。
# 其余信号(资产操作因 epoch = 0 被挡、"save outran reconnect lease" 等 metric=... 日志行)仍只存在于 scene 日志,
# 而仓库里 Loki 的 ruler 目前没有挂载规则目录、也没有 alertmanager_url,不存在能生效的日志告警通路。
# 这几条 LogQL 写在 docs/ops/cross-zone-failure-test-runbook.md,作为值班固定查询;ruler 接线归上线批 BK8s。
#
# Severity conventions(与 scene-manager-alerts.yaml 相同):
#   critical = pager, someone wakes up
#   warning  = next-business-hours channel
#   info     = dashboard annotation / trend signal
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: owner-epoch-alerts
  labels:
    app: scene-manager
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    # 序列都在启动时预建,increase 能抓到第一次。
    - name: owner-epoch.mint
      interval: 30s
      rules:
        - alert: SceneManagerOwnerEpochMintNotDurable
          expr: |
            sum by (namespace, result) (increase(scene_manager_owner_epoch_mint_durable_total{result!="confirmed"}[10m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的 owner_epoch 铸造未能确认落盘({{ $labels.result }})"
            description: >-
              铸造后 WAITAOF 没有确认到要求的落盘份数,本次进场已回滚并让客户端重试。偶发属正常;持续出现说明
              Redis 刷盘或复制落后,进场会持续失败。核对 Redis 的 AOF 与从库状态;阈值已定(2026-11-12),压测出基线后可调:铸造未确认在健康的 Redis(AOF everysec + 同步从库)上应为 0,故按「10 分钟内出现即报」,不用比例阈值;持续出现说明刷盘或复制落后。

        - alert: SceneManagerOwnerEpochMintClockBehind
          expr: |
            sum by (namespace) (increase(scene_manager_owner_epoch_mint_clock_behind_total[10m])) > 0
          for: 0m
          labels:
            severity: info
          annotations:
            summary: "{{ $labels.namespace }} 的 scene_manager 墙钟不大于已铸的 owner_epoch"
            description: >-
              铸造的墙钟地板没有起作用(退化为当前值 + 1)。通常是 scene_manager 主机之间时钟偏差,
              或主机时钟回拨。Redis 回退后重铸同值的防护依赖墙钟单调,核对主机 NTP 与时钟偏差监控。
              偶发一次也可能是推路由失败回滚(铸出值 + 1)后同一毫秒内的重试,这种不用处理;持续增长才查时钟。

        - alert: SceneManagerOwnerEpochRollbackReceiptPending
          expr: |
            sum by (namespace, site, result) (increase(scene_manager_owner_epoch_rollback_receipt_total{result!="confirmed"}[10m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 有回滚回执没能确认落盘({{ $labels.site }}/{{ $labels.result }})"
            description: >-
              两段回执(docs/design/zone-redis-regression-guard-20261022.md §4.3.4):凭标记的回滚(推路由失败或铸造没确认落盘)
              之后、或进场前对待确认回执的确认,没能确认落盘。site=rollback 时源 scene 不采纳回滚值,按"标记已发出"踢线,玩家重登
              (C++ 汇总行 rollback_unconfirmed);site=enter 时这次进场回可重试错误,不下发 epoch。与 SceneManagerOwnerEpochMintNotDurable
              同时出现属同一原因:Redis 刷盘或副本落后,核对 Redis 的 AOF 与从库状态。site=rollback 的 not_sent 与 pending 在 Kafka
              写满超时时也会响:推路由用掉了大半请求预算,留给确认的时间不够(不足 1ms 记 not_sent,等不到份数记 pending),
              这时对照 scene_manager 的 Kafka 投递失败,Redis 本身未必有问题。
