apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
    tier: java-svc
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
    tier: java-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        tier: java-svc
    spec:
      containers:
        - name: gateway
          image: PLACEHOLDER_IMAGE
          imagePullPolicy: PLACEHOLDER_PULL_POLICY
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            # 显式限制堆，避免 JDK/cgroup 组合误按宿主内存计算最大堆。
            # 1Gi 容器预算中保留 640Mi 给 metaspace、线程栈、直接缓冲区及其他 native 内存。
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx384m"
          volumeMounts:
            - name: svc-config
              mountPath: /app/config
              readOnly: true
          # Spring/JPA 冷启动在资源受限时可能超过 liveness 的失败预算。
          # startupProbe 成功前暂停 readiness/liveness，避免启动尚未完成就反复被杀。
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: svc-config
          configMap:
            name: java-svc-gateway-config
