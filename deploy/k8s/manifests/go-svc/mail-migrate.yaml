# 现役配置以服务 YAML 为源；不恢复历史 M1 表、AdminToken 或 Redis 权威榜运行时。
# 只迁结构，不读取producer/资产密钥。DSN 的账号是 schema 主体，和 Add-SchemaPermissionManifest 注入的 MMORPG_SQL_SCHEMA_PRINCIPAL 出自同一个 schemaPermissionSecret（键 dsn、principal），占位由它替换。
apiVersion: batch/v1
kind: Job
metadata:
  name: mail-migrate
  labels: {app: mail-migrate, tier: go-svc}
spec:
  backoffLimit: 4
  podFailurePolicy:
    rules:
      - action: FailJob
        onExitCodes: {containerName: mail-migrate, operator: In, values: [1, 4]}
      - action: Ignore
        onPodConditions:
          - {type: DisruptionTarget}
  template:
    metadata:
      labels: {app: mail-migrate, tier: go-svc}
    spec:
      restartPolicy: Never
      containers:
        - name: mail-migrate
          image: PLACEHOLDER_IMAGE
          imagePullPolicy: PLACEHOLDER_PULL_POLICY
          args: ["-f", "/app/etc/mail.yaml", "-migrate"]
          env:
            - name: MMORPG_MAIL_SQL_DSN
              valueFrom:
                secretKeyRef: {name: PLACEHOLDER_SCHEMA_PERMISSION_SECRET, key: dsn, optional: false}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 1000m, memory: 512Mi}
          volumeMounts:
            - {name: svc-config, mountPath: /app/etc, readOnly: true}
      volumes:
        - name: svc-config
          configMap: {name: go-svc-mail-config}
