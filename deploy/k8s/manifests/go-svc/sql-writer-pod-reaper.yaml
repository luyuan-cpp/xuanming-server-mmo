# sql-writer-pod-reaper:删掉写资格已经消费、主容器再也起不来的写者 Pod。每个跑写者的 namespace 一份(k8s_deploy.ps1 Apply-SqlWriterPodReaper:每个 zone、infra namespace)。
#
# 为什么要它:写资格一次性(docs/design/horizontal-scale-logical-db.md §2「写资格什么时候消费」)。写者写过之后崩溃、被 OOMKill,容器原地重启读到消费标记就拒启,
# 这个 Pod 自己再也起不来,只有删掉,ReplicaSet 建的新 Pod 才会领名册的下一条。没有它,一次 panic 就永久少一个副本。
#
# 判据:带 label mmorpg.io/sql-writer=true 的 Pod,status.containerStatuses 里有容器上一次以退出码 78 退出。写者的入口脚本(各写者清单和 Dockerfile.java-svc)看到消费标记就退出 78,别的退出都不是这个码。
#   - 还没写过就退出的进程(依赖没就绪)没有消费标记,容器原地重启接着用这份写资格,不删,不烧名册。Java 读的时候就消费,所以 gateway 任何一次重启都是 78。
#   - containerStatuses 只有主容器,init 不在里面。init 反复失败(闸门冻结、名册用完)这里看不到,这种 Pod 不删,删了白烧名册;它们由告警 SqlWriterRegistrarFailing 覆盖。
#   - 已经在删的 Pod(带 deletionTimestamp)跳过,不重复打日志。
#   - kubectl delete 不走 Eviction API,不受 PDB 约束。这种 Pod 本来就没在服务,不会多减可用副本。
#
# 每删一次烧一条名册。名册用完之后新 Pod 停在 Init,要换名册重新部署,见手册。
#
# 为什么没有 shell 脚本:官方镜像 registry.k8s.io/kubectl 是 distroless(基础镜像 go-runner),没有 /bin/sh,只有 /go-runner 和 /bin/kubectl(已按 v1.35.10 的镜像配置核过)。所以拆成两步,靠 emptyDir 传一个文件:
#   select-restarted-writers(init):kubectl get 按 go-template 把要删的 Pod 写成 YAML。/go-runner 把 stdout 同时写进文件和容器日志,带的注释行就是删除前的日志;kubectl 的 stderr 不进文件。
#   delete-restarted-writers:kubectl delete -f 这个文件。空文件打印 No resources found、退出 0。v1.35 的输出是 pod "<name>" deleted from <namespace> namespace,这就是删除后的日志。
# 任何一步失败 Job 就失败,不重试(backoffLimit: 0),下一分钟的 Job 重新判断。kubectl get 失败时 delete 那一步不会跑。
#
# 只读日志:kubectl -n <ns> logs job/<job> -c select-restarted-writers(或 -c delete-restarted-writers)。保留最近 1 个成功、3 个失败的 Job。
#
# 占位由 Apply-SqlWriterPodReaper 替换:镜像(-SqlWriterReaperImage)、拉取策略、namespace。RoleBinding 的 subjects 必须写 namespace,kubectl apply -n 不会替它补。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sql-writer-pod-reaper
  labels:
    app: sql-writer-pod-reaper
    tier: go-svc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sql-writer-pod-reaper
  labels:
    app: sql-writer-pod-reaper
    tier: go-svc
rules:
  # 只有 pods 的这三个动词。kubectl delete 带 --wait=false,不需要 watch。
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sql-writer-pod-reaper
  labels:
    app: sql-writer-pod-reaper
    tier: go-svc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sql-writer-pod-reaper
subjects:
  - kind: ServiceAccount
    name: sql-writer-pod-reaper
    namespace: PLACEHOLDER_SQL_WRITER_REAPER_NAMESPACE
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sql-writer-pod-reaper
  labels:
    app: sql-writer-pod-reaper
    tier: go-svc
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  # 控制器停过一阵之后错过的调度不补,下一分钟照常判断。不写的话错过超过 100 次这个 CronJob 就不再调度。
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # 小于调度周期:上一个 Job 卡住时不挡下一分钟(Forbid 下上一个没结束就跳过这一轮)。
      activeDeadlineSeconds: 50
      template:
        metadata:
          labels:
            app: sql-writer-pod-reaper
            tier: go-svc
        spec:
          serviceAccountName: sql-writer-pod-reaper
          restartPolicy: Never
          # 镜像默认 root,这里钉成非 root:有的集群禁 root 容器。emptyDir 由 fsGroup 给写权限。
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: select-restarted-writers
              image: PLACEHOLDER_SQL_WRITER_REAPER_IMAGE
              imagePullPolicy: PLACEHOLDER_PULL_POLICY
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                # kubectl 的发现缓存要写 $HOME/.kube,根文件系统只读。
                - name: HOME
                  value: /work
              command: ["/go-runner"]
              args:
                - --log-file=/work/restarted-writers.yaml
                - --also-stdout=true
                - --redirect-stderr=false
                - /bin/kubectl
                - get
                - pods
                - --namespace=$(POD_NAMESPACE)
                - --selector=mmorpg.io/sql-writer=true
                - --request-timeout=20s
                # 退出码转成字符串再比:模板里数字的 Go 类型跟 kubectl 版本走(int64 或 float64),和常量直接比类型不符时整个模板报错。
                - |-
                  --output=go-template={{range .items}}{{if .metadata.deletionTimestamp}}{{else}}{{$pod := .}}{{range .status.containerStatuses}}{{if .lastState}}{{if .lastState.terminated}}{{if eq (printf "%v" .lastState.terminated.exitCode) "78"}}---
                  # sql-writer-pod-reaper: deleting pod {{$pod.metadata.name}} in namespace {{$pod.metadata.namespace}}: container {{.name}} exited 78, its writer grant is consumed, a new pod takes the next roster entry
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: {{$pod.metadata.name}}
                    namespace: {{$pod.metadata.namespace}}
                  {{end}}{{end}}{{end}}{{end}}{{end}}{{end}}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: work
                  mountPath: /work
          containers:
            - name: delete-restarted-writers
              image: PLACEHOLDER_SQL_WRITER_REAPER_IMAGE
              imagePullPolicy: PLACEHOLDER_PULL_POLICY
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: HOME
                  value: /work
              command: ["/bin/kubectl"]
              args:
                - delete
                - --namespace=$(POD_NAMESPACE)
                - --filename=/work/restarted-writers.yaml
                # 另一个操作者先删了不算失败。
                - --ignore-not-found=true
                # 不等 Pod 退干净:优雅退出要几十秒,会超过 activeDeadlineSeconds。
                - --wait=false
                - --request-timeout=20s
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: work
                  mountPath: /work
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 16Mi
