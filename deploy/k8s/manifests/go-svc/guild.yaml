# 现役配置以服务 YAML 为源；不恢复历史 M1 表、AdminToken 或 Redis 权威榜运行时。
# 全球帮会池：每个boot使用独立SQL主体，服务启动强制验证TiDB、原REGISTER与强读会话。
apiVersion: v1
kind: Service
metadata:
  name: guild
  labels: {app: guild, tier: go-svc}
spec:
  selector: {app: guild}
  ports:
    - {name: grpc, port: 50300, targetPort: 50300}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: guild
  labels: {app: guild, tier: go-svc}
spec:
  replicas: 2
  # SQL 写者是 StatefulSet:Pod 序号就是写者名册的槽位,每次启动在同一槽位上换代,名册不随启动次数消耗
  # (docs/design/writer-roster-exhaustion-20261106.md §5.5)。滚动一次换一个副本,不能 maxSurge。
  serviceName: guild
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels: {app: guild}
  template:
    metadata:
      labels: {app: guild, tier: go-svc, mmorpg.io/sql-writer: "true"}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9220"
        prometheus.io/path: /metrics
        mmorpg.io/asset-op-secret-guild-hash: "PLACEHOLDER_ASSET_OP_SECRET_HASH"
    spec:
      terminationGracePeriodSeconds: 35
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: {app: guild}
                topologyKey: kubernetes.io/hostname
      # 独立registrar只在init读取槽位名册与控制凭据,按 Pod 序号选槽位、现场生成这一代的身份;normal只见本Pod选中配置。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: sql-writer-registrar
          image: PLACEHOLDER_SQL_WRITER_REGISTRAR_IMAGE
          command: ["/bin/sh", "-ec"]
          args: ["umask 077; mkdir -p /run/sql-writer/grant/private /run/sql-writer/runtime/private/env; exec /app/service \"$@\"","--","-command","register","-roster","/run/sql-writer/input/request/roster.json","-roster-sha256","PLACEHOLDER_SQL_WRITER_ROSTER_SHA256","-input-root","/run/sql-writer/input","-lock-qualification","/run/sql-writer/input/request/lock-qualification.original","-runtime-config-output","/run/sql-writer/runtime/private/guild.yaml","-runtime-env-output","/run/sql-writer/runtime/private/env","-boot-output","/run/sql-writer/grant/private/boot-grant.json","-deployment-id","$(MMORPG_SQL_DEPLOYMENT_ID)","-pod-name","$(POD_NAME)"]
          env:
            - name: MMORPG_SQL_DEPLOYMENT_ID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: MMORPG_SQL_OPERATOR_PRINCIPAL
              valueFrom:
                secretKeyRef: {name: PLACEHOLDER_SQL_WRITER_REGISTRAR_SECRET, key: principal, optional: false}
            - name: MMORPG_SQL_REGISTRAR_DSN
              valueFrom:
                secretKeyRef: {name: PLACEHOLDER_SQL_WRITER_REGISTRAR_SECRET, key: dsn, optional: false}
            - name: MMORPG_SQL_PHYSICAL_AUTHORITY_SHA256
              value: "PLACEHOLDER_SQL_WRITER_PHYSICAL_SHA256"
          volumeMounts:
            - {name: sql-writer-request, mountPath: /run/sql-writer/input/request, readOnly: true}
            - {name: sql-writer-runtime-input, mountPath: /run/sql-writer/input/runtime, readOnly: true}
            - {name: sql-writer-grant, mountPath: /run/sql-writer/grant}
            - {name: svc-config, mountPath: /run/sql-writer/runtime}
      containers:
        - name: guild
          image: PLACEHOLDER_IMAGE
          imagePullPolicy: PLACEHOLDER_PULL_POLICY
          command: ["/bin/sh", "-ec"]
          args: ["(umask 077; mkdir -p /run/sql-writer/consume/private); if ls /run/sql-writer/consume/private/*.consumed >/dev/null 2>&1; then echo sql writer grant already consumed, the reaper replaces this pod >&2; exit 78; fi; MMORPG_SQL_WRITER_GRANT_SHA256=\"$(cat /run/sql-writer/grant/private/boot-grant.json.sha256)\"; export MMORPG_SQL_WRITER_GRANT_SHA256; MMORPG_GUILD_SQL_DSN=\"$(cat /app/etc/private/env/MMORPG_GUILD_SQL_DSN)\"; export MMORPG_GUILD_SQL_DSN; exec /app/service \"$@\"","--","-f","/app/etc/private/guild.yaml"]
          env:
          # grant只读，consume留在同PodemptyDir；同Podrestart不得重复消费boot。
            - name: MMORPG_SQL_WRITER_GRANT_FILE
              value: /run/sql-writer/grant/private/boot-grant.json
            - name: MMORPG_SQL_WRITER_CONSUME_DIR
              value: /run/sql-writer/consume/private
            - name: MMORPG_SQL_DEPLOYMENT_ID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: MMORPG_SQL_PHYSICAL_AUTHORITY_SHA256
              value: "PLACEHOLDER_SQL_WRITER_PHYSICAL_SHA256"
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
            - name: MMORPG_ASSET_OP_SECRET_GUILD
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: asset-guild, optional: false}
            - name: MMORPG_MATCH_INTERNAL_SECRET_GUILD
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: match-internal-guild, optional: false}
            # 角色护栏:GUILD 读 data_service 的权威状态,COORDINATOR 验协调者的调用。缺了拒绝启动。
            - name: MMORPG_ROLE_FENCE_SECRET_GUILD
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: role-fence-guild, optional: false}
            - name: MMORPG_ROLE_FENCE_SECRET_COORDINATOR
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: role-fence-coordinator, optional: false}
          ports:
            - {name: grpc, containerPort: 50300}
            - {name: metrics, containerPort: 9220}
          # 启动时读 data_service.GetMergedZones,读不到等 60 秒后退出(go/shared/mergedzone),gRPC 口在那之后才监听。
          # 启动探针给足 150 秒:不抢在进程自己判定之前杀它,也盖住读到映射之后的排名重建;通过之后才开始 readiness / liveness。
          startupProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: grpc}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: grpc}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 1000m, memory: 512Mi}
          volumeMounts:
            - {name: sql-writer-grant, mountPath: /run/sql-writer/grant, readOnly: true}
            - {name: sql-writer-consume, mountPath: /run/sql-writer/consume}
            - {name: svc-config, mountPath: /app/etc, readOnly: true}
      volumes:
        - name: sql-writer-request
          secret: {secretName: PLACEHOLDER_SQL_WRITER_REQUEST_SECRET, defaultMode: 288}
        - name: sql-writer-runtime-input
          secret: {secretName: PLACEHOLDER_SQL_WRITER_RUNTIME_SECRET, defaultMode: 288}
        - name: sql-writer-grant
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: sql-writer-consume
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: svc-config
          emptyDir: {medium: Memory, sizeLimit: 20Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: guild-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: guild}
