# chat:全局聊天，历史窗口、永久原请求回执与限速均由同域TiDB权威决定。
#
# **全局池,只部署到 mmorpg-infra namespace 一次,不进任何 zone namespace。**
# 世界频道本就全服唯一(chat:{world}:log),私聊 key 只含两端 player_id,不含 zone;客户端经
# gate → client-rpc-router 到达,路由服对 ChatNodeService 不做 zone 过滤(ZoneScopedNodeTypes 默认仅 Login),
# 所以全 zone 的玩家都会被随机路由到这里的实例。
# k8s_deploy.ps1 的 $GoSvcCatalogue 里该条目标了 Global = $true,zone-up 会跳过它,
# infra-up / all-up 部署:ConfigMap 与迁移 Job 在基础设施阶段,进程排在第一个 zone 的 data-service 之后(见 k8s_deploy.ps1 的 Apply-GlobalGoSvcManifests)。ConfigMap go-svc-chat-config 由脚本生成。
#
# ⚠ 已知前提:chat 只承诺路由服模式可达。路由服部署链(镜像 / 目录 / ConfigMap / manifests/go-svc/client-rpc-router.yaml /
# C++ 发现前缀 / 按 POD_IP 通告)已登记齐,gate 的 GATE_CLIENT_RPC_ROUTER 在 K8s 上默认 "1"(k8s_deploy.ps1 -GateRouterMode,
# turn-based §22 D75),默认部署下玩家经 gate → client-rpc-router 可达(K8s 上路由模式 battle-smoke 事后补验)。
# 以 -GateRouterMode 0 回退时这份 Deployment 照样起得来、探针绿,但玩家够不着。
apiVersion: v1
kind: Service
metadata:
  name: chat
  labels:
    app: chat
    tier: go-svc
spec:
  type: ClusterIP
  selector:
    app: chat
  ports:
    - name: grpc
      port: 50700
      targetPort: 50700
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  labels:
    app: chat
    tier: go-svc
spec:
  # 多实例共用SQL原件与原角色P锁；旧Redis快照不参与历史、幂等或限速选择。
  # node_id仍由etcd CAS分配，所有实例的不可变SQL策略必须相同。
  # replicas>=2 是「容错不降级」的最低冗余。注意崩溃切换窗口 = ConfigMap 的 LeaseTTL:
  # 路由服 PickRandom 不看连接状态,死实例的注册 key 在租约到期前仍会被挑中。
  replicas: 2
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
        tier: go-svc
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9210"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          # 两个副本尽量不落同一节点,否则单节点故障等于全池不可用
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: chat
                topologyKey: kubernetes.io/hostname
      # 独立registrar只在init读取有限预批准roster与控制凭据；normal只见本Pod选中配置。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: sql-writer-registrar
          image: PLACEHOLDER_SQL_WRITER_REGISTRAR_IMAGE
          command: ["/bin/sh", "-ec"]
          args: ["umask 077; mkdir -p /run/sql-writer/runtime/env; exec /app/service \"$@\"","--","-command","register","-roster","/run/sql-writer/input/request/roster.json","-roster-sha256","PLACEHOLDER_SQL_WRITER_ROSTER_SHA256","-input-root","/run/sql-writer/input","-lock-qualification","/run/sql-writer/input/request/lock-qualification.original","-runtime-config-output","/run/sql-writer/runtime/chat.yaml","-runtime-env-output","/run/sql-writer/runtime/env","-boot-output","/run/sql-writer/grant/boot-grant.json","-deployment-id","$(MMORPG_SQL_DEPLOYMENT_ID)"]
          env:
            - name: MMORPG_SQL_DEPLOYMENT_ID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: MMORPG_SQL_OPERATOR_PRINCIPAL
              valueFrom:
                secretKeyRef: {name: PLACEHOLDER_SQL_WRITER_REGISTRAR_SECRET, key: principal, optional: false}
            - name: MMORPG_SQL_REGISTRAR_DSN
              valueFrom:
                secretKeyRef: {name: PLACEHOLDER_SQL_WRITER_REGISTRAR_SECRET, key: dsn, optional: false}
            - name: MMORPG_SQL_PHYSICAL_AUTHORITY_SHA256
              value: "PLACEHOLDER_SQL_WRITER_PHYSICAL_SHA256"
          volumeMounts:
            - {name: sql-writer-request, mountPath: /run/sql-writer/input/request, readOnly: true}
            - {name: sql-writer-runtime-input, mountPath: /run/sql-writer/input/runtime, readOnly: true}
            - {name: sql-writer-grant, mountPath: /run/sql-writer/grant}
            - {name: svc-config, mountPath: /run/sql-writer/runtime}
      containers:
        - name: chat
          image: PLACEHOLDER_IMAGE
          imagePullPolicy: PLACEHOLDER_PULL_POLICY
          env:
          # grant只读，consume留在同PodemptyDir；同Podrestart不得重复消费boot。
            - name: MMORPG_SQL_WRITER_GRANT_FILE
              value: /run/sql-writer/grant/boot-grant.json
            - name: MMORPG_SQL_WRITER_CONSUME_DIR
              value: /run/sql-writer/consume
            - name: MMORPG_SQL_DEPLOYMENT_ID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: MMORPG_SQL_PHYSICAL_AUTHORITY_SHA256
              value: "PLACEHOLDER_SQL_WRITER_PHYSICAL_SHA256"
            # 两个DSN必须同GlobalAuthorityTiDBHost事务域、库名mmorpg_chat；不同账号分别承担运行与DDL。
            # 值由运维在外部Secret预置，脚本不回显或写入ConfigMap。
            - name: LOGIN_REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: redis-auth, key: password, optional: true}
            - name: GOLANG_PROTOBUF_REGISTRATION_CONFLICT
              value: warn
            # C++ 约定注册(ChatNodeService.rpc)写进 NodeInfo 的对外 IP(chat.go advertisedHost 优先读它):
            # ListenOn 是 0.0.0.0,不能原样写;不注入时退回 netx.InternalIp(第一块非 loopback 网卡),
            # 多网卡 / sidecar / 部分 CNI 下可能选错网卡,路由服拨不通。与 data-service.yaml / login.yaml 同一写法。
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command: ["/bin/sh", "-ec"]
          args: ["MMORPG_SQL_WRITER_GRANT_SHA256=\"$(cat /run/sql-writer/grant/boot-grant.json.sha256)\"; export MMORPG_SQL_WRITER_GRANT_SHA256; CHAT_AUTHORITY_DSN=\"$(cat /app/etc/env/CHAT_AUTHORITY_DSN)\"; export CHAT_AUTHORITY_DSN; exec /app/service \"$@\"","--","-f","/app/etc/chat.yaml"]
          ports:
            - containerPort: 50700
              name: grpc
            # 与 ConfigMap 的 MetricsListenAddr ":9210" 及上面 prometheus.io/port 注解一致(9210 = chat)
            - containerPort: 9210
              name: metrics
          readinessProbe:
            grpc:
              port: 50700
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50700
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              # 先留 5s 让 Service 摘掉 endpoint;etcd 注册(noderegistry.Close)由进程收到 SIGTERM 后
              # 在 grpc Stop 之前删除,路由服 watch 到删除后不再挑这个实例。
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - {name: sql-writer-grant, mountPath: /run/sql-writer/grant, readOnly: true}
            - {name: sql-writer-consume, mountPath: /run/sql-writer/consume}
            - name: svc-config
              mountPath: /app/etc
              readOnly: true
            # 不挂 snowflake-cache:chat v1 不发号、不接 snowflakealloc,没有启动期槽位草稿要缓存。
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      terminationGracePeriodSeconds: 30
      volumes:
        - name: sql-writer-request
          secret: {secretName: PLACEHOLDER_SQL_WRITER_REQUEST_SECRET, defaultMode: 288}
        - name: sql-writer-runtime-input
          secret: {secretName: PLACEHOLDER_SQL_WRITER_RUNTIME_SECRET, defaultMode: 288}
        - name: sql-writer-grant
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: sql-writer-consume
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: svc-config
          emptyDir: {medium: Memory, sizeLimit: 20Mi}
---
# PDB 与主 manifest 同文件:k8s_deploy.ps1 只 apply 目录条目里的主 manifest。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chat-pdb
  labels:
    app: chat
    tier: go-svc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: chat
