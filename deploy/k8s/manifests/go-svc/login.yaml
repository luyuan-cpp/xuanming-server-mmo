apiVersion: v1
kind: Service
metadata:
  name: login
  labels:
    app: login
    tier: go-svc
spec:
  selector:
    app: login
  ports:
    - name: grpc
      port: 50000
      targetPort: 50000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: login
  labels:
    app: login
    tier: go-svc
spec:
  replicas: 2
  # SQL 写者是 StatefulSet:Pod 序号就是写者名册的槽位,每次启动在同一槽位上换代,名册不随启动次数消耗
  # (docs/design/writer-roster-exhaustion-20261106.md §5.5)。滚动一次换一个副本,不能 maxSurge。
  serviceName: login
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: login
  template:
    metadata:
      labels:
        app: login
        tier: go-svc
      # 这里不能手写 annotations:Pod 模板注解(削峰 / 微信密钥指纹与 prometheus.io/* 抓取注解)全部由
      # tools/scripts/k8s_deploy.ps1 的 Add-PodTemplateAnnotation 一次写入,已有 annotations: 段时它会拒绝部署。
    spec:
      affinity:
        podAntiAffinity:
          # 两个副本尽量不落同一节点:默认调度只是软打散,两个 login 可能同机,
          # 节点级故障会同时带走两副本,replicas 2 与 PDB 都救不了。写法同 match.yaml。
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: login
                topologyKey: kubernetes.io/hostname
      containers:
        - name: login
          image: PLACEHOLDER_IMAGE
          imagePullPolicy: PLACEHOLDER_PULL_POLICY
          env:
            # LoginAdmin 的运维口令(x-admin-token)。没有这个 key 时运维面整体停用,所以 optional。
            - name: MMORPG_LOGIN_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: login-admin-token, optional: true}
            - name: MMORPG_ACCOUNT_DIRECTORY_SECRET_LOGIN
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: account-directory-login, optional: false}
            - name: GOLANG_PROTOBUF_REGISTRATION_CONFLICT
              value: warn
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          args: ["-loginService", "/app/etc/login.yaml"]
          ports:
            - containerPort: 50000
              name: grpc
            # 与 ConfigMap 的 Prometheus.Port 9101 及 k8s_deploy.ps1 写入的 prometheus.io/port 注解一致(9101 = login),
            # 三处同批发布;契约测试 tools/scripts/tests/login_metrics_contract.tests.ps1。
            - containerPort: 9101
              name: metrics
          readinessProbe:
            grpc:
              port: 50000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50000
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: svc-config
              mountPath: /app/etc
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      terminationGracePeriodSeconds: 30
      volumes:
        - name: svc-config
          configMap:
            name: go-svc-login-config
---
# PDB 直接放在本文件里:k8s_deploy.ps1 只 apply 各服务目录表里登记的主 manifest,
# 独立的 login-pdb.yaml 从未被脚本应用过(见 scene-manager.yaml 同位置的说明),
# 节点排空时 K8s 可以同时驱逐两个 login 副本,该 zone 登录入口会出现完整空窗。
# 内容自 login-pdb.yaml 原样搬入,minAvailable 未改。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: login-pdb
  labels:
    app: login
    tier: go-svc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: login
