apiVersion: v1
kind: Service
metadata:
  name: login
  labels:
    app: login
    tier: go-svc
spec:
  selector:
    app: login
  ports:
    - name: grpc
      port: 50000
      targetPort: 50000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: login
  labels:
    app: login
    tier: go-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: login
  template:
    metadata:
      labels:
        app: login
        tier: go-svc
    spec:
      containers:
        - name: login
          image: PLACEHOLDER_IMAGE
          imagePullPolicy: PLACEHOLDER_PULL_POLICY
          env:
            - name: GOLANG_PROTOBUF_REGISTRATION_CONFLICT
              value: warn
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          args: ["-loginService", "/app/etc/login.yaml"]
          ports:
            - containerPort: 50000
              name: grpc
          readinessProbe:
            grpc:
              port: 50000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50000
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: svc-config
              mountPath: /app/etc
              readOnly: true
            # PlayerId 槽位本地缓存(docs/design/node-id-overhaul-plan-20260908.md §3.5):
            # 每个 Pod 自己的启动期草稿,etcd 不可达时凭它续用上次的槽位(2h 内),
            # 不跨 Pod 共享、不需要持久卷,Pod 重建就重新申领。路径必须与 ConfigMap 里的
            # SnowflakeCacheDir 一致(k8s_deploy.ps1 顶部 $SnowflakeCacheDir = /tmp/snowflake)。
            - name: snowflake-cache
              mountPath: /tmp/snowflake
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      terminationGracePeriodSeconds: 30
      volumes:
        - name: svc-config
          configMap:
            name: go-svc-login-config
        # 见上面 volumeMounts 的注释:每 Pod 一份 emptyDir,随 Pod 生灭。
        - name: snowflake-cache
          emptyDir: {}
