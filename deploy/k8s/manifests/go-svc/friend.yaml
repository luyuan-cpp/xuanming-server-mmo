# friend:全局好友(好友关系 / 申请 / 黑名单 / 推荐 + 跨区在线状态与 S2C 推送;docs/design/friend-port-20260918.md)。
#
# **全局池,只部署到 mmorpg-infra namespace 一次,不进任何 zone namespace。**
# 好友关系天然跨 zone(friend / friend_request / friend_block 三张表里没有 zone 列),
# 服务代码禁止按 zone 分支(契约 §0);客户端经 gate → client-rpc-router 到达,
# 路由服对 FriendNodeService 不做 zone 过滤。go/friend/etc/friend.yaml 里的 ZoneId 只影响
# etcd 注册路径,不是业务分区键。
# k8s_deploy.ps1 的 $GoSvcCatalogue 里该条目标了 Global = $true,zone-up 会跳过它,
# infra-up / all-up 部署:ConfigMap 与迁移 Job 在基础设施阶段,进程排在第一个 zone 的 data-service 之后(见 k8s_deploy.ps1 的 Apply-GlobalGoSvcManifests)。ConfigMap go-svc-friend-config 由脚本生成。
#
# 库与表(port-decisions D-14):
#   - 独占库 mmorpg_friend 由 mysql-init-sql ConfigMap 带入的 deploy/mysql-init/00_init_zone_dbs.sql 预建 + GRANT appuser
#     (建库只登记那一处;initdb 只对空 PVC 生效,存量 PVC 手工补,见 deploy/k8s/README.md「好友 friend」)。
#   - 表由同目录 friend-migrate.yaml 这个 Job(同一镜像 + 同一 ConfigMap,`-migrate`)按 proto/friend/friend_table.proto 建。
#     k8s_deploy.ps1 在本 Deployment **之前**先 delete 再 apply 它(上一次的 Job 还在途则先等它结束,绝不删在途 Job)。
#     staging/prod **恒等** Job Complete 才 apply 本文件,Failed / 超时即中断发布(D-14 第 4 条,不受 -WaitReady 控制);
#     dev 档只在 -WaitReady 下等。
#   - staging/prod 的 ConfigMap 固定 Schema.AutoMigrate=false:启动路径只跑一次只读 plan,有待执行语句或需人工项就拒绝启动
#     (fail-closed,日志打印补救命令),所以 Job 没跑成功时这里会 CrashLoop —— 这是预期,先看 `kubectl logs job/friend-migrate`。
#
# ⚠ 已知前提:friend 只承诺路由服模式可达(D-12)。gate 的 GATE_CLIENT_RPC_ROUTER 在 K8s 上默认 "1"(k8s_deploy.ps1 -GateRouterMode,
# turn-based §22 D75),默认部署下玩家经 gate → client-rpc-router 可达;以 -GateRouterMode 0 回退时这份 Deployment
# 照样起得来、探针绿,但玩家够不着。与 chat / trade 同口径,不是 friend 特有的。
#
# Kafka 命令 topic 的分区契约(gate-cmd_g<N>,friend 的 S2C 推送经它到目标 zone 的 gate):
#   **本文件不写 KAFKA_COMMAND_TOPIC_PARTITIONS / KAFKA_COMMAND_TOPIC_GENERATION** —— 这两个变量由
#   k8s_deploy.ps1 的 Add-GoSvcCommandTopicEnv 从 bin/etc/base_deploy_config.yaml 统一注入到下面唯一的 env: 段
#   (所有 go-svc 同一处真相;manifest 里手写会被部署脚本拒绝)。2026-09-28 之前没有这一步,Go 侧在 K8s 上
#   回落到 kafkacmd 的编译期默认 generation=1,而 C++ gate 消费 g2,推送静默丢失 —— 那个缺口已修。
#
# 连接数:ConfigMap 的 MySQL.MaxOpenConn × replicas(外加 migrate Job 的连接)要算进 MySQL 的 max_connections。
apiVersion: v1
kind: Service
metadata:
  name: friend
  labels:
    app: friend
    tier: go-svc
spec:
  type: ClusterIP
  selector:
    app: friend
  ports:
    - name: grpc
      port: 50400
      targetPort: 50400
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: friend
  labels:
    app: friend
    tier: go-svc
spec:
  # 多实例安全:好友写路径全部收在单条 MySQL 事务里(容量守卫行锁最先,统一锁序,解 AddFriend↔AcceptFriend 的 ABBA 环),
  # 配额 / 限流是 Redis 单 key 的 INCR+EXPIRE,缓存是带 hash tag 的单 key —— 实例之间不需要协调;
  # node_id 由 etcd CAS 分配(go/shared/noderegistry),路由服随机挑。
  # 启动期迁移(仅 dev 档 AutoMigrate=true)由 go/schemamigrate 的 GET_LOCK 串行化,两副本同时起不会并发 DDL。
  # ⚠ friend_request 的过期清理 sweep 在**每个副本**里都跑(见 friend.go 的启动横幅 sweep 行):
  #   它是幂等的分批 DELETE,两个副本同时清只是各删一批,不会写坏数据;默认 Mode=report_only 不删任何行。
  # replicas>=2 是「容错不降级」的最低冗余。崩溃切换窗口 = ConfigMap 的 LeaseTTL(路由服 PickRandom 不看连接状态)。
  replicas: 2
  selector:
    matchLabels:
      app: friend
  template:
    metadata:
      labels:
        app: friend
        tier: go-svc
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9180"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          # 两个副本尽量不落同一节点,否则单节点故障等于全池不可用
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: friend
                topologyKey: kubernetes.io/hostname
      # 独立registrar只在init读取有限预批准roster与控制凭据；normal只见本Pod选中配置。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: sql-writer-registrar
          image: PLACEHOLDER_SQL_WRITER_REGISTRAR_IMAGE
          command: ["/bin/sh", "-ec"]
          args: ["umask 077; mkdir -p /run/sql-writer/runtime/env; exec /app/service \"$@\"","--","-command","register","-roster","/run/sql-writer/input/request/roster.json","-roster-sha256","PLACEHOLDER_SQL_WRITER_ROSTER_SHA256","-input-root","/run/sql-writer/input","-lock-qualification","/run/sql-writer/input/request/lock-qualification.original","-runtime-config-output","/run/sql-writer/runtime/friend.yaml","-runtime-env-output","/run/sql-writer/runtime/env","-boot-output","/run/sql-writer/grant/boot-grant.json","-deployment-id","$(MMORPG_SQL_DEPLOYMENT_ID)"]
          env:
            - name: MMORPG_SQL_DEPLOYMENT_ID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: MMORPG_SQL_OPERATOR_PRINCIPAL
              valueFrom:
                secretKeyRef: {name: PLACEHOLDER_SQL_WRITER_REGISTRAR_SECRET, key: principal, optional: false}
            - name: MMORPG_SQL_REGISTRAR_DSN
              valueFrom:
                secretKeyRef: {name: PLACEHOLDER_SQL_WRITER_REGISTRAR_SECRET, key: dsn, optional: false}
            - name: MMORPG_SQL_PHYSICAL_AUTHORITY_SHA256
              value: "PLACEHOLDER_SQL_WRITER_PHYSICAL_SHA256"
          volumeMounts:
            - {name: sql-writer-request, mountPath: /run/sql-writer/input/request, readOnly: true}
            - {name: sql-writer-runtime-input, mountPath: /run/sql-writer/input/runtime, readOnly: true}
            - {name: sql-writer-grant, mountPath: /run/sql-writer/grant}
            - {name: svc-config, mountPath: /run/sql-writer/runtime}
      containers:
        - name: friend
          image: PLACEHOLDER_IMAGE
          imagePullPolicy: PLACEHOLDER_PULL_POLICY
          env:
          # grant只读，consume留在同PodemptyDir；同Podrestart不得重复消费boot。
            - name: MMORPG_SQL_WRITER_GRANT_FILE
              value: /run/sql-writer/grant/boot-grant.json
            - name: MMORPG_SQL_WRITER_CONSUME_DIR
              value: /run/sql-writer/consume
            - name: MMORPG_SQL_DEPLOYMENT_ID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: MMORPG_SQL_PHYSICAL_AUTHORITY_SHA256
              value: "PLACEHOLDER_SQL_WRITER_PHYSICAL_SHA256"
            - name: GOLANG_PROTOBUF_REGISTRATION_CONFLICT
              value: warn
            # C++ 约定注册(FriendNodeService.rpc)写进 NodeInfo 的对外 IP(friend.go 的 advertisedHost 优先读它):
            # ListenOn 是 0.0.0.0,不能原样写;不注入时退回第一块非 loopback 网卡,
            # 多网卡 / sidecar / 部分 CNI 下可能选错,路由服拨不通。
            # 与 chat.yaml / trade.yaml / data-service.yaml / login.yaml 同一写法。
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command: ["/bin/sh", "-ec"]
          args: ["MMORPG_SQL_WRITER_GRANT_SHA256=\"$(cat /run/sql-writer/grant/boot-grant.json.sha256)\"; export MMORPG_SQL_WRITER_GRANT_SHA256; exec /app/service \"$@\"","--","-f","/app/etc/friend.yaml"]
          ports:
            - containerPort: 50400
              name: grpc
            # 与 ConfigMap 的 MetricsListenAddr ":9180" 及上面 prometheus.io/port 注解一致(9180 = friend)
            - containerPort: 9180
              name: metrics
          readinessProbe:
            grpc:
              port: 50400
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50400
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              # 先留 5s 让 Service 摘掉 endpoint;etcd 注册(noderegistry.Close)由进程收到 SIGTERM 后
              # 在 grpc Stop 之前删除,路由服 watch 到删除后不再挑这个实例。
              # 5s + friend.go 的 24s 硬截止 = 29s,必须 < 下面的 terminationGracePeriodSeconds(30),
              # 否则 kubelet 会在进程自己收尾完成之前 SIGKILL,etcd 注册只能等 LeaseTTL 过期。
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - {name: sql-writer-grant, mountPath: /run/sql-writer/grant, readOnly: true}
            - {name: sql-writer-consume, mountPath: /run/sql-writer/consume}
            - name: svc-config
              mountPath: /app/etc
              readOnly: true
            # 不挂 snowflake-cache:friend 不发号(好友关系的主键是两个 player_id,申请与黑名单同理),
            # 不接 snowflakealloc,没有启动期槽位草稿要缓存。
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      terminationGracePeriodSeconds: 30
      volumes:
        - name: sql-writer-request
          secret: {secretName: PLACEHOLDER_SQL_WRITER_REQUEST_SECRET, defaultMode: 288}
        - name: sql-writer-runtime-input
          secret: {secretName: PLACEHOLDER_SQL_WRITER_RUNTIME_SECRET, defaultMode: 288}
        - name: sql-writer-grant
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: sql-writer-consume
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: svc-config
          emptyDir: {medium: Memory, sizeLimit: 20Mi}
---
# PDB 与主 manifest 同文件:k8s_deploy.ps1 只 apply 目录条目里的主 manifest。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: friend-pdb
  labels:
    app: friend
    tier: go-svc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: friend
