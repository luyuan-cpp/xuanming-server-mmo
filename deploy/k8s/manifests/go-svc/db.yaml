apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app: db
    tier: go-svc
spec:
  selector:
    app: db
  ports:
    - name: grpc
      port: 6000
      targetPort: 6000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels:
    app: db
    tier: go-svc
spec:
  # 2 副本(2026-10-08,docs/design/no-single-node-horizontal-scaling-20261001.md §3)。
  # scene 按 zone 发现 PlayerStoreNodeService 并经 gRPC 调 LoadAndClaim / SavePlayer(docs/design/player-save-direct-commit.md):
  # 存盘接口无状态,并发写由 player_store 表上的事务判定兜住,多实例不需要分区独占。
  # MySQL 连接预算:go/db 只连本地域的 K 个存档库(zone 库已退役,A17c),每库一个池,上限 = Placement.StoreMaxOpenConn(K=1 的预算 60)按 K 摊开、每库至少 2 条;
  # 按 zone 数 × 副本数计入共用 MySQL 的总账,公式与规划见 tools/scripts/k8s_deploy.ps1 Get-MysqlConnectionLedger
  # (滚动发布时每个工作负载按多 2 个实例计:新 Pod + 仍在优雅退出、连接未释放的旧 Pod;StatefulSet 一次只换一个,这样算偏保守)。
  replicas: 2
  # SQL 写者是 StatefulSet:Pod 序号就是写者名册的槽位,每次启动在同一槽位上换代,名册不随启动次数消耗
  # (docs/design/writer-roster-exhaustion-20261106.md §5.5)。滚动一次换一个副本,不能 maxSurge。
  serviceName: db
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  # minReadySeconds:新 Pod Ready 之后再等 20s 才算可用、才去换下一个副本。
  # 新 Pod Ready 后很快崩溃的不会被算作可用,滚动随之停住,其余副本不会被换掉。
  # 这个字段属于工作负载 spec、不在 Pod 模板里:改它不触发 Pod 重建,在下一次滚动时生效。
  minReadySeconds: 20
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
        tier: go-svc
        mmorpg.io/sql-writer: "true"
      # /metrics(2026-10-12 G2b):以前 K8s 上 db 的 ConfigMap 不写 MetricsListenAddr(缺省空串 = 不起端口),
      # 连接池指标 mmorpg_sql_pool_* 与 db_player_store_* 的抓取前提在集群里都不成立。
      # 端口与 ConfigMap 的 MetricsListenAddr ":9160" 一致(9160 与本地 go/db/etc/db.yaml 同值)。
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9160"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          # 两个副本尽量不落同一节点,否则单节点故障等于这个 zone 的存档落库全停
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: db
                topologyKey: kubernetes.io/hostname
      # 独立registrar只在init读取槽位名册与控制凭据,按 Pod 序号选槽位、现场生成这一代的身份;normal只见本Pod选中配置。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: sql-writer-registrar
          image: PLACEHOLDER_SQL_WRITER_REGISTRAR_IMAGE
          command: ["/bin/sh", "-ec"]
          args: ["umask 077; mkdir -p /run/sql-writer/grant/private /run/sql-writer/runtime/private/env; exec /app/service \"$@\"","--","-command","register","-roster","/run/sql-writer/input/request/roster.json","-roster-sha256","PLACEHOLDER_SQL_WRITER_ROSTER_SHA256","-input-root","/run/sql-writer/input","-lock-qualification","/run/sql-writer/input/request/lock-qualification.original","-runtime-config-output","/run/sql-writer/runtime/private/db.yaml","-runtime-env-output","/run/sql-writer/runtime/private/env","-boot-output","/run/sql-writer/grant/private/boot-grant.json","-deployment-id","$(MMORPG_SQL_DEPLOYMENT_ID)","-pod-name","$(POD_NAME)"]
          env:
            - name: MMORPG_SQL_DEPLOYMENT_ID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: MMORPG_SQL_OPERATOR_PRINCIPAL
              valueFrom:
                secretKeyRef: {name: PLACEHOLDER_SQL_WRITER_REGISTRAR_SECRET, key: principal, optional: false}
            - name: MMORPG_SQL_REGISTRAR_DSN
              valueFrom:
                secretKeyRef: {name: PLACEHOLDER_SQL_WRITER_REGISTRAR_SECRET, key: dsn, optional: false}
            - name: MMORPG_SQL_PHYSICAL_AUTHORITY_SHA256
              value: "PLACEHOLDER_SQL_WRITER_PHYSICAL_SHA256"
          volumeMounts:
            - {name: sql-writer-request, mountPath: /run/sql-writer/input/request, readOnly: true}
            - {name: sql-writer-runtime-input, mountPath: /run/sql-writer/input/runtime, readOnly: true}
            - {name: sql-writer-grant, mountPath: /run/sql-writer/grant}
            - {name: svc-config, mountPath: /run/sql-writer/runtime}
      containers:
        - name: db
          image: PLACEHOLDER_IMAGE
          imagePullPolicy: PLACEHOLDER_PULL_POLICY
          env:
            # 玩家存盘接口的调用密钥,与 scene 同值。缺了 go/db 拒绝启动,所以不写 optional: true:Secret 缺键时 Pod 卡在 CreateContainerConfigError,一眼可见。
            - name: MMORPG_PLAYER_STORE_SECRET_SCENE
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: player-store-scene, optional: false}
            # 认领前调 data_service 的 GetPlayerRoute 选库,验调用方用这一把。缺了拒绝启动。
            - name: MMORPG_ROLE_FENCE_SECRET_DB
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: role-fence-db, optional: false}
          # grant只读，consume留在同PodemptyDir；同Podrestart不得重复消费boot。
            - name: MMORPG_SQL_WRITER_GRANT_FILE
              value: /run/sql-writer/grant/private/boot-grant.json
            - name: MMORPG_SQL_WRITER_CONSUME_DIR
              value: /run/sql-writer/consume/private
            - name: MMORPG_SQL_DEPLOYMENT_ID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: MMORPG_SQL_PHYSICAL_AUTHORITY_SHA256
              value: "PLACEHOLDER_SQL_WRITER_PHYSICAL_SHA256"
            - name: GOLANG_PROTOBUF_REGISTRATION_CONFLICT
              value: warn
            # C++ 约定注册写进 NodeInfo 的对外 IP(go/db/player_store_wiring.go advertisedHost):ListenOn 是 0.0.0.0,其它 Pod 连不上它,必须写 Pod 自己的 IP。与 data-service.yaml 同一写法。
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command: ["/bin/sh", "-ec"]
          args: ["(umask 077; mkdir -p /run/sql-writer/consume/private); if ls /run/sql-writer/consume/private/*.consumed >/dev/null 2>&1; then echo sql writer grant already consumed, the reaper replaces this pod >&2; exit 78; fi; MMORPG_SQL_WRITER_GRANT_SHA256=\"$(cat /run/sql-writer/grant/private/boot-grant.json.sha256)\"; export MMORPG_SQL_WRITER_GRANT_SHA256; exec /app/service \"$@\"","--","-f","/app/etc/private/db.yaml"]
          ports:
            - containerPort: 6000
              name: grpc
            # 与 ConfigMap 的 MetricsListenAddr ":9160" 及上面 prometheus.io/port 注解一致(9160 = db)。
            - containerPort: 9160
              name: metrics
          readinessProbe:
            grpc:
              port: 6000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 6000
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - {name: sql-writer-grant, mountPath: /run/sql-writer/grant, readOnly: true}
            - {name: sql-writer-consume, mountPath: /run/sql-writer/consume}
            - name: svc-config
              mountPath: /app/etc
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      # 停机预算:preStop 5s + 停止接新请求后等在途存盘返回(受 MethodTimeouts 12s 约束,常态毫秒级)。
      # 超出 45s 的部分由 SIGKILL 截断,也不丢:scene 拿到的是结果未知,按 player_store 的版本判定重试。
      terminationGracePeriodSeconds: 45
      volumes:
        - name: sql-writer-request
          secret: {secretName: PLACEHOLDER_SQL_WRITER_REQUEST_SECRET, defaultMode: 288}
        - name: sql-writer-runtime-input
          secret: {secretName: PLACEHOLDER_SQL_WRITER_RUNTIME_SECRET, defaultMode: 288}
        - name: sql-writer-grant
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: sql-writer-consume
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: svc-config
          emptyDir: {medium: Memory, sizeLimit: 20Mi}
---
# PDB 直接放在本文件里:k8s_deploy.ps1 只 apply 各服务目录里登记的主 manifest,独立的 *-pdb.yaml 不会被应用。
# minAvailable: 1 —— 节点排空 / 集群升级一次只能带走一个副本,这个 zone 的存档落库不会被自愿驱逐打成零。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: db-pdb
  labels:
    app: db
    tier: go-svc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: db
