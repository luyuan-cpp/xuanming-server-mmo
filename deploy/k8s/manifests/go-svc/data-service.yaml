apiVersion: v1
kind: Service
metadata:
  name: data-service
  labels:
    app: data-service
    tier: go-svc
spec:
  selector:
    app: data-service
  ports:
    - name: grpc
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: data-service
  labels:
    app: data-service
    tier: go-svc
spec:
  # 2 副本(2026-10-08,docs/design/no-single-node-horizontal-scaling-20261001.md §4)。
  # 以前钉成 1 + Recreate 的理由是「快照去重靠间隙锁,两个实例会互相等锁」—— 那已经过时:
  #   - 去重现在是唯一键 uk_snapshot_guid_nz + ON DUPLICATE KEY,不同 guid 互不相干;
  #   - 两条落库消费者是 consumer group,每个分区同一时刻只属于一个实例,重叠只发生在 rebalance 的瞬间
  #     (先落库后提交 offset + 幂等落库,不丢不重);
  #   - 发号靠两份预留记录上的 CAS、每个实例各发各的块,名字登记靠唯一键,本来就不依赖单实例;
  #   - 多个 zone 的 data-service 早就在共用同一个全局库、同一组 topic 与消费组 —— 它一直是多实例的。
  # 多副本的两个前提在服务侧:启动期迁移由库级命名锁串行(store.acquireMigrateLock);store 装配不起来就拒启
  # (ConfigMap 的 Store.Required: true),不让一个每次调用都报错的实例进发现池、按比例吃掉请求。
  # 消费并行度的上限是分区数(transaction_log 6 / player_snapshot 3),副本超过它只是多一份 RPC 容量。
  # MySQL 连接预算:目录三个池每片一个,存档库每库一个,流水库一个;K=1 时每实例约 90 条,K=64 时每片收窄后约 426 条。
  # 按 zone 数 × 副本数计入总账,公式与规划见 tools/scripts/k8s_deploy.ps1 Get-MysqlConnectionLedger。
  replicas: 2
  # SQL 写者是 StatefulSet:Pod 序号就是写者名册的槽位,每次启动在同一槽位上换代,名册不随启动次数消耗
  # (docs/design/writer-roster-exhaustion-20261106.md §5.5)。滚动一次换一个副本,不能 maxSurge。
  serviceName: data-service
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  # 一次只换一个副本:换的那一刻另一个副本还在发号。scene 启动要领的首个 GUID 号段、login 建角要领的 PlayerId 号段
  # 都从这里来,发布期间不能出现"一个都没有"的窗口,所以副本数不能降到 1。
  selector:
    matchLabels:
      app: data-service
  template:
    metadata:
      labels:
        app: data-service
        tier: go-svc
        mmorpg.io/sql-writer: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9260"
        prometheus.io/path: "/metrics"
    spec:
      # 发号器在运行期经 K8s API 读本集群的身份(kube-system 命名空间的 UID),地域码绑定在它上面(设计 §6.3)。
      # 权限在 data-service-identity-rbac.yaml,k8s_deploy.ps1 先于本 StatefulSet apply。令牌就是读身份的凭据,
      # 所以不能关 automountServiceAccountToken。
      serviceAccountName: data-service
      affinity:
        podAntiAffinity:
          # 两个副本尽量不落同一节点,否则单节点故障等于这个 zone 的发号 / 审计落库全停
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: data-service
                topologyKey: kubernetes.io/hostname
      # 独立registrar只在init读取槽位名册与控制凭据,按 Pod 序号选槽位、现场生成这一代的身份;normal只见本Pod选中配置。
      # 控制目录都在 emptyDir 挂载根下的 private 子目录:Memory 介质的挂载根是 drwxrwsrwt、属主 root,过不了私有目录校验(go/shared/authoritysql/config_marker_other.go,
      # Java 的 WriterAuthority 还要求属主是自己),uid 10001 也改不了它的权限。sticky 的父目录校验放行,子目录用 umask 077 建。不需要 root 容器。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: sql-writer-registrar
          image: PLACEHOLDER_SQL_WRITER_REGISTRAR_IMAGE
          command: ["/bin/sh", "-ec"]
          args: ["umask 077; mkdir -p /run/sql-writer/grant/private /run/sql-writer/runtime/private/env; exec /app/service \"$@\"","--","-command","register","-roster","/run/sql-writer/input/request/roster.json","-roster-sha256","PLACEHOLDER_SQL_WRITER_ROSTER_SHA256","-input-root","/run/sql-writer/input","-lock-qualification","/run/sql-writer/input/request/lock-qualification.original","-runtime-config-output","/run/sql-writer/runtime/private/data_service.yaml","-runtime-env-output","/run/sql-writer/runtime/private/env","-boot-output","/run/sql-writer/grant/private/boot-grant.json","-deployment-id","$(MMORPG_SQL_DEPLOYMENT_ID)","-pod-name","$(POD_NAME)"]
          env:
            - name: MMORPG_SQL_DEPLOYMENT_ID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: MMORPG_SQL_OPERATOR_PRINCIPAL
              valueFrom:
                secretKeyRef: {name: PLACEHOLDER_SQL_WRITER_REGISTRAR_SECRET, key: principal, optional: false}
            - name: MMORPG_SQL_REGISTRAR_DSN
              valueFrom:
                secretKeyRef: {name: PLACEHOLDER_SQL_WRITER_REGISTRAR_SECRET, key: dsn, optional: false}
            - name: MMORPG_SQL_PHYSICAL_AUTHORITY_SHA256
              value: "PLACEHOLDER_SQL_WRITER_PHYSICAL_SHA256"
          volumeMounts:
            - {name: sql-writer-request, mountPath: /run/sql-writer/input/request, readOnly: true}
            - {name: sql-writer-runtime-input, mountPath: /run/sql-writer/input/runtime, readOnly: true}
            - {name: sql-writer-grant, mountPath: /run/sql-writer/grant}
            - {name: svc-config, mountPath: /run/sql-writer/runtime}
      containers:
        - name: data-service
          image: PLACEHOLDER_IMAGE
          imagePullPolicy: PLACEHOLDER_PULL_POLICY
          env:
          # grant只读，consume留在同PodemptyDir；同Podrestart不得重复消费boot。
            - name: MMORPG_SQL_WRITER_GRANT_FILE
              value: /run/sql-writer/grant/private/boot-grant.json
            - name: MMORPG_SQL_WRITER_CONSUME_DIR
              value: /run/sql-writer/consume/private
            - name: MMORPG_SQL_DEPLOYMENT_ID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: MMORPG_SQL_PHYSICAL_AUTHORITY_SHA256
              value: "PLACEHOLDER_SQL_WRITER_PHYSICAL_SHA256"
            - name: MMORPG_ACCOUNT_DIRECTORY_SECRET_SCENE_MANAGER
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: account-directory-scene-manager, optional: false}
            - name: MMORPG_ACCOUNT_DIRECTORY_SECRET_LOGIN
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: account-directory-login, optional: false}
            - name: MMORPG_ACCOUNT_DIRECTORY_SECRET_TRADE
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: account-directory-trade, optional: false}
            - name: MMORPG_ACCOUNT_DIRECTORY_SECRET_SCENE
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: account-directory-scene, optional: false}
            # GM 批量回收的资产指令签名,和 scene 同值。-AssetOps on 时 Recall.Enabled=true,这时缺它拒启。没开时用不到,所以 optional。
            - name: MMORPG_ASSET_OP_SECRET_DATA_SERVICE
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: asset-data-service, optional: true}
            # 角色护栏(docs/design/horizontal-scale-logical-db.md §3.3):协调者调参与者用 COORDINATOR,
            # 其余各把验调用方读权威状态。缺一把拒绝启动,所以不写 optional: true。
            - name: MMORPG_ROLE_FENCE_SECRET_COORDINATOR
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: role-fence-coordinator, optional: false}
            - name: MMORPG_ROLE_FENCE_SECRET_GUILD
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: role-fence-guild, optional: false}
            - name: MMORPG_ROLE_FENCE_SECRET_TRADE
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: role-fence-trade, optional: false}
            - name: MMORPG_ROLE_FENCE_SECRET_MAIL
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: role-fence-mail, optional: false}
            - name: MMORPG_ROLE_FENCE_SECRET_MATCH
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: role-fence-match, optional: false}
            - name: MMORPG_ROLE_FENCE_SECRET_PLAYER_INBOX
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: role-fence-player-inbox, optional: false}
            - name: MMORPG_ROLE_FENCE_SECRET_FRIEND
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: role-fence-friend, optional: false}
            - name: MMORPG_ROLE_FENCE_SECRET_CHAT
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: role-fence-chat, optional: false}
            - name: MMORPG_ROLE_FENCE_SECRET_DB
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: role-fence-db, optional: false}
            - name: GOLANG_PROTOBUF_REGISTRATION_CONFLICT
              value: warn
            # C++ 约定注册(DataServiceNodeService.rpc)写进 NodeInfo 的对外 IP(data_service.go advertisedHost):
            # ListenOn 是 0.0.0.0,其它 Pod 连不上它,必须写 Pod 自己的 IP;与 login.yaml 同一写法。
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command: ["/bin/sh", "-ec"]
          args: ["(umask 077; mkdir -p /run/sql-writer/consume/private); if ls /run/sql-writer/consume/private/*.consumed >/dev/null 2>&1; then echo sql writer grant already consumed, the reaper replaces this pod >&2; exit 78; fi; MMORPG_SQL_WRITER_GRANT_SHA256=\"$(cat /run/sql-writer/grant/private/boot-grant.json.sha256)\"; export MMORPG_SQL_WRITER_GRANT_SHA256; exec /app/service \"$@\"","--","-f","/app/etc/private/data_service.yaml"]
          ports:
            - containerPort: 9000
              name: grpc
            # 与 ConfigMap 的 MetricsListenAddr ":9260" 及上面 prometheus.io/port 注解一致(9260 = data-service)。
            # 多副本之后要能按 Pod 看 kafka_consumer_up:哪个实例的消费者停了,只看总量是看不出来的。
            - containerPort: 9260
              name: metrics
          readinessProbe:
            grpc:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - {name: sql-writer-grant, mountPath: /run/sql-writer/grant, readOnly: true}
            - {name: sql-writer-consume, mountPath: /run/sql-writer/consume}
            - name: svc-config
              mountPath: /app/etc
              readOnly: true
            # 全局号源登记处的双向 TLS 客户端证书(staging、prod),IdSegment.Issuer.RegistryTLS 指向这里的 ca.crt、tls.crt、tls.key。
            - {name: id-registry-client-tls, mountPath: /etc/mmorpg/id-registry-tls, readOnly: true}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      terminationGracePeriodSeconds: 30
      volumes:
        - name: sql-writer-request
          secret: {secretName: PLACEHOLDER_SQL_WRITER_REQUEST_SECRET, defaultMode: 288}
        - name: sql-writer-runtime-input
          secret: {secretName: PLACEHOLDER_SQL_WRITER_RUNTIME_SECRET, defaultMode: 288}
        - name: sql-writer-grant
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: sql-writer-consume
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: svc-config
          emptyDir: {medium: Memory, sizeLimit: 20Mi}
        # 运维在每个 zone 命名空间预置(键 ca.crt、tls.crt、tls.key)。写 optional:dev 没有登记处 TLS,不建这个 Secret;
        # staging、prod 由 k8s_deploy.ps1 在任何写操作之前核对它在、三个键齐,data_service 在生产配置下缺证书文件也拒绝装配发号器。
        - name: id-registry-client-tls
          secret: {secretName: id-registry-client-tls, defaultMode: 288, optional: true}
---
# PDB 直接放在本文件里:k8s_deploy.ps1 只 apply 各服务目录里登记的主 manifest,独立的 *-pdb.yaml 不会被应用。
# minAvailable: 1 —— 节点排空 / 集群升级一次只能带走一个副本,发号不会被自愿驱逐打成零。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: data-service-pdb
  labels:
    app: data-service
    tier: go-svc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: data-service
