apiVersion: v1
kind: Service
metadata:
  name: data-service
  labels:
    app: data-service
    tier: go-svc
spec:
  selector:
    app: data-service
  ports:
    - name: grpc
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  labels:
    app: data-service
    tier: go-svc
spec:
  # 2 副本(2026-10-08,docs/design/no-single-node-horizontal-scaling-20261001.md §4)。
  # 以前钉成 1 + Recreate 的理由是「快照去重靠间隙锁,两个实例会互相等锁」—— 那已经过时:
  #   - 去重现在是唯一键 uk_snapshot_guid_nz + ON DUPLICATE KEY,不同 guid 互不相干;
  #   - 两条落库消费者是 consumer group,每个分区同一时刻只属于一个实例,重叠只发生在 rebalance 的瞬间
  #     (先落库后提交 offset + 幂等落库,不丢不重);
  #   - 发号段靠 id_segment 行锁 + version、名字登记靠唯一键,本来就不依赖单实例;
  #   - 多个 zone 的 data-service 早就在共用同一个全局库、同一组 topic 与消费组 —— 它一直是多实例的。
  # 多副本的两个前提在服务侧:启动期迁移由库级命名锁串行(store.acquireMigrateLock);store 装配不起来就拒启
  # (ConfigMap 的 Store.Required: true),不让一个每次调用都报错的实例进发现池、按比例吃掉请求。
  # 消费并行度的上限是分区数(transaction_log 6 / player_snapshot 3),副本超过它只是多一份 RPC 容量。
  # MySQL 连接预算:每个实例最多 35 条(三个 store 各 5 + 名字注册表 20),按 zone 数 × 副本数算进 max_connections。
  replicas: 2
  # 先起新的、Ready 之后再停旧的:任何时刻至少有 2 个实例在发号。scene 启动要领的首个 GUID 号段、
  # login 建角要领的 PlayerId 号段都从这里来,发布期间不能出现"一个都没有"的窗口。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: data-service
  template:
    metadata:
      labels:
        app: data-service
        tier: go-svc
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9260"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          # 两个副本尽量不落同一节点,否则单节点故障等于这个 zone 的发号 / 审计落库全停
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: data-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: data-service
          image: PLACEHOLDER_IMAGE
          imagePullPolicy: PLACEHOLDER_PULL_POLICY
          env:
            - name: GOLANG_PROTOBUF_REGISTRATION_CONFLICT
              value: warn
            # C++ 约定注册(DataServiceNodeService.rpc)写进 NodeInfo 的对外 IP(data_service.go advertisedHost):
            # ListenOn 是 0.0.0.0,其它 Pod 连不上它,必须写 Pod 自己的 IP;与 login.yaml 同一写法。
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          args: ["-f", "/app/etc/data_service.yaml"]
          ports:
            - containerPort: 9000
              name: grpc
            # 与 ConfigMap 的 MetricsListenAddr ":9260" 及上面 prometheus.io/port 注解一致(9260 = data-service)。
            # 多副本之后要能按 Pod 看 kafka_consumer_up:哪个实例的消费者停了,只看总量是看不出来的。
            - containerPort: 9260
              name: metrics
          readinessProbe:
            grpc:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: svc-config
              mountPath: /app/etc
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      terminationGracePeriodSeconds: 30
      volumes:
        - name: svc-config
          configMap:
            name: go-svc-data-service-config
---
# PDB 直接放在本文件里:k8s_deploy.ps1 只 apply 各服务目录里登记的主 manifest,独立的 *-pdb.yaml 不会被应用。
# minAvailable: 1 —— 节点排空 / 集群升级一次只能带走一个副本,发号不会被自愿驱逐打成零。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: data-service-pdb
  labels:
    app: data-service
    tier: go-svc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: data-service
