# match:回合制战斗匹配 / 切磋 / 观战编排(docs/design/cross-zone-matchmaking.md)。
#
# **全局池,只部署到 mmorpg-infra namespace 一次,不进任何 zone namespace。**
# 排队、占用、开局意图、组队与评级的权威都在同一SQL事务域，所有档位同一份代码；Redis只留观战协调。
# 部署脚本注入SQL/探测/排行榜Secret引用，所有档位都须传SQL入口，staging/prod还须传真实PhysicalRegion。gate发现match走的是
# 非 zone-scoped 的 MatchNodeService 前缀(cpp node_util.cpp IsZoneScopedNodeType
# 不含它),所以全 zone 的 gate 都会连到这里的实例并随机路由。
# k8s_deploy.ps1 的 $GoSvcCatalogue 里该条目标了 Global = $true,zone-up 会跳过它,
# infra-up / all-up 部署:ConfigMap 与迁移 Job 在基础设施阶段,进程排在第一个 zone 的 data-service 之后(见 k8s_deploy.ps1 的 Apply-GlobalGoSvcManifests)。ConfigMap go-svc-match-config 由脚本生成。
apiVersion: v1
kind: Service
metadata:
  name: match
  labels:
    app: match
    tier: go-svc
spec:
  type: ClusterIP
  selector:
    app: match
  ports:
    - name: grpc
      port: 50500
      targetPort: 50500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: match
  labels:
    app: match
    tier: go-svc
spec:
  # 多实例由TiDB行锁/租约及原请求回执恢复；Redis不是排队与开局的唯一权威。
  replicas: 2
  selector:
    matchLabels:
      app: match
  template:
    metadata:
      labels:
        app: match
        tier: go-svc
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9170"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          # 两个副本尽量不落同一节点,否则单节点故障等于全池不可用
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: match
                topologyKey: kubernetes.io/hostname
      # 独立registrar只在init读取有限预批准roster与控制凭据；normal只见本Pod选中配置。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: sql-writer-registrar
          image: PLACEHOLDER_SQL_WRITER_REGISTRAR_IMAGE
          command: ["/bin/sh", "-ec"]
          args: ["umask 077; mkdir -p /run/sql-writer/runtime/env; exec /app/service \"$@\"","--","-command","register","-roster","/run/sql-writer/input/request/roster.json","-roster-sha256","PLACEHOLDER_SQL_WRITER_ROSTER_SHA256","-input-root","/run/sql-writer/input","-lock-qualification","/run/sql-writer/input/request/lock-qualification.original","-runtime-config-output","/run/sql-writer/runtime/match_service.yaml","-runtime-env-output","/run/sql-writer/runtime/env","-boot-output","/run/sql-writer/grant/boot-grant.json","-deployment-id","$(MMORPG_SQL_DEPLOYMENT_ID)"]
          env:
            - name: MMORPG_SQL_DEPLOYMENT_ID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: MMORPG_SQL_OPERATOR_PRINCIPAL
              valueFrom:
                secretKeyRef: {name: PLACEHOLDER_SQL_WRITER_REGISTRAR_SECRET, key: principal, optional: false}
            - name: MMORPG_SQL_REGISTRAR_DSN
              valueFrom:
                secretKeyRef: {name: PLACEHOLDER_SQL_WRITER_REGISTRAR_SECRET, key: dsn, optional: false}
            - name: MMORPG_SQL_PHYSICAL_AUTHORITY_SHA256
              value: "PLACEHOLDER_SQL_WRITER_PHYSICAL_SHA256"
          volumeMounts:
            - {name: sql-writer-request, mountPath: /run/sql-writer/input/request, readOnly: true}
            - {name: sql-writer-runtime-input, mountPath: /run/sql-writer/input/runtime, readOnly: true}
            - {name: sql-writer-grant, mountPath: /run/sql-writer/grant}
            - {name: svc-config, mountPath: /run/sql-writer/runtime}
      containers:
        - name: match
          image: PLACEHOLDER_IMAGE
          imagePullPolicy: PLACEHOLDER_PULL_POLICY
          env:
          # grant只读，consume留在同PodemptyDir；同Podrestart不得重复消费boot。
            - name: MMORPG_SQL_WRITER_GRANT_FILE
              value: /run/sql-writer/grant/boot-grant.json
            - name: MMORPG_SQL_WRITER_CONSUME_DIR
              value: /run/sql-writer/consume
            - name: MMORPG_SQL_DEPLOYMENT_ID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: MMORPG_SQL_PHYSICAL_AUTHORITY_SHA256
              value: "PLACEHOLDER_SQL_WRITER_PHYSICAL_SHA256"
            - name: MMORPG_ACCOUNT_DIRECTORY_SECRET_SCENE
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: account-directory-scene, optional: false}
            - name: GOLANG_PROTOBUF_REGISTRATION_CONFLICT
              value: warn
            - name: MMORPG_MATCH_INTERNAL_SECRET_GUILD
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: match-internal-guild, optional: false}
            - name: MMORPG_LOGIN_REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: redis-auth, key: password, optional: true}
            # 按 C++ 约定注册(MatchNodeService.rpc 与同进程组队的 TeamNodeService.rpc)时写进 NodeInfo 的
            # 对外 IP(match_service.go advertisedHost 优先读它,docs/design/team-system.md §A.3):ListenOn 是
            # 0.0.0.0,不能原样注册;不注入时退回第一块非 loopback 网卡,多网卡 / sidecar / 部分 CNI 下可能选错,
            # gate / 路由服拨不通。与 chat.yaml / data-service.yaml / login.yaml 同一写法。
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command: ["/bin/sh", "-ec"]
          args: ["MMORPG_SQL_WRITER_GRANT_SHA256=\"$(cat /run/sql-writer/grant/boot-grant.json.sha256)\"; export MMORPG_SQL_WRITER_GRANT_SHA256; MATCH_MYSQL_PASSWORD=\"$(cat /app/etc/env/MATCH_MYSQL_PASSWORD)\"; export MATCH_MYSQL_PASSWORD; exec /app/service \"$@\"","--","-f","/app/etc/match_service.yaml"]
          ports:
            - containerPort: 50500
              name: grpc
            - containerPort: 9170
              name: metrics
          readinessProbe:
            grpc:
              port: 50500
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50500
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - {name: sql-writer-grant, mountPath: /run/sql-writer/grant, readOnly: true}
            - {name: sql-writer-consume, mountPath: /run/sql-writer/consume}
            - name: svc-config
              mountPath: /app/etc
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      terminationGracePeriodSeconds: 30
      volumes:
        - name: sql-writer-request
          secret: {secretName: PLACEHOLDER_SQL_WRITER_REQUEST_SECRET, defaultMode: 288}
        - name: sql-writer-runtime-input
          secret: {secretName: PLACEHOLDER_SQL_WRITER_RUNTIME_SECRET, defaultMode: 288}
        - name: sql-writer-grant
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: sql-writer-consume
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: svc-config
          emptyDir: {medium: Memory, sizeLimit: 20Mi}
---
# PDB 与主 manifest 同文件:k8s_deploy.ps1 只 apply 目录条目里的主 manifest。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: match-pdb
  labels:
    app: match
    tier: go-svc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: match
