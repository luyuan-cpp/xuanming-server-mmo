apiVersion: v1
kind: Service
metadata:
  name: scene-manager
  labels:
    app: scene-manager
    tier: go-svc
spec:
  selector:
    app: scene-manager
  ports:
    - name: grpc
      port: 60000
      targetPort: 60000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scene-manager
  labels:
    app: scene-manager
    tier: go-svc
spec:
  replicas: 1
  # scene-manager 跑着 world_autoscale / agones_reconcile 两个无选主的单写者循环,
  # 默认 RollingUpdate 在 1 副本上仍会 maxSurge 出第二个 pod,滚动期间两份 autoscaler
  # 会对同一批 zone 并发做伸缩决策。Recreate 先关旧 pod 再起新 pod,消除重叠窗口。
  # 正解是把 loginqueue/dispatcher.go 的选主抽到 go/shared/leader 后复用;在那之前用它兜底。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: scene-manager
  template:
    metadata:
      labels:
        app: scene-manager
        tier: go-svc
    spec:
      containers:
        - name: scene-manager
          image: PLACEHOLDER_IMAGE
          imagePullPolicy: IfNotPresent
          env:
            - name: GOLANG_PROTOBUF_REGISTRATION_CONFLICT
              value: warn
          args: ["-f", "/app/etc/scene_manager_service.yaml"]
          ports:
            - containerPort: 60000
              name: grpc
          readinessProbe:
            grpc:
              port: 60000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 60000
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: svc-config
              mountPath: /app/etc
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      terminationGracePeriodSeconds: 30
      volumes:
        - name: svc-config
          configMap:
            name: go-svc-scene-manager-config
