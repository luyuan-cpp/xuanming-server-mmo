apiVersion: v1
kind: Service
metadata:
  name: scene-manager
  labels:
    app: scene-manager
    tier: go-svc
spec:
  selector:
    app: scene-manager
  ports:
    - name: grpc
      port: 60000
      targetPort: 60000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scene-manager
  labels:
    app: scene-manager
    tier: go-svc
spec:
  replicas: 2
  # 多副本安全的前提(2026-08-15 起):world_autoscale / agones_reconcile /
  # instance_lifecycle / load_reporter 的变更动作已由 shared/leader 的 Redis
  # 选主锁收敛到单一领导者(scene_manager:leader:lock,TTL 30s,心跳 TTL/3),
  # 跟随者只跑 RPC 数据面与 etcd watch 内存镜像。滚动更新新旧 pod 并存时也
  # 只有一个领导者,故不再需要 Recreate;领导者 pod 挂掉后,幸存副本最迟
  # ~TTL 内接管并用一次 fullSync 补齐缺位窗口内漏掉的变更。
  # 观测:scene_manager_is_leader gauge,全体副本之和应恒为 1。
  selector:
    matchLabels:
      app: scene-manager
  template:
    metadata:
      labels:
        app: scene-manager
        tier: go-svc
    spec:
      containers:
        - name: scene-manager
          image: PLACEHOLDER_IMAGE
          imagePullPolicy: PLACEHOLDER_PULL_POLICY
          env:
            - name: GOLANG_PROTOBUF_REGISTRATION_CONFLICT
              value: warn
          args: ["-f", "/app/etc/scene_manager_service.yaml"]
          ports:
            - containerPort: 60000
              name: grpc
          readinessProbe:
            grpc:
              port: 60000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 60000
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: svc-config
              mountPath: /app/etc
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      terminationGracePeriodSeconds: 30
      volumes:
        - name: svc-config
          configMap:
            name: go-svc-scene-manager-config
---
# PDB 直接放在本文件里:k8s_deploy.ps1 只 apply 各服务目录里的主 manifest,
# 独立的 *-pdb.yaml(如 login-pdb.yaml)不会被脚本应用 —— 别拆出去。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scene-manager-pdb
  labels:
    app: scene-manager
    tier: go-svc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: scene-manager
