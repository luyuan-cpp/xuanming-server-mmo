# sql-writer-slot-retirer:缩容之后,结束被缩掉槽位的在役一代。每个 SQL 写者 StatefulSet(含 <svc>-canary)一份,名字是
# sql-writer-slot-retirer-<StatefulSet>,由 k8s_deploy.ps1 New-SqlWriterSlotRetirerManifest 渲染、紧跟写者落地。
#
# 为什么要它(docs/design/writer-roster-exhaustion-20261106.md §5.8):写者按槽位换代,上一代由同序号的下一代在注册事务里结束。
# 缩容之后被缩掉的序号没有下一代,它们的最后一代在每个逻辑库都还 ACTIVE:下一次排空收不了尾(没有进程替它关闭);
# 被缩掉的 Pod 若其实还活着(节点失联),它还能写。以前要运维在下一次排空之前逐个按非 run 的 RETIRE 退休。
#
# 判据与顺序(writer_authority -command retire-removed-slots,go/data_service/cmd/writer_authority/retire_removed_slots.go):
#   1. 读这个 StatefulSet 的 spec.replicas,只扫序号 >= 它的槽位。StatefulSet 不存在算 0 个副本(金丝雀收尾会删整个 StatefulSet,
#      这份 CronJob 留着,把金丝雀各槽位的末代结束掉);
#   2. 读这些槽位在名册里每个逻辑库的最新一代,ACTIVE 的记作候选;
#   3. 目录读完之后再读一次副本数,逐个查候选序号的 Pod:序号 >= 副本数、这个名字的 Pod 对象已经没了(优雅退出走完)才结束。
#      先读目录、后看集群:读目录期间新建的 Pod 注册的一代不在快照里,不会被结束;不靠时钟,也不在本地记状态;
#   4. 结束:非 run 的 RETIRE,登记行置 REVOKED、64 个 slot 行删掉、收据永久保留。闸门冻结、排空 run 开着时这一轮跳过,
#      下一轮再来(排空期间的退休归排空记账)。
#
# 凭据:和这个写者 init 里的 sql-writer-registrar 同一个镜像、同一个名册 Secret、同一个注册账号 Secret、同一份库映射,不多给任何凭据。
# 注册账号本来就能注册新一代、在换代里结束上一代;这里是没有下一代的那种结束(deploy/sql/authority_operator_role.sql)。
# 集群权限只有本 namespace 里这一个 StatefulSet 与 pods 的 get。
#
# 失败:任何一步失败 Job 就失败、不重试(backoffLimit: 0),下一轮按目录与集群的现状重新判,不会多结束或漏结束。
# 一直不成功由告警 SqlWriterSlotRetirerFailing 发现(deploy/k8s/logical-db-alerts.yaml)。
# 只读日志:kubectl -n <ns> logs job/<job> -c retire-removed-slots。每个候选一行(slot、logical_db、boot_seq、result),最后一行是汇总。
#
# 占位由 New-SqlWriterSlotRetirerManifest 替换,库映射 MMORPG_DB_PLACEMENT 由 Add-SqlWriterPlacementEnv 插在注册账号 DSN 前面。
# RoleBinding 的 subjects 必须写 namespace,kubectl apply -n 不会替它补。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: PLACEHOLDER_SLOT_RETIRER_OBJECT
  labels:
    app: sql-writer-slot-retirer
    tier: go-svc
    mmorpg.io/slot-retirer-for: PLACEHOLDER_SQL_WRITER_STATEFULSET
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: PLACEHOLDER_SLOT_RETIRER_OBJECT
  labels:
    app: sql-writer-slot-retirer
    tier: go-svc
    mmorpg.io/slot-retirer-for: PLACEHOLDER_SQL_WRITER_STATEFULSET
rules:
  # 读这一个写者的期望副本数。
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["PLACEHOLDER_SQL_WRITER_STATEFULSET"]
    verbs: ["get"]
  # 查候选序号的 Pod 在不在。Pod 名随序号变,不按名字限定;只有 get,不能列、不能改。
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: PLACEHOLDER_SLOT_RETIRER_OBJECT
  labels:
    app: sql-writer-slot-retirer
    tier: go-svc
    mmorpg.io/slot-retirer-for: PLACEHOLDER_SQL_WRITER_STATEFULSET
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: PLACEHOLDER_SLOT_RETIRER_OBJECT
subjects:
  - kind: ServiceAccount
    name: PLACEHOLDER_SLOT_RETIRER_OBJECT
    namespace: PLACEHOLDER_SLOT_RETIRER_NAMESPACE
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: PLACEHOLDER_SLOT_RETIRER_OBJECT
  labels:
    app: sql-writer-slot-retirer
    tier: go-svc
    mmorpg.io/slot-retirer-for: PLACEHOLDER_SQL_WRITER_STATEFULSET
spec:
  # 缩容之后最多 5 分钟结束。没有被缩掉的在役槽位时,一轮只读一次副本数、扫一遍名册里副本数以外的槽位。
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  # 控制器停过一阵之后错过的调度不补,下一轮照常判断。不写的话错过超过 100 次这个 CronJob 就不再调度。
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # 小于调度周期,上一个 Job 卡住时不挡下一轮;命令自己最多 60 秒(-timeout)。
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app: sql-writer-slot-retirer
            tier: go-svc
            mmorpg.io/slot-retirer-for: PLACEHOLDER_SQL_WRITER_STATEFULSET
        spec:
          serviceAccountName: PLACEHOLDER_SLOT_RETIRER_OBJECT
          restartPolicy: Never
          # 与写者的 registrar 同一个非 root 身份。这条命令只读名册、不写文件,根文件系统只读。
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retire-removed-slots
              image: PLACEHOLDER_SQL_WRITER_REGISTRAR_IMAGE
              imagePullPolicy: PLACEHOLDER_PULL_POLICY
              command: ["/app/service"]
              args: ["-command", "retire-removed-slots", "-roster", "/run/sql-writer/input/request/roster.json", "-roster-sha256", "PLACEHOLDER_SQL_WRITER_ROSTER_SHA256", "-input-root", "/run/sql-writer/input", "-statefulset", "PLACEHOLDER_SQL_WRITER_STATEFULSET", "-deployment-id", "$(MMORPG_SQL_DEPLOYMENT_ID)", "-timeout", "60s"]
              env:
                # 写进每份 RETIRE 的 deployment_id:sql-writer-slot-retirer/<StatefulSet>/<本 Job Pod 的 UID>。
                - name: MMORPG_SQL_DEPLOYMENT_ID
                  valueFrom: {fieldRef: {fieldPath: metadata.uid}}
                - name: POD_NAMESPACE
                  valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
                - name: MMORPG_SQL_BACKEND
                  value: "PLACEHOLDER_SQL_BACKEND"
                - name: MMORPG_SQL_OPERATOR_PRINCIPAL
                  valueFrom:
                    secretKeyRef: {name: PLACEHOLDER_SQL_WRITER_REGISTRAR_SECRET, key: principal, optional: false}
                - name: MMORPG_SQL_REGISTRAR_DSN
                  valueFrom:
                    secretKeyRef: {name: PLACEHOLDER_SQL_WRITER_REGISTRAR_SECRET, key: dsn, optional: false}
                - name: MMORPG_SQL_PHYSICAL_AUTHORITY_SHA256
                  value: "PLACEHOLDER_SQL_WRITER_PHYSICAL_SHA256"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - {name: sql-writer-request, mountPath: /run/sql-writer/input/request, readOnly: true}
          volumes:
            # 只挂名册所在的 Secret:运行配置、锁原语资格这些 registrar 要的别的输入,这条命令都不读。
            - name: sql-writer-request
              secret: {secretName: PLACEHOLDER_SQL_WRITER_REQUEST_SECRET, defaultMode: 288}
