# SceneManager 访问 Agones 所需的最小权限。
#
# 只在 scene_manager 接管 Agones 容量时需要:`-SceneOrchestrator agones -AgonesHighDensity`
# (k8s_deploy.ps1 Test-SceneManagerAgonesEnabled)。这时 k8s_deploy.ps1 在 scene-manager 的
# Deployment 之前把本文件 apply 进 zone 命名空间,并给 Pod 模板写上
# serviceAccountName: scene-manager;不接管时不挂这个身份,并删掉以前留下的这三个对象。
# 默认部署用不到。
#
# 刻意**不**给 cluster-admin,也刻意全部是 namespace 级(Role 而不是
# ClusterRole):Fleet 和 GameServer 都在 zone 命名空间里,SceneManager
# 没有任何理由能看到别的命名空间。
#
# 注意:ServiceAccount 名字必须与 k8s_deploy.ps1 注入的 serviceAccountName 一致;
# 不用命名空间的 default SA,免得把权限挂到整个命名空间上。
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scene-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scene-manager-agones
rules:
  # GameServerAllocation 是一次性资源:create 之后从返回对象的 status
  # 里读结果。只需要 create。
  - apiGroups: ["allocation.agones.dev"]
    resources: ["gameserverallocations"]
    verbs: ["create"]

  # rooms Counter 的回滚 / 共置预占走 GameServer 的 status 子资源,
  # 用 read-modify-write + resourceVersion 乐观并发。
  # reconcile 需要 list。
  - apiGroups: ["agones.dev"]
    resources: ["gameservers"]
    verbs: ["get", "list"]
  - apiGroups: ["agones.dev"]
    resources: ["gameservers/status"]
    verbs: ["get", "update", "patch"]

  # Pod IP 反查:Agones 老版本的 GameServer status 里没有 Pod 地址,
  # 需要按 GameServer 名字 GET 同名 Pod 读 status.podIP。
  # 只读,且只在这个命名空间内。
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scene-manager-agones
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scene-manager-agones
subjects:
  - kind: ServiceAccount
    name: scene-manager
