# Loki:集群内的日志库,给 C++ 节点的日志 sidecar 当写入目标(见 k8s_deploy.ps1 的 -LokiPushUrl)。
#
# 为什么集群里需要它:Linux 下 C++ 节点**不往 stdout 写日志**。
# cpp/libs/engine/core/node/system/node/node.cpp 的 Node::AsyncOutput 里,调用控制台输出那一句包在
# #ifdef WIN32 内;容器里 muduo 的业务日志只落 /app/bin/logs/cpp_nodes/<节点>.*.log。
# 所以按"读容器 stdout"的常规做法(DaemonSet 读 /var/log/pods)采不到 C++ 的业务日志,
# 必须由与业务容器共享同一个 node-logs 卷的 sidecar 直接读文件 —— 那个 sidecar 把日志写到这里。
#
# 规模定位:单副本 single-binary + 文件存储,够本地 kind 和小规模 dev/staging 用。
# 生产要换对象存储 + 多副本(读写分离),见 docs/ops/log-management.md「Production (K8s)」。
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    app: loki
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName 有意不写死 —— 交给集群默认 StorageClass(kind 上是 standard)。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache
      filesystem:
        directory: /loki/chunks

    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      retention_period: 168h
      allow_structured_metadata: true
      volume_enabled: true
      discover_log_levels: true
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      per_stream_rate_limit: 8MB
      per_stream_rate_limit_burst: 32MB
      max_query_series: 2000

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
      compaction_interval: 10m
      retention_delete_delay: 2h

    pattern_ingester:
      enabled: true

    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
      rule_path: /loki/rules-temp

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    app: loki
spec:
  replicas: 1
  # PVC 是 RWO,滚更时新旧 Pod 不能同时挂;必须 Recreate,否则新 Pod 卡在 ContainerCreating。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        # grafana/loki 镜像里的运行用户是 10001;PVC 要 fsGroup 才写得进去。
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.5.8
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - containerPort: 3100
              name: http
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data-pvc
