# Kafka(KRaft;1 个或 ≥3 个 broker,由 k8s_deploy.ps1 -KafkaBrokers 决定):StatefulSet + PVC,不再是 Deployment + emptyDir
# (docs/design/routing-identity-audit-20260908.md R06)。
#
# 为什么换:
#   - 旧写法是单副本 Deployment,数据目录是 emptyDir。broker 一重启(漂移 / OOM / 升级)
#     **全部 topic、分区元数据与已提交 offset 一起消失**。消费者会静默地把 topic 自动
#     重建成 1 分区(broker 开着 auto.create.topics.enable + num.partitions=1),
#     而停机窗口里产出的每一条控制面命令在 librdkafka 的 5 分钟消息超时后直接丢掉;
#     审计 topic 的预建 Job 还必须手工重跑一遍(deploy/k8s/AGENTS.md)。
#   - 更糟的是旧 manifest 把 emptyDir 挂在 `/tmp/kafka-logs`,而 apache/kafka 镜像
#     combined 模式的默认 `log.dirs` 是 `/tmp/kraft-combined-logs` —— 那块卷根本不是
#     数据目录,日志一直写在容器可写层上。所以本文件显式设 KAFKA_LOG_DIRS,不赌镜像默认值。
#   - 换 PVC 之后 broker 重启以同一身份、同一份日志回来:topic、分区数、offset 全部保留,
#     `infra-kafka-topics` 不再是重启后的必修课(仍然幂等、随时可重跑)。
#
# **首次从旧 Deployment 切过来会丢掉现有的全部 topic 数据**:PVC 是空的,broker 会重新
# format 存储目录。切完必须重跑一次
# `pwsh -File tools/scripts/k8s_deploy.ps1 -Command infra-kafka-topics -WaitReady`
# 把审计 topic 与控制面命令 topic 按分区契约重新建出来(README「Kafka:StatefulSet + PVC」)。
#
# broker 数(2026-10-01,docs/design/no-single-node-horizontal-scaling-20261001.md §2):
#   - 1 个:本机 kind / dev 档。行为与以前逐字一致(kafka-0、node.id=1、广播 Service 名、副本数 1)。
#   - ≥3 个:staging / prod 档默认 3。**前 3 个 Pod 兼任 controller**(KRaft 选举组,挂 1 个仍有多数派),
#     **第 4 个起只当 broker** —— 所以 3 → N 只改 replicas,不动选举组、不改 Pod 模板、不触发全体重启。
#     topic 副本数 3、min.insync.replicas 2:任何一个 broker 倒下,acks=all 的生产者仍然写得进去。
#   - 2 个不允许:两票的选举组挂一个就没有多数派,比单 broker 还脆。
# 多 broker 必须同时成立的四件事都由脚本按 broker 数一起渲染,不能只改其中一处:
#   1) 每个 broker 广播**自己**的 Pod DNS(否则客户端拿到的 leader 地址会随机落到别的 broker 上);
#   2) controller 选举组的成员表;
#   3) topic 副本数(kafka-topic-init.yaml 的预建 Job,以及注入给 Go 服务的 KAFKA_TOPIC_REPLICATION_FACTOR);
#   4) min.insync.replicas。
# **1 ↔ ≥3 不能原地切换**:单 broker 的选举组只有 kafka-0 一票,直接把成员表改成三票并扩容,
# 两个空白的新节点可以先凑成多数派、用一份**空的**元数据日志当选,kafka-0 回来时被截断 —— 全部 topic 元数据消失。
# 脚本发现线上 StatefulSet 的副本数与目标跨了这条线就拒绝 apply,切换流程见 README「Kafka:多 broker」。
#
# 所有双下划线包裹的大写占位由 k8s_deploy.ps1 Apply-Infra 在 apply 前替换
# (占位名不在注释里重复写:Apply-Infra 有一条 fail-closed 检查会把注释里的假占位
#  也当成"没替换"而拒绝 apply,与 kafka-topic-init.yaml 同一条纪律)。
---
# 客户端入口。名字必须保持 `kafka`:所有 ConfigMap / base_deploy_config 里写的 broker
# 地址都是 kafka.<InfraNamespace>:9092(C++ 节点、login/db/data-service/match/…),
# 单 broker 时 broker 广播的也是这个名字的 FQDN。改名 = 全量改配置 + 广播地址失配。
# 多 broker 时它只做 bootstrap 入口(任意一个 Ready 的 broker 都能给出全量元数据),
# 之后客户端按各 broker 自己广播的 Pod DNS(kafka-<n>.kafka-headless.<ns>)直连。
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
# headless Service:给 StatefulSet 一个稳定的 per-Pod DNS 名。
# controller quorum 通过它自举；publishNotReadyAddresses=true 保证 broker 未 Ready 时
# 也能连到自己的控制器。客户端仍走普通 kafka Service，保留 API readiness 门禁。
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  labels:
    app: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
# minAvailable 由脚本渲染:单 broker 是 1,多 broker 是 broker 数 − 1(= 一次最多自愿驱逐一个,
# 副本数 3 + min.insync.replicas 2 正好容得下一个 broker 不在)。下面这段说的是单 broker 的情形。
# 单 broker 的 PDB 只有一种有意义的写法:minAvailable: 1 = **不允许自愿驱逐**。
# 这不是洁癖 —— 整个控制面(gate/scene 的命令通道)、db_task 落库、审计流水都只有这一个
# broker,自动化的节点排空 / 集群升级把它顺手赶走时,停机窗口里产出的命令会在 librdkafka
# 的 5 分钟消息超时后直接丢。让 `kubectl drain` 挂住,是为了逼一次人工决策。
#
# **代价(必须知道)**:`kubectl drain <node>` 会一直等在这个 Pod 上。真要腾空节点时用
#   kubectl delete pod kafka-0 -n <infra>      # 自愿删除不过 PDB,Pod 随即重建
# 或 `kubectl drain --disable-eviction`(跳过 PDB)。PVC 是 ReadWriteOnce:用 local-path
# 之类的本地盘时 Pod 只能回到原节点,换节点需要先处理存储。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  minAvailable: __KAFKA_PDB_MIN_AVAILABLE__
  selector:
    matchLabels:
      app: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  serviceName: kafka-headless
  replicas: __KAFKA_BROKER_COUNT__
  # 单 broker 渲染成 OrderedReady(= 缺省值,所以既有的单 broker StatefulSet 不会因为这个不可变字段而 apply 失败)。
  # 多 broker 必须 Parallel:OrderedReady 要等 kafka-0 Ready 才建 kafka-1,而 kafka-0 要等选举组凑够多数派
  # (至少两个 controller 在)才 Ready —— 互相等,永远起不来。
  podManagementPolicy: __KAFKA_POD_MANAGEMENT_POLICY__
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # PVC 的根目录挂上来是 root:root 0755,而镜像以 appuser(uid/gid 1000)运行,
      # 不给 fsGroup 就是起手 "permission denied"(emptyDir 时代没这问题:kubelet 建的
      # emptyDir 是 0777)。fsGroup 会把卷 chown 到该 gid 并把它加进进程的附加组,
      # 所以不需要再钉 runAsUser —— 镜像换了 uid 也仍然写得进去。
      # OnRootMismatch:只在根目录属主不对时才递归 chown,日志目录长大之后重启不会
      # 每次都把几万个 segment 文件 chown 一遍(那会把启动拖成分钟级)。
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # 给 controlled shutdown 与日志 flush 留时间;被 SIGKILL 打断只会导致下次启动做
      # 一次日志恢复(数据仍在 PVC 上),但恢复期 broker 不可用,能避免就避免。
      terminationGracePeriodSeconds: 60
      # 多 broker 时尽量一台机器一个:一台节点宕机最多带走一个 broker(副本数 3 + min.insync 2 容得下)。
      # 用 preferred 而不是 required:本机 kind 只有一个节点,硬约束会让第 2、3 个 Pod 永远 Pending。
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: kafka
      containers:
        - name: kafka
          image: apache/kafka:latest
          # 文件描述符上限(R06)。K8s 没有声明 ulimit 的字段,容器运行时的 nofile **软**限
          # 因运行时/版本而异(Docker Desktop 给 1048576,不少 containerd 配置只给 1024)。
          # 而这个 broker 光控制面命令 topic 就有 2×256 个分区,每个分区至少 3 个打开文件
          # (segment + offset index + time index),再加审计 / db_task / 迁移窗口里残留的
          # per-node topic,以及每个客户端连接一个 fd —— 1024 是必然 "Too many open files"
          # (表现为分区离线、客户端连不上,而不是一条清楚的报错)。
          #
          # 所以在 exec 真正的入口之前把软限抬到硬限。软限只能升到硬限,不需要任何特权。
          # 覆盖 command/args 就绕过了镜像的 ENTRYPOINT/CMD,这里显式把它接回来:
          #   ENTRYPOINT ["/__cacert_entrypoint.sh"]  CMD ["/etc/kafka/docker/run"]
          # 换镜像版本时用
          #   docker image inspect apache/kafka:latest --format '{{json .Config.Entrypoint}} {{json .Config.Cmd}}'
          # 核一遍;路径不对会立刻 CrashLoop 并打出 "not found",不会静默降级。
          command: ["/bin/sh", "-c"]
          args:
            - |
              hard=$(ulimit -Hn 2>/dev/null || echo 1048576)
              if [ "$hard" = "unlimited" ]; then hard=1048576; fi
              ulimit -n "$hard" 2>/dev/null || echo "WARN: cannot raise nofile soft limit" >&2
              echo "kafka fd limit: soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
              # 身份由 StatefulSet 序号推出:kafka-<n> 的 node.id = n + 1。kafka-0 仍是 1,
              # 与单 broker 时代 PVC 里 meta.properties 记的 node.id 一致(对不上 broker 会拒绝启动)。
              ordinal="${POD_NAME##*-}"
              case "$ordinal" in
                ''|*[!0-9]*) echo "ERROR: cannot derive broker ordinal from POD_NAME=$POD_NAME" >&2; exit 1 ;;
              esac
              export KAFKA_NODE_ID=$((ordinal + 1))
              # 前 KAFKA_CONTROLLER_COUNT 个 Pod 兼任 controller,其余只当 broker(见文件头)。
              # 只当 broker 的节点不开 9093:它不在选举组里,开了也没人连。
              if [ "$ordinal" -lt "$KAFKA_CONTROLLER_COUNT" ]; then
                export KAFKA_PROCESS_ROLES="controller,broker"
                export KAFKA_LISTENERS="PLAINTEXT://:9092,CONTROLLER://:9093"
              else
                export KAFKA_PROCESS_ROLES="broker"
                export KAFKA_LISTENERS="PLAINTEXT://:9092"
              fi
              # 广播地址必须是**跨 namespace 可解析**的 FQDN:zone namespace 里的 login/db/gate 用
              # kafka.<infra ns>:9092 做 bootstrap 没问题,但 bootstrap 之后客户端拿到的是 broker 广播的
              # 地址再去连;以前广播短名 "kafka",在 mmorpg-zone-* namespace 里解析不到,表现为
              # metadata 拉到了却 "dial tcp: lookup kafka: no such host"。
              # 单 broker 广播 Service 名(客户端始终经过 Service 的 readiness 门禁);
              # 多 broker 每个 Pod 必须广播自己的 DNS,否则客户端按 leader 找 broker 时会被 Service 随机分到别人身上。
              if [ "$KAFKA_CONTROLLER_COUNT" -gt 1 ]; then
                export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${POD_NAME}.kafka-headless.__INFRA_NAMESPACE__.svc.cluster.local:9092"
              else
                export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://kafka.__INFRA_NAMESPACE__.svc.cluster.local:9092"
              fi
              echo "kafka identity: node.id=$KAFKA_NODE_ID roles=$KAFKA_PROCESS_ROLES advertised=$KAFKA_ADVERTISED_LISTENERS"
              exec /__cacert_entrypoint.sh /etc/kafka/docker/run
          env:
            # node.id / process.roles / listeners / advertised.listeners 每个 Pod 不同,由上面的启动脚本按序号导出,
            # 不在这里写死。POD_NAME 用 Downward API 取,不依赖容器运行时是否注入 HOSTNAME。
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # 兼任 controller 的 Pod 数:单 broker 是 1,多 broker 固定是 3(与 broker 总数无关,
            # 所以加 broker 不会改到 Pod 模板)。
            - name: KAFKA_CONTROLLER_COUNT
              value: "__KAFKA_CONTROLLER_COUNT__"
            - name: KAFKA_CLUSTER_ID
              value: "5L6g3nShT-eMCtK--X86sw"
            # 镜像的 launch 脚本读的是 **CLUSTER_ID**(不是 KAFKA_CLUSTER_ID),
            # 它自带的默认值恰好与上面同值,所以以前"碰巧"是对的。数据目录换成 PVC 之后
            # 这件事变得要命:meta.properties 里记着 format 时用的 cluster id,与启动时的
            # 值不一致 broker 会拒绝启动。显式钉住,不再赌镜像默认值。
            - name: CLUSTER_ID
              value: "5L6g3nShT-eMCtK--X86sw"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            # 不能使用普通 kafka Service：它只发布 Ready Pod，而 broker 注册到控制器
            # 才能通过 API 探针，形成启动死锁。headless 已发布未 Ready 地址，先完成自举。
            # 成员表由脚本渲染:单 broker 只有 kafka-0 一票,多 broker 是 kafka-0..2 三票
            # (形如 <node.id>@kafka-<n>.kafka-headless.<ns>.svc.cluster.local:9093,逗号分隔)。
            # 这是**静态**成员表:改它不等于迁移选举组,见文件头「不能原地切换」。
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "__KAFKA_CONTROLLER_QUORUM_VOTERS__"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            # 副本数与最小同步副本数:单 broker 是 1 / 1,多 broker 是 3 / 2。
            # 内部 topic(消费位点、事务状态)与 auto-create 出来的 topic 都吃这一组,
            # 否则业务 topic 有三份、消费位点只有一份,倒一个 broker 照样全体消费者停摆。
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "__KAFKA_REPLICATION_FACTOR__"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "__KAFKA_REPLICATION_FACTOR__"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "__KAFKA_MIN_INSYNC_REPLICAS__"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "__KAFKA_REPLICATION_FACTOR__"
            # acks=all 的生产者(C++ 幂等生产者、login 的 db_task 生产者)至少要这么多副本确认才算写入成功。
            # 多 broker 取 2:三份里允许一份掉队,但不允许只剩一份还照常收写(那份再丢就是数据丢失)。
            # 它是 broker 级默认值,对**所有** topic 生效 —— 多 broker 集群里若有人建了副本数 1 的 topic,
            # acks=all 的写入会被 NOT_ENOUGH_REPLICAS 拒掉,这是有意的:不让假冗余悄悄跑着。
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "__KAFKA_MIN_INSYNC_REPLICAS__"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # 数据目录。显式指定,不用镜像默认的 /tmp/kraft-combined-logs:
            # 旧 manifest 把卷挂在 /tmp/kafka-logs(既不是默认值也没配 log.dirs),
            # 等于挂了个没人写的空目录。KRaft combined 模式下 metadata.log.dir 默认取
            # log.dirs 的第一项,所以元数据日志也落在这块 PVC 上。
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            # --- Retention: broker 默认保留期(topic 没有自己的 retention.ms 覆盖时生效)。
            # **必须 > 消费者可能落后的最长时间**。C++ 消费者的 max.poll.interval.ms 是
            # 900000(kafka_consumer.cpp),迁移窗口里还活着的 per-node topic
            # (gate-<id> / scene-<id>)是 broker auto-create 出来的、只吃这个默认值 ——
            # 保留期低于 900s 时,一个短暂落后的 gate 丢的是 BindSession / RoutePlayer,
            # 而不是"追上来"(routing-identity-audit-20260908.md R11)。
            # 具体数值由 k8s_deploy.ps1 的 -KafkaProfile 决定,规则写在 Apply-KafkaProfileDefaults。
            # 有自己契约的 topic(审计 30 天、命令 topic 1 小时、db_task 见 ConfigMap)
            # 由 kafka-topic-init Job / 各服务的 EnsureTopics 显式覆盖,不吃这个默认值。
            - name: KAFKA_LOG_RETENTION_MS
              value: "__KAFKA_LOG_RETENTION_MS__"
            - name: KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS
              value: "__KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS__"
            # 每分区的磁盘上限,是 PVC 的兜底闸(retention.ms 先到先删,这条防突发写爆盘)。
            - name: KAFKA_LOG_RETENTION_BYTES
              value: "__KAFKA_LOG_RETENTION_BYTES__"
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "__KAFKA_LOG_SEGMENT_BYTES__"
            # --- JVM heap (production, single-node KRaft)
            # 注意:这个变量对 /opt/kafka/bin/*.sh 里的**所有**工具同样生效,包括下面
            # 探针跑的 kafka-broker-api-versions.sh —— 所以探针那条命令里显式覆盖成
            # 小堆,否则每次探测都会再起一个 -Xms512m 的 JVM 把 cgroup 撑到 OOMKilled。
            - name: KAFKA_HEAP_OPTS
              value: "__KAFKA_HEAP_OPTS__"
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 9093
              name: controller
          # 探针为什么不能用 tcpSocket 做 readiness:KRaft 启动时 SocketServer 先把
          # 9092 bind 上,要到启动的最后一步才 enableRequestProcessing。也就是说
          # **日志恢复期间 TCP 连得上、请求不受理**。用 TCP 探针,Service `kafka` 会在
          # broker 还没恢复完时就把它放进 endpoint,客户端拿到的是超时而不是重试。
          # 所以 readiness / startup 走 API 级探测(kafka-broker-api-versions.sh),
          # liveness 才用便宜的 TCP —— liveness 只负责判"JVM 死了/卡死",判错的代价是
          # 重启,阈值给宽。
          #
          # 多 broker 下这条探测命令先连本机 broker 拿到集群成员,再逐个问 API 版本;别的 broker 不在时
          # 它对那个节点报错但**整体仍以 0 退出**,所以一个 broker 倒下不应把其余 broker 判成 NotReady。
          # 这一点依赖工具的实现,上线前必须在 kind 上实测一次(杀掉一个 broker,另外两个保持 Ready),
          # 步骤见 README「Kafka:多 broker」。
          #
          # KAFKA_HEAP_OPTS 在探针命令里被覆盖成 -Xms16m -Xmx64m:容器 env 里的
          # -Xms512m -Xmx1g 会被这些工具脚本继承,和 broker 自己的 1G 堆叠在
          # 同一个 memory limit 里,必 OOMKilled。这是本文件最容易踩的一颗雷。
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - KAFKA_HEAP_OPTS="-Xms16m -Xmx64m" /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
            periodSeconds: 10
            timeoutSeconds: 10
            # 30 × 10s = 5 分钟。非正常关闭后的日志恢复(几百个分区)可能要几十秒到几分钟,
            # startupProbe 期间 liveness / readiness 都不生效,不会被误杀。
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - KAFKA_HEAP_OPTS="-Xms16m -Xmx64m" /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
            # 每次探测要起一个 JVM(约 1~2s CPU),周期刻意放到 20s,不做秒级探测。
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 20
            timeoutSeconds: 5
            # 重启单 broker = 控制面短暂停摆,是最后手段,阈值给宽(6 × 20s = 2 分钟)。
            failureThreshold: 6
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          # 换 PVC 之后 page cache 才真正起作用(emptyDir 时代读写都在节点临时盘上),
          # 而且探针 JVM 会短暂再占几十 MB:1536Mi limit 配 -Xmx1g 的非堆余量太薄,抬到 2Gi。
          # requests 抬到 300m/1Gi:512 个命令分区的 segment roll / retention 清理是持续的
          # 后台工作,200m 的 request 在节点争用时会被限流到启动都变慢。
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
  # 一块盘,跟着 Pod 身份走。不写 storageClassName = 用集群默认 StorageClass
  # (kind 的 local-path、云上的默认盘)。20Gi 的实际约束是 retention:命令 topic 1 小时、
  # db_task 见 go-svc ConfigMap 的 RetentionMs、审计 topic 30 天,再由 LOG_RETENTION_BYTES
  # 每分区兜底。zone 数或 db_task 保留期显著变大时要一起复核这个尺寸。
  # 注意:删 StatefulSet **不会**删这块 PVC(删 namespace 才会)。infra-down 是删 namespace,
  # 所以 infra-down → infra-up 之后是一套全新的空 Kafka,必须重跑 infra-kafka-topics。
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
