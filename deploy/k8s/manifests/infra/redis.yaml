# 共享 Redis:player:session / player:location / 登录锁 / 玩家锁 / scene_manager 选主锁 /
# 场景路由(scene:{id}:node)/ battle:lock / 战斗结算待销账记录都在这一个实例里,而且它在
# **同步登录路径**上(login 拿不到锁即拒绝 EnterGame)。
#
# 为什么是 StatefulSet + PVC,而不是原来的 Deployment + emptyDir:
#   1. emptyDir 随 Pod 生灭。原清单开着 --appendonly yes,但 AOF 落在 emptyDir 上,Pod 一重建
#      上面列的数据全部清零 —— 不是"短暂不可用",是数据蒸发(战斗结算的耐久副本也在其中)。
#   2. 原清单没有 strategy 也没有任何探针:Deployment 默认 RollingUpdate(replicas=1 时 maxSurge 取 1),
#      无探针 = 新 Pod 一启动就 Ready 并进入 Service。于是任何一次改配置都会出现**两个 Redis 同时挂在
#      Service redis 后面**的窗口,scene_manager 的两个副本可以各自在不同实例上 SETNX 成功 = 双 leader。
#      StatefulSet 同一序号的 Pod 不会并存,这个窗口从结构上消失。
#
# 仍然是**单实例**:这一步解决的是"重启即丢数据"与"滚动时双实例",不是高可用。Redis 挂掉期间登录
# 链路仍然整体不可用,恢复靠 K8s 重建 Pod + 重放 AOF。真正的 HA(Sentinel / Cluster)要同时改所有
# 客户端的连接方式(现在全部是 Type: node 单机模式),是另一件事。
#
# 切换注意(k8s_deploy.ps1 的 Apply-Infra 里有配套分支):kind 从 Deployment 变成 StatefulSet、名字
# 相同,kubectl apply 只会新建 StatefulSet 而不回收旧 Deployment,所以脚本会先删旧 Deployment。
# 旧 emptyDir 里的数据不迁移(本来也活不过一次 Pod 重建),切换 = 一次 Redis 重启:在线玩家的会话与
# 位置记录清空,需要重新登录。**这是一次有停机窗口的变更。**
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# StatefulSet 要求的 governing service。客户端不用它,一律走上面的 ClusterIP Service redis。
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# 与 kafka.yaml 的 PDB 同一含义:单实例没有冗余可言,minAvailable 1 的作用是**不允许自愿驱逐** ——
# kubectl drain 会在这里挂住,逼出一次人工决策(这台节点上的 Redis 一停,全服登录入口跟着停),
# 而不是让一次例行排空悄悄重启它。确实要搬走时显式 kubectl delete pod redis-0。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  labels:
    app: redis
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app: redis
  # 重启闸(P0-E 第 2 批,docs/handoff/global-singletons-p0-findings-20261014.md「P0-E」修复设计五·2):
  # k8s_deploy.ps1 的 Apply-Infra 把下面 spec.template 段的摘要(Get-RedisPodTemplateDigest,去掉 YAML 注释与空行后算)
  # 填进这条注解。它挂在 StatefulSet 自己的 metadata 上、不在 Pod 模板里,改它不会滚动 redis-0。下一次 infra-up 先读线上这条注解:
  # 模板变了(= apply 会重启 redis-0)或线上没有注解,而命令行没给 -ConfirmRedisCoreRestart,就在任何写操作之前拒绝。
  # 占位没替换就 apply 会被 Apply-Infra 的「未替换占位」检查拦下;不要手写真实摘要。
  annotations:
    mmorpg.io/redis-pod-template-digest: "__REDIS_POD_TEMPLATE_DIGEST__"
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
      # default-container:Pod 里有 redis-exporter sidecar 之后,不带 -c 的 kubectl exec / logs 仍落到 redis 容器。
      # prometheus.io/*:与 go-svc 清单同一种抓取注解,指向 redis-exporter 的 9121;告警见 deploy/k8s/redis-alerts.yaml。
      annotations:
        kubectl.kubernetes.io/default-container: redis
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
        prometheus.io/path: "/metrics"
    spec:
      # SIGTERM 后 redis-server 要把 AOF 缓冲刷盘再退出,给足时间。
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7.2
          # 密码来自**可选**的 Secret redis-auth:dev 档不注入密码(k8s_deploy.ps1 的 MMORPG_REDIS_PASSWORD
          # 回落值是空串,客户端配置里的 Password 也是空),Secret 不存在则无密码启动;release 档脚本在
          # apply 本文件之前创建该 Secret。原清单没有 requirepass,而 release 档的客户端配置一律带密码,
          # 两边不自洽 —— 客户端对一个没设密码的 Redis 发 AUTH 会直接报错,整个 release 档连不上。
          # 用 sh 包一层是因为官方镜像不支持用环境变量设密码;"$REDIS_PASSWORD" 在双引号内展开,
          # 密码里的任何字符都不会被 shell 再解释。exec 让 redis-server 成为 1 号进程,SIGTERM 直达。
          #
          # 连接上限(P0-E 第 1 批,docs/handoff/global-singletons-p0-findings-20261014.md「P0-E」修复设计二、三·1):
          # 以前两条 exec 都没写 --maxclients,上限是 Redis 缺省 10000,而且缺省值还会被容器 nofile 硬限悄悄压低
          # (Redis 需要 maxclients + 32 个 fd,硬限不够就自己下调 maxclients 并只在启动日志里留一条,外部常识,待 Codex 薄壳实测)。
          # 全服所有 zone 的 Go 连接池、Java gateway 与每个 C++ 进程都连这一个实例,连接数随 zone 数线性增长、到峰值后不回落
          # (go-redis 池没有后台回收),到线后新连接被拒、客户端日志多半看不出原因。
          #   - 取值 40000(负责人 2026-10-15 定;取值待实测 / 压测复核):按 tools/scripts/k8s_deploy.ps1「Redis 连接总账」的公式,
          #     每 zone 约 252 条(GOMAXPROCS 按 2 计,待 S6 实测),80% 水位约能承载 124 个 zone;需要 40032 个 fd。
          #     MAXCLIENTS 只在这里定义一次,两条 exec 都引用它;部署脚本的总账与契约测试从这一行读值
          #     (tools/scripts/tests/redis_maxclients_contract.tests.ps1 钉住:恰好一次、两条 exec 都带、compose 同值)。
          #   - 启动前打印 fd 限值:生产运行时的 nofile 本机无法核实,这一行是事后唯一的证据(部署后核对与排查都靠它)。
          #     硬限不够时只打 ERROR、不拒启 —— 唯一的 Redis 起不来等于全服停,这是有意的 fail-open,靠这行日志、
          #     infra-up -WaitReady 的 CONFIG GET maxclients 核对与告警兜住。补救是调节点上容器运行时的 LimitNOFILE
          #     (K8s 清单层无法声明 ulimit,同 kafka.yaml 的说明)。不自己执行 ulimit -n:redis-server 会把软限抬到硬限(外部常识,待实测)。
          #   - 不设 timeout(保持缺省 0):设了会不停踢掉常驻的空闲池连接和 C++ 每进程唯一的那条连接。tcp-keepalive / tcp-backlog 本批不动。
          #   - 就绪探针不改:到线时不论探针怎么判,新连接都进不来(到线后 redis-cli 自己也连不上,在线调大必须在到线之前做)。
          # **改这个数或改本段任何一行都会改 Pod 模板,apply 即重启 redis-0**(全服登录中断并重放 AOF):k8s_deploy.ps1 的重启闸
          # 要求显式 -ConfirmRedisCoreRestart,只在维护窗口做。要先调大已在运行的实例,在到线之前 redis-cli CONFIG SET maxclients <N>
          # (不持久,重启后回到清单值),步骤见 deploy/k8s/README.md「Redis 连接上限与总账」。
          # redis-ha.yaml 接入时要同样显式 --maxclients,节点上限 ≥(代理副本数 + maxSurge)× haproxy maxconn + 余量,并重算总账。
          #
          # --enable-debug-command no(D1 第 1b-3 批,docs/handoff/launch-readiness-20261013/spec_D1_batch1b2_2_3.md §13.1 第 5 条):
          # 这个实例同时是 mapping Redis(player:zone / player:placement / mapping:route:ready …)。DEBUG RELOAD NOSAVE / DEBUG LOADAOF
          # 会在同一进程里整库替换数据而 run_id / master_replid 不变,读方「就绪标记绑定实例身份」的判据(M1)认不出,会把替换后的旧值当权威。
          # Redis 7 缺省就是 no,这里显式写出来防止被改;对账 leader 每拍 CONFIG GET enable-debug-command,不是 no 就拒绝挂标记并撤掉现有标记。
          # 改它同样改了 Pod 模板:下一次 infra-up 要 -ConfirmRedisCoreRestart(重启 redis-0),放进维护窗口。
          command:
            - sh
            - -c
            - |
              MAXCLIENTS=40000
              need=$((MAXCLIENTS + 32))
              soft=$(ulimit -Sn 2>/dev/null || echo unknown)
              hard=$(ulimit -Hn 2>/dev/null || echo unknown)
              echo "redis fd limit: soft=$soft hard=$hard need=$need maxclients=$MAXCLIENTS"
              case "$hard" in
                unlimited|unknown) ;;
                *) if [ "$hard" -lt "$need" ]; then echo "ERROR: nofile hard limit $hard < $need, redis-server will lower maxclients below $MAXCLIENTS" >&2; fi ;;
              esac
              if [ -n "$REDIS_PASSWORD" ]; then
                exec redis-server --appendonly yes --maxclients "$MAXCLIENTS" --enable-debug-command no --requirepass "$REDIS_PASSWORD"
              fi
              exec redis-server --appendonly yes --maxclients "$MAXCLIENTS" --enable-debug-command no
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
                  optional: true
          ports:
            - containerPort: 6379
              name: redis
          # 探针判据与密码无关:PING 得到 PONG(无密码)或 NOAUTH(设了密码、未认证)都说明服务端已经
          # 起来并且**加载完 AOF**;加载期间的回复是 LOADING,按未就绪处理。readiness 不能用 tcpSocket:
          # 加载 AOF 期间端口已经可连,客户端会拿到一串 LOADING 错误。
          # startupProbe 给 AOF 重放留 5 分钟(60 × 5s);liveness 只看端口,避免把"慢"当成"死"反复重启。
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - 'r=$(redis-cli -h 127.0.0.1 -p 6379 ping 2>&1); case "$r" in PONG|NOAUTH*) exit 0 ;; *) exit 1 ;; esac'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'r=$(redis-cli -h 127.0.0.1 -p 6379 ping 2>&1); case "$r" in PONG|NOAUTH*) exit 0 ;; *) exit 1 ;; esac'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          # 只写 requests 不写 limits:原清单什么都没写 = BestEffort,节点资源紧张时第一个被驱逐。
          # 写了 requests 就是 Burstable。limits 与 --maxmemory 刻意不设:玩家数据缓存也在这个实例里,
          # 数据集大小随在线人数变化,没有容量数据就拍一个上限,等于自己引入"写满即拒写 / OOMKill 重启循环"
          # 这种新故障。上限要和压测数据一起定(noeviction 必须保持:这里存的是锁与会话,不能被淘汰)。
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
        # Redis 指标出口(2026-10-23,shared-redis-split-by-purpose.md §25.3 原 §13 第 6 条):redis_exporter 连本 Pod 的
        # 127.0.0.1:6379,在 9121 出 Prometheus 指标(内存、OOM 错误、拒绝连接、AOF、主从链路),告警规则在 deploy/k8s/redis-alerts.yaml。
        # 口令走环境变量 REDIS_PASSWORD(redis_exporter 原生读取),不上命令行、不进日志;Secret 缺失时无口令连接,与 redis 容器同口径。
        # 镜像钉具体版本。增删本容器同样改 Pod 模板,apply 要 -ConfirmRedisCoreRestart。压测复盘仍用 stress_snap.ps1 的 INFO 快照。
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.62.0
          env:
            - name: REDIS_ADDR
              value: redis://127.0.0.1:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
                  optional: true
          ports:
            - containerPort: 9121
              name: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
  # 不写 storageClassName = 用集群默认 StorageClass(与 etcd.yaml / kafka.yaml 一致)。
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
