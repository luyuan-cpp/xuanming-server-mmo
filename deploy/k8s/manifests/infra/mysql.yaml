apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
# Persistent storage for MySQL data + binlog.
# emptyDir was fine for dev smoke tests; once you turn on binlog + PITR
# the volume MUST survive pod restarts or your "binlog archive" is a lie.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # storageClassName intentionally unset — let the cluster default fill in.
  # Override per-environment via kustomize / helm if needed.
---
# Shared volume the backup CronJob writes into. Kept separate from data
# PVC so retention/backup pruning never accidentally races mysqld writes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-backup-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
---
# my.cnf fragment that enables binary logging.
# Without log-bin=ON, Point-in-Time Recovery (PITR) is impossible
# (docs/ops/mysql-backup-pitr-runbook.md §4).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
data:
  my.cnf: |
    [mysqld]
    # ── Binary logging (required for PITR) ───────────────────────────
    # binlog 目录必须在 datadir(/var/lib/mysql)**之外**:首次启动 mysqld --initialize
    # 要求 datadir 为空,以前 initContainer 先 mkdir /var/lib/mysql/binlog,initialize
    # 直接报 "data directory has files in it. Aborting" 进 CrashLoopBackOff,
    # initdb 脚本(zone_config / zone_<id>_db)一条都跑不到。2026-09-03 kind 实跑发现。
    # /var/lib/mysql-binlog 是 mysql-data-pvc 的 binlog/ 子目录(见 Deployment 的
    # subPath 挂载),备份 CronJob 仍从 PVC 根的 binlog/ 读,路径不变。
    log-bin = /var/lib/mysql-binlog/mysql-bin
    binlog_format = ROW
    binlog_row_image = FULL
    server-id = 1
    # Keep binlogs around for 7 days; the CronJob copies them out daily.
    binlog_expire_logs_seconds = 604800
    # Sync to disk per transaction — slower writes but no data loss on crash.
    sync_binlog = 1
    innodb_flush_log_at_trx_commit = 1

    # ── Charset (matches deploy default) ─────────────────────────────
    character-set-server = utf8mb4
    collation-server = utf8mb4_unicode_ci

    # ── 连接上限(2026-10-12 G2b;数值待压测确认)───────────────────────
    # 共用这台 MySQL 的是全部 zone 的 go/db、data_service、Java gateway,外加全局的 friend、trade、player-inbox、guild、mail。
    # 总账公式与规划参数在 tools/scripts/k8s_deploy.ps1(Get-MysqlConnectionPlan / Get-MysqlConnectionLedger),
    # 部署写路径打印 "MySQL connection ledger" 一行;契约测试钉住「规划峰值 ≤ 本值」。
    # 规划档:4 个 zone、每个 go/db 实例打开其余 3 个 zone 的库(最坏)、Phase 2 未开、route store 恒计入,
    # 峰值 1620(含一个 zone 滚动发布 —— 每个 Deployment 多 1 个新 Pod + 1 个仍在优雅退出的旧 Pod —— 与运维余量 20),
    # 本值留约 10% 余量。
    # 2026-10-15 加入玩家收件箱 player-inbox(2 副本 × 池 20,全局)后,按公式手算峰值 1700、余量约 6%(未运行,
    # 池上限以 go/player_inbox/etc/player_inbox.yaml 为准,契约测试复核);再加全局池前先重做规划档。
    # 2026-10-16 加入邮件 mail(2 副本 × 池 20,全局;docs/design/mail-system.md §12.3)时重做了规划档:guild 加入后峰值已是 1780(余量 20),
    # 再加 mail 稳态 +40、滚动余量 +40,峰值 1860,超过旧值 1800。本值调到 2100:峰值 1860、余量 240(约 11%,回到原先「约 10%」的口径)。
    # 内存按下面 Deployment 的核算重算过(+300 条连接 ≈ +0.3Gi,仍在 5Gi limits 之内),limits 不动。
    # 2026-10-31 逻辑库拆分(docs/design/horizontal-scale-logical-db.md):data_service 多了流水库和全部存档库的池,go/db 不变,match 的池(固定 16)第一次进总账。
    # 规划档峰值 1860 → 2386,超过 2100。本值调到 2600:余量 214(约 8%)。K=64 的生产档不走这台 MySQL,上限换 TiDB 预算,见 Get-MysqlConnectionPlan。
    # 运行中的实例不会自己变:上线前按本段末尾两种做法(维护窗口 rollout restart / SET GLOBAL)任选其一让 mysqld 拿到 2600,否则总账按 2600 通过、线上仍是旧值。
    # 以前的 500 只够 2 个 zone 的稳态(恰好 500,零余量);4 个 zone 稳态就要 920(docs/PROGRESS.md 2026-10-12)。
    # 超限的后果不只是变慢:go/db 把 1040 当普通错误,耗尽重试后进没有消费者的死信(读代码推断,未实测)。
    # 改本值必须同步改下面 Deployment 的内存 limits(按每条连接约 1MiB 常驻估,待实测)。
    # 注意:本 ConfigMap 变了不会让 mysqld 重启 —— 只改这一行时运行中的实例仍是旧值,而总账与契约测试已按新值算。
    # 只改上限时要么在维护窗口 `kubectl -n <infra> rollout restart deploy/mysql`,要么 `SET GLOBAL max_connections = <新值>`
    # (只改运行值,立即生效;重启后仍读本文件,所以本文件必须已是新值)。
    # SET PERSIST 会把值写进 datadir(在 PVC 上)的 mysqld-auto.cnf,启动时优先于本文件(MySQL 8.0 文档,凭记忆,未在本机核实):
    # 用过之后再改本值 + 重启都不生效,而总账与契约测试照样按本文件的值通过;已经用过的,先 `RESET PERSIST max_connections` 再改。
    max_connections = 2600

    # ── Misc ─────────────────────────────────────────────────────────
    skip-name-resolve = ON
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  strategy:
    # Recreate not RollingUpdate — only one pod can hold the PVC at a time.
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      initContainers:
        # 在 PVC 根下预建 data/(datadir)与 binlog/ 两个子目录并交给 mysql 用户(uid 999)。
        # 两者由下面的 subPath 分别挂到 /var/lib/mysql 与 /var/lib/mysql-binlog:
        # datadir 首次启动时必须为空,所以 binlog 不能再放在 datadir 里面。
        - name: init-binlog-dir
          image: busybox:1.36
          command:
            - sh
            - -c
            - "mkdir -p /pvc/data /pvc/binlog && chown -R 999:999 /pvc/data /pvc/binlog"
          volumeMounts:
            - name: mysql-data
              mountPath: /pvc
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - --defaults-extra-file=/etc/mysql/conf.d/my.cnf
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "Mmorpg#2026db"
            # 库名口径以 deploy/docker-compose.yml 为准:MYSQL_DATABASE=mmorpg。
            # 以前这里写 game,而 mysql-init/gateway_tables.sql 是 `USE mmorpg;`、
            # Java 网关 jdbc 也连 /mmorpg —— 在 K8s 上 zone_config 表根本不在网关看的库里。
            # mysql 镜像的 entrypoint 跑 initdb 脚本时会带 --database=$MYSQL_DATABASE,
            # 所以没写 USE 的 guild_friend_tables.sql 也落在 mmorpg。
            - name: MYSQL_DATABASE
              value: "mmorpg"
            # 与 compose 同一套业务账号。00_init_zone_dbs.sql 会 GRANT 给 'appuser'@'%',
            # MySQL 8 对不存在的用户执行 GRANT 直接报 ERROR 1410 并中止整个 initdb,
            # 所以 appuser 必须由 MYSQL_USER 先建出来。
            - name: MYSQL_USER
              value: "appuser"
            - name: MYSQL_PASSWORD
              value: "apppass123"
          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts:
            # PVC 根不直接挂到 datadir:PVC 根里还有 binlog/,会让 --initialize 判定
            # datadir 非空。datadir = PVC/data,binlog = PVC/binlog(与 my.cnf 的 log-bin 对应)。
            - name: mysql-data
              mountPath: /var/lib/mysql
              subPath: data
            - name: mysql-data
              mountPath: /var/lib/mysql-binlog
              subPath: binlog
            - name: mysql-config
              mountPath: /etc/mysql/conf.d
              readOnly: true
            # deploy/mysql-init/*.sql(+ k8s_deploy.ps1 按 zones 配置生成的
            # 01_k8s_zone_dbs.sql)以 ConfigMap mysql-init-sql 挂到 initdb 目录,
            # 与 compose 的 ./mysql-init 卷等价。ConfigMap 由 k8s_deploy.ps1
            # Apply-Infra 在 apply 本文件之前生成(New-MysqlInitConfigMapYaml)。
            # 注意:initdb 只在数据目录为空的**首次**启动执行;PVC 已有数据时不会
            # 重跑,改了 sql 要么 `kubectl -n <infra> delete pvc mysql-data-pvc` 重建,
            # 要么手动 `kubectl exec ... mysql < xxx.sql`。
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          # 内存随 max_connections 同步(2026-10-12 G2b;待压测确认):
          #   innodb_buffer_pool_size 默认 128Mi + 全局开销约 0.5Gi + 2600 条连接 × 约 1MiB
          #   + 活跃会话缓冲与大包约 0.6Gi + TempTable(temptable_max_ram 默认 1Gi)≈ 4.8Gi,
          #   各项都是经验值,留约 1.2Gi → limits 6Gi(2026-10-31 max_connections 2100 → 2600 时重算)。
          #   超过 limits 是 OOMKill:单实例 MySQL 整体重启,比 1040 更糟。
          # requests 只提到 1Gi,保证 dev kind 节点能调度;生产应 requests = limits(Guaranteed),见 G2b 待拍板。
          # CPU 不在本次调整范围:1 核仍是开服硬瓶颈(docs/design/tidb-phase1-and-launch-readiness.md §1.5)。
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 6Gi
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -uroot
                - -pMmorpg#2026db
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data-pvc
        - name: mysql-config
          configMap:
            name: mysql-config
        - name: mysql-init
          configMap:
            name: mysql-init-sql
