# etcd-id-registry:全局号源登记处(docs/design/player-data-tidb-scaling-plan.md §6.3,docs/ops/id-issuer-runbook.md)。
#
# 发号器一块号要三份记录都写成功才发:本地域的 etcd、etcd-id-secondary 各一份,这里一份。它还记着每个地域码
# 绑定的是哪一对本地 etcd、下一个可认领的码是几,所以重复部署、克隆快照、复用退役码在发号之前就被拒绝。
# 全部地域、全部物理集群、staging 和 prod 共用这一套:全世界只有一个集群部署它(k8s_deploy.ps1 -HostIdRegistry),
# 其他集群的 data-service 用 -IdRegistryEtcd 指过来。
#
# 写入极少:每个地域每预留一块号写一次,数据是每个地域码一个键。它不可用时新块预留失败,但各地域手里的块还能用很久。
#
# **不要从备份恢复它。** 它是本地两套 etcd 一起回档时的证据,和它们一起回档就什么也证明不了。它整个丢了数据时,
# 按运维手册 §4.3 从各地域的本地记录重建。
#
# 跨集群访问:这里只有集群内的 Service。别的集群要经私网(VPC 对等、专线)访问,只放行各集群 data-service 的出口,不能暴露到公网。
# 客户端口是双向 TLS(2026-11-11):服务端证书和信任的 CA 在运维预置的 Secret etcd-id-registry-tls(ca.crt、tls.crt、tls.key),
# 客户端必须出示这个 CA 签的证书(--client-cert-auth),data-service 的客户端证书在各 zone 的 Secret id-registry-client-tls。
# 服务端证书的 SAN 要覆盖各地域 -IdRegistryEtcd 用的主机名和本集群的 etcd-id-registry.__INFRA_NAMESPACE__。
# 探针和指标走单独的 http 监听口 2381(--listen-metrics-urls):客户端口要证书,kubelet 和 Prometheus 拿不到。
# peer 仍是集群内 http。k8s_deploy.ps1 在任何写操作之前核对 Secret 在不在、三个键齐不齐。
#
# 所有 __INFRA_NAMESPACE__ 占位由 k8s_deploy.ps1 Apply-Infra 在 apply 前替换成 -InfraNamespace。
#
# 形状照 etcd-id-secondary.yaml。不同的地方:名字、标签和引导令牌都是 etcd-id-registry,绝不能是 app: etcd
# 或 app: etcd-id-secondary(会混进那两套的 Service 和 PDB);反亲和同时避开那两套。
---
apiVersion: v1
kind: Service
metadata:
  name: etcd-id-registry
  labels:
    app: etcd-id-registry
spec:
  type: ClusterIP
  selector:
    app: etcd-id-registry
  ports:
    - name: client
      port: 2379
      targetPort: 2379
---
# publishNotReadyAddresses 必须为 true:成员选出 leader 之前不会 Ready,不发布地址就永远互相找不到。
apiVersion: v1
kind: Service
metadata:
  name: etcd-id-registry-headless
  labels:
    app: etcd-id-registry
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: etcd-id-registry
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: etcd-id-registry
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: etcd-id-registry
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd-id-registry
  labels:
    app: etcd-id-registry
spec:
  serviceName: etcd-id-registry-headless
  replicas: 3
  # 必须 Parallel:静态引导要 2 个成员同时在线才能选出 leader,OrderedReady 会死锁。
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: etcd-id-registry
  template:
    metadata:
      labels:
        app: etcd-id-registry
      # 与 etcd.yaml 同一套抓取注解:deploy/k8s/etcd-alerts.yaml 的无主、空间告警同样覆盖登记处(它不可用时各地域新块预留失败)。
      # 端口是 2381 的 http 指标口:2379 开了双向 TLS,Prometheus 没有客户端证书。
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2381"
        prometheus.io/path: "/metrics"
    spec:
      # 尽量散到不同节点,也尽量别和本集群两套发号 etcd 的成员挤在一起。
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: etcd-id-registry
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: etcd
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: etcd-id-secondary
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 1001
      terminationGracePeriodSeconds: 30
      containers:
        - name: etcd
          # 与 etcd.yaml 同一个官方镜像、同一个摘要(理由见那份文件),换版本要几份清单与 compose 同批改
          # (etcd_maintenance_contract.tests.ps1 守住)。官方镜像没有 shell,ETCD_* 由 etcd 自己解析。
          image: quay.io/coreos/etcd:v3.6.16@sha256:a9c7cc12156f4b26ca41f0b57ba5b76c45037ff6c1e47ea3d68cb7908d48a965
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/etcd"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ETCD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # PVC 下的 data/ 子目录(同 etcd.yaml)。
            - name: ETCD_DATA_DIR
              value: /var/lib/etcd/data
            # 客户端口双向 TLS:只认 etcd-id-registry-tls 里那个 CA 签的客户端证书(各地域 data-service 的 id-registry-client-tls)。
            - name: ETCD_LISTEN_CLIENT_URLS
              value: "https://0.0.0.0:2379"
            - name: ETCD_CLIENT_CERT_AUTH
              value: "true"
            - name: ETCD_TRUSTED_CA_FILE
              value: /etc/etcd/tls/ca.crt
            - name: ETCD_CERT_FILE
              value: /etc/etcd/tls/tls.crt
            - name: ETCD_KEY_FILE
              value: /etc/etcd/tls/tls.key
            # 探针与 Prometheus 用的 http 口:只有 /health 和 /metrics,不能读写数据。
            - name: ETCD_LISTEN_METRICS_URLS
              value: "http://0.0.0.0:2381"
            - name: ETCD_LISTEN_PEER_URLS
              value: "http://0.0.0.0:2380"
            - name: ETCD_ADVERTISE_CLIENT_URLS
              value: "https://$(POD_NAME).etcd-id-registry-headless.__INFRA_NAMESPACE__.svc.cluster.local:2379"
            - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
              value: "http://$(POD_NAME).etcd-id-registry-headless.__INFRA_NAMESPACE__.svc.cluster.local:2380"
            - name: ETCD_INITIAL_CLUSTER
              value: "etcd-id-registry-0=http://etcd-id-registry-0.etcd-id-registry-headless.__INFRA_NAMESPACE__.svc.cluster.local:2380,etcd-id-registry-1=http://etcd-id-registry-1.etcd-id-registry-headless.__INFRA_NAMESPACE__.svc.cluster.local:2380,etcd-id-registry-2=http://etcd-id-registry-2.etcd-id-registry-headless.__INFRA_NAMESPACE__.svc.cluster.local:2380"
            - name: ETCD_INITIAL_CLUSTER_STATE
              value: "new"
            # 引导令牌带上托管它的 K8s 集群的身份(kube-system 的 UID,k8s_deploy.ps1 Apply-Infra 替换 __KUBE_CLUSTER_UID__):
            # 误在第二个集群带 -HostIdRegistry 起出来的登记处,集群号和真的那一套不同(设计 §6.3)。
            - name: ETCD_INITIAL_CLUSTER_TOKEN
              value: "mmorpg-etcd-id-registry-__INFRA_NAMESPACE__-__KUBE_CLUSTER_UID__"
            # 每个地域码一个键,写入极少。留 1000 个历史版本足够,配额给 512MiB(满足「配额 × 2 + 1Gi ≤ 盘」)。
            - name: ETCD_AUTO_COMPACTION_MODE
              value: "revision"
            - name: ETCD_AUTO_COMPACTION_RETENTION
              value: "1000"
            - name: ETCD_QUOTA_BACKEND_BYTES
              value: "536870912"
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
            - containerPort: 2381
              name: metrics
          readinessProbe:
            httpGet:
              path: /health
              port: 2381
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health?serializable=true
              port: 2381
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: etcd-data
              mountPath: /var/lib/etcd
            - name: etcd-tls
              mountPath: /etc/etcd/tls
              readOnly: true
      volumes:
        # 运维预置,不写 optional:证书缺了 etcd 起不来,比无认证地跑起来好。0440 + fsGroup 1001,etcd 进程能读、别人不能。
        - name: etcd-tls
          secret:
            secretName: etcd-id-registry-tls
            defaultMode: 288
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
