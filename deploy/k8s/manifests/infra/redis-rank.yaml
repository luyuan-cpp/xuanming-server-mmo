# 排行榜专用 Redis(RankRedis;docs/design/leaderboard-system.md §3.5 / §9.1#4 已拍板:独立实例 + noeviction)。
#
# 里面只有两个键:lb:{rating}:z(ZSET,名次与分数)与 lb:{rating}:v(HASH,版本 "<rating_gen>:<games>")。
# 为什么不放共享 Redis / redis-match-cluster:
#   - 这两个键**无 TTL**,在 allkeys-lfu / volatile-lru 的库上会被悄悄驱逐 —— 榜上少人没有任何报错(§3.5);
#     (2026-10-22 更正,上句原文保留:共享库是 noeviction、不设 maxmemory,不会淘汰,但会与契约 key 争内存、将来设了上限写满即拒写;
#      redis-match-cluster 的 volatile-lru 只淘汰带 TTL 的键,这两个键在那里满了是拒写而不是被驱逐。不放这两处的实际理由是故障与容量隔离,
#      独立实例 + noeviction 的结论不变。)
#   - 它们是 match 评分的派生视图,丢了能靠 Kafka offset 重放恢复(快照 topic 保留 7 天,runbook 在 §3.5),
#     但"能恢复"不等于"可以随便丢",所以按契约 §4 的严格档部署。
#
# 写满(maxmemory)时 noeviction 让写命令直接报错:rank 消费者把它当瞬时错误退避重试、不跳过(榜停止更新、仍可读),
# rank_write_total{outcome="error"} 上涨 → 告警 RankWriteFailing(deploy/k8s/rank-alerts.yaml)。这比静默淘汰好:先发现,再扩容。
#
# 单实例 StatefulSet + PVC + AOF(与共享 redis.yaml 同一做法,解决"重启即丢"与"滚动时双实例");不做 HA:
# 挂掉期间读榜回 kServiceUnavailable、写榜在消费组里排队等恢复,玩家资产与评分本身不受影响。
# 刻意**不写 PDB**:与共享 Redis 不同,这里停一下只影响排行榜展示,不该让 kubectl drain 为它挂住。
#
# 密码:与共享 Redis 同一个**可选** Secret redis-auth(k8s_deploy.ps1 在 apply 基础设施之前按 MMORPG_REDIS_PASSWORD 建或删),
# rank 的 ConfigMap 里 RankRedis.Pass 取同一个值。两个实例同一把口令是有意的:同一信任域、同一轮换节奏,少一把要管的密钥。
apiVersion: v1
kind: Service
metadata:
  name: redis-rank
  labels:
    app: redis-rank
spec:
  selector:
    app: redis-rank
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# StatefulSet 要求的 governing service。客户端不用它,一律走上面的 ClusterIP Service redis-rank。
apiVersion: v1
kind: Service
metadata:
  name: redis-rank-headless
  labels:
    app: redis-rank
spec:
  clusterIP: None
  selector:
    app: redis-rank
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-rank
  labels:
    app: redis-rank
spec:
  serviceName: redis-rank-headless
  replicas: 1
  selector:
    matchLabels:
      app: redis-rank
  template:
    metadata:
      labels:
        app: redis-rank
    spec:
      # SIGTERM 后 redis-server 要把 AOF 缓冲刷盘再退出,给足时间。
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7.2
          # 用 sh 包一层的理由同 redis.yaml(官方镜像不支持用环境变量设密码;exec 让 redis-server 成为 1 号进程,SIGTERM 直达)。
          #   - maxmemory 512mb + noeviction:容量按每个上榜玩家约 200 字节(ZSET 一项 + HASH 一项,含 Redis 自身开销,估算值,
          #     待压测核实)计,约 250 万人;到线后写报错而不是淘汰(见文件头)。改容量时 resources.limits 要同步留出余量
          #     (AOF 重写时 fork 会多占内存)。
          #   - maxclients 1000:客户端只有 rank(2 副本 × go-zero 池 10 × GOMAXPROCS 2 = 40,滚动时 +20)、探针与运维 redis-cli,
          #     远低于上限;显式写出是为了不随容器 nofile 硬限悄悄变化(理由同 redis.yaml)。
          command:
            - sh
            - -c
            - |
              if [ -n "$REDIS_PASSWORD" ]; then
                exec redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --maxclients 1000 --requirepass "$REDIS_PASSWORD"
              fi
              exec redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --maxclients 1000
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
                  optional: true
          ports:
            - containerPort: 6379
              name: redis
          # 探针判据同 redis.yaml:PONG 或 NOAUTH 都说明已加载完 AOF;加载期间回 LOADING,按未就绪处理。
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - 'r=$(redis-cli -h 127.0.0.1 -p 6379 ping 2>&1); case "$r" in PONG|NOAUTH*) exit 0 ;; *) exit 1 ;; esac'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'r=$(redis-cli -h 127.0.0.1 -p 6379 ping 2>&1); case "$r" in PONG|NOAUTH*) exit 0 ;; *) exit 1 ;; esac'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            # 512mb 数据 + AOF 重写 fork 的写时复制余量;OOMKill 比写报错更糟(会丢最近一秒的 AOF 并重放)。
            limits:
              memory: 1Gi
          volumeMounts:
            - name: redis-rank-data
              mountPath: /data
  # 不写 storageClassName = 用集群默认 StorageClass(与 redis.yaml / etcd.yaml 一致)。
  volumeClaimTemplates:
    - metadata:
        name: redis-rank-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
