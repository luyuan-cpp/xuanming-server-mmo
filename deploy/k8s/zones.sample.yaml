zones:
  - name: yesterday
    zoneId: 101
    # gateNodePortBase(D88):-ClientEntryMode external + -GateServiceType NodePort 时,本 zone 的 gate-<i>
    # 用 nodePort = gateNodePortBase + i,占用 [base, base + gate 副本数 - 1]。多 zone 时每个 zone 必须显式写,
    # 各段不能重叠,建议收在 K8s 静态子段 30000-30085 内;podip 模式不读它。键单独占一行、行尾不写注释。
    gateNodePortBase: 30000
    replicas:
      centre: 1
      gate: 2
      # scene: N  - legacy single-pool. 生成一个名为 scene 的 Deployment,
      #           显式带 env SCENE_NODE_TYPE=0(全部 pod 都是主世界角色)。
      #           脚本仍然接受这个字段;当 scene_manager_service.yaml 里
      #           StrictNodeTypeSeparation=true(生产默认)时改用下面的拆分形式。
      scene: 4

  - name: today
    zoneId: 102
    # 与上一个 zone 的 [30000-30001] 错开;每 zone 留 10 个口,gate 扩到 10 副本前都不用改。
    gateNodePortBase: 30010
    replicas:
      centre: 1
      gate: 2
      # Split form: two scene Deployments share one zone namespace and one image.
      #   scene_world    -> Deployment with env SCENE_NODE_TYPE=0, hosts persistent
      #                     main-world channels for all players.
      #   scene_instance -> Deployment with env SCENE_NODE_TYPE=1, hosts副本/战场
      #                     instances created on demand.
      # Recommended baseline: world ~= 1.2x instance, scaling instance first when
      # dungeon/arena traffic rises. Monitor Redis keys
      # scene_nodes:zone:{zoneId}:load and node:{id}:player_count.
      #
      # 只要这两个键出现任意一个,就进入拆分模式:legacy 的 scene 键被忽略,
      # 也不会再生成名为 scene 的 Deployment。完整规则见
      # docs/ops/scene-node-role-split.md §3.2.1。
      scene_world: 2
      scene_instance: 2
