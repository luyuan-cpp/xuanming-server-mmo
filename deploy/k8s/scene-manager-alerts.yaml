# Prometheus alert rules for SceneManager's scene-node role split.
#
# Install as a PrometheusRule CR (kube-prometheus stack):
#   kubectl apply -n observability -f deploy/k8s/scene-manager-alerts.yaml
#
# Or merge the `groups:` list into an existing PrometheusRule if you already
# have one for the game platform.
#
# Scrape prerequisites:
#   - SceneManager's `MetricsListenAddr` set (e.g. ":9150").
#   - A ServiceMonitor or PodMonitor pointed at that port.
#
# Severity conventions used here:
#   critical = pager, someone wakes up
#   warning  = next-business-hours channel
#   info     = dashboard annotation / trend signal
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scene-manager-alerts
  labels:
    app: scene-manager
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: scene-manager.node-role-split
      interval: 30s
      rules:
        # --- Pool health ---------------------------------------------------
        # 两条 PoolEmpty 都由两支 `or on (zone_id)` 组成:
        #   左支(旧写法,原样保留):"这个 zone 还有存活的 scene 节点,却没有一个能承载该用途的"。
        #     左侧给出仍有节点(> 0)的 zone,unless 去掉已有对应承载节点的 zone。
        #     role 取值与 constants.IsInstanceHostingType / IsWorldHostingType 对齐
        #     (instance|instance_cross、main_world|main_world_cross):节点选择按 MatchesPurpose
        #     过滤,只有 cross 型节点的 zone 同样能服务,不该误报。
        #   右支(整 zone 全灭):`sum by (zone_id) (...) == 0`。Go 侧现在为「有存活节点的 zone」与
        #     「本 scene_manager 自己配置的 ZoneId」发布四种声明角色的 0 值(metrics.go SetNodesByRole,
        #     load_reporter.go refreshLoadScores)。zone 内所有 scene 节点都消失时左支为空,右支由该
        #     zone 自己的 SM 补的 0 求和为 0,触发。
        # 语义与兼容:
        #   - 池子空了但别的角色还有节点:左支触发(与旧行为一致);
        #   - 整个 zone 全灭:右支触发;
        #   - Go 回滚 / 只有旧二进制在跑:右支没有序列,退化为旧行为 —— 两条 critical 不会因此静默失效;
        #   - 多副本、以及别的 zone 的 SM 也在发布同一 zone:用 sum 而不是 min,只要有一个 > 0 就不触发。
        #     (2026-10-16 更正发布者:领导者发布它 etcd 镜像里的全部 zone,跟随者只发布自己配置的 ZoneId;
        #     所以每个 zone 的发布者是「领导者 + 该 zone 自己的 SM 副本」,各自的值都来自 etcd 快照、彼此一致。
        #     表达式只做 > 0 / == 0 判定,不受发布者个数影响,不用改。)
        # 残余盲区:
        #   - 该 zone 自己的 SM 也全挂了,或它的 ZoneId 配错(配错还会误报一个空 zone);
        #   - 某个 SM 卡在 fullSync 的 3s 重试循环(etcd 不可达)时不再走 refreshLoadScores,它最后一次
        #     发布的 > 0 旧值会一直留着,压住这两条告警。这种形态下 scene 节点同样无法注册 / 续租,应由
        #     etcd / SM 存活类告警覆盖,本文件没有;
        #     (2026-10-16 补充:卡住的若是领导者,压住的是**全部** zone;卡住的是跟随者,只压住它自己的 zone。
        #     领导者卡住时 SceneManagerLoadRefreshStalled 会响,可作这一形态的旁证。)
        #   - 新 zone 开服、整 zone 维护:2 分钟后两条 critical 都会响(新行为),事先对该 zone_id 加
        #     silence,步骤见 docs/ops/scene-node-role-split.md。
        # 阈值 / for / severity 沿用原值。
        - alert: SceneManagerInstancePoolEmpty
          expr: |
            (
              count by (zone_id) (scene_manager_nodes_by_role > 0)
              unless on (zone_id)
              count by (zone_id) (scene_manager_nodes_by_role{role=~"instance|instance_cross"} > 0)
            )
            or on (zone_id)
            (sum by (zone_id) (scene_manager_nodes_by_role) == 0)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Zone {{ $labels.zone_id }} has zero instance-hosting scene nodes"
            description: |
              No instance-hosting pods (eSceneNodeType=1 kSceneNode / 3 kSceneSceneCrossNode)
              are Ready in zone {{ $labels.zone_id }}, while other scene nodes are still alive there.
              With StrictNodeTypeSeparation=true, CreateScene for dungeons/battlegrounds
              will return ErrNoNodeForPurpose until at least one instance pod appears.
              Scale up scene-instance-z{{ $labels.zone_id }} or check pod Ready state.
              或该 zone 的 scene 节点已全灭(由该 zone 自己的 scene_manager 显式发布 0);
              新 zone 开服 / 整 zone 维护期间属预期,应事先对该 zone_id 加 silence。
            runbook_url: docs/ops/scene-node-role-split.md

        - alert: SceneManagerWorldPoolEmpty
          expr: |
            (
              count by (zone_id) (scene_manager_nodes_by_role > 0)
              unless on (zone_id)
              count by (zone_id) (scene_manager_nodes_by_role{role=~"main_world|main_world_cross"} > 0)
            )
            or on (zone_id)
            (sum by (zone_id) (scene_manager_nodes_by_role) == 0)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Zone {{ $labels.zone_id }} has zero world-hosting scene nodes"
            description: |
              No world-hosting pods (eSceneNodeType=0 kMainSceneNode / 2 kMainSceneCrossNode)
              in zone {{ $labels.zone_id }}, while other scene nodes are still alive there. Persistent
              world channels cannot be served; EnterScene will reject new players. Scale up
              scene-world-z{{ $labels.zone_id }} immediately.
              或该 zone 的 scene 节点已全灭(由该 zone 自己的 scene_manager 显式发布 0);
              新 zone 开服 / 整 zone 维护期间属预期,应事先对该 zone_id 加 silence。
            runbook_url: docs/ops/scene-node-role-split.md

        # --- Load imbalance ------------------------------------------------
        # 2026-10-16 起每节点序列(node_player_count / node_load_score)只由领导者导出,换主时序列从一个
        # pod 换到另一个 pod,中间空缺最长约一个选主锁 TTL 加一拍(约 35s),超过 30s 的评估间隔:下面
        # WorldNodeSaturated(for 10m)与 LoadScoreDispersionLow(for 15m)的 pending 计时会在换主时清零。
        # 表达式不用改,读数时知道这一点即可。
        - alert: SceneManagerWorldNodeSaturated
          expr: |
            max by (zone_id) (scene_manager_node_player_count{role=~"main_world.*"}) > 1800
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "A world pod in zone {{ $labels.zone_id }} is near capacity"
            description: |
              scene_manager_node_player_count crossed 1800 for >10 min on a world pod.
              Consider raising WorldChannelCountByConfId for the busiest confIds, or
              adding another scene-world replica so the next rebalance tick spreads load.

        - alert: SceneManagerLoadScoreDispersionLow
          # stddev / mean < 0.1 across a zone's world pods means the scheduler has
          # little signal to differentiate nodes — new scenes keep piling on the
          # same pod.
          expr: |
            (
              stddev by (zone_id) (scene_manager_node_load_score{role=~"main_world.*"})
              /
              avg by (zone_id) (scene_manager_node_load_score{role=~"main_world.*"})
            ) < 0.1
          for: 15m
          labels:
            severity: info
          annotations:
            summary: "Load score dispersion in zone {{ $labels.zone_id }} too low for effective scheduling"
            description: |
              Scores on the world pool are nearly identical. Consider raising
              NodeLoadWeightPlayerCount so live players push more weight than
              scene count, letting the scheduler pick a clear winner.

        # --- 负载分刷新(scene_manager_load_refresh_*,2026-10-16)-----------
        # 负载分、类型镜像与每节点序列只由领导者按 zone 批量刷新(go/scene_manager/internal/logic/
        # load_refresh.go),跟随者不刷新。load_refresh_total{outcome} 每拍(5s)由领导者记一次;六个 outcome
        # 在每个副本注册指标时预置为 0,所以「没人在刷」表现为 increase == 0,而不是序列消失。
        # outcome:ok / partial(个别键读不到:WRONGTYPE、空串、非数字,保留旧分)/ read_failed(读批遇到传输层
        # 失败:熔断拒绝 / 取连接 / 网络 / 超时;只按错误类型判,与批怎么切无关)/ registry_failed
        # (scene_manager:zones 登记失败)/ write_failed(写批失败)/ lost_leadership(刷新途中降级)。
        # 四条的阈值与 for 都是起步值,待压测基线(AGENTS §6);代码未编译、未实测。
        - alert: SceneManagerLoadRefreshStalled
          expr: |
            sum(increase(scene_manager_load_refresh_total[2m])) == 0
            or absent(scene_manager_load_refresh_total)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "scene_manager 负载分刷新停摆超过 5 分钟(没有领导者在刷新)"
            description: |
              正常时领导者每 5s 记一次 scene_manager_load_refresh_total。连续 2 分钟没有增长、持续 5 分钟,说明
              没有领导者(选主失败 / 全部副本 LeaderEligible=false / 选主锁所在 Redis 不可写),或领导者卡在
              fullSync 的 3s 重试循环(etcd 不可达,或存活集闸门压住了快照:SceneManagerNodeViewHeld 会同时亮)、
              load reporter 的 goroutine 被阻塞。
              影响:负载分与类型镜像停在最后一次的值,选点按旧分;每节点看板整片变空;同一条 goroutine 上的
              死节点清扫、推迟摘除多半一起停。absent 分支 = 没有任何 scene_manager 导出本指标(没抓到 /metrics,
              或全部是 2026-10-16 之前的旧版本)。
              处置:先查 sum(scene_manager_is_leader)(应恒为 1);再看领导者日志里的
              "[LoadReporter] full sync failed" / "watch interrupted" / "resync requested",以及 etcd 与选主锁所在
              Redis 的健康。滚动升级期间领导者若仍是旧版本(不导出本指标),本告警会误报,升级窗口内对它加 silence。
            runbook_url: docs/ops/scene-node-role-split.md

        # --- etcd 存活集合理性闸门(scene_manager_node_view_*,决策清单 B1-1,2026-11-05)---------
        # fullSync 拿到的快照为空、或某个 zone 已知节点缺席过半时整轮作废、3s 重试(go/scene_manager/internal/logic/
        # node_view_gate.go):不换镜像、不清扫、不补频道。缺席数稳定 60s 才放行,变了从头计时;空快照永远不放行。
        # 两个指标都不带 label,每个副本一份(跟随者也比自己的镜像)。哪个 zone、缺几个看日志
        # "[LoadReporter] full sync failed: scene node view held by the liveness gate"。
        # 压住期间 watch 与每拍刷新都停,压满 5 分钟 LoadRefreshStalled 也会亮(同一件事,先按本条处置)。
        - alert: SceneManagerNodeViewHeld
          expr: |
            max(scene_manager_node_view_holding) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "scene_manager 的 etcd 节点快照被存活集闸门压住超过 2 分钟,控制面停在压住之前"
            description: |
              节点失租后会自己重新注册,正常几十秒内恢复;压住 2 分钟还在,说明快照一直是空的,或缺席的节点一直在变
              (还在陆续回来 / 陆续消失)。期间本副本不看 watch、不刷新负载分、不清扫、不补频道,新起的节点也看不到。
              先用 etcdctl get SceneNodeService.rpc/ --prefix --keys-only 数注册,和 kubectl get pods 里在跑的 scene 比:
              注册比在跑的少很多 = etcd 回档 / 重建 / 连错,修 etcd;两者一致、确实死了一大半节点 = 真实的大面积故障,
              缺席数稳定 60s 后会自动放行(接着亮 SceneManagerNodeViewReleased)。空快照(日志里 held_empty)不会自动放行:
              节点全没了时等节点重新注册;etcd 坏了就先修 etcd。
            runbook_url: docs/ops/scene-node-role-split.md

        # 闸门放行了一次骤降:从这一轮 fullSync 起,缺席的节点按消失处理 —— 领导者写 death_at、摘负载集,再入屏障之后
        # 强制销毁它们名下的实例场景,世界频道改派到活节点。真实的大面积故障会走到这一步;如果那些节点其实还活着
        # (etcd 视图错了),这里就是误判开始兑现。
        - alert: SceneManagerNodeViewReleased
          expr: |
            sum(increase(scene_manager_node_view_released_total[15m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "scene_manager 存活集闸门放行:某个 zone 一半以上的节点被当成消失处理"
            description: |
              日志 "[LoadReporter] node view gate released for zone N" 带已知数与缺席数。按上一条的 etcdctl 与 kubectl 对照核实。
              节点确实死了:不用处置,看 scene_manager_dead_node_reconcile_pending 回落。节点其实还活着:立刻修 etcd,
              然后逐个核对这些节点上的实例场景 —— 已知缺口:节点重新注册之后,已经入队的死节点收尾仍会按判死时刻的快照
              销毁它名下的实例,DestroyScene 打到活节点上(docs/handoff/server-gap-audit-20261101.md 第 32 条,未修)。
            runbook_url: docs/ops/scene-node-role-split.md

        - alert: SceneManagerLoadRefreshFailing
          expr: |
            sum(increase(scene_manager_load_refresh_total{outcome=~"read_failed|registry_failed|write_failed"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "scene_manager 负载分刷新持续失败(outcome=read_failed / registry_failed / write_failed)"
            description: |
              read_failed:计数读批遇到传输层失败(go-zero 熔断拒绝 / 取连接 / 网络 / 超时),受影响的节点保留旧分,
              不在负载集里的以「最后才被选中」的哨兵分加入。registry_failed:登记集合 scene_manager:zones 写失败,
              负载集照常写,但这一拍新出现的 zone 没登记,它若随后整体下线,fullSync 的清扫与孤儿清理会漏掉它。
              write_failed:类型镜像 SET 或负载集 ZADD 失败,分数没更新(这些 zone 的每节点序列本拍不更新),新注册的
              节点可能进不了负载集(会被当作已死,改派仍受再入屏障约束)。
              partial(个别键的回复错误 / 坏值,不论批大小、节点多少)不在本规则里,由
              SceneManagerLoadRefreshNodeErrors 盯;日志看领导者的 "[LoadRefresh] ... node counter reads failed"。
              处置:查 Redis(连接数、慢日志、used_memory 与 maxmemory、go-zero 熔断日志 "breaker is open");
              领导者日志搜 "[LoadRefresh]" 看是哪一步、哪个 zone 失败。
            runbook_url: docs/ops/scene-node-role-split.md

        - alert: SceneManagerLoadRefreshSlow
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(scene_manager_load_refresh_duration_seconds_bucket[10m]))) > 2
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "scene_manager 负载分刷新 p99 超过 2s(拍长 5s)"
            description: |
              一拍刷新 = 一条 SADD 登记 + 分批 pipeline 读两个计数 + 分批 pipeline 写类型镜像与 ZADD(每批 1024 条)。
              p99 逼近 5s 的拍长时,刷新会挤占 load reporter 的 goroutine(watch 事件、推迟摘除、死节点收尾同在其上)。
              多半是 Redis 慢(慢日志、CPU、网络)或全服节点数增长到单领导者扛不住(容量模型 §2.2 / A1:每 zone 选主)。
              阈值 2s 是起步值,待压测基线。
            runbook_url: docs/ops/scene-node-role-split.md

        - alert: SceneManagerLoadRefreshNodeErrors
          # 用 sum 而不是逐 pod:计数器只由领导者累加,换主时序列换 pod,sum 让 for 计时不随换主清零。
          expr: |
            sum(increase(scene_manager_load_refresh_node_errors_total[10m])) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "scene_manager 有 scene 节点的负载计数持续读不到(超过 30 分钟)"
            description: |
              领导者每拍刷新时有节点的 scene_count / 成员集合读不到(WRONGTYPE、scene_count 的值是空串或非数字,或传输层失败),
              30 分钟里每个 10 分钟窗口都有。这些节点:在负载集里的一直保留旧分;不在的以哨兵分 1e12 加入、选点永远
              排最后,等于悄悄少了一份容量;它们的每节点序列(node_player_count / node_load_score)停在最后一次成功的
              值,SceneManagerWorldNodeSaturated / SceneManagerLoadScoreDispersionLow 按这份旧值判。个别键坏掉只记
              outcome=partial,SceneManagerLoadRefreshFailing 不覆盖这种情形。
              处置:领导者日志搜 "[LoadRefresh]",从 first 里拿到 zone / node,用 redis-cli 的 TYPE / GET / SCARD 查
              node:zone:{z}:{node}:scene_count 与 node:zone:{z}:{node}:members;同时有 read_failed 时先按 Failing 查 Redis。
              阈值与 for 是起步值,待压测基线。
            runbook_url: docs/ops/scene-node-role-split.md

        # --- Rebalance health ----------------------------------------------
        - alert: SceneManagerRebalanceStalled
          # Urgent migrations (node_gone) that persist > 5 min indicate the
          # migration execution path is broken (CreateScene keeps failing on
          # the target, or the rebalancer itself is wedged).
          expr: |
            max by (zone_id) (scene_manager_rebalance_pending{reason="node_gone"}) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Rebalance urgent queue not draining in zone {{ $labels.zone_id }}"
            description: |
              At least one world channel is mapped to a dead / non-world-hosting node
              and hasn't been migrated in 5+ minutes. curl /debug/rebalance-plan on
              the SceneManager pod to inspect the queue; check scene-world pod logs
              for CreateScene RPC failures.
            runbook_url: docs/ops/scene-node-role-split.md

        - alert: SceneManagerRebalanceFailureRate
          # Sustained failure rate on migrations — the target pool is refusing
          # CreateScene or the gRPC dial keeps timing out.
          expr: |
            (
              sum by (zone_id) (rate(scene_manager_rebalance_migrations_total{outcome="failed"}[5m]))
              /
              (sum by (zone_id) (rate(scene_manager_rebalance_migrations_total[5m])) > 0)
            ) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Over 50% of rebalance migrations failing in zone {{ $labels.zone_id }}"
            description: |
              Target nodes are rejecting CreateScene or the gRPC dial is hanging.
              Inspect scene-world pod logs on the target nodes; check etcd NodeInfo
              for stale endpoints.

        # --- Mirror lifecycle ----------------------------------------------
        - alert: SceneManagerMirrorColocationDegraded
          # hit_rate = hit / (hit + fallback). Sustained <50% means
          # mirror co-location is mostly missing — either the source
          # nodes are dying, the soft load cap is set too low, or the
          # mirror feature is being used cross-zone in ways co-location
          # cannot serve.
          expr: |
            (
              sum by (zone_id) (rate(scene_manager_mirror_colocate_total{outcome="hit"}[10m]))
              /
              (sum by (zone_id) (rate(scene_manager_mirror_colocate_total[10m])) > 0)
            ) < 0.5
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "Mirror co-location hit-rate below 50% in zone {{ $labels.zone_id }}"
            description: |
              Mirrors are mostly NOT being co-located with their source scene's
              node. Inspect rate(scene_manager_mirror_colocate_total{outcome="fallback"}[10m])
              by `reason` label to see why (no_mapping | zone_mismatch | node_dead | overloaded).
              Tune MirrorSourceNodeLoadCap upward if the dominant reason is "overloaded".

        # --- EnterScene 拒绝(scene_manager_enter_scene_rejected_total)--------
        # 这里原先只有一条 SceneManagerEnterSceneRejectedSpike,表达式钉在 reason="scene_gone" 上。
        # 它有过一段恒为空向量、永远不会响的时期(Prometheus 对恒空表达式不报错):
        #   - "scene_gone" 的唯一发射点在提交 a0152a5b8(2026-05-02)随 destroy-while-entering
        #     分支一起被删。这条分支在提交 d41219ca7(2026-05-30)加了回来(go/scene_manager/internal/logic/enterscenelogic.go
        #     里 AtomicAddSceneMemberIfSceneExists 返回 <0 → ErrNoAvailableNode
        #     "scene %d disappeared during enter"),但当时**没有**带回 enter_scene_rejected_total,
        #     只记了 enter_scene_stage_seconds{stage="reserve"} 的耗时。
        #     (2026-10-12 历史改写后对应的新号是 0e26844b5 与 f3f08e2ad,内容相同;2026-10-21 起旧历史经 6c7f507cc
        #     吸收为 main 的祖先,旧号也能 git show。引用以新号为准。)
        #   - 2026-09-20 已在该分支补回 ObserveEnterSceneRejected(zone, "scene_gone")(常量
        #     rejectReasonSceneGone),对应告警是本组最后的 SceneManagerEnterSceneSceneGone,
        #     阈值 / for / severity 沿用原告警。
        #
        # 现在真实发射的 reason:下面 9 个(metrics.go 的 Help;发射点在 enterscenelogic.go / home_zone.go),
        # 外加列在它们之后的 channel_* 5 个(玩家主动选线预检,发射点在 channel_pick.go):
        #   handoff_pending_no_marker    **不告警**。生产配置(AllowUnsafeCrossNodeHandoff=false)下,
        #                                 客户端每一次跨节点换图的第一跳都注定拿到它:源 scene 收到 18 才
        #                                 冻结 → 存盘 → 写 handoff 标记 → 重发(docs/design/
        #                                 cross-zone-scene-travel.md §11.2)。它的速率只反映换图有多频繁。
        #                                 比值告警(no_marker / 落点次数)的口径与校准步骤见
        #                                 cross-zone-scene-travel.md「P3 收尾」一节,待压测基线后再落。
        #   handoff_pending_stale_marker  有标记,但不是当前归属代际(或写坏了)。异常来源:源 scene 重发后
        #                                 仍过不了门 = 它缓存的 epoch 已被废黜。常规来源:跨 zone 放行 /
        #                                 疏散改派不删标记,旧标记在 EX 300 内被下一次跨节点换图的第一跳
        #                                 读到 —— 基线不是 0,但远低于 no_marker。
        #   handoff_pending_withdrawn     预检通过,落点 Lua 里再比时标记已被源 scene 撤回(应答看门狗
        #                                 到期 / 玩家中途退出)。持续出现 = EnterScene 慢过了源端看门狗。
        #   epoch_conflict                观察到的 owner_epoch 在落点 CAS 前被并发 EnterScene 推进,本次
        #                                 不发路由。偶发 = 顶号 / 重复提交;持续 = 上游重试风暴或去重失效。
        #   home_zone_unavailable         归属 zone 查不到:data_service 超时 / 不可用,或本进程没配
        #                                 DataServiceRpc 且 AllowGateZoneAsHomeZone=false。带 GateId 的
        #                                 EnterScene(登录、换图)**全部**被拒,属依赖不可用。
        #                                 注意它的 zone_id 是 gate zone(home_zone.go),其余 reason 是目标 zone。
        #   home_zone_unmapped_travel     跨 zone 传送遇到全局库 player_route 里没有归属的玩家:
        #                                 gate zone 不能代表归属,拒绝(错误码同
        #                                 上,20)。zone_id 同样是 gate zone:第一条腿上是源 zone(玩家留在
        #                                 原地收 tip),第二条腿上是目标 zone(玩家落不了地,应≈0)。它不是
        #                                 依赖故障,重试不会好,要查这名玩家的 player_route 行(建角时写入)。
        #                                 由玩家操作直接触发(每点一次传送一次拒绝 + 一条 ERROR 日志),
        #                                 见 SceneManagerHomeZoneUnmappedTravel;应恒 0。
        #   scene_gone                    destroy-while-entering:请求指定的 scene_id 在解析之后、预占人数
        #                                 之前被回收。偶发是正常噪声,持续非 0 见 SceneManagerEnterSceneSceneGone。
        #   travel_map_unavailable       跨 zone 传送第一条腿:目标 zone 没有这张图的任何世界频道,未改
        #                                 任何状态,玩家留在原地收 tip。scene_conf_id 是客户端可控字段。
        #   pending_map_fallback          跨 zone 传送第二条腿:第一条腿记下的目标地图解析失败,已回落默认
        #                                 大世界(人照常落地)。不该有稳定速率。
        #
        # (2026-10-20 补,10-22 订正:Help 里另有 2 个本清单没列的 reason,本组都不按它们告警。
        #   session_stale:落点会话身份裁决拒绝,顶号竞态下偶发属正常;
        #   session_conflict:同上一类裁决,应恒 0,由下面 scene-manager.placement-identity 组按
        #   placement_identity_total 告警。
        #  逐个 reason 的含义见 enterscenelogic.go / home_zone.go / channel_pick.go 的 rejectReason* 常量注释,
        #  以及 metrics.go 里 enterSceneRejectedTotal 的注释。)
        #
        # 另有玩家主动选线预检发出的 5 个 reason(发射点 go/scene_manager/internal/logic/channel_pick.go,
        # 设计 docs/design/world-channel-switch.md §4.4;只有带 client_channel_pick 的 EnterScene 会发出,
        # zone_id 是目标 zone)。**都不告警**:它们是玩家点线路面板触发的业务拒绝,预检纯只读、拒绝时不改
        # 任何状态,有稳定的低速率属正常,速率只反映玩家点得有多频繁:
        #   channel_closing               玩家选的线在回收中集合里(自动缩容已把它摘出选线集合,等人走空后销毁)。
        #                                 只在 WorldAutoscale 缩容期间出现。
        #   channel_conf_mismatch         请求带的 scene_conf_id 与这条线实际所属的地图对不上(该字段客户端可控)。
        #                                 正常客户端不该发出;持续出现 = 客户端缺陷或有人在构造请求。
        #   channel_switch_disabled       ChannelSwitch.Disabled=true:玩家主动切线被配置关闭,关闭期间每点一次
        #                                 一次拒绝(客户端按目录的 switch_enabled 置灰,正常不该发得出来)。
        #   channel_full                  目标线人数已到每线上限(ChannelSwitch.MaxPlayersPerChannel,缺省跟随
        #                                 WorldAutoscale.ScaleOutPlayerThreshold)。人数计数没有对账,节点死亡后
        #                                 残留的旧计数会造成误拒(world-channel-switch.md §9.3)。
        #   channel_switch_cooldown       距上一次主动切线还没过冷却(ChannelSwitch.CooldownSeconds,默认 10s)。
        #
        # 按语义拆成五组:归属交接异常(warning)/ 归属查询依赖不可用(critical + warning 两档)/
        # 跨 zone 传送的玩家缺归属映射(warning)/ 跨 zone 传送目标地图不可用(warning)/
        # 进入途中场景被回收(warning,原告警恢复)。阈值沿用本文件既有口径:原告警的 0.05 req/s、10m、
        # warning;"理应极少发生"的事件沿用 SceneManagerMirrorSourceMissing 的 0.01 req/s;比例型沿用
        # SceneManagerRebalanceFailureRate 的 `分子 / (分母 > 0) > 0.5` 写法。
        # 这些取值所在的代码从未被编译、未跑过压测,阈值**没有实测基线**,首轮双 zone 压测后应回头校准。
        - alert: SceneManagerEnterSceneHandoffAnomaly
          # 按 reason 各自判阈值(sum by 里带 reason),避免 stale_marker 的常规基线吃掉另外两种的
          # 余量,告警上也能直接看到是哪一种。
          # for: 15m 而不是 10m:一次性事件(单个节点疏散 / 一批跨 zone 放行)留下的旧标记最多活
          # 300s,再叠加 rate 的 5m 窗口,对本表达式的影响不超过约 10 分钟;15m 才能把它与持续性
          # 异常分开。
          expr: |
            sum by (zone_id, reason) (rate(scene_manager_enter_scene_rejected_total{reason=~"handoff_pending_stale_marker|handoff_pending_withdrawn|epoch_conflict"}[5m])) > 0.05
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "EnterScene 归属交接异常 {{ $labels.reason }} >0.05 req/s(zone {{ $labels.zone_id }})"
            description: |
              reason={{ $labels.reason }} 持续超过 0.05 req/s。
              handoff_pending_stale_marker:源 scene 重发 EnterScene 后仍被 18 拒,说明它缓存的
              owner_epoch 已不是 Redis 当前值(已被废黜)。对照 scene 节点 30s 一行的 [TravelHandoff]
              汇总里的 aborted,以及 [OwnerEpoch] stale_owner_write_rejected 是否非 0。若同期在做节点
              疏散 / 滚动升级,先确认是不是旧标记(EX 300)的尾巴。
              断线释放标记(A1′,干净退出后写 "E:ms")上线后,本 reason 还会混入"上一任的释放标记还在、
              而新铸的落点没载入就被重试"的登录重试,不一定是源 scene 被废黜:先对照 scene 30s 一行的
              [ExitRelease] 汇总(written / inherit_*)与 CPP-2 的症状再下结论,压测复盘时两类分开统计
              (cross-zone-scene-travel.md §12.6.4 M12)。
              handoff_pending_withdrawn:预检通过后标记被源 scene 撤回。对照 [TravelHandoff] 汇总里的
              reply_watchdog_fired(源端应答预算 30s 到期)与 exit_wins(玩家中途退出);前者在涨就查
              EnterScene 分阶段时延(scene_manager_enter_scene_stage_seconds)。
              epoch_conflict:同一玩家的并发 EnterScene 互相抢先。查上游(login / scene)是否在重试
              风暴,或 request_id 去重是否失效。
              三种拒绝都不改玩家的 location / owner_epoch(预占的场景人数已成对释放),玩家侧表现为
              本次换图 / 传送 / 进场景失败,可重试。
            runbook_url: docs/design/cross-zone-scene-travel.md

        - alert: SceneManagerHomeZoneLookupUnavailable
          # 依赖不可用类:超过一半的归属 zone 查询以拒绝告终。分母是同一 zone_id(gate zone)口径的
          # home_zone_lookup_total —— 每一次 home_zone_unavailable 拒绝之前都恰好记过一次
          # ObserveHomeZoneLookup(unconfigured 或 error,见 home_zone.go),比值必在 [0,1]。
          # critical:影响面与 SceneManagerWorldPoolEmpty 相同(新玩家进不了场景);比它多等 3 分钟
          # (for: 5m)是为了盖过 data_service 滚动重启的瞬时抖动。
          expr: |
            (
              sum by (zone_id) (rate(scene_manager_enter_scene_rejected_total{reason="home_zone_unavailable"}[5m]))
              /
              (sum by (zone_id) (rate(scene_manager_home_zone_lookup_total[5m])) > 0)
            ) > 0.5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "gate zone {{ $labels.zone_id }} 过半 EnterScene 因查不到归属 zone 被拒"
            description: |
              scene_manager 在发路由前要向 data_service 查玩家归属 zone(决定存盘落哪个库),查不到就
              fail-closed 拒绝,玩家进不了场景。按 outcome 看 scene_manager_home_zone_lookup_total:
              error = data_service 超时 / 不可用(查 data_service 存活与 HomeZoneLookupTimeoutMs);
              unconfigured = 本进程没配 DataServiceRpc 且 AllowGateZoneAsHomeZone=false(多 zone
              部署漏配;进程收到第一条请求时打过一条 [home-zone] ERROR,此后不再重复)。
            runbook_url: docs/design/cross-zone-scene-travel.md

        - alert: SceneManagerHomeZoneLookupRejecting
          # 同一依赖的低档:没到过半,但持续有玩家因此进不了场景。阈值 / for / severity 沿用原告警。
          expr: |
            sum by (zone_id) (rate(scene_manager_enter_scene_rejected_total{reason="home_zone_unavailable"}[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "gate zone {{ $labels.zone_id }} 持续有 EnterScene 因查不到归属 zone 被拒(>0.05 req/s)"
            description: |
              data_service 的 GetPlayerHomeZone 间歇性超时 / 失败。稳态下
              scene_manager_home_zone_lookup_total{outcome="error"} 应恒 0。查 data_service 负载与
              HomeZoneLookupTimeoutMs(默认 1500ms)。
            runbook_url: docs/design/cross-zone-scene-travel.md

        - alert: SceneManagerHomeZoneUnmappedTravel
          # 不是依赖故障(所以不并进上面两条 home_zone_unavailable 告警):data_service 答得上来,
          # 答案是「这个玩家没有映射」。重试不会好,只有运维回填映射才会停;不配告警的话唯一的信号
          # 是 scene_manager 的 ERROR 日志量。"理应为 0"的事件,阈值沿用
          # SceneManagerMirrorSourceMissing 的 0.01 req/s / 10m / warning ——
          # 单个玩家点几次传送够不着,持续够得着 = 有一批未回填的存量号在用传送。没有实测基线。
          expr: |
            sum by (zone_id) (rate(scene_manager_enter_scene_rejected_total{reason="home_zone_unmapped_travel"}[5m])) > 0.01
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "gate zone {{ $labels.zone_id }} 持续有跨 zone 传送因玩家没有归属记录被拒(>0.01 req/s)"
            description: |
              跨 zone 传送的两条腿上 gate zone 不能代表归属,玩家在 player_route 里没有归属就 fail-closed
              拒绝(错误码 20,未改玩家状态)。zone_id 是 gate zone:第一条腿上是源 zone,玩家留在
              原地收 tip;第二条腿上是目标 zone,玩家已离开源 scene、落不了地,优先处理(指标与
              日志都不区分两条腿,要看该玩家的 player:{id}:location 是否为无 node_id 的等待落点)。
              处置:查这名玩家的 player_route 行(建角时写入),再查全局库
              是否回档过。scene_manager 日志搜 "[home-zone] Cross-zone travel rejected"
              可看到具体 player(每次拒绝一条 ERROR,由玩家操作直接触发;2026-10-13 日志英文化之前的
              原文是 "[home-zone] 跨 zone 传送被拒")。
            runbook_url: docs/design/cross-zone-scene-travel.md

        - alert: SceneManagerZoneTravelMapUnavailable
          # 跨 zone 传送的目标地图落不进去。两种 reason 都"理应极少发生",阈值沿用
          # SceneManagerMirrorSourceMissing 的 0.01 req/s / 10m / warning;0.05 对传送这种低频
          # 操作太高,目标地图整张不可用也未必够得着。
          expr: |
            sum by (zone_id, reason) (rate(scene_manager_enter_scene_rejected_total{reason=~"travel_map_unavailable|pending_map_fallback"}[5m])) > 0.01
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "跨 zone 传送目标地图不可用 {{ $labels.reason }}(目标 zone {{ $labels.zone_id }})"
            description: |
              travel_map_unavailable:目标 zone 的 world_channels:zone:{z}:{conf} 为空,第一条腿直接
              拒绝,玩家留在原地。要么目标 zone 没开这张图 / 世界频道初始化没跑完,要么客户端在发
              目标 zone 不存在的 scene_conf_id(该字段客户端可控,单个异常客户端持续重试也能触发)。
              pending_map_fallback:第一条腿放行了,第二条腿却解析不出记下的地图,玩家被回落到默认
              大世界。查两条腿之间目标 zone 的世界频道是否被回收、world 节点是否全挂或满员。
              scene_manager 日志搜 "[Travel]" 可看到具体 scene_conf_id。
            runbook_url: docs/design/cross-zone-scene-travel.md

        - alert: SceneManagerEnterSceneSceneGone
          # destroy-while-entering(原 SceneManagerEnterSceneRejectedSpike,发射点 2026-09-20 补回):
          # 请求指定的场景在 resolveScene 与原子 INCR 之间被生命周期回收。偶发非 0 是正常噪声;
          # 持续非 0 说明空闲回收过于激进,或 reconcile 在失控地清场景。
          # 阈值 / for / severity 原样沿用被替换前的告警。
          expr: |
            sum by (zone_id) (rate(scene_manager_enter_scene_rejected_total{reason="scene_gone"}[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "EnterScene 持续因场景在进入途中被回收而拒绝 >0.05 req/s(zone {{ $labels.zone_id }})"
            description: |
              场景在进入途中被销毁(destroy-while-entering):AtomicAddSceneMemberIfSceneExists
              返回 -1,客户端收到 ErrNoAvailableNode "scene N disappeared during enter",未改玩家状态。
              确认 InstanceIdleTimeoutSeconds / MirrorIdleTimeoutSeconds 没有短于客户端的平均重试
              预算;对照 scene_manager_scene_orphans_reconciled_total 与
              scene_manager_instance_destroyed_total 看 reconcileDeadNodeScenes 近期是否触发过。

        # --- EnterScene 落点回滚(scene_manager_enter_scene_rollback_total)---------
        # 推路由 / 重定向(Kafka)失败之后,scene_manager 要撤掉本次落点(internal/logic/owner_epoch.go
        # rollbackPlayerPlacement)。GO-2 根治后是单调回滚(cross-zone-scene-travel.md §12.8):location 退回
        # 本次之前的值,铸造过的 owner_epoch **再前进一格**(N+1 → N+2,不再退回旧值);凭交接标记铸造的回滚
        # 以「所凭标记原样还在」为前提,同时写回滚回执、把标记转写到新 epoch,源 scene 凭回执采纳新值。
        # outcome:
        #   rolled_back / already_rolled_back  正常收尾(后者 = go-redis 重发时首发已生效),不告警;
        #   marker_gone                        凭标记铸造,回滚时标记已不在(目标节点已消费令牌,或源 scene
        #                                      已取证 / 撤回):一个字节不动、保留本次落点。属于 Kafka「报错
        #                                      但已投递」/ 源端提前取证的正常竞态;无基线,本批不配规则,
        #                                      有基线后再加比例告警。分辨方法见 runbook;
        #   superseded                         被并发请求推进,偶发属正常并发,不告警;
        #   redis_error                        go-redis 重试耗尽仍出错,**不告警就没有别的信号**:
        #                                      Redis 里可能留着本次落点(epoch 已推进),而 Kafka 同时也坏了;
        #   plan_error                         回滚计划构造失败(按构造不可达),没有回滚,终态同 redis_error;
        #                                      应恒 0,出现即代码缺陷(日志搜 "[RouteRollback] outcome=plan_error")。
        #                                      与 redis_error 并入同一条规则(终态相同,都不告警就没有别的信号)。
        # "理应为 0"且单次就有玩家受影响的事件:任一次即告警(> 0),不设 for。该指标只按 outcome 分,
        # 不带 zone_id;哪个 zone 要看是哪个 scene_manager 实例报的。代码从未编译、未实测,无基线。
        - alert: SceneManagerEnterSceneRollbackRedisError
          expr: |
            sum(increase(scene_manager_enter_scene_rollback_total{outcome=~"redis_error|plan_error"}[10m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "EnterScene 推路由 / 重定向失败后,回滚落点时 Redis 也出错(10 分钟内 {{ $value }} 次)"
            description: |
              Kafka 推送与 Redis 回滚在同一次 EnterScene 里先后失败(双重故障),或 Redis 在回滚那一刻
              抖动。回滚是否执行未知(正常的回滚会把 location 退回、把 owner_epoch 再前进一格),玩家的
              player:{id}:location / owner_epoch 可能停在本次落点上:
              跨 zone 第一条腿:location 停在目标 zone 的等待落点(node_id 为空)。源 scene 收到失败应答
              (ErrKafkaRoute=7)后立即裁决为"已被放行"(应答也丢失时由看门狗约 30s 后裁决),给客户端发失败
              tip 与踢线 34、销毁实体;玩家重登即可落地,数据以冻结时的存盘为准,不丢。
              scene 日志搜 "[ZoneTravel][ClientReset]" 对照。
              同 zone 路由失败:location 指向一个从未收到路由的节点,源实体被销毁而 gate 会话仍绑在源
              节点上,玩家挂在哑连接上,要等客户端自己断线重登(已知限制);重登若被 18 挡住,等断线租约到期。
              回滚其实已执行时(读超时一类),凭标记的那一支会在 location 里留下回滚回执,源 scene 取证读到后
              采纳新 epoch、解冻继续玩(scene 日志 "[ZoneTravel][RollbackAdopt]"),同样不丢数据。
              处置:先查 Redis(连接数、慢日志、主从切换)与 Kafka broker 是否同时异常;scene_manager 日志
              搜 "[RouteRollback] outcome=redis_error" 拿到 player 与 epoch,必要时按 location 人工核对。
              outcome=plan_error 同样触发本规则:回滚计划构造失败(按构造不可达)、没有回滚,终态同上;出现即代码
              缺陷,日志搜 "[RouteRollback] outcome=plan_error",保留现场交开发。
            runbook_url: docs/ops/cross-zone-failure-test-runbook.md

        # --- 死节点推迟摘除(scene_manager_node_detach_deferred_total,GO-6)------
        # 已判死的 scene 节点写不进 death_at(再入屏障的死亡时刻)或摘不出负载集时,scene_manager
        # 不再照样摘除,而是把节点留在负载集里(按存活处理)进推迟队列,每 5s 重试
        # (internal/logic/reentry_barrier.go「推迟的摘除」)。outcome:
        #   deferred / recovered / dropped  正常自愈或节点重新注册 / 领导权变化,不告警;
        #   expired    满一个屏障仍写不进 death_at,不带标记摘除 —— 安全(推迟期间屏障已兜满),
        #              但说明 Redis 在拒 SET;
        #   abandoned  10 分钟仍摘不出负载集,放弃 —— 死节点留在负载集,CreateScene / EnterScene
        #              可能被派到它上面,直到下一次 fullSync。
        # 健康时这两个事件恒为 0,不是需要基线校准的阈值:任一次即告警(> 0),不设 for,写法同
        # SceneManagerEnterSceneRollbackRedisError。代码从未编译、未实测。
        - alert: SceneManagerNodeDetachWithoutDeathMark
          expr: |
            sum by (zone_id) (increase(scene_manager_node_detach_deferred_total{outcome=~"expired|abandoned"}[10m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "zone {{ $labels.zone_id }} 有死节点在 death_at 写不进或摘不出负载集的情况下被处理(10 分钟内 {{ $value }} 次)"
            description: |
              expired:scene 节点判死后,自首次尝试起满一个再入屏障(默认 20s)仍写不进
              node:zone:{z}:{n}:death_at,scene_manager 不带标记把它摘出了负载集。推迟期间节点留在负载集、
              改派全部被拒,所以这一步本身是安全的,但说明 Redis 在拒绝 SET(内存写满 / 只读 / 熔断)。
              abandoned:自首次尝试起 10 分钟仍摘不出负载集,scene_manager 放弃推迟。死节点留在负载集里
              按存活处理,CreateScene / EnterScene 可能被派到它上面(RPC 失败回滚 / 玩家挂在哑连接上),
              直到下一次 fullSync(watch 重连 / 领导权变化 / 进程重启)重扫。
              处置:查 Redis(used_memory 与 maxmemory、慢日志、连接数、go-zero 熔断日志);scene_manager
              日志搜 "[ReentryBarrier][DeferDetach]" 看是哪个节点、哪一步失败;遇到 abandoned 且 Redis 已恢复,
              可以重启 scene_manager 领导者,触发 fullSync 重扫。
            runbook_url: docs/ops/cross-zone-failure-test-runbook.md

        # --- 死节点收尾任务(scene_manager_dead_node_reconcile_total / _pending,R1)------
        # 节点判死时,摘出负载集与写收尾任务在同一次 Lua 里完成。任务由两个键组成:任务表
        # scene_manager:dead_node_reconcile(ZSET,全服一张,成员 "{zone}/{node}",分数 = 首次入队毫秒),
        # 和收尾范围 node:zone:{z}:{n}:reconcile_scenes(判死时刻的场景快照,处理完一个摘一个)。
        # 领导者每 5s 一拍,另在每次 fullSync 时,对屏障(默认 20s,只能调高)已过的任务做一轮
        # (internal/logic/reentry_barrier.go「被屏障推迟的死节点收尾」)。outcome:
        #   completed  收尾范围已空,死节点计数删掉、任务出队。正常,不告警;
        #   retry      这一轮有场景没结论(Redis 出错),任务留着,下一拍只重试剩下的。故障期间每条任务每拍 +1,不单独告警;
        #   abandoned  本进程从第一次没做完起满 10 分钟仍做不完,放弃:计数与任务删掉,没结论的场景留在
        #              反向索引 node:zone:{z}:{n}:scenes 里,只有同一 node_id 再次判死或空闲回收才会处理。
        # 两个指标都只由领导者发出,降级的副本把自己发过的 pending 写回 0。代码未编译、未实测。
        #
        # abandoned 健康时恒 0,不需要基线:任一次即告警(> 0),不设 for,写法同
        # SceneManagerNodeDetachWithoutDeathMark。increase() 看不到序列从「不存在」到 1 的第一次跳变,所以
        # 第一次 retry 时会给同 zone 的 abandoned 预建值为 0 的序列(metrics.go ObserveDeadNodeReconcile)。
        # 放弃最早发生在 10 分钟之后,预建的 0 来得及被抓到。
        - alert: SceneManagerDeadNodeReconcileAbandoned
          expr: |
            sum by (zone_id) (increase(scene_manager_dead_node_reconcile_total{outcome="abandoned"}[10m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "zone {{ $labels.zone_id }} 有死节点的收尾任务做了 10 分钟仍没做完,已放弃(10 分钟内 {{ $value }} 次)"
            description: |
              scene 节点判死、屏障过后,scene_manager 领导者要把它死时名下的孤儿实例逐个强制销毁(世界频道交给
              rebalance,不在这里),全部有结论才删死节点的计数并出队。这条任务在本进程里从第一次没做完起重试满
              10 分钟仍有实例没结论(Redis 出错),已放弃:node:zone:{z}:{n}:scene_count / members、收尾范围与任务
              已删;没结论的实例留在反向索引 node:zone:{z}:{n}:scenes 里,scene:{id}:node 多半仍指向死节点。
              之后只有同一 node_id 再次判死,或空闲回收,才会处理它们。
              处置:先查控制域 Redis(连接数、慢日志、主从切换、used_memory 与 maxmemory、go-zero 熔断日志);
              scene_manager 领导者日志搜 "[ReentryBarrier] Dead node cleanup still incomplete after",
              行里有 zone / node 与最后一次失败的 err。Redis 恢复后,用 SMEMBERS node:zone:{z}:{n}:scenes
              列出剩下的场景,GET scene:{id}:node 看属主是否仍是死节点,ZSCORE instances:zone:{z}:active {id}
              看实例是否还挂着。
            runbook_url: docs/ops/cross-zone-failure-test-runbook.md

        # pending 是 Redis 任务表里还没收完的任务数,按 zone 计,只由领导者每拍发布。健康时一条任务只活一个
        # 屏障加一拍;Redis 出错时最多重试 10 分钟就放弃,那一支由上一条告警覆盖。
        # for: 15m = 屏障 20s + 放弃期限 10m + 约 4.5 分钟余量。调高屏障(SceneReentryBarrierSeconds)时把 for 同步调高。
        # 连续 15 分钟每次评估都非 0,说明有任务既没做完、也没走到放弃。常见原因:
        #   - 屏障一直挡着:读 death_at 失败按屏障未到处理(fail-closed),这一支既不记 retry,也不计放弃期限;
        #     death_at 写坏了要等标记 TTL(10 分钟)过期;同一 node_id 反复判死,death_at 被覆盖写,屏障一再顺延;
        #   - 领导者频繁更换:放弃期限只在进程内计时,新领导者从头计时,换得比 10 分钟还勤时永远走不到放弃;
        #   - 收尾没在跑:没有领导者,或领导者卡在 fullSync 重试循环,gauge 停在最后一次发布的值
        #     (SceneManagerLoadRefreshStalled 会同时响);
        #   - 放弃这一步的 Lua 本身也失败("Failed to abandon dead node cleanup"),Redis 持续拒写。
        # 用 max 而不是 sum:领导者短暂重叠时两个副本发布的是同一份 Redis 计数,sum 会翻倍。
        # 已知误报:
        #   - 节点连环崩溃、间隔短于一个屏障且持续 15 分钟时,pending 也一直非 0。这时
        #     SceneManagerSceneOrphanReconcileSpike 多半同时在响,先按节点崩溃处理;
        #   - 某个旧领导者卡在 fullSync 重试循环、没走到降级清零那一步时,它最后发布的非 0 值会一直留着,
        #     即使新领导者已经收完。这种情况下该副本本身就要排查。
        - alert: SceneManagerDeadNodeReconcileStuck
          expr: |
            max by (zone_id) (scene_manager_dead_node_reconcile_pending) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "zone {{ $labels.zone_id }} 有死节点收尾任务 15 分钟没收完({{ $value }} 条)"
            description: |
              任务表 scene_manager:dead_node_reconcile 里这个 zone 的任务连续 15 分钟不为 0,而且没有走到
              放弃(放弃会触发 SceneManagerDeadNodeReconcileAbandoned)。死节点名下的孤儿实例一直没被销毁,
              死节点的 scene_count / members 也一直没删。
              排查:ZRANGE scene_manager:dead_node_reconcile 0 -1 WITHSCORES 看是哪些 "{zone}/{node}"、
              什么时候入的队;SMEMBERS node:zone:{z}:{n}:reconcile_scenes 看还剩哪些场景;
              GET node:zone:{z}:{n}:death_at 看屏障起点。
              再按指标分辨原因:scene_manager_reentry_barrier_blocked_total{site="dead_node_cleanup"} 在涨,
              说明屏障一直挡着(读 death_at 失败,或节点反复判死);sum(scene_manager_is_leader) 变化频繁,
              说明领导者在换;SceneManagerLoadRefreshStalled 同时响,说明收尾没在跑。
              领导者日志搜 "[ReentryBarrier] Dead node cleanup" 与 "dead_node_cleanup: previous owner just declared dead"。
            runbook_url: docs/ops/cross-zone-failure-test-runbook.md

        - alert: SceneManagerSceneOrphanReconcileSpike
          # A burst of orphan reconciles past 50/min in one zone is most
          # likely a scene-node pod crash. One spike is informational;
          # repeated spikes mean a node is flapping.
          expr: |
            sum by (zone_id) (rate(scene_manager_scene_orphans_reconciled_total[5m])) * 60 > 50
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Zone {{ $labels.zone_id }} reconciled >50 orphan scenes/min"
            description: |
              A scene-node likely died. kubectl get pods -l app=scene-instance-z{{ $labels.zone_id }}
              and check for CrashLoopBackOff / OOMKilled. Players in those
              instances were force-disconnected; expect concurrent reconnect storm.

        - alert: SceneManagerMirrorSourceMissing
          # Mirror create rejected because source_scene_id no longer
          # exists. Should be vanishingly rare in steady state — if it
          # spikes, gameplay code is racing the source destroy path.
          expr: |
            sum by (zone_id) (rate(scene_manager_mirror_source_missing_total[5m])) > 0.01
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Mirror create rejected (source gone) in zone {{ $labels.zone_id }}"
            description: |
              CreateScene with source_scene_id is hitting ErrSourceSceneGone. The
              source instance was destroyed before the mirror request landed.
              Hold a soft "keep-alive" on the source while a mirror is in flight,
              or keep the mirror creator's gameplay state idempotent against this
              error.

        - alert: SceneManagerInstanceDestroyCascadeAnomaly
          # cascade destroys should track explicit/idle destroys roughly 1:N
          # where N is your average mirror-per-source ratio. A ratio
          # exceeding ~10:1 in 5 min suggests cascade is running away (a
          # bug in the mirrors-of-mirrors path, or nodescene_count drift).
          expr: |
            (
              sum by (zone_id) (rate(scene_manager_instance_destroyed_total{reason="cascade"}[5m]))
              /
              (sum by (zone_id) (rate(scene_manager_instance_destroyed_total{reason!="cascade"}[5m])) > 0)
            ) > 10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Cascade destroys >10x non-cascade in zone {{ $labels.zone_id }}"
            description: |
              Cascade is dominant. Either a heavily-mirrored source was destroyed
              (one-shot, OK to silence), or there's a nested-mirror loop. Inspect
              instance_destroyed_total by kind/reason to confirm.

        # --- Deploy / config mistakes --------------------------------------
        - alert: SceneManagerUnknownSceneNodeType
          # Any node label with role="unknown" means a C++ pod published a
          # scene_node_type outside {0,1,2,3} to etcd.
          expr: |
            sum by (zone_id) (scene_manager_nodes_by_role{role="unknown"}) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Zone {{ $labels.zone_id }} has nodes with unknown scene_node_type"
            description: |
              A scene node registered with scene_node_type outside {0,1,2,3}.
              Usually a stale image or a typo in SCENE_NODE_TYPE env. Check pod
              env / game_config.yaml.
            runbook_url: docs/ops/scene-node-role-split.md

    # --- 落点会话身份(docs/design/scene-enter-chain-residuals.md §3、§5)-------
    - name: scene-manager.placement-identity
      rules:
        - alert: SceneManagerPlacementIdentityConflict
          # 代次相等而会话不同:登录代次与会话一一对应(G2)被破坏。正常恒为 0,出现即告警。
          # keep_newer 的速率告警需要上线后的基线定阈值,尚未配置(见 metrics.go placementIdentityTotal 注释)。
          expr: |
            sum by (site, verdict) (increase(scene_manager_placement_identity_total{verdict=~"conflict|keep_conflict"}[10m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "落点会话身份冲突({{ $labels.site }}/{{ $labels.verdict }})"
            description: |
              同一登录代次出现在两个不同会话上(scene-enter-chain-residuals.md §3.2 keep_conflict /
              §5.2 conflict)。enter 侧已拒绝请求(码 25),leave 侧保留了 location 未删。按同期
              scene_manager 的 Error 日志定位玩家与两个会话号,核对 login 的代次铸造(G2)。

    # --- 删 location 绑定持有者释放(docs/design/location-release-binding.md §3.6)-------
    - name: scene-manager.leave-holder-release
      rules:
        - alert: SceneManagerLeaveReleaseForced
          # 等满 LeaveSceneHolderReleaseWaitSeconds 仍拿不到「持有者已释放」证据,按旧行为删了 location。正常恒为 0。
          expr: |
            sum(increase(scene_manager_leave_holder_release_total{verdict="forced"}[10m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "LeaveScene 等不到持有者释放,已强制删除 location"
            description: |
              持有节点在上限内既没写出当前代的 handoff 标记,也没被判定死亡(location-release-binding.md §3.6)。
              常见原因:持有节点对 Redis 的存盘长时间失败、A1′ 开关被关、实体缓存的 owner_epoch 落后于 location。
              强制删除之后持有节点若仍在写,它的存盘会被 owner CAS 拒绝(看 scene 的 [OwnerEpoch]
              stale_owner_rejected_exiting)。按 scene_manager 的 [LeaveRelease] ERROR 日志定位玩家与节点。

    # --- 成员集合对账(docs/design/redis-player-store-cluster.md §5.10,internal/logic/scene_member_reconcile.go)-------
    # 只有领导者跑,计数器按 sum 聚合。redis_player_cluster_contract 的告警用例核对指标名与 outcome 取值。
    - name: scene-manager.scene-member-reconcile
      interval: 30s
      rules:
        # 读 location 或摘成员持续失败:残留的成员摘不掉,实例不销毁、选线躲着它。location 写坏不算(那是 skipped)。
        - alert: SceneManagerSceneMemberReconcileErrors
          expr: |
            sum(increase(scene_manager_scene_member_reconcile_members_total{outcome="error"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "scene_manager 成员集合对账持续失败"
            description: "15 分钟内读 location 或摘成员失败,且持续 15 分钟。location 在玩家域、成员集合在控制域:先看玩家域 Redis 是否可用(deploy/k8s/redis-player-alerts.yaml)。不影响进场主路径,影响的是崩溃残留的成员摘不掉,人数多计、实例不销毁。"

        # 经常摘到残留成员:scene_manager 经常在进场中途崩溃,或有摘成员的路径漏了(设计 §5.10「代价与残余」)。
        - alert: SceneManagerSceneMemberReconcileRemoving
          expr: |
            sum(increase(scene_manager_scene_member_reconcile_members_total{outcome="removed"}[1h])) > 100
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "scene_manager 成员集合对账持续摘除残留成员"
            description: "正常运行时进场与离场各自维护成员集合,对账应当摘不到什么。1 小时摘除超过 100 个且持续 1 小时:查 scene_manager 重启记录,再按设计 §5.10 的入口表核对摘成员的路径。阈值是起步值。"

        # 走完一遍的次数长时间不涨:预算跟不上成员数,或领导者卡住。一遍的时长约 成员总数 ÷ 2000 × 10s(100 万在线约 2.8 小时)。
        - alert: SceneManagerSceneMemberReconcileStalled
          expr: |
            sum(increase(scene_manager_scene_member_reconcile_passes_total[12h])) == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "scene_manager 成员集合对账 12 小时没有走完一遍"
            description: "看领导者是否在换,再看 SceneMemberReconcile.MembersPerRound / ScansPerRound 的预算是否跟不上成员总数。残留成员的摘除因此变慢,不影响进场主路径。"

        # --- 新场景登记(scene_manager_scene_registration_total,go/scene_manager/internal/logic/scene_registration.go)---
        # 新场景的全部 Redis 状态由一段脚本登记。kind 为 instance / world_channel;outcome:
        #   registered  正常;
        #   aborted     EVAL 回错,作废成功,名额已还。Redis 抖动时会有,不单独告警;
        #   conflict    新铸的 scene_id 已有映射或别人的记录,一个键都没写、名额不还;
        #   unknown     作废也失败,结局未知,名额不还(可能多占一份)。
        # 两个告警健康时恒 0:任一次即告警,不设 for。每次登记都给同 zone、同 kind 预建这两条值为 0 的序列,
        # increase() 能看到第一次跳变。代码未编译、未实测。
        - alert: SceneManagerSceneRegistrationConflict
          expr: |
            sum by (zone_id, kind) (increase(scene_manager_scene_registration_total{outcome="conflict"}[10m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "zone {{ $labels.zone_id }} 新场景登记遇到已被占用的 scene_id({{ $labels.kind }},10 分钟内 {{ $value }} 次)"
            description: |
              新铸的 scene_id 在控制域 Redis 里已有 scene:{id}:node 或别的 token 写下的 scene:{id}:registration,登记一个键都没写,
              建实例回 ErrDuplicateScene,铺频道跳过这一个。两种来历:发号器重复发号(worker id 被两个进程同时持有、
              时钟回拨),或这次登记其实已落地、随后场景马上被销毁或改派(死节点收尾),go-redis 的重发或作废查询晚到。
              处置:scene_manager 日志搜 "[SceneRegistration]",拿 scene_id 查 GET scene:{id}:node 与 scene:{id}:registration;
              查发号器(SceneIDGen)的 worker 租约日志。conflict 时不还 Agones 名额,对照 scene_manager_agones_counter_drift。
            runbook_url: docs/design/scene-creation-architecture.md

        - alert: SceneManagerSceneRegistrationUnknown
          expr: |
            sum by (zone_id, kind) (increase(scene_manager_scene_registration_total{outcome="unknown"}[10m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "zone {{ $labels.zone_id }} 新场景登记结局未知({{ $labels.kind }},10 分钟内 {{ $value }} 次)"
            description: |
              登记脚本与作废脚本都回错,不知道登记有没有落地。预占的 Agones 名额没还:登记已落地时空闲回收会按 agones_gs 归还;
              没落地时这份名额一直占着,scene_manager_agones_counter_drift 会显示出来。
              处置:先查控制域 Redis(连接数、慢日志、主从切换、go-zero 熔断日志);scene_manager 日志搜
              "[SceneRegistration] COUNTER DRIFT risk",行里有 scene_id、节点和 GameServer。Redis 恢复后,GET scene:{id}:node
              不存在而 GameServer 的 rooms 计数偏高,就是这一份没还。
            runbook_url: docs/design/scene-creation-architecture.md

    # --- 跨 zone 重定向挑 gate(scene_manager_gate_redirect_*,internal/logic/gate_redirect.go 的 eligibleTargets)---
    # 2026-11-05 起,跨 zone 重定向挑 gate 之前剔除停写与满载的 gate(规则在 go/shared/gatepick,与 login 共用),目标 zone 的
    # 候选全部不合格时回落全集照常挑,只计 fallback。zone_id 是目标 zone;reason 取 gatepick.Reason* 常量 stale / full / mixed。
    # 健康时恒 0,任一次即告警(for: 0m)。计数在第一次计数时才建出序列、没有预置 0 值,increase() 看不到第一次跳变,所以带
    # 第二支 `unless … offset 10m`(新序列),写法同 player-placement-alerts.yaml 的 DbPlacementStoreRejected。
    # severity 用 warning:目标 zone 的 gate 全部停写时,那个 zone 的 login 告警 LoginGatePickFallbackStale(login-alerts.yaml)
    # 会以 critical 响;这一条说明跨区传送也落在了卡住或满载的 gate 上,不重复呼人。
    # 停写只靠本进程读过的历史判(gatepick.RevisionTracker),第一次重定向到某个 zone 时判不出,这一支只会漏报、不会误报。
    # 指标名与 reason 取值由 tools/scripts/tests/gate_pick_alerts_contract.tests.ps1 从源码核对。代码与规则未编译、未实测。
    - name: scene-manager.gate-redirect
      interval: 30s
      rules:
        - alert: SceneManagerGateRedirectFallback
          expr: |
            sum by (zone_id, reason) (increase(scene_manager_gate_redirect_fallback_total[10m])) > 0
            or
            sum by (zone_id, reason) (
              scene_manager_gate_redirect_fallback_total
              unless scene_manager_gate_redirect_fallback_total offset 10m
            ) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "跨 zone 重定向到 zone {{ $labels.zone_id }} 时 gate 全部不合格({{ $labels.reason }}),已回落到全部 gate"
            description: >-
              过去 10 分钟约 {{ $value | printf "%.0f" }} 次跨 zone 重定向发现目标 zone 的 gate 没有一台能接新玩家:
              reason=stale 是全部停写(注册记录的 ModRevision 在本 scene_manager 进程里 30s 以上没变),full 是全部到自报
              max_connections 的 90%,mixed 是两种都有。回落之后照常签票,传送过去的玩家多半连不上或被 gate 拒连。
              stale / mixed:先看目标 zone 的 LoginGatePickFallbackStale 是否同时在响(gate 全卡住,或 gate 写不进 etcd),按那条处置;
              scene_manager 日志搜 "eligibleTargets: gates of zone",行里有停写的 node_id。full:目标 zone 容量不够,
              对照那个 zone 的 LoginGatePickFallbackFull 与 gate 副本数。被剔除的台次看 scene_manager_gate_redirect_excluded_total。
            runbook_url: docs/design/gate-load-balancing-design.md
