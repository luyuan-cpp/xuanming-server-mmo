# Prometheus alert rules for login 挑 gate(2026-11-05 起;11-06 排空并入分档;代码与规则都未编译、未实测)。
#
# 来源:docs/design/gate-load-balancing-design.md「满载与停写的 gate」。login 的三处挑 gate(AssignGate 快路径、排队
# dispatcher、排队取走时的复核)挑之前都给候选分档:完全合格的(没停写、没排空、没到自报上限 90%)优先;没有时退到连得上的
# (排空中或到水位,但没停写);全部停写才退到全部。总会挑出一台,不拒绝,只计 fallback。
# 指标定义(名字与取值以代码为准,本文件只引用;改了要同改,tools/scripts/tests/gate_pick_alerts_contract.tests.ps1 从源码核对):
#   - login(go/login/internal/logic/pkg/loginqueue/gate_eligibility.go,go-zero metric,Namespace "login"、Subsystem "gate_pick"):
#       login_gate_pick_fallback_total{reason=stale|draining|full|mixed}
#         reason 取 go/shared/gatepick/eligibility.go 的 Reason* 常量:stale = 全部停写,退到了全部;draining / full / mixed =
#         没有完全合格的,在连得上的里挑,那些 gate 全在排空 / 全到水位 / 两种都有
#       login_gate_pick_excluded_total{reason=stale|draining|full}   每次挑每台被剔除的 gate 计一次(回落时被用上的不计);
#         剔除说明分档在起作用,一般不告警;只有 reason=stale 持续超过租约时长才告警(login.gate-health 组)
#   - login 排队取走时的复核(go/login/internal/logic/pkg/loginqueue/admit_recheck.go,Namespace "login_queue"):
#       login_queue_admit_gate_recheck_total{outcome=kept|gone|stale|draining|full|unchecked}
#         unchecked = 读不到此刻的候选,照签放行时选定的 gate;持续出现才告警(login.gate-health 组)
#   - login 排队的区容量(2026-11-10 起,组 login.queue-capacity;go/login/internal/logic/pkg/loginqueue/metrics.go,Namespace
#     "login_queue"):login_queue_capacity{zone} 是 FreeSlots 实际用的容量(配置值再按本区在接客的 gate 到水位的承载封顶,
#     capacity.go 的 capByGates),login_queue_configured_capacity{zone} 是区服目录的 zone_config.capacity(经 etcd 发布给
#     本区 login,0 = 读不到区服策略)。
#     两者都是 gauge,每次算容量时写;排队关着时不算容量,没有序列,这组规则不响。
#
# Install as a PrometheusRule CR (kube-prometheus stack),与 owner-epoch-alerts.yaml 同法:
#   kubectl apply -n observability -f deploy/k8s/login-alerts.yaml
#
# Scrape prerequisites:
#   - login ConfigMap 的 Prometheus 段(Port 9101)、Pod 模板的 prometheus.io/* 注解与容器 metrics 端口三处一致
#     (k8s_deploy.ps1 恒写,tools/scripts/tests/login_metrics_contract.tests.ps1 钉住);集群要有按注解抓取的 job,
#     或指向 9101 的 PodMonitor。前提不满足时这些告警是哑的(同 scene-manager-alerts.yaml)。
#   - 规则按 namespace 聚合(一个 zone 一个 namespace),用的是抓取时附加的 namespace 标签(PodMonitor 默认附加;
#     按注解抓取的 job 要在 relabel 里把 __meta_kubernetes_namespace 写成 namespace,标签名不同就同改本文件)。
#
# 口径:
#   - fallback 健康时恒 0,任一次即告警,不设 for(for: 0m)。go-zero 的计数在第一次 Inc 时才建出序列,没有预置 0 值,
#     increase() 看不到序列从「不存在」到 1 的第一次跳变,所以每条规则带第二支 `unless … offset 10m`(新序列),
#     写法同 player-placement-alerts.yaml 的 DbPlacementStoreRejected;第二支带 `> 0`,不会因新 Pod 误报。
#   - stale 是 critical:本 zone 一台连得上的 gate 都不剩,新登录多半连不上 gate(gate 全卡住),或者 gate 全都写不进
#     etcd(etcd 写满 / 不可写);要马上有人看。
#   - draining / full / mixed 是 warning:玩家还能被分到连得上的 gate。draining 多半是整个 zone 都被标了排空(误操作,
#     或缩容时副本数算错);full 是有人没经过区级准入就来了:排队的区容量已按 gate 到水位的承载封顶(2026-11-10 起),
#     排队开着时只剩重连豁免与人数上报滞后,排队关着时快速通道不判容量,gate 按 GateMaxConnections 拒连兜底;
#     mixed 是两种都有。
#   - LoginQueueCapacityLimitedByGates 是 warning、for 10m:gate 台数装不下配置的区容量,排队会比配置的早开始拦人。
#     不会断线、不会多放,只是容量规划与实际不符;按 namespace、zone 取各副本的最小值比较。
#   - login 自己的视图出问题不会造成「全部停写」:镜像跟不上 etcd 时读路径回落直读,直读不判停写(node_cache.go 的 cacheStaleAfter)。
#   - 没有实测基线(代码未压测),首轮演练后回头校准。
#
# Severity conventions(与 scene-manager-alerts.yaml 相同):
#   critical = pager, someone wakes up
#   warning  = next-business-hours channel
#   info     = dashboard annotation / trend signal
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: login-alerts
  labels:
    app: login
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: login.gate-pick
      interval: 30s
      rules:
        # 本 zone 的 gate 全部停写:挑 gate 退到全部候选,分出去的票大概率落在卡住的 gate 上。
        - alert: LoginGatePickFallbackStale
          expr: |
            sum by (namespace) (increase(login_gate_pick_fallback_total{reason="stale"}[10m])) > 0
            or
            sum by (namespace) (
              login_gate_pick_fallback_total{reason="stale"}
              unless login_gate_pick_fallback_total{reason="stale"} offset 10m
            ) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 的 gate 全部停写,login 挑 gate 已退到全部 gate"
            description: >-
              过去 10 分钟约 {{ $value | printf "%.0f" }} 次挑 gate(AssignGate 快路径每请求一次、排队 dispatcher 每拍一次、排队取走复核每次一次)
              发现本 zone 一台连得上的 gate 都没有:每台 gate 的注册记录都已三个上报周期(30s)没被重写。退到全部之后照常签票,
              票多半落在卡住的 gate 上,玩家连不上。先分辨是 gate 卡住还是 gate 写不进 etcd:看这个 zone 的 gate Pod 是否还在处理连接
              (gate 日志、存活探针、CPU),再查 etcd(etcdctl endpoint status 的 DB 大小与 alarm list 里的 NOSPACE、写延迟)。
              login 日志搜 "[GateSelect] no gate candidate is fully eligible";停写的 node_id 在之前的 "[GateSelect] gates left out of the pick" 行里。
            runbook_url: docs/design/gate-load-balancing-design.md

        # 本 zone 没有完全合格的 gate,但还有连得上的:全在排空、全到水位,或两种都有。
        - alert: LoginGatePickFallbackDegraded
          expr: |
            sum by (namespace, reason) (increase(login_gate_pick_fallback_total{reason=~"draining|full|mixed"}[10m])) > 0
            or
            sum by (namespace, reason) (
              login_gate_pick_fallback_total{reason=~"draining|full|mixed"}
              unless login_gate_pick_fallback_total{reason=~"draining|full|mixed"} offset 10m
            ) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 没有完全合格的 gate({{ $labels.reason }}),login 挑 gate 退到了连得上的 gate"
            description: >-
              过去 10 分钟约 {{ $value | printf "%.0f" }} 次挑 gate 时本 zone 没有一台 gate 既没排空、又没到自报 max_connections 的 90%,
              只能在连得上的里挑(停写的 gate 照样剔掉)。reason=draining:连得上的 gate 全被标了排空,多半是整个 zone 被误标,
              或缩容时剩下的副本也被标了,查 gate:<id>:draining 与 tools/scripts/k8s_gate_drain.ps1 的执行记录;
              reason=full:全到水位。排队的区容量已按 gate 到水位的承载封顶,排队开着时走到这里只剩重连豁免与人数上报滞后;
              排队关着时快速通道不判容量,人数超过 gate 承载就会走到这里。持续出现就扩 gate 副本,排队开着时一并看
              LoginQueueCapacityLimitedByGates;
              reason=mixed:两种都有,按上面两条分别查。被剔除的台次看 login_gate_pick_excluded_total。
            runbook_url: docs/design/gate-load-balancing-design.md

    # 区容量被 gate 承载压低(2026-11-10 起):区服目录的 zone_config.capacity 够不着,排队会比目录写的早开始拦人。
    - name: login.queue-capacity
      interval: 30s
      rules:
        - alert: LoginQueueCapacityLimitedByGates
          expr: |
            min by (namespace, zone) (login_queue_capacity)
              < min by (namespace, zone) (login_queue_configured_capacity)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} zone {{ $labels.zone }} 的排队容量被 gate 承载压到了配置值以下"
            description: >-
              login 排队实际用的区容量(login_queue_capacity,当前 {{ $value | printf "%.0f" }})比区服目录的
              zone_config.capacity(login_queue_configured_capacity)小:本区在接客的 gate 到自报 max_connections 的 90%
              一共只装得下这么多人,排队到这里就开始拦人,不会再放出连上 gate 才被拒的票。不断线、不多放,是容量规划与实际不符:
              gate 副本比配置的容量需要的少(每台 GateMaxConnections 20000 到水位 18000,配 45000 至少要 3 台),或有 gate
              停写、被标了排空、挂了。扩 gate 副本,或经 PUT /admin/zones/<id> 把 zone_config.capacity 调到 gate 承载以内;
              login 日志搜 "admission capacity is limited by its gates" 看当时的两个数与 gate 台数。
            runbook_url: docs/design/login-queue-2026-05.md

    # gate 健康(2026-11-11 起):两条都不影响挑 gate 本身,只说明有 gate 或复核出了持续的问题。
    # 都按「持续」判(for > 0):go-zero 计数没有预置 0 值序列,第一次 Inc 被 increase() 漏看只会晚一拍,
    # 持续的条件照样成立,所以不带回落规则那样的「新序列」分支。
    - name: login.gate-health
      interval: 30s
      rules:
        # 停写的 gate 超过租约时长仍在 etcd 里:卡住了却没下线,它上面的玩家多半也卡住了。
        - alert: LoginGateStaleExcludedSustained
          expr: |
            sum by (namespace) (increase(login_gate_pick_excluded_total{reason="stale"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 有 gate 停写超过 5 分钟仍在 etcd 里,login 一直在剔除它"
            description: >-
              连续 5 分钟,每个 5 分钟窗口里 login 挑 gate 时都有 gate 因注册记录三个上报周期(30s)没被重写而被剔出候选。
              gate 的注册记录挂在 etcd 租约上,进程死掉后租约到期(NodeTTL,默认 180s)记录就会消失;超过 5 分钟还在被剔除,
              说明那台 gate 的事件循环卡住了而续约还在,或者它写不进 etcd。新玩家已经不会被分过去,但连在它上面的玩家多半卡住了。
              按 login 日志 "[GateSelect] gates left out of the pick" 行里的 node_id 找到那台 gate:看存活探针、CPU 与日志是否还在推进,
              卡住就重启它;gate 本身正常时查 etcd 的写延迟与 alarm list。只有有人登录时才计数,没人登录时这条不会响。
            runbook_url: docs/design/gate-load-balancing-design.md

        # 排队取走时的复核持续读不到候选:照签放行时选定的 gate,不再复核它此刻是否停写、排空或满载。
        - alert: LoginQueueAdmitRecheckBlind
          expr: |
            sum by (namespace) (increase(login_queue_admit_gate_recheck_total{outcome="unchecked"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 排队取走放行时持续读不到 gate 候选,复核在空转"
            description: >-
              连续 10 分钟,每个 10 分钟窗口里都有排队玩家取走放行时 login 读不到本 zone 此刻的 gate 候选(读取出错或一台都没有),
              只能照签放行时选定的 gate。复核本身不拦人,但放行到取走之间选定的 gate 停写、被排空或满载时,玩家会拿到连不上的票。
              查 login 到 etcd 的连通性(login_gate_directory_reads_total 的 etcd_stale 是否在涨)与本 zone 的 gate 是否都已下线;
              login 日志搜 "consume-time gate recheck skipped"。
            runbook_url: docs/design/gate-load-balancing-design.md
