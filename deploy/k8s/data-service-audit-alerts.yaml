# Prometheus alert rules for data_service 的全球审计管道(player_snapshot / transaction_log 两条 Kafka 落库消费者)。
#
# 来源:G2a 快照审计管道扩容(go/data_service/internal/kafka;处置流程见 docs/ops/audit-topic-generation-bump-runbook.md)。
#
# Install as a PrometheusRule CR (kube-prometheus stack),与 owner-epoch-alerts.yaml 同法:
#   kubectl apply -n observability -f deploy/k8s/data-service-audit-alerts.yaml
#
# Scrape prerequisites:
#   - data_service 的 MetricsListenAddr 已配置(K8s ConfigMap 固定 ":9260",本地同)。
#   - A ServiceMonitor or PodMonitor pointed at that port.
#   - Kafka.LagProbeIntervalMs > 0(服务 yaml 默认 30000):不开探针,lag / lag_max_partition / retention_gap 三个 gauge 不出数,
#     下面的积压与保留期告警全部是哑的(DataServiceAuditLagProbeBlind 也抓不到 —— 没有失败计数)。
#   - ServiceMonitor / PodMonitor 的抓取间隔 ≤ Kafka.LagProbeIntervalMs(服务 yaml 与 ConfigMap 现为 30000):DataServiceAuditRetentionGap
#     对单轮探针采到的缺口就要响,抓取更稀时只保持一轮探针的正值可能一个样本都抓不到(见该规则注释与 runbook §7 演练第 ① 步;
#     监控栈不在本仓,取值未核实)。
#   - data_service 须是带 lag_max_partition_messages 指标的版本(2026-10-13 G2a 评审修复起):规则先于新版本 apply 时
#     DataServiceAuditLagHigh 没有数据、是哑的。
#
# 所有实例消费同一个消费组,lag / lag_max_partition / retention_gap 是 broker 视角的组级数值,每个实例报同一个数,一律取 max。
# 例外:某个实例探针失败时它的 gauge 保留上一次的值(陈值),照样参与 max —— 由按实例触发的 DataServiceAuditLagProbeBlind 点名。
#
# C++ 生产端的发送失败(快照超过约 1MB 在 produce() 本地被拒、broker 不可达)不在 Prometheus:scene 没有指标端点。
# 值班固定查询(Loki):{job="cpp_nodes", service="scene"} |= "[SnapshotSystem] Kafka send failed"。
# C++ 日志流没有 app 标签,写成 {app="scene"} 恒为空;选择器写法见 player-inbox-alerts.yaml,
# 契约测试 k8s_deploy_contract.tests.ps1「LogQL 契约」核对这一条。
#
# Severity conventions(与 scene-manager-alerts.yaml 相同):
#   critical = pager, someone wakes up
#   warning  = next-business-hours channel
#   info     = dashboard annotation / trend signal
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: data-service-audit-alerts
  labels:
    app: data-service
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: data-service.audit-pipeline
      interval: 30s
      rules:
        # 消费循环停了(DB 故障停机 / 从未起来)。用 10 分钟均值而不是 `== 0 for`:
        # DB 持续故障时 up 每 ResumeAfter(60s)翻一次 0→1→0(supervisor 重建 → 再次停机),`for` 会被打断而永不触发。
        # for: 2m —— 均值表达式在 DB 持续故障时恒为真,这里的 for 不会被 up 的翻动打断,只用来滤掉新 Pod 首个样本为 0 的启动窗口
        # (两条 up 序列在第一次 EnsureTopics 之前就按 0 预注册;窗口里只有这一个样本时均值就是 0);
        # Kafka 长时间不可达导致消费者从未起来时 2 分钟后照常触发。
        - alert: DataServiceAuditConsumerStopped
          expr: |
            avg_over_time(data_service_kafka_consumer_up[10m]) < 0.5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "data_service 审计消费者 {{ $labels.consumer }} 大部分时间没在跑"
            description: >-
              {{ $labels.instance }} 上 {{ $labels.consumer }} 过去 10 分钟 up 均值 {{ $value | printf "%.2f" }}。
              查 data_service 日志的 `STOPPED:` 行(点名了哪个 guid / 哪批、哪个 offset 没提交)与 `consumers not started`;
              DB 故障先修库,消费者会在冷却后从断点自动续消费(宁可积压不丢)。积压期间盯住 DataServiceAuditRetentionGap。

        # 保留期已经删掉了还没消费的审计消息:**数据已丢**。所有实例报同一个组的值,按 consumer 取 max(与本文件其它规则一致;
        # 单个实例探针失明留下的陈值由按实例触发的 DataServiceAuditLagProbeBlind 点名)。
        # 丢数据类告警对任何一次出现都要响(负责人 2026-10-15 拍板):对 gauge 取窗口最大值、for: 0m,不再等缺口持续。
        # 以前的 `for: 2m` 下,缺口存续不足 2 分钟(删除发生在 STOPPED 冷却后重建前不久,重建后一提交 gauge 就归零)时不响,只剩日志。
        # 窗口取 15m,依据如下(待压测 / 故障演练确认,做法见 runbook §7):
        #   - 下限 = 规则评估间隔 + 探针间隔:被抓到的正值样本至少要落进一次规则评估的回看范围(需 ≥ 评估间隔,外加抓取写入的延迟),
        #     再加一个探针间隔,吸收探针、抓取、评估三者相位不同步的余量。本组 interval 30s;探针 Kafka.LagProbeIntervalMs 在服务 yaml
        #     与 K8s ConfigMap 里取 30000(30s),可配范围 [5000, 600000]ms,上限 10 分钟时下限约 10.5 分钟,15m 在整个可配范围内都满足。
        #   - 窗口同时决定缺口消失后告警还保持 firing 多久(约 15 分钟)。它要长于 Alertmanager 的 group_wait 与 group_interval
        #     (默认 30s / 5m,凭记忆、未核实;本仓不含 Alertmanager 配置):在 Alertmanager 下一次发送之前就 resolve 的告警可能不发通知。
        #   - 与本文件另一条「任何一次出现就响」的规则 DataServiceAuditMessagesSkipped 的 [15m] 一致。
        # 前提:抓取间隔 ≤ LagProbeIntervalMs(ServiceMonitor 不在本仓,取值未核实),否则只保持一轮探针的正值可能一个样本都没被抓到。
        # 代价:
        #   - gauge 为正而实际没丢(日志条数为 0)的情形不再被 for 滤掉,也会呼叫。分两种,那一刻积压都已经在删除线上,
        #     一律按丢数据处置,用下面的日志确认条数:
        #     ① 瞬时:探针先读 committed 后读 start,消费者正读着分区里最老的段、该段恰在探针两次读之间被删(消费者其实已越过它),
        #        只有一轮探针为正。
        #     ② 更常见:消费者已读入、尚未提交的消息所在的段被删。读入在前、落库后才提交,读入未提交的量 = kafka-go Reader 的预取队列
        #        (两个消费者共用的 newReader 未设 QueueCapacity,v0.4.47 默认 100 条,由本实例分到的各分区共用)+ 正在攒 / 落库的批
        #        (player_snapshot 另有分区 worker 通道)+ 当前 fetch 响应的剩余部分。gauge 一直为正,直到下一次提交越过日志起点,可持续多轮探针(库慢时数秒到数分钟);
        #        kafka-go 的 reader 位点在被删段之后,既不打 skipping 行、也不重新定位(没有 starting / seeking 两行),日志条数为 0。
        #        消费者随后照常落库提交就没丢;提交之前停机 / 重建时,其中没落库的才真丢,看那次重建的 starting / seeking 两行。
        #   - 消费者越过缺口并提交后 gauge 自行归零,告警还会再挂约 15 分钟;resolve 只说明窗口里不再有正值,不代表数据找回。
        # 仍会漏的:缺口整段落在两次探针之间(短于一个探针间隔;多实例各自探测、相位不同时采样更密,但不保证)时 gauge 从未为正,
        # 本告警无从触发,只剩日志 —— 所以积压事故收尾时不论告警响没响都按下面的口径 grep 一遍。
        # 「丢了多少」以日志为准,不以 gauge 为准。日志口径(kafka-go v0.4.47,已按 tag 源码核对;data_service 日志前缀 `[kafka-go]`):
        #   - 消费者运行中被保留期追上:`skipping from offset X to Y (N messages)` 行,N 是精确条数;
        #   - 分区 reader (重新)初始化时(进程重启 / STOPPED 冷却后重建 / rebalance / 断线重连)kafka-go **静默**跳到日志起点,没有上面那一行,
        #     看同一分区的 `starting at offset A` 与 `seeking to offset B` 两行(A 非负且 B > A 时,B − A 即被跳过的条数)。
        - alert: DataServiceAuditRetentionGap
          expr: |
            max by (consumer) (max_over_time(data_service_kafka_consumer_retention_gap_messages[15m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "审计 topic 的保留期删掉了 {{ $labels.consumer }} 还没消费的消息(审计数据已丢)"
            description: >-
              过去 15 分钟探针采到的缺口最大约 {{ $value | printf "%.0f" }} 条:这些未消费消息已被 broker 的 retention
              (retention.ms 或每分区 retention.bytes)删除(采样值,是下界;data_service 日志里另有 `AUDIT DATA LOST` 行)。
              本告警对任何一次采到的缺口都响,缺口消失后还会保持约 15 分钟,resolve 不代表数据找回。
              精确条数在 data_service 日志里 grep `[kafka-go]`:
              消费者运行中被追上时是 `skipping from offset X to Y (N messages)` 行;消费者停机 / 重启 / rebalance 后重建时
              kafka-go 静默跳到日志起点,没有那一行,看同一分区的 `starting at offset A` 与 `seeking to offset B` 两行
              (A 非负且 B 大于 A 时,两者之差即丢失条数)。
              积压收尾时日志条数仍为 0,多为消费者已读入、尚未提交的消息所在段被删(没丢,但积压已在删除线上;见 runbook §7)。
              记录条数与时间段上报回档负责人。根因通常是积压超过了审计 topic 每分区的 retention.bytes
              (prod / prod-like 4GiB,按扛住 2 小时消费中断定;dev 128MiB),见 runbook「保留期与积压」一节。

        # 积压。比的是**单分区最大积压**(lag_max_partition_messages),不是全部分区合计(lag_messages):broker 的 retention.bytes
        # 按分区执行,积压集中在少数分区时(持有它的实例卡住 / 毒丸行卡住所在分区,G2a 规格 Q-3)合计还远没到线,那个分区已经开始被删。
        # 阈值与 for 必须按「离删除线还有多少**时间**」定,不能按条数拍:
        #   单分区删除线(条)≈ 审计 topic 的 retention.bytes ÷ 平均快照字节,与分区数无关(各分区均匀积压时合计约为它的 P 倍)。
        #   审计 topic 的 retention.bytes 2026-11-11 定为 4GiB(缺口清单第 3 条,k8s_deploy.ps1 的 Apply-KafkaProfileDefaults,
        #   prod 与 prod-like 同值;推导见 deploy/k8s/README.md「审计 topic 的 retention.bytes」)。快照大小按保守的 300KB 算,
        #   删除线约 4GiB ÷ 300KB ≈ 14000 条,取 30% ≈ 4200 → 4000 条、for 2m(retention.check.interval 为 2 分钟)。
        #   快照实际只有 15KB 时删除线约 28 万条,本阈值会早早响(按 15KB、单分区约 33 条/s 算,积压约 2 分钟就到 4000 条),偏早不偏晚。
        #   拿到实测快照大小(message_bytes)后按 runbook §4 的公式重算并在这里写明出处;阈值按单分区计,扩分区本身不用重算。
        #   改审计 topic 的 retention.bytes 时同步改本阈值(dev 档沿用 broker 缺省 128MiB,本规则不按 dev 定)。
        - alert: DataServiceAuditLagHigh
          expr: |
            max by (consumer) (data_service_kafka_consumer_lag_max_partition_messages{consumer="player_snapshot"}) > 4000
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "player_snapshot 单分区最大积压 {{ $value | printf \"%.0f\" }} 条,逼近保留期删除线"
            description: >-
              某个分区的积压已超过单分区删除线估算值的 30%(retention.bytes 按分区执行,哪个分区先到线就先删哪个)。
              先看 DataServiceAuditFlushSlow / ConsumerStopped 判断是库慢还是消费者停了;再对照合计积压
              `data_service_kafka_consumer_lag_messages`:与本值接近 = 积压集中在一个分区(持有它的实例卡住或毒丸行),
              相差约分区数倍 = 各分区均匀积压。库慢时按 runbook 调批量与并发(需负责人确认),积压不收敛时准备离线换代扩分区。
              每多一分钟,保留期删掉未消费快照(审计数据丢失)的风险就更近一分。

        - alert: DataServiceTxLogLagHigh
          expr: |
            max by (consumer) (data_service_kafka_consumer_lag_messages{consumer="transaction_log"}) > 100000
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "transaction_log 积压 {{ $value | printf \"%.0f\" }} 条且持续 15 分钟"
            description: >-
              流水消费者落后。流水单条很小,删除线远比快照远,但同样会被每分区 retention.bytes 删。
              查 data_service 日志 `[transaction_log] STOPPED:` 与 flush_seconds{consumer="transaction_log"}。

        # 消费组卡住(r2-kc#1;2026-11-06 评审跟进改判据):某个分区上组内已提交位点停下之后又新到了消息,而位点 15 分钟没再前进,
        # 且至少一个实例的消费循环报 up。上面两条积压规则按删除线定阈值,流量低时积压很久到不了线;本条专抓「活着但不前进」。
        # data_service_kafka_consumer_commit_stall_seconds 由 lag 探针跨轮按分区算(kafkautil.CommitStall,RequireArrivals):
        # 位点一动、或积压清零即从头计。只认「新到的消息没被提交」:reader 模式提交失败时把已落库的记录交还 Kafka、本代次内不再重投,
        # 低流量 topic 上这几条会一直挂着积压(数据其实已落库),直到同分区来了新消息被一并提交或下一代次重投 ——
        # 旧判据「有积压 + 15 分钟零处理」在这段时间里误报,而改成「有积压 + 位点不动」同样会误报,所以要求有新消息到达。
        # 代价:一个分区上一条新消息都不来时卡住看不见(积压不再增长;保留期删数据另由 DataServiceAuditRetentionGap 兜)。
        # 按分区算:多实例里只有一个实例卡住、其余照常前进时也会响(旧判据只抓整组停摆)。
        # 消费组 owner(go/shared/kafkautil 的 BoundConsumerGroup)遇再均衡与暂时失败不停:代次还在就原地重试,代次结束就交还重投;
        # 它真 HOLD 时 data_service 主循环收到 owner 错误后退出进程、由编排重启。所以本条多半是:
        # 协调者长期不可达(一直等不到代次)、分区 leader 长期不可读、批处理卡在同一批上,或落库成功而提交一直失败。
        # 消费循环反复 STOPPED 时 up 来回翻,for 5m 被打断,由 DataServiceAuditConsumerStopped 报。
        - alert: DataServiceAuditConsumerStalled
          expr: |
            max by (consumer) (data_service_kafka_consumer_commit_stall_seconds) >= 900
            and on (consumer)
            max by (consumer) (data_service_kafka_consumer_up) == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.consumer }} 有分区新到的消息 {{ $value | humanizeDuration }} 没被提交,消费循环却在跑"
            description: >-
              某个分区上组内已提交位点停下之后又来了新消息,位点一直没再前进,而消费循环报 up:消费者活着但不前进。
              查 data_service 日志 `[kafka-bound]` 行(等不到代次 / 打开分区或拉取失败的原因与重试间隔)与 `[kafka-go]` 行;
              指标 kafka_bound_consumer_retry_total 按 stage 看卡在哪一步(join / open / fetch / commit)。
              Kafka 侧故障修好后消费者自动追上,不需要重启。积压期间盯住 DataServiceAuditRetentionGap。

        # 探针失明(按实例):某个实例 15 分钟内一次都没探成、且有失败:它的 lag / lag_max_partition / retention_gap 是陈值
        # (探测失败时 gauge 保留上一次的值),而陈值照样参与上面几条告警的 max;所有实例都如此时积压类告警全部不可信。
        # 按 (consumer, instance) 聚合才点得到单个失明的实例;全部实例失明时是每实例一条 warning,由 Alertmanager 按 alertname 分组。
        - alert: DataServiceAuditLagProbeBlind
          expr: |
            sum by (consumer, instance) (increase(data_service_kafka_consumer_lag_probe_total{result="ok"}[15m])) == 0
            and
            sum by (consumer, instance) (increase(data_service_kafka_consumer_lag_probe_total{result="error"}[15m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} 上 {{ $labels.consumer }} 的 lag 探针 15 分钟没有成功过"
            description: >-
              该实例的 lag / lag_max_partition / retention_gap 是陈值。DataServiceAuditLagHigh / DataServiceTxLogLagHigh /
              DataServiceAuditRetentionGap 若同时在响,先把对应指标(`data_service_kafka_consumer_lag_max_partition_messages` /
              `data_service_kafka_consumer_lag_messages` / `data_service_kafka_consumer_retention_gap_messages`)按 instance 展开:
              只有它偏高即为陈值。所有实例都在报本告警时,积压与保留期丢失告警此刻都不可信。
              查该实例 data_service 日志 `lag probe failed` / `lag probe cannot connect`
              (broker 不可达、消费组 offset 拉取失败、或 committed 越过 log end = topic 被删了重建;
              或 topic 不存在:日志含 `does not exist on this broker`,lag 探针自 2026-10-15 起不再自动建 topic,
              先 `kafka-topics.sh --describe` 核对,见 audit-topic-generation-bump-runbook.md §2.7 末补注)。

        # 落库变慢:单次 DB 尝试 p99 > 2s 持续 15 分钟(全局库开始排队的早期信号)。
        # flush_seconds 只计单次 DB 尝试,不含本实例的落库名额排队与重试退避,所以它慢 = 库慢。
        - alert: DataServiceAuditFlushSlow
          expr: |
            histogram_quantile(0.99, sum by (le, consumer) (rate(data_service_kafka_consumer_flush_seconds_bucket{result="ok"}[5m]))) > 2
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.consumer }} 单次落库 p99 {{ $value | printf \"%.2f\" }}s"
            description: >-
              全局库(SnapshotMySQL)开始排队:审计写与建角同步路径(名字登记、号段)共用这台实例的 CPU / IO。
              先确认 Threads_running / fsync 速率;审计是唯一能慢下来而不伤玩家的一方,但只有在保留期足够长(Q-1)时才安全,
              见 runbook「全局库成瓶颈时」一节。

        # 被跳过的坏消息(解不出 / 主键为 0 / 超 MEDIUMBLOB):这些审计记录不会落库。序列由 PrimeKafkaConsumer 预置为 0。
        - alert: DataServiceAuditMessagesSkipped
          expr: |
            sum by (consumer, outcome) (increase(data_service_kafka_consumer_messages_total{outcome=~"decode_error|invalid|oversize"}[15m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.consumer }} 跳过了 {{ $value | printf \"%.0f\" }} 条坏消息({{ $labels.outcome }})"
            description: >-
              这些消息被判为坏消息(解不出 / 主键为 0 / 超 MEDIUMBLOB),不会落库。计数在解码(进批)时记,不等提交:
              所在的批因 DB 故障没落成时(transaction_log 一直攒批,整批不提交;批量模式的 player_snapshot 只提交失败行之前的前缀),
              这条坏消息可能并没有被提交,消费者每次重建(约 60s)重放都会再记一次、再打一条 skipped 日志 ——
              DataServiceAuditConsumerStopped 同时在响时,条数以日志里去重后的 partition / offset 为准。
              data_service 日志里有逐条的 `undecodable` / `invalid snapshot` / `oversize snapshot` 行(带 partition / offset)。
              持续出现 = 生产端(C++ scene)的消息格式或大小出了问题。

        # 批量失败、逐条兜底成功:批本身有问题(多半是包 / 事务大小),趋势信号。
        - alert: DataServiceAuditBatchIsolated
          expr: |
            sum by (consumer) (increase(data_service_kafka_consumer_isolation_total{result="recovered"}[1h])) > 0
          for: 0m
          labels:
            severity: info
          annotations:
            summary: "{{ $labels.consumer }} 的批量落库失败后逐条兜底成功"
            description: >-
              过去 1 小时批量语句失败、逐条重试全部成功(数据没丢,只是变慢)。看日志 `retrying row by row to isolate` 那行的错误:
              包过大(1153)/ 事务过大(TiDB 8004)时调小 Kafka.SnapshotBatchMaxBytes 或 SnapshotBatchMaxRows。
              兜底也失败时消费者会停机,走 DataServiceAuditConsumerStopped。

        # 审计表清理持续失败:player_snapshot、transaction_log 会一直涨。
        - alert: DataServiceAuditRetentionFailing
          expr: |
            sum by (table) (increase(data_service_audit_retention_failures_total[1h])) > 0
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "审计表 {{ $labels.table }} 的清理持续失败"
            description: "看日志 [AuditRetention]。过期行下一轮还在,数据不会错,只是表和磁盘在涨。"
