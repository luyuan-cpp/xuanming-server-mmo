# Prometheus alert rules for D1 玩家归属与落点映射持久化(data_service 对账 leader、就绪标记、三个读方门禁与 W1 建角登记 / 发布)。
#
# 来源:docs/handoff/launch-readiness-20261013/spec_D1_batch1b2_2_3.md §7 第 2 条、§13.1 第 6 / 8 / 9 条、§13.4 第 2 条
#       (第 1b-3 批;设计结论并入 docs/design/player-route-mapping-durability-proposal.md §13 之前以该规格为准)。
# 指标定义(名字以代码为准,本文件只引用):
#   - data_service 对账 leader(go/data_service/internal/metrics,第 1b-2 批):
#       data_service_route_reconcile_leader        gauge 0/1,每个装配了 reconciler 的副本恒导出(不删)
#       data_service_route_reconcile_assembled     gauge,装配即 1(RouteStore.Mode=db_first 且 Reconcile.Enabled≠false 的每个副本)
#       data_service_route_reconcile_arm_enabled   gauge 0/1,每个装配副本恒导出 RouteStore.Reconcile.ArmReadyMarker
#       data_service_route_ready_marker / data_service_route_writable / data_service_route_cache_verified_age_seconds /
#       data_service_route_ready_selfcheck{verdict}
#                                                  leader 观测型 gauge:**只有现任 leader 导出**,掉主时删掉序列
#       data_service_route_reconcile_tick_total{result} / _event_total{event} / _push_total{phase,result} / _mirror_total{result}
#                                                  计数器,event / result 的全部取值启动时以 0 预置(increase 抓得到第一次)
#   - W1 写入(第 1a 批,只在 RouteStore.Mode=db_first 时有数,PrimeRoute 以 0 预置全部取值):
#       data_service_route_register_total{outcome}(每次 db_first 建角登记恰好计一次)、data_service_route_publish_total{result}(每次发布的最终结果)
#   - 读方(第 3 批,开关缺省 false,只有打开后才有序列):
#       go/db:db_route_ready_verdict_total{verdict}(每次选库一条)
#       data_service:data_service_route_read_total{path,result}、data_service_route_ready_verdict_total{verdict}
#       两个读方的 verdict 取值相同:placement 的 7 个结论(shared/placement.RouteReadyVerdictNames)加 script_error(读脚本执行失败)
#
# Install as a PrometheusRule CR (kube-prometheus stack),与 owner-epoch-alerts.yaml 同法:
#   kubectl apply -n observability -f deploy/k8s/data-service-route-alerts.yaml
#
# Scrape prerequisites(**P2 门禁的一项,未满足时下面全部是哑的**):
#   - 仓库里 data-service 只有 Prometheus 注解(manifests/go-svc/data-service.yaml 的 prometheus.io/scrape|port|path,端口 9260 =
#     ConfigMap 的 MetricsListenAddr ":9260"),**没有 ServiceMonitor / PodMonitor**;go/db(:9160)同理。
#     接入哪种抓取方式(ServiceMonitor / PodMonitor,或按注解抓取的 job)要在切 RouteStore.Mode=db_first(规格 §8 P2)之前定下来并验证有数。
#   - 规则不按 namespace 分组的那几条(leader、标记、writable、事件)是**全服一个**的口径:所有 zone 的 data_service 共用同一个全局库
#     (route_reconcile 那一行租约)与同一个 mapping Redis,全服同一时刻只有一个 leader。按 namespace 拆开会把「别的 zone 是 leader」误报成没有 leader。
#   - 读方的规则按 namespace 分组(一个 zone 一个 namespace),用的是 ServiceMonitor / PodMonitor 默认附加的
#     namespace 标签;改用按注解抓取的 job 时 relabel 必须同样写出它。
#
# 口径:
#   - 「告警按 leader 过滤」(规格 §4.2 VERDICT should):leader 观测型 gauge 只有现任 leader 导出,所以对它们取 min / max 就是取 leader 的值,
#     不会被非 leader 副本的 0 污染;前任 leader 掉主时序列被删,旧值 1 不会掩盖真缺标记。缺序列(没有 leader)时由 NoLeader 报,
#     ReadyMissing 用 `or vector(0)` 把缺序列当成「标记不在」。
#   - Arm 是**全服单值**(规格 §13.1 第 6 条):tools/scripts/k8s_deploy.ps1 的 -RouteReconcileArm 对每个 zone 渲染同一值,
#     粘滞核对读全部 zone 的线上 ConfigMap;滚动切换的窗口里会短暂出现两种取值,超过 15 分钟由 ArmMixed 报。
#   - 只进看板、不设告警:tick_total(按 result 看每拍结论)、mirror_total、event 里的 marker_armed / marker_dropped_identity /
#     marker_dropped_eviction / marker_dropped_malformed / marker_dropped_disarmed / task_started / task_completed / task_aborted、
#     selfcheck 的分布;route_register_total 除 store_error / precheck_error 以外的 outcome(含业务冲突 conflict / precheck_conflict)、
#     route_publish_total 除 not_durable / error 以外的 result(conflict / legacy_conflict 是否单独告警待负责人定,
#     leader 推送侧的同类冲突由 DataServiceRoutePushConflicts 报)。
#     marker_dropped_disarmed 是回退第 2 步(Arm=false)的确认信号(规格 §13.5 第 1 条),回退时去看板核对它,不靠告警。
#   - 全量预热(rewarm 之后、空实例重启之后)在 S3 规模下要数小时(规格 §12 第 3 条):这期间 ReadyMissing 与 CacheVerifyStale 会响,
#     是预期内的;读方开关打开的服务在这期间 fail-closed(go/db 的存盘和认领回 Unavailable,scene 退避重试,见 GoDbRouteNotTrusted)。
#
# Severity conventions(与 scene-manager-alerts.yaml 相同):
#   critical = pager, someone wakes up
#   warning  = next-business-hours channel
#   info     = dashboard annotation / trend signal
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: data-service-route-alerts
  labels:
    app: data-service
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: data-service.route-reconcile
      interval: 30s
      rules:
        # 装配了 reconciler(db_first)却没有任何副本持有租约:没有人补推孤儿行、没有人做回档检测(M3)、没有人挂 / 撤就绪标记。
        # leader 序列在每个装配副本上恒导出 0/1;`or vector(0)` 兜住「一个序列都没有」;assembled > 0 把 redis 模式(不装配)排除在外。
        - alert: DataServiceRouteNoLeader
          expr: |
            (sum(data_service_route_reconcile_leader) or vector(0)) == 0 and sum(data_service_route_reconcile_assembled) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "映射对账没有 leader(装配了 reconciler 的 data_service 都没拿到租约)"
            description: >-
              {{ $value }} 个副本持有 route_reconcile 租约,而全服有装配了 reconciler 的 data_service。
              期间库里的新行不会补推到 mapping Redis、全局库回档不会被自动发现(writable 不会被置 0)、标记不会被挂上或撤下。
              查各 data_service 日志的 route reconcile 行:连不上全局库(租约续不上)、连不上 mapping Redis
              (连续失败超过 LeaseMs 会主动让出租约,event="lease_released_redis_unreachable")、或全局库的 route_reconcile 行缺失(没跑迁移)。

        # 同一时刻两个副本都认为自己是 leader。租约在库里按库时钟判,正常情况下不会发生;出现说明租约谓词失效,
        # 或这套 Prometheus 同时抓了两套各自有全局库的环境(那时按环境拆规则)。
        - alert: DataServiceRouteMultiLeader
          expr: |
            sum(data_service_route_reconcile_leader) > 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "映射对账同时有 {{ $value }} 个 leader"
            description: >-
              data_service_route_reconcile_leader 之和为 {{ $value }}。库写全带租约谓词、数据推送是 set-if-newer、挂标记有预热令牌,
              正确性不依赖单 leader,但两个 leader 会互相覆写预热令牌、反复推送。按 pod 查是哪几个副本;核对它们连的是不是同一个全局库
              (route_reconcile 行的 leader 列只会有一个值),以及各副本所在节点的时钟。

        # Arm 是全服单值。两种取值并存时,Arm=false 的副本当上 leader 就撤标记(M4),Arm=true 的当上又挂回去:标记来回翻,
        # 打开了读方开关的服务随之间歇 fail-closed。滚动切换的窗口内短暂出现是预期的。
        - alert: DataServiceRouteArmMixed
          expr: |
            count(count_values("arm", data_service_route_reconcile_arm_enabled)) > 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "data_service 副本的 RouteStore.Reconcile.ArmReadyMarker 取值不一致"
            description: >-
              装配了 reconciler 的副本里同时有 ArmReadyMarker=true 与 false,持续超过 15 分钟。
              按 pod 查 data_service_route_reconcile_arm_enabled;核对各 zone namespace 的 go-svc-data-service-config,
              用 tools/scripts/k8s_deploy.ps1 以同一个 -RouteReconcileArm 补齐剩下的 zone 并滚动 data-service。

        # Arm 打开了,但现任 leader 报标记不在(或者根本没有 leader)。读方开关打开的服务这时全部 fail-closed。
        # ready_marker 只由现任 leader 导出:没有 leader 时用 vector(0) 补成「不在」(NoLeader 会同时响)。
        - alert: DataServiceRouteReadyMissing
          expr: |
            max(data_service_route_reconcile_arm_enabled) == 1 and (max(data_service_route_ready_marker) or vector(0)) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ArmReadyMarker 已打开,但 mapping:route:ready 标记 10 分钟没有挂上"
            description: >-
              全量预热(rewarm 之后、mapping Redis 空实例重启之后)在大库上要数小时,期间这条会响,属预期:看
              data_service_route_reconcile_event_total{event="task_started"|"task_completed"} 与 push_total{phase="prewarm"} 是否在走。
              不在预热却一直挂不上:看 DataServiceRouteArmingRefused / DataServiceRoutePushConflicts / DataServiceRouteForeignFence
              是否在响(都会阻止挂标记),以及 leader 日志里挂标记被拒的原因。读方开关打开的服务在标记挂上之前 fail-closed
              (go/db 暂停存盘消费,data_service 回源全局库,guild 按封锁拒绝)。

        # 现任 leader 报 route_meta.writable=0:映射写者(建角登记、搬库、合服工具)全部被冻结。
        # 由 leader 的回档检测(水位键世代 / 水位、cache_ahead)或人工 route-tool freeze 置 0;只有 route-tool unfreeze 能解冻。
        - alert: DataServiceRouteWritesFrozen
          expr: |
            min(data_service_route_writable) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "映射写入已冻结(route_meta.writable=0),建角登记会失败"
            description: >-
              现任 leader 报 writable=0。先查是谁冻结的:DataServiceRouteRollbackOrCacheAhead 同时响 = leader 判定全局库回档或缓存领先;
              否则多半是人工 route-tool freeze。恢复按 runbook §9.4:freeze → reconcile-from-cache(先 -dry-run)→ audit -frozen-recovery
              (退出码 0)→ unfreeze -confirm-audited;K8s 上用 tools/scripts/k8s_route_tool.ps1 起一次性 Job 跑,不要 exec 进在役 Pod。

        # leader 冻结了映射写者:freeze_watermark(水位键水位 > 库水位,库回档)、freeze_generation(世代不等)、
        # freeze_cache_ahead(缓存 rev 领先库)。容差 0(负责人 10-17 拍板)。
        - alert: DataServiceRouteRollbackOrCacheAhead
          expr: |
            sum by (event) (increase(data_service_route_reconcile_event_total{event=~"freeze_.*"}[5m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "映射对账 leader 判定全局库回档 / 缓存领先,已冻结写者({{ $labels.event }})"
            description: >-
              过去 5 分钟 leader 记了 {{ $value | printf "%.0f" }} 次 {{ $labels.event }}。
              freeze_watermark / freeze_generation = 全局库比 mapping Redis 记下的旧(PITR、从备份恢复、库被换过);
              freeze_cache_ahead = 缓存里某行的 rev 比库新(库回档,或有绕过库的写者)。不要直接 unfreeze:按 runbook §9.4 先反向修库再审计。

        # 挂标记被拒:arming_refused_eviction(淘汰策略不是 noeviction 或 evicted_keys 上涨)、arming_refused_unresolved
        # (有未决行,上限 1000 个 id 记在 leader 日志)、arming_refused_debug_enabled(enable-debug-command 不是 no,
        # DEBUG RELOAD 能在进程内替换数据而身份不变,读方认不出,规格 §13.1 第 5 条)。
        - alert: DataServiceRouteArmingRefused
          expr: |
            sum by (event) (increase(data_service_route_reconcile_event_total{event=~"arming_refused_.*"}[10m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "映射对账 leader 拒绝挂就绪标记({{ $labels.event }})"
            description: >-
              eviction:核对 mapping Redis 的 maxmemory-policy 必须是 noeviction、INFO stats 的 evicted_keys 是否在涨 —— 键被淘汰时
              缺键会被当成「没有记录」,这是最危险的一类,先止住淘汰再说;淘汰类原因只在 Redis 身份变化或 evicted_keys 回到基线后解除,
              或由 route-tool rewarm 一并清除。unresolved:看 leader 日志里列出的未决 id,逐个核对库与缓存。
              debug_enabled:mapping Redis 启动参数要带 --enable-debug-command no(deploy/k8s/manifests/infra/redis.yaml、redis-ha.yaml)。

        # 数据推送遇到同版本异值(conflict)或缓存里有不带 maprev 的旧值(legacy_conflict):有写者绕过了发布脚本。
        # 读方不受影响(缓存值仍是某个已提交状态),但 leader 不会挂标记,audit 会报。
        - alert: DataServiceRoutePushConflicts
          expr: |
            sum by (phase, result) (increase(data_service_route_reconcile_push_total{result=~"conflict|legacy_conflict"}[10m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "映射推送出现冲突({{ $labels.phase }} / {{ $labels.result }})"
            description: >-
              过去 10 分钟 {{ $labels.phase }} 阶段有 {{ $value | printf "%.0f" }} 行推送结果是 {{ $labels.result }}。
              同 rev 异值说明有绕过发布脚本的写者(手工 redis-cli SET);legacy_conflict 是缓存里还有不带 maprev 的旧值。
              用 route-tool audit 拿到具体 id,核对后再决定以库还是以缓存为准;在冲突清掉之前 leader 不挂标记。

        # 缓存「已验证到」的点落后太久:增量推送停了(leader 卡住、任务一直失败),或者全量预热正在跑(预期内)。
        # 增量缺省每 30s 一轮,一轮完成后年龄回落;持续 2 分钟大于 30s = 至少四轮没有完成。
        - alert: DataServiceRouteCacheVerifyStale
          expr: |
            max(data_service_route_cache_verified_age_seconds) > 30
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "映射缓存已验证点落后 {{ $value | printf \"%.0f\" }}s"
            description: >-
              现任 leader 报 cache_verified_age_seconds 持续大于 30s。全量预热期间属预期(看 event_total{event="task_started"});
              否则看 tick_total{result} 与 leader 日志:全局库慢查询 / 锁等待、mapping Redis 写失败、或推送限速
              (Reconcile.PushMaxRowsPerSec)跟不上写入量。

        # leader 连续连不上 mapping Redis 超过 LeaseMs,主动让出了租约。别的副本若也连不上,随后 NoLeader 会响。
        - alert: DataServiceRouteLeaderRedisUnreachable
          expr: |
            sum(increase(data_service_route_reconcile_event_total{event="lease_released_redis_unreachable"}[10m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "映射对账 leader 因连不上 mapping Redis 让出了租约"
            description: >-
              过去 10 分钟 {{ $value | printf "%.0f" }} 次。查 mapping Redis 是否在重启 / 切主、网络是否可达、maxclients 是否到线
              (INFO stats 的 rejected_connections;总账见 deploy/k8s/README.md「Redis 连接上限与总账」)。

    - name: data-service.route-readers
      interval: 30s
      rules:
        # go/db 选库读到不可信的映射副本:存盘和认领都回 Unavailable,scene 退避重试,进度这段时间只在 scene 内存里。
        # 只在 Placement.RequireRouteReady=true 之后有序列(PrimeRouteReady 以 0 预置)。阈值没有实测基线,阶段 B 压测后回头校准。
        - alert: GoDbRouteNotTrusted
          expr: |
            sum by (namespace, verdict) (rate(db_route_ready_verdict_total{verdict!="trusted"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 的 go/db 选库持续判 mapping Redis 不可信({{ $labels.verdict }}),玩家存盘和认领失败"
            description: >-
              每秒约 {{ $value | printf "%.2f" }} 次选库判成 {{ $labels.verdict }},这些玩家的存盘和认领回 Unavailable:在线玩家的进度只在 scene 内存里、
              等映射恢复后自动提交,这段时间 scene 崩溃会丢进度;新进场的玩家认领重试 30 秒后进场失败。
              script_error = go/db 自己执行读脚本失败(ACL 不放行 EVALSHA / INFO、超时、连不上 mapping Redis),看 go/db 日志 `[player_store] resolve storage` 行;
              其余(absent / identity_mismatch / not_master 等)是副本不可信的结论,同时看 DataServiceRouteReadyMissing / DataServiceRouteNoLeader、
              现任 leader 的 data_service_route_ready_selfcheck{verdict} 与 data_service_route_reconcile_event_total{event="task_started"}(全量预热是否在跑)。
              不要先关 Placement.RequireRouteReady:映射缓存不完整时关掉开关,go/db 退回两键 MGET,缺键会被当成「没有落点」,已搬库的玩家会被写进错库。

        # 定时重读 zone_merged_into 失败,这个副本继续用旧映射(启动时读不到才拒启)。合服之后旧映射会把玩家解析到已合走的区。
        - alert: DataServiceMergedZoneRefreshFailing
          expr: |
            sum by (namespace) (increase(data_service_merged_zone_refresh_total{result="error"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的 data_service 重读合服映射持续失败"
            description: >-
              过去 5 分钟约 {{ $value | printf "%.0f" }} 次失败,已持续 5 分钟。这些副本还在用旧映射,合服之后的玩家归属可能解析到已合走的区,
              落在那里的新公会、新商品没有人再收。查全局库连接和 zone_merged_into 的读权限;正在合服时先别往下走,
              恢复之后等两个刷新周期(RouteStore.MergedZoneRefreshSec,默认 5 秒)。

        # data_service 的归属查询在缓存不可信时回源全局库,而回源也失败了:RPC 回 Unavailable(绝不 NotFound),调用方 fail-closed。
        - alert: DataServiceRouteReadSQLErrors
          expr: |
            sum by (namespace, path) (increase(data_service_route_read_total{result="sql_error"}[5m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 的 data_service 归属查询回源全局库失败({{ $labels.path }})"
            description: >-
              过去 5 分钟 {{ $value | printf "%.0f" }} 次。这时缓存不可信(就绪标记不在 / 身份不符)、全局库也不可用,
              登录选区 / 内部路由会拿到 Unavailable。先看全局库(MySQL 连接数、锁等待),再看为什么缓存不可信(DataServiceRouteReadyMissing)。

        # data_service 读方持续判 mapping Redis 副本不可信,每次 R2(home_fence,含写门禁里的两次)/ R3(batch)/ R6(home)都回源全局库。
        # 回源结果是对的,所以上一条 ReadSQLErrors 不响;leader 所在副本看到的是 trusted,ReadyMissing 也不响 —— 典型是部分副本的
        # MappingRedis 指到了另一个实例或副本(迁移 mapping 实例、ConfigMap 漂移),或 ACL 让脚本里的 INFO 报错。这些副本的归属读会
        # 静默压到 route store 的独立连接池上,直到库扛不住才以 sql_error 暴露。规格 §8 P5 把 verdict!="trusted" 稳定为 0 当作人工门禁,
        # 本条是它的运行期版本(go/db 有 GoDbRouteNotTrusted)。
        # 只在 RouteStore.ReadRequiresReady=true 之后有序列(PrimeRouteRead 以 0 预置 8 个 verdict),开关关着时不会误报。
        # 阈值没有实测基线(任何非 trusted 持续 10 分钟即报),P5 之后按压测回头校准。
        - alert: DataServiceRouteReadNotTrusted
          expr: |
            sum by (namespace, verdict) (rate(data_service_route_ready_verdict_total{verdict!="trusted"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的 data_service 读方持续判 mapping Redis 不可信({{ $labels.verdict }}),归属读在回源全局库"
            description: >-
              每秒约 {{ $value | printf "%.2f" }} 次就绪读判成 {{ $labels.verdict }},这些读全部回源全局库 player_route(结果正确,RPC 不报错)。
              rewarm 之后、mapping Redis 空实例重启之后的全量预热期间响属预期:对照 DataServiceRouteReadyMissing 是否同时在响、
              data_service_route_reconcile_event_total{event="task_started"} 是否在走。不在预热时去掉聚合按 pod 看是哪几个副本,再按 verdict 查:
              identity_mismatch / not_master = 这些副本 ConfigMap 里的 MappingRedis 指向的实例或角色与 leader 挂标记的不是同一个
              (迁移过 mapping 实例、各 zone 的 go-svc-data-service-config 漂移、哨兵切主后连到了副本);
              script_error = 读脚本执行失败(ACL 不放行 EVALSHA / INFO、超时、连不上),看 data_service 日志 `[RouteRead]` 行。
              回源量大时同时看全局库连接数(route store 的独立池)与 DataServiceRouteReadSQLErrors。不需要关 RouteStore.ReadRequiresReady:
              回源本身就是不可信时的正确行为。

    # W1 写入:db_first 下建角登记(RegisterPlayerZone)先在全局库 player_route 提交,再发布到 mapping Redis(set-if-newer + WAITAOF)。
    # 来源:docs/design/player-route-mapping-durability-proposal.md §4 / §11.2(P2 门禁量的「发布未确认率」= not_durable + error)。
    # 两个计数器只在 RouteStore.Mode=db_first 时有数,PrimeRoute 启动时以 0 预置全部取值,increase 抓得到第一次;redis 模式没有序列,不会误报。
    # 按 namespace 聚合(每个 zone 的 data_service 各自登记本 zone 的新角色)。阈值没有实测基线(任何一次持续即报),
    # P2 的建角压测出对比表之后回头校准。
    - name: data-service.route-writes
      interval: 30s
      rules:
        # 库行已提交、发布没确认:not_durable = WAITAOF 在 RouteStore.WaitAOFTimeoutMs 预算内没拿到足够确认(appendfsync everysec 下
        # 本地确认最长约 1s);error = 发布脚本或 WAITAOF 回复确定性出错(不重试)。每一次都在库里留下一行已提交、缓存没确认的映射,
        # 由对账 leader 的增量推送补齐;玩家侧不报错(建角已提交)。superseded 属预期,不进本条。
        - alert: DataServiceRoutePublishUnconfirmed
          expr: |
            sum by (namespace, result) (rate(data_service_route_publish_total{result=~"not_durable|error"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的 data_service 映射发布持续未确认({{ $labels.result }})"
            description: >-
              每秒约 {{ $value | printf "%.2f" }} 次 W1 发布以 {{ $labels.result }} 结束:player_route 的行已提交,mapping Redis 那一份没确认
              (not_durable 时值多半已写入、只是没拿到落盘确认)。这些行由现任对账 leader 的增量推送补齐,同时看 DataServiceRouteNoLeader /
              DataServiceRouteCacheVerifyStale 是否在响(没有 leader 或增量停了时补不上)。not_durable 持续:查 mapping Redis 的 AOF / fsync
              (INFO persistence、磁盘延迟)、redis-ha 下副本是否在线,以及 RouteStore.WaitAOFTimeoutMs 预算;error:看 data_service 日志
              `[RegisterPlayerZone][db_first]` 的 ERROR 行。不要靠把 WaitAOFNumLocal / WaitAOFNumReplicas 写 0 止血,除非负责人同意。

        # db_first 建角登记失败,建角 fail-closed(login 回错误,玩家重试):store_error = 全局库 player_route 的提交失败,或映射写者被
        # 冻结(route_meta.writable=0 时 W1 同样计 store_error,冻结本身由 DataServiceRouteWritesFrozen critical 报);
        # precheck_error = mapping Redis 预检本身出错(三键 MGET 失败、缓存里的 zone 解析不了)。
        - alert: DataServiceRouteRegisterFailures
          expr: |
            sum by (namespace, outcome) (increase(data_service_route_register_total{outcome=~"store_error|precheck_error"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 的 db_first 建角登记持续失败({{ $labels.outcome }})"
            description: >-
              过去 5 分钟约 {{ $value | printf "%.0f" }} 次 RegisterPlayerZone 以 {{ $labels.outcome }} 失败,对应的建角都被拒绝。
              store_error:先看 DataServiceRouteWritesFrozen 是否同时在响(冻结按 runbook §9.4 处理,不要直接 unfreeze);否则查全局库
              (MySQL 连接数、锁等待、route store 的独立连接池 RouteStore.MaxOpenConn)。precheck_error:查 mapping Redis 的可用性与连接数
              (INFO stats 的 rejected_connections),以及有没有被写坏的 player:zone 值。逐条明细在 data_service 日志
              `[RegisterPlayerZone][db_first]` 的 ERROR 行。
