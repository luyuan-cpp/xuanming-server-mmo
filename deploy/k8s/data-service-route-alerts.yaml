# Prometheus alert rules for 玩家归属(player_route)与合服映射(zone_merged_into)。
#
# 来源:docs/design/player-route-mapping-durability-proposal.md §15(映射直读全局库)、
#       docs/design/player-data-tidb-scaling-plan.md §7.1 与 docs/ops/merge-zone-runbook.md(不停服合服)。
# 指标定义(名字以代码为准,本文件只引用;tools/scripts/tests/k8s_deploy_contract.tests.ps1 从源码核对):
#   - data_service(go/data_service/internal/metrics,PrimeRoute 启动时以 0 预置全部取值):
#       data_service_route_register_total{outcome}     每次 RegisterPlayerZone 恰好计一次
#       data_service_route_read_total{path,result}     player_route 的 SQL 读,home 每次读计一次,batch 每块计一次
#   - 定时重读合服映射(placement.MergedZoneCache),四个服务同一形状,result = ok | error,启动时以 0 预置:
#       data_service_merged_zone_refresh_total         读全局库 zone_merged_into
#       match_merged_zone_refresh_total                读全局库 zone_merged_into
#       guild_merged_zone_refresh_total                读 data_service.GetMergedZones
#       trade_merged_zone_refresh_total                读 data_service.GetMergedZones
#
# Install as a PrometheusRule CR (kube-prometheus stack),与 owner-epoch-alerts.yaml 同法:
#   kubectl apply -n observability -f deploy/k8s/data-service-route-alerts.yaml
#
# Scrape prerequisites(未满足时下面全部是哑的):
#   - 这些服务只有 Prometheus 注解(manifests/go-svc/ 下的 prometheus.io/scrape|port|path),**没有 ServiceMonitor / PodMonitor**,
#     接入哪种抓取方式(ServiceMonitor / PodMonitor,或按注解抓取的 job)要在上线前定下来并验证有数。
#   - 规则按 namespace 分组(data_service 一个 zone 一个 namespace,guild / trade / match 在 infra namespace),用的是
#     ServiceMonitor / PodMonitor 默认附加的 namespace 标签;改用按注解抓取的 job 时 relabel 必须同样写出它。
#
# 口径:
#   - 归属读写直接落全局库,读错就是 RPC 回 Unavailable(绝不回 NotFound),调用方 fail-closed,所以读写错误是这里最要紧的信号。
#   - 只进看板、不设告警:route_register_total 除 store_error 以外的 outcome(conflict 是业务冲突)、route_read_total 的 ok / not_found。
#   - 刷新失败时进程继续用旧映射(启动时读不到才拒启),最坏是一次可重试的拒绝,所以都是 warning;正在合服时先别往下走。
#   - 阈值没有实测基线(任何一次持续即报),阶段 B 压测出对比表之后回头校准。
#
# Severity conventions(与 scene-manager-alerts.yaml 相同):
#   critical = pager, someone wakes up
#   warning  = next-business-hours channel
#   info     = dashboard annotation / trend signal
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: data-service-route-alerts
  labels:
    app: data-service
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: data-service.route
      interval: 30s
      rules:
        # player_route 的 SQL 读失败:GetPlayerHomeZone / BatchGetPlayerHomeZone 回 Unavailable,登录选区、内部路由、归属判定都 fail-closed。
        - alert: DataServiceRouteReadErrors
          expr: |
            sum by (namespace, path) (increase(data_service_route_read_total{result="error"}[5m])) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 的 data_service 读全局库 player_route 失败({{ $labels.path }})"
            description: >-
              过去 5 分钟 {{ $value | printf "%.0f" }} 次。这些读的调用方拿到 Unavailable(绝不是 NotFound),登录选区和内部路由失败。
              查全局库的连接数、锁等待,以及 route store 的独立连接池(RouteStore.MaxOpenConn);逐条明细在 data_service 日志 `[DataRoute]` 行。

        # 建角登记失败,建角 fail-closed(login 回错误,玩家重试)。映射写者被冻结(route_meta.writable=0)时同样计 store_error。
        - alert: DataServiceRouteRegisterFailures
          expr: |
            sum by (namespace, outcome) (increase(data_service_route_register_total{outcome="store_error"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 的建角登记持续失败({{ $labels.outcome }})"
            description: >-
              过去 5 分钟约 {{ $value | printf "%.0f" }} 次 RegisterPlayerZone 以 {{ $labels.outcome }} 失败,对应的建角都被拒绝。
              先看映射写者是不是被冻结(route-tool freeze;K8s 上用 tools/scripts/k8s_route_tool.ps1 起一次性 Job),
              否则查全局库(连接数、锁等待、RouteStore.MaxOpenConn)。逐条明细在 data_service 日志 `[RegisterPlayerZone]` 的 ERROR 行。

    # 合服只写 zone_merged_into 一条映射,各服务定时重读,读的时候把记录里的原始区解析成最终区(docs/ops/merge-zone-runbook.md)。
    # 四条形状相同:error 持续增长 = 这个副本在用旧映射。
    - name: merged-zone.refresh
      interval: 30s
      rules:
        # 合服之后旧映射会把玩家解析到已合走的区。
        - alert: DataServiceMergedZoneRefreshFailing
          expr: |
            sum by (namespace) (increase(data_service_merged_zone_refresh_total{result="error"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的 data_service 重读合服映射持续失败"
            description: >-
              过去 5 分钟约 {{ $value | printf "%.0f" }} 次失败,已持续 5 分钟。这些副本还在用旧映射,合服之后的玩家归属可能解析到已合走的区,
              落在那里的新公会、新商品没有人再收。查全局库连接和 zone_merged_into 的读权限;正在合服时先别往下走,
              恢复之后等两个刷新周期(RouteStore.MergedZoneRefreshSec,默认 5 秒)。

        # match 直读全局库。合服之后旧映射会把两个区当成不同的区,回一次可重试的拒绝。
        - alert: MatchMergedZoneRefreshFailing
          expr: |
            sum by (namespace) (increase(match_merged_zone_refresh_total{result="error"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的 match 重读合服映射持续失败"
            description: >-
              过去 5 分钟约 {{ $value | printf "%.0f" }} 次失败,已持续 5 分钟。这些副本还在用旧映射,合服之后同区判定可能回一次可重试的拒绝,
              没有错误数据。查全局库连接和 zone_merged_into 的读权限(match 的运行账号要在写者计划里有这张表的 SELECT);
              恢复之后等一个刷新周期。

        # guild 经 data_service 读映射。合服之后旧映射会把两个区当成不同的区,回一次可重试的拒绝。
        - alert: GuildMergedZoneRefreshFailing
          expr: |
            sum by (namespace) (increase(guild_merged_zone_refresh_total{result="error"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的 guild 重读合服映射持续失败"
            description: >-
              过去 5 分钟约 {{ $value | printf "%.0f" }} 次失败,已持续 5 分钟。这些副本读不到 data_service.GetMergedZones,还在用旧映射,
              合服之后同区判定可能回一次可重试的拒绝,没有错误数据。查 data_service(zone 级,全部 zone 都下线时读不到)和 etcd 发现;
              恢复之后等一个刷新周期。这时不要重启 guild:启动读不到映射会拒绝启动。

        # trade 经 data_service 读映射,按区查询和比较都依赖它。
        - alert: TradeMergedZoneRefreshFailing
          expr: |
            sum by (namespace) (increase(trade_merged_zone_refresh_total{result="error"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的 trade 重读合服映射持续失败"
            description: >-
              过去 5 分钟约 {{ $value | printf "%.0f" }} 次失败,已持续 5 分钟。这些副本读不到 data_service.GetMergedZones,还在用旧映射,
              合服之后源区和目标区的市场看起来还是两个,没有错误数据。查 data_service(zone 级,全部 zone 都下线时读不到)和 etcd 发现;
              恢复之后等一个刷新周期。这时不要重启 trade:启动读不到映射会拒绝启动。
