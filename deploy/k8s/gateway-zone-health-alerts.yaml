# Prometheus alert rules for 网关区服健康汇总(docs/design/gateway-zone-health-publish-20261111.md,服务器缺口清单第 29 条)。
#
# 每个 zone 的健康由本 zone 的网关副本写成 etcd 里的汇总记录(java/gateway_node 的 ZoneHealthPublisher),
# 所有网关读这些汇总生成区服列表(ZoneHealthProbeService)。指标由 Micrometer 导出:
#   gateway_zone_health_unpublished_zones      gauge:有 login 登记、却没有任何汇总记录的 zone 数。列表把这些 zone 显示为开放、
#                                              不带负载档,区服故障时也不会自动显示维护。
#   gateway_zone_health_snapshot_age_seconds   gauge:本网关距上次成功读到全部汇总的秒数。超过 zone-probe.status-ttl-ms(15 秒)后,
#                                              这个网关回的列表全部是开放、不带负载档。
#   gateway_zone_health_publish_total{outcome} counter:outcome = written / withdrawn / failed。看板用,不告警
#                                              (发布失败的后果由上面两条从读方看到)。
#
# Install as a PrometheusRule CR (kube-prometheus stack),与 owner-epoch-alerts.yaml 同法:
#   kubectl apply -n observability -f deploy/k8s/gateway-zone-health-alerts.yaml
#
# Scrape prerequisites:
#   - gateway 在独立管理端口 8082 的 /actuator/prometheus 上导出(k8s_deploy.ps1 的 gateway ConfigMap 打开 exposure,
#     Pod 模板的 prometheus.io/* 注解由同一脚本生成)。
#   - 抓取配置附加 namespace / pod 两个目标 label。
#
# 阈值是初值:60 秒是状态 TTL 的 4 倍,for 5m 盖过一次网关或 etcd 的滚动重启。
#
# Severity conventions(与 scene-manager-alerts.yaml 相同):
#   critical = pager, someone wakes up
#   warning  = next-business-hours channel
#   info     = dashboard annotation / trend signal
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gateway-zone-health-alerts
  labels:
    app: gateway
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: gateway.zone-health
      interval: 30s
      rules:
        # 所有网关读的是同一份汇总,算出的数相同;取全局 max,一个缺发布者的 zone 只出一条告警。
        - alert: GatewayZoneHealthUnpublished
          expr: max(gateway_zone_health_unpublished_zones) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "有 {{ $value }} 个 zone 的网关没有发布健康汇总"
            description: >-
              这些 zone 有 login 登记,但本 zone 的网关副本一条健康汇总都没写,区服列表把它们显示为开放、不带负载档,
              区服故障时也不会自动显示维护。网关日志里 "Zones with a registered login but no health record" 那一行给出 zone 号;
              查该 zone namespace 的 gateway Pod 是否在跑、ConfigMap 的 gateway.home-zone-ids 是否等于本 zone、
              日志里有没有 "health publisher could not" 或 "health record withdrawn"。
        # 按 Pod 判:一个网关读不到,只有它回的列表退化成 UNKNOWN。
        - alert: GatewayZoneHealthStale
          expr: max by (namespace, pod) (gateway_zone_health_snapshot_age_seconds) > 60
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} 读不到区服健康汇总"
            description: >-
              这个网关超过 60 秒没有成功读到 etcd 里的健康汇总(etcd 不可达,或有一条汇总记录解码失败,整次读按失败处理),
              它回的区服列表全部是开放、不带负载档。网关日志里找 "Zone health probe failed" 与 "Failed to parse zone health";
              坏记录的键在日志里,删掉它或让写它的网关重写即可恢复。
