name: xuanming-gm-admin
services:
  mysql:
    image: container-registry.oracle.com/mysql/community-server:8.4
    pull_policy: never
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${GM_MYSQL_ROOT_PASSWORD:?Run run_local.py prepare first}
      MYSQL_DATABASE: gm_admin
      MYSQL_USER: gm_admin
      MYSQL_PASSWORD: ${GM_DB_PASSWORD:?Run run_local.py prepare first}
    ports:
      - "127.0.0.1:13391:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../build/gm-admin-runtime/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h127.0.0.1 -ugm_admin gm_admin -Nse 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
  redis:
    image: redis:7.2
    pull_policy: never
    restart: "no"
    environment:
      REDISCLI_AUTH: ${GM_REDIS_PASSWORD:?Run run_local.py prepare first}
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:16391:6379"
    volumes:
      - redis-data:/data
      - ../../build/gm-admin-runtime/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  mysql-data:
    name: xuanming-gm-admin-mysql-data
  redis-data:
    name: xuanming-gm-admin-redis-data
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.226.0/24
