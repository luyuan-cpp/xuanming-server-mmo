# ────────────────────────────────────────────────────────────────
# 独立官方通行证栈（Casdoor OIDC + 专属 MySQL 8.0）。
# 架构与安全边界见 docs/design/official-passport-registration.md。
#
# 设计原则：
#   - 完全独立于游戏主库与全局账号库，零跨库 SQL，只输出标准 OIDC RS256 id_token。
#   - 所有数据库口令强制经环境变量注入，禁止写入 git 跟踪文件。
#   - 强制注入 origin 防止 Host 头投毒伪造 iss；initDataNewOnly=true 避免重启覆盖运行时配置。
#
# 本地启动示例（PowerShell）：
#   $env:PASSPORT_DB_ROOT_PASSWORD = "<local-root-password>"
#   $env:PASSPORT_DB_PASSWORD      = "<local-casdoor-password>"
#   $env:PASSPORT_ADMIN_PASSWORD   = "<local-casdoor-admin-password>"
#   $env:PASSPORT_ORIGIN           = "http://127.0.0.1:8000"
#   docker compose -f deploy/passport/docker-compose.yml up -d
#
# 本地停服：
#   docker compose -f deploy/passport/docker-compose.yml down
# ────────────────────────────────────────────────────────────────

# 镜像按摘要固定(2026-11-26 向 registry-1.docker.io 查的 manifest index 摘要):标签可以被改写,摘要不会。
# 升级时先查新摘要:curl -sI -H "Authorization: Bearer <token>" -H "Accept: application/vnd.oci.image.index.v1+json"
#   https://registry-1.docker.io/v2/<repo>/manifests/<tag> 取 docker-content-digest;升级 Casdoor 前先按设计稿 §5.4 第 10 条重核。
services:
  passport-db:
    image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: mmorpg-passport-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${PASSPORT_DB_ROOT_PASSWORD:?set PASSPORT_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: casdoor
      MYSQL_USER: casdoor
      MYSQL_PASSWORD: ${PASSPORT_DB_PASSWORD:?set PASSPORT_DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - passport_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  casdoor:
    image: ${CASDOOR_IMAGE:-casbin/casdoor:v4.27.1@sha256:a0499a9e1bc0c089af79f19b16b866432bc9519a495e286ac7c558181c302b2a}
    container_name: mmorpg-passport-casdoor
    restart: unless-stopped
    depends_on:
      passport-db:
        condition: service_healthy
    ports:
      # 默认只绑本机回环:Casdoor 首启前未设管理员口令时任何能访问端口的人都能抢先设置;真机局域网联调再显式设 PASSPORT_BIND=0.0.0.0。
      - "${PASSPORT_BIND:-127.0.0.1}:${PASSPORT_PORT:-8000}:8000"
    environment:
      RUNNING_IN_DOCKER: "true"
      driverName: mysql
      dataSourceName: "casdoor:${PASSPORT_DB_PASSWORD:?set PASSPORT_DB_PASSWORD}@tcp(passport-db:3306)/"
      dbName: casdoor
      # 首启即写入 built-in/admin 口令,杜绝「首个访问者在浏览器里设置管理员口令」的接管窗口。
      initAdminPassword: ${PASSPORT_ADMIN_PASSWORD:?set PASSPORT_ADMIN_PASSWORD}
      origin: ${PASSPORT_ORIGIN:-http://127.0.0.1:8000}
      runmode: ${PASSPORT_RUNMODE:-dev}
      initDataFile: "./init_data.json"
      initDataNewOnly: "true"
    volumes:
      - ./conf/app.conf:/conf/app.conf:ro
      - ./init_data.json:/init_data.json:ro

volumes:
  passport_mysql_data:

networks:
  default:
    ipam:
      config:
        - subnet: ${PASSPORT_SUBNET:-10.249.88.0/24}
