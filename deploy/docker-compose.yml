version: '3.8'

services:
  # Kafka service
  #
  # 镜像钉 tag@digest(2026-10-15),不再用浮动的 apache/kafka:latest。原因:
  #   - 下面的命名卷 kafka-data 让日志目录与 KRaft 元数据跨容器重建保留,浮动 tag 一次 pull
  #     就可能让新版本 broker 去读旧版本写下的目录,版本在无人察觉时漂移。
  # 2026-10-15 核对 Docker Hub:latest 与 4.3.1 是同一个 index digest,钉版不改变当时 latest 对应的版本。
  # 但本机缓存的 latest 可能更旧,核对与升级步骤见 deploy/k8s/README.md「镜像钉版本」。
  # 升级时四处同改、digest 也必须相同:本文件的 kafka 与 kafka-topic-init、
  # deploy/k8s/manifests/infra/kafka.yaml、deploy/k8s/manifests/infra/kafka-topic-init.yaml。
  # 先用 `docker buildx imagetools inspect apache/kafka:<版本>` 取 Digest 行,再在本地跑一遍
  # kafka-topic-init(以 0 退出)与 README 列出的 kafka-consumer-groups.sh 行为核对。
  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CLUSTER_ID=5L6g3nShT-eMCtK--X86sw
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_HEAP_OPTS=${KAFKA_HEAP_OPTS:--Xms128m -Xmx256m}
      # Broker default retention, i.e. the retention of every topic that does
      # NOT declare its own; every topic with a contract declares its own, so
      # this is only a fallback. It MUST exceed the longest a consumer can legally fall behind. The C++
      # consumers pin max.poll.interval.ms=900000 (15 min,
      # cpp/libs/engine/infra/messaging/kafka/kafka_consumer.cpp), so anything
      # under 900s means a briefly-lagging gate loses BindSession/RoutePlayer
      # instead of catching up, silently
      # (docs/design/routing-identity-audit-20260908.md R11). Was 60000.
      # 30 min = 2x that floor; deploy/env/kafka.*.env override per profile.
      - KAFKA_LOG_RETENTION_MS=${KAFKA_LOG_RETENTION_MS:-1800000}
      - KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS=${KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS:-120000}
      - KAFKA_LOG_RETENTION_BYTES=${KAFKA_LOG_RETENTION_BYTES:-134217728}
      - KAFKA_LOG_SEGMENT_BYTES=${KAFKA_LOG_SEGMENT_BYTES:-16777216}
      - KAFKA_NUM_IO_THREADS=${KAFKA_NUM_IO_THREADS:-1}
      - KAFKA_NUM_NETWORK_THREADS=${KAFKA_NUM_NETWORK_THREADS:-1}
      - KAFKA_BACKGROUND_THREADS=${KAFKA_BACKGROUND_THREADS:-2}
      - KAFKA_LOG_CLEANER_THREADS=1
      - KAFKA_NUM_PARTITIONS=1
    deploy:
      resources:
        limits:
          memory: ${KAFKA_MEM_LIMIT:-512M}
          cpus: '${KAFKA_CPU_LIMIT:-0.5}'
    tmpfs:
      - /tmp/kafka-logs:size=${KAFKA_TMPFS_SIZE:-256m}
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    user: "root:root"  # Windows permission workaround

  # Pre-create the control-plane command topics (gate-cmd_g<N> / scene-cmd_g<N>)
  # with their contracted partition count.
  #
  # 这里以前预建的是 per-node topic(gate-{1..N} / scene-{1..N} / centre-{1..N})。
  # 那套寻址已经废弃(docs/design/control-plane-topic-partitioning-20260908.md):
  # 一个节点一个 topic 在 10 万个 scene 进程下会把 controller 元数据压垮,
  # 而且 topic 名与 consumer group 名里都带被回收复用的 node_id,冻结的前任会把
  # 继任者的命令消费掉再丢弃(P1)。现在按 partition = node_id % P 寻址,
  # 消费端 assign 自己的分区、不进 group。旧 topic 已退役,不再预建。
  #
  # Also pre-creates data_service's two audit topics with their contracted
  # partition counts (go/data_service/etc/data_service.yaml:
  # Kafka.TransactionLogPartitions=6 / Kafka.SnapshotPartitions=3) and
  # retention.ms=2592000000 (30d, Kafka.RetentionMs). This has to happen before
  # any scene process produces: the broker above runs auto.create.topics.enable
  # with KAFKA_NUM_PARTITIONS=1, so the first C++ message would otherwise
  # auto-create the topic with 1 partition and data_service's EnsureTopics would
  # refuse it forever ("partition contract mismatch"; the only symptom is one
  # Error log line every 30s). Effective names carry the generation suffix
  # (<base>_g<N>, config.go EffectiveTransactionLogTopic);
  # KAFKA_INIT_AUDIT_TOPIC_GENERATION mirrors Kafka.TopicGeneration. A partition
  # change is a generation bump (new *_g<N+1> topic, drain, delete the old one),
  # never an in-place expansion: that re-hashes key=player_id and breaks
  # per-player ordering. Idempotent (--if-not-exists); an existing *_gN topic
  # with the wrong PartitionCount makes this container exit 1 instead of
  # pretending — delete the auto-created topic and re-run kafka-topic-init.
  #
  # 观战帧 topic(docs/design/battle-spectate-tiered-fanout.md §15.3)同样在这里预建,代号与命令 topic 同源:
  # gate-spectate_g<N> 的分区数等于命令 topic 分区数(partition = gate node_id % P);
  # spectate-bcast_g<N> 固定 16 分区(partition = battle_id % 16),与 C++ 常量 kSpectateBroadcastTopicPartitions
  # (node_command_topic.h)相等,改数走换代号。
  kafka-topic-init:
    # 与上面 kafka 服务同一个钉版引用(tag 与 digest 都相同),见 kafka 服务上方的注释。
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    container_name: kafka-topic-init
    depends_on:
      - kafka
    environment:
      # 控制面命令 topic 的分区契约。必须与 bin/etc/base_deploy_config.yaml 的
      # Kafka.CommandTopicPartitions / CommandTopicGeneration、以及 Go 侧
      # go/shared/kafkacmd/command_topic.go 的默认值(或 KAFKA_COMMAND_TOPIC_* 环境变量)
      # 完全一致 —— 三处任一漂移,命令都会落到没人 assign 的分区上,静默全丢。
      # 见 docs/design/control-plane-topic-partitioning-20260908.md。
      - KAFKA_INIT_COMMAND_PARTITIONS=${KAFKA_INIT_COMMAND_PARTITIONS:-256}
      - KAFKA_INIT_COMMAND_TOPIC_GENERATION=${KAFKA_INIT_COMMAND_TOPIC_GENERATION:-1}
      # 审计 topic 世代号。三处必须相等:这里、go/data_service/etc/data_service.yaml 的
      # Kafka.TopicGeneration(消费者)、bin/etc/base_deploy_config.yaml 的 AuditTopicGeneration
      # (C++ 生产者;2026-09-09 起从编译期常量改成读配置,见 cpp/libs/modules/audit/audit_topic.h)。
      - KAFKA_INIT_AUDIT_TOPIC_GENERATION=${KAFKA_INIT_AUDIT_TOPIC_GENERATION:-1}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        # Wait for broker to accept connections
        for i in $$(seq 1 30); do
          if /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1; then
            echo "kafka broker is ready"
            break
          fi
          echo "waiting for kafka broker ($$i/30)..."
          sleep 2
        done
        # create_topic <name> [partitions=1] [topic config k=v]
        # --partitions used to be hardcoded to 1; the audit topics need 6 / 3.
        create_topic() {
          _cfg=""
          if [ -n "$$3" ]; then _cfg="--config $$3"; fi
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$1" --partitions "$${2:-1}" --replication-factor 1 $$_cfg \
            >/dev/null 2>&1 && echo "  created: $$1" || echo "  exists : $$1"
        }
        # ensure_retention <name> <retention_ms>: --config on create only applies at
        # creation time, so a topic that already exists (auto-created by a producer, or
        # created by an older init with a different value) silently inherits the broker
        # default. That default is short by design (it is meant for topics with no
        # contract), and inheriting it on a command topic is exactly R11: a briefly
        # lagging gate loses BindSession/RoutePlayer instead of catching up.
        # So declare it every run and read it back. Unlike the partition count,
        # retention.ms is a mutable config -- re-setting it carries no routing risk.
        ensure_retention() {
          /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:29092 \
            --entity-type topics --entity-name "$$1" --alter --add-config "retention.ms=$$2" >/dev/null
          # Anchor at start-of-line. --describe prints
          #   "  retention.ms=3600000 sensitive=false synonyms={DYNAMIC_TOPIC_CONFIG:retention.ms=3600000, DEFAULT_CONFIG:log.retention.ms=...}"
          # and a greedy .*retention\.ms= would run all the way to the *log.*retention.ms
          # synonym, reading back the broker default and failing a correct config.
          _gr=$$(/opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:29092 \
            --entity-type topics --entity-name "$$1" --describe 2>/dev/null \
            | sed -n 's/^[[:space:]]*retention\.ms=\([0-9][0-9]*\).*/\1/p' | head -n 1)
          if [ "$$_gr" != "$$2" ]; then
            echo "ERROR: topic $$1 retention.ms=$${_gr:-<inherited>} but it must be explicitly $$2" >&2
            echo "       Retention must be declared per topic, never inherited from the broker" >&2
            echo "       default, and must exceed the longest a consumer can lag" >&2
            echo "       (C++ consumers pin max.poll.interval.ms=900000)." >&2
            exit 1
          fi
          echo "  retention: $$1 retention.ms=$$2"
        }
        # assert_partitions <name> <expected>: --if-not-exists keeps whatever already
        # exists, so an auto-created 1-partition topic would slip through silently.
        assert_partitions() {
          _got=$$(/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic "$$1" 2>/dev/null \
            | sed -n 's/.*PartitionCount: *\([0-9]*\).*/\1/p' | head -n 1)
          if [ "$$_got" != "$$2" ]; then
            echo "ERROR: topic $$1 has PartitionCount=$${_got:-?} but the contract is $$2" >&2
            echo "       (audit topics: go/data_service/etc/data_service.yaml; command topics:" >&2
            echo "        bin/etc/base_deploy_config.yaml Kafka.CommandTopicPartitions, also used by gate-spectate;" >&2
            echo "        spectate-bcast: kSpectateBroadcastTopicPartitions in node_command_topic.h)." >&2
            echo "       Partition counts are immutable: bump the topic generation (new *_gN topic); never expand in place." >&2
            echo "       If a producer auto-created this topic before this init ran, delete the topic and re-run kafka-topic-init." >&2
            exit 1
          fi
          echo "  verified: $$1 partitions=$$2"
        }
        # 控制面命令 topic:一个节点类型一个 topic,固定分区数,partition = node_id % P。
        # 旧的 per-node topic 已退役,不再预建。
        cg="$${KAFKA_INIT_COMMAND_TOPIC_GENERATION}"
        cparts="$${KAFKA_INIT_COMMAND_PARTITIONS}"
        echo "Pre-creating control-plane command topics (generation g$$cg, partitions $$cparts)..."
        # 保留 1 小时就够:消费者每次启动都 assign 到分区末尾(startAtEnd),没有任何人
        # 会回放历史 —— 发给某个进程的命令不可能早于这个进程的启动时刻。
        create_topic "gate-cmd_g$$cg" "$$cparts" "retention.ms=3600000"
        assert_partitions "gate-cmd_g$$cg" "$$cparts"
        ensure_retention "gate-cmd_g$$cg" 3600000
        create_topic "scene-cmd_g$$cg" "$$cparts" "retention.ms=3600000"
        assert_partitions "scene-cmd_g$$cg" "$$cparts"
        ensure_retention "scene-cmd_g$$cg" 3600000
        # 观战帧 topic。gate 都 assign + startAtEnd、不提交位点,帧过时即作废,没有回放:落后的 gate 丢的只是几帧画面,
        # 下一帧就追上,不适用命令 topic 那条「保留期要盖住消费者落后时长」的规则(R11)。
        # 中继保留 1 小时同 gate-cmd;广播只留 10 分钟。
        echo "Pre-creating spectate frame topics (generation g$$cg)..."
        create_topic "gate-spectate_g$$cg" "$$cparts" "retention.ms=600000"
        assert_partitions "gate-spectate_g$$cg" "$$cparts"
        ensure_retention "gate-spectate_g$$cg" 600000
        create_topic "spectate-bcast_g$$cg" 16 "retention.ms=600000"
        assert_partitions "spectate-bcast_g$$cg" 16
        ensure_retention "spectate-bcast_g$$cg" 600000
        # data_service audit topics (see the comment above): contracted partitions + 30d retention.
        g="$${KAFKA_INIT_AUDIT_TOPIC_GENERATION}"
        echo "Pre-creating data_service audit topics (generation g$$g)..."
        create_topic "transaction_log_topic_g$$g" 6 "retention.ms=2592000000"
        assert_partitions "transaction_log_topic_g$$g" 6
        ensure_retention "transaction_log_topic_g$$g" 2592000000
        create_topic "player_snapshot_topic_g$$g" 3 "retention.ms=2592000000"
        assert_partitions "player_snapshot_topic_g$$g" 3
        ensure_retention "player_snapshot_topic_g$$g" 2592000000
        echo "Kafka topic init done."
    restart: "no"

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - JAVA_OPTS=${KAFKA_UI_JAVA_OPTS:--Xms128m -Xmx256m}
    deploy:
      resources:
        limits:
          memory: ${KAFKA_UI_MEM_LIMIT:-384M}
          cpus: '${KAFKA_UI_CPU_LIMIT:-0.5}'
    depends_on:
      - kafka

  # Redis service
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    # P0 OOM 防御(2026-06-03 docs/notes/redis-oom-data-safety-qa-record.md):
    #   - maxmemory 8gb         避免撑爆宿主机内存触发 OOM Killer 让所有容器一起死
    #   - noeviction            满了拒绝写入(OOM command not allowed),不淘汰任何键
    #   - notify-keyspace-events Eg  开启 evict/expire 事件通知,为后续应用层主动卸载预留
    #
    # 2026-10-12 由 allkeys-lfu 改为 noeviction,与 K8s(deploy/k8s/manifests/infra/redis.yaml)一致(负责人决定)。
    # 这个实例同时是 mapping Redis:player:zone / player:placement / merge:* 映射、go/db 的 applied 游标、
    # applied_epoch、排序锁、重试收据都在这里,都不带 TTL。allkeys-lfu 会把它们当冷键淘汰:
    # 游标被淘汰时 orderingForTask 直接判 Apply,顺序守卫静默失效;映射被淘汰时缺键被当成「没有记录」,
    # 写会落错库。这些都比「内存满了写入报错」危险。见 docs/design/player-route-mapping-durability-proposal.md §3.3。
    # 代价:本机内存打满时写入报错(fail-closed),要清数据或调大 maxmemory,不会再静默腾空间。
    #
    # --maxclients 40000 与 K8s(deploy/k8s/manifests/infra/redis.yaml 的 MAXCLIENTS)同值(P0-E,2026-10-15;取值待实测 / 压测复核),
    # tools/scripts/tests/redis_maxclients_contract.tests.ps1 钉住两边相等。以前不写 = Redis 缺省 10000,且会被容器 nofile 硬限压低。
    # 只对新建的容器生效:start_game.ps1 起 compose 带 --no-recreate,既有 redis 容器要
    #   docker --context desktop-linux compose -f deploy/docker-compose.yml up -d --force-recreate redis
    # 才会带上(会重启本机 Redis,数据在命名卷 redis-data 里不丢)。核对:docker --context desktop-linux exec redis redis-cli config get maxclients
    #
    # --enable-debug-command no(D1 第 1b-3 批,docs/handoff/launch-readiness-20261013/spec_D1_batch1b2_2_3.md §13.1 第 5 条):
    # DEBUG RELOAD NOSAVE / DEBUG LOADAOF 在同一进程里整库替换数据而 run_id / master_replid 不变,读方「就绪标记绑定实例身份」的判据认不出;
    # Redis 7 缺省即 no,显式写出防改(对账 leader 每拍 CONFIG GET 核对,不是 no 就拒绝挂标记)。同样只对新建的容器生效(见上一段)。
    command: >
      redis-server
      --appendonly yes
      --maxmemory 8gb
      --maxmemory-policy noeviction
      --notify-keyspace-events Eg
      --maxclients 40000
      --enable-debug-command no
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # ── Redis Cluster(profile: redis-cluster,默认不起)────────────────────
  # match 服务的私有存储(docs/design/cross-zone-matchmaking.md §2 D2 / §7):
  # 3 主 3 从,宿主机 Go 进程直连。默认 `docker compose up` 不会拉起,需要
  #   docker compose -f deploy/docker-compose.yml --profile redis-cluster up -d
  # 并把 go/match/etc/match_service.yaml 的 MatchRedis 指到 127.0.0.1:7000,Type: cluster。
  #
  # 为什么六个节点共用 redis-cluster-0 的网络命名空间(network_mode: service:…):
  #   集群客户端会跟随 MOVED 跳到节点 announce 的地址,所以节点必须 announce
  #   宿主机可达的 127.0.0.1:700N;但 announce 地址同时也是节点之间 gossip 用的
  #   地址,六个容器各自独立网络时 127.0.0.1 指向自己,建群握手必然失败。
  #   Docker Desktop for Windows 又不支持 network_mode: host。共享一个网络命名
  #   空间后,容器内 127.0.0.1:700N 互通、宿主机 127.0.0.1:700N 经端口映射到达
  #   同一个命名空间 —— 两边看到的地址完全一致,MOVED 才能跟得上。
  #   代价是所有端口映射只能写在命名空间的持有者 redis-cluster-0 上。
  redis-cluster-0:
    image: redis:7.2
    container_name: redis-cluster-0
    profiles: ["redis-cluster"]
    ports:
      - "7000:7000"
      - "7001:7001"
      - "7002:7002"
      - "7003:7003"
      - "7004:7004"
      - "7005:7005"
      - "17000:17000"
      - "17001:17001"
      - "17002:17002"
      - "17003:17003"
      - "17004:17004"
      - "17005:17005"
    command: >
      redis-server --port 7000 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
      --cluster-announce-ip 127.0.0.1 --cluster-announce-port 7000 --cluster-announce-bus-port 17000
    volumes:
      - redis-cluster-0-data:/data
    restart: unless-stopped

  redis-cluster-1:
    image: redis:7.2
    container_name: redis-cluster-1
    profiles: ["redis-cluster"]
    network_mode: "service:redis-cluster-0"
    depends_on: [redis-cluster-0]
    command: >
      redis-server --port 7001 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
      --cluster-announce-ip 127.0.0.1 --cluster-announce-port 7001 --cluster-announce-bus-port 17001
    volumes:
      - redis-cluster-1-data:/data
    restart: unless-stopped

  redis-cluster-2:
    image: redis:7.2
    container_name: redis-cluster-2
    profiles: ["redis-cluster"]
    network_mode: "service:redis-cluster-0"
    depends_on: [redis-cluster-0]
    command: >
      redis-server --port 7002 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
      --cluster-announce-ip 127.0.0.1 --cluster-announce-port 7002 --cluster-announce-bus-port 17002
    volumes:
      - redis-cluster-2-data:/data
    restart: unless-stopped

  redis-cluster-3:
    image: redis:7.2
    container_name: redis-cluster-3
    profiles: ["redis-cluster"]
    network_mode: "service:redis-cluster-0"
    depends_on: [redis-cluster-0]
    command: >
      redis-server --port 7003 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
      --cluster-announce-ip 127.0.0.1 --cluster-announce-port 7003 --cluster-announce-bus-port 17003
    volumes:
      - redis-cluster-3-data:/data
    restart: unless-stopped

  redis-cluster-4:
    image: redis:7.2
    container_name: redis-cluster-4
    profiles: ["redis-cluster"]
    network_mode: "service:redis-cluster-0"
    depends_on: [redis-cluster-0]
    command: >
      redis-server --port 7004 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
      --cluster-announce-ip 127.0.0.1 --cluster-announce-port 7004 --cluster-announce-bus-port 17004
    volumes:
      - redis-cluster-4-data:/data
    restart: unless-stopped

  redis-cluster-5:
    image: redis:7.2
    container_name: redis-cluster-5
    profiles: ["redis-cluster"]
    network_mode: "service:redis-cluster-0"
    depends_on: [redis-cluster-0]
    command: >
      redis-server --port 7005 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
      --cluster-announce-ip 127.0.0.1 --cluster-announce-port 7005 --cluster-announce-bus-port 17005
    volumes:
      - redis-cluster-5-data:/data
    restart: unless-stopped

  # 建群一次性任务。幂等:已经 cluster_state:ok 就跳过,重复 up 不会重建。
  # 同样共享 redis-cluster-0 的网络命名空间,所以能直接用节点 announce 的
  # 127.0.0.1:700N 建群(redis-cli 建群时会按 announce 地址握手)。
  redis-cluster-init:
    image: redis:7.2
    container_name: redis-cluster-init
    profiles: ["redis-cluster"]
    network_mode: "service:redis-cluster-0"
    depends_on:
      - redis-cluster-0
      - redis-cluster-1
      - redis-cluster-2
      - redis-cluster-3
      - redis-cluster-4
      - redis-cluster-5
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        nodes=""
        for p in 7000 7001 7002 7003 7004 7005; do
          for i in $$(seq 1 30); do
            if redis-cli -p $$p ping 2>/dev/null | grep -q PONG; then break; fi
            echo "waiting for redis 127.0.0.1:$$p ($$i/30)..."
            sleep 1
          done
          nodes="$$nodes 127.0.0.1:$$p"
        done
        if redis-cli -p 7000 cluster info 2>/dev/null | grep -q '^cluster_state:ok'; then
          echo "redis cluster already formed, skip create"
        else
          redis-cli --cluster create $$nodes --cluster-replicas 1 --cluster-yes
        fi
        # create 返回时 slot 表还在 gossip 传播,立刻查会短暂看到 cluster_state:fail;等到 ok 再报
        for i in $$(seq 1 30); do
          if redis-cli -p 7000 cluster info 2>/dev/null | grep -q '^cluster_state:ok'; then break; fi
          sleep 1
        done
        redis-cli -p 7000 cluster info | grep -E '^cluster_(state|known_nodes|size)'
    restart: "no"

  # MySQL service
  mysql:
    image: mysql:latest
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=Mmorpg#2026db
      - MYSQL_DATABASE=mmorpg
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=apppass123
      - MYSQL_INITDB_SKIP_TZINFO=1  # Avoid Windows timezone config warning
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nacos service (config center / service registry)
  nacos:
    image: nacos/nacos-server:latest
    container_name: nacos
    ports:
      - "8848:8848"  # Service port
      - "9848:9848"  # Client gRPC port
      - "9849:9849"  # Server gRPC port
    environment:
      - MODE=standalone  # Standalone mode (for dev/test)
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
      - NACOS_AUTH_TOKEN=VGhpc0lzQURldk9ubHlUb2tlblN0cmluZ0Zvck5hY29zMzIh
      - SPRING_DATASOURCE_PLATFORM=mysql  # Optional: enable MySQL-backed persistence
      - MYSQL_SERVICE_HOST=mysql  # Connect to the MySQL container above
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos_db  # Dedicated Nacos database
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=Mmorpg#2026db
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      - MYSQL_DATABASE_NUM=1
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-log:/home/nacos/logs
    depends_on:
      mysql:
        condition: service_healthy  # Wait for MySQL to be healthy before starting
    restart: unless-stopped

  # Etcd service (distributed key-value store)
  etcd:
    # bitnami/etcd 2025-08 起从 Docker Hub 下架(Bitnami 商业化调整),
    # bitnamilegacy/ 是官方冻结存档,镜像内容与环境变量语义完全一致。
    # 与 deploy/k8s/manifests/infra/etcd.yaml、etcd-maintenance.yaml 逐字相同(etcd_maintenance_contract.tests.ps1 守住);
    # 钉 tag@摘要待 Codex 实测 M0 后三处同批改(docs/ops/etcd-maintenance-runbook.md「阶段 2」)。
    image: bitnamilegacy/etcd:latest
    container_name: etcd
    ports:
      - "2379:2379"  # Client communication port
      - "2380:2380"  # Cluster peer communication port
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes  # Disable auth for dev (must enable in production)
      - ETCD_NAME=default
      - ETCD_INITIAL_CLUSTER=default=http://etcd:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_ADVERTISE_CLIENT_URLS=http://${HOST_IP:-127.0.0.1}:2379  # Advertised client URLs
      # ^^^^ Single advertise URL on purpose. Originally we advertised both
      # `etcd:2379` (container hostname, only resolvable inside the compose
      # network) and `host.docker.internal:2379` (resolvable on the host but
      # may map to a stale Docker host-only IP, e.g. 192.168.1.12). Once a
      # client receives the advertised list it auto-syncs against ALL of them
      # — every grpc call ends up serially racing the dial timeout on the
      # broken URLs (~30s each), which made `kv.Get` for the gate node prefix
      # exceed login's 3s ServiceDiscoveryTimeout and surfaced as
      # `DEADLINE_EXCEEDED` in the gateway during the 3-zone × 15000 stress
      # 2026-05. Keeping only the loopback URL makes auto-sync a no-op and
      # restores stable RPC latency.
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379  # Listen on all interfaces for client connections
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380  # Listen on all interfaces for peer communication
      # MVCC 历史压缩与空间配额(P0-C,原理与取值见 docs/ops/etcd-maintenance-runbook.md;取值待实测 / 压测复核)。
      # 这份 compose 也是 Linux 预发压测机的 etcd,那里没有 K8s CronJob,只能靠这三项。
      #   - 自动压缩按 revision 保留最近 1000000 个版本,必须与 deploy/k8s/manifests/infra/etcd-maintenance.yaml
      #     的 KEEP_REVISIONS 相同(etcd_maintenance_contract.tests.ps1 守住)。
      #   - 配额 3GiB:满足「配额 × 2 + 1Gi ≤ etcd.yaml 的 PVC 8Gi」,给 defrag 的临时文件留余量。K8s 的 etcd.yaml 同值。
      # 只对新建的容器生效:start_game.ps1 起 compose 带 --no-recreate,既有 etcd 容器要
      #   docker --context desktop-linux compose -f deploy/docker-compose.yml up -d --force-recreate etcd
      # 才会带上。这等于重启本机 etcd(数据在命名卷 etcd-data 里,不丢),应与整栈重启一起做:C++ etcd 流重建
      # (docs/design/grpc-muduo-transport.md §10.2 第 2 批)修好之前,单独重启 etcd 会让在跑的 C++ 节点进入约 181s 一轮的
      # 失租重注册循环。
      # 未验证(待 Codex 实测 M3):bitnamilegacy 镜像是否把这些 ETCD_* 环境变量交给 etcd(若它改用配置文件启动,
      # etcd 会忽略环境变量)、已有数据目录重启后是否仍生效。生效前用 runbook「compose」一节的手工压缩兜底。
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000000
      - ETCD_QUOTA_BACKEND_BYTES=3221225472
    volumes:
      - etcd-data:/bitnami/etcd/data  # Persistent data volume
    restart: unless-stopped

volumes:
  kafka-data:
  redis-data:
  # Redis Cluster(profile redis-cluster)每节点独立的 nodes.conf + AOF
  redis-cluster-0-data:
  redis-cluster-1-data:
  redis-cluster-2-data:
  redis-cluster-3-data:
  redis-cluster-4-data:
  redis-cluster-5-data:
  mysql-data:
  nacos-data:  # Nacos data persistence
  nacos-log:   # Nacos logs
  etcd-data:   # Etcd data persistence