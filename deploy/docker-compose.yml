version: '3.8'

services:
  # Kafka service
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CLUSTER_ID=5L6g3nShT-eMCtK--X86sw
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_HEAP_OPTS=${KAFKA_HEAP_OPTS:--Xms128m -Xmx256m}
      - KAFKA_LOG_RETENTION_MS=${KAFKA_LOG_RETENTION_MS:-60000}
      - KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS=${KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS:-120000}
      - KAFKA_LOG_RETENTION_BYTES=${KAFKA_LOG_RETENTION_BYTES:-134217728}
      - KAFKA_LOG_SEGMENT_BYTES=${KAFKA_LOG_SEGMENT_BYTES:-16777216}
      - KAFKA_NUM_IO_THREADS=${KAFKA_NUM_IO_THREADS:-1}
      - KAFKA_NUM_NETWORK_THREADS=${KAFKA_NUM_NETWORK_THREADS:-1}
      - KAFKA_BACKGROUND_THREADS=${KAFKA_BACKGROUND_THREADS:-2}
      - KAFKA_LOG_CLEANER_THREADS=1
      - KAFKA_NUM_PARTITIONS=1
    deploy:
      resources:
        limits:
          memory: ${KAFKA_MEM_LIMIT:-512M}
          cpus: '${KAFKA_CPU_LIMIT:-0.5}'
    tmpfs:
      - /tmp/kafka-logs:size=${KAFKA_TMPFS_SIZE:-256m}
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    user: "root:root"  # Windows permission workaround

  # Pre-create per-node Kafka topics (gate-{1..N}, scene-{1..N}, centre-{1..N})
  # so C++ consumers don't log "Unknown topic or partition" warnings on cold
  # start before SceneManager / producers create them lazily. Counts are
  # configurable via KAFKA_INIT_GATE_COUNT / KAFKA_INIT_SCENE_COUNT /
  # KAFKA_INIT_CENTRE_COUNT (defaults 8 / 16 / 4 — generous for local dev).
  kafka-topic-init:
    image: apache/kafka:latest
    container_name: kafka-topic-init
    depends_on:
      - kafka
    environment:
      - KAFKA_INIT_GATE_COUNT=${KAFKA_INIT_GATE_COUNT:-8}
      - KAFKA_INIT_SCENE_COUNT=${KAFKA_INIT_SCENE_COUNT:-16}
      - KAFKA_INIT_CENTRE_COUNT=${KAFKA_INIT_CENTRE_COUNT:-4}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        # Wait for broker to accept connections
        for i in $$(seq 1 30); do
          if /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1; then
            echo "kafka broker is ready"
            break
          fi
          echo "waiting for kafka broker ($$i/30)..."
          sleep 2
        done
        create_topic() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$1" --partitions 1 --replication-factor 1 \
            >/dev/null 2>&1 && echo "  created: $$1" || echo "  exists : $$1"
        }
        echo "Pre-creating per-node topics..."
        for n in $$(seq 1 $${KAFKA_INIT_GATE_COUNT}); do create_topic "gate-$$n"; done
        for n in $$(seq 1 $${KAFKA_INIT_SCENE_COUNT}); do create_topic "scene-$$n"; done
        for n in $$(seq 1 $${KAFKA_INIT_CENTRE_COUNT}); do create_topic "centre-$$n"; done
        # Shared event topic referenced by base_deploy_config.yaml
        create_topic "game-events"
        echo "Kafka topic init done."
    restart: "no"

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - JAVA_OPTS=${KAFKA_UI_JAVA_OPTS:--Xms128m -Xmx256m}
    deploy:
      resources:
        limits:
          memory: ${KAFKA_UI_MEM_LIMIT:-384M}
          cpus: '${KAFKA_UI_CPU_LIMIT:-0.5}'
    depends_on:
      - kafka

  # Redis service
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    # P0 OOM 防御(2026-06-03 docs/notes/redis-oom-data-safety-qa-record.md):
    #   - maxmemory 8gb         避免撑爆宿主机内存触发 OOM Killer 让所有容器一起死
    #   - allkeys-lfu           满了按 LFU 淘汰冷 key,服务存活;LFU 比 LRU 对游戏 cache
    #                           命中率更高 — 在线玩家高频访问自然保留,冷玩家 cache 优先淘汰
    #   - notify-keyspace-events Eg  开启 evict/expire 事件通知,为后续应用层主动卸载预留
    command: >
      redis-server
      --appendonly yes
      --maxmemory 8gb
      --maxmemory-policy allkeys-lfu
      --notify-keyspace-events Eg
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # ── Redis Cluster(profile: redis-cluster,默认不起)────────────────────
  # match 服务的私有存储(docs/design/cross-zone-matchmaking.md §2 D2 / §7):
  # 3 主 3 从,宿主机 Go 进程直连。默认 `docker compose up` 不会拉起,需要
  #   docker compose -f deploy/docker-compose.yml --profile redis-cluster up -d
  # 并把 go/match/etc/match_service.yaml 的 MatchRedis 指到 127.0.0.1:7000,Type: cluster。
  #
  # 为什么六个节点共用 redis-cluster-0 的网络命名空间(network_mode: service:…):
  #   集群客户端会跟随 MOVED 跳到节点 announce 的地址,所以节点必须 announce
  #   宿主机可达的 127.0.0.1:700N;但 announce 地址同时也是节点之间 gossip 用的
  #   地址,六个容器各自独立网络时 127.0.0.1 指向自己,建群握手必然失败。
  #   Docker Desktop for Windows 又不支持 network_mode: host。共享一个网络命名
  #   空间后,容器内 127.0.0.1:700N 互通、宿主机 127.0.0.1:700N 经端口映射到达
  #   同一个命名空间 —— 两边看到的地址完全一致,MOVED 才能跟得上。
  #   代价是所有端口映射只能写在命名空间的持有者 redis-cluster-0 上。
  redis-cluster-0:
    image: redis:7.2
    container_name: redis-cluster-0
    profiles: ["redis-cluster"]
    ports:
      - "7000:7000"
      - "7001:7001"
      - "7002:7002"
      - "7003:7003"
      - "7004:7004"
      - "7005:7005"
      - "17000:17000"
      - "17001:17001"
      - "17002:17002"
      - "17003:17003"
      - "17004:17004"
      - "17005:17005"
    command: >
      redis-server --port 7000 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
      --cluster-announce-ip 127.0.0.1 --cluster-announce-port 7000 --cluster-announce-bus-port 17000
    volumes:
      - redis-cluster-0-data:/data
    restart: unless-stopped

  redis-cluster-1:
    image: redis:7.2
    container_name: redis-cluster-1
    profiles: ["redis-cluster"]
    network_mode: "service:redis-cluster-0"
    depends_on: [redis-cluster-0]
    command: >
      redis-server --port 7001 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
      --cluster-announce-ip 127.0.0.1 --cluster-announce-port 7001 --cluster-announce-bus-port 17001
    volumes:
      - redis-cluster-1-data:/data
    restart: unless-stopped

  redis-cluster-2:
    image: redis:7.2
    container_name: redis-cluster-2
    profiles: ["redis-cluster"]
    network_mode: "service:redis-cluster-0"
    depends_on: [redis-cluster-0]
    command: >
      redis-server --port 7002 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
      --cluster-announce-ip 127.0.0.1 --cluster-announce-port 7002 --cluster-announce-bus-port 17002
    volumes:
      - redis-cluster-2-data:/data
    restart: unless-stopped

  redis-cluster-3:
    image: redis:7.2
    container_name: redis-cluster-3
    profiles: ["redis-cluster"]
    network_mode: "service:redis-cluster-0"
    depends_on: [redis-cluster-0]
    command: >
      redis-server --port 7003 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
      --cluster-announce-ip 127.0.0.1 --cluster-announce-port 7003 --cluster-announce-bus-port 17003
    volumes:
      - redis-cluster-3-data:/data
    restart: unless-stopped

  redis-cluster-4:
    image: redis:7.2
    container_name: redis-cluster-4
    profiles: ["redis-cluster"]
    network_mode: "service:redis-cluster-0"
    depends_on: [redis-cluster-0]
    command: >
      redis-server --port 7004 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
      --cluster-announce-ip 127.0.0.1 --cluster-announce-port 7004 --cluster-announce-bus-port 17004
    volumes:
      - redis-cluster-4-data:/data
    restart: unless-stopped

  redis-cluster-5:
    image: redis:7.2
    container_name: redis-cluster-5
    profiles: ["redis-cluster"]
    network_mode: "service:redis-cluster-0"
    depends_on: [redis-cluster-0]
    command: >
      redis-server --port 7005 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
      --cluster-announce-ip 127.0.0.1 --cluster-announce-port 7005 --cluster-announce-bus-port 17005
    volumes:
      - redis-cluster-5-data:/data
    restart: unless-stopped

  # 建群一次性任务。幂等:已经 cluster_state:ok 就跳过,重复 up 不会重建。
  # 同样共享 redis-cluster-0 的网络命名空间,所以能直接用节点 announce 的
  # 127.0.0.1:700N 建群(redis-cli 建群时会按 announce 地址握手)。
  redis-cluster-init:
    image: redis:7.2
    container_name: redis-cluster-init
    profiles: ["redis-cluster"]
    network_mode: "service:redis-cluster-0"
    depends_on:
      - redis-cluster-0
      - redis-cluster-1
      - redis-cluster-2
      - redis-cluster-3
      - redis-cluster-4
      - redis-cluster-5
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        nodes=""
        for p in 7000 7001 7002 7003 7004 7005; do
          for i in $$(seq 1 30); do
            if redis-cli -p $$p ping 2>/dev/null | grep -q PONG; then break; fi
            echo "waiting for redis 127.0.0.1:$$p ($$i/30)..."
            sleep 1
          done
          nodes="$$nodes 127.0.0.1:$$p"
        done
        if redis-cli -p 7000 cluster info 2>/dev/null | grep -q '^cluster_state:ok'; then
          echo "redis cluster already formed, skip create"
        else
          redis-cli --cluster create $$nodes --cluster-replicas 1 --cluster-yes
        fi
        # create 返回时 slot 表还在 gossip 传播,立刻查会短暂看到 cluster_state:fail;等到 ok 再报
        for i in $$(seq 1 30); do
          if redis-cli -p 7000 cluster info 2>/dev/null | grep -q '^cluster_state:ok'; then break; fi
          sleep 1
        done
        redis-cli -p 7000 cluster info | grep -E '^cluster_(state|known_nodes|size)'
    restart: "no"

  # MySQL service
  mysql:
    image: mysql:latest
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=Mmorpg#2026db
      - MYSQL_DATABASE=mmorpg
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=apppass123
      - MYSQL_INITDB_SKIP_TZINFO=1  # Avoid Windows timezone config warning
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nacos service (config center / service registry)
  nacos:
    image: nacos/nacos-server:latest
    container_name: nacos
    ports:
      - "8848:8848"  # Service port
      - "9848:9848"  # Client gRPC port
      - "9849:9849"  # Server gRPC port
    environment:
      - MODE=standalone  # Standalone mode (for dev/test)
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
      - NACOS_AUTH_TOKEN=VGhpc0lzQURldk9ubHlUb2tlblN0cmluZ0Zvck5hY29zMzIh
      - SPRING_DATASOURCE_PLATFORM=mysql  # Optional: enable MySQL-backed persistence
      - MYSQL_SERVICE_HOST=mysql  # Connect to the MySQL container above
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos_db  # Dedicated Nacos database
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=Mmorpg#2026db
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      - MYSQL_DATABASE_NUM=1
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-log:/home/nacos/logs
    depends_on:
      mysql:
        condition: service_healthy  # Wait for MySQL to be healthy before starting
    restart: unless-stopped

  # Etcd service (distributed key-value store)
  etcd:
    # bitnami/etcd 2025-08 起从 Docker Hub 下架(Bitnami 商业化调整),
    # bitnamilegacy/ 是官方冻结存档,镜像内容与环境变量语义完全一致。
    image: bitnamilegacy/etcd:latest
    container_name: etcd
    ports:
      - "2379:2379"  # Client communication port
      - "2380:2380"  # Cluster peer communication port
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes  # Disable auth for dev (must enable in production)
      - ETCD_NAME=default
      - ETCD_INITIAL_CLUSTER=default=http://etcd:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_ADVERTISE_CLIENT_URLS=http://${HOST_IP:-127.0.0.1}:2379  # Advertised client URLs
      # ^^^^ Single advertise URL on purpose. Originally we advertised both
      # `etcd:2379` (container hostname, only resolvable inside the compose
      # network) and `host.docker.internal:2379` (resolvable on the host but
      # may map to a stale Docker host-only IP, e.g. 192.168.1.12). Once a
      # client receives the advertised list it auto-syncs against ALL of them
      # — every grpc call ends up serially racing the dial timeout on the
      # broken URLs (~30s each), which made `kv.Get` for the gate node prefix
      # exceed login's 3s ServiceDiscoveryTimeout and surfaced as
      # `DEADLINE_EXCEEDED` in the gateway during the 3-zone × 15000 stress
      # 2026-05. Keeping only the loopback URL makes auto-sync a no-op and
      # restores stable RPC latency.
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379  # Listen on all interfaces for client connections
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380  # Listen on all interfaces for peer communication
    volumes:
      - etcd-data:/bitnami/etcd/data  # Persistent data volume
    restart: unless-stopped

volumes:
  kafka-data:
  redis-data:
  # Redis Cluster(profile redis-cluster)每节点独立的 nodes.conf + AOF
  redis-cluster-0-data:
  redis-cluster-1-data:
  redis-cluster-2-data:
  redis-cluster-3-data:
  redis-cluster-4-data:
  redis-cluster-5-data:
  mysql-data:
  nacos-data:  # Nacos data persistence
  nacos-log:   # Nacos logs
  etcd-data:   # Etcd data persistence