# 冒烟配置:少量 robot 走 stress 模式验证 登录→分配gate→进场景 全链路
# (dev 联调用;压测请用 robot.yaml)
gateway_addr: "http://127.0.0.1:8081"
zone_id: 1
robot_count: 3
account_fmt: "robot_%04d"
# DevPasswordAuth:密码 = LOGIN_DEV_PASSWORD_SHARED_SECRET 环境变量值(login 启动前设置)
password: "dev-local-secret-2026"
auth_type: "password"
skill_ids: []
table_dir: "../generated/tables"
action_interval: 3
report_interval: 5
mode: "stress"
profile: "stress"
llm:
  enabled: false
  endpoint: ""
  api_key: ""
  model: ""
