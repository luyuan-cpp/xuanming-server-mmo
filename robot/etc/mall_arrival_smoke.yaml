# mall-arrival-smoke 配置:单机器人对「官方商品到账」做端到端冒烟(D-17 首批官方 SKU 的真实 Go↔Java↔C++ 闭环;
# 场景实现见 robot/mall_arrival_smoke_scenario.go,模拟付款器见 robot/commerce_mock_payer.go)
#
# 流程:A1 登录进场
#       → A2 清理遗留:同一 SKU 没付款的单逐个取消;已付款还在发货的单等它发完
#       → A3 记下背包里 item_config_id 的数量
#       → A4 ListOfficialSkus 查到 sku_id
#       → A5 CreateOfficialOrder 待付款 / 官方单 / 买家是自己 / 金额 = 单价 × 份数;同一请求号重发拿回同一张单
#       → A6 GetCommerceOrder 仍待付款
#       → A7 试图覆盖金额被新mock接口400拒绝，原买家/金额/待付款不变；只发原订单+稳定请求号付款并重放
#       → A8 轮询到 DELIVERED(退款中 / 人工 / 已取消都判失败)
#       → A9 背包正好 +count_per_unit × quantity
#       → A10 再等三拍:数量不变、订单仍已发货(不重复发货)
#       → A11 下线重登:数量仍在(已发货回执要求玩家 SQL 已提交)。
#
# 前置(缺一条就会失败,原因写进 MALL_ARRIVAL_SMOKE_FAIL 的 reason):
#   1. 本机全栈按 tools/scripts/start_game.ps1 起好(路由服模式 GATE_CLIENT_RPC_ROUTER=1;本冒烟不用 GM 指令),
#      robot login-test 基线正常。go/db 的 Fencing.Mode 必须是 dual(2026-10-18 起缺省就是;启动日志
#      "player row fencing: mode=dual" 是核对依据):trade 只认玩家 SQL 提交证据,legacy 下发货腿永远待定,A8 超时。
#   2. 商城java/mall_game由root单独准入启动在127.0.0.1:18120；start_game当前不自动装配商城。
#      使用一个独立的新商城库(不是游戏库)：
#        - 新库上先执行 java/mall_game/src/main/resources/db/schema.sql(全新安装只跑这一份;它不是幂等的,
#          已装过的库不要再跑),再执行 robot/etc/mall_arrival_smoke_seed.sql(可重复执行);
#        - 环境变量:COMMERCE_RUN_MODE=dev、COMMERCE_REQUIRE_TIDB=false(用本机 MySQL 时;接 TiDB 可不设)、
#          COMMERCE_JDBC_URL / COMMERCE_DB_USER / COMMERCE_DB_PASSWORD、
#          COMMERCE_MOCK_PAYMENT_ENABLED=true，COMMERCE_ALLOWED_PAYMENT_CHANNELS保持空；
#          COMMERCE_GATEWAY_SECRET / COMMERCE_PAYMENT_SECRET / COMMERCE_DELIVERY_SECRET(三把互不相同、各 ≥ 32 字节;
#          **不配 delivery 密钥,trade 的发货 poll 永远 401**)。
#   3. trade 按下面两处改动重启(只改本机运行用的那份 go/trade/etc/trade.yaml,改完别提交):
#        AssetOp.Enabled: true、Mall.URL: "http://127.0.0.1:18120";
#      trade 进程的环境变量 COMMERCE_GATEWAY_SECRET / COMMERCE_DELIVERY_SECRET 与商城同值,
#      MMORPG_ASSET_OP_SECRET_TRADE 与 scene 同值(start_game.ps1 注入的本机开发值)。
#   4. 运行 robot 的终端里设 COMMERCE_PAYMENT_SECRET,与商城同值(密钥只从环境变量读,不写进本文件)。
#   5. robot_9925 的主背包能再放下 count_per_unit × quantity 瓶物品 10(可叠加到 999;全新账号没问题)。
#      前缀必须是 robot_ 才会命中 login 侧 DevPasswordAuth;9921-9922 归摆摊冒烟、9931-9934 留给人民币寄售冒烟,别占。
#   6. 从 robot/ 目录运行(table_dir 是相对路径)。
#
# 用法(robot/ 目录下):
#   $env:COMMERCE_PAYMENT_SECRET = '<与商城相同的 dev 值>'; .\robot.exe -c etc/mall_arrival_smoke.yaml
# 退出码 0 = 全部断言通过(日志有 MALL_ARRIVAL_SMOKE_OK player_id=… order_id=… 一行);
# 退出码 1 = 任一步失败(MALL_ARRIVAL_SMOKE_FAIL step=… reason=…)。每步通过另有一行 [mall-arrival-smoke] PASS step=…。
# 正常一轮 20~30 秒(trade 每秒 poll 一次商城;A10 固定多等 3 秒,A11 重登约 5 秒)。
#
# 可重复运行：每轮新下单请求号，mock付款号只由原订单派生，未知结果不换号；未付单在A2按原单取消，
#   已付款还在发货的单在 A2 等它发完再测本轮,所以不会把上一轮的到账算进本轮增量。每轮会给 robot_9925 多留 2 瓶物品 10。
#
# 本冒烟不覆盖真实支付渠道、退款与取消后迟到付款、跨地域部署。新mock提供方原件/OMS提交窗口和退款恢复
# 另由商城MockPaymentStoreTest/MockPaymentHttpTest验证；不能因本驱动通过就称真实渠道上线。

gateway_addr: "http://127.0.0.1:8081" # Gateway HTTP endpoint(/api/assign-gate)
zone_id: 1 # 目标 zone
robot_count: 1 # 本模式固定单机器人(校验拒绝其它值)
account_fmt: "robot_%04d" # 保留骨架字段;本模式用固定账号 robot_9925
password: "123456"
skill_ids: [] # 本模式不放技能
table_dir: "../generated/tables"
action_interval: 3 # 本模式不跑场景 AI 循环,保留默认
report_interval: 5

mode: "mall-arrival-smoke"

mall_arrival_smoke:
  run_mode: "dev" # 必须显式写 dev:模拟付款器只许连本机商城
  mall_url: "http://127.0.0.1:18120" # 只允许 http://<字面量回环 IP>:<端口>
  payment_subject: "payment-adapter" # 与商城 COMMERCE_PAYMENT_SUBJECT 一致(商城缺省值)
  channel: "mock" # 固定本地事实适配器；请求体不带渠道，不配置mock-dev白名单
  sku_id: 990001 # 与 etc/mall_arrival_smoke_seed.sql 一致
  quantity: 1
  item_config_id: 10 # 种子脚本里 sku 990001 的发放物品
  count_per_unit: 2 # 种子脚本里每份发放数量
  deliver_timeout_seconds: 90 # 付款后等已发货的上限
  poll_interval_ms: 1500 # 轮询订单状态的间隔(不低于 1100:几个商城消息号还没进 MessageLimiter 表,吃 gate 默认 3 次/秒)

auth_type: "password"
