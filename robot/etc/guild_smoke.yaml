# guild-smoke 配置:三个机器人对公会服务 go/guild 做「按 zone 隔离」端到端冒烟
# (docs/design/guild-zone-client-access.md §6)
#
# 流程:A 建帮(请求体 zone 填错)→ 帮会落在 zone_a → A 重复建帮被拒 → B 在本区榜上看到
#       → C(zone_b)看不见 / 查不到名次 / 加不进 / 同名被拒 → B 未入帮改公告被拒 → B 加入
#       → A 改公告、B 读到;超长公告被拒 → B 伪造 player_id=A 退帮,服务端按会话让 B 退出
#       → A 直调 UpdateGuildScore 收到 kServiceUnavailable、随后查榜积分不变 → A 解散。
#       验收同时核对路由服该方法 code=PermissionDenied 日志;超时不能算通过。
#
# 前置(缺一条就会失败,原因写进 GUILD_SMOKE_FAIL 的 reason):
#   1. gate 以 GATE_CLIENT_RPC_ROUTER=1 启动(路由服模式);guild 的客户端入口只承诺路由服模式。
#      start_game.ps1 默认已开;cross_zone=true 时两个 zone 的 gate 都要开。
#   2. client_rpc_router、data_service、guild 已起(guild 全局一份即可);proto 已按本次改动重生成
#      (gate 白名单 / 路由表里 GuildService 为客户端协议),gate 与路由服已换上新二进制。
#   3. MessageLimiter / Tip 表已导出,gate 已重启(否则公会消息号吃默认 3 次 / 窗口限速)。
#   4. robot_9201 / 9202 首次在 zone_a 建角、robot_9203 首次在 zone_b 建角(归属区映射在建角时登记);
#      之前在别的区登录过的账号,第 1 步"帮会落区"断言会失败。
#   5. 从 robot/ 目录运行(table_dir 是相对路径)。
#
# 用法(robot/ 目录下):
#   .\robot.exe -c etc/guild_smoke.yaml
# 退出码 0 = 全部断言通过(日志有 GUILD_SMOKE_OK guild_id=… 一行);退出码 1 = 任一步失败(GUILD_SMOKE_FAIL step=…)。
# 可重复运行:预备段先把三个账号带出任何帮会,帮名带随机后缀。
#
# 经济段(economy: true,帮会二期 B5c,robot/guild_economy_smoke.go):GUILD_SMOKE_OK 之后由 robot_9214(帮主)
# 与 robot_9215(成员)在 zone_a 另建帮会跑 捐献 → 升级 → 兑换,通过打印 GUILD_ECONOMY_SMOKE_OK mode=full|degraded。
#   额外前置:guild 的 AssetOp.Enabled=true(关着时经济写 RPC 一律回 kGuildAssetPending);scene 为 dev 运行模式、
#   GM 客户端消息放行(cpp/nodes/gate/SECURITY.md §3);robot_9214 / 9215 首次在 zone_a 建角。
#   次数按玩家按游戏日(UTC+8 05:00)记、解散清不掉:同一游戏日首跑为 full,再跑为 degraded(只断言拒绝类)。
#
# 活动段(activities: true,帮会二期 B6a-cli / B6b-cli,robot/guild_activity_smoke.go):经济段之后由 activity_accounts 的四个账号
# (依次为帮主 A、成员 B / C / D)在 zone_a 另建帮会跑 元宵灯会 / 中秋团圆(docs/design/guild-phase2/06-activities.md §6.44 的 S1–S8),
# trial: true 时接着跑同道历练(S9–S15)。
# 通过打印 GUILD_SMOKE_ACTIVITIES_OK guild_id=…;失败打印 GUILD_SMOKE_ACTIVITIES_FAIL step=Sx reason=…,退出码 1。
#   额外前置:
#   a. robot_9216 / 9217 / 9218 / 9219 首次在 zone_a 建角(同第 4 条:归属区映射在建角时登记)。
#   b. 默认配表:GuildActivity 三行常开(灯会 帮贡 20 / 资金 500 / 阈值 3 / 每日 1;团圆 帮贡 30 / 阈值 3 / 物品 1 ×4 / 每日 1),
#      GuildRule.activity_join_min_hours=0(开发值;填了非 0,刚入帮的机器人一律被拒,S1 会报 kGuildActivityJoinTooRecent)。
#   c. 团圆带物品奖励:guild 的 AssetOp.Enabled=true(关着时领奖回 kGuildAssetPending,S6 失败并提示)。
#   d. 活动 5 个消息号的 MessageLimiter 行已回填并重新导表、gate 已重启(06 §6.46 B6a-srv 第 3 步)。
#   可重复性:个人次数按玩家按游戏日(UTC+8 05:00)记、解散清不掉,同一游戏日重跑会在 S1 失败,
#   reason 以 same-game-day-rerun 开头并带上填好 player_id 与日期的整条 SQL。重跑前只对这四个账号执行:
#     DELETE FROM mmorpg_guild.guild_daily_counter WHERE player_id IN (<4 个 player_id>) AND counter_kind=3 AND period_key=<今天的游戏日 YYYYMMDD>;
#   (帮会进度行由预备段的解散删掉;冒烟本身不碰数据库。历练的个人次数也是 counter_kind=3,同一条 SQL 一并清掉。)
#
# 同道历练(trial: true,S9–S15):A 邀请 B、C → 两人同意 → 三人开战并自动打完 → 断言结算(三人帮贡各 +50、资金 +300、
# 今日计资金胜场 1、物品 1 各 +4;阵亡也得奖,只有逃跑者不得)→ D 拒绝邀请 → 邀请已下线的 D / 名单只有自己 / 名单不含自己 被拒。
#   额外前置:
#   e. guild 的历练是开着的:guild.yaml 配了 MatchRpc,且 Activity.TrialResult.Enabled: true、Kafka.Brokers 非空
#      (缺哪样 guild 启动日志里有一行原因;没开时 S1 会报"历练=DISABLED")。
#   f. proto 已按 B6b 重生成(guild_db 的两张历练表、match_internal),MySQL 已建出 guild_trial_battle / guild_trial_reward_owed;
#      match(带 MatchInternal.StartActivityBattle)与 battle 节点(带活动结果回显)已换上新二进制,Kafka topic match-results 可用。
#   g. 默认配表:GuildActivity 历练行(帮贡 50 / 资金 300 / 每日计资金胜场 3 / 每人每日 2 次 / 2–5 人 / 副本 1 / 物品 1 ×4),
#      GuildRule.trial_invite_ttl_seconds=30、trial_invite_cooldown_seconds=10(S12 之前会等过这 10 秒冷却)。
#      历练的 2 个消息号已含在 d 的 5 个里。
#   上一轮中途失败会留下两样会自己过期的状态,等一等再跑:邀请房间(至多 30 秒,期间建房回 [busy, …])、
#   没打完的对局的 battle:lock(结算后释放,期间开战回 [in_battle, …])。
#   trial: false = 只跑 S1–S8,并期望历练卡片为"未开放";被测 guild 没配历练依赖(上面的 e)时用它。
#   trial 必须与 guild 的部署一致,不一致时在 S1 失败并说明原因。

gateway_addr: "http://127.0.0.1:8081" # Gateway HTTP endpoint(/api/assign-gate)
zone_id: 1 # 本模式不用此字段选区(A/B 登 guild_smoke.zone_a,C 登 zone_b)
robot_count: 3 # 语义占位:本模式固定 A/B/C 三个机器人
account_fmt: "robot_%04d" # 保留骨架字段;本模式用固定账号 robot_9201/9202/9203
password: "123456"
skill_ids: []
table_dir: "../generated/tables"
action_interval: 3
report_interval: 5

mode: "guild-smoke"

guild_smoke:
  cross_zone: true # false = 只跑同区步骤(不登录 C,跳过第 4 步)
  zone_a: 1 # A(帮主)与 B(成员)登录的 zone
  zone_b: 2 # C 登录的 zone;cross_zone=true 时必须与 zone_a 不同
  economy: true # 经济段;缺省账号 economy_leader=robot_9214、economy_member=robot_9215
  activities: true # 活动段(灯会 / 团圆,S1–S8)
  activity_accounts: [robot_9216, robot_9217, robot_9218, robot_9219] # 帮主 A、成员 B / C / D;必须四个且互不相同
  trial: true # 同道历练段(S9–S15);guild 没配历练依赖(MatchRpc / 历练结果消费)时改 false

auth_type: "password"
