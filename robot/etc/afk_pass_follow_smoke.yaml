# afk-pass-follow-smoke 配置:挂机月卡开通入口 + 离线托管跟随的端到端冒烟(docs/design/afk-monthly-card.md §8)
#
# 流程:P0 两人登录、清队伍、B 清月卡 → P1 B 用 GM 补灵石、开通月卡,同键重发只生效一次,再把剩余缩到 20 分钟
#       → P2 A 建队、B 入队 → P3 B 关 TCP 断线,40 秒内 A 视野里的 B 不消失(离线托管)
#       → P4 A 走一段,B 跟在身后约 3 米 → P5 A 换线,同节点、跨节点各成功一次,每次 B 都跟过去并继续沿路跟
#       → P6 B 重登回到 A 身边,月卡到期与 P1 设定的一致 → P7 B 清月卡、A 解散。
#
# 前置(缺一条就会失败,原因写进 AFK_PASS_FOLLOW_SMOKE_FAIL 的 reason):
#   1. scene 是含挂机月卡开通入口的二进制,且以 SCENE_RUN_MODE=dev 启动(GmSetAfkPass / GmAddCurrency 才放行;
#      start_game.ps1 默认设 dev);AfkPassRule 表已导出。
#   2. 同一 zone 至少两个 scene 节点,机器人起步的大世界地图配至少 3 条分线(scene_manager WorldChannelCountByConfId),
#      两个节点上都有这张地图的线 —— 否则 P5 覆盖不到「同节点」「跨节点」两种换线。
#   3. gate 以 GATE_CLIENT_RPC_ROUTER=1 启动,match(含 team)、player_locator、scene_manager 在跑;玩家域 Redis 已连接
#      (月卡投影写在那里,player_locator 靠它给断线会话续租)。
#   4. robot_9307 / robot_9308 起步在同一张地图(新号默认如此);出生点四周至少一个方向能走出 4 以上。
#
# 用法(robot/ 目录下):
#   .\robot.exe -c etc/afk_pass_follow_smoke.yaml
# 退出码 0 = 全部断言通过(日志有 AFK_PASS_FOLLOW_SMOKE_OK team_id=… 一行);退出码 1 = 任一步失败。
# 中途失败时 B 可能还在世界里被托管:P1 已把它的月卡缩到 20 分钟,最晚 20 分钟后自然退出;急着重跑就让 B 登录一次再登出。

gateway_addr: "http://127.0.0.1:8081" # Gateway HTTP endpoint(/api/assign-gate)
zone_id: 1 # A、B 都登录这个 zone
robot_count: 2 # 语义占位:本模式固定 A / B 两个机器人
account_fmt: "robot_%04d" # 保留骨架字段;本模式用固定账号 robot_9307 / robot_9308
password: "123456"
skill_ids: []
table_dir: "../generated/tables"
action_interval: 3 # 本模式不跑场景 AI 循环,保留默认
report_interval: 5

mode: "afk-pass-follow-smoke"

auth_type: "password"
