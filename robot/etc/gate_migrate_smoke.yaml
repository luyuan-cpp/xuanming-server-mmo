# gate-migrate-smoke 配置:gate 排空迁移的端到端冒烟
# (C++ 仓 docs/design/gate-drain-session-migration.md §11;到达侧的断线保留见 docs/design/player-connection-lost-hold.md;
#  场景实现见 robot/gate_migrate_smoke_scenario.go)
#
# 流程:G1 robot_9961 ~ robot_9964 登录进场,各自记下所在 gate(地址、节点号与 zone)、所在场景与自己的 actor 号
#       → G2 打印每台 gate 上有几个机器人、它的排空标记键和一条打标记的命令(日志行 GATE_MIGRATE_SMOKE_WAITING),
#          等人去执行,最多等 5 分钟
#       → G3 被排空那台 gate 上的机器人全部收到 msg 124、换到别的 gate、重新登录进场:场景号与 actor 号都不变
#          (断线保留接回的是同一个实体),没有收到踢线推送 34;从第一条 124 起 60 秒内必须全部迁完
#       → G4 别的 gate 上的机器人没收到 124、gate 没变、没有再次进场
#       → G5 迁走的机器人在新连接上发 SceneInfoC2S 有应答(NotifySceneInfo),心跳继续有回包
#
# 前置(缺一条就会失败,原因写进 GATE_MIGRATE_SMOKE_FAIL 的 reason):
#   1. 这个 zone 至少有两台 gate 在跑(本地:pwsh -File tools/scripts/dev_tools.ps1 -Command dev-start -GateCount 2)。
#      只有一台时 login 找不到迁移目标(NO_TARGET),G3-mark 等到超时。四个机器人全落在同一台 gate 上时 G4 没有可查的对象,
#      日志有一行 WARN,其余步骤照常。
#   2. gate 签发票据:本地 bin/etc/base_deploy_config.yaml 与 login 都配了 GateTokenSecret。迁移票据就是 gate 登录票据,
#      空密钥 dev 直通时签不出来。
#   3. login 的 GateDrain.Interval > 0 且 GateDrain.Migrate.Enabled=true(两项缺省都满足),并且 login 的 goctl 包装已含
#      RequestGateMigration(先跑过 go/build.ps1)。包装没重新生成时 gate 每次要票都得到 UNIMPLEMENTED,表现同样是 G3-mark 超时。
#   4. gate、scene 是带排空迁移与断线保留的版本(2026-11-10 起)。没有断线保留的话 G3-resume 会报 actor 号变了。
#   5. robot_9961 ~ robot_9964 没有别的进程同时在登,也不在任何队伍里。前缀必须是 robot_ 才会命中 login 侧 DevPasswordAuth。
#   6. 从 robot/ 目录运行(table_dir 是相对路径)。
#   7. robot 的 vendor 已刷新(robot/ 目录下 go mod vendor):本场景引用 shared/gatepick 取排空标记的键名,
#      vendor 里没有这个包时 robot 编不过。
#
# 用法(robot/ 目录下):
#   .\robot.exe -c etc/gate_migrate_smoke.yaml
# 看到 GATE_MIGRATE_SMOKE_WAITING 一行之后,在另一个终端按那一行给出的命令给其中一台 gate 打排空标记。
# 标记要写到 login 读 gate 标记的那个 Redis。键名由 robot 按 shared/gatepick 的定义算好、打在每台 gate 那一行的
# draining_key 里(键按 gate 所在的 zone 打 hash tag,带花括号,命令行里要用单引号括起来),照抄即可。本地 compose 的写法:
#   docker exec redis redis-cli SET '<draining_key>' <当前 Unix 秒> EX 600
# 那个 Redis 是集群时 redis-cli 要加 -c。值必须是 Unix 秒,必须带 EX:login 用值算已等待多久;不带 TTL 的标记
# 会让这台 gate 一直不接新玩家,login 也不会给它写「已排空」(并打 ERROR)。
# K8s 环境用 tools/scripts/k8s_gate_drain.ps1 打标记(不带 -DeletePod 时只排空、不删 Pod)。
#
# 退出码 0 = 全过(日志有 GATE_MIGRATE_SMOKE_OK drained_gate=… migrated=… stayed=… slowest_ms=… 一行);
# 退出码 1 = 任一步失败(GATE_MIGRATE_SMOKE_FAIL step=… reason=…)。每步通过另有一行 [gate-migrate-smoke] PASS step=…。
# 打完标记后约 30 秒跑完。跑完按日志最后一行的命令清掉标记(DEL 排空键与已排空键),
# 否则这台 gate 在标记的 TTL 内不接新玩家,下一轮冒烟的机器人会全部落到别的 gate 上。
# 服务端日志应能对上:
#   login:[GateDrain] gate <id>: migration lease sent (online=… rate=… lease=…ms drain_marked_at=…);
#   gate :[DrainMigration] started … 与每条连接的迁移结果;连接在推出 124 之后 60 秒内由客户端自己断开或被 gate 收尾关闭;
#   scene:[ConnectionLostHold] holding player … 与 resumed by a new session。
# gate 的迁移指标(设了 MMORPG_METRICS_PORT 才导出):gate_drain_migration_total{result="pushed"} 应等于迁走的机器人数。
# 失败排查:某个机器人卡在哪一步写在 reason 的括号里;跟随 msg 124 本身失败的细节在同一份日志里搜
#   `follow gate redirect failed`(pkg.FollowRedirect 失败只打日志)或 `redirect ignored`。

gateway_addr: "http://127.0.0.1:8081" # Gateway HTTP endpoint(/api/assign-gate)
zone_id: 1 # 目标 zone
robot_count: 4 # 语义占位:本模式固定 4 个机器人(robot_9961 ~ robot_9964)
account_fmt: "robot_%04d" # 保留骨架字段;本模式用固定账号段
password: "123456"
skill_ids: [] # 本模式不放技能
table_dir: "../generated/tables"
action_interval: 3 # 本模式不跑场景 AI 循环,保留默认
report_interval: 5

mode: "gate-migrate-smoke"

auth_type: "password"
