name: C++ 构建门禁

# 这个 workflow 存在的理由：
#   在此之前 C++ 侧唯一的 CI 是 include-cleaner-ci.yml，而它**只查头文件
#   卫生（clang-tidy misc-include-cleaner），一行代码都不编译**。也就是说
#   cpp/nodes/gate、cpp/nodes/scene 以及 cpp/libs/** 的编译错误在 PR 阶段
#   完全不会被发现，要等有人手跑 tools/scripts/build_linux.sh 或者 Docker
#   镜像构建才暴露。本 workflow 把「能不能编译」这件事拉进门禁。
#
# ── 分层与取舍（重要，别删）─────────────────────────────────────────────
# 完整编译的依赖极重：deploy/k8s/Dockerfile.cpp 的 deps 阶段要从源码编
# gRPC v1.83.0（连带 protobuf v35.1 / BoringSSL / abseil），Dockerfile 自
# 己的注释写着「首次构建 ~30–60 min」，后面还有 muduo / librdkafka / redis /
# yaml-cpp / zlib，再往后才是 cpp/generated/proto 这堆巨型生成物。
# 而且 cpp/generated 的 protobuf 版本硬校验（7035001）钉死了必须用这一套
# 自编 gRPC，apt 的 libgrpc++-dev 版本对不上，换不了轻量路线。
#
# 所以拆成两层：
#   1) build-script-contract —— 每个 PR 都跑，秒级。校验构建脚本本身与工程
#      清单没有漂移（新增/改名 cpp 子工程忘了同步 build_linux.sh 的
#      LIB_PROJECTS/EXE_PROJECTS，是这个仓库真实发生过的漂移形态）。
#      2026-08-10 已在本地实测通过。
#   2) compile-nodes —— 真编译 gate + scene（Dockerfile.cpp 的 builder 阶段
#      产物就是 bin/gate 与 bin/scene）。默认**不挂在每个 PR 上**，只在
#      定时（每日）、手动、以及 PR 打上 `cpp-full-build` 标签时跑。
#
# 为什么 compile-nodes 暂时不阻塞 PR：
#   落这个文件时无法在本机验证它能在 GitHub runner 上跑绿——本机是
#   Windows，跑不了 Linux 全量构建，也没法预估 runner 的磁盘/时长/GHA 缓存
#   10GB 上限是否扛得住 gRPC 那一层。把一个没验证过的重型 job 直接设成
#   必过项，最可能的结果是流水线长期红，然后所有人学会无视它——那比没有
#   门禁更糟。正确顺序是：先让它按 push/定时跑，确认连续绿之后，把
#   compile-nodes 的 `if:` 里 `github.event_name != 'pull_request' ||`
#   那半句删掉，它就变成每个 cpp PR 都跑的阻塞门禁（一行改动）。
#
# include-cleaner-ci.yml 的定位随之下调：它现在是**附加检查**（头文件卫
# 生），不再是 C++ 侧唯一的 CI。

on:
  push:
    branches: [main]
    paths:
      - "cpp/**"
      - "third_party/**"
      - "tools/scripts/build_linux.sh"
      - "tools/archived/vcxproj2cmake.py"
      - "tools/archived/setup_dependencies.sh"
      - "deploy/k8s/Dockerfile.cpp"
      - ".github/workflows/cpp-build-ci.yml"
  pull_request:
    branches: [main]
    # labeled 也要触发：compile-nodes 靠 `cpp-full-build` 标签开启，
    # 默认的 opened/synchronize/reopened 三种类型不含"事后打标签"。
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "cpp/**"
      - "third_party/**"
      - "tools/scripts/build_linux.sh"
      - "tools/archived/vcxproj2cmake.py"
      - "tools/archived/setup_dependencies.sh"
      - "deploy/k8s/Dockerfile.cpp"
      - ".github/workflows/cpp-build-ci.yml"
  schedule:
    # UTC 18:00 = 北京时间次日 02:00。每天一次全量编译，
    # 保证「今天 main 还能不能编出 gate/scene」有确定答案。
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 层 1：构建脚本 + 工程清单契约（每个 PR，秒级）──────────────────────
  build-script-contract:
    name: 构建脚本与工程清单契约
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 不要 submodules：这一层只读仓库自己的文件，
      # third_party 的子模块（尤其 grpc）拉下来要好几分钟。
      - uses: actions/checkout@v4

      - name: bash 语法检查 build_linux.sh
        run: bash -n tools/scripts/build_linux.sh

      - name: 工程清单与文件系统对账
        shell: bash
        run: |
          set -euo pipefail

          # build_linux.sh 的 --dry-run 只打印不执行（第 113~119 行的 run()
          # 与 buildproject() 都有 DRY_RUN 分支），所以在没有任何依赖的
          # runner 上也能跑，且不会改动工作区。
          # 它的输出里每个工程有一行：
          #   [dry-run] cmake -S <dir> -B <dir>/.build -DCMAKE_BUILD_TYPE=...
          bash tools/scripts/build_linux.sh --dry-run | tee /tmp/dryrun.log

          sed -n 's/^\[dry-run\] cmake -S \([^ ]*\) .*/\1/p' /tmp/dryrun.log \
            | sort -u > /tmp/projects.txt

          COUNT=$(wc -l < /tmp/projects.txt)
          echo "工程清单共 $COUNT 项"
          # 2026-08-10 实测是 16 项（14 个 LIB_PROJECTS + 2 个 EXE_PROJECTS）。
          # 这里只做"非空"下限校验，不钉死数量——加子工程是正常演进，
          # 钉死数字只会制造无意义的红。
          if [ "$COUNT" -lt 10 ]; then
            echo "::error::只解析出 $COUNT 个工程，--dry-run 的输出格式可能变了，本检查已失效"
            exit 1
          fi

          MISSING=0
          while read -r d; do
            if [ ! -f "$d/CMakeLists.txt" ]; then
              echo "::error file=tools/scripts/build_linux.sh::$d/CMakeLists.txt 不存在——build_linux.sh 的工程清单与仓库结构已漂移"
              MISSING=1
            fi
          done < /tmp/projects.txt
          [ "$MISSING" -eq 0 ] || exit 1

          {
            echo "### build_linux.sh 工程清单（$COUNT 项，CMakeLists.txt 均存在）"
            sed 's/^/  - `/; s/$/`/' /tmp/projects.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 非法参数必须被拒绝
        shell: bash
        run: |
          # build_linux.sh 对未知 flag 应当 exit 2。这条防的是有人重构参数
          # 解析时把兜底分支写丢，导致 Dockerfile 里拼错的 flag 被静默忽略
          # （--skip-deps 被吞掉的后果是在 Docker 里跑 git submodule 然后炸）。
          # runner 的默认 shell 带 -e，这里必须临时关掉才能取到退出码。
          set +e
          bash tools/scripts/build_linux.sh --definitely-not-a-flag >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "::error::未知参数应返回 2，实际返回 $rc"
            exit 1
          fi

  # ── 层 2：真编译 gate + scene ──────────────────────────────────────────
  compile-nodes:
    name: 真编译 gate + scene (Linux)
    # 默认不阻塞 PR，理由见文件头。确认连续绿之后，把下面这行的
    # `github.event_name != 'pull_request' ||` 去掉即可变成 PR 阻塞门禁。
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'cpp-full-build')
    runs-on: ubuntu-latest
    # gRPC 冷编译 30–60 min，再加游戏节点本体；给足余量。
    timeout-minutes: 240
    steps:
      - name: 释放磁盘空间
        # ubuntu-latest 默认镜像预装了 Android SDK / .NET / GHC 等，
        # 占掉十几 GB。gRPC 源码 + 构建中间产物 + Docker 层很容易把
        # 根分区撑爆，报错形式是莫名其妙的 "no space left on device"。
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/checkout@v4
        with:
          # Dockerfile.cpp 的 builder 阶段 COPY 的是这些子模块的工作区内容，
          # 不是 git 里的 gitlink，所以必须先把它们 checkout 出来。
          # 刻意不用 `submodules: recursive`：
          #   * third_party/grpc 与 third_party/openssl 已被 .dockerignore
          #     排除（gRPC 由 Dockerfile 内部按固定 revision 自己 clone），
          #     递归拉下来是几 GB 的纯浪费；
          #   * cpp/libs/engine/muduo_windows/src/... 是 Windows 专用；
          #   * client/unity 是客户端仓库，与本次编译无关。
          submodules: false

      - name: 初始化编译所需子模块
        shell: bash
        run: |
          set -uo pipefail
          # 清单来源：deploy/k8s/Dockerfile.cpp 里 deps 阶段与 builder 阶段
          # 的 COPY third_party/<name>/ 行。改 Dockerfile 的 COPY 时要同步这里。
          # third_party/lua 不在这里：它是在树内的普通目录，不是子模块。
          SUBMODULES=(
            third_party/muduo-linux
            third_party/redis
            third_party/librdkafka
            third_party/yaml-cpp
            third_party/zlib
            third_party/boost
            third_party/entt
            third_party/fmt
            third_party/spdlog
            third_party/xxhash
            third_party/sol2
            third_party/cppcodec
            third_party/exprtk
            third_party/hexagons_grids
            third_party/ue5navmesh
            third_party/recastnavigation
          )
          # --depth 1 省下几个 GB，但子模块钉的 SHA 若不是分支尖端，浅克隆会
          # 报 "fatal: reference is not a tree"。所以浅拉失败就退回全深度，
          # 而不是让整个 job 红在一个纯优化项上。
          if ! git submodule update --init --depth 1 --recursive -- "${SUBMODULES[@]}"; then
            echo "::warning::浅克隆子模块失败，退回全深度拉取"
            git submodule update --init --recursive -- "${SUBMODULES[@]}" || exit 1
          fi
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: docker build --target builder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/k8s/Dockerfile.cpp
          # builder 阶段跑完就等于 bin/gate 与 bin/scene 都已产出并被
          # build_linux.sh 的第 6 步校验过存在且可执行；不需要再走
          # runtime 阶段，省一层镜像组装时间。
          target: builder
          push: false
          load: false
          # 用 GitHub Actions 缓存保住 deps 层（gRPC 那一层最贵）。
          # 风险登记：GHA 缓存单仓库上限 10 GB，deps 层未必装得下；
          # 装不下的表现是每次都冷编译（慢，但不会红）。若确认放不下，
          # 改成 ghcr.io 的 registry cache（需要 packages: write 权限）。
          cache-from: type=gha,scope=cpp-builder
          cache-to: type=gha,scope=cpp-builder,mode=max

      - name: 磁盘水位
        if: always()
        run: df -h /
