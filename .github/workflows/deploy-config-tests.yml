name: 部署配置契约测试

# 这个 workflow 存在的理由：
#   服务配置分散在 go/<svc>/etc/*.yaml、deploy/k8s/manifests/**、以及
#   tools/scripts/ 下的一堆部署脚本里。三者之间的一致性（端口、服务名、
#   etcd key、镜像 tag 口径）以前全靠人肉核对，改一处漏两处是这个仓库
#   反复出现的事故形态。tools/scripts/tests/ 下的 pwsh 契约测试就是把
#   这些核对固化下来，本 workflow 负责在 PR 上跑它们。
#
#   顺带补上另一个空洞：仓库里已有的 pwsh 测试从来没被任何 workflow
#   调用过（tools/scripts/test_stress_summarize.ps1 的注释甚至写着
#   "this can wire into CI later"，但一直没 wire）。
#
# ── 测试脚本契约（写测试的人请遵守）───────────────────────────────────
#   * 测试脚本放 tools/scripts/tests/ **一级目录**下，扩展名 .ps1；
#     能被 `pwsh -NoProfile -File <path>` 直接执行，通过 exit 0、
#     失败 exit 非 0（沿用 tools/scripts/tests/lib/test_harness.ps1 的
#     `exit (Complete-TestRun)` 口径，也是 test_stress_summarize.ps1 的口径）
#   * 共享辅助放 tools/scripts/tests/lib/ 子目录（已有 test_harness.ps1 /
#     deploy_capture.ps1）。本 job 只扫一级目录，子目录天然不会被当成用例
#     单独执行；一级目录里的辅助文件请用下划线开头，例如 _fixtures.ps1
#   * 一律用 `pwsh -File` 跑，不走 Pester——这是 test_harness.ps1 自己定的
#     调（"不依赖 Pester，运维机器上装不了模块"），本 job 跟着走
#   * 必须在 Linux pwsh 下可跑：路径用 Join-Path，别写反斜杠字面量。
#     （tools/scripts/test_stress_summarize.ps1 就是反例——它用了
#      `Join-Path $ScriptDir "..\.."`，在 Linux 上反斜杠是普通字符，
#      Resolve-Path 会失败，所以刻意不把它纳入本 job。）

on:
  push:
    branches: [main]
    paths:
      - "tools/scripts/**"
      - "bin/etc/**"
      - "go/*/etc/**"
      - "deploy/k8s/manifests/**"
      - "java/gateway_node/src/main/resources/application.yaml"
      - "deploy/k8s/*.yaml"
      - "deploy/k8s/*.json"
      - "deploy/docker-compose.yml"
      - "go/login/internal/config/config.go"
      - "go/login/internal/logic/pkg/loginqueue/dispatcher.go"
      - "go/login/internal/logic/pkg/loginqueue/queue.go"
      - "go/login/internal/svc/servicecontext.go"
      - "go/mail/internal/metrics/**"
      - "go/rank/internal/metrics/**"
      - "go/match/internal/metrics/**"
      - "go/data_service/data_service.go"
      - "go/data_service/internal/routetoolcli/cli.go"
      - "go/shared/placement/route.go"
      - "go/shared/placement/route_ready.go"
      - "go/data_service/internal/metrics/**"
      - "go/data_service/internal/config/config.go"
      - "go/db/internal/metrics/**"
      - "go/db/internal/kafka/durable_enqueue.go"
      - "go/guild/internal/logic/merge_fence.go"
      - "go/scene_manager/internal/metrics/**"
      - "go/scene_manager/internal/logic/home_zone.go"
      - "java/gateway_node/src/main/java/com/game/gateway/ratelimit/RateLimitProperties.java"
      - ".github/workflows/deploy-config-tests.yml"
      - "deploy/k8s/Dockerfile*"
      - ".dockerignore"
      - "Dockerfile"
      - "robot/Dockerfile"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/scripts/**"
      # C++ node ConfigMap 的权威输入(GateMaxConnections 等)
      - "bin/etc/**"
      # 各 go 服务的运行时配置——契约测试的另一半输入
      - "go/*/etc/**"
      # k8s 清单：端口/服务名/镜像 tag 与 etc/*.yaml 对账的对面
      - "deploy/k8s/manifests/**"
      # MySQL 连接总账(k8s_deploy.ps1 Get-MysqlConnectionLedger)在上面几类之外的输入:Java gateway 的 Hikari 池、
      # zones 配置(zones.json 等)、阈值与规划档同源的告警文件(*-alerts.yaml)。只匹配 deploy/k8s 一级目录
      - "java/gateway_node/src/main/resources/application.yaml"
      - "deploy/k8s/*.yaml"
      - "deploy/k8s/*.json"
      # 本机 / 预发 compose:etcd 的压缩与配额 env 必须与 K8s CronJob 同值、三处 etcd 镜像逐字相同
      # (tools/scripts/tests/etcd_maintenance_contract.tests.ps1)
      - "deploy/docker-compose.yml"
      # 削峰(G4b)契约用例直接读的源码:login 排队配置结构体的 json tag 与缺省值、锁键按 zone 派生(G1b → G4b-2 门禁)、
      # gateway 限流总开关缺省。改这几个文件也要重跑,否则锁键改回「全服一个 leader」或 tag 改名(ConfigMap 写的键被静默忽略)都不会报红
      # 2026-10-15 补 queue.go:用例 15 自当天起还读它(在途占位必须是 G4b-G 的 ZSET 新键)。用例 15 只检查 G1b / G4b-G 的代码形状,
      # 上面「门禁」指代码形状;真正挡住打开排队的是 tools/scripts/k8s_deploy.ps1 的 $script:LoginQueueMergeGateCleared(用例 19–22,
      # 已在 tools/scripts/** 内)
      - "go/login/internal/config/config.go"
      - "go/login/internal/logic/pkg/loginqueue/dispatcher.go"
      - "go/login/internal/logic/pkg/loginqueue/queue.go"
      - "go/login/internal/svc/servicecontext.go"
      # 邮件告警的指标名核对用例(k8s_deploy_contract.tests.ps1「mail-alerts.yaml」)直接读 metrics.go 拼指标全名:
      # 只改这里把指标改了名,告警会静默失效,不重跑就看不出来
      - "go/mail/internal/metrics/**"
      # 排行榜告警同理(「rank-alerts.yaml」用例):rank_* 读 go/rank 的 metrics.go,match_rating_snapshot_* 读 go/match 的
      - "go/rank/internal/metrics/**"
      - "go/match/internal/metrics/**"
      # D1 映射持久化的契约用例直接读的源码:k8s_route_tool.tests.ps1 读 data_service.go 的 -route-tool flag 与 routetoolcli/cli.go 的
      # 子命令集合(白名单要与它逐个对上);k8s_deploy_contract.tests.ps1 读 placement/route.go 的 MaxRouteFenceShards(FenceShards 上限)。
      # 只改这几个 Go 文件时不重跑,新增子命令被 k8s_route_tool.ps1 白名单拒、上限改小后部署仍放行,都要到用时才发现
      - "go/data_service/data_service.go"
      - "go/data_service/internal/routetoolcli/cli.go"
      - "go/shared/placement/route.go"
      # D1 映射与落点告警的指标名 / 标签取值核对(k8s_deploy_contract.tests.ps1「告警引用的指标名与标签取值从 Go 源码核对」两条用例):
      # 拼全名读 data_service / go/db / scene_manager 的 metrics 包与 guild 的 merge_fence.go,verdict 取值读 placement/route_ready.go,
      # reason=home_zone_merging 读 scene_manager 的 home_zone.go。只改这些文件把指标或取值改了名,告警会静默失效
      - "go/shared/placement/route_ready.go"
      - "go/data_service/internal/metrics/**"
      - "go/db/internal/metrics/**"
      - "go/guild/internal/logic/merge_fence.go"
      - "go/scene_manager/internal/metrics/**"
      - "go/scene_manager/internal/logic/home_zone.go"
      # 部署 / 清库脚本照抄的 Go 常量(k8s_deploy_contract.tests.ps1 的「④ Redis 连接总账」与「D1 镜像常量」用例):
      # durable_enqueue.go 的 durableClientPoolSize、data_service config.go 的 WAITAOF 超时上界 / 对账 leader 池与租约 / 发布专用池缺省。
      # 只改 Go 侧不重跑,Redis 总账少算或部署上界与服务拒启上界不一致都要到部署时才发现
      - "go/db/internal/kafka/durable_enqueue.go"
      - "go/data_service/internal/config/config.go"
      - "java/gateway_node/src/main/java/com/game/gateway/ratelimit/RateLimitProperties.java"
      - ".github/workflows/deploy-config-tests.yml"
      # 镜像构建输入:版本注入 / OCI label / 构建上下文排除规则改了,发布契约测试要重跑
      - "deploy/k8s/Dockerfile*"
      - ".dockerignore"
      - "Dockerfile"
      - "robot/Dockerfile"
      # CHANGELOG 段落格式是 make_release.ps1 / release_preflight.ps1 / release.yml 的发布输入
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-config-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pwsh-contract-tests:
    name: tools/scripts/tests (pwsh)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 环境自检
        shell: bash
        run: |
          set -euo pipefail
          # ubuntu-latest runner 预装 PowerShell 7；万一镜像调整导致缺失，
          # 要明确报出来，而不是让整个 job 变成"没测试可跑"的假绿。
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "::error::Runner does not have pwsh; contract tests cannot run"
            exit 1
          fi
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: 执行契约测试
        shell: bash
        run: |
          set -uo pipefail
          DIR=tools/scripts/tests

          if [ ! -d "$DIR" ]; then
            # 测试脚本本体由另一条并行改动落地。workflow 定义先行合入时目录
            # 可能还不存在——此时给 warning 并放行，而不是判红：一个必然红的
            # job 会立刻被所有人加进忽略名单，之后真回归也没人看。
            # 脚本出现后本 job 自动开始真正判红，不需要再改这个文件。
            echo "::warning::$DIR does not exist yet; skipping this run (contract tests will start automatically once the separate change lands)"
            echo "- tools/scripts/tests 尚不存在，跳过" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # -maxdepth 1 是有意的：tests/lib/ 里放的是 test_harness.ps1 /
          # deploy_capture.ps1 这类被 dot-source 的辅助，单独执行没有意义
          # （harness 单跑会报 0 个用例通过）。
          mapfile -t ALL < <(find "$DIR" -maxdepth 1 -type f -name '*.ps1' | sort)
          if [ "${#ALL[@]}" -eq 0 ]; then
            echo "::warning::$DIR has no .ps1 test scripts in its top-level directory yet; skipping this run"
            echo "- tools/scripts/tests 一级目录暂无测试脚本，跳过" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 刻意不做 Pester 分支：tools/scripts/tests/lib/test_harness.ps1 的
          # 头注释已经把话说死了——"不依赖 Pester（运维机器上装不了模块）"。
          # 再加一条按文件名路由到 Invoke-Pester 的分支，只会让某天有人把用
          # 自研骨架的文件命名成 *.Tests.ps1 时被静默送错跑法。统一 `-File`。
          PLAIN=()
          for f in "${ALL[@]}"; do
            case "$(basename "$f")" in
              _*) echo "Skipping helper script $f" ;;
              *)  PLAIN+=("$f") ;;
            esac
          done

          FAILED=()
          for t in ${PLAIN[@]+"${PLAIN[@]}"}; do
            echo "=== $t ==="
            if pwsh -NoProfile -File "$t"; then
              echo "PASS $t"
            else
              echo "::error file=$t::Contract test failed (exit code $?)"
              FAILED+=("$t")
            fi
          done

          # ── 汇总 ────────────────────────────────────────────────────
          RAN=${#PLAIN[@]}
          {
            echo "### 部署配置契约测试"
            echo ""
            echo "- 发现 .ps1：${#ALL[@]}，实际执行：$RAN（其余为下划线辅助脚本）"
            echo "- 失败：${#FAILED[@]}"
            for f in ${FAILED[@]+"${FAILED[@]}"}; do
              echo "  - \`$f\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::error::${#FAILED[@]} contract tests failed"
            exit 1
          fi
          if [ "$RAN" -eq 0 ]; then
            # 全是下划线辅助脚本 = 一个测试都没跑，不能算绿。
            echo "::error::$DIR contains no runnable test scripts (all were skipped as helpers)"
            exit 1
          fi
          echo "All $RAN contract tests passed"
