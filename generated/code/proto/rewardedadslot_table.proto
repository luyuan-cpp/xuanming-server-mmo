
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "RewardedAdSlotTableOuterClass";
option java_multiple_files = true;


message RewardedAdSlotTable {
	uint32 id = 1;
	uint32 enabled = 2;
	uint32 min_level = 3;
	uint32 daily_limit = 4;
	uint32 cooldown_sec = 5;
	uint32 min_watch_sec = 6;
	uint32 session_ttl_sec = 7;
	uint32 currency_type = 8;
	uint64 reward_amount = 9;
	uint32 require_ssv = 10;
	uint32 platform_mask = 11;
}

message RewardedAdSlotTableData {
	repeated RewardedAdSlotTable data = 1;
}