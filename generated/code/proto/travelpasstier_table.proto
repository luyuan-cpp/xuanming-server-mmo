
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "TravelPassTierTableOuterClass";
option java_multiple_files = true;


message TravelPassTierTable {
	uint32 id = 1;
	uint32 pass_id = 2;
	uint32 tier_index = 3;
	uint32 required_points = 4;
	uint32 free_item_id = 5;
	uint32 free_item_count = 6;
	uint64 free_gold = 7;
	string free_cosmetic_key = 8;
	string free_cosmetic_name = 9;
	uint32 premium_item_id = 10;
	uint32 premium_item_count = 11;
	uint64 premium_gold = 12;
	string premium_cosmetic_key = 13;
	string premium_cosmetic_name = 14;
}

message TravelPassTierTableData {
	repeated TravelPassTierTable data = 1;
}