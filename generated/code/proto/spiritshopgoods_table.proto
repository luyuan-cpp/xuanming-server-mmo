
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "SpiritShopGoodsTableOuterClass";
option java_multiple_files = true;


message SpiritShopGoodsTable {
	uint32 id = 1;
	uint32 tab_id = 2;
	uint32 sort_order = 3;
	uint32 enabled = 4;
	string name = 5;
	string description = 6;
	string icon_key = 7;
	uint32 currency_type = 8;
	uint64 price = 9;
	uint32 max_buy_per_request = 10;
	uint32 item_id_1 = 11;
	uint32 item_count_1 = 12;
	uint32 item_bound_1 = 13;
	uint32 item_id_2 = 14;
	uint32 item_count_2 = 15;
	uint32 item_bound_2 = 16;
	uint32 limit_reset_kind = 17;
	uint32 limit_count = 18;
	uint32 limit_group_id = 19;
	uint32 limit_group_weight = 20;
	string badge_text = 21;
}

message SpiritShopGoodsTableData {
	repeated SpiritShopGoodsTable data = 1;
}