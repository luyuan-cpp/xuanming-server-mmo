
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "PetTierTableOuterClass";
option java_multiple_files = true;


message PetTierTable {
	uint32 id = 1;
	string name = 2;
	string art_key = 3;
	string desc = 4;
	uint32 ascend_cost_item_id = 5;
	uint32 ascend_cost_item_count = 6;
	uint64 ascend_cost_gold = 7;
	uint32 ascend_min_pet_level = 8;
	uint32 bonus_entry_points = 9;
}

message PetTierTableData {
	repeated PetTierTable data = 1;
}