
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "TravelPassSeasonTableOuterClass";
option java_multiple_files = true;


message TravelPassSeasonTable {
	uint32 id = 1;
	uint32 enabled = 2;
	string name = 3;
	string description = 4;
	string icon_key = 5;
	string banner_asset_key = 6;
	uint64 starts_at_ms = 7;
	uint64 ends_at_ms = 8;
	uint32 max_points = 9;
	uint32 pve_win_points = 10;
	uint32 hard_or_pvp_win_points = 11;
	uint32 pvp_qualified_other_points = 12;
	uint32 premium_currency_type = 13;
	uint64 premium_price = 14;
	uint32 config_revision = 15;
}

message TravelPassSeasonTableData {
	repeated TravelPassSeasonTable data = 1;
}