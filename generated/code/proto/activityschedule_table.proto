
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "ActivityScheduleTableOuterClass";
option java_multiple_files = true;


message ActivityScheduleTable {
	uint32 id = 1;
	bool enabled = 2;
	uint64 baseline_start_at_ms = 3;
	uint64 baseline_end_at_ms = 4;
	string definition_key = 5;
	uint64 configuration_revision = 6;
	uint32 category = 7;
	string name = 8;
	string description = 9;
	string icon_key = 10;
	uint32 vitality_points = 11;
}

message ActivityScheduleTableData {
	repeated ActivityScheduleTable data = 1;
}