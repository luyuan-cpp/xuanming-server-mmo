
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "EquipAffixQualityTableOuterClass";
option java_multiple_files = true;


message EquipAffixQualityTable {
	uint32 id = 1;
	string name = 2;
	uint32 ratio_pct = 3;
	uint32 apprentice_weight = 4;
	uint32 artisan_weight = 5;
	uint32 master_weight = 6;
}

message EquipAffixQualityTableData {
	repeated EquipAffixQualityTable data = 1;
}