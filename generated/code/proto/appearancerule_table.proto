
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "AppearanceRuleTableOuterClass";
option java_multiple_files = true;


message AppearanceRuleTable {
	uint32 id = 1;
	uint32 card_item_id = 2;
	uint32 card_item_count = 3;
	uint32 trial_duration_seconds = 4;
	uint64 mall_sku_id = 5;
	uint64 mall_price_fen = 6;
	string desc = 7;
}

message AppearanceRuleTableData {
	repeated AppearanceRuleTable data = 1;
}