
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "TournamentRewardTableOuterClass";
option java_multiple_files = true;


message TournamentRewardTable {
	uint32 id = 1;
	uint32 tier_kind = 2;
	uint32 min_rank = 3;
	uint32 max_rank = 4;
	uint64 gold_amount = 5;
	repeated uint32 item_ids = 6;
	repeated uint32 item_counts = 7;
	string title_code = 8;
	string badge_code = 9;
	string mail_title = 10;
	string mail_body = 11;
	string desc = 12;
}

message TournamentRewardTableData {
	repeated TournamentRewardTable data = 1;
}