
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "CosmeticShowcaseTableOuterClass";
option java_multiple_files = true;


message CosmeticShowcaseTable {
	uint32 id = 1;
	string cosmetic_key = 2;
	uint32 slot_kind = 3;
	string name = 4;
	string asset_key = 5;
	string secondary_asset_key = 6;
	uint32 card_item_id = 7;
	uint32 card_item_count = 8;
	uint32 spirit_shop_goods_id = 9;
	uint32 enabled = 10;
	uint32 sort_order = 11;
	string acquire_hint = 12;
	string desc = 13;
}

message CosmeticShowcaseTableData {
	repeated CosmeticShowcaseTable data = 1;
}