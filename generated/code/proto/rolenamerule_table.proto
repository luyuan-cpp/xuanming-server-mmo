
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "RoleNameRuleTableOuterClass";
option java_multiple_files = true;


message RoleNameRuleTable {
	uint32 id = 1;
	uint32 min_chars = 2;
	uint32 max_chars = 3;
	string generated_prefix = 4;
	uint32 generated_suffix_len = 5;
	uint32 max_generate_attempts = 6;
	string desc = 7;
}

message RoleNameRuleTableData {
	repeated RoleNameRuleTable data = 1;
}