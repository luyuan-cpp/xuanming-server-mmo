
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "ZoneGroupTableOuterClass";
option java_multiple_files = true;


message ZoneGroupTable {
	uint32 id = 1;
	uint32 group_id = 2;
	uint32 zone_begin = 3;
	uint32 zone_end = 4;
}

message ZoneGroupTableData {
	repeated ZoneGroupTable data = 1;
}