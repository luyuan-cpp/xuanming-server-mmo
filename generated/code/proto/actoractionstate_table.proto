
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "ActorActionStateTableOuterClass";
option java_multiple_files = true;


message ActorActionStateTable {
	uint32 id = 1;
	uint32 state_id = 3;
	uint32 state_mode = 4;
	uint32 state_tip = 5;
}

message ActorActionStateTableData {
	repeated ActorActionStateTable data = 1;
}