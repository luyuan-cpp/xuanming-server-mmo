
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "BattleProgressionRuleTableOuterClass";
option java_multiple_files = true;


message BattleProgressionRuleTable {
	uint32 id = 1;
	uint64 weekly_silver_soft_cap = 2;
	uint32 diminished_rate_permyriad = 3;
	uint64 weekly_silver_hard_cap = 4;
}

message BattleProgressionRuleTableData {
	repeated BattleProgressionRuleTable data = 1;
}