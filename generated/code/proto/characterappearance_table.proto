
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "CharacterAppearanceTableOuterClass";
option java_multiple_files = true;


message CharacterAppearanceTable {
	uint32 id = 1;
	string appearance_id = 2;
	string name = 3;
	uint32 enabled = 4;
	uint32 sort_order = 5;
	string desc = 6;
	uint32 starter_creatable = 7;
	uint32 card_unlockable = 8;
	uint32 series_id = 9;
	string archive_name = 10;
	string nickname = 11;
	string biography_summary = 12;
	string story_title = 13;
	string story_body = 14;
}

message CharacterAppearanceTableData {
	repeated CharacterAppearanceTable data = 1;
}