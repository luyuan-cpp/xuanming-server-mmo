
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "GuildLevelTableOuterClass";
option java_multiple_files = true;


message GuildLevelTable {
	uint32 id = 1;
	uint32 max_members = 2;
	uint32 max_officers = 3;
	uint64 upgrade_cost_funds = 4;
}

message GuildLevelTableData {
	repeated GuildLevelTable data = 1;
}