syntax = "proto3";

option go_package = "robot/proto/player_locator";

package playerlocator;

import "proto/common/base/empty.proto";

// Player location
message PlayerLocation {
  int64 uid = 1;
  string server_id = 2;
  bool online = 3;
  bool migrating = 4;
  int32 scene_id = 5;
  string token = 6;
  int64 ts = 7;
}

message PlayerId {
  int64 uid = 1;
}

// ----- Session management -----

enum PlayerSessionState {
  SESSION_STATE_UNKNOWN = 0;
  SESSION_STATE_ONLINE = 1;          // Online
  SESSION_STATE_DISCONNECTING = 2;   // Disconnecting, waiting for reconnect (30s lease)
  SESSION_STATE_OFFLINE = 3;         // Offline
}

message PlayerSession {
  uint64 player_id = 1;
  uint32 session_id = 2;         // Gate session ID
  string gate_id = 3;            // Gate node ID
  string gate_instance_id = 4;   // Gate instance UUID (prevent zombie messages)
  string scene_node_id = 5;      // Current Scene node ID
  uint64 scene_id = 6;           // Current scene ID
  string token_id = 7;           // SHA256(login_token)
  uint64 token_expiry_ms = 8;
  uint32 session_version = 9;    // Incremented on each real change, prevents stale messages
  PlayerSessionState state = 10;
  int64 last_active_ts = 11;     // Last active time (unix ms)
  string request_id = 12;        // Latest login request_id (idempotent)
  string account = 13;           // Account name (used by Login for reconnect decisions)
  // 登录代次:login 持玩家锁铸造,随本记录的整字节 CAS 提交;记录与请求都非 0 时提交点要求严格递增。
  // 与 session_version 不同,断线不变、删键不归零(铸造带毫秒下限)。0 = 旧版 login 写入的无代次会话。
  // 见 docs/design/scene-enter-session-fence.md §3。
  uint64 login_generation = 14;
  // 写下本记录的那条 gate 连接的会话代次(SessionDetails.session_incarnation,gate 进程内单调,不随会话号回绕)。
  // SetDisconnecting 的请求与本记录的代次都非 0 且不等时,判为同一 gate 进程里同号旧连接迟到的断线,忽略;
  // 0 = 旧版 login 写入,不校验(docs/design/gate-online-identity.md §10.4「断线通知」)。不从旧记录继承。
  uint64 session_incarnation = 15;
  // 写下本记录的那条 gate 连接所在的区号(发起 SetSession / Reconnect 的 login 进程 Node.ZoneId)。
  // AssignGate 重连免排队直接按它判「会话是否在本区」(合服角色掉 gate 仍可精确免排队,跨区访客不再误免,
  // docs/design/login-queue-2026-05.md §8)。0 = 旧版 login 写入,不从旧记录继承。
  uint32 gate_zone_id = 16;
}

message SetSessionRequest {
  PlayerSession session = 1;
}

// 玩家在 scene_manager 权威位置键（player:{id}:location）上的只读投影，
// 供运维/GM 精准解析多区 (zone_id, node_id, scene_id) 与跨区交接态，不替代 PlayerSession。
message PlayerScenePlacement {
  bool found = 1;
  uint32 zone_id = 2;
  string node_id = 3;
  uint64 scene_id = 4;
  uint64 owner_epoch = 5;
  bool awaiting_placement = 6;
  uint32 session_id = 7;
  uint64 login_generation = 8;
}

message GetSessionRequest {
  uint64 player_id = 1;
  // 按需开启：同槽位 MGET 附带读取 player:{id}:location；默认 false 保持登录热路径零额外开销。
  bool include_placement = 2;
}

message GetSessionResponse {
  PlayerSession session = 1;
  bool found = 2;
  PlayerScenePlacement placement = 3;
}

// 正常登出必须带上 Login 观察到的精确会话。会话已被替换或版本已推进后，
// 迟到的旧 Gate LeaveGame 只能成为无操作，不能删除新会话。
message MarkOfflineRequest {
  uint64 player_id = 1;
  uint32 expected_session_id = 2;
  uint32 expected_session_version = 3;
  // 语义同 SetDisconnectingRequest.gate_instance_id:请求与会话记录的实例号都非空且不等时,
  // 判为旧实例迟到的登出,忽略(不删会话、不调 LeaveScene);空 = 旧版 login,不校验。
  string expected_gate_instance_id = 4;
}

// Disconnect request: mark DISCONNECTING + start TTL lease
message SetDisconnectingRequest {
  uint64 player_id = 1;
  uint32 session_id = 2;
  uint32 lease_ttl_seconds = 3;  // Default 30s
  // 发起断线的 gate 实例 uuid(SessionDetails.gate_instance_id)。请求与会话记录的实例号都非空且不等时,
  // 判为旧实例迟到的上报,忽略;空 = 旧版 login,不校验(docs/design/scene-enter-chain-residuals.md §6)。
  string gate_instance_id = 4;
  // 发起断线的那条 gate 连接的会话代次(SessionDetails.session_incarnation)。请求与会话记录的代次都非 0 且不等时,
  // 判为同一 gate 进程里会话号回绕后同号旧连接迟到的上报,忽略、回成功;0 = 旧版 login,不校验
  // (docs/design/gate-online-identity.md §10.4「断线通知」)。
  uint64 session_incarnation = 5;
}

// Reconnect request: cancel lease, restore ONLINE
message ReconnectRequest {
  uint64 player_id = 1;
  uint32 new_session_id = 2;
  string gate_id = 3;
  string gate_instance_id = 4;
  string token_id = 5;
  uint64 token_expiry_ms = 6;
  string request_id = 7;
  string account = 8;           // Account name (from Login)
  // 本次重连链铸造的登录代次,写进会话记录;记录与请求都非 0 时要求严格递增。0 = 旧版 login。
  uint64 login_generation = 9;
  // 发起重连的那条 gate 连接的会话代次,原样写进会话记录(PlayerSession.session_incarnation);0 = 旧版 login,如实写 0。
  uint64 session_incarnation = 10;
  // 发起重连的那条 gate 连接所在的区号(login 的 Node.ZoneId),原样写进会话记录(PlayerSession.gate_zone_id);0 = 旧版 login,如实写 0。
  uint32 gate_zone_id = 11;
}

message ReconnectResponse {
  bool success = 1;
  PlayerSession session = 2;  // Updated session
  string error_message = 3;
}

// Lease expired cleanup result
message LeaseExpiredEvent {
  uint64 player_id = 1;
  uint32 session_id = 2;
  string scene_node_id = 3;
  uint64 scene_id = 4;
  string gate_id = 5;
  string gate_instance_id = 6;
}

service PlayerLocator {
  rpc SetLocation(PlayerLocation) returns (Empty);
  rpc GetLocation(PlayerId) returns (PlayerLocation);
  rpc MarkOffline(MarkOfflineRequest) returns (Empty);

  // Session management
  rpc SetSession(SetSessionRequest) returns (Empty);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc SetDisconnecting(SetDisconnectingRequest) returns (Empty);
  rpc Reconnect(ReconnectRequest) returns (ReconnectResponse);
}
