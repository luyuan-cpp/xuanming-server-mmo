syntax = "proto3";
package teampb;
option go_package = "robot/proto/team";

import "proto/db/proto_option.proto";
import "proto/team/team.proto";
import "proto/common/base/role_admission.proto";
import "proto/common/base/service_call_auth.proto";
import "proto/match/match_authority.proto";
import "proto/battle/battle_node.proto";

option cc_generic_services = false;
option (OptionFileDefaultNode) = NODE_TEAM;

// scene只可查询SQL已经确认的原入场世代；响应签名绑定整份请求，禁止缓存冒充授权。
message ReadTeamMembershipRequest {
  common.base.RoleAdmissionIdentity admission = 1;
  common.base.ServiceCallAuth auth = 2;
}
message ReadTeamMembershipResponse {
  uint64 team_id = 1;
  uint64 membership_epoch = 2;
  uint64 version = 3;
  TeamRecord record = 4;
  string request_digest = 5;
  common.base.ServiceCallAuth auth = 6;
}
service TeamAuthority {
  rpc ReadMembership(ReadTeamMembershipRequest) returns (ReadTeamMembershipResponse);
}

// 服务端原件，不进入客户端协议列表；不得从当前目录补成旧意图的授权。
message TeamOriginalRole {
  uint64 player_id = 1;
  string owner_account = 2;
  uint64 owner_revision = 3;
}
message TeamConsentOriginal {
  uint64 player_id = 1;
  TeamOriginalRole initiator = 2;
  TeamOriginalRole recipient = 3;
}
message TeamAuthorityData {
  TeamRecord record = 1;
  repeated TeamOriginalRole members = 2;
  repeated TeamConsentOriginal applications = 3;
  repeated TeamConsentOriginal invites = 4;
}
message TeamAuthorityRecord {
  option (OptionTableName) = "team_authority";
  option (OptionPrimaryKey) = "team_id";
  option (OptionIndex) = "state,idle_expires_ms,team_id";
  uint64 team_id = 1;
  uint64 version = 2;
  bytes payload = 3;
  uint32 state = 4; // 1有效、2已解散；墓碑不因TTL消失。
  uint64 idle_expires_ms = 5;
}
message TeamMembershipRecord {
  option (OptionTableName) = "team_membership";
  option (OptionPrimaryKey) = "player_id";
  uint64 player_id = 1;
  uint64 team_id = 2; // 0为永久离队墓碑，epoch不回退。
  uint64 epoch = 3;
}
message TeamInviteIndexRecord {
  option (OptionTableName) = "team_invite_index";
  option (OptionPrimaryKey) = "invitee_id,team_id";
  option (OptionIndex) = "invitee_id,expires_ms,team_id";
  uint64 invitee_id = 1;
  uint64 team_id = 2;
  uint64 expires_ms = 3;
}
message TeamApplicationIndexRecord {
  option (OptionTableName) = "team_application_index";
  option (OptionPrimaryKey) = "applicant_id,team_id";
  option (OptionIndex) = "applicant_id,expires_ms,team_id";
  uint64 applicant_id = 1;
  uint64 team_id = 2;
  uint64 expires_ms = 3;
}
message TeamActionReceiptRecord {
  option (OptionTableName) = "team_action_receipt";
  option (OptionPrimaryKey) = "actor_id,request_high,request_low";
  uint64 actor_id = 1;
  uint64 request_high = 2;
  uint64 request_low = 3;
  uint32 method = 4;
  bytes payload = 5;
  string owner_account = 6;
  uint64 owner_revision = 7;
  bytes result = 8; // 原TeamResponse，在线装饰在读路径重新计算。
  uint64 created_ms = 9;
}
message TeamLaunchMember {
  TeamOriginalRole original = 1;
  uint32 roster_order = 2; // 显式站位顺序，不以repeated下标承载。
  string ticket = 3;
}
// 两版Team向Match提交同一份锁内原件；Match在同事务锁P、Team、launch、票并逐项核验。
message TeamLaunchOriginal {
  TeamOriginalRole actor = 1;
  uint64 team_id = 2;
  uint64 team_version = 3;
  string lock_token = 4;
  StartTeamMatchRequest request = 5;
  repeated TeamLaunchMember members = 6;
  map<uint64, uint32> zones = 7;
  uint32 lock_ttl_seconds = 8;
  uint64 enqueued_ms = 9;
  uint64 not_before_ms = 10;
  repeated ObserverExitOriginal observer_exits = 11;
}
message TeamLaunchData {
  repeated TeamLaunchMember members = 1;
  bytes request_payload = 2;
  TeamRecord team_record = 3;
  TeamLaunchOriginal original = 4;
  repeated match.MatchSpectatorRecord spectator_exits = 5;
}
message TeamLaunchRecord {
  option (OptionTableName) = "team_launch";
  option (OptionPrimaryKey) = "actor_id,request_high,request_low";
  option (OptionIndex) = "state,enqueued_ms,actor_id,request_high,request_low;team_id,state,enqueued_ms,actor_id,request_high,request_low";
  uint64 actor_id = 1;
  uint64 request_high = 2;
  uint64 request_low = 3;
  uint64 team_id = 4;
  uint64 team_version = 5;
  string lock_token = 6;
  uint32 config_id = 7;
  uint32 target_size = 8;
  uint32 member_count = 9;
  uint32 state = 10; // 1持久待提交、2整队排队、3成局中、4已建房、5确证安全关闭。
  uint64 enqueued_ms = 11;
  uint64 not_before_ms = 12;
  uint64 battle_id = 13;
  bytes payload = 14;
  string owner_account = 15;
  uint64 owner_revision = 16;
  uint32 mode = 17; // 0按旧PVE_TEAM解释；新人数档PVP为7，须与原请求一致。
}
message TeamLaunchRegionRecord {
  option (OptionTableName) = "team_launch_region";
  option (OptionPrimaryKey) = "actor_id,request_high,request_low,physical_region";
  option (OptionIndex) = "physical_region,mode,config_id,target_size,member_count,local_preferred,enqueued_ms,actor_id,request_high,request_low;physical_region,mode,config_id,target_size,member_count,enqueued_ms,actor_id,request_high,request_low;expires_ms,actor_id,request_high,request_low,physical_region;physical_region,mode,config_id,target_size,member_count,home_zone,local_preferred,enqueued_ms,actor_id,request_high,request_low;physical_region,mode,config_id,target_size,member_count,home_zone,enqueued_ms,actor_id,request_high,request_low";
  uint64 actor_id = 1;
  uint64 request_high = 2;
  uint64 request_low = 3;
  uint32 physical_region = 4;
  uint32 config_id = 5;
  uint32 target_size = 6;
  uint32 member_count = 7;
  bool local_preferred = 8;
  uint64 enqueued_ms = 9;
  uint64 expires_ms = 10;
  uint32 max_rtt_ms = 11;
  uint32 home_zone = 12; // 0仅表示已允许跨home的混合unit；禁止跨home时不能入候选。
  uint32 mode = 13; // 与原launch的模式一致；候选扫描在LIMIT前隔离PVE/PVP。
}
// 仅为玩家挂起域护栏检索；必须JOIN原launch核状态，不可作为另一个权威来源。
message TeamLaunchRoleRecord {
  option (OptionTableName) = "team_launch_role";
  option (OptionPrimaryKey) = "actor_id,request_high,request_low,player_id";
  option (OptionIndex) = "player_id,state,actor_id,request_high,request_low";
  uint64 actor_id = 1;
  uint64 request_high = 2;
  uint64 request_low = 3;
  uint64 player_id = 4;
  uint32 state = 5; // 与原launch状态同步；只有5明确关闭，4已建房仍待终局。
}
