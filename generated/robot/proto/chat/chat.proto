syntax = "proto3";
option go_package = "robot/proto/chat";

import "proto/db/proto_option.proto";
import "proto/common/base/empty.proto";
import "proto/common/base/tip.proto";

package chatpb;

option cc_generic_services = false;
option (OptionFileDefaultNode) = NODE_CHAT;

enum ChatChannelType {
  CHAT_CHANNEL_TYPE_UNSPECIFIED = 0;
  CHAT_CHANNEL_TYPE_WORLD = 1;
  CHAT_CHANNEL_TYPE_TEAM = 2;
  CHAT_CHANNEL_TYPE_PRIVATE = 3;
  CHAT_CHANNEL_TYPE_SYSTEM = 4;
}

message ChatMessage {
  uint64 sender_player_id = 1;
  uint64 target_player_id = 2;
  ChatChannelType channel = 3;
  string content = 4;
  int64 send_time_ms = 5;
  // 由服务端权威校验填充的聊天气泡与战报/残局分享卡片底纹外观 ID（CosmeticShowcase.id；客户端自报值一律忽略）。
  uint32 bubble_skin_id = 6;
  uint32 share_card_skin_id = 7;
}

message SendChatRequest {
  ChatMessage message = 1;
  string request_id = 2;
}

message SendChatResponse {
  TipInfoMessage error_message = 1;
}

message PullChatHistoryRequest {
  ChatChannelType channel = 1;
  uint64 peer_player_id = 2;
  uint32 limit = 3;
}

message PullChatHistoryResponse {
  TipInfoMessage error_message = 1;
  repeated ChatMessage messages = 2;
}

// 世界频道违规消息异步复检撤回通知(S2C,docs/design/rename-and-content-safety.md §6.5)。
// 经同一个 chat-world-bcast topic 推送给在线客户端,客户端按 (sender_player_id, send_time_ms) 从本地移除该条。
message ChatRetractedNotify {
  ChatChannelType channel = 1;
  uint64 sender_player_id = 2;
  int64 send_time_ms = 3;
  string reason = 4;
}

// 玩家举报聊天消息(docs/design/rename-and-content-safety.md §7)。
message ReportChatRequest {
  ChatChannelType channel = 1;
  uint64 target_sender_player_id = 2;
  int64 send_time_ms = 3;
  uint32 reason = 4;  // 1=广告引流 2=辱骂骚扰 3=涉政涉黄 4=其他
  string detail = 5;  // 可选补充说明,≤200字节,仅记入举报审计表不对外展示
}

message ReportChatResponse {
  TipInfoMessage error_message = 1;
}

// 内部撤回请求:由异步复检或运营管理调用(CLIENT_RPC_SERVER_ONLY,客户端不可发)。
message RetractWorldChatRequest {
  uint64 sender_player_id = 1;
  int64 send_time_ms = 2;
  string reason = 3;
}

message RetractWorldChatResponse {
  TipInfoMessage error_message = 1;
  bool retracted = 2;
}

// 内部白名单模板全服系统播报（绝不接受客户端自由文本，供 match 天墉生死状开战/战果播报使用）。
enum SystemWorldNoticeTemplate {
  SYSTEM_WORLD_NOTICE_TEMPLATE_UNSPECIFIED = 0;
  SYSTEM_WORLD_NOTICE_JIANGHU_DUEL_START_SILVER = 1;        // 普通战书开战
  SYSTEM_WORLD_NOTICE_JIANGHU_DUEL_START_GOLD = 2;          // 金帖生死状开战
  SYSTEM_WORLD_NOTICE_JIANGHU_DUEL_WIN_SILVER = 3;          // 普通战书胜负
  SYSTEM_WORLD_NOTICE_JIANGHU_DUEL_WIN_GOLD = 4;            // 金帖生死状胜负
  SYSTEM_WORLD_NOTICE_JIANGHU_DUEL_DRAW = 5;                // 生死状平局
  SYSTEM_WORLD_NOTICE_JIANGHU_DUEL_STREAK_MILESTONE = 6;    // 达成宿敌 >=3 连胜高光
  SYSTEM_WORLD_NOTICE_JIANGHU_DUEL_STREAK_BROKEN = 7;       // 雪耻终结宿敌 >=3 连胜高光
}

message PublishSystemWorldNoticeRequest {
  string notice_id = 1;                       // 幂等去重键（如 "jh_duel:<battle_id>:start"）
  SystemWorldNoticeTemplate template_id = 2;  // 严格白名单模板枚举
  uint64 battle_id = 3;                       // 关联公开观战 battle_id
  string actor_a_name = 4;                    // 服务端权威展示名（胜方/发起方）
  string actor_b_name = 5;                    // 服务端权威展示名（败方/应战方）
  uint32 total_rounds = 6;
  uint32 streak_count = 7;
  uint32 team_size = 8;
}

message PublishSystemWorldNoticeResponse {
  TipInfoMessage error_message = 1;
  bool deduplicated = 2;                      // true = 命中幂等键未重复广播
}

service ClientPlayerChat {
  option (OptionIsClientProtocolService) = true;

  rpc SendChat (SendChatRequest) returns (SendChatResponse);
  rpc PullChatHistory (PullChatHistoryRequest) returns (PullChatHistoryResponse);
  rpc ReportChat (ReportChatRequest) returns (ReportChatResponse);
  rpc RetractWorldChat (RetractWorldChatRequest) returns (RetractWorldChatResponse) { option (OptionClientRpcKind) = CLIENT_RPC_SERVER_ONLY; }
  rpc PublishSystemWorldNotice (PublishSystemWorldNoticeRequest) returns (PublishSystemWorldNoticeResponse) { option (OptionClientRpcKind) = CLIENT_RPC_SERVER_ONLY; }

  // 世界频道推送(S2C,docs/design/chat-world-channel-fanout.md §4):世界频道的一条发送首次提交成功后,
  // chat 往 Kafka chat-world-bcast_g<N> 发一条,每台 gate 推给本机全部已绑定的会话。消息体就是历史里的同一份显示原件。
  // 至多一次:推送失败或玩家刚好掉线时这一条会丢,真相仍是 PullChatHistory。客户端打开聊天面板与重连时拉一次历史,
  // 按 (sender_player_id, send_time_ms) 去重、按 send_time_ms 排序;不再需要定时轮询。
  // 推送方法必须声明在这个客户端服务里并标 CLIENT_RPC_PUSH(同 friend.proto 的 NotifyFriendEvent):
  // 生成器据此把它排除在客户端可调方法集合之外,客户端主动调它在入口准入就被挡住;服务端不实现(内嵌 Unimplemented)。
  rpc NotifyWorldChat (ChatMessage) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc NotifyWorldChatRetracted (ChatRetractedNotify) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
}
