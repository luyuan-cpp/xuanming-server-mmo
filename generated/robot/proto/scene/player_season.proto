syntax = "proto3";
option go_package = "robot/proto/scene";

import "proto/db/proto_option.proto";
import "proto/common/base/tip.proto";

option cc_generic_services = true;
option (OptionFileDefaultNode) = NODE_SCENE;

// 赛季技能与单槽赛季印（方案 A）客户端契约（设计见 docs/design/season-skills-and-seal-design.md）。
// 客户端所有进度、属性加成、报价、解锁状态与本季免费技能列表均以服务端快照为准，不在本地重算。

message SeasonSealOption {
  uint32 seal_id = 1;
  string name = 2;
  string description = 3;
  string icon_key = 4;
  uint32 effect_id = 5;
  uint32 bonus_bps = 6;
  uint32 cap_bps = 7;
  uint32 per_round_limit = 8;
  uint32 battle_limit = 9;
  uint32 active_rounds = 10;
  uint32 health_threshold_bps = 11;
  bool equipped = 12;
}

message SeasonSkillSummary {
  uint32 skill_table_id = 1;
  string name = 2;
  string description = 3;
  string icon_key = 4;
  string category = 5;
  uint32 target_team = 6;
  uint32 max_targets = 7;
  double mana_percent = 8;
  uint32 cooldown_rounds = 9;
  uint32 unlock_level = 10;
  uint32 max_rank = 11;
  uint32 effective_rank = 12; // 当前自动生效重数；未到解锁等级为 0
  bool unlocked = 13;
  uint32 ability_kind = 14;
  uint32 caster_mask = 15;
  uint32 action_tags = 16;
}

// 单季永久零数值纪念印记与称谓展示视图（源自 PlayerSeasonComp.records，换季永久留存且零战斗属性）。
message SeasonHonorView {
  uint32 season_id = 1;
  string season_name = 2;
  string honor_title_name = 3;
  string honor_badge_icon_key = 4;
  uint32 progress_points = 5;
  uint32 max_points = 6;
  bool unlocked = 7;
  bool is_current_season = 8;
}

// 当前活跃赛季的全员对称周环境词缀视图（不卖数值、零养成门槛，每周自动轮换）。
message SeasonWeeklyAffixView {
  uint32 week_index = 1;
  uint32 affix_id = 2; // 0=无，1护盾过载/2灵息充盈/3先机守势/4锋芒竞速
  string name = 3;
  string description = 4;
  string strategy_tip = 5;
  repeated uint32 recommended_seal_ids = 6;
}

message SeasonStateSnapshot {
  bool available = 1;
  string unavailable_reason = 2;
  uint32 season_id = 3;
  string season_name = 4;
  string season_desc = 5;
  uint64 starts_at_ms = 6;
  uint64 ends_at_ms = 7;
  uint64 server_now_ms = 8;

  // 单槽赛季印状态（轻数值仅含气血与防御万分比，不含速度、暴击与控制属性）
  uint32 equipped_seal_id = 9;
  uint32 progress_points = 10;
  uint32 max_points = 11;
  uint32 battle_points = 12;
  uint32 catchup_points = 13;
  uint32 current_max_health_bps = 14;
  uint32 cap_max_health_bps = 15;
  uint32 current_defense_bps = 16;
  uint32 cap_defense_bps = 17;
  uint32 pve_win_points = 18;
  uint32 pvp_win_points = 19;
  uint32 pvp_other_points = 20;

  // 小额快捷追赶报价（与免费玩家严格同上限）
  uint32 catchup_currency_type = 21;
  uint64 catchup_price_per_point = 22;
  uint64 catchup_remaining_total_price = 23;
  uint64 currency_balance = 24;

  bool can_switch_seal = 25;
  bool can_catchup = 26;
  string action_unavailable_reason = 27;
  uint64 revision = 28;

  repeated SeasonSealOption seals = 29;
  repeated SeasonSkillSummary season_skills = 30;
  // 五行阵法当前装配（0=无/默认，1天覆/2地载/3风扬/4云垂/5虎翼；免费切换）。
  uint32 equipped_formation_id = 31;
  // 战报一键收藏的脱敏公开配装列表（上限 12 条）。
  repeated SavedBattleBuildBookmarkView saved_builds = 32;
  // 历季与当季零数值永久纪念印记与称谓（休赛期亦返回已达成历史荣誉）。
  repeated SeasonHonorView honors = 33;
  // 本周全员对称环境词缀（无活跃赛季时为空）。
  SeasonWeeklyAffixView weekly_affix = 34;
}

message SavedBattleBuildBookmarkView {
  uint64 bookmark_id = 1;
  string title = 2;
  uint64 source_battle_id = 3;
  uint64 source_player_id = 4;
  string source_player_name = 5;
  uint32 class_id = 6;
  uint32 formation_id = 7;
  uint32 season_seal_id = 8;
  uint32 active_pet_table_id = 9;
  string active_pet_name = 10;
  repeated uint32 skill_table_ids = 11;
  repeated uint32 wuxing_sigil_ids = 12;
  uint64 saved_at_ms = 13;
}

message EquipWuxingFormationRequest {
  uint32 formation_id = 1; // 0..5，免费切换
}

message EquipWuxingFormationResponse {
  TipInfoMessage error_message = 1;
  uint32 equipped_formation_id = 2;
  SeasonStateSnapshot state = 3;
}

message WuxingTowerLeaderboardEntry {
  uint32 rank = 1;
  uint64 player_id = 2;
  string player_name = 3;
  uint32 best_floor = 4;
  uint32 best_rounds = 5;
  uint32 formation_id = 6;
  repeated uint32 sigil_ids = 7;
}

message WuxingTowerStateSnapshot {
  uint32 week_key = 1;
  bool run_active = 2;
  uint64 run_id = 3;
  uint32 current_floor = 4;                  // 当前待挑战层（1..10）
  uint32 max_floors = 5;                     // 固定 10 层
  uint32 current_floor_dungeon_id = 6;       // 当前层开战应传入的 PVE_SOLO battle_config_id
  uint32 current_floor_leyline_element = 7;  // 本层环境五行灵脉（1..5）
  uint32 run_total_rounds = 8;
  repeated uint32 active_sigil_ids = 9;
  repeated uint32 pending_offer_sigil_ids = 10;
  uint32 weekly_cleared_mask = 11;
  uint32 weekly_best_floor = 12;
  uint32 weekly_best_rounds = 13;
  uint64 revision = 14;
  repeated WuxingTowerLeaderboardEntry weekly_leaderboard = 15;
}

message GetWuxingTowerStateRequest {}

message GetWuxingTowerStateResponse {
  TipInfoMessage error_message = 1;
  WuxingTowerStateSnapshot state = 2;
}

message StartWuxingTowerRunRequest {}

message StartWuxingTowerRunResponse {
  TipInfoMessage error_message = 1;
  WuxingTowerStateSnapshot state = 2;
}

message PickWuxingTowerSigilRequest {
  uint64 expected_run_id = 1;
  uint32 sigil_id = 2;
}

message PickWuxingTowerSigilResponse {
  TipInfoMessage error_message = 1;
  WuxingTowerStateSnapshot state = 2;
}

message AbandonWuxingTowerRunRequest {
  uint64 expected_run_id = 1;
}

message AbandonWuxingTowerRunResponse {
  TipInfoMessage error_message = 1;
  WuxingTowerStateSnapshot state = 2;
}

message SaveBattleBuildBookmarkRequest {
  SavedBattleBuildBookmarkView bookmark = 1;
}

message SaveBattleBuildBookmarkResponse {
  TipInfoMessage error_message = 1;
  SavedBattleBuildBookmarkView saved = 2;
  repeated SavedBattleBuildBookmarkView all_bookmarks = 3;
}

message DeleteBattleBuildBookmarkRequest {
  uint64 bookmark_id = 1;
}

message DeleteBattleBuildBookmarkResponse {
  TipInfoMessage error_message = 1;
  repeated SavedBattleBuildBookmarkView all_bookmarks = 2;
}

message GetSeasonStateRequest {}

message GetSeasonStateResponse {
  TipInfoMessage error_message = 1;
  SeasonStateSnapshot state = 2;
}

// 战外免费切换当前赛季印。
message EquipSeasonSealRequest {
  uint32 season_id = 1;
  uint32 seal_id = 2;
}

message EquipSeasonSealResponse {
  TipInfoMessage error_message = 1;
  SeasonStateSnapshot state = 2;
}

// 小额灵石快捷追赶赛季印进度（受满级硬封顶约束，与免费玩家同上限）。
// client_request_id 必须非 0；points_to_buy = 0 表示一键补满当前剩余点数，> 0 表示精确补指定点数。
message CatchupSeasonSealRequest {
  uint64 client_request_id = 1;
  uint32 season_id = 2;
  uint32 points_to_buy = 3;
  uint32 expected_currency_type = 4;
  uint64 expected_total_price = 5;
}

message CatchupSeasonSealResponse {
  TipInfoMessage error_message = 1;
  SeasonStateSnapshot state = 2;
  bool replayed = 3;
  uint32 added_points = 4;
  uint64 spent_currency = 5;
}

service SceneSeasonClientPlayer {
  option (OptionIsPlayerService) = true;
  option (OptionIsClientProtocolService) = true;

  rpc GetSeasonState (GetSeasonStateRequest) returns (GetSeasonStateResponse);
  rpc EquipSeasonSeal (EquipSeasonSealRequest) returns (EquipSeasonSealResponse);
  rpc CatchupSeasonSeal (CatchupSeasonSealRequest) returns (CatchupSeasonSealResponse);
  // ── 以下只许在末尾追加：生成的 CallMethod 按 method index 分发 ──
  rpc EquipWuxingFormation (EquipWuxingFormationRequest) returns (EquipWuxingFormationResponse);
  rpc GetWuxingTowerState (GetWuxingTowerStateRequest) returns (GetWuxingTowerStateResponse);
  rpc StartWuxingTowerRun (StartWuxingTowerRunRequest) returns (StartWuxingTowerRunResponse);
  rpc PickWuxingTowerSigil (PickWuxingTowerSigilRequest) returns (PickWuxingTowerSigilResponse);
  rpc AbandonWuxingTowerRun (AbandonWuxingTowerRunRequest) returns (AbandonWuxingTowerRunResponse);
  rpc SaveBattleBuildBookmark (SaveBattleBuildBookmarkRequest) returns (SaveBattleBuildBookmarkResponse);
  rpc DeleteBattleBuildBookmark (DeleteBattleBuildBookmarkRequest) returns (DeleteBattleBuildBookmarkResponse);
}
