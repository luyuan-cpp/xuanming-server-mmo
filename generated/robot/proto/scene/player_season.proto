syntax = "proto3";
option go_package = "robot/proto/scene";

import "proto/db/proto_option.proto";
import "proto/common/base/tip.proto";

option cc_generic_services = true;
option (OptionFileDefaultNode) = NODE_SCENE;

// 赛季技能与单槽赛季印（方案 A）客户端契约（设计见 docs/design/season-skills-and-seal-design.md）。
// 客户端所有进度、属性加成、报价、解锁状态与本季免费技能列表均以服务端快照为准，不在本地重算。

message SeasonSealOption {
  uint32 seal_id = 1;
  string name = 2;
  string description = 3;
  string icon_key = 4;
  uint32 effect_id = 5;
  uint32 bonus_bps = 6;
  uint32 cap_bps = 7;
  uint32 per_round_limit = 8;
  uint32 battle_limit = 9;
  uint32 active_rounds = 10;
  uint32 health_threshold_bps = 11;
  bool equipped = 12;
}

message SeasonSkillSummary {
  uint32 skill_table_id = 1;
  string name = 2;
  string description = 3;
  string icon_key = 4;
  string category = 5;
  uint32 target_team = 6;
  uint32 max_targets = 7;
  double mana_percent = 8;
  uint32 cooldown_rounds = 9;
  uint32 unlock_level = 10;
  uint32 max_rank = 11;
  uint32 effective_rank = 12; // 当前自动生效重数；未到解锁等级为 0
  bool unlocked = 13;
  uint32 ability_kind = 14;
  uint32 caster_mask = 15;
  uint32 action_tags = 16;
}

message SeasonStateSnapshot {
  bool available = 1;
  string unavailable_reason = 2;
  uint32 season_id = 3;
  string season_name = 4;
  string season_desc = 5;
  uint64 starts_at_ms = 6;
  uint64 ends_at_ms = 7;
  uint64 server_now_ms = 8;

  // 单槽赛季印状态（轻数值仅含气血与防御万分比，不含速度、暴击与控制属性）
  uint32 equipped_seal_id = 9;
  uint32 progress_points = 10;
  uint32 max_points = 11;
  uint32 battle_points = 12;
  uint32 catchup_points = 13;
  uint32 current_max_health_bps = 14;
  uint32 cap_max_health_bps = 15;
  uint32 current_defense_bps = 16;
  uint32 cap_defense_bps = 17;
  uint32 pve_win_points = 18;
  uint32 pvp_win_points = 19;
  uint32 pvp_other_points = 20;

  // 小额快捷追赶报价（与免费玩家严格同上限）
  uint32 catchup_currency_type = 21;
  uint64 catchup_price_per_point = 22;
  uint64 catchup_remaining_total_price = 23;
  uint64 currency_balance = 24;

  bool can_switch_seal = 25;
  bool can_catchup = 26;
  string action_unavailable_reason = 27;
  uint64 revision = 28;

  repeated SeasonSealOption seals = 29;
  repeated SeasonSkillSummary season_skills = 30;
}

message GetSeasonStateRequest {}

message GetSeasonStateResponse {
  TipInfoMessage error_message = 1;
  SeasonStateSnapshot state = 2;
}

// 战外免费切换当前赛季印。
message EquipSeasonSealRequest {
  uint32 season_id = 1;
  uint32 seal_id = 2;
}

message EquipSeasonSealResponse {
  TipInfoMessage error_message = 1;
  SeasonStateSnapshot state = 2;
}

// 小额灵石快捷追赶赛季印进度（受满级硬封顶约束，与免费玩家同上限）。
// client_request_id 必须非 0；points_to_buy = 0 表示一键补满当前剩余点数，> 0 表示精确补指定点数。
message CatchupSeasonSealRequest {
  uint64 client_request_id = 1;
  uint32 season_id = 2;
  uint32 points_to_buy = 3;
  uint32 expected_currency_type = 4;
  uint64 expected_total_price = 5;
}

message CatchupSeasonSealResponse {
  TipInfoMessage error_message = 1;
  SeasonStateSnapshot state = 2;
  bool replayed = 3;
  uint32 added_points = 4;
  uint64 spent_currency = 5;
}

service SceneSeasonClientPlayer {
  option (OptionIsPlayerService) = true;
  option (OptionIsClientProtocolService) = true;

  rpc GetSeasonState (GetSeasonStateRequest) returns (GetSeasonStateResponse);
  rpc EquipSeasonSeal (EquipSeasonSealRequest) returns (EquipSeasonSealResponse);
  rpc CatchupSeasonSeal (CatchupSeasonSealRequest) returns (CatchupSeasonSealResponse);
  // ── 以下只许在末尾追加：生成的 CallMethod 按 method index 分发 ──
}
