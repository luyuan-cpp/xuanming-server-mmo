syntax = "proto3";
option go_package = "robot/proto/scene";

import "proto/db/proto_option.proto";
import "proto/common/base/tip.proto";
import "proto/common/base/empty.proto";
import "proto/common/component/actor_comp.proto";
import "proto/scene/scene_info.proto";

option cc_generic_services = true;
option (OptionFileDefaultNode) = NODE_SCENE;

message EnterSceneC2SRequest
{
  SceneInfoComp scene_info = 1;
}

message EnterSceneC2SResponse
{
	TipInfoMessage error_message = 1;
}

message EnterSceneS2C
{
  SceneInfoComp scene_info = 1;
}

// 一条分线对玩家可见的状态(docs/design/world-channel-switch.md §3)。
// 只有 SMOOTH / BUSY 可以被玩家主动选中;其余客户端置灰。服务端对 FULL / CLOSING 会拒;UNAVAILABLE 由进场时
// 的节点判定决定(再入屏障内拒,屏障过后可能改派到活节点放行)。
enum SceneChannelState
{
	SCENE_CHANNEL_STATE_UNKNOWN = 0;
	SCENE_CHANNEL_STATE_SMOOTH = 1;      // 流畅
	SCENE_CHANNEL_STATE_BUSY = 2;        // 繁忙
	SCENE_CHANNEL_STATE_FULL = 3;        // 爆满:人数已到每线上限
	SCENE_CHANNEL_STATE_CLOSING = 4;     // 回收中:已从选线集合摘除,等玩家走空后销毁
	SCENE_CHANNEL_STATE_UNAVAILABLE = 5; // 所在节点暂不可用(刚判死 / 身份歧义 / 映射缺失)
}

message SceneChannelInfo
{
	uint64 scene_id = 1;         // 这条线的场景实例 id;切线 = EnterScene(scene_config_id, 这个 scene_id)
	uint32 channel_no = 2;       // 线号,从 1 起;同一条线在其生命周期内不变
	uint32 player_count = 3;     // scene_manager 记的人数,秒级滞后,只用于展示
	SceneChannelState state = 4;
}

// 一张大世界地图在一个 zone 里的分线目录。
// 它是 scene_manager 发布到 Redis 的读模型(key: world_channel_directory:zone:{zone}:{conf},
// value 就是本消息的序列化字节),scene 节点原样读出、放进 SceneInfoS2C 推给客户端。
// 目录只用于展示和客户端预判,不是放行凭据:切线请求仍由 scene_manager 在 EnterScene 里重新校验。
message SceneChannelDirectory
{
	uint32 zone_id = 1;
	uint32 scene_config_id = 2;
	repeated SceneChannelInfo channels = 3; // 按 channel_no 升序
	uint64 updated_at_ms = 4;               // 发布时刻(scene_manager 墙钟,毫秒)
	uint32 switch_cooldown_seconds = 5;     // 两次主动切线的最小间隔;0 = 无冷却
	uint32 max_players_per_channel = 6;     // 每线人数上限(判定 FULL 的分母);scene_manager 恒填正数
	bool switch_enabled = 7;                // false = 服务端关闭了玩家主动切线,客户端整面板置灰
}

// 大世界地图聚合热度档位(docs/design/world-map-play-v2.md §2.2.3):只暴露聚合档位,不暴露玩家明细。
enum WorldMapHeatLevel
{
	WORLD_MAP_HEAT_LEVEL_UNKNOWN = 0;
	WORLD_MAP_HEAT_LEVEL_QUIET = 1;    // 清幽(0 人)
	WORLD_MAP_HEAT_LEVEL_ACTIVE = 2;   // 有人
	WORLD_MAP_HEAT_LEVEL_CROWDED = 3;  // 热闹
}

// 单张已开放大世界地图的聚合态势。
message WorldMapOverviewEntry
{
	uint32 scene_config_id = 1;
	uint32 total_player_count = 2;      // 全线汇总人数(秒级滞后)
	uint32 channel_count = 3;           // 当前可进分线数
	WorldMapHeatLevel heat_level = 4;
	uint64 recommended_scene_id = 5;    // 推荐聚人线 scene_id(未满最小线号活线;0 = 暂不可用)
	uint32 recommended_channel_no = 6;  // 推荐线号,只用于展示
	bool is_tide_map = 7;               // true = 本轮五行灵潮目标野外图
	bool has_mystery_merchant = 8;      // true = 神秘商人此刻落在这张图上
}

// 微观全服循环「五行灵潮」状态(按墙钟确定性轮换,docs/design/world-map-play-v2.md §2.2.2)。
message WorldTideSnapshot
{
	bool active = 1;                    // true = 此刻处于本轮灵潮持续期内
	uint64 round_id = 2;                // 本轮起始 Unix 秒
	uint32 scene_config_id = 3;         // 本轮灵潮所在野外地图(0 = 未配置候选)
	uint64 recommended_scene_id = 4;    // 灵潮图推荐聚人线 scene_id
	uint32 recommended_channel_no = 5;  // 灵潮图推荐线号
	uint64 starts_at_ms = 6;            // 本轮灵潮开始时刻(毫秒)
	uint64 ends_at_ms = 7;              // 本轮灵潮结束时刻(毫秒)
	uint64 next_starts_at_ms = 8;       // 下一轮灵潮开始时刻(毫秒)
}

// 一个 zone 全部已开放大世界地图的聚人态势读模型(Redis key: world_map_overview:{ctl:<zone>})。
// 由 scene_manager 领导者随分线目录周期发布,scene 节点只读转发,客户端只在显式请求时获取。
message WorldMapOverview
{
	uint32 zone_id = 1;
	uint64 updated_at_ms = 2;
	uint64 server_time_ms = 3;
	repeated WorldMapOverviewEntry maps = 4;  // 按 scene_config_id 升序
	WorldTideSnapshot tide = 5;               // 微观每小时灵潮
	uint32 daily_hotspot_scene_config_id = 6; // 宏观每日灵脉旺地(UTC+8 05:00 换日;0 = 未启用)
}

message SceneInfoS2C
{
  repeated SceneInfoComp scene_info = 1;
  // 玩家当前所在大世界地图的分线目录。副本 / 镜像里、或目录尚未发布时不带(has_channel_directory == false)。
  SceneChannelDirectory channel_directory = 2;
  // 本 zone 已开放大世界地图的热度与灵潮总览。仅客户端请求 with_world_map_overview 且总览已发布时附带。
  WorldMapOverview world_map_overview = 3;
}

message SceneInfoRequest
{
	// true = 连同当前地图的分线目录一起要(SceneInfoS2C.channel_directory,docs/design/world-channel-switch.md §3)。
	// 做成显式开关而不是默认附带:带目录要让 scene 节点多读一次 zone Redis、推送也更大,而压测机器人把
	// SceneInfoC2S 当作高频的"动一下"在发 —— 不带本字段的请求,开销与改动前逐字节相同。
	bool with_channel_directory = 1;
	// true = 连同本 zone 的大世界地图热度与灵潮总览一起要(SceneInfoS2C.world_map_overview,docs/design/world-map-play-v2.md §2.2)。
	bool with_world_map_overview = 2;
}

message SceneInfoResponse
{
  repeated SceneInfoComp scene_info = 1;
}

enum ActorType
{
	ACTOR_TYPE_NONE = 0;
	ACTOR_TYPE_PLAYER = 1;
	ACTOR_TYPE_NPC = 2;
}

message ActorCreateS2C
{
	uint64 entity = 1; // 不透明 actor 网络号；不持久化，不是玩家 GUID 或本地 ECS 句柄。
	Transform transform = 2;
	ActorType actor_type = 3;
	uint64 guid = 4;
	uint64 config_id = 5;
	string appearance_id = 6; // 玩家稳定外观 ID；NPC 留空。
	uint32 class_id = 7; // 旧玩家 appearance_id 为空时供客户端兼容。
	uint32 gender = 8;
}

message ActorDestroyS2C
{
	uint64 entity = 1; // 需要移除的不透明 actor 网络号。
}

message ActorListCreateS2C
{
	repeated ActorCreateS2C actor_list = 1;
}

message ActorListDestroyS2C
{
	repeated uint64 entity = 1; // 需要移除的不透明 actor 网络号列表。
}

// 跨 zone 场景传送(docs/design/cross-zone-scene-travel.md CZ-7)。
// 应答无错 = 已受理:scene 已冻结玩家并开始存盘,**不代表已到达**。
//   到达   = 之后收到 msg 124 RedirectToGate,客户端按 RedirectFlow 连到目标 zone;
//   未成   = 之后收到 SendTipToClient(kZoneTravel* tip),scene 已解冻,玩家留在原地。
// 加在 SceneSceneClientPlayer 而不是 ScenePlayer:后者是 gate→scene 的内部服务,没有
// OptionIsClientProtocolService,客户端包会在 gate 被当成非法包。
message TravelToZoneRequest
{
	uint32 target_zone_id = 1;
	uint32 scene_config_id = 2; // 目标地图;0 = 由目标 zone 的 scene_manager 按世界频道表挑默认大世界
}

message TravelToZoneResponse
{
	TipInfoMessage error_message = 1; // 同步拒绝码(CZ-6 校验不过);生成的 handler 头会调 mutable_error_message()
}

// 落地恢复:按域版本摘要(docs/design/landing-recovery-sync-digest.md)。
// 域号是客户端契约:只追加,上线后不复用;hash 字段名 = 域号十进制。
enum SyncDomain
{
	SYNC_DOMAIN_UNSPECIFIED = 0;
	SYNC_DOMAIN_FRIEND_LIST = 1;
	SYNC_DOMAIN_FRIEND_REQUEST = 2;
	SYNC_DOMAIN_FRIEND_BLOCK = 3;
	SYNC_DOMAIN_TEAM = 4;
	SYNC_DOMAIN_TEAM_INVITE = 5;
	SYNC_DOMAIN_GUILD = 6;
	SYNC_DOMAIN_GUILD_APPLICATION = 7;
	SYNC_DOMAIN_GUILD_ECONOMY = 8;
	SYNC_DOMAIN_GUILD_ACTIVITY = 9;
}

enum SyncDigestStatus
{
	SYNC_DIGEST_STATUS_OK = 0;
	SYNC_DIGEST_STATUS_UNAVAILABLE = 1;  // 读不到摘要(Redis 不可用 / 命令未发出 / 应答畸形):客户端按全量拉处理
}

message SyncDigestEntry
{
	SyncDomain domain = 1;
	uint64 version = 2;
}

message GetSyncDigestRequest
{
}

message SyncDigestS2C
{
	SyncDigestStatus status = 1;
	uint64 generation = 2;                 // 摘要代次 g;0 = 摘要不存在(从未 bump 或已过期)
	repeated SyncDigestEntry entries = 3;  // 只含出现过的域;缺席的域版本按 0 处理。顺序无业务含义
}

service SceneSceneClientPlayer
{
  option (OptionIsPlayerService) = true;
  option (OptionIsClientProtocolService) = true;

  rpc EnterScene (EnterSceneC2SRequest) returns (EnterSceneC2SResponse);
  rpc NotifyEnterScene (EnterSceneS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc SceneInfoC2S (SceneInfoRequest) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_ONE_WAY; }
  rpc NotifySceneInfo (SceneInfoS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc NotifyActorCreate (ActorCreateS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc NotifyActorDestroy (ActorDestroyS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc NotifyActorListCreate (ActorListCreateS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc NotifyActorListDestroy (ActorListDestroyS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  // 只能追加在末尾:CallMethod 按 method index 分发,插到中间会让后面所有方法移位。
  rpc TravelToZone (TravelToZoneRequest) returns (TravelToZoneResponse);
  // 落地恢复(docs/design/landing-recovery-sync-digest.md §4.1):客户端落地后取摘要。应答是 Empty,
  // 数据走 NotifySyncDigest 推送;handler 里禁止 SetTip,所有失败都推 status = UNAVAILABLE。
  rpc GetSyncDigest (GetSyncDigestRequest) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_ONE_WAY; }
  rpc NotifySyncDigest (SyncDigestS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
}
