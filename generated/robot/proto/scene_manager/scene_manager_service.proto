syntax = "proto3";
package scene_manager;

import "proto/common/base/node.proto";
import "proto/common/base/empty.proto";
import "proto/contracts/kafka/gate_command.proto";

option go_package = "robot/proto/scene_manager";

// Scene type: main world (persistent) vs instance (on-demand, has lifecycle).
enum SceneType {
  SCENE_TYPE_UNSPECIFIED = 0;
  // Persistent main-world scene. Created at startup, never auto-destroyed.
  SCENE_TYPE_MAIN_WORLD  = 1;
  // On-demand instance (dungeon, arena, etc.). Created per request, auto-destroyed when idle.
  SCENE_TYPE_INSTANCE    = 2;
}

// SceneManager Service: Responsible for scene creation/destruction and player-scene routing.
service SceneManager {
  // Create a scene on a specific node (implemented by the Scene node)
  rpc CreateScene(CreateSceneRequest) returns (CreateSceneResponse) {}

  // 销毁一个副本或镜像,不看人数(在场玩家由 scene 节点改派回大世界)。目标是大世界频道时拒绝(回错误,一个键不动):
  // 频道只由缩容排空与孤儿清理下线,要下掉一个频道就调低这张图的期望频道数
  // (docs/design/world-channel-placement-generation.md §7)。
  rpc DestroyScene(DestroySceneRequest) returns (Empty) {}

  // Login/player_locator requests a player to enter a scene
  rpc EnterScene(EnterSceneRequest) returns (EnterSceneResponse) {}

  // Login/player_locator requests a player to leave a scene
  rpc LeaveScene(LeaveSceneRequest) returns (Empty) {}
}

message CreateSceneRequest {
  // Scene config ID (map template)
  uint64 scene_conf_id = 1;
  // Optional: Specify creation on a specific Scene node (used for main world hash assignment)
  string target_node_id = 2;
  // Scene type. Main world scenes are persistent; instances have lifecycle management.
  SceneType scene_type = 3;
  // Creator player IDs (for instance access control)
  repeated uint64 creator_ids = 4;
  // Zone ID: which zone this scene belongs to.
  uint32 zone_id = 5;
  // Mirror co-location: when > 0, create the new scene on the SAME node that
  // already hosts this source scene. Rationale: mirrors are structural copies
  // of a world scene, so co-locating them reuses already-loaded map/AI/spawn
  // data and avoids cross-node handoff on client scene switches.
  // Falls back to GetBestNode if the source node is dead or overloaded.
  uint64 source_scene_id = 6;
  // Mirror config ID forwarded to the C++ SceneNode (set on SceneInfoComp).
  // 0 = not a mirror. Independent of source_scene_id so the caller can tag
  // the mirror even when the source node is inferred via other means.
  uint32 mirror_config_id = 7;
}

message CreateSceneResponse {
  // Global scene ID (allocated by SceneManager)
  uint64 scene_id = 1;
  // ID of the node where it resides
  string node_id = 2;
  // Creation result: 0 for success, non-zero for error code
  uint32 error_code = 3;
  string error_message = 4;
  // Echo of CreateSceneRequest.creator_ids. Lets async callers (notably the
  // C++ SceneNode that initiated a mirror create on behalf of a player) drive
  // a follow-up EnterScene without keeping per-call request state. Empty when
  // the request had no creators (system-initiated creates, etc.).
  repeated uint64 creator_ids = 5;
}

message DestroySceneRequest {
  uint64 scene_id = 1;
  // Zone ID: which zone this scene belongs to.
  uint32 zone_id = 2;
}

message EnterSceneRequest {
  uint64 player_id = 1;
  uint64 scene_id = 2;          // Target scene (if known). 0 = allocate via scene_conf_id.
  uint32 session_id = 3;        // Gate session ID
  string request_id = 4;        // Idempotency ID (optional)
  string gate_id = 5;           // Gate Node ID
  string gate_instance_id = 6;  // Gate Instance ID (for Kafka message validation)
  // Zone ID: which zone the target scene belongs to.
  uint32 zone_id = 7;
  // Scene config ID (map template). Required when scene_id == 0.
  // Used to resolve the actual scene instance from main_scene_channels.
  uint64 scene_conf_id = 8;
  // Zone ID of the player's current Gate. Used to detect cross-zone transitions.
  uint32 gate_zone_id = 9;
  // 应答关联号:scene_manager 只在 EnterSceneResponse.correlation_id 里原样回显它。
  // - 不进 request_id 的去重与指纹(算指纹前清零),不参与任何路由判定。它和 request_id 语义相反:
  //   幂等键要求同一逻辑操作重试时取同一个值,关联号要求每次发送取不同的值、只认最新一次,
  //   所以不能复用 request_id(复用会让每条交接请求多一次 SETNX/EVAL,还会带出假的"执行中")。
  // - 取值是发送方线程内的单调号:scene 进程所有 EnterScene 都经统一出口发出,恒非 0;
  //   0 表示调用方不需要按请求对应答(如 login)。
  // - 请求侧后续新字段从 13 起用。
  uint64 correlation_id = 10;
  // 客户端主动选线(docs/design/world-channel-switch.md §4):这条请求的 scene_id 是玩家自己在
  // 客户端点选的,不是服务器替他决定的。只有 scene 节点的客户端 EnterScene 入口会置位;
  // 队伍跟随、镜像自动进场、疏散、登录、跨节点交接的重发一律不置位。
  // 置位且目标是本 zone 的大世界分线时,scene_manager 额外校验「未回收 / 未满 / 冷却已过」,
  // 并在放行后开始计冷却;目标不是分线(按 id 进副本 / 镜像)时本字段不产生任何效果。
  // 进 request_id 指纹(它是业务语义);proto3 不序列化 false,不带它的请求指纹与加字段前逐字节相同。
  bool client_channel_pick = 11;
  // 登录代次(docs/design/scene-enter-session-fence.md、scene-enter-chain-residuals.md §5):
  // 与 session_id 一起构成本请求代表的会话身份。
  // - login 发起:本链铸出的代次(每条登录链持玩家锁铸造一次的单调值)。
  // - scene 自发(换图 / 跟随 / 疏散 / 交接重发 / 镜像进场):实体已放行的代次,只在请求会话号与实体会话一致时
  //   才填,可落后于会话记录;旧版 scene 填 0。
  // - 0 = 调用方没有代次(旧版 login / 旧版 scene),落点身份裁决按 legacy 放行。
  // - scene_manager 用它做落点会话身份裁决(陈旧登录 / 会话冲突回私有码 25),同时仍原样放进
  //   RoutePlayerEvent.login_generation 下发,gate 对同一角色取 max,scene 入场栅栏照旧裁决。
  // - 不进 request_id 的去重指纹(算指纹前清零,与 correlation_id 同理):login 的重试复用同一个
  //   request_id,但每条登录链铸出的代次都不同,进指纹会把合法重试判成幂等冲突。
  uint64 login_generation = 12;
  // 账号目录放行的所有权修订；完整参与幂等指纹，不能用新买家的修订替旧路由补权。0拒绝。
  uint64 owner_revision = 13;
}

message EnterSceneResponse {
  uint32 error_code = 1;
  string error_message = 2;
  // Non-empty when cross-zone redirect is needed instead of direct routing.
  // Client should disconnect from current Gate and reconnect to the target Gate.
  RedirectToGateInfo redirect = 3;
  // 原样回显请求里的 player_id。scene 节点的 EnterScene 是异步 gRPC,应答回调里没有
  // 请求上下文;传送 / 疏散这类"发起方还要根据结果收尾"的调用靠它把应答对回玩家。
  uint64 player_id = 4;
  // GO-2 回显(cross-zone-scene-travel.md §12.8):本请求铸造的 owner_epoch 在推路由 / 重定向失败后
  // 已被原子回滚,且回滚方式是再 INCR 一格(bump)时,这里填回滚后的值(= 铸出值 + 1,只升不降)。
  // - 只出现在 ErrKafkaRoute 应答里;错误应答不进 request_id 去重缓存,不存在"跟缓存重放"。
  // - 0 = 本应答不对 epoch 做任何断言(没回滚、keep 回滚、回滚未确认、旧版 scene_manager)。
  // - 只用于日志和排障,**绝不是采纳凭证**:回滚会同时把交接标记转写到新 epoch,源 scene 必须经
  //   ResolveTravelOutcome 的原子脚本先删掉本次交接这一族标记、并读到 PlayerLocation.rollback_receipt
  //   与自己本次标记原文逐字节相同,才能采纳新 epoch。凭回显采纳会在"第三方已凭转写标记铸出更新值"
  //   时造成双持有。
  uint64 owner_epoch_after_rollback = 5;
  // 原样回显 EnterSceneRequest.correlation_id。scene 节点靠它把应答对回"哪一次发送"
  // (player_id 只用来找实体):只有号匹配的应答才算本代传送交接的证据。
  // 去重重放时回显的是本次请求的值,不是被缓存那次的值。
  // 0 表示请求没带,或者 scene_manager 是旧版没回显;此时 scene 退回按 player_id 对应答。
  uint64 correlation_id = 6;
}

// Redirect info returned when player needs to switch to a different zone's Gate.
message RedirectToGateInfo {
  string target_gate_ip = 1;
  uint32 target_gate_port = 2;
  bytes  token_payload = 3;    // serialized GateTokenPayload for target gate
  bytes  token_signature = 4;  // HMAC-SHA256 signature
  int64  token_deadline = 5;   // unix seconds
}

message LeaveSceneRequest {
  uint64 player_id = 1;
  uint64 scene_id = 2;
  string request_id = 3;
  // Zone ID: which zone the target scene belongs to.
  uint32 zone_id = 4;
  // 被清理的那条会话记录的原值,由 player_locator 从被删的 PlayerSession 里取。0 / 0 = 旧版调用方,按旧行为删除。
  // scene_manager 拿它与 location 里记的会话身份比较,location 已属于更新的登录时不删(scene-enter-chain-residuals.md §3)。
  uint32 session_id = 5;
  uint64 login_generation = 6;
}
