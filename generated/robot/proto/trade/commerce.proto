syntax = "proto3";
package trade;
option go_package = "robot/proto/trade";

import "proto/common/base/tip.proto";

// 客户端只选择自己已有资产，不提交实例快照或声称付款成功。
// 实例属性由唯一在线资产权威提取；集合上限由服务端在写事务前及提交时复核。
message TradeAssetSelection {
  map<uint32, uint32> items = 1;       // 可叠加配置及数量，最多16种
  repeated uint64 item_uuids = 2;      // 完整唯一实例，最多8件
  uint64 pet_id = 3;                   // 0表示不含宝宝
  uint32 currency_type = 4;
  uint64 currency_amount = 5;
}

enum CommerceOrderKind {
  COMMERCE_ORDER_KIND_UNSPECIFIED = 0;
  COMMERCE_ORDER_KIND_OFFICIAL = 1;
  COMMERCE_ORDER_KIND_PLAYER_TRADE = 2;
  COMMERCE_ORDER_KIND_CONSIGNMENT = 3;
  COMMERCE_ORDER_KIND_MARKET_MATCH = 4;
  COMMERCE_ORDER_KIND_AUCTION_LOT = 5;
  COMMERCE_ORDER_KIND_RMB_CONSIGNMENT = 6;
  // 悬赏求书求购单:发榜人先托管悬赏银两,揭榜人交一枚封卷道籍,书先到发榜人、税后银两再到揭榜人
  // (docs/design/skill-book-wanted-order-trade-escrow.md)。
  COMMERCE_ORDER_KIND_SKILL_BOOK_WANTED = 7;
}

enum CommerceOrderState {
  COMMERCE_ORDER_STATE_UNSPECIFIED = 0;
  COMMERCE_ORDER_STATE_WAITING_CONFIRMATION = 1;
  COMMERCE_ORDER_STATE_AWAITING_PAYMENT = 2;
  COMMERCE_ORDER_STATE_ESCROWING = 3;
  COMMERCE_ORDER_STATE_DELIVERING = 4;
  COMMERCE_ORDER_STATE_DELIVERED = 5;
  COMMERCE_ORDER_STATE_CANCEL_PENDING = 6;
  COMMERCE_ORDER_STATE_CANCELLED = 7;
  COMMERCE_ORDER_STATE_REFUND_PENDING = 8;
  COMMERCE_ORDER_STATE_REFUNDED = 9;
  COMMERCE_ORDER_STATE_MANUAL = 10;
  COMMERCE_ORDER_STATE_SETTLED = 11;
  // 官方订单的付款被渠道修订之后(用户在渠道侧退款、作废,或撤销又被撤回;payment-recharge.md §22.6):
  // REVERSING 正在把游戏内发放收敛到渠道的最新结论(扣回或补发),REVERSED 已扣回。补发完成回到 DELIVERED。
  COMMERCE_ORDER_STATE_REVERSING = 12;
  COMMERCE_ORDER_STATE_REVERSED = 13;
}

message CommerceOrderView {
  string order_id = 1;                  // 不透明稳定订单号
  CommerceOrderKind kind = 2;
  CommerceOrderState state = 3;
  uint64 seller_player_id = 4;
  uint64 buyer_player_id = 5;
  uint64 amount = 6;                    // 最小单位整数
  string currency = 7;                  // 官方渠道币种或游戏货币类型
  uint64 created_ms = 8;
  uint64 version = 9;
  bool seller_confirmed = 10;
  bool buyer_confirmed = 11;
  string related_id = 12;               // 商品/挂单/竞拍标识
  uint64 designated_buyer_player_id = 13; // 官方指定买家定向单的目标角色 ID（0 = 公开单）
}

message CommerceOrderResponse {
  TipInfoMessage error_message = 1;
  CommerceOrderView order = 2;
  uint64 server_now_ms = 3;
  TradeAssetSelection seller_assets = 4;
  TradeAssetSelection buyer_assets = 5;
  repeated TradeOfferInstance seller_item_instances = 6;
  repeated TradeOfferInstance buyer_item_instances = 7;
  TradeOfferInstance seller_pet = 8;
  TradeOfferInstance buyer_pet = 9;
}
message GetCommerceOrderRequest { string order_id = 1; }
message CancelCommerceOrderRequest { string order_id = 1; }
message ListCommerceOrdersRequest { string cursor = 1; uint32 limit = 2; }
message ListCommerceOrdersResponse {
  TipInfoMessage error_message = 1;
  repeated CommerceOrderView orders = 2;
  string next_cursor = 3;
  uint64 server_now_ms = 4;
}

// 新合同的公开发现入口；旧P1 listing种子不冒充已托管商品，不与新ID混用。
message TradeOfferInstance { uint64 instance_id = 1; uint32 config_id = 2; uint32 count = 3; string name = 4; uint32 level = 5; }
message CommerceOfferView {
  CommerceOrderView order = 1;
  TradeAssetSelection assets = 2;
  repeated TradeOfferInstance item_instances = 3;
  TradeOfferInstance pet = 4;
  AuctionLotView auction = 5;
}
message BrowseCommerceOffersRequest { CommerceOrderKind kind = 1; string cursor = 2; uint32 limit = 3; }
message BrowseCommerceOffersResponse { TipInfoMessage error_message = 1; repeated CommerceOfferView offers = 2; string next_cursor = 3; uint64 server_now_ms = 4; }

message OfficialSkuView {
  uint64 sku_id = 1;
  string title = 2;
  uint64 price_minor = 3;
  string currency = 4;
  uint64 available = 5;
}
message ListOfficialSkusRequest { uint64 after_sku_id = 1; uint32 limit = 2; }
message ListOfficialSkusResponse {
  TipInfoMessage error_message = 1;
  repeated OfficialSkuView skus = 2;
  uint64 next_sku_id = 3;
}
message CreateOfficialOrderRequest {
  string client_request_id = 1;
  uint64 sku_id = 2;
  uint32 quantity = 3;
}

message CreatePlayerTradeRequest {
  string client_request_id = 1;
  uint64 buyer_player_id = 2;
  TradeAssetSelection seller_assets = 3;
  TradeAssetSelection buyer_assets = 4;
}
message ConfirmPlayerTradeRequest { string order_id = 1; }

message CreateConsignmentRequest {
  string client_request_id = 1;
  TradeAssetSelection assets = 2;
  uint32 currency_type = 3;
  uint64 price = 4;
  uint64 duration_ms = 5;
  uint64 designated_buyer_player_id = 6; // 可选：非 0 时创建仅允许该指定角色购买的定向托管单
}
message BuyConsignmentRequest { string listing_id = 1; string client_request_id = 2; }
message CancelConsignmentRequest { string listing_id = 1; }

enum MarketOrderSide {
  MARKET_ORDER_SIDE_UNSPECIFIED = 0;
  MARKET_ORDER_SIDE_BUY = 1;
  MARKET_ORDER_SIDE_SELL = 2;
}
message PlaceMarketOrderRequest {
  string client_request_id = 1;
  uint32 market_id = 2;
  uint32 item_config_id = 3;
  MarketOrderSide side = 4;
  uint32 quantity = 5;
  uint64 unit_price = 6;
  uint32 currency_type = 7;
}
message CancelMarketOrderRequest { string market_order_id = 1; }
message MarketOrderView {
  string market_order_id = 1;
  uint32 market_id = 2;
  uint32 item_config_id = 3;
  MarketOrderSide side = 4;
  uint32 quantity = 5;
  uint32 filled_quantity = 6;
  uint64 unit_price = 7;
  uint32 currency_type = 8;
  string state = 9;
  uint64 created_ms = 10;
}
message MarketOrderResponse { TipInfoMessage error_message = 1; MarketOrderView order = 2; }
message ListMarketOrdersRequest { string cursor = 1; uint32 limit = 2; }
message ListMarketOrdersResponse {
  TipInfoMessage error_message = 1;
  repeated MarketOrderView orders = 2;
  string next_cursor = 3;
}
message GetMarketDepthRequest { uint32 market_id = 1; uint32 item_config_id = 2; uint32 limit = 3; }
message MarketDepthLevel { uint64 unit_price = 1; uint64 quantity = 2; }
message GetMarketDepthResponse {
  TipInfoMessage error_message = 1;
  repeated MarketDepthLevel asks = 2;
  repeated MarketDepthLevel bids = 3;
  uint64 server_now_ms = 4;
}
message TradeMarketView { uint32 market_id = 1; uint32 item_config_id = 2; string title = 3; uint32 currency_type = 4; }
message ListTradeMarketsRequest {}
message ListTradeMarketsResponse { TipInfoMessage error_message = 1; repeated TradeMarketView markets = 2; }

message CreateAuctionLotRequest {
  string client_request_id = 1;
  TradeAssetSelection assets = 2;
  uint32 currency_type = 3;
  uint64 opening_price = 4;
  uint64 minimum_increment = 5;
  uint64 duration_ms = 6;
}
message PlaceAuctionBidRequest { string lot_id = 1; string client_request_id = 2; uint64 amount = 3; }
message GetAuctionLotRequest { string lot_id = 1; }
message CancelAuctionLotRequest { string lot_id = 1; }
message AuctionLotView {
  string lot_id = 1;
  uint64 seller_player_id = 2;
  uint32 currency_type = 3;
  uint64 opening_price = 4;
  uint64 minimum_increment = 5;
  uint64 highest_bid = 6;
  uint64 highest_bidder = 7;
  uint64 end_ms = 8;
  string state = 9;
  uint64 version = 10;
  string order_id = 11;
}
message AuctionLotResponse {
  TipInfoMessage error_message = 1;
  AuctionLotView lot = 2;
  uint64 server_now_ms = 3;
}

// 人民币寄售独立入口；旧CreateConsignment继续使用游戏币，不能改价单位。
// 账号/修订/托管证明均由服务端核实，客户端没有声明这些身份或付款成功的字段。
message CreateRmbConsignmentRequest {
  string client_request_id = 1;
  TradeAssetSelection assets = 2;
  uint64 character_player_id = 3; // 非0出售同账号角色，assets必须为空；其余出售一类物品/宠物/货币
  uint64 price_fen = 4;
  string title = 5;
  uint64 designated_buyer_player_id = 6; // 可选：非 0 时创建仅允许该指定角色所属账号购买的定向托管单
}
message GetRmbConsignmentRequest { uint64 listing_id = 1; }
message ListRmbConsignmentsRequest { string cursor = 1; uint32 limit = 2; }
message BuyRmbConsignmentRequest { uint64 listing_id = 1; string client_request_id = 2; }
message CancelRmbConsignmentRequest { uint64 listing_id = 1; }
message RmbConsignmentView {
  uint64 listing_id = 1;
  uint64 seller_player_id = 2;
  uint32 market_zone = 3;
  string asset_kind = 4;
  string title = 5;
  uint64 price_fen = 6;
  uint32 fee_bps = 7;
  uint64 cooling_ms = 8;
  uint64 notice_end_ms = 9;
  uint64 sale_end_ms = 10;
  string state = 11;
  string phase = 12;
  string order_id = 13;
  bool designated_only = 14;
}
message RmbConsignmentResponse {
  TipInfoMessage error_message = 1;
  RmbConsignmentView listing = 2;
  uint64 server_now_ms = 3;
}
message ListRmbConsignmentsResponse {
  TipInfoMessage error_message = 1;
  repeated RmbConsignmentView listings = 2;
  string next_cursor = 3;
  uint64 server_now_ms = 4;
}
message ListSellerIncomesRequest { string cursor = 1; uint32 limit = 2; }
message RmbSellerIncome {
  string order_id = 1;
  uint64 gross_fen = 2;
  uint64 fee_fen = 3;
  uint64 net_fen = 4;
  uint64 reserved_fen = 5;
  uint64 paid_fen = 6;
  uint64 available_ms = 7;
  uint64 dispute_frozen_fen = 8;
  string dispute_case_id = 9;
}
message ListSellerIncomesResponse {
  TipInfoMessage error_message = 1;
  repeated RmbSellerIncome incomes = 2;
  string next_cursor = 3;
  uint64 server_now_ms = 4;
}
message CreateWithdrawalRequest { string client_request_id = 1; uint64 amount_fen = 2; }
message GetWithdrawalRequest { string withdrawal_id = 1; }
message RmbWithdrawalView {
  string withdrawal_id = 1;
  uint64 amount_fen = 2;
  string state = 3;
  string channel = 4;
  string transaction_id = 5;
}
message WithdrawalResponse { TipInfoMessage error_message = 1; RmbWithdrawalView withdrawal = 2; }

// ---------------------------------------------------------------------------
// 悬赏求书求购单(kind 7,docs/design/skill-book-wanted-order-trade-escrow.md)。
// 消息名用 WantedSkillBook 打头,刻意与 scene 旧协议的 SkillBookWantedOrder* 区分:迁移期两套并存,客户端也同时编译两套。
// 撤单走 CancelCommerceOrder,查单走 GetCommerceOrder;揭榜的结果按同一请求号重发揭榜查询(§3.3)。
// ---------------------------------------------------------------------------

// 求购单在客户端显示的阶段,由服务端按合同状态推导,不落库。
enum WantedSkillBookOrderPhase {
  WANTED_SKILL_BOOK_ORDER_PHASE_UNSPECIFIED = 0;
  WANTED_SKILL_BOOK_ORDER_PHASE_ESCROWING = 1;   // 正在托管悬赏银两(发榜刚提交)
  WANTED_SKILL_BOOK_ORDER_PHASE_OPEN = 2;        // 挂榜中,可以揭榜
  WANTED_SKILL_BOOK_ORDER_PHASE_FULFILLING = 3;  // 有人正在交书,别人暂时揭不了、发榜人暂时撤不了
  WANTED_SKILL_BOOK_ORDER_PHASE_DELIVERING = 4;  // 书正交给发榜人,之后税后银两交给揭榜人
  WANTED_SKILL_BOOK_ORDER_PHASE_SETTLED = 5;     // 已成交
  WANTED_SKILL_BOOK_ORDER_PHASE_CANCELLING = 6;  // 撤单或整单退回中
  WANTED_SKILL_BOOK_ORDER_PHASE_CANCELLED = 7;   // 已撤单,或悬赏银两没托管成
  WANTED_SKILL_BOOK_ORDER_PHASE_MANUAL = 8;      // 转人工核对
}

message WantedSkillBookOrderView {
  string order_id = 1;                // 不透明稳定订单号,与 CommerceOrderView.order_id 同一个
  uint64 poster_player_id = 2;        // 发榜人
  string poster_name = 3;             // 发榜时的角色名快照
  uint32 skill_table_id = 4;
  string skill_name = 5;              // 服务端按当前配表填;查不到为空
  uint32 scroll_id = 6;
  string scroll_name = 7;
  bool require_master_signature = 8;
  uint64 reward_gold = 9;             // 托管的悬赏银两(流通银两)
  uint64 seller_net_gold = 10;        // 扣 5% 集市税后揭榜人实得
  WantedSkillBookOrderPhase phase = 11;
  uint64 fulfiller_player_id = 12;    // 正在交书或已成交的揭榜人;挂榜中为 0
  uint64 created_ms = 13;
  uint64 version = 14;
  bool is_mine = 15;                  // 调用者是不是发榜人
}

// 发榜。悬赏银两在建单之后由 trade 从发榜人身上托管,银两不足时单子直接结案为已撤单(phase CANCELLED)。
message CreateWantedSkillBookOrderRequest {
  string client_request_id = 1;       // 8..80 字符;同一请求号同一内容重放回同一张单
  uint32 skill_table_id = 2;          // 求购的常规永久技能
  bool require_master_signature = 3;  // 只收带宗师署名的封卷道籍
  uint64 reward_gold = 4;             // 100..50000 流通银两
}

// 揭榜:交出背包里一枚未绑定的封卷道籍(3414)。书架里的书先在 scene 免费封卷(SealSkillBook),拿到道具号再揭榜。
// 同一请求号重发是查这一次揭榜的结果:交易中、交付中、已成交回订单;书没扣到回 TradeAssetNotTradable;
// 书不符合要求、已原样退回回 TradeWantedBookMismatch。
message FulfillWantedSkillBookOrderRequest {
  string order_id = 1;
  string client_request_id = 2;
  uint64 sealed_item_id = 3;
}

message WantedSkillBookOrderResponse {
  TipInfoMessage error_message = 1;
  WantedSkillBookOrderView order = 2;
  uint64 server_now_ms = 3;
}

// 悬赏榜。公开榜全服可见,只列挂榜中的单,按悬赏额从高到低;only_mine 列本人还没结案的单(含托管中、交易中、交付中)。
message ListWantedSkillBookOrdersRequest {
  uint32 filter_skill_table_id = 1;   // 0 = 全部;非 0 只看这门技能(页内过滤,一页可能不满,按 next_cursor 继续取)
  bool only_mine = 2;
  string cursor = 3;                  // 不透明游标,首页留空
  uint32 limit = 4;                   // 1..50,0 按 20
}

message ListWantedSkillBookOrdersResponse {
  TipInfoMessage error_message = 1;
  repeated WantedSkillBookOrderView orders = 2;
  string next_cursor = 3;             // 空 = 没有下一页
  uint64 server_now_ms = 4;
}

// ---------------------------------------------------------------------------
// 卖家店铺信用评分、近 7 日中位参考价与当面交易限额查询协议
// ---------------------------------------------------------------------------

enum SellerReviewRating {
  SELLER_REVIEW_RATING_UNSPECIFIED = 0;
  SELLER_REVIEW_RATING_POSITIVE = 1;
  SELLER_REVIEW_RATING_NEUTRAL = 2;
  SELLER_REVIEW_RATING_NEGATIVE = 3;
}

// 对外只返回脱敏后的店铺信用档案，严禁包含卖家原始账号、IP 或设备指纹。
message SellerCreditView {
  uint64 seller_player_id = 1;
  uint64 owner_revision = 2;
  bool ownership_changed = 3;
  uint64 ownership_changed_at_ms = 4;
  uint64 epoch_started_at_ms = 5;
  uint64 completed_orders = 6;
  uint64 positive_reviews = 7;
  uint64 neutral_reviews = 8;
  uint64 negative_reviews = 9;
  uint64 violation_count = 10;
  bool env_credit_cleared = 11;
  uint64 env_reset_count = 12;
  uint64 last_env_changed_at_ms = 13;
  uint32 credit_score = 14;         // [0, 100]
  uint32 star_rating_tenths = 15;   // [10, 50] => 1.0★ ~ 5.0★
  uint32 positive_rate_bps = 16;    // [0, 10000] 万分比好评率
  string risk_tier = 17;            // restricted / new_or_transferred / standard / trusted
}

message GetSellerCreditRequest {
  uint64 seller_player_id = 1;
}
message SellerCreditResponse {
  TipInfoMessage error_message = 1;
  SellerCreditView profile = 2;
  uint64 server_now_ms = 3;
}

message SubmitSellerReviewRequest {
  string order_id = 1;
  SellerReviewRating rating = 2;
  string comment = 3;
}
message SubmitSellerReviewResponse {
  TipInfoMessage error_message = 1;
  bool counted_for_score = 2;
  bool replayed = 3;
  SellerCreditView profile = 4;
  uint64 server_now_ms = 5;
}

message GetMarketReferencePriceRequest {
  uint32 item_config_id = 1;
  uint32 currency_type = 2;
}
message GetMarketReferencePriceResponse {
  TipInfoMessage error_message = 1;
  uint32 item_config_id = 2;
  uint32 currency_type = 3;
  uint64 median_unit_price = 4;
  uint32 sample_count = 5;
  bool insufficient_sample = 6;
  uint32 window_days = 7;
  uint64 server_now_ms = 8;
}

message GetPlayerTradeQuotaRequest {
  uint32 currency_type = 1;
}
message GetPlayerTradeQuotaResponse {
  TipInfoMessage error_message = 1;
  string mode = 2;
  uint32 currency_type = 3;
  uint64 daily_currency_limit = 4;
  uint64 daily_currency_used = 5;
  uint64 daily_currency_remaining = 6;
  repeated uint32 consumable_item_ids = 7;
  uint64 min_friend_duration_ms = 8;
  uint32 max_reference_deviation_pct = 9;
  uint64 cooling_lock_duration_ms = 10;
  uint64 server_now_ms = 11;
}
