syntax = "proto3";
option go_package = "robot/proto/common/component";



message MissionComp
{
	enum eMissionStatus
	{
	    E_MISSION_NORMAL = 0;
	    E_MISSION_ACHIEVEMENT = 1;
	    E_MISSION_COMPLETE = 2;
	    E_MISSION_TIME_OUT = 3;
	    E_MISSION_FAILD = 4;
	};
	uint32 id = 1;
	uint32 status = 2;
	repeated uint32 progress = 3;
	bytes data = 4; // Various buff data
}

message MissionListComp
{
	enum eMissionScope
	{
		kPlayerMission = 0;// Normal missions
		kPlayerAchievment = 1;// Achievements
		kPlayerDailyActivity = 2;// Daily activities
		kPlayerMissionSize = 3;// Max enum value
	}
	// 3 是接取时间 mission_begin_time:没有任何读取方,完成后也不删,2026-11-20 删除。
	reserved 3;
	map<uint32, MissionComp> missions = 1;
	// 已完成任务的存档位图:第 i 位 = 任务表位序 i,每字节低位在前,末尾全 0 的字节不写。
	// 位序由导表器只增不改、永不复用地发放(tools/data_table_exporter 的位序状态文件),所以能直接落盘。
	// 只在存档里有值,读写走 MissionsComp::CompletedBitsForSave / RestoreCompletedBits;运行时的任务列表里它是空的。
	bytes complete_missions = 2;
	uint32 type = 4;
    // 活动完成事实与任务、背包同属玩家快照；追踪偏好不进入这里。
    PlayerActivityLedger activity_ledger = 5;
}

message PlayerActivityPointSource {
  uint32 mission_scope = 1;
  uint32 mission_id = 2;
  uint32 rule_id = 3;
  uint64 configuration_revision = 4;
  uint64 period_id = 5;
  uint32 points = 6;
}

message PlayerActivityClaimRecord {
  uint32 rule_id = 1;
  uint64 configuration_revision = 2;
  uint64 period_id = 3;
  uint32 threshold_id = 4;
  string request_id = 5;
  uint32 reward_id = 6;
  uint64 claimed_at_ms = 7;
}

// 保留策略见 docs/design/player-features-ui.md「领取身份、提交与重启恢复」:三部分都不随时间增长。
message PlayerActivityLedger {
  // 积分来源:只留当前规则的当前周期(积分只按当前周期算),周期结束后在下一次记来源时删掉。
  repeated PlayerActivityPointSource sources = 1;
  // 领取记录:当前周期全留,已结束周期只留最新的若干条供重放原请求。
  repeated PlayerActivityClaimRecord claims = 2;
  // 已经记过积分的任务(一次性任务的永久去重):位图,格式同 MissionListComp.complete_missions,
  // 第 i 位 = 任务表位序 i。来源删了也靠它挡住同一任务再记一次。
  bytes credited_missions = 3;
}

message RewardListComp
{
	map<uint32, bool> can_reward_mission_id = 1;
}
