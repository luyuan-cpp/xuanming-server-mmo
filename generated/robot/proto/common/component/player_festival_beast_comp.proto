syntax = "proto3";
option go_package = "robot/proto/common/component";

// 瑞兽迎春限时活动角色持久化组件（docs/design/battle-festival-beast-implementation-contract.md）。
//
// 落在 player_database.festival_beast_component（字段 33，GROWTH 组），与宠物、技能、账本同事务提交。
// 持久数据：加载时无条件挂组件（旧存档缺失默认为空合法），存盘缺组件 fail-closed 拒存。

// 单期累计胜场进度（按期次隔离，未满 required_wins 不跨期累计；上限夹紧到 required_wins）。
message FestivalBeastPeriodProgress {
  uint32 activity_instance_id = 1;
  uint32 wins = 2;
  uint32 required_wins = 3;
  uint64 last_win_at_ms = 4;
  string reward_identity = 5;
}

// 永久待领资格（达标时冻结奖励定义与版本，跨活动结束/离线/换期永久保留）。
message FestivalBeastPermanentEligibility {
  string reward_identity = 1;
  uint32 reward_definition_version = 2;
  uint32 reward_pet_table_id = 3;
  uint32 source_activity_instance_id = 4;
  uint64 earned_at_ms = 5;
  uint64 earned_battle_id = 6;
}

// 终身领取回执（按 reward_identity 唯一；同请求 UUID 重放原结果，异 UUID 并发收敛至同一只 pet_id）。
message FestivalBeastClaimReceipt {
  string reward_identity = 1;
  string request_id = 2;
  uint32 reward_definition_version = 3;
  uint32 reward_pet_table_id = 4;
  uint64 pet_id = 5;
  uint64 claimed_at_ms = 6;
}

// 持久化在途开局状态（新设备无本地 UUID 时，通过 GetFestivalBeastDetail 直接恢复）。
message FestivalBeastPendingLaunch {
  string request_id = 1;
  uint32 activity_instance_id = 2;
  uint32 config_revision = 3;
  string reward_identity = 4;
  uint64 locked_pet_id = 5;
  uint32 locked_owner_level = 6;
  uint32 matched_tier_id = 7;
  uint32 battle_config_id = 8;
  uint32 launch_state = 9; // 1=LAUNCHING, 2=ADMITTED, 3=REJECTED, 4=UNKNOWN
  uint64 battle_id = 10;
  uint64 requested_at_ms = 11;
  uint64 admitted_at_ms = 12;
  uint32 reject_tip_id = 13;
  string reject_reason = 14;
}

message PlayerFestivalBeastComp {
  uint64 state_revision = 1;
  repeated FestivalBeastPeriodProgress period_progress = 2;
  repeated FestivalBeastPermanentEligibility eligibilities = 3;
  repeated FestivalBeastClaimReceipt claim_receipts = 4;
  FestivalBeastPendingLaunch pending_launch = 5;
}
