syntax = "proto3";
option go_package = "robot/proto/common/component";


// Normal login
message NormalLogin
{
}

// Session takeover login
message CoverLogin
{
}

message Player
{
}

message Account
{
	string account = 1;
}

message UnregisterPlayer
{
	// Wall-clock millis when HandleExitGameNode was called (and SavePlayer
	// was enqueued). Used to detect saves that outrun the player_locator
	// reconnect lease (30s). See todo.md #280 / NOTES Part 2 P0.
	int64 logout_initiated_ms = 1;
}

// NOTE: PlayerFrozenComp is intentionally NOT defined here.
// It is a pure runtime marker (no persistence, no serialization, no IPC),
// declared in cpp/libs/services/scene/player/comp/player_frozen_comp.h as
// a plain C++ struct — proto is the wrong tool for "transient ECS tag".
// See docs/design/cross-zone-readiness-audit.md §3.2 件 2.

message PlayerUint64Comp
{
	uint64 registration_timestamp  = 1;
	// 挂机月卡到期的 Unix 秒(docs/design/afk-monthly-card.md §3)。0 = 从未开通或已清除;<= 现在 = 已到期。
	// 事实源就是这一份(存档 PROFILE 行):唯一写入方 AfkPassSystem(灵石开通、GM),其余代码只读;
	// 玩家域 Redis 的 player:afk_pass:{<player_id>} 只是它提交之后的投影。
	uint64 afk_pass_expires_at = 2;
}

message PlayerUint32Comp
{
	uint32 class  = 1;
}

// 角色展示资料(名字)。
// 真源是 data_service 全局库的 player_name 表(全服唯一,docs/design/guild-phase2/03-names.md §3.0);
// 这里是随 player_database 一起走的只读副本,由 login 首次入场补齐
// (go/login/.../player_class_backfill.go backfillPlayerIdentity)。
// 战斗快照 player_battle.cpp 取的就是这一份,组件缺失 / name 为空时快照留空,battle 照常结算(名字是展示数据,fail-open)。
// 副本可能缺失(self-heal 恢复出的空记录、早于首次入场的回档快照),任何"要拿到名字"的读侧都必须能回源 BatchGetPlayerName。
// 角色改名(docs/design/rename-and-content-safety.md §4)之后 scene 是 name 的写者:data_service 回了「已提交」才改写,
// 改名的进度也记在这里(rename_op),和背包、物品预留同一笔存盘。其余字段 scene 仍然只读、原样存回。
message PlayerProfileComp
{
	string name = 1;
	// 随存档原样往返；login 首次入场从账号补空，scene/战斗/队伍只读。
	string appearance_id = 2;
	uint32 gender = 3; // 1=男 2=女；0=旧存档未补齐，与外观 ID 独立。
	// 最近一次发出的改名流水号(RenameRoleRequest.seq)。只增不减;data_service 回 STALE_SEQ 时追到它记的号。
	uint64 rename_seq = 4;
	// 上一次改名成功的时刻 Unix 毫秒,0 = 没改过。只用来在本地预判冷却、少发一次无用请求;真正的判定在 data_service。
	uint64 renamed_ms = 5;
	// 进行中的改名;没有这个字段 = 没有改名在进行。
	PlayerRenameOp rename_op = 6;
	// 角色形象免费试用位图(docs/rules/bit-storage-and-table-ids.md):
	// 第 i 位对应 CharacterAppearance 表经导表器分配的 bit_index i(低位在前,末尾全 0 字节不写)。
	// 置 1 表示该角色已使用过对应形象的 1 小时免费试用资格;高位未知 bit 混跑时原样透传不截断。
	bytes appearance_trial_used_bits = 7;
	// 当前正在试用的形象 ID(空串 = 无试用中);展示生效形象由 PlayerAppearanceSystem::EffectiveAppearanceId 计算。
	string trial_appearance_id = 8;
	// 当前试用到期的 Unix 秒;0 = 无试用中;<= 现在 = 已到期(下次加载或 Tick 自动清理并广播还原)。
	uint64 trial_expires_at = 9;
	// 永久形象切换序号(每次成功变更永久形象时递增),用于可靠同步到 data_service 账号角色目录。
	uint64 appearance_switch_seq = 10;
	// 已永久拥有的角色形象位图(docs/rules/bit-storage-and-table-ids.md):
	// 第 i 位对应 CharacterAppearance 表经导表器分配的 bit_index i(低位在前,末尾全 0 字节不写)。
	// 置 1 表示该角色已永久拥有对应形象,可随时 0 消耗免费切换;高位未知 bit 混跑时原样透传不截断。
	// 当前永久形象 appearance_id(若存在于配表)天然视作已拥有,并在首次切换离场时自动补位落盘。
	bytes appearance_owned_bits = 11;
}

// 一次进行中的改名(scene 写,随存档落库)。落库之后 scene 才向 data_service 发 RenameRole,所以任何一步断掉都能从存档接着做:
// 下次入场按同一个 seq 重发,拿到结局再扣卡、改名或解除占用。
message PlayerRenameOp
{
	uint64 seq = 1;
	// 新名原文(已经过内容安全送检)。
	string name = 2;
	// 占住改名卡的那份物品预留的号(PlayerItemHoldComp,种类 rename)。改名成功时释放预留并扣卡,不成时只释放。
	uint64 hold_id = 3;
	// 占住的改名卡:配置号与数量(发起时配表 RoleNameRule 的值,之后配表改了也按这一份结算)。
	uint32 card_item_id = 4;
	uint32 card_count = 5;
	uint64 started_ms = 6;
}

// Stress-test instrumentation for player-data persistence.
//
// Stamped by the producer (Scene's SavePlayer when an env-var probe
// is enabled, or by the data_stress driver / robot data-stress mode) and
// verified by tools/cmd/verifier so we can prove "last write wins" through
// the Kafka -> DB -> MySQL+Redis pipeline without doing per-field deep
// diffs. Fields default-empty in normal play, so they cost nothing on disk
// or wire when unused.
message PlayerStressTestProbe
{
	// Monotonic per-(player_id, msg_type) sequence. Verifier asserts
	// MySQL.test_seq == Redis.test_seq == max(test_seq) ever published.
	uint64 test_seq = 1;
	// HMAC-style signature over (player_id || msg_type || test_seq || nonce).
	// Used to detect torn / mis-routed / replayed payloads — if test_sig
	// matches the recomputed value we know the row was not silently
	// reassembled or fed from a different stream.
	bytes  test_sig = 2;
}

