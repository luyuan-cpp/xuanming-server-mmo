syntax = "proto3";
option go_package = "robot/proto/common/component";



// scene 玩家实体上的组队成员关系(设计文档 docs/design/team-system.md §B.3、§F.2)。
// 真值在 match 的 SQL 权威,scene 经 TeamAuthority/ReadMembership 读。
message TeamId
{
  uint64 team_id = 1;
  uint64 membership_epoch = 2;   // 该玩家成员关系版本:scene 仅当 incoming epoch 更大时才改组件(乱序/重复信号安全)
}
