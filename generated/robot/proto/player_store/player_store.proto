syntax = "proto3";
// 包名不能叫 player_store:mysql_database_table.proto 没有 package,里面的表消息 player_store
// 全名就是 player_store,同名的包会和它撞(表名守卫要求消息全名等于表名,那边不能改)。
package playerstore;

option go_package = "robot/proto/player_store";
option cc_generic_services = false;

import "proto/common/base/service_call_auth.proto";
import "proto/common/rollback/player_snapshot.proto";
import "proto/common/rollback/transaction_log.proto";
import "proto/db/proto_option.proto";

// 玩家存盘直接提交 TiDB 的协议,规格见 docs/design/player-save-direct-commit.md。
// go/db 提供,只有 scene 调用。内部服务,不进客户端协议。
//
// 字段号上线后不复用,删字段写 reserved(AGENTS §4)。

service PlayerStore {
  // 认领写权并读出完整存档,一个事务。
  rpc LoadAndClaim(LoadAndClaimRequest) returns (LoadAndClaimResponse) {}
  // 一次存盘,一个事务。返回 gRPC 错误就是结果未知,用同样的内容、同一个序号重试。
  rpc SavePlayer(SavePlayerRequest) returns (SavePlayerResponse) {}
}

// player_store 表一个玩家一组行。kind 0 是写权行,其余每个 kind 一行,payload 是
// player_database 按字段投影出来的一段序列化结果。字段属于哪一行由字段选项 OptionPersistGroup 声明,
// 每一行怎么存由这里的 OptionPersistRowSavePolicy 声明(规格 §1.1)。两处漏标 scene 都拒绝启动。
//
// 分行只按「大小 × 变化频率 × 是否一起变」分,是性能决定;一致性由「一次存盘的所有脏行同事务、同一个整笔序号」保证,
// 与分行无关(规格 §1.1)。所以 I3 这类「必须同一次提交」的不变量不要求同一行。
//
// 1、2 是 2026-11-05 退役的 HOT、ASSET:字段拆到了 CHARACTER、WALLET、BAG、LOCATION、PROFILE。
// 5 是随 player_database_1 一起删掉的 LEGACY1(规格 §1.2)。退役号不复用,
// 旧库残留的 1、2、5 行按未知 kind 拒绝加载,不会被当成新行误读(项目未上线,遇到就清库)。
// 新加一行取下一个空闲号,不回填空号。
enum PlayerStoreKind {
  reserved 1, 2, 5;
  reserved "PLAYER_STORE_KIND_HOT", "PLAYER_STORE_KIND_ASSET", "PLAYER_STORE_KIND_LEGACY1";
  PLAYER_STORE_KIND_OWNER = 0;    // 写权行,payload 恒为空
  // 技能、加点、宠物、任务。中等大小,随进度变
  PLAYER_STORE_KIND_GROWTH = 3 [(OptionPersistRowSavePolicy) = PERSIST_ROW_SAVE_PERIODIC];
  // 职业、注册时间、名字副本、外观、性别、近期战斗结果、物品获取封禁、压测探针。都很小,大多建角后不变
  PLAYER_STORE_KIND_PROFILE = 4 [(OptionPersistRowSavePolicy) = PERSIST_ROW_SAVE_PERIODIC];
  // 等级、基础属性与当前血蓝。小,战斗和升级时变
  PLAYER_STORE_KIND_CHARACTER = 6 [(OptionPersistRowSavePolicy) = PERSIST_ROW_SAVE_PERIODIC];
  // 货币、资产通道账本、收件箱账本、神秘商人限购。小,任何经济行为都会改它
  PLAYER_STORE_KIND_WALLET = 7 [(OptionPersistRowSavePolicy) = PERSIST_ROW_SAVE_PERIODIC];
  // 背包道具。最大的一行,只在道具操作时变;和钱包分开,改几个铜板不用重写整个背包
  PLAYER_STORE_KIND_BAG = 8 [(OptionPersistRowSavePolicy) = PERSIST_ROW_SAVE_PERIODIC];
  // 位置。一直在变、丢了不心疼:只顺带写,不单独触发存盘
  PLAYER_STORE_KIND_LOCATION = 9 [(OptionPersistRowSavePolicy) = PERSIST_ROW_SAVE_PIGGYBACK];
}

message PlayerStoreRow {
  PlayerStoreKind kind = 1;
  bytes payload = 2;
}

// 判定表见规格 §4。COMMITTED 与 EQUAL 都算提交成功。
enum SavePlayerResult {
  SAVE_PLAYER_RESULT_UNSPECIFIED = 0;
  SAVE_PLAYER_COMMITTED = 1;         // 本次写入并提交
  SAVE_PLAYER_EQUAL = 2;             // 同序号已经提交过,幂等成功
  SAVE_PLAYER_NO_OWNER = 3;          // 写权行不存在
  SAVE_PLAYER_INVALID = 4;           // 请求不合法:E、q、实例为空,或 kind 非法、重复
  SAVE_PLAYER_STALE_OWNER = 5;       // 请求的代次比库里低,已被接管
  SAVE_PLAYER_NOT_HOLDER = 6;        // 同代次,但持有者不是这个实例
  SAVE_PLAYER_UNCLAIMED = 7;         // 代次更高,但持有者不是这个实例,没有认领过
  SAVE_PLAYER_OLDER_SEQ = 8;         // 迟到的旧序号
  SAVE_PLAYER_SCHEMA_REGRESSED = 9;  // 世代低于库里的世代
  SAVE_PLAYER_SCHEMA_TOO_NEW = 10;   // 世代高于 go/db 认识的世代,发布顺序问题
  SAVE_PLAYER_TOO_LARGE = 11;        // payload 超预算
}

message SavePlayerRequest {
  common.base.ServiceCallAuth auth = 1;
  uint64 player_id = 2;
  uint32 storage_id = 3;             // 认领时返回的落点;0 只用于实体已没的空行释放,由 go/db 查落点
  uint64 owner_epoch = 4;
  uint64 save_seq = 5;
  uint32 schema_gen = 6;
  bytes instance_id = 7;             // scene_instance_id
  repeated PlayerStoreRow rows = 8;  // 有变化的片段,可以为空
  bool release = 9;                  // 最终存盘:提交后释放写权
  // 审计发件箱(docs/design/player-audit-outbox.md,断线重连 R13):这名玩家水位不大于这份快照的审计记录。
  // COMMITTED 时 go/db 在提交存档的同一个事务里把它们写进本存档库的 player_audit_outbox,再由转发循环投 Kafka。
  // 审计内容不会让存盘被拒:坏的单条记录跳过并计数(设计 §6.3)。
  repeated TransactionLogEntry transaction_logs = 10;  // 原样进发件箱,tx_id 是去重键
  // 快照请求:只用 snapshot_id、trigger、schema_version、zone_id。player_database_blob、snapshot_time、total_bytes、
  // player_id 由 go/db 按这一笔写完之后的全部数据行在事务里填,请求里带了也会被覆盖。
  repeated PlayerSnapshotEntry audit_snapshots = 11;
}

message SavePlayerResponse {
  SavePlayerResult result = 1;
  uint64 row_owner_epoch = 2;  // 拒绝时带回库里的值
  uint64 row_save_seq = 3;
  // 认识字段 10、11 的 go/db 在 COMMITTED、EQUAL 时置真。只为新旧混跑兜底:旧 go/db 不认识审计字段,存档照样提交、审计静默丢掉,
  // scene 看到带了审计却没置真就不放行这些记录,随下一笔再交(设计 §4、§5.2)。
  bool audit_outbox_written = 4;
}

// player_audit_outbox.kind 的取值(表声明在 proto/common/database/mysql_database_table.proto)。
// 号只增不复用;转发循环只读自己认识的 kind,滚动升级时新版本写的新 kind 留给新版本投。
enum PlayerAuditKind {
  PLAYER_AUDIT_KIND_UNSPECIFIED = 0;
  PLAYER_AUDIT_KIND_TRANSACTION_LOG = 1;   // 序列化的 TransactionLogEntry,投 transaction_log_topic
  PLAYER_AUDIT_KIND_PLAYER_SNAPSHOT = 2;   // 序列化的 PlayerSnapshotEntry,投 player_snapshot_topic
}

enum LoadAndClaimResult {
  LOAD_AND_CLAIM_RESULT_UNSPECIFIED = 0;
  LOAD_AND_CLAIM_CLAIMED = 1;        // 认领成功,响应里是完整存档
  LOAD_AND_CLAIM_NO_OWNER = 2;       // 写权行不存在:角色不存在或未建完,不造空档
  LOAD_AND_CLAIM_INVALID = 3;        // 请求不合法:E 或实例为空
  LOAD_AND_CLAIM_STALE_OWNER = 4;    // 路由过期,候选代次比库里低
  LOAD_AND_CLAIM_NOT_HOLDER = 5;     // 同代次已被别的实例持有
  LOAD_AND_CLAIM_SCHEMA_TOO_NEW = 6; // 库里的世代比本进程新,拒绝加载
}

message LoadAndClaimRequest {
  common.base.ServiceCallAuth auth = 1;
  uint64 player_id = 2;
  uint64 owner_epoch = 3;       // 路由带来的候选代次
  bytes instance_id = 4;
  uint32 binary_schema_gen = 5;
}

message LoadAndClaimResponse {
  LoadAndClaimResult result = 1;
  uint32 storage_id = 2;
  uint64 owner_epoch = 3;       // 写权行当前值
  uint64 save_seq = 4;
  uint32 schema_gen = 5;
  repeated PlayerStoreRow rows = 6;
}
