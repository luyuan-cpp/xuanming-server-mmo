syntax = "proto3";
option go_package = "robot/proto/battle";

import "proto/common/component/actor_comp.proto";
import "proto/common/component/actor_attribute_state_comp.proto";
import "proto/common/component/equipment_effects.proto";
import "proto/common/component/support_effects.proto";
import "proto/common/component/pet_cultivation_effects.proto";

// 回合制战斗共享数据结构(快照/行动/事件/结算)。
// 设计依据:docs/design/turn-based-battle-server.md §4。
// 类型纪律:battle_id/player_id/buff_id 为 uint64;table_id/session_id/回合数为 uint32;
// 时间戳为 uint64 毫秒;属性 uint64(宪法 §4)。

// ---- 路由信息:battle 节点出站消息(Kafka)所需的全部定位数据,快照携带,battle 不查 etcd ----
message BattleRouting {
  uint32 session_id = 1;
  uint32 gate_node_id = 2;
  string gate_instance_id = 3;   // gate 实例 UUID(GateCommand.target_instance_id 防僵尸)
  uint32 scene_node_id = 4;
  string scene_instance_id = 5;  // scene 实例 UUID(SceneCommand.target_instance_id 防僵尸)
  uint32 zone_id = 6;
}

// ---- 参战 buff(时间维度已换算为回合,见设计文档 §5.1 换算策略) ----
message BattleBuffEntry {
  // buff 实例 id,只在所属单位的 buff 列表里用来认出这一条,不跨重启:快照带来的沿用 scene 的进程内临时号
  // (tlsIdGeneratorManager.buffIdGenerator,[node_id][seq] 拼成),战斗内新加的由引擎在局内自增域里接着往上发
  // (turn_battle_engine 的 nextBuffInstanceId)。不是 SnowFlake,也不是发号器的永久 ID,不要解析。
  uint64 buff_id = 1;
  uint32 buff_table_id = 2;  // BuffTable 表 id
  uint32 layer = 3;          // 叠层数
  uint32 remain_rounds = 4;  // 剩余回合(0 = 无限持续)
  uint64 caster_id = 5;
  // 四职业技能的属性增减(docs/design/class-skills.md §6.4):带符号比例,0.25 = +25%、-0.15 = -15%。
  // 施加时按施法者当时的技能等级算定并存在这里,之后升级 / 换人都不改它;0 = 不是这类 buff(老 buff 全为 0)。
  // 改的是哪一项由 Buff 表的 buff_type 决定(turn_battle_constants.h ClassSkillStatOfBuffType)。
  double stat_percent = 6;
  // 施加(或刷新)它的回合号。回合末结算时不扣它这一回合,所以"持续 2 回合"是完整的 2 回合;0 = 老口径(当回合末就扣)。
  uint32 applied_round = 7;
  uint32 source_skill_id = 8;
  uint64 snapshot_value = 9; // 施加时的效果快照，催毒仍使用原来源强度。
  uint64 remaining_capacity = 10;
  uint32 remaining_hits = 11;
  uint32 remaining_ticks = 12;
  uint32 extensions_used = 13;
  uint32 last_trigger_round = 14;
  uint32 trigger_count = 15;
  uint32 tick_round = 16;
  uint32 stacks = 17;
  uint32 chosen_stat = 18;
  uint64 secondary_value = 19;
  optional double outgoing_heal_snapshot = 20; // 持续恢复施放时快照完整施放方修正，每跳只读受方修正。
}

// ---- 战斗内道具副本 ----
message BattleItemEntry {
  uint32 item_table_id = 1;
  uint64 count = 2;
}

// ---- 玩家战斗快照:scene 在 PrepareBattle 时构建,是战斗内玩家数据的唯一来源 ----
message BattlePlayerSnapshot {
  uint64 player_id = 1;
  string player_name = 2;
  uint32 level = 3;
  BaseAttributesComp base_attributes = 4;  // 含 speed(出手序)
  uint64 max_health = 5;
  uint64 max_mana = 6;
  repeated uint32 skill_table_ids = 7;     // 战斗可用技能(SkillTable id)
  repeated BattleBuffEntry buffs = 8;      // 参战时携带的持续 buff
  repeated BattleItemEntry items = 9;      // 战斗可用消耗品数量副本
  BattleRouting routing = 10;
  uint32 team_index = 11;                  // 0 = A 方(进攻),1 = B 方
  string table_fingerprint = 12;           // 出快照的 scene 节点的战斗配表指纹(与 PrepareBattleResponse.table_fingerprint 同值)
  uint64 physical_attack = 13;             // 二级属性(属性加点系统):物伤,scene 侧由 DerivedAttributes 填;引擎 InitPlayers 直接透传给 BattleActorState
  uint64 magic_attack = 14;                // 法伤
  uint64 defense = 15;                     // 防御
  // 出战宝宝(宝宝系统,player-pet.md §5):与主人同队的独立行动单位。
  // 核心线同时只能带 1 只,repeated 是为了二期多宠不改 wire。
  repeated BattlePetSnapshot pets = 16;
  string appearance_id = 17; // 与主城、选角一致的玩家外观身份。
  uint32 class_id = 18;
  uint32 gender = 19;
  // 战斗类属性的装备加成(必杀 / 连击 / 反击 / 反震 / 抗性等,equipment-attributes.md §3.3)。
  // scene 侧原样拷自 DerivedAttributesComp.combat;不带 = 全 0 = 引擎行为与装备系统落地前逐位一致。
  CombatAttributes combat = 20;
  // 已学职业技能的生效等级(skill_table_id -> 等级,含被动;docs/design/class-skills.md §6.1)。
  // scene 按职业 / 角色等级夹好再填,引擎再按同一规则复核一次。旧通用技能不进这里。
  // 被动的属性加成 scene 已算进上面的派生属性,引擎只消费战斗专用被动(治疗加成),不重复叠加。
  map<uint32, uint32> skill_ranks = 21;
  uint32 pet_capture_slots = 22; // scene 核定的本局可捕捉数量；旧快照缺省为0。
  EquipmentEffects equipment_effects = 23; // 仅人物装备，宝宝不继承。
  uint32 active_season_id = 24; // 开局由 scene 冻结的当前赛季编号（0 = 无活跃赛季）；引擎据此复核赛季限定技能。
  // true = 帮会帮战 V2 守旗阵 AI 托管单位(docs/design/guild-play-v2.md):强制自动行动、不等待真人指令、不发个人结算与 660 额度。
  bool ai_controlled = 25;
  // 论剑 V3 战前 15 秒明牌变阵备选灵宠快照（仅正式自养论剑/锦标赛由 scene 填充至多 5 只合规备选，满血满蓝且战后不回写）。
  repeated BattlePetSnapshot standby_pets = 26;
  // 论剑 V3 当季可用全部赛季印快照（全员免费临场切换机制槽，不重算人物基础气血/防御万分比）。
  repeated SeasonSealEffect available_season_seals = 27;
  // 五行阵法 ID（0=无阵，1天覆/2地载/3风扬/4云垂/5虎翼；免费切换，组队按阵位最小者生效）。
  uint32 formation_id = 28;
  // 五行幻境·轻肉鸽周常爬塔权威上下文（由 Scene 从 PlayerSeasonComp 注入，客户端不可伪造）。
  WuxingTowerBattleContext tower_context = 29;
  // 赛季周环境对称词缀 ID（开局由 scene 冻结，0=无/禁用，1护盾过载/2灵息充盈/3先机守势/4锋芒竞速）。
  uint32 season_weekly_affix_id = 30;
  // 玩家已启用的技能特效外观映射（skill_table_id -> SkillVfxCosmetic.id，纯战斗画面表现零数值）。
  map<uint32, uint32> equipped_skill_vfx = 31;
  // 本局所属队伍的队长标记（由 match 在锦标赛/组排成局时填入，用于 3 Ban 同票决胜；单排/路人全 false）。
  bool is_team_captain = 32;
  // 未成年人当天能玩到的时刻(Unix 毫秒;0 = 不限:成年人、平台管的小游戏渠道、没开防沉迷的部署)。
  // 由 match 在成局时从玩家会话记录 PlayerSession.minor_play_deadline_ms 填入,scene 不填、填了也被覆盖。
  // battle 据此给这名参战者的票据封顶、到点关闭他的战斗直连并在本场剩余时间里拒绝他握手;战斗本身照常进行
  // (docs/design/real-name-anti-addiction.md §5.4)。只用于直连准入,引擎不读。
  uint64 minor_play_deadline_ms = 33;
}

// ---- 宝宝战斗快照:与主人同队、独立行动的战斗单位(设计文档 player-pet.md §5)----
// 属性口径与玩家快照逐项对齐:base_attributes 带 speed(出手序)与当前 HP/MP,
// max_* 与物伤/法伤/防御来自 PetSystem 现算的二级属性。
message BattlePetSnapshot {
  // 宝宝的永久 id(scene 从 item 号段取)。**不是**局内 actor_id:号段改造后 player_id 与
  // pet_id 都从 1 起发,直接当 actor_id 会让 N 号玩家与 N 号宝宝同号。引擎给宝宝另发
  // kPetActorIdBase 段的局内号,真实 pet_id 存进 BattleActorState.pet_id,结算回写只认它。
  uint64 pet_id = 1;
  uint64 owner_player_id = 2;     // 主人;决定队伍与结算归属
  string pet_name = 3;
  uint32 pet_table_id = 4;
  uint32 level = 5;
  BaseAttributesComp base_attributes = 6;
  uint64 max_health = 7;
  uint64 max_mana = 8;
  uint64 physical_attack = 9;
  uint64 magic_attack = 10;
  uint64 defense = 11;
  repeated uint32 skill_table_ids = 12;
  map<uint32, uint32> skill_ranks = 13; // 公共原型的已学等级，开局再次校验宝宝资格。
  PetCultivationEffects pet_cultivation = 14;
  // true = 论剑排位竞技临时宝宝(pet_id 恒为 0),仅在校验通过的排位规则下生成局内单位,不写回场外宠物。
  bool competitive_temporary = 15;
  // 排位竞技战斗物种(Pet.id);展示外观仍看 pet_table_id(有出战宝宝时沿用其外观,零宠时与本字段相同)。
  uint32 combat_pet_table_id = 16;
  // 当前穿戴的灵宠幻化 ID 与客户端稳定外观资源键（空串/0 = 原形，纯外观零数值）。
  uint32 cosmetic_id = 17;
  string cosmetic_art_key = 18;
}

// ---- 战斗单位运行时状态(玩家与怪物统一;引擎状态用 proto 承载,宪法 §3) ----
enum eBattleActorType {
  BATTLE_ACTOR_TYPE_NONE = 0;
  BATTLE_ACTOR_TYPE_PLAYER = 1;
  BATTLE_ACTOR_TYPE_MONSTER = 2;
  BATTLE_ACTOR_TYPE_PET = 3;     // 宝宝:与主人同队,无客户端行动权,由默认行动路径代打
}

message BattleActorState {
  uint64 actor_id = 1;              // 玩家 = player_id;怪物 / 宝宝 = 引擎局内序号(bit63 打标,见 kEngineLocalActorIdFlag)
  eBattleActorType actor_type = 2;
  uint32 team_index = 3;
  string name = 4;
  uint32 level = 5;
  BaseAttributesComp attributes = 6;
  uint64 max_health = 7;
  uint64 max_mana = 8;
  bool is_dead = 9;
  bool is_defending = 10;           // 本回合防御(受伤减半)
  bool fled = 11;                   // 已逃离战斗
  repeated BattleBuffEntry buffs = 12;
  repeated uint32 skill_table_ids = 13;
  uint32 monster_table_id = 14;     // 仅怪物有效(MonsterTable id)
  map<uint32, uint32> skill_cooldown_rounds = 15; // skill_table_id -> 剩余冷却回合
  bool is_auto = 16;                // 自动战斗(挂机):回合内视为已就绪,结算时按默认行动出手
  uint32 formation_slot = 17;       // 阵位 0-9:0-4 前排(左→右),5-9 后排;演出站位用,不参与判定
  uint64 physical_attack = 18;      // 物伤(来自快照;怪物 0)
  uint64 magic_attack = 19;         // 法伤(来自快照;怪物 0)
  uint64 defense = 20;              // 防御(来自快照;怪物 0)
  uint64 owner_player_id = 21;      // 仅宝宝有效:主人 player_id(结算按它归属到主人名下)
  uint32 pet_table_id = 22;         // 仅宝宝有效(Pet 表 id)
  uint64 pet_id = 23;               // 仅宝宝有效:真实 pet_id(结算回写认它;actor_id 是引擎局内号)
  string appearance_id = 24; // 玩家来自快照；重连/观战保持同一身份。
  uint32 class_id = 25;
  uint32 gender = 26;
  // 战斗类属性的装备加成(来自快照;怪物 / 宝宝全 0)。只供引擎判定用:
  // 下发给客户端的状态快照里会被清空,不暴露对手的装备概率。
  CombatAttributes combat = 27;
  // 本局职业技能生效等级(来自快照 skill_ranks,引擎复核后的值;怪物 / 宝宝为空)。
  map<uint32, uint32> skill_ranks = 28;
  uint32 capture_pet_table_id = 29; // 仅可捕捉的普通野怪填写，0表示不可捕捉。
  uint64 captured_by_player_id = 30; // 成功捕捉者；不计为击杀，不产生怪物掉落。
  uint32 capture_min_level = 31;
  map<uint32, uint32> ability_use_counts = 32; // 本场限次；技能表定义上限。
  repeated uint32 runtime_skills = 33; // 非主动技能也保留，供被动、追击、开场查询。
  uint32 withdraw_until_round = 34; // 劝退返回边界；与阵亡分开。
  map<uint32, uint64> round_effect_usage = 35; // 来源技能的全体目标共享回合预算，下一回合清零。
  EquipmentEffects equipment_effects = 36;
  repeated BattleArtifactState artifact_states = 37;
  uint64 entry_max_health = 38; // 入战上限，临时上限变化不放大法宝预算。
  uint64 entry_max_mana = 39;
  PetCultivationEffects pet_cultivation = 41; // 宝宝独立条目贡献，开局快照冻结。
  SupportEffectSummary support_effects = 40; // 仅本人可见；来源及中立预览由本轮真实状态生成。
  bool competitive_temporary = 42; // true = 论剑排位临时竞技单位,结算不产出永久宠物回写项。
  bool is_boss = 43; // true = 首领单位（来自 MonsterTable.is_boss）；不可被复制技能选中，客户端选目标阶段置灰。
  BattleArtifactState season_seal_state = 44; // 单槽赛季印的局内次数状态（不占用永久法宝 item_id 列表，下发客户端前清除）。
  uint32 charging_skill_id = 45; // 非 0 表示当前处于明牌蓄力状态（如 E01/E02），下回合正常行动自动释放；对敌我双方均可见。
  string pet_cosmetic_art_key = 46; // 仅灵宠有效：生效幻化外观客户端资源键（空串 = 原形，缺图回退原形）。
  map<uint32, uint32> equipped_skill_vfx = 47; // 仅玩家有效：生效技能特效外观映射（skill_table_id -> SkillVfxCosmetic.id）。
  uint32 win_streak = 48; // 正式排位开局前本季连胜数（>=3 时展示「连胜势 ×N」并供终局破势终结判定，非排位/未达 3 为 0）。
}

// 法宝按物品实例记录次数；死亡不刷新已用次数，仅清除待用补偿。
message BattleArtifactState {
  uint64 item_id = 1;
  uint32 used_count = 2;
  uint32 last_trigger_round = 3;
  uint32 round_trigger_count = 4;
  uint32 pending_ailment_kind = 5;
  uint32 pending_round = 6;
}

// ---- 玩家行动指令 ----
enum eBattleActionType {
  BATTLE_ACTION_NONE = 0;
  BATTLE_ACTION_ATTACK = 1;  // 普攻
  BATTLE_ACTION_SKILL = 2;
  BATTLE_ACTION_DEFEND = 3;  // 防御:本回合受伤减半
  BATTLE_ACTION_ITEM = 4;    // 使用战斗道具(从快照副本扣,结算回写)
  BATTLE_ACTION_FLEE = 5;    // 逃跑(PVE 可用;成功率基于速度差)
  BATTLE_ACTION_CAPTURE = 6; // 捕捉消耗本回合行动，由服务端判定。
  BATTLE_ACTION_RECALL_PET = 7; // 主人消耗正常行动，召回已过劝退等待期的本人宝宝。
  BATTLE_ACTION_SUMMON_PET = 8; // 论剑 V5 临阵唤灵：第 2 回合起单局限 1 次，主人消耗本回合行动唤出备选灵宠。
}

message BattleAction {
  eBattleActionType action_type = 1;
  uint32 skill_table_id = 2;  // SKILL 时有效
  uint64 target_id = 3;       // ATTACK/SKILL/ITEM 的目标
  uint32 item_table_id = 4;   // ITEM 时有效
  uint64 summon_pet_id = 5;   // SUMMON_PET 时有效：待唤出的本人备选灵宠 pet_id
}

// ---- 回合结算事件(客户端按序播表现;确定性事件流,观战/回放的载体) ----
enum eBattleEventType {
  BATTLE_EVENT_NONE = 0;
  BATTLE_EVENT_ATTACK = 1;       // 普攻出手
  BATTLE_EVENT_SKILL = 2;        // 技能施放
  BATTLE_EVENT_DAMAGE = 3;       // 伤害结算
  BATTLE_EVENT_HEAL = 4;
  BATTLE_EVENT_BUFF_ADD = 5;
  BATTLE_EVENT_BUFF_REMOVE = 6;
  BATTLE_EVENT_BUFF_TICK = 7;    // 周期效果(回合末)
  BATTLE_EVENT_DEATH = 8;
  BATTLE_EVENT_DEFEND = 9;
  BATTLE_EVENT_ITEM = 10;
  BATTLE_EVENT_FLEE = 11;        // 逃跑尝试(success 标记结果)
  BATTLE_EVENT_MISS = 12;      // 未命中/闪避(演出:目标头顶"闪");value=0
  BATTLE_EVENT_BLOCK = 13;     // 格挡(预留,一期不产出)
  BATTLE_EVENT_MANA = 14;      // 法力变化:value=变化绝对值,is_negative 由 target_health_after 之外的 mana_after 表达
  BATTLE_EVENT_RESIST = 15;    // 异常状态被抵抗:source=施加者,target=抵抗者,buff_table_id=被抵抗的 buff;老客户端忽略
  BATTLE_EVENT_CAPTURE = 16; // success为成功结果；成功后目标离场，结算发放宠物。
  BATTLE_EVENT_REVIVE = 17;
  BATTLE_EVENT_MAX_HEALTH = 18;
  BATTLE_EVENT_PET_RETREAT = 19;
  BATTLE_EVENT_SHIELD = 20;
  BATTLE_EVENT_ARTIFACT = 21; // 法宝产生实际收益或消耗概率判定次数。
  BATTLE_EVENT_BOSS_MECHANIC = 22; // 首领试炼 V2 破招/阶段/联防/蓄势演出事件（mechanic_kind 标明子类型）。
  BATTLE_EVENT_WUXING_SYNERGY = 23; // 人宠五行相生每 3 回合触发的合击共鸣事件。
  BATTLE_EVENT_SUMMON_PET = 24; // 论剑 V5 临阵唤灵：主人唤出备选灵宠替换/补位事件（skill_table_id 携带新宠 pet_table_id）。
}

// 一段伤害 / 出手是怎么来的(equipment-attributes.md §4.5)。0 = 普通,老客户端不读也不影响演出。
enum eBattleHitKind {
  BATTLE_HIT_NORMAL = 0;
  BATTLE_HIT_COMBO = 1;    // 连击追加段(与首段同 group_id,hit_index 递增)
  BATTLE_HIT_COUNTER = 2;  // 反击(受击者还手的 ATTACK / DAMAGE)
  BATTLE_HIT_REFLECT = 3;  // 反震(DAMAGE:source=受击者,target=出手者)
  BATTLE_HIT_PURSUIT = 4;
  BATTLE_HIT_MIRROR = 5;
}

message BattleEventItem {
  eBattleEventType event_type = 1;
  uint64 source_id = 2;
  uint64 target_id = 3;
  uint32 skill_table_id = 4;
  uint32 buff_table_id = 5;
  uint64 value = 6;               // 伤害/治疗数值
  bool is_critical = 7;
  bool success = 8;               // FLEE 等布尔结果
  uint64 target_health_after = 9; // 目标结算后 HP(客户端免推算)
  uint32 item_table_id = 10;
  uint32 group_id = 11;             // 同一次行动/施法内的事件共用(演出:群攻多目标同一拍);每次行动递增
  uint32 hit_index = 12;            // 多段攻击的段序(0 起)
  uint64 target_mana_after = 13;    // 目标结算后法力(BATTLE_EVENT_MANA 与技能耗蓝演出用)
  eBattleHitKind hit_kind = 14;     // 连击 / 反击 / 反震标注;普通出手为 0
  // 法力的实际变化量(带符号):负 = 消耗,正 = 恢复,0 = 实际没变(例如满蓝回蓝)。
  // 只在法力真的被结算过的事件上带(MANA / ITEM);value 仍是绝对值,老客户端不读本字段照旧。
  // target_mana_after 才是权威终值,客户端演出与它不一致时以它为准。
  optional sint64 mana_delta = 15;
  uint64 buff_instance_id = 16;
  uint64 absorbed = 17;
  uint64 shield_after = 18;
  uint64 target_max_health_after = 19;
  uint32 damage_origin = 20; // 直接、持续、反弹、转伤等来源由公共战斗规则定义。
  uint64 instigator_id = 21; // 催动者与原持续效果施加者分别保留。
  uint64 artifact_item_id = 22;
  uint32 artifact_effect_id = 23;
  uint32 season_seal_id = 24; // 非 0 表示本次 BATTLE_EVENT_ARTIFACT 由单槽赛季印触发（artifact_item_id 为 0）。
  // BATTLE_EVENT_BOSS_MECHANIC 机制子类型：1=化劲破绽，2=断疗反噬，3=崩势破盾，4=阵脚震荡，
  // 5=决战姿态(破釜)，6=护势蓄势，7=破军破甲，8=回春净益，9=断脉气馁。
  uint32 mechanic_kind = 25;
  bool is_splash_reduced = 26; // true = 本次直接伤害触发首领试炼副目标溅射减伤(60%)
  bool is_primary_focus = 27;  // true = 竞技 PVP 多目标技能显式主目标触发凝锋(+20%)
}

// PVP 延迟投降投票状态（仅向投票所属队伍可见；对手与观众视图由 battle 节点清空）。
message BattleSurrenderVoteState {
  bool active = 1;                       // true = 当前回合存在进行中的本队投降投票
  uint32 team_index = 2;                 // 发起队伍(0=A方, 1=B方)
  uint64 initiator_player_id = 3;        // 本轮投票发起人
  uint32 initiated_round = 4;            // 发起回合号
  repeated uint64 agreed_player_ids = 5; // 已同意投降的同队玩家 ID（升序）
  uint32 required_agrees = 6;            // 通过所需活跃同意数（自动排除连续 >=2 回合未手动挂机队友）
  uint32 next_allowed_round = 7;         // 冷却中下一次允许发起投降的回合号（无冷却为 0）
  bool rejected = 8;                     // true = 本次通知表示投票被否决或过期关闭
  bool passed = 9;                       // true = 本次通知表示投票已通过、本方投降生效
}

// 论剑 V3 战前 15 秒明牌变阵可选赛季印摘要（仅向收信本人下发）。
message BattlePrepSealOption {
  uint32 seal_id = 1;
  uint32 effect_id = 2;
  string name = 3;
}

// 论剑 V3 战前 15 秒明牌变阵可选首发灵宠摘要（仅向收信本人下发）。
message BattlePrepPetOption {
  uint64 pet_id = 1;
  uint32 pet_table_id = 2;
  string pet_name = 3;
  uint32 level = 4;
  uint64 max_health = 5;
  uint64 speed = 6;
  uint64 physical_attack = 7;
  uint64 magic_attack = 8;
  uint64 defense = 9;
  repeated uint32 skill_table_ids = 10;
}

// 论剑 V3 同队成员当前变阵与锁定状态（仅向同队成员下发，绝不向对手或观众暴露）。
message BattlePrepPlayerState {
  uint64 player_id = 1;
  uint32 team_index = 2;
  uint32 selected_seal_id = 3;
  uint64 selected_pet_id = 4;
  uint32 selected_pet_table_id = 5;
  string selected_pet_name = 6;
  bool ready = 7;
  // 本人当前提名的本局禁用技能有序列表（0..3，下标 0 为最高优先级；仅向同队下发）。
  repeated uint32 nominated_ban_skill_ids = 8;
}

// 论剑 V6 宿敌交手上下文（开局由 match 权威冻结，战前 15 秒仅向本人脱敏展示，纯荣誉零数值加成）。
message RankedRivalryEncounter {
  uint64 player_id = 1;       // 本视角玩家 ID
  uint64 opponent_id = 2;     // 对阵宿敌玩家 ID
  string opponent_name = 3;   // 对手展示名（match 或引擎回填）
  uint32 wins = 4;            // 本季历史对阵胜场（不含本局）
  uint32 losses = 5;          // 本季历史对阵负场（不含本局）
  bool revenge_target = 6;    // true = 上次交手告负或历史净负，本局胜出即触发「雪耻复仇」
}

// 论剑 V3 战前明牌变阵状态快照（按收信视角脱敏：本人看全部可选+同队状态，观众仅看倒计时）。
message BattlePrepState {
  bool active = 1;                                    // true = 当前处于战前明牌变阵期，尚未进入第 1 回合
  uint64 deadline_ms = 2;                             // 战前变阵截止时刻（Unix 毫秒，由房间定时器回填）
  uint32 duration_seconds = 3;                        // 战前变阵总时长（秒，默认 15；开启技能禁选为 25）
  repeated BattlePrepSealOption self_available_seals = 4;
  repeated BattlePrepPetOption self_available_pets = 5;
  repeated BattlePrepPlayerState team_states = 6;
  uint32 skill_ban_slots_per_team = 7;                // 本局每队可用技能禁用槽数（0=未启用，3=每队禁3招）
  repeated uint32 ban_candidate_skill_ids = 8;        // 本局白名单可禁技能 ID 列表（升序；仅参战者可见）
  repeated uint32 team_effective_ban_skill_ids = 9;   // 按当前同队提名确定性聚合的本队生效禁招（仅同队可见，对手与观众清空）
  repeated RankedRivalryEncounter self_rivalries = 10;// 论剑 V6 本人本局面对的宿敌列表（仅本人可见，对手与观众清空）
}

// 论剑 V4 队内一键战术标点类型（零文字沟通，严格仅同队可见）。
enum BattlePingKind {
  BATTLE_PING_UNSPECIFIED = 0;
  BATTLE_PING_FOCUS = 1;   // 集火（仅敌方存活单位）
  BATTLE_PING_CONTROL = 2; // 封控（仅敌方存活单位）
  BATTLE_PING_PROTECT = 3; // 保核（仅己方存活单位）
  BATTLE_PING_DISPEL = 4;  // 驱散（敌我存活单位皆可）
}

// 单条队内战术标点（每名队友每回合最多留 1 条最新意图，回合结算推进时清空；对敌方与观众恒清空）。
message BattleTacticalPing {
  uint64 sender_player_id = 1;
  uint64 target_actor_id = 2;
  BattlePingKind kind = 3;
  uint32 round_index = 4; // 0 = 战前变阵期，>=1 = 对应战斗回合
}

// 论剑 V4 战后本局专属战术徽记（纯复盘荣誉，零 Elo / 零经济加成）。
enum BattleHighlightKind {
  BATTLE_HIGHLIGHT_NONE = 0;
  BATTLE_HIGHLIGHT_PRIMARY_FOCUS = 1;    // 凝锋破核
  BATTLE_HIGHLIGHT_TACTICAL_CONTROL = 2; // 妙手控场
  BATTLE_HIGHLIGHT_SAVIOR_SUPPORT = 3;   // 仁心济世
  BATTLE_HIGHLIGHT_IRON_GUARD = 4;       // 铁壁护主
  BATTLE_HIGHLIGHT_CLUTCH_COMEBACK = 5;  // 绝境翻盘
}

// ---- 胜负 ----
enum eBattleOutcome {
  BATTLE_OUTCOME_ONGOING = 0;
  BATTLE_OUTCOME_SIDE_A_WIN = 1; // team_index 0 胜
  BATTLE_OUTCOME_SIDE_B_WIN = 2;
  BATTLE_OUTCOME_DRAW = 3;       // 回合打满等平局情形(PVE 中进攻方判负走 SIDE_B_WIN)
  // 作废:Match 为这一局写了唯一的 ABORT(执行进程失效、截止作废、帮会取消、人工处置等),全员没有任何效果。
  // 只由 Match 在 ABORT 事务里写进「作废结算」,battle 引擎永远不产出;客户端收到后退出战斗、提示本局作废
  // (docs/design/battle-instance-loss-early-abort.md §5、§6)。
  BATTLE_OUTCOME_VOID = 4;
}

// ---- 单个玩家的结算数据(battle -> scene,scene 是唯一应用者) ----
message BattleMonsterDefeat {
  uint32 monster_config_id = 1;
  uint32 count = 2;
}

// 货币类型沿用 CurrencyType：0 金币、1 钻石、2 绑定钻石。
message BattleCurrencyGain {
  uint32 currency_type = 1;
  uint64 amount = 2;
}

// 每场、每名合格玩家的奖励，不乘人数或击杀数。
message BattleRandomItemReward {
  uint32 item_table_id = 1;
  uint32 count = 2;
  uint32 weight = 3;
}

message BattleRewardProfile {
  uint32 battle_config_id = 1; // 0 为未单独配置副本的默认档。
  string strategy_key = 2; // 空为通用档；由服务端战斗策略识别入口选择。
  uint64 exp_gain = 3;
  repeated BattleCurrencyGain currencies = 4;
  uint32 item_draws = 5; // 每人固定抽取次数，有放回抽取。
  repeated BattleRandomItemReward random_items = 6;
}

message BattleRewardConfig {
  repeated BattleRewardProfile profiles = 1;
}

message BattleSettlementData {
  uint64 battle_id = 1;
  uint64 player_id = 2;
  eBattleOutcome outcome = 3;
  uint32 player_team_index = 4;
  uint64 health = 5;              // 战后终值,由 scene 回写
  uint64 mana = 6;
  uint64 exp_gain = 7;
  uint64 gold_gain = 8;
  repeated BattleItemEntry items_consumed = 9;  // scene 按实际持有校验扣除(防刷,不足按 0)
  repeated BattleItemEntry items_gained = 10;   // 掉落
  bool is_dead = 11;
  bool fled = 12;
  uint32 total_rounds = 13;
  repeated BattlePetSettlementData pets = 14;  // 该玩家出战宝宝的战后终值(scene 回写实例)
  // battle 根据真实阵亡怪物生成，scene 用于任务进度；客户端不能上报。
  repeated BattleMonsterDefeat defeated_monsters = 15;
  // 新结算仅填此集合；非空时忽略旧 gold_gain，历史空集合仍读 gold_gain。
  repeated BattleCurrencyGain currency_gains = 16;
  // 战斗结束时刻(Unix 毫秒,battle 节点时钟):battle 冻结终局原件时从 BattleResultEvent.finished_at_ms 盖进每一份个人结算
  // (result_commit.h 的 FreezeBattleSettlementSource)。scene 把它写进本人近期战斗结果,供重登后展示
  // (docs/design/battle-result-recovery.md);不参与任何结算判定。0 = 来源没盖。
  uint64 finished_at_ms = 17;
  // 这一局的匹配模式(MatchMode 数值)与战斗配置号:同样由 FreezeBattleSettlementSource 从 BattleResultEvent 盖进来,
  // scene 写进本人近期战斗结果,供列表展示与按 battle_id 查回放;不参与任何结算判定。0 = 来源没盖。
  uint32 match_mode = 18;
  uint32 battle_config_id = 19;
  repeated uint32 captured_pet_table_ids = 20; // 本人捕捉的宠物种类，随整笔结算原子落库和去重。
  // true = 校验通过的论剑排位竞技局:scene 严禁写回血蓝、复活、宠物、经验、货币、道具消耗、掉落或捕捉,
  // 仅放行装备材料日额度与战绩历史(docs/design/ranked-play-season-ui-candidate.md §6/§9)。
  bool competitive_ranked = 21;
  uint32 season_id = 22;           // 冻结的赛季编号(非排位为 0)
  uint32 ranked_rule_version = 23; // 冻结的排位规则版本(非排位为 0)
  // 本人是否达成排位有效参与(由 battle 房间在终局前按统一参与事实冻结,非排位恒为 false)。
  bool participated = 24;
  // 五行试炼志 V2 权威战法事实与轻量阵容快照(由 battle 引擎在终局前按真实事件冻结,非试炼志关联局留空)。
  BattleTrialJournalFacts trial_facts = 25;
  // 本局玩家成功提交本人或本人宝宝手动有效指令的独立回合数（用于 PVP 负/平局防挂机门槛判定）。
  uint32 manual_action_rounds = 26;
  // 本人或本人宝宝整场是否产生非零有效战斗贡献（有效伤害/治疗/护盾吸收/有效控制或驱散任一项 > 0）。
  bool effective_combat_contribution = 27;
  // 开局从 DungeonTable 冻结的试炼难度档（0=常规，1=普通，2=困难；用于困难胜局额外 +5 绑定材料）。
  uint32 battle_difficulty = 28;
  // 开局从 DungeonTable 冻结的首领/轮换玩法类型（0=常规，1..6 见 dungeon_table.proto）。
  uint32 boss_trial_kind = 29;
  // true = 本局由免费 3×3 预设驱动（仅限轮换娱乐场：护卫救援 / 物法易势 5V5），战后严格不回写场外资产。
  bool use_free_preset = 30;
  // 瑞兽迎春限时活动开局冻结上下文（由 TurnBattleEngine::BuildSettlement 原样回传，供 scene 离线/跨期结算）。
  FestivalBeastBattleContext festival_beast = 31;
  // true = 本方通过第 5 回合起的 PVP 延迟投降结束本局（与 fled 逃跑区分：体面认输，满足有效对抗门槛照常计场次与绑定材料）。
  bool surrendered = 32;
  // 群仙问道赛 V3 MVP 评定权威只读累计统计（本人及本人出战宝宝整场累计，由引擎在 BuildSettlement 冻结）。
  uint64 total_damage_dealt = 33;
  uint64 total_healing_done = 34;
  uint32 total_controls_landed = 35;
  // 五行幻境周常爬塔单层结算回传（供 Scene 幂等推进层数与生成三选一符印）。
  WuxingTowerSettlementEcho tower_settlement = 36;
  // 论剑 V4 本局复盘高光与破势终结（复用 33..35；纯只读荣誉统计，不改变任何数值/Elo/资产）。
  uint64 primary_focus_damage_dealt = 37; // 凝锋显式主目标累计伤害（含本人宝宝归属）
  uint64 total_shield_granted = 38;       // 本人及本人宝宝累计赋予友方有效护盾总量
  uint32 total_dispels_landed = 39;       // 本人及本人宝宝成功驱散/净化次数（与 total_controls_landed 合计计入控场驱散贡献）
  uint64 damage_taken = 40;               // 本人及本人宝宝累计承受伤害与护盾吸收总量
  BattleHighlightKind highlight_kind = 41;// 本局评定的专属战术徽记（确定性规则产出）
  uint32 ended_opponent_streak = 42;      // 若本方获胜且击败了 >=3 连胜对手，记录敌方最高连胜数（否则 0）
  // 论剑 V6 宿敌雪耻复仇与问道名局配招快照（纯只读荣誉/复盘摘要，零经济/零数值影响）。
  bool revenged_rival = 43;               // 本局获胜并成功向历史宿敌雪耻复仇
  string revenged_opponent_name = 44;     // 最主要复仇对手名（供现场结算盖章展示）
  uint32 revenged_wins_after = 45;        // 含本局后的对阵胜场
  uint32 revenged_losses_after = 46;      // 含本局后的对阵负场
  uint32 final_season_seal_id = 47;       // 本局最终生效的赛季印 ID（含 V3 战前易印结果）
  uint32 starter_pet_table_id = 48;       // 本局最终首发出战灵宠表 ID（含 V3 战前换宠结果，无宠为 0）
  repeated uint32 core_skill_ids = 49;    // 主角本局携带的核心主动技能 ID（最多 4 个，用于问道名局流派汇总）
  string player_display_name = 50;        // 主角展示名（供问道名局与宿敌账本展示）
  // 天墉生死状冻结上下文回传（供 scene 在结算时挂载 30 分钟败者印记或复仇清标，非生死状留空）。
  JianghuDuelBattleContext jianghu_duel = 51;
  // 赛季玩法 V3：本场单槽赛季印实战功劳摘要（零经济/零持久化扩展，随 BattleEndS2C.settlement 即时展示）。
  uint64 season_seal_contribution_value = 52; // 主贡献累计值（101/102 削盾量、103 减伤+共鸣增盾量、104 回蓝+共鸣省蓝量）
  uint32 season_seal_trigger_count = 53;      // 本场赛季印基础效果触发次数
  uint32 season_seal_resonance_count = 54;    // 本场「技印共鸣」触发次数
  // 论剑 V7：正式 1V1 排位终局对阵对手身份（仅双方各 1 名真人且非无效局填充，用于战后 15 秒切磋「不服再战」，零排位分）。
  uint64 rematch_opponent_id = 55;
  string rematch_opponent_name = 56;
}

// ---- 出战宝宝的结算数据(随主人的 BattleSettlementData 一起回 scene)----
message BattlePetSettlementData {
  uint64 pet_id = 1;
  uint64 health = 2;   // 战后终值
  uint64 mana = 3;
  bool is_dead = 4;
}

// ---- 活动对局上下文(帮会同道历练,docs/design/guild-phase2/06-activities.md §6.17) ----
// 流向:guild 组装 → match MatchInternal.StartActivityBattle 校验后原样放进 CreateBattleRequest.activity_context
//       → battle 存进房间、结算时原样回显进 contracts.kafka.BattleResultEvent.activity_context → guild 消费结算。
// battle / scene 不解释其中任何业务字段(只看 kind 是否为 NONE 来决定是否走持久化结果通道,§6.19)。
// 本段只在文件末尾追加(属性会话也在改本文件)。
enum eBattleActivityKind {
  BATTLE_ACTIVITY_KIND_NONE = 0;            // 普通对局:不回显上下文,结果事件照旧只发一次
  BATTLE_ACTIVITY_KIND_GUILD_TRIAL = 1;     // 帮会同道历练:go/guild 以消费组 guild-trial 消费 match-results 结算
  BATTLE_ACTIVITY_KIND_FESTIVAL_BEAST = 2;  // 瑞兽迎春限时单人神兽挑战:scene 发起、match 准入、battle 执行、scene 收件箱结算
  BATTLE_ACTIVITY_KIND_GUILD_WAR = 3;       // 帮会全天帮战 V2:无匹配池直打,go/guild 消费 match-results 幂等结算旗势/悬赏/追杀/奖励
}

// 帮会全天帮战 V2 开局冻结紧凑上下文(docs/design/guild-play-v2.md):只携带紧凑 ID 与标识,严禁塞入快照字节以守住 Kafka 960 KiB 红线。
message GuildWarBattleContext {
  uint32 zone_id = 1;                        // 归属区
  uint64 attacker_guild_id = 2;              // 攻方帮会 ID
  uint64 defender_guild_id = 3;              // 守方帮会 ID(无主灵脉守卫为 0)
  uint32 leyline_id = 4;                     // 关联灵脉 ID(1八仙岛/2碧渊水宫/3月汐湾;纯野外路遇无关联为 0)
  uint32 war_battle_kind = 5;                // 1界面真人/2守旗踢馆/3野外路遇/4灵脉现场/5追杀结单
  uint64 bounty_id = 6;                      // 关联追杀令 ID(非追杀局为 0)
  uint32 week_key = 7;                       // 开战时 ISO 周键(gameday.WeekKey)
  repeated uint64 attacker_player_ids = 8;   // 攻方真人角色 ID 列表
  repeated uint64 defender_player_ids = 9;   // 守方真人或守旗快照角色 ID 列表
  bool gold_leyline_bonus = 10;              // 开战时该灵脉是否为当小时 1.5x 金脉
  bool rivalry_bonus = 11;                   // 开战时双方帮会是否为本周宿敌(+20%)
  uint64 started_at_ms = 12;                 // 开战时刻 Unix 毫秒
}

// 瑞兽迎春开局冻结上下文（由 scene 组装、match 时间窗校验后随成局原件持久化并透传至 PrepareBattle / CreateBattle / Settlement）。
message FestivalBeastBattleContext {
  uint32 activity_instance_id = 1;
  uint32 config_revision = 2;
  string reward_identity = 3;
  uint32 reward_definition_version = 4;
  uint32 reward_pet_table_id = 5;
  uint32 required_wins = 6;
  uint64 locked_pet_id = 7;          // 开局意图锁定的出战宝宝 pet_id，PrepareBattle 强制复核
  uint32 locked_owner_level = 8;     // 开局锁定的人物生效等级（选档唯一依据）
  uint32 tier_id = 9;                // 匹配的固定等级档 ID
  uint32 round_limit = 10;           // 冻结回合上限（默认 12）
  uint32 cycle_rounds = 11;          // 行动周期（默认 3）
  uint32 first_heavy_round = 12;     // 首次重击回合（默认 3）
  uint32 telegraph_lead_rounds = 13; // 预告提前回合数（默认 1，即 R2/5/8/11）
  uint32 heavy_damage_percent = 14;  // 重击倍率百分比（默认 180）
  string boss_name = 15;             // 冻结首领展示名
  uint64 boss_health = 16;           // 冻结档位首领气血上限
  uint64 boss_physical_attack = 17;  // 冻结档位首领物理攻击
  uint64 boss_defense = 18;          // 冻结档位首领防御
  uint64 boss_resistance = 19;       // 冻结档位首领抗性%
  uint64 boss_speed = 20;            // 冻结档位首领速度
  uint64 effective_start_at_ms = 21; // 活动开放开始 UTC 毫秒（Match SQL 提交点复核）
  uint64 effective_end_at_ms = 22;   // 活动开放结束 UTC 毫秒（Match SQL 提交点复核）
  string client_request_id = 23;     // 客户端原请求 UUID
}

message BattleActivityContext {
  eBattleActivityKind kind = 1;     // 非 NONE 才是活动对局;match 拒绝 NONE(INVALID_ARGUMENT)
  uint64 guild_id = 2;              // 发起帮会(发号器永久 ID,biz_tag=guild,只当身份用);guild 写、guild 读
  uint32 activity_id = 3;           // GuildActivity 表 id;guild 写、guild 读
  uint32 period_key = 4;            // 确认开战时的游戏日键 YYYYMMDD(gameday.DayKey,UTC+8 05:00 换日),用于个人每日次数
  uint64 initiator_player_id = 5;   // 发起人;match 校验它等于 StartActivityBattleRequest.member_player_ids[0]
  uint32 guild_period_key = 6;      // 确认开战时的帮会期键(activity.GuildPeriodKey;历练即游戏日),用于每日计资金胜场上限
  uint64 launch_request_id = 7;     // 同道历练开战前持久原件；match/battle原样复制回结果，不包含账号
  FestivalBeastBattleContext festival_beast = 8; // kind == BATTLE_ACTIVITY_KIND_FESTIVAL_BEAST 时必填
  GuildWarBattleContext guild_war = 9;           // kind == BATTLE_ACTIVITY_KIND_GUILD_WAR 时必填
}

// 观战可见性(docs/design/battle-spectate-tiered-fanout.md §10 第 6 条 / §10.2):战斗创建时由 match 按
// 单一策略表决定、随 CreateBattleRequest 冻结,之后不变。match 的登记公开、两条 WatchBattle 路径、
// 观战列表与 battle 的 AddObserver 四处都按它执法。默认拒绝:未填(UNSPECIFIED)与 PRIVATE 一样不可观战。
enum eSpectateVisibility {
  SPECTATE_VISIBILITY_UNSPECIFIED = 0;  // 视同私密(老发送方 / 漏填一律 fail-closed)
  SPECTATE_VISIBILITY_PRIVATE = 1;      // 不可观战:计分局、切磋、活动局、自定义房间与未知模式
  SPECTATE_VISIBILITY_PUBLIC = 2;       // 任何在线玩家可观战,进观战列表与随机观战
}

// 观战投递档位(battle-spectate-tiered-fanout.md §3 / §15):按场只升不降,match 是档位的记账方,
// battle 只认「挂了哪些中继 gate」与「是否已升广播」两件事。
enum eSpectateTier {
  SPECTATE_TIER_DIRECT = 0;     // L0:观众凭票直连 battle(直连席未满)
  SPECTATE_TIER_RELAY = 1;      // L1:直连席已满,battle 每回合给每台挂了观众的 gate 各发一条中继帧
  SPECTATE_TIER_BROADCAST = 2;  // L2:全服广播,battle 每回合只往广播 topic 发一条,所有 gate 都读
}

// ---- 论剑排位上下文(docs/design/ranked-play-season-ui-candidate.md) ----
// 由 match 在成局提交点冻结,依次透传至 PrepareBattle / CreateBattle / battle 房间 / BattleResultEvent。
message RankedPresetSelection {
  uint32 character_preset_id = 1; // RankedPreset.id(role_kind=1): 101 破阵 / 102 控场 / 103 守心
  uint32 pet_preset_id = 2;       // RankedPreset.id(role_kind=2): 201 破甲 / 202 灵咒 / 203 护主
}

message RankedMemberLoadout {
  uint64 player_id = 1;
  RankedPresetSelection presets = 2;
}

message RankedMatchContext {
  uint32 season_id = 1;               // 赛季编号(从 1 起递增)
  string season_key = 2;              // 榜 period 键(如 "s1")
  uint64 rank_generation = 3;         // 排行榜代次(与 season_id 同频递增)
  uint32 rule_version = 4;            // RankedRule.rule_version
  uint32 team_size = 5;               // 每侧玩家人数(1..5)
  string config_fingerprint = 6;      // 竞技规则与预设依赖表指纹
  repeated RankedMemberLoadout members = 7; // 本局全员冻结预设(仅 use_free_preset=true 生效;PrepareBattle 可只含本人,CreateBattle 含全员)
  // true = 本局使用 6 套免费人宠预设(仅限轮换娱乐场：护卫救援 / 物法易势 5V5);
  // false = 正式自养人宠会武(PVP_TEAM),携带本人真实装备、词条、法宝、技能与出战宝宝。
  bool use_free_preset = 8;
  // 正式排位开局前本季连胜 >= 3 的成员连胜数（player_id -> win_streak；未达 3 连胜不填，保持 members 语义不变）。
  map<uint64, uint32> member_win_streaks = 9;
  // 成局时按 RankedRule 冻结的每队技能禁选槽数（0=未达云章门槛或关闭，3=每队禁3招）。
  uint32 skill_ban_slots_per_team = 10;
  // 论剑 V6 成局时由 match 冻结的对阵宿敌记录（含双方本季已有交手的全部主客视角条目）。
  repeated RankedRivalryEncounter rivalry_encounters = 11;
  // 论剑 V7：高段正式排位公开实时观战（青锋及以上段位冻结为 true，低段新手局保持 false 避免压力）。
  bool allow_public_spectate = 12;
  // 论剑 V7：成局时本场参战者最高赛季积分（centi，随建房原件冻结供实时围观列表排序展示）。
  int64 peak_rating_centi = 13;
}

// 玩家本局有效参与事实(battle 房间在终局前冻结进 BattleResultEvent,重放不重算)。
message BattleParticipationFact {
  uint64 player_id = 1;
  bool entered_room = 2;               // 至少完成一次参战直连握手或 GetBattleState
  bool manual_action_accepted = 3;     // 服务端至少接受过一次本人人物或宝宝有效手动指令
  bool explicit_auto_enabled = 4;      // 进房后玩家显式开启过合法自动战斗
  bool no_action_opportunity = 5;      // 进房后在首次可操作机会前即阵亡/被全控/对局结束
}

// ---- 五行试炼志 V2 开局冻结上下文与终局权威事实(docs/design/long-term-progression-v2.md) ----
message TrialBattleContext {
  uint32 journal_entry_id = 1;       // TrialJournalEntry.id（0 = 非试炼志格）
  uint32 trial_rule_version = 2;     // 开局冻结的可比规则版本
  uint32 season_id = 3;              // 赛季卷对应赛季号（永久卷为 0）
  uint32 guard_monster_table_id = 4; // 可选：回春/护势等特殊护卫怪物表 ID（0 = 任意非首领怪物）
  uint32 guard_stance_buff_id = 5;   // 可选：护势护卫状态 Buff 表 ID（0 = 任意敌方增益驱散均视为有效驱散）
  uint32 challenge_vow_mask = 6;     // 五行试炼志 V3：开局冻结的自选限制誓约位掩码（bit0禁控 bit1单宝 bit2无宠 bit3紧缩回合，0=常规）
}

message BattleTrialJournalFacts {
  uint32 journal_entry_id = 1;
  uint32 trial_rule_version = 2;
  uint32 initial_human_count = 3;
  uint32 season_id = 4;
  bool self_or_pet_ever_died = 5;              // 本人或本人出战宝宝本场任一时刻触发过死亡（复活不清除）
  uint64 boss_guard_heal_total = 6;            // 敌方护卫对首领实际造成的有效气血恢复总量
  bool guard_stance_dispelled = 7;             // 己方本场成功驱散过敌方护势状态
  bool team_dealt_physical_direct_damage = 8;  // 己方本场对敌方造成过 >0 物理直接伤害
  bool team_dealt_magic_direct_damage = 9;     // 己方本场对敌方造成过 >0 法术直接伤害
  bool guard_survived = 10;                    // 终局时敌方护卫仍存活（供护卫救援卷三判定）
  bool self_triggered_shield_break = 11;       // 本人触发破盾法宝/赛季印产生 >0 实际削盾
  bool self_triggered_anti_control_or_season_skill = 12; // 本人触发清心符、成功净化或施放当季免费赛季技能
  uint32 used_pet_table_id = 13;               // 本人开局出战宝宝种类（0=无宠）
  repeated uint32 used_artifact_effect_ids = 14; // 本人开局佩戴的法宝效果 ID（至多 2 个，升序）
  uint32 used_season_seal_id = 15;             // 本人开局生效的赛季印 ID（0=无）
  repeated string teammate_names = 16;         // 入场冻结的同队其他真人展示名（至多 4 名）
  bool boss_wind_hit_unprotected_death = 17;   // 卷二八仙岛风击倒地标记
  bool dealt_yang_bell_physical_damage = 18;   // 卷二碧渊水宫阳钟阶段物理击伤标记
  bool dealt_yin_drum_magic_damage = 19;       // 卷二碧渊水宫阴鼓阶段法术击伤标记
  bool finished_in_ebb_tide = 20;              // 卷二月汐湾退潮窗口终结标记
  uint32 cleave_parry_count = 21;              // 首领试炼 V2：团队成功化解重劈（含控断）触发破绽次数
  uint32 heal_interrupt_backlash_count = 22;   // 首领试炼 V2：触发回春断疗反噬次数
  uint32 stance_break_count = 23;              // 首领试炼 V2：触发驱散/控断护势「崩势」次数
  bool all_self_cleaves_parried = 24;          // 首领试炼 V2：本人及本人宝宝被重劈点名>=1次且100%合法化解(不含倒地/退出取消)
  bool self_parried_cleave_at_least_once = 25; // 首领试炼 V2：本人或本人宝宝至少合法化解过 1 次重劈
  uint32 challenge_vow_mask = 26;              // 五行试炼志 V3：本局生效的自选试炼誓约位掩码（0..15）
}

// ---- 全服赛季战队锦标赛《群仙问道赛》V2：BO3 与五行灵脉阵眼开局冻结上下文(docs/design/season-team-tournament-v2.md) ----
enum TournamentLeylineElement {
  TOURNAMENT_LEYLINE_UNSPECIFIED = 0; // 无灵脉(BO1 / 非锦标赛)
  TOURNAMENT_LEYLINE_METAL       = 1; // 金锐灵脉：暴击率 +5%，破防直伤 +4%
  TOURNAMENT_LEYLINE_WOOD        = 2; // 木生灵脉：治疗与护盾效果 +10%
  TOURNAMENT_LEYLINE_WATER       = 3; // 水润灵脉：回合初恢复 5% 法力，控制抗性 +8%
  TOURNAMENT_LEYLINE_FIRE        = 4; // 火炽灵脉：全体伤害 +6%
  TOURNAMENT_LEYLINE_EARTH       = 5; // 土厚灵脉：受到伤害 -5%，首回合护盾 +8% 气血上限
}

message TournamentBattleContext {
  uint32 season_id = 1;
  uint64 match_id = 2;
  uint32 best_of = 3;                              // 1=BO1, 3=BO3
  uint32 game_index = 4;                           // 当前第几小局(1..best_of)
  uint32 wins_a = 5;                               // 本小局开打前 A 队已胜局数
  uint32 wins_b = 6;                               // 本小局开打前 B 队已胜局数
  TournamentLeylineElement leyline_element = 7;    // 本小局生效五行灵脉阵眼
  uint64 squad_a_id = 8;
  string squad_a_name = 9;
  uint64 squad_b_id = 10;
  string squad_b_name = 11;
  uint32 squad_a_emblem_id = 12;                   // V3: A 队官方预设道家队徽(1..8)
  uint32 squad_b_emblem_id = 13;                   // V3: B 队官方预设道家队徽(1..8)
  bool is_warmup = 14;                             // V3: true=赛前零积分热身约战
  bool is_third_place = 15;                        // V3: true=四强季军争夺战(铜牌战)
  uint32 skill_ban_slots_per_team = 16;            // 战前技能禁选每队槽数（默认 3，0=关闭）
}

// ---- 五行幻境·轻肉鸽周常爬塔上下文与结算回传(docs/design/wuxing-gameplay-expansions-v1.md) ----
message WuxingTowerBattleContext {
  uint32 week_key = 1;                             // 开战冻结周键
  uint64 run_id = 2;                               // 开战冻结轮次 ID
  uint32 floor = 3;                                // 当前挑战层数（1..10）
  TournamentLeylineElement leyline_element = 4;    // 本层环境五行灵脉（1..5）
  repeated uint32 active_sigil_ids = 5;            // 本轮已选局内五行符印（仅本场生效）
}

message WuxingTowerSettlementEcho {
  uint32 week_key = 1;
  uint64 run_id = 2;
  uint32 floor = 3;
  uint32 total_rounds = 4;
}

// ---- 道友切磋坊·自定义规则切磋(docs/design/wuxing-gameplay-expansions-v1.md) ----
message CustomDuelRules {
  bool use_free_preset = 1;                        // true=公平 3x3 免费人宠模板；false=双方真养成
  bool enable_polarity_rotation = 2;               // true=开启每 2 回合物势/法势交替
  uint32 round_limit_override = 3;                 // 0=默认；白名单允许 8/12/20 回合
  bool ban_control_skills = 4;                     // true=禁控纯拼直伤与续航
  bool allow_public_spectate = 5;                  // true=允许全服公开观战
  uint32 challenger_character_preset_id = 6;       // 公平模板切磋时发起者所选人物预设（0=默认 101）
  uint32 challenger_pet_preset_id = 7;             // 公平模板切磋时发起者所选灵宠预设（0=默认 203）
  uint32 skill_ban_slots_per_team = 8;             // 战前纯禁招每队槽数（白名单 0 或 3；禁止与 use_free_preset=true 同开）
  uint64 rematch_source_battle_id = 9;             // 论剑 V7 战后不服再战来源局 ID（0=普通自定义切磋；非 0 时服务端缩短应答 TTL 至 15s）
}

// ---- 战报一键看配装·脱敏公开构筑摘要(严禁含私密概率/背包/冷却) ----
message BattleActorBuildSummary {
  uint64 player_id = 1;
  string name = 2;
  uint32 team_index = 3;
  uint32 class_id = 4;
  uint32 level = 5;
  uint32 formation_id = 6;
  uint32 wuxing_element = 7;                       // 1金/2木/3水/4火/5土
  uint32 season_seal_id = 8;
  uint32 active_pet_table_id = 9;
  string active_pet_name = 10;
  uint32 active_pet_element = 11;                  // 1金/2木/3水/4火/5土
  repeated uint32 skill_table_ids = 12;
  repeated uint32 wuxing_sigil_ids = 13;
  bool used_free_preset = 14;
}

// ---- 江湖恩怨·天墉生死状开局冻结上下文(docs/design/battle-jianghu-grudge-duel-bounty-v1.md) ----
// 由 match 在成局提交点冻结，透传至 CreateBattleRequest / 战斗房间 / BattleSettlementData / BattleResultEvent。
message JianghuDuelBattleContext {
  uint64 duel_invite_id = 1;           // 发号器永久 ID（兼作幂等扣费与退费键）
  uint32 writ_tier = 2;                // 1=普通 500 银两战书, 2=金帖生死状(Item 3415)
  uint64 challenger_captain_id = 3;    // A 方（发起方）队长 player_id
  string challenger_captain_name = 4;  // A 方队长展示名
  uint64 target_captain_id = 5;        // B 方（应战方）队长 player_id
  string target_captain_name = 6;      // B 方队长展示名
  uint64 side_a_guild_id = 7;          // 若 A 方全员同帮则为该帮 guild_id，否则 0
  string side_a_guild_name = 8;
  uint64 side_b_guild_id = 9;          // 若 B 方全员同帮则为该帮 guild_id，否则 0
  string side_b_guild_name = 10;
  uint32 round_limit_override = 11;    // 冻结的生死状回合上限（默认 30，打满双方存活权威判平）
  uint32 team_size = 12;               // 每侧人数（1..5）
}
