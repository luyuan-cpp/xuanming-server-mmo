syntax = "proto3";
package mailpb;
option go_package = "robot/proto/mail";
import "proto/db/proto_option.proto";

// 独占邮箱库的权威记录；附件只保存共用AssetBundle字节，不保存背包/余额副本。
message MailRecord {
  option (OptionTableName) = "mail_message";
  option (OptionPrimaryKey) = "mail_id";
  option (OptionUniqueKey) = "sender_kind,request_id";
  option (OptionIndex) = "owner_player_id,mail_id;kind,expire_ms;guild_id,mail_id";
  option (OptionTiDBNonclusteredPK) = true;
  option (OptionTiDBShardRowIDBits) = 4;
  option (OptionTiDBPreSplitRegions) = 4;
  uint64 mail_id = 1;
  uint64 owner_player_id = 2;
  uint64 guild_id = 3;
  uint32 kind = 4;
  uint32 sender_kind = 5;
  uint64 request_id = 6;
  string request_hash = 7;
  string title = 8;
  string body = 9;
  bytes attachments = 10;
  uint64 sent_ms = 11;
  uint64 expire_ms = 12;
  uint64 campaign_id = 13;
  uint64 manifest_generation = 14;
}
// 有附件的系统邮件只在名单完整seal的同事务插入mail_message；导入中的活动不可见。
message MailCampaignRecord {
  option (OptionTableName) = "mail_campaign";
  option (OptionPrimaryKey) = "sender_kind,campaign_id,manifest_generation";
  option (OptionUniqueKey) = "sender_kind,request_id";
  option (OptionIndex) = "mail_id";
  uint32 sender_kind = 1;
  uint64 campaign_id = 2;
  uint64 manifest_generation = 3;
  uint64 mail_id = 4;
  uint64 request_id = 5;
  string producer = 6;
  string request_hash = 7;
  string title = 8;
  string body = 9;
  bytes attachments = 10;
  uint64 expire_ms = 11;
  uint64 expected_recipient_count = 12;
  uint32 expected_shard_count = 13;
  string manifest_hash = 14;
  uint32 state = 15;
  uint64 created_ms = 16;
  uint64 sealed_ms = 17;
  uint32 kind = 18;
  uint64 guild_id = 19;
}
message MailCampaignShardRecord {
  option (OptionTableName) = "mail_campaign_shard";
  option (OptionPrimaryKey) = "sender_kind,campaign_id,manifest_generation,shard_index";
  uint32 sender_kind = 1;
  uint64 campaign_id = 2;
  uint64 manifest_generation = 3;
  uint32 shard_index = 4;
  string shard_hash = 5;
  uint32 recipient_count = 6;
}
message MailCampaignRecipientRecord {
  option (OptionTableName) = "mail_campaign_recipient";
  option (OptionPrimaryKey) = "sender_kind,campaign_id,manifest_generation,player_id";
  uint32 sender_kind = 1;
  uint64 campaign_id = 2;
  uint64 manifest_generation = 3;
  uint64 player_id = 4;
  uint32 shard_index = 5;
}
message MailBoxRecord {
  option (OptionTableName) = "mail_box";
  option (OptionPrimaryKey) = "player_id";
  uint64 player_id = 1;
  uint64 created_ms = 2;
}
// 个人行发件时创建；广播行仅在有交互时物化。pending/manual永不由到期清理删除。
message MailStateRecord {
  option (OptionTableName) = "mail_state";
  option (OptionPrimaryKey) = "player_id,mail_id";
  option (OptionIndex) = "mail_id,claim_state;claim_state,updated_ms";
  uint64 player_id = 1;
  uint64 mail_id = 2;
  uint64 read_ms = 3;
  uint64 deleted_ms = 4;
  uint32 claim_state = 5;
  uint64 current_op_id = 6;
  uint64 claim_version = 7;
  uint32 reason_tip_id = 8;
  uint64 updated_ms = 9;
}
message MailPlayerOpSeqRecord {
  option (OptionTableName) = "mail_player_op_seq";
  option (OptionPrimaryKey) = "player_id,stream";
  uint64 player_id = 1;
  uint32 stream = 2;
  uint64 next_seq = 3;
  uint64 updated_ms = 4;
  uint64 epoch = 5;
}
enum MailAssetOpStatus {
  MAIL_ASSET_OP_UNSPECIFIED = 0;
  MAIL_ASSET_OP_PENDING = 1;
  MAIL_ASSET_OP_APPLIED = 2;
  MAIL_ASSET_OP_REJECTED = 3;
  MAIL_ASSET_OP_MANUAL = 4;
  MAIL_ASSET_OP_ABANDONED = 5;
}
message MailAssetOpRecord {
  option (OptionTableName) = "mail_asset_op";
  option (OptionPrimaryKey) = "op_id";
  option (OptionUniqueKey) = "player_id,stream,stream_epoch,seq";
  // idx_mail_asset_op_0 = 重投到期扫描 (status, next_attempt_ms, op_id, player_id)(2026-11-11,缺口清单第 25 条):
  // op_id 让 ORDER BY next_attempt_ms, op_id 直接走索引顺序(TiDB 上主键非聚簇,不带它就要整段读完再排序);
  // player_id 让按玩家分片的条件在索引上判,别的副本的行不回表。
  option (OptionIndex) = "status,next_attempt_ms,op_id,player_id;player_id,stream,stream_epoch,status,seq;player_id,mail_id,claim_version;mail_id,status";
  option (OptionTiDBNonclusteredPK) = true;
  option (OptionTiDBShardRowIDBits) = 4;
  option (OptionTiDBPreSplitRegions) = 4;
  uint64 op_id = 1;
  uint64 player_id = 2;
  uint32 stream = 3;
  uint64 seq = 4;
  uint64 stream_epoch = 5;
  uint64 mail_id = 6;
  uint64 claim_version = 7;
  uint32 status = 8;
  bytes payload = 9;
  uint32 tx_type = 10;
  uint32 attempts = 11;
  uint64 next_attempt_ms = 12;
  uint64 lease_until_ms = 13;
  uint64 lease_token = 14;
  uint32 last_outcome = 15;
  uint32 last_reason = 16;
  uint32 durable = 17;
  uint32 reason_tip_id = 18;
  uint64 created_ms = 19;
  uint64 updated_ms = 20;
  uint64 last_send_ms = 21;
  string resolved_by = 22;
  string resolve_reason = 23;
}
