syntax = "proto3";
option go_package = "proto/scene";

import "proto/db/proto_option.proto";
import "proto/common/base/tip.proto";
import "proto/common/component/currency_comp.proto";

option cc_generic_services = true;
option (OptionFileDefaultNode) = NODE_SCENE;

// 装备 tooltip 的一行属性(设计文档 docs/design/equipment-attributes.md §3.2)。
// 客户端零配表:名称、上限、是否百分比全部由服务器下发。
message EquipAttrLineInfo {
  uint32 attr_id = 1;   // EquipAttribute 表 id
  string name = 2;
  uint32 tier = 3;      // 0 基础属性 / 1 蓝 / 2 粉 / 3 黄 / 4 绿(预留)
  uint64 value = 4;     // 当前值(已按当前表上限夹取)
  uint64 cap = 5;       // 上限;基础属性行为 0,客户端不显示「/上限」
  bool percent = 6;     // true = 显示成 N%
  uint32 seq = 7;       // 档内序号;显示顺序 = (tier, seq)
  // ── 以下两项只在装备的基础属性行(BagItemInfo.base_attrs)上有意义(docs/design/equipment-enhance-inlay.md §3.3)──
  uint64 enhance_bonus = 8;       // 强化带来的增量,**已含在 value 内**(value − enhance_bonus = 表值);未强化为 0
  uint64 enhance_next_value = 9;  // 仅该装备带 enhance_next 时:强化到下一级后这一行的 value(预览);否则为 0
}

// 装备栏的一个槽位定义(含空槽),客户端据此画出全部栏位。
message EquipSlotInfo {
  uint32 slot = 1;
  uint32 equip_kind = 2;
  string name = 3;      // 部位名(武器 / 帽子 …);只有「没配名字却被占着」的槽才会为空
}

// 装备上的一个宝石孔(设计文档 docs/design/equipment-enhance-inlay.md §3.3)。
// 「占用」与「生效」是两件事:占用只看 gem_config_id(与服务器判「该孔已镶」同口径),
// 生效看带不带 attr(与属性加成同口径)。
message EquipGemSocketInfo {
  uint32 socket = 1;           // 孔位号(0 起)
  uint32 gem_type = 2;         // 该孔接纳的宝石类型,0 = 任意
  uint32 gem_config_id = 3;    // 占着这个孔的宝石 config;0 = 空孔。**「是否占用」只看它**
  string gem_name = 4;         // 宝石名(空孔为空;宝石的 Item 行查不到时也为空)
  string gem_icon_key = 5;     // 宝石图标(规则同 gem_name)
  // 宝石**当前生效**的属性。gem_config_id != 0 却不带 attr = 已镶但当前不生效(仍可取下)。
  // tier 恒 0、cap 恒 0、seq 恒 0。
  EquipAttrLineInfo attr = 6;
  string name = 7;             // 孔位显示名(可为空,客户端空名时显示「孔位 N」)
}

// 下一次强化的预览(客户端零配表)。金币 / 材料成败都扣。
message EquipEnhancePreview {
  uint32 next_level = 1;          // 强化成功后的等级(= 当前等级 + 1)
  uint32 success_rate = 2;        // 万分比
  uint64 cost_gold = 3;
  uint32 material_config_id = 4;  // 0 = 不要材料
  string material_name = 5;       // 材料的 Item 行查不到时为空
  uint32 material_count = 6;
  uint32 bonus_permyriad = 7;     // 升到 next_level 后基础属性的总加成(万分比)
  uint32 fail_level_loss = 8;     // 失败时掉几级,0 = 不掉
  string material_icon_key = 9;
}

// 实例与布局分离；显示信息不写入玩家持久化记录。
message BagItemInfo {
  uint64 item_id = 1;
  uint32 config_id = 2;
  uint32 count = 3;
  uint32 max_stack = 4;
  uint32 equip_kind = 5;
  string name = 6;        // 来自物品表;缺配时为空,客户端不许编造。
  string description = 7;
  string icon_key = 8;
  // ── 以下仅装备(equip_kind != 0)有意义 ──
  uint32 equip_level = 9;                       // 佩戴等级
  uint32 equip_class = 10;                      // 职业要求,0 = 不限
  string equip_class_name = 11;                 // 职业名;职业表无名称列时为空
  repeated EquipAttrLineInfo base_attrs = 12;   // 基础属性,seq 升序
  repeated EquipAttrLineInfo affixes = 13;      // 随机属性,已按 (tier, seq) 排好
  // ── 强化与镶嵌(docs/design/equipment-enhance-inlay.md §3.3)。14–17、20 仅装备;18、19 仅宝石物品 ──
  uint32 enhance_level = 14;                     // 装备:当前强化等级(已按表上限夹取)
  uint32 enhance_max_level = 15;                 // 装备:强化上限;0 = 强化未开放
  EquipEnhancePreview enhance_next = 16;         // 装备:下一级预览;已满级 / 未开放 / 实例未初始化 / 下一级的行不可用时不带
  repeated EquipGemSocketInfo gem_sockets = 17;  // 装备:该部位的全部孔位(含空孔),按 socket 升序;实例未初始化时不带
  uint32 gem_type = 18;                          // 宝石物品:宝石类型(≥ 1);不是宝石 = 0
  EquipAttrLineInfo gem_attr = 19;               // 宝石物品:这颗宝石提供的属性(不是宝石、或属性行不可用时不带)。tier / cap / seq 恒 0
  uint32 enhance_bonus_permyriad = 20;           // 装备:当前有效等级的基础属性总加成(万分比);0 级为 0,满级也写
}

message BagSlotInfo {
  uint32 slot = 1;
  uint64 item_id = 2;
  uint32 width = 3;
  uint32 height = 4;
}

message BagLayoutInfo {
  uint32 bag_type = 1;    // 0 人物背包 / 1 仓库 / 2 装备栏 / 3 临时格。
  uint32 capacity = 2;
  repeated BagSlotInfo slots = 3; // 顺序无语义，位置只认 slot。
  bool can_sort = 4;
  // 仅装备栏(bag_type = 2):槽位定义,slot 升序。服务器只下发容量内的槽;
  // 没配部位名的槽(不对玩家展示)只在被占用时才下发。
  repeated EquipSlotInfo equip_slots = 5;
}

message BagInfo {
  repeated BagItemInfo items = 1; // 顺序无语义，布局通过 item_id 关联。
  BagLayoutInfo layout = 2;
  CurrencyComp currency = 3;
}

message GetBagRequest { uint32 bag_type = 1; }
message GetBagResponse {
  TipInfoMessage error_message = 1;
  BagInfo bag = 2;
}
message SortBagRequest { uint32 bag_type = 1; }
message SortBagResponse {
  TipInfoMessage error_message = 1;
  BagInfo bag = 2;
  bool changed = 3;
}

// 穿上:物品必须在人物背包里。取接受该部位的槽位里第一个空槽;都占着就替换
// 槽号最小的那个,旧装备回背包。成功回两个包的全量,客户端整体覆盖。
message EquipItemRequest { uint64 item_id = 1; }
message EquipItemResponse {
  TipInfoMessage error_message = 1;
  BagInfo bag = 2;        // 人物背包
  BagInfo equipment = 3;  // 装备栏
}

// 卸下:物品必须在装备栏里,回到人物背包(背包满则拒绝)。
message UnequipItemRequest { uint64 item_id = 1; }
message UnequipItemResponse {
  TipInfoMessage error_message = 1;
  BagInfo bag = 2;
  BagInfo equipment = 3;
}

// 开发 / 测试用发物(prod 关闭,不是鉴权,见 cpp/nodes/gate/SECURITY.md)。
message GmGrantItemRequest {
  uint32 config_id = 1;
  uint32 count = 2;
}
message GmGrantItemResponse {
  TipInfoMessage error_message = 1;
  BagInfo bag = 2;        // 人物背包
}

// 强化:装备可以在人物背包里,也可以穿在身上(仓库 / 临时格里的不行)。消耗金币与材料,**成败都扣**。
// 只要请求被受理(error_message 为空)就回两个包的全量,客户端整体覆盖 —— 掷骰没过的那一次也一样。
//
// expected_level 是乐观比较(与 UpgradeSkillRequest.expected_rank 同构,docs/design/equipment-enhance-inlay.md §4.3):
// 客户端填它此刻显示的强化等级,即这件装备 BagItemInfo.enhance_level(已按表上限夹取,0 级也要填 0)。
// 与服务器当前的有效等级不一致就整笔拒绝(kEquipEnhanceLevelChanged):不扣金币、不扣材料、不掷骰。
// 于是结局未知(1003)之后重发的旧请求,在上一次已经成功或掉过级时不会再扣一次、再掉一次级。
// 掷骰失败且不掉级时等级没变,同一个 expected_level 仍会被当作新的一次强化受理 ——
// 这一种由 client_request_id 兜住:带同一个键的重发命中首次结果,不再扣、不再掷。
// 不带键(0)的旧客户端收到 1003 仍不得自动重发,先 GetBag 刷新,由玩家看过结果再决定点不点。
message EnhanceEquipRequest {
  uint64 item_id = 1;
  uint32 expected_level = 2;
  // 客户端幂等键(docs/design/client-request-idempotency.md)。玩家每点一次「强化」生成一个非 0 的随机 64 位数;
  // 这一次强化拿到明确结果(受理,或带 tip 的拒绝)之前的所有重发 —— 超时、断线重连、gate 回 1003、
  // 回包没到时玩家又点了同一件 —— 都带同一个键,item_id、expected_level 原样不变。
  // scene 按 (玩家, 键) 去重,查账排在 expected_level 比较之前:同键同参数的重发不再扣、不再掷,
  // 回首次的 success / enhance_level 与当前两份快照并标 replayed;同键换了参数回 kInvalidParameter,不执行。
  // 0 = 旧客户端,不去重。键随玩家存档落盘(每名玩家最近 32 个,player_database.client_request_ledger):
  // 下线重登、换节点、scene 重启之后照样认得;被挤出账本的旧键再来按新的一次强化处理,仍有 expected_level 兜底。
  uint64 client_request_id = 3;
}
message EnhanceEquipResponse {
  TipInfoMessage error_message = 1;
  BagInfo bag = 2;           // 人物背包全量(金币、材料变化)
  BagInfo equipment = 3;     // 装备栏全量
  // 本次强化是否成功。**失败不是错误**:掷骰没过时 error_message 为空、两份快照照常带回
  // (金币与材料已扣,客户端有 tip 就会保留旧快照,所以不能走 tip)。
  bool success = 4;
  uint32 enhance_level = 5;  // 操作后的强化等级
  // true = 这一次是重发(client_request_id 命中了已受理的那一次):没有再扣、没有再掷;
  // success / enhance_level 是首次的结果,bag / equipment 是此刻的状态。客户端按首次那一次的结果展示。
  bool replayed = 6;
}

// 镶嵌:把人物背包里的一颗宝石嵌进装备的指定孔位。按宝石的 config 消耗 1 颗(不指定哪一堆);
// 孔里已有宝石要先取下。
message InlayGemRequest {
  uint64 item_id = 1;        // 装备
  uint32 socket = 2;         // 孔位号(0 起,0 是合法值)
  uint32 gem_config_id = 3;  // 宝石的 Item 表 id
}
message InlayGemResponse {
  TipInfoMessage error_message = 1;
  BagInfo bag = 2;        // 人物背包
  BagInfo equipment = 3;  // 装备栏
}

// 取下:孔里的宝石原样退回 1 颗到人物背包(背包放不下则拒绝),免费。
message RemoveGemRequest {
  uint64 item_id = 1;     // 装备
  uint32 socket = 2;      // 孔位号
}
message RemoveGemResponse {
  TipInfoMessage error_message = 1;
  BagInfo bag = 2;        // 人物背包
  BagInfo equipment = 3;  // 装备栏
}

// 从临时格取回到人物背包(docs/design/bag-rule-policy-layering.md §6.6)。
// 临时格只装「主背包放不下的战斗掉落」,满了**不再挤掉旧物**:新到的掉落整笔留在来源(战斗结算延后重试),
// 玩家用这个请求把东西取回人物背包、腾出位置之后自动补发。
//
// 二选一:item_id != 0 取回这一件(一堆);take_all = true 取回临时格里的全部。两者都给或都不给 = kInvalidParameter。
// 全或无:人物背包放不下这一批就整批拒绝(kBagTemporaryRetrieveBagFull),两个包都不动(可以改成一件一件取)。
// 搬的是实例本身:装备的 guid、随机属性、强化等级、宝石原样带走;可叠加物品先并进人物背包同种物品的未满堆,并剩的仍是原来那一堆。
// 传送途中拒绝(kBagTemporaryRetrieveBusy);战斗中放行(人物背包只进不出,整笔延后的那一局正要靠取回腾位才补得上)。
// item_id 不在临时格里 = kBagTemporaryItemNotFound
// (「上一次其实已经取回、回包丢了」的重发也是这个码,两个包都不动,刷新即可);take_all 时临时格是空的 = 成功、什么都不动。
message RetrieveTemporaryItemsRequest {
  uint64 item_id = 1;
  bool take_all = 2;
}
message RetrieveTemporaryItemsResponse {
  TipInfoMessage error_message = 1;
  BagInfo bag = 2;        // 人物背包全量
  BagInfo temporary = 3;  // 临时格全量
}

service SceneBagClientPlayer {
  option (OptionIsPlayerService) = true;
  option (OptionIsClientProtocolService) = true;
  // 纯读取；开窗不合堆、不整理、不创建缺失组件。
  rpc GetBag (GetBagRequest) returns (GetBagResponse);
  // 仅支持人物背包和仓库，玩家显式点击后走 BagService 审计入口。
  rpc SortBag (SortBagRequest) returns (SortBagResponse);
  // ── 以下只许在末尾追加:生成的 CallMethod 按 method index 分发 ──
  // 穿上 / 卸下:战斗中、跨区冻结中拒绝;成功后服务器重算属性并推属性面板。
  rpc EquipItem (EquipItemRequest) returns (EquipItemResponse);
  rpc UnequipItem (UnequipItemRequest) returns (UnequipItemResponse);
  // 名字必须是 Gm + 大写字母开头:gate / scene 的 GM 闸按这个前缀识别。
  rpc GmGrantItem (GmGrantItemRequest) returns (GmGrantItemResponse);
  // 强化 / 镶嵌 / 取下:战斗中、跨区冻结中拒绝;改的是穿着的那件时服务器重算属性并推属性面板。
  // 三个方法的顺序不可变(method index 5 / 6 / 7);名字不许以 Gm 开头(那是 GM 闸的前缀)。
  rpc EnhanceEquip (EnhanceEquipRequest) returns (EnhanceEquipResponse);
  rpc InlayGem (InlayGemRequest) returns (InlayGemResponse);
  rpc RemoveGem (RemoveGemRequest) returns (RemoveGemResponse);
  // 临时格 → 人物背包(玩家显式操作,method index 8)。传送途中拒绝、战斗中放行;不改装备栏,不重算属性。
  rpc RetrieveTemporaryItems (RetrieveTemporaryItemsRequest) returns (RetrieveTemporaryItemsResponse);
}
