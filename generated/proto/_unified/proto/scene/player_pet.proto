syntax = "proto3";
option go_package = "proto/scene";

import "proto/db/proto_option.proto";
import "proto/common/base/tip.proto";
import "proto/common/base/empty.proto";
import "proto/common/component/pet_cultivation_effects.proto";

option cc_generic_services = true;
option (OptionFileDefaultNode) = NODE_SCENE;

// 宝宝(宠物)客户端协议,设计文档 docs/design/player-pet.md §4。
//
// 与属性加点同一套交互口径:全量下发(PetListInfo),客户端零配表(维度名/说明/上限/剩余点
// 全由服务器给);每个写操作成功后回全量列表,客户端整体覆盖,不做增量合并。

// 宝宝的一级属性维度(与角色面板同结构,取表 AttributeDimension 中 owner_type=1 的行)
message PetDimensionInfo {
  uint32 dimension_id = 1;
  uint32 pool_id = 2;
  string name = 3;         // 体质 / 灵力 / 力量 / 敏捷
  string desc = 4;
  uint32 allocated = 5;    // 已分配点
  uint64 value = 6;        // 面板显示值 = 自然成长 + 生效的已分配。加点不生效(已分配超过本版本总量或单项上限)时
                           // 已分配部分按 0 计,allocated 仍是存储值(docs/design/player-pet.md §3.3)
  uint32 cap = 7;          // 单项上限(0 = 不限)
  uint32 sort = 8;
  uint32 aptitude = 9;     // 该维度资质(万分比,10000 = 100%)
}

// 宝宝的二级属性(与角色 DerivedAttributeInfo 同六项)
message PetDerivedInfo {
  uint64 max_health = 1;
  uint64 max_mana = 2;
  uint64 physical_attack = 3;
  uint64 magic_attack = 4;
  uint64 speed = 5;
  uint64 defense = 6;
  uint64 health = 7;
  uint64 mana = 8;
}

// 宝宝灵阶突破（五阶养成闭环）下一阶预览，客户端零配表直接渲染。
message PetTierAscensionInfo {
  uint32 next_tier = 1;            // 下一灵阶（2..5）；已满阶为 0
  string next_tier_name = 2;
  string next_art_key = 3;
  uint32 min_pet_level = 4;
  uint32 cost_item_id = 5;
  uint32 cost_item_count = 6;
  uint64 cost_gold = 7;
  uint32 bonus_entry_points = 8;   // 突破后该阶赋予的总额外条目点（相对基础 20 点）
  uint64 owned_item_count = 9;     // 玩家当前持有的突破材料数量
  bool can_ascend = 10;            // 服务端综合等级/材料/银两/非战内后的可执行判定
  uint32 block_tip_id = 11;        // 不可突破时的权威 tip 码（0 表示可突破）
}

message PetInfo {
  uint64 pet_id = 1;
  uint32 pet_table_id = 2;
  string name = 3;                       // 展示名(玩家未改名时是 PetTable.name)
  uint32 level = 4;
  uint32 quality = 5;                    // 品质(PetTable.quality)
  uint32 model_id = 6;                   // 客户端模型
  bool is_active = 7;                    // 是否出战中
  uint32 total_points = 8;               // 宝宝属性点总量(按宝宝等级换算)
  uint32 remaining_points = 9;           // 剩余可分配 = 加点生效 ? max(0, 总量 − 宝宝池已分配 − 本版本解释不了的维度上的点) : 0
  uint32 pool_id = 10;                   // 宝宝属性点池 id(加点/洗点请求要带)
  uint64 reset_cost_gold = 11;           // 当前等级下洗点金币(0 = 免费)
  uint32 growth = 12;                    // 成长率(万分比):四维资质均值,服务器算好给,纯展示
  repeated PetDimensionInfo dimensions = 13;
  PetDerivedInfo derived = 14;
  repeated uint32 skill_table_ids = 15;
  uint32 cultivation_tier = 17;
  string cultivation_tier_name = 18;
  string cultivation_art_key = 19;
  PetEntriesInfo entries = 20;
  PetTierAscensionInfo next_tier = 21;   // 下一灵阶突破预览（已满阶时 next_tier == 0）
  string desc = 16;                      // 种类说明(PetTable.desc),客户端 tooltip 用
}

message PetListInfo {
  repeated PetInfo pets = 1;
  uint64 active_pet_id = 2;
  uint32 max_pets = 3;          // 可携带上限(PetRule.max_pets)
  uint64 rename_cost_gold = 4;  // 改名金币(0 = 免费)
}

message GetPetListRequest {
}

message GetPetListResponse {
  TipInfoMessage error_message = 1;
  PetListInfo pets = 2;
}

// 出战:同时只能有一只。重复召唤同一只 = 拒绝(kPetAlreadyActive)
message SummonPetRequest {
  uint64 pet_id = 1;
}

message SummonPetResponse {
  TipInfoMessage error_message = 1;
  PetListInfo pets = 2;
}

// 收回出战宝宝(战斗中拒绝:快照已出,收回会让局内单位与面板分叉)
message RecallPetRequest {
}

message RecallPetResponse {
  TipInfoMessage error_message = 1;
  PetListInfo pets = 2;
}

// 确认加点:提交该宝宝"全部维度的目标已分配值"(全量、幂等),校验口径与角色一致
message AllocatePetPointsRequest {
  uint64 pet_id = 1;
  map<uint32, uint32> allocated = 2;  // dimension_id -> 目标已分配点(缺省维度视为不变)
}

message AllocatePetPointsResponse {
  TipInfoMessage error_message = 1;
  PetListInfo pets = 2;
}

// 洗点:清空该宝宝的全部分配,点数返还;按 AttributePool 表扣金币
message ResetPetPointsRequest {
  uint64 pet_id = 1;
}

message ResetPetPointsResponse {
  TipInfoMessage error_message = 1;
  PetListInfo pets = 2;
}

// 自动加点:按 AttributeAutoPlan(宝宝池的通用方案)算建议分配,只算不落
message AutoAllocatePetPointsRequest {
  uint64 pet_id = 1;
}

message AutoAllocatePetPointsResponse {
  TipInfoMessage error_message = 1;
  uint64 pet_id = 2;
  map<uint32, uint32> suggested = 3;  // dimension_id -> 建议的目标已分配点(含已分配部分)
}

message RenamePetRequest {
  uint64 pet_id = 1;
  string name = 2;
}

message RenamePetResponse {
  TipInfoMessage error_message = 1;
  PetListInfo pets = 2;
}

// 服务器主动推送(主人升级带动宝宝升级、战斗结算回写残血等):客户端整体覆盖
message PetListChangedS2C {
  PetListInfo pets = 1;
}

// GM:直接发一只宝宝(开发/测试用的唯一获取入口;捕捉/购买是二期,见设计文档 §8)。
// ⚠ 今天这条**没有任何鉴权**,与既有的 GmSetPlayerLevel / GmAddCurrency 同状态
//(gate 侧不存在按消息号的 GM 白名单)。上线前三条一起收口,见 player-pet.md §8。
message GmGrantPetRequest {
  uint32 pet_table_id = 1;
}

message GmGrantPetResponse {
  TipInfoMessage error_message = 1;
  PetListInfo pets = 2;
  uint64 pet_id = 3;
}

// 普通玩家商店。价格、上架种类、下一购买序号由服务端给出。
message PetShopOffer {
  uint32 pet_table_id = 1;
  string name = 2;
  uint32 model_id = 3;
  uint32 unlock_level = 4;
  uint64 price_gold = 5;
  string desc = 6;
}

message GetPetShopRequest {}
message GetPetShopResponse {
  TipInfoMessage error_message = 1;
  repeated PetShopOffer offers = 2;
  uint64 gold = 3;
  uint64 next_purchase_sequence = 4;
}

message BuyPetRequest {
  uint32 pet_table_id = 1;
  uint64 purchase_sequence = 2;
  uint64 price_gold = 3; // 用户确认的报价；过期报价拒绝，不按新价格扣款。
}

message BuyPetResponse {
  TipInfoMessage error_message = 1;
  PetListInfo pets = 2;
  uint64 pet_id = 3;
  uint64 gold = 4;
  uint64 next_purchase_sequence = 5;
}

// 条目目录与快照。收益全由服务端计算，不从美术示例或客户端表推导。
message PetEntryInfo {
  uint32 id = 1;
  string name = 2;
  string desc = 3;
  uint32 category = 4;
  uint32 channel = 5;
  uint32 state_kind = 6;
  uint32 cap = 7;
  uint32 per_point_bps = 8;
  uint32 allocated = 9;
  uint32 effective_bps = 10;
  uint32 sort = 11;
  string icon = 12;
}
message PetEntryPresetSummary {
  uint32 slot_id = 1;                  // 1..3
  uint32 tag = 2;                      // 0默认 / 1输出 / 2控场 / 3辅助
  uint32 used_points = 3;              // 该方案当前已投入总点数
  map<uint32, uint32> allocated = 4;   // entry_id -> 已分配点（紧凑非零项）
}

message PetEntriesInfo {
  uint64 pet_id = 1;
  uint64 state_version = 2;
  uint32 config_version = 3;
  uint32 total_points = 4;
  uint32 remaining_points = 5;
  uint32 max_directions = 6;
  repeated PetEntryInfo entries = 7;
  PetCultivationEffects effects = 8;
  bool effective = 9;
  uint64 unknown_used_points = 10;
  // 供断线重连确认最近成功请求；客户端仍须核完整目标和版本。
  string last_request_id = 11;
  uint32 active_preset_slot = 12;               // 当前生效方案槽位（1..3）
  repeated PetEntryPresetSummary presets = 13;  // 全部 3 套方案概览（按 slot_id 升序）
}
message GetPetEntriesRequest { uint64 pet_id = 1; }
message GetPetEntriesResponse {
  TipInfoMessage error_message = 1;
  PetEntriesInfo entries = 2;
}
message PreviewPetEntriesRequest {
  uint64 pet_id = 1;
  uint64 state_version = 2;
  uint32 config_version = 3;
  map<uint32, uint32> target = 4;
}
message PreviewPetEntriesResponse {
  TipInfoMessage error_message = 1;
  PetEntriesInfo entries = 2;
}
message SavePetEntriesRequest {
  uint64 pet_id = 1;
  uint64 state_version = 2;
  uint32 config_version = 3;
  map<uint32, uint32> target = 4;
  string request_id = 5; // 16-64字节ASCII标识；同一结果未知请求重试必须原样。
}
message SavePetEntriesResponse {
  TipInfoMessage error_message = 1;
  PetEntriesInfo entries = 2;
  string request_id = 3;
  bool replayed = 4;
}

// 切换宝宝条目方案槽位（1..3）或更新其用途标签（0默认/1输出/2控场/3辅助）；战外免费、乐观锁 + 幂等。
message SwitchPetEntryPresetRequest {
  uint64 pet_id = 1;
  uint32 slot_id = 2;
  uint32 tag = 3;              // 0..3；传 0xFFFFFFFF 表示保持目标槽位原有标签不变
  uint64 state_version = 4;
  uint32 config_version = 5;
  string request_id = 6;       // 16-64字节ASCII标识
}
message SwitchPetEntryPresetResponse {
  TipInfoMessage error_message = 1;
  PetEntriesInfo entries = 2;
  string request_id = 3;
  bool replayed = 4;
}

// 宝宝灵阶突破（普通→变异→灵兽→神兽→圣兽）：消耗 PetTier 配表材料与银两，乐观锁 + 幂等。
message AscendPetTierRequest {
  uint64 pet_id = 1;
  uint32 expected_tier = 2;    // 客户端看到的当前阶位（1..4）
  uint64 client_request_id = 3; // 必须非 0；断线重放原样传回
}
message AscendPetTierResponse {
  TipInfoMessage error_message = 1;
  PetListInfo pets = 2;
  uint64 gold = 3;
  uint64 client_request_id = 4;
  bool replayed = 5;
  uint32 new_tier = 6;
}

service ScenePetClientPlayer {
  option (OptionIsPlayerService) = true;
  option (OptionIsClientProtocolService) = true;

  rpc GetPetList (GetPetListRequest) returns (GetPetListResponse);
  rpc SummonPet (SummonPetRequest) returns (SummonPetResponse);
  rpc RecallPet (RecallPetRequest) returns (RecallPetResponse);
  rpc AllocatePetPoints (AllocatePetPointsRequest) returns (AllocatePetPointsResponse);
  rpc ResetPetPoints (ResetPetPointsRequest) returns (ResetPetPointsResponse);
  rpc AutoAllocatePetPoints (AutoAllocatePetPointsRequest) returns (AutoAllocatePetPointsResponse);
  rpc RenamePet (RenamePetRequest) returns (RenamePetResponse);
  rpc NotifyPetListChanged (PetListChangedS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc GmGrantPet (GmGrantPetRequest) returns (GmGrantPetResponse);
  rpc GetPetShop (GetPetShopRequest) returns (GetPetShopResponse);
  rpc BuyPet (BuyPetRequest) returns (BuyPetResponse);
  rpc GetPetEntries (GetPetEntriesRequest) returns (GetPetEntriesResponse);
  rpc PreviewPetEntries (PreviewPetEntriesRequest) returns (PreviewPetEntriesResponse);
  rpc SavePetEntries (SavePetEntriesRequest) returns (SavePetEntriesResponse);
  // ── 以下按 method index 顺序追加，不可重排 ──
  rpc SwitchPetEntryPreset (SwitchPetEntryPresetRequest) returns (SwitchPetEntryPresetResponse);
  rpc AscendPetTier (AscendPetTierRequest) returns (AscendPetTierResponse);
}
