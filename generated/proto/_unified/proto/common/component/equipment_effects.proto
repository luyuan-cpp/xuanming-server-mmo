syntax = "proto3";
option go_package = "proto/common/component";
import "proto/common/component/support_effects.proto";

// 装备已汇总的静态修正，比例统一使用万分比。四项面板修正在 scene 已结算，战斗不再乘。
message EquipmentEffects {
  uint32 physical_attack_bps = 1;
  uint32 magic_attack_bps = 2;
  uint32 max_health_bps = 3;
  uint32 speed_bps = 4;
  uint32 outgoing_heal_bps = 5;
  uint32 shield_capacity_bps = 6;
  uint32 physical_crit_bps = 7;
  uint32 magic_crit_bps = 8;
  uint32 physical_resist_bps = 9;
  uint32 magic_resist_bps = 10;
  // 类型：1封灵、2封法、3封物、4混乱、5昏睡、6冰冻、7中毒。
  map<uint32, uint32> ailment_hit_bps = 11;
  map<uint32, uint32> ailment_resist_bps = 12;
  // 类别：1物攻、2法攻、3治疗、4护盾、5封灵、6封法、7封物、8混乱、9昏睡、10冰冻、11毒、12辅助。
  map<uint32, uint32> mana_reduction_bps = 13;
  // 每件实物单独携带。同名允许重复，item_id 不允许重复；顺序不承载槽位语义。
  repeated EquipmentArtifactSource artifacts = 14;
  repeated SupportEffectSource support_sources = 15; // 与同一轮聚合同时产生，禁止客户端再累计。
  bool support_sources_complete = 16; // 旧快照/缺背包输入不能冒充完整来源。
  // 单槽赛季装备栏（「赛季印」，方案 A）：与永久 8 部位装备、2 永久法宝严格隔离，不占用物品永久 GUID。
  SeasonSealEffect season_seal = 17;
  uint32 season_max_health_bps = 18; // 本季赛季印轻度气血万分比（<= 500，首测上限 300）
  uint32 season_defense_bps = 19;    // 本季赛季印轻度防御万分比（<= 500，首测上限 300；严禁速度/控命/抵抗）
}

// 赛季印的战斗机制快照：结构与法宝效果一致，但按 (season_id, seal_id) 标识，不借用永久 item_id。
message SeasonSealEffect {
  uint32 season_id = 1;
  uint32 seal_id = 2;
  uint32 effect_id = 3; // 1 物理削盾、2 法术削盾、6 开局减伤、7 防御回蓝等。
  uint32 bonus_bps = 4;
  uint32 cap_bps = 5;
  uint32 per_round_limit = 6; // 0 不限。
  uint32 battle_limit = 7;    // 0 不限。
  uint32 active_rounds = 8;   // 0 不限。
  uint32 health_threshold_bps = 9;
  string name = 10;
}

message EquipmentArtifactSource {
  uint64 item_id = 1;
  uint32 effect_id = 2; // F01..F08 对应 1..8。
  uint32 bonus_bps = 3;
  uint32 cap_bps = 4;
  uint32 per_round_limit = 5; // 0 不限。
  uint32 battle_limit = 6; // 0 不限。
  uint32 active_rounds = 7; // 0 不限。
  uint32 health_threshold_bps = 8;
  string name = 9; // 只读来源显示名；效果仍由effect_id及已校验参数裁决。
}
