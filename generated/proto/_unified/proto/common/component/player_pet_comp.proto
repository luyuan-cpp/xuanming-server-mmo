syntax = "proto3";
option go_package = "proto/common/component";

// 宝宝(宠物)系统持久化数据,设计文档 docs/design/player-pet.md。
//
// 与角色属性加点(player_attribute_comp.proto)共用同一套表与纯规则:
//   一级属性 = 表 AttributeDimension 中 owner_type=1(宝宝)的维度(体质/灵力/力量/敏捷),
//              维度值 = 每级自然成长 × 宝宝等级 + 已分配点;
//   点数总量 = 表 AttributePool 中 owner_type=1 的池按**宝宝等级**换算,不落库(与角色同口径);
//   二级属性 = 现算不落库(PetSystem::ComputeDerived),没有第二份真相。
//
// 宝宝等级不独立成长:经验系统未接入前,宝宝等级 = min(主人等级, PetTable.level_cap),
// 由 PetSystem 在每次重算时同步。这样全仓只有"主人等级"一个等级真相。

// 宝宝条目预设方案（布局层：槽位 1..3 + 枚举用途标签，避免自由文本 UGC 风险）
message PetEntryPreset {
  uint32 slot_id = 1;                  // 1..3 显式方案槽位号
  uint32 tag = 2;                      // 0默认 / 1输出 / 2控场 / 3辅助
  map<uint32, uint32> allocated = 3;   // entry_id -> 已分配点
}

// 一只宝宝
message PetInstance {
  uint64 pet_id = 1;          // scene 从发号器 item 号段领号(宝宝沿用 item 身份域,PetSystem::GrantPet 铸),只当身份用,不能解析
  uint32 pet_table_id = 2;    // 种类(Pet 表 id)
  string name = 3;            // 玩家自定义名;空 = 用 PetTable.name
  uint32 level = 4;           // 派生自主人等级(见文件头),存下来只为离线展示与结算夹取
  map<uint32, uint32> allocated = 5;  // dimension_id -> 已分配点(只增不减;洗点走整池重置)
  // dimension_id -> 资质(万分比,10000 = 100%)。出生时在 PetTable 的
  // aptitude_min/aptitude_max 之间随机,之后不变(洗资质是二期)。
  // 缺键按 10000 处理,老存档与改表都能自愈。
  map<uint32, uint32> aptitude = 6;
  uint64 health = 7;          // 当前气血(战斗结算回写,残血跨登录保留)
  uint64 mana = 8;            // 当前法力
  uint64 created_at = 9;      // 获得时间(Unix 秒)
  repeated uint32 skill_table_ids = 10;  // 宝宝技能(SkillTable id),核心线来自 PetTable
  map<uint32, uint32> skill_ranks = 11; // 公共技能原型的已学等级，由 PetSystem 唯一写入。
  map<uint32, uint32> entry_allocated = 12; // 独立条目池；未知键保留并占预算。
  uint64 entry_state_version = 13;
  string entry_last_request_id = 14;
  uint64 entry_last_base_version = 15;
  uint32 entry_last_config_version = 16;
  map<uint32, uint32> entry_last_target = 17;
  uint32 cultivation_tier = 18; // 独立五阶身份，非 quality/acquisition_tier。
  uint32 active_entry_preset_slot = 19;      // 当前启用的条目方案槽位（0 兼容按 1 处理；有效范围 1..3）。
  repeated PetEntryPreset entry_presets = 20; // 3 套条目预设方案；当前生效槽位与 entry_allocated 原子同步。
  uint64 tier_last_request_id = 21;          // 最近一次成功的灵阶突破幂等键（0 表示未突破过）。
  uint32 tier_last_expected_tier = 22;       // 最近一次灵阶突破请求的期望前阶（防复用不同参数重放）。
  uint32 tier_last_result_tier = 23;         // 最近一次灵阶突破后的结果阶位。
  uint32 entry_last_preset_slot = 24;        // 最近一次条目方案切换的目标槽位（0 表示最近请求是 SaveEntries）。
  uint32 entry_last_preset_tag = 25;         // 最近一次条目方案切换的目标用途标签。
  uint32 cosmetic_id = 26;                   // 当前穿戴的灵宠幻化外观 ID（PetCosmetic.id；0 = 原形，纯外观零数值）。
}

// 灵宠编队快捷预设（布局层只存 pet_id 引用，放生/交易时自动过滤失效引用，绝不拷贝宠物实例属性）。
message PetSquadPreset {
  uint32 slot_id = 1;            // 1..5 槽位号（1..2 免费，3..5 永久付费解锁或月卡临赠 +1）
  uint32 tag = 2;                // 0默认 / 1日常PVE / 2会武PVP / 3首领试炼
  repeated uint64 pet_ids = 3;   // 最多 3 只宝宝 pet_id（首只为出战首发宠）
}

// 玩家宝宝数据(持久化到 player_database.pet_component)
message PlayerPetComp {
  repeated PetInstance pets = 1;
  uint64 active_pet_id = 2;   // 出战中的宝宝 pet_id;0 = 未出战
  // 商店购买的单调序号与最近成功回执，和扣款、宠物实例一起存盘。
  uint64 last_purchase_sequence = 3;
  uint32 last_purchase_pet_table_id = 4;
  uint64 last_purchase_pet_id = 5;
  uint64 last_purchase_price_gold = 6;
  // true = 该角色已完成一次性起步灵狐判定（已发放或老号已有宠不再补发），重登/召回/放生均不重发。
  bool starter_pet_granted = 7;
  // 灵宠编队快捷预设列表（按 slot_id 定位，不依赖下标顺序）。
  repeated PetSquadPreset squad_presets = 8;
  // 永久已解锁的灵宠编队预设槽位数（0 兼容按默认免费 2 套处理，范围 2..5）。
  uint32 unlocked_squad_preset_slots = 9;
}
