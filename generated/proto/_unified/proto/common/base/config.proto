syntax = "proto3";
option go_package = "proto/common/base";

// Service config, avoid conflict with protobuf's Service
message ServiceConfig {
    string name = 1;  // Service name
    string url = 2;   // Health check or access URL
}

message KafkaConfig {
    repeated string brokers = 1;            // Kafka broker list
    repeated string topics = 2;             // Configurable topic list
    string group_id = 3;                    // Consumer group ID
    bool enable_auto_commit = 4;            // Enable auto-commit
    string auto_offset_reset = 5;           // earliest / latest

    // ---- 控制面命令 topic 的分区契约 ----
    // docs/design/control-plane-topic-partitioning-20260908.md。
    // 控制面命令(GateCommand / SceneCommand)从"一个节点一个 topic"改成
    // "一个节点类型一个 topic + 固定分区数,partition = node_id % P"。
    // 三个字段都是 0 = 用编译期默认值(node_command_topic.h 里的常量),
    // 这样存量 yaml 不改也能起。

    // P:分区数。**不可变契约**,与审计 topic 同一套纪律
    // (docs/design/db-task-kafka-partition-contract.md):要改就 +1 代号换一批
    // 新 topic,绝不原地扩分区 —— 扩分区会把 node_id % P 重映射,
    // 命令就发到没人 assign 的分区上,静默全丢。0 = 256。
    uint32 command_topic_partitions = 6;

    // 代号,进 topic 名:`<类型>-cmd_g<N>`(与 data_service 的
    // transaction_log_topic_g1 同形)。0 = 1。
    uint32 command_topic_generation = 7;

}

// 一种永久 guid 的号段配置(docs/design/node-id-overhaul-plan-20260908.md §6 / §7.5)。
// 号段 = scene 经 DataService.AllocateIdSegment 领 [lo, hi)。
// 一种 GUID 一个客户端实例(C++ GuidSegmentRegistry),kind 名 = 注册表种类名 = 发号器的 biz_tag。
message IdSegmentKindConfig {
    // 种类名:item / txlog / snapshot(以后 pet / guild …)。不认识的名字被忽略并记 ERROR。
    string kind = 1;
    // 关闭 = 这种 guid 在本节点**没有发号源**:没有 snowflake 回退(scene 已退出槽位协议),
    // 每次铸号都 fail-closed。只用于故意停掉某种 guid 的场景,不是回滚开关。
    bool enabled = 2;
    // 动态 step(Leaf 口径):首次领段长度,以及上下限。一段不到 15 分钟用完 → 下次 ×2(≤ max_step),
    // 超过 30 分钟才用完 → 下次 ÷2(≥ min_step)。0 = 钉在 initial_step 上(不扩 / 不缩)。
    uint32 initial_step = 3;
    uint32 min_step = 4;
    uint32 max_step = 5;
}

// 永久 guid 号段总配置:每种 guid 一块。只有 scene 读;放在部署配置而不是 GameConfig,
// 因为它是发号基础设施参数,不是玩法参数,而且只有这一份 yaml 不用改两处。
message IdSegmentConfig {
    repeated IdSegmentKindConfig kinds = 1;
}

// C++ 节点发出的 unary gRPC 调用的 deadline(docs/design/grpc-muduo-transport.md §16.3)。
// 按**目标**节点类型配;没配到的类型用客户端调用公共头中的 kDefaultGrpcCallDeadlineMs(core/network/grpc_client_call.h)。
// 取值遵守「上游比下游宽」:大于目标服务的服务端超时,小于依赖这次调用结果的 C++ 看门狗。
message GrpcClientConfig {
    // key = ENodeType 枚举名(SceneManagerNodeService / DataServiceNodeService …),value = 毫秒。
    // 不认识的键、值为 0(= 不限时,违反超时预算)都被忽略并记 ERROR,该类型保持默认。
    map<string, uint32> call_deadline_ms = 1;
}

// C++ 节点的 span 导出(docs/design/distributed-tracing.md §10.3,阶段三)。
// 地址空 = 不导出(不起导出线程)。OTel 规范的环境变量优先于这里:OTEL_EXPORTER_OTLP_TRACES_ENDPOINT、
// OTEL_EXPORTER_OTLP_ENDPOINT、OTEL_SDK_DISABLED、OTEL_TRACES_EXPORTER(取值规则见 core/tracing/otlp_http.h)。
message TracingConfig {
    // OTLP/HTTP 的 traces 地址,原样使用:http://host[:port]/v1/traces。本机是 Alloy 的 127.0.0.1:4318,
    // K8s 上由 k8s_deploy.ps1 写成本节点 Alloy 的 Service(internalTrafficPolicy: Local)。只认明文 http。
    string otlp_traces_endpoint = 1;
}

// Base deploy config
message BaseDeployConfig {
    repeated string etcd_hosts = 1;
    uint32 log_level = 2;
    repeated ServiceConfig services = 3;
    repeated string service_discovery_prefixes = 4;
    uint32 keep_alive_interval = 5;
    string deployservice_prefix = 6;
    uint32 node_ttl_seconds = 7;
    uint32 health_check_interval = 8;

    KafkaConfig kafka = 9;  // Kafka config

    // Table data directory path
    string table_data_directory = 10; // Config table directory path

    // Shared HMAC secret for Gate connection tokens (Login signs, Gate verifies).
    // If empty, Gate skips token verification (dev/test mode).
    string gate_token_secret = 11;

    // Table data loading format: "json" (default) or "binary".
    // "binary" loads .pb files (proto wire format) for faster startup.
    string table_data_format = 12;

    // Grace period (seconds) before actually removing a node after etcd DELETE.
    // During this window, if the node re-registers (PUT), the removal is cancelled.
    // 0 = immediate removal (production default).
    // 300+ = recommended for dev/debug to survive breakpoint pauses.
    uint32 node_removal_grace_seconds = 13;

    // Root directory for data files (nav meshes, etc.).
    // Nav bin path = data_root_directory + nav_bin_file from table.
    // Local dev: "../"   K8s: "/app/"
    string data_root_directory = 14;

    // Gate 的并发客户端连接上限。生产取值 1..131071;
    // 0 = 关闭运维阈值(仅供显式 dev/test 本地调试,prod 会拒绝启动),
    // 但 session-id 的 131071 硬上限仍然生效。
    //
    // 为什么必须有:gate 是唯一对公网开放的端口,而 muduo 的 TcpServer 无条件
    // accept —— 在此之前全仓没有任何连接数上限,任何人都能一直建连把 gate 的
    // fd、SessionMap 和每连接缓冲吃光,直到 accept 撞 EMFILE 或进程 OOM。
    // 这条限流不需要任何凭证即可触发,是纯粹的资源耗尽面。
    // 超过上限的新连接在分配 session 之前就被拒掉(见 HandleConnectionEstablished)。
    // 131071 上界为所有 node_id 保留 UINT32_MAX 哨兵,并避免 session-id 空间
    // 全部占满后碰撞重试永久自旋。
    uint32 gate_max_connections = 15;

    // battle 节点客户端直连票据的 HMAC 共享密钥(battle 节点签发并校验;全部 battle 实例
    // 必须一致;与 gate_token_secret 分域,任一泄露不影响另一侧)。
    // 空值处置由 BATTLE_RUN_MODE 决定:dev/test 放行并 WARN,prod 拒绝启动
    // (设计文档 turn-based-battle-server.md §18 D24/D27)。
    string battle_token_secret = 16;

    // battle 节点客户端面并发直连上限。0 = 关闭运维阈值(仅 dev/test);
    // 语义与 gate_max_connections 相同:超限连接在握手前即被拒。
    uint32 battle_max_connections = 17;

    // 观战订阅凭证的 HMAC 共享密钥(battle-spectate-tiered-fanout.md §15.2 / D98):match 签发、gate 本地验签。
    // 与 gate_token_secret、battle_token_secret 分域,三者必须互不相同。空值处置同 battle_token_secret:
    // dev/test 放行并 WARN(gate 拒绝一切 SubscribeSpectate,只能走直连观战),prod 拒绝启动。
    string spectate_token_secret = 24;

    // 集群号:部署级常量,由运维一次性设定(ConfigMap / yaml),策划不碰,默认 0。
    // 只有 Go 的 snowflake 槽位协议消费它(现在只剩 scene-manager 的 scene_id;login、guild、match
    // 改由发号器发号,不再申领槽位),作为 17 位 worker 字段的高 5 位([cluster5][node12]);C++ 侧 2026-09-08 起没有消费者
    // (scene 的永久 guid 走号段,不编码集群),这里只是同一份 yaml 口径的原样读入。
    // 取值 0..31。见 docs/design/node-id-overhaul-plan-20260908.md §5 / §7.5。
    uint32 cluster_id = 18;

    // 永久 guid 号段(item / txlog / snapshot 各一块,见 IdSegmentConfig)。
    IdSegmentConfig id_segment = 19;

    // 20 是 audit_topic_generation(审计 topic 的世代号),2026-11-12 删除:C++ 不再直接发审计 topic,
    // 流水与快照随玩家存盘进 go/db 的审计发件箱,由 go/db 投 Kafka(docs/design/player-audit-outbox.md)。
    // 世代号现在只在 Go 一侧:go/db 的 AuditOutbox.TopicGeneration(生产者)与 go/data_service 的 Kafka.TopicGeneration(消费者)。
    reserved 20;
    reserved "audit_topic_generation";

    // C++ 节点 unary gRPC 调用的 deadline(见 GrpcClientConfig)。可以不写:缺席 = 全部用内置默认。
    GrpcClientConfig grpc_client = 21;

    // span 导出(见 TracingConfig)。22、23 没用过但不确定历史上有无存量配置,新字段从 25 起。yaml 键 Tracing。
    TracingConfig tracing = 25;
}

// Game config
message GameConfig {
    uint32 scene_node_type = 1;  // Scene node type
    uint32 zone_id = 2;          // Zone ID

    // 一个 Redis 句柄的地址(scene 的 RedisClusterClient):player_redis 与 control_redis 共用这一种写法。
    // 由 readGameConfig 手工逐键解析,取值由 scene 启动时校验,配错拒绝启动。
    message RedisClusterConfig {
        string mode = 1;             // standalone | cluster
        repeated string seeds = 2;   // host:port。主机名只在启动时解析一次。standalone 恰好一个;cluster 至少一个,只用来拿拓扑
        string password = 3;         // 空 = 不认证;各段有自己的口令环境变量覆盖,值不进日志
    }

    // 7 是 zone_redis(核心单实例,gate / scene / battle 都连)、11 是 scene_control_redis(本 zone 组的控制域单实例),
    // 2026-11-12 合成 control_redis = 12:scene 只连一个控制集群句柄,gate、battle 不再连 Redis
    // (docs/design/redis-cluster-all-domains-20261110.md §4.2)。项目未上线,没有存量配置要兼容。
    reserved 7, 11;
    reserved "zone_redis", "scene_control_redis";

    // 玩家持久收件箱的 scene 消费端(docs/design/player-inbox-service.md §3.3、§7.3、§11.7)。
    // 由 readGameConfig 手工逐键解析(cpp/libs/engine/config/config.cpp),yaml 键名 player_inbox。
    // **整段或单键缺失时加载器显式取默认值**,不依赖 proto3 的 0:
    //   consumer_enabled        默认 false = 不发 Fetch,账本字段照常随存档往返(这就是回滚下限,§11.7 第 4 步);
    //   periodic_fetch_minutes  默认 30 = 在线有界兜底周期(分钟,±20% 抖动);0 = 关闭兜底(0 有含义,所以不能当缺省值)。
    message PlayerInboxConfig {
        bool consumer_enabled = 1;
        uint32 periodic_fetch_minutes = 2;
    }

    PlayerInboxConfig player_inbox = 8;

    // 玩家域 Redis(docs/design/redis-player-store-cluster.md §5.1、§5.6),只有 scene 连它。yaml 键名 player_redis。
    // **整段缺失时加载器显式取 control_redis 的值**(模式、种子与口令,同 Go 各服务 PlayerRedis 回落到 ControlRedis),
    // 开发环境不用改配置;写了这一段就是另一个实例或集群,口令只认显式值与环境变量 PLAYER_REDIS_PASSWORD。
    RedisClusterConfig player_redis = 9;

    // 进场、离场的审计快照(整档发 Kafka,data_service 落 player_snapshot;modules/snapshot/audit_snapshot_policy.h)。
    // 由 readGameConfig 手工逐键解析,yaml 键名 audit_snapshot。**整段或单键缺失时加载器显式取默认**:两个触发点都开、全量。
    // K8s 的 node-config 从 bin/etc/game_config.yaml 整段复制这一段。只影响审计证据,不影响存盘。
    message AuditSnapshotConfig {
        bool login_enabled = 1;
        bool logout_enabled = 2;
        // 抽样千分比,1000 = 全量,0 = 两个触发点都不发。按 player_id 稳定抽样,同一玩家的进退场快照成对。
        uint32 sample_per_mille = 3;
    }

    AuditSnapshotConfig audit_snapshot = 10;

    // 控制集群(docs/design/redis-cluster-all-domains-20261110.md §4.2、§5.2),只有 scene 连它:scene_manager 写的分线目录、
    // 神秘商人读模型,场景归属对账,资产待办唤醒(SPUBLISH 分片频道)。yaml 键 control_redis。
    // **整段或单键缺失时加载器显式取默认**:standalone、种子 127.0.0.1:6379、不认证(同 Go 各服务 ControlRedis 的缺省);
    // 口令可被环境变量 CONTROL_REDIS_PASSWORD 覆盖。
    RedisClusterConfig control_redis = 12;
}
