syntax = "proto3";
option go_package = "proto/common/base";



message SessionDetails
{
  uint32 session_id = 1;
  uint64 player_id = 2;
  uint32 gate_node_id = 3;      // Gate node ID (for Kafka routing)
  string gate_instance_id = 4;  // Gate startup UUID (zombie-message protection)
  // 重定向票据绑定(cross-zone-scene-travel.md CZ-8)。gate 验签通过后从 GateTokenPayload 的
  // player_id / target_zone_id 原样拷入;0 = 普通 AssignGate 票据(签票时还没登录)/ dev 旁路 /
  // 旧版 gate。主判定在 login EnterGame:持票者不符即拒;target_zone_id == 本 zone 时不按
  // home_zone 弹回。gate 只透传,不据此做业务决定。
  uint64 ticket_player_id = 5;
  uint32 ticket_target_zone_id = 6;
  // 会话代次(docs/design/client-request-ordering.md §4.8;client-access-band-routing.md D60 预订的 7 号)。
  // gate 进程内单调,会话存续期间不变;与 gate_instance_id 合起来全局唯一。0 = 旧版 gate(无栅栏)。
  // gate 认领回包时用它挡住 session_id 被复用后迟到的旧回包;login 会话栅栏用 (gate_instance_id, 本字段) 建键。
  uint64 session_incarnation = 7;
  // gate 调用序号(client-request-ordering.md §4.8):gate 进程内单调,准入时按收包顺序分配;
  // 0 = 不受 lane 管理(gate 合成的断线通知)。路由服原值回写响应头,gate 据此认领 lane 队头。
  // 业务服务不得把它当幂等键(它按调用编号,不按客户端意图编号);可以作为 (session_incarnation, 本字段) 水位栅栏。
  uint64 gate_call_seq = 8;
  // gate绑定角色时确认的原归属修订；换图原样保留，解绑清零。业务提交须与原账号一起复核，禁止反查当前归属补值。
  uint64 owner_revision = 9;
  // login 完成原连接认证与选角后，经内部 BindSessionEvent 交给 gate 的原账号。
  // 仅服务端传递；下游必须先验证整份 SessionDetails 的调用方签名，不能信客户端自报。
  // 角色解绑时清理，不能按 player_id 查询当前 owner 补值。
  string authenticated_account = 10;
}
