syntax = "proto3";
option go_package = "proto/common/database";

import "proto/db/proto_option.proto";
import "proto/common/database/mysql_database_table.proto";

// PlayerAllData:scene 里一个玩家的整份持久快照。每次存盘新拼一份(SavePlayerImpl),按行投影写进
// player_store(docs/design/player-save-direct-commit.md);加载时由各行拼回 player_database_data。
//
// 冻结(docs/design/mixed-version-persist-field-protection.md §3.2 R1):顶层不经 SQL,冷加载由骨架组装,
// 存盘每次新拼,顶层新字段无处持久化。新数据一律加进 player_database。
message PlayerAllData {
  option (OptionPersistFrozen) = true;

  player_database player_database_data = 2;
  // 3 是 player_database_1_data,随 player_database_1 删除(docs/design/player-save-direct-commit.md §1.2)。
  reserved 3;
  reserved "player_database_1_data";

  // 4、5、6 是给旧读者的 bag_data / quest_data 兼容副本和从没有写入方的 mail_data。副本由数据库记录重算,
  // 每次存盘白做两次深拷贝,服务端早已没有读者;项目未上线、存档可以清空,旧档兼容分支一并删掉(2026-11-11)。
  reserved 4, 5, 6;
  reserved "bag_data", "quest_data", "mail_data";

  uint64 last_save_seq = 7; // 存盘发号水位，跨重接和跨场景继承，不承载业务数据
}
