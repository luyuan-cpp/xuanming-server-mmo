syntax = "proto3";
option go_package = "proto/common/event";

import "proto/common/component/scene_comp.proto";

// DEPRECATED(docs/design/cross-zone-scene-travel.md CZ-1):整个文件待删。
// 这两条消息属于"跨 zone 搬数据"链(Kafka 搬 PlayerAllData + ACK + reaper 重发)。该链已下线:
// 全仓从无触发点,且与"数据不搬家、按 home_zone 落库"的决策冲突。C++ 侧的发布 / 消费 / reaper
// 代码与 scene 节点的 topic 订阅都已删除,Go 侧从来没有消费方 —— 现在没有任何手写代码引用它们。
// 本轮只打标记不删文件:删 proto 必须同一轮 regen,否则 proto 源与生成物(pb.h / event_id 头 /
// rpc_event_registry / 空壳 player_migration_event_handler)不一致,scene 与 rpc 工程直接编不过。
// 下次 regen 时:删本文件 → regen → 手删生成器不会清理的陈旧文件
// (cpp/nodes/scene/handler/event/player_migration_event_handler.{h,cpp} 及其在
//  cpp/nodes/scene/CMakeLists.txt、scene.vcxproj、scene.vcxproj.filters 里的清单行)。
// 未上线,不需要 reserved(AGENTS §4.3)。不要再给它们加新的使用方。
// (本段与下面的 message 之间留一个空行是有意的:这是整文件的说明,不是 PlayerMigrationEvent 的
//  文档注释;贴着写会被 protoc 当成该消息的 leading comment 抄进 pb.go,平白多一处生成物 diff。)

message PlayerMigrationEvent {
  uint64 player_id = 1;
  uint64 source_scene_id = 2;
  uint64 target_scene_id = 3;
  bytes serialized_player_data = 4;
  uint32 from_zone = 5;
  uint32 to_zone = 6;
  int64 timestamp = 7;  // Event generation time
  ChangeSceneInfoComp scene_info = 9;

  // SHA-256 of `serialized_player_data` taken at publish time.
  //
  // Why this exists (cross-zone-readiness-audit.md §7 失败 D):
  //   Kafka rebalance / re-assignment can redeliver the same
  //   `player_migrate` to the destination after we already processed it.
  //   The destination's idempotency guard in HandlePlayerMigration
  //   currently leans on "is the player entity already present in this
  //   node's registry" — a structural check that catches the common
  //   case but is fragile under restart-recovery (entity not yet built
  //   when the duplicate arrives) and migration-failure-then-retry
  //   (the reaper republishes a *fresh* payload that may differ from
  //   the original, e.g. the player gained an item between the original
  //   send and the retry).
  //
  //   The SHA-256 lets the destination distinguish:
  //     • exact-duplicate delivery (same hash) → skip Init, re-emit ACK
  //     • reaper retry with mutated payload (different hash) → process
  //       as a fresh migration, the source's most recent state wins
  //
  //   Source side computes once on send. Destination compares against
  //   the hash it stamps onto a per-player de-dup key when it processes
  //   a migration; details in HandlePlayerMigration.
  //
  // Wire compatibility:
  //   Empty bytes is the "absent" signal. Older nodes (pre-this-field)
  //   publish empty; destination treats empty hash as "fall back to the
  //   structural check." The structural check still catches every case
  //   we've seen in stress tests; the hash is belt-and-suspenders for
  //   the rare edge case (reaper retry vs Kafka redelivery race).
  bytes payload_sha256 = 10;
}

// Cross-zone migration acknowledgement.
//
// Published by the destination scene node on Kafka topic `player_migrate_ack`
// after it successfully loads a migrating player from `PlayerMigrationEvent`.
// The source-side scene node consumes this ACK to:
//   1. Remove PlayerFrozenComp from the source-side entity.
//   2. Finally call DestroyPlayer (which was deferred precisely until this ACK).
//
// See docs/design/cross-zone-readiness-audit.md §3.2 件 2-3 for the full ACK
// protocol and §7 for failure handling (reaper-driven retry / timeout).
//
// Partition key MUST be player_id (same as the originating PlayerMigrationEvent)
// so ACK arrives on the same Kafka partition's downstream — preserving ordering
// with any subsequent migrations of the same player.
message PlayerMigrationAckEvent {
  uint64 player_id = 1;
  uint32 from_zone = 2;   // The source zone that originated the migration.
  uint32 to_zone = 3;     // The destination zone that accepted the player.
  int64 ack_at_ms = 4;    // Wall-clock millis when the ACK was published.
}
