syntax = "proto3";
option go_package = "proto/common/rollback";

// Transaction types — every bidirectional operation that moves items/currency
// between players (or between a player and a system sink) must be logged.
//
// Crash-replay extension (cross-server-rollback-gap-fixes.md §2.4 — B2):
//   The original op set above (1..19) covers transfers and clawbacks.
//   To support PostCrashReplay (replay "additive" operations a player
//   acquired between the last save and a scene-node crash), we also log
//   pure-gain operations 20..23. These are NOT clawback-eligible by
//   themselves — they're recovery records for crash forensics. The
//   replay tool reads them with `since_ms > last_save_ms` and re-applies
//   each via the same module entry point that originally produced them.
//
//   Anti-dup invariant: every replayable op MUST carry a unique tx_id
//   (发号器 txlog 号段的号,见 TransactionLogEntry.tx_id). PostCrashReplay tracks "applied tx_ids" per player so
//   replaying the log twice produces the same end state — see
//   single_player_rollback.md §"Anti-Duplication" for the broader pattern.
enum TransactionType
{
  TX_UNKNOWN = 0;
  TX_TRADE = 1;             // Player-to-player trade
  TX_MAIL_ATTACHMENT = 2;   // Mail with items/currency
  TX_AUCTION_SELL = 3;      // Auction house listing sold
  TX_AUCTION_BUY = 4;       // Auction house purchase
  TX_GUILD_BANK_DEPOSIT = 5;
  TX_GUILD_BANK_WITHDRAW = 6;
  TX_QUEST_REWARD = 7;      // Quest/mission reward grant
  TX_SYSTEM_GRANT = 8;      // Server-side grant (event, compensation)
  TX_GM_GRANT = 9;          // GM tool grant
  TX_GM_DEDUCT = 10;        // GM tool deduction
  TX_SHOP_BUY = 11;         // NPC shop purchase (currency → item)
  TX_SHOP_SELL = 12;        // NPC shop sell (item → currency)
  TX_ITEM_DESTROY = 13;     // Item destroyed / consumed
  TX_CURRENCY_ADD = 14;     // Generic currency gain
  TX_CURRENCY_DEDUCT = 15;  // Generic currency spend
  TX_ROLLBACK_RESTORE = 16; // Item/currency restored via rollback
  TX_CLAWBACK = 17;         // Precision clawback (Bug exploit recovery)
  TX_DEFERRED_CLAWBACK = 18;// Deferred clawback (补缴) auto-deduction
  TX_BATCH_RECALL = 19;     // Batch recall (批量回收) by GM

  // ── Crash-replay-eligible "additive" ops (P1-B / B2) ─────────────────
  //
  // These types log an item / progression gain that the player earned
  // between their last persistence checkpoint and a (possible) scene-node
  // crash. PostCrashReplay re-applies them on the next safe load if the
  // player's last_save_ms is older than the op's timestamp.

  TX_ITEM_AWARD = 20;       // Loot drop / chest open / package open / boss reward.
                            // item_uuid + item_config_id + item_quantity + extra(json) carry
                            // the source ("monster_id":..., "drop_table":...) so replay can
                            // verify the award is still valid (e.g. the boss is still defeated).

  TX_QUEST_COMPLETE = 21;   // Player completed an objective / turned in a quest.
                            // extra(json) carries quest_id + step_id + reward_summary so
                            // replay re-grants rewards if the player's quest record
                            // doesn't yet reflect the completion. Idempotency:
                            // replaying a completed quest is a no-op via tx_id dedup.

  TX_LEVEL_UP = 22;         // Level boundary crossed. Cheap to log, cheap to replay
                            // (level-up handler is idempotent against current XP).
                            // extra(json) carries old_level + new_level + xp_total.

  TX_BUFF_GAIN = 23;        // Long-duration buff gained (>30 min remaining at log time)
                            // that the player would notice missing post-crash. Short
                            // buffs are NOT logged — too high-frequency, low value.
                            // extra(json) carries buff_id + duration_remaining_ms.

  // ── 通用资产通道(docs/design/guild-phase2/04-asset-channel.md §4.3.5)───────
  //
  // 帮会经 SceneNodeGrpc.AssetDebit / AssetCredit 改玩家资产时带上的 tx_type。
  // correlation_id 填帮会侧的 op_id,回档对账靠它把 scene 流水与
  // guild_asset_op 的行对上(§4.31 第 5 步)。只追加,不复用旧编号。

  TX_GUILD_DONATE = 24;           // 帮会捐献扣货币(ASSET_OP_STREAM_GUILD_DEBIT)
  TX_GUILD_SHOP = 25;             // 帮会商店发物(ASSET_OP_STREAM_GUILD_CREDIT)
  TX_GUILD_ACTIVITY_REWARD = 26;  // 帮会活动发奖(ASSET_OP_STREAM_GUILD_CREDIT)

  // ── 装备强化与镶嵌(docs/design/equipment-enhance-inlay.md §3.2)──────────────
  //
  // 三种流水的 correlation_id 都填**装备**的 item guid:宝石是可叠加物品,镶嵌销毁一颗、
  // 取下另铸一颗,item_uuid 的血缘在镶嵌处断开,两条流水靠「装备 guid + 宝石 config +
  // extra 里的 socket」配对。物品流水的 extra(紧凑 JSON):
  //   强化扣材料 {"from":<强化前等级>,"success":true|false};镶嵌 / 取下 {"socket":<孔位号>}。
  // 货币流水不带 extra。流水不带实例数据:强化等级与宝石无法从流水还原。只追加,不复用旧编号。

  TX_EQUIP_ENHANCE = 27;     // 装备强化:扣金币 + 销毁材料(成败都扣)。correlation_id = 装备 item guid
  TX_EQUIP_INLAY = 28;       // 宝石镶嵌:销毁 1 颗宝石物品。correlation_id = 装备 item guid
  TX_EQUIP_GEM_REMOVE = 29;  // 取下宝石:发回 1 颗宝石物品。correlation_id = 装备 item guid

  // ── 聚宝斋退回(数据覆写审计 r2-trade#1)──────────────────────────────────
  //
  // 交易把玩家自己托管的资产还给他:撤单、过期、整单退款、竞价退回,以及它们的人工补发。
  // 资产本来就是这名玩家的,不算新增获得,不受获取封禁约束(C++ GainBlockService::CountsAsGain);
  // 成交所得(交付腿)仍用 TX_AUCTION_BUY,照常判封禁。correlation_id 同其他交易腿。
  TX_AUCTION_RETURN = 30;

  // ── 真钱付款被渠道撤销后的扣回(docs/design/payment-recharge.md §22.6)──────────
  //
  // 官方订单的付款被渠道撤销(用户在 App Store / Google Play 退款、渠道作废)之后,交易服务把这张订单发放的物品或货币
  // 从买家身上扣回(TRADE_DEBIT 流,腿名 official_reverse_<修订号>)。扣不到(已经用掉)由合同转人工,不透支。
  // correlation_id 同其他交易腿。只追加,不复用旧编号。
  TX_PAYMENT_REVERSAL = 31;

  // ── 挂机月卡开通(docs/design/afk-monthly-card.md §4.1)──────────────────────
  //
  // 玩家花灵石开通 / 续费挂机月卡的扣钱流水(scene 内同步扣,不走资产通道)。correlation_id = 那次请求的
  // 客户端幂等键 client_request_id,同一个键至多出现一条。月卡到期时刻不在流水里,在存档 PlayerUint64Comp。只追加,不复用旧编号。
  TX_AFK_PASS_BUY = 32;

  // ── 角色改名(docs/design/rename-and-content-safety.md §4.3)────────────────
  //
  // 改名成功时销毁改名卡的流水。correlation_id = 那次改名的流水号(PlayerProfileComp.rename_seq)。
  // 改名不成时卡只是解除占用、没有离开过背包,不记流水。只追加,不复用旧编号。
  TX_ROLE_RENAME = 33;

  // ── 角色形象永久切换(docs/design/character-appearance-switch.md)────────────
  //
  // 消耗角色形象卡(Item 3402)永久切换角色形象的销毁流水。correlation_id = 客户端幂等键 client_request_id。
  // 1 小时免费试用不消耗道具,不记流水。只追加,不复用旧编号。
  TX_APPEARANCE_SWITCH = 34;

  // ── 赛季印小额快捷追赶(docs/design/season-skills-and-seal-design.md)──────
  //
  // 玩家消耗灵石补齐本季单槽赛季印进度（与免费同封顶上限）的扣款流水。correlation_id = 客户端幂等键 client_request_id。
  // 只追加,不复用旧编号。
  TX_SEASON_SEAL_CATCHUP = 35;

  // ── 五行试炼志里程碑领取与拓印兑换(docs/design/long-term-progression-v2.md)───
  //
  // 一次性试炼志里程碑发放仅自用重铸砂/仅自用法宝拓印，以及消耗拓印定向兑换仅自用法宝的流水。
  // correlation_id = 客户端幂等键 client_request_id。只追加,不复用旧编号。
  TX_TRIAL_JOURNAL_MILESTONE = 36;
  TX_TRIAL_ARTIFACT_REDEEM = 37;

  // ── V1 装备词条品相打磨/重铸、分卷宗技能制书与主城原子代打(docs/design/equipment-quality-and-skill-crafting-v1.md) ──
  TX_EQUIP_POLISH_REFORGE = 38;
  TX_SKILL_SCROLL_CRAFT = 39;
  TX_CRAFT_PROXY_FEE = 40;

  // ── 帮会全天帮战 V2(docs/design/guild-play-v2.md) ──────────────────────────
  // correlation_id = guild_asset_op.op_id。只追加,不复用旧编号。
  TX_GUILD_BOUNTY_ESCROW = 41;  // 发布江湖追杀令预扣银两(ASSET_OP_STREAM_GUILD_DEBIT)
  TX_GUILD_WAR_REWARD = 42;     // 帮战即时银两、周战功里程碑宝箱与灵脉分红(ASSET_OP_STREAM_GUILD_CREDIT)
  TX_GUILD_BOUNTY_PAYOUT = 43;  // 追杀赏金、反杀赏金与过期本金退还(ASSET_OP_STREAM_GUILD_CREDIT)

  // ── 官方灵石百宝阁直购(docs/design/spirit-shop-and-starter-packs-v1.md §2.4) ──
  // 扣灵石与发绑定物品共用同一 correlation_id = client_request_id。只追加,不复用旧编号。
  TX_SPIRIT_SHOP_BUY = 44;

  // ── 游历手记典藏解锁与双轨领奖(docs/design/activity-travel-pass-and-showcase-v1.md §2.4) ──
  // correlation_id = client_request_id。只追加,不复用旧编号。
  TX_TRAVEL_PASS_UNLOCK = 45;
  TX_TRAVEL_PASS_REWARD = 46;
  // 装备流派方案位付费扩容（消耗 3413 装备方案扩容符或扣灵石/绑定灵石，correlation_id = client_request_id）。
  TX_EQUIP_LOADOUT_UNLOCK = 47;
}

// A single transaction log entry.  Written to Kafka → Go DB → MySQL.
// This is the foundation for: rollback diff, precision clawback, audit.
message TransactionLogEntry
{
  // 全服唯一:C++ 从发号器 txlog 号段领的号(GuidKind::kTxLog,经 MixGuid 打散)。不单调、没有位布局,
  // 不能用 ParseSnowflakeGuid 解析,先后看 timestamp。
  uint64 tx_id = 1;
  uint64 timestamp = 2;          // Unix seconds
  TransactionType tx_type = 3;

  // Participants
  uint64 from_player = 4;        // Source player (0 = system)
  uint64 to_player = 5;          // Destination player (0 = system/NPC)

  // Item details (omit if currency-only)
  uint64 item_uuid = 6;          // 物品实例 guid,与 ItemComp.item_id 同源(发号器 item 号段),只当身份用,不能解析
  uint32 item_config_id = 7;     // Item template/config ID
  uint32 item_quantity = 8;      // Stack count

  // Currency details (omit if item-only)
  uint32 currency_type = 9;      // CurrencyType enum value
  int64 currency_delta = 10;     // Positive = gain, negative = spend

  // Balance snapshot at the moment of this transaction
  uint64 balance_before = 11;
  uint64 balance_after = 12;

  // Correlation: links related operations (e.g. both sides of a trade)
  // 成对 / 同一次业务操作的几条流水共用的号,取产生它们的那次操作的 id:资产指令 = 指令里的 correlation_id
  // (帮会即 op_id),战斗结算 = battle_id,神秘商人 = round_id 等。按各自来源解释,不是 SnowFlake,不能解析;0 = 无关联。
  uint64 correlation_id = 13;

  // Free-form metadata (JSON)
  string extra = 14;

  // 捕获时刻所在的 zone(生产者填 GetZoneId())。
  // 消费者(data_service 的 Kafka 落库)必须直接用这个值,不许回查 Router:
  // 玩家的 home_zone 之后可能因合服而改变,回滚审计要的是"事发时在哪个 zone"。
  // 见 docs/design/node-id-overhaul-plan-20260908.md §2.0c 第 1 步。
  uint32 zone_id = 15;
}

// Batch wrapper for Kafka transport.
message TransactionLogBatch
{
  repeated TransactionLogEntry entries = 1;
}
