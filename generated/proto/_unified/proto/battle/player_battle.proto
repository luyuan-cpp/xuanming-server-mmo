syntax = "proto3";
option go_package = "proto/battle";

import "proto/db/proto_option.proto";
import "proto/common/base/tip.proto";
import "proto/common/base/empty.proto";
import "proto/battle/battle_data.proto";

// 本契约只生成普通 Protobuf 消息，不启用 cc_generic_services 或官方 gRPC 服务桩。
// service BattleClientPlayer 与 (OptionFileDefaultNode)=NODE_BATTLE 必须保留:直连面的上行白名单
// (BattleClientPlayer*MessageId)与全部 Notify* 消息号都由它发号,删了会重新发号、打破客户端契约。
// battle 节点不再实现它的 gRPC 服务端(gate 中继已删,turn-based §22 D66/D67)。
option (OptionFileDefaultNode) = NODE_BATTLE;

// 回合制战斗客户端协议(直连收缩后口径,turn-based §22)。
// 上行:只走客户端到 battle 节点的直连(票据握手后 ClientRequest);gate 与路由服一律拒绝本服务的上行。
// 下行(Notify*):战斗帧(TurnResult / BattleEnd / SpectateState / SpectateTurnResult / SpectateEnd)只走直连,
//   无直连即不发;只有直连建立之前的大厅公告 NotifyBattleAssigned / NotifyBattleStart 在无直连时经
//   Kafka gate-cmd 的 PushToPlayerEvent 走大厅连接。scene 发的 NotifyBattleReconnect 与 scene 结算后推的
//   NotifyBattleEnd 也走大厅(scene 自己的下行);客户端两条连接都挂 NotifyBattleEnd,按 battle_id 幂等。
// 观战例外(D94,battle-spectate-tiered-fanout.md §15):WatchBattleResponse.delivery = LOBBY 的观众不建直连,
//   SpectateState / SpectateTurnResult / SpectateEnd 三条观战帧由 gate 经大厅连接下发(gate 中继 / 全服广播档);
//   客户端在大厅连接上也注册这三条;去重时 158 只与 158 比较 round_index,161 不推进水位
//   (161 是结算前的快照,紧接着同回合的 158 必须照常处理)。参战帧仍然只走直连。
// 设计依据:docs/design/turn-based-battle-server.md §5.2、§18、§22。

// ---- 战斗全量状态(开战下发 / 回合后同步 / 重连补拉,v1 全量同步免客户端预测) ----
message BattleStateS2C {
  uint64 battle_id = 1;
  uint32 round_index = 2;                 // 当前回合序号,从 1 开始
  repeated BattleActorState actors = 3;
  uint64 action_deadline_ms = 4;          // 本回合行动提交截止(Unix 毫秒)
  eBattleOutcome outcome = 5;
  repeated uint64 pending_actor_ids = 6;  // 尚未提交行动的单位
  // 收信人本人的剩余战斗道具(item_table_id → 剩余个数,按 id 升序)。
  // 只在发给本人的那一份里填,观众与其他参战者收到的恒为空 —— 道具余量是私有信息。
  // 有了它,客户端重连补拉后不再对"已经用掉几个"一无所知(原先只能靠累计回合事件推算)。
  repeated BattleItemEntry self_items = 7;
}

message BattleStartS2C {
  uint64 battle_id = 1;
  BattleStateS2C state = 2;
}

message TurnResultS2C {
  uint64 battle_id = 1;
  uint32 round_index = 2;                 // 本次结算的回合序号
  repeated BattleEventItem events = 3;    // 按结算顺序播表现
  BattleStateS2C state = 4;               // 结算后权威状态
  repeated uint64 action_order = 5;  // 本回合按速度排定的出手序(actor_id;含被跳过者),演出"行动预告条"用
}

// scene 在结算随存档确认提交之后推。客户端没有这一局的战斗上下文时(断线清了上下文、重登才应用)不要丢弃,
// 改为查 SceneBattleResultClientPlayer.GetRecentBattleResults 补看胜负与奖励(docs/design/battle-result-recovery.md §7)。
message BattleEndS2C {
  uint64 battle_id = 1;
  eBattleOutcome outcome = 2;
  BattleSettlementData settlement = 3;    // 收信玩家本人视角
  // 本局掉落放不进人物背包与临时背包,整批改由邮件发放(docs/design/battle-overflow-mail.md):结算屏提示去邮箱领取。
  // 与 PlayerBattleResult.items_mailed 同一个事实,取自这一局的近期结果。
  bool items_mailed = 4;
}

// 重连提示:scene 在换会话(RECONNECT / REPLACE)或登录重建出 FIGHTING 冻结时经大厅推送;
// 客户端凭 battle_id 经 MatchService.RequestBattleTicket 补签、重建直连,直连就绪后 GetBattleState 补拉
message BattleReconnectS2C {
  uint64 battle_id = 1;
}

// ---- 观战 S2C(二期,设计文档 §10) ----
// 观众入场首帧:全量状态复用 BattleStateS2C(BuildStateSnapshot 同源,action_deadline_ms
// 由 battle 节点按房间 timer 回填)。观众与参战者用不同的消息号,客户端两套状态机互不干扰。
// 首帧在观众直连握手成功后紧跟握手应答经直连下发(snapshot on connect,turn-based §22 D69)。
message SpectateStateS2C {
  BattleStateS2C state = 1;
  uint32 observer_count = 2;       // 当前观众数(含收信者)
}

// 观战结束原因(枚举首值必须 0,宪法 §4)
enum eSpectateEndReason {
  SPECTATE_END_NONE = 0;
  SPECTATE_END_BATTLE_FINISHED = 1;  // 战斗正常分出胜负
  SPECTATE_END_BATTLE_ABORTED = 2;   // 战斗作废(节点停机/deadline 强制收尾)
  SPECTATE_END_REMOVED = 3;          // 观众被移除(自己去排队/开战导致互斥清退)
  // 中继 / 广播档(大厅连接收帧)由 gate 本地收尾:源站 battle 失联或过了战斗期限仍无终局帧。
  // 旧客户端不认识本值时按 BATTLE_ABORTED 处理(battle-spectate-tiered-fanout.md §15.2)。
  SPECTATE_END_SOURCE_LOST = 4;
}

message SpectateEndS2C {
  uint64 battle_id = 1;
  eBattleOutcome outcome = 2;        // 结束时胜负(作废时为 ONGOING)
  eSpectateEndReason reason = 3;
}

// ---- 上行 ----
message SubmitBattleActionRequest {
  uint64 battle_id = 1;
  BattleAction action = 2;
}

message SubmitBattleActionResponse {
  TipInfoMessage error_message = 1;
}

message GetBattleStateRequest {
  uint64 battle_id = 1;
}

// 退出观战(观众主动;经观战直连发到 battle 节点)
message StopWatchBattleRequest {
  uint64 battle_id = 1;
}

message StopWatchBattleResponse {
  TipInfoMessage error_message = 1;
}

// 自动战斗开关(参战者;开启后本人回合视为已就绪,由引擎按默认行动出手)
message SetAutoBattleRequest {
  uint64 battle_id = 1;
  bool enabled = 2;
}

message SetAutoBattleResponse {
  TipInfoMessage error_message = 1;
}

// ==== 客户端直连 battle 节点(设计文档 turn-based-battle-server.md §18,D23-D28)====
//
// 大厅一条连接(gate),战斗另一条连接(直连 battle 节点 TCP 端口,票据入场)。
// 线协议与 gate 客户端面完全一致:ProtobufCodec 帧,上行 ClientRequest,下行 MessageContent。
// 握手首包必须是 BattleTokenVerifyRequest,验签通过前 battle 节点丢弃并断开一切其它消息。

// 票据角色(枚举首值必须 0,宪法 §4)
enum eBattleTicketRole {
  BATTLE_TICKET_ROLE_NONE = 0;
  BATTLE_TICKET_ROLE_PARTICIPANT = 1;  // 参战者
  BATTLE_TICKET_ROLE_OBSERVER = 2;     // 观众
}

// 票据载荷:battle 节点在 CreateBattle / AddObserver 登记之前预签(签不出即拒绝,turn-based §22 D70;HMAC-SHA256,
// 密钥 BaseDeployConfig.battle_token_secret,全部 battle 实例共享,与 gate 令牌密钥分域)。
// 签名 = hex(HMAC-SHA256(secret, 序列化后的本消息字节)),形态与 GateTokenPayload 一致。
// 寿命 = 房间作废期限(D25):同一票可重复用于战斗中重连;房间销毁即失效。
message BattleTicketPayload {
  uint64 battle_id = 1;
  uint64 player_id = 2;
  uint32 battle_node_id = 3;        // 签发节点 node_id,验签侧必须等于自身
  string battle_instance_id = 4;    // 签发节点实例 UUID(node_uuid),防节点重启后 node_id 复用
  uint64 expire_at_ms = 5;          // Unix 毫秒;与房间 deadline_ms 同值
  eBattleTicketRole role = 6;
  string spectator_operation_id = 7; // 观众原准入UUID，验签后仍须与房内当前operation相同。
}

// 直连握手首包(客户端 → battle 节点)。
message BattleTokenVerifyRequest {
  bytes payload = 1;     // 序列化的 BattleTicketPayload
  bytes signature = 2;   // hex 文本形式的 HMAC-SHA256(与 ClientTokenVerifyRequest 同口径)
}

// 握手应答(battle 节点 → 客户端)。失败时 battle 节点随后主动断开。
// 心跳两项与 gate 的 ClientTokenVerifyResponse 同义同值(docs/design/gate-client-heartbeat.md §14):成功时填,
// 客户端收到非 0 的间隔就要在这条直连上立即发第一条 ClientHeartbeatRequest、之后每个间隔一条;
// battle 从发出本应答起,连续 heartbeat_timeout_ms 收不到这条直连的任何一帧就断开它。
message BattleTokenVerifyResponse {
  bool success = 1;
  string error = 2;       // 失败原因(非敏感,可直接展示 / 记日志)
  uint64 battle_id = 3;   // 成功时回填,客户端据此把连接与本地战斗状态机对上
  uint32 heartbeat_interval_ms = 4;  // 客户端在本直连上每隔这么久发一条 ClientHeartbeatRequest;0 = 这台 battle 不支持心跳,不发
  uint32 heartbeat_timeout_ms = 5;   // battle 连续这么久收不到本直连任何一帧就断开;客户端同样按它判 battle 已死
}

// 落点分配(battle 节点 → 客户端,大厅公告:无直连时经大厅通道 Kafka gate-cmd 推送;D26):
// 收到后客户端向 host:port 建第二条 TCP 连接并以票据握手。
// CreateBattle 成功后每参战者先收本消息再收 BattleStartS2C(同 key 保序);
// 观众 AddObserver 成功后只收本消息,SpectateStateS2C 首帧在直连握手成功后经直连下发(turn-based §22 D69)。
message BattleAssignedS2C {
  uint64 battle_id = 1;
  // battle 客户端可达地址(NodeInfo.client_endpoint,缺省回落 endpoint;集群外入口 D76/D78)。
  // host 可以是 IPv4 字面量或 DNS 名;port 可能是 hostPort / Agones 分配端口,与 endpoint.port 不同。
  string host = 2;
  uint32 port = 3;
  bytes token_payload = 4;     // 序列化的 BattleTicketPayload,原样放进 BattleTokenVerifyRequest.payload
  bytes token_signature = 5;   // 原样放进 BattleTokenVerifyRequest.signature
  uint64 expire_at_ms = 6;     // 票据 / 房间作废期限(Unix 毫秒)
  eBattleTicketRole role = 7;
}

// 客户端丢票(冷启动 / 换设备)时经大厅通道补签(D25)。请求 / 响应由 MatchService.RequestBattleTicket
// 使用(match → BattleNode.IssueBattleTicket);gate 收成只连路由服后不再直连 battle,补签不再挂在本服务下。
// 仅当该玩家仍是 battle_id 房间的参战者或观众时才签;否则 error_message 非零且 assignment 为空。
message RequestBattleTicketRequest {
  uint64 battle_id = 1;
}

message RequestBattleTicketResponse {
  TipInfoMessage error_message = 1;
  BattleAssignedS2C assignment = 2;
}

service BattleClientPlayer {
  option (OptionIsClientProtocolService) = true;

  rpc SubmitBattleAction (SubmitBattleActionRequest) returns (SubmitBattleActionResponse);
  rpc GetBattleState (GetBattleStateRequest) returns (BattleStateS2C);
  rpc NotifyBattleStart (BattleStartS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc NotifyTurnResult (TurnResultS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc NotifyBattleEnd (BattleEndS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc NotifyBattleReconnect (BattleReconnectS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }

  // ---- 二期:观战 + 自动战斗(设计文档 §10/§11) ----
  rpc StopWatchBattle (StopWatchBattleRequest) returns (StopWatchBattleResponse);
  rpc SetAutoBattle (SetAutoBattleRequest) returns (SetAutoBattleResponse);
  rpc NotifySpectateState (SpectateStateS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc NotifySpectateTurnResult (TurnResultS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc NotifySpectateEnd (SpectateEndS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }

  // ---- 客户端直连(设计文档 §18):落点分配推送;丢票补签见 MatchService.RequestBattleTicket ----
  rpc NotifyBattleAssigned (BattleAssignedS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
}

// ==== 战报回放(docs/design/battle-report-replay.md)====
// 只追加消息、不加 RPC,不影响 BattleClientPlayer 的发号。battle 负责录制与压缩,
// match 负责存取(MatchService.ListBattleReports / GetBattleReport)。

// 回放正文的编码(枚举首值必须 0)
enum eBattleReplayCodec {
  BATTLE_REPLAY_CODEC_NONE = 0;  // 未压缩。v1 不产出,留给「match 解压后下发」
  BATTLE_REPLAY_CODEC_GZIP = 1;  // RFC 1952。v1 只产出这一种
}

// 战斗怎么结束的
enum eBattleReplayEndReason {
  BATTLE_REPLAY_END_UNSPECIFIED = 0;
  BATTLE_REPLAY_END_FINISHED = 1;       // 引擎分出胜负(含回合打满判负、全员逃跑)
  BATTLE_REPLAY_END_DEADLINE_DRAW = 2;  // 整场期限到,battle 节点强制判平;最后没有回合帧,看 final_state
}

// 解码后的回放正文。所有帧都是观众视角,与 NotifySpectate* 下发的逐字段相同:
// 不带任何人的冷却、道具余量和装备概率。
message BattleReplay {
  uint64 battle_id = 1;
  uint32 match_mode = 2;               // CreateBattleRequest.match_mode
  uint32 battle_config_id = 3;
  uint64 started_at_ms = 4;            // CreateBattleRequest.created_at_ms(Unix 毫秒)
  uint64 finished_at_ms = 5;           // 与 BattleResultEvent.finished_at_ms 同值
  eBattleOutcome outcome = 6;
  eBattleReplayEndReason end_reason = 7;
  uint32 total_rounds = 8;             // 引擎结算过的回合数(BattleResultEvent.total_rounds)
  string table_fingerprint = 9;        // 录制节点的战斗配表指纹
  BattleStateS2C start_state = 10;     // 开战状态(action_deadline_ms 为 0,pending_actor_ids 为空)
  repeated TurnResultS2C rounds = 11;  // 按回合序;每帧带结算后的全量状态,可以从任一回合开始播
  BattleStateS2C final_state = 12;     // 只在 DEADLINE_DRAW 时填:强制结束那一刻的状态
  bool truncated = 13;                 // 超过录制上限,rounds 只录到截断前
}

// 回放的外壳:battle → match 提交、match 存库、match → 客户端下发都用它。
message BattleReplayEnvelope {
  uint32 format_version = 1;  // BattleReplay 的格式版本,v1 = 1;客户端不认识就提示升级
  eBattleReplayCodec codec = 2;
  uint32 raw_bytes = 3;       // 解码后 BattleReplay 的字节数;解压出来超过它或超过 1 MiB 就判坏
  bytes payload = 4;          // codec 编码后的 BattleReplay
}
