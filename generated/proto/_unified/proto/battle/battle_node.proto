syntax = "proto3";
option go_package = "proto/battle";

import "proto/db/proto_option.proto";
import "proto/common/base/tip.proto";
import "proto/common/base/empty.proto";
import "proto/battle/battle_data.proto";
import "proto/battle/player_battle.proto";

// 注意:不能加 cc_generic_services(与 grpc_cpp_plugin 冲突,先例见 proto/scene_manager/scene_node_service.proto);
// battle 节点是纯 gRPC 服务,C++ 侧消费 battle_node.grpc.pb.h 的 BattleNode::Service。
option (OptionFileDefaultNode) = NODE_BATTLE;

// battle 节点内部 gRPC 契约(match 服务调用)。
// battle_id 由 match 服务用 shared/snowflake(17-bit worker 布局)生产,是该 ID 的唯一生产者
// (SnowFlake 节点隔离不变量,宪法 §7)。
// 设计依据:docs/design/turn-based-battle-server.md §3.1、§5.4。

message CreateBattleRequest {
  uint64 battle_id = 1;
  uint32 battle_config_id = 2;             // DungeonTable id(怪物组/回合上限来源)
  repeated BattlePlayerSnapshot players = 3;
  uint64 seed = 4;                         // 确定性 RNG 种子(match 生成)
  uint32 match_mode = 5;                   // MatchMode 数值(PVE/PVP 区分,决定逃跑等规则)
  uint64 created_at_ms = 6;                // Unix 毫秒
  uint64 deadline_ms = 7;                  // 战斗最长期限,超时 battle 强制平局收尾
  string table_fingerprint = 8;            // match 确认的全员一致指纹;battle 与自身指纹不一致按配置拒开局/告警
}

message CreateBattleResponse {
  uint64 battle_id = 1;
  TipInfoMessage error_message = 2;
}

message DestroyBattleRequest {
  uint64 battle_id = 1;
  string reason = 2;   // 补偿路径记录用(gather 回滚 / 管理指令)
}

// ---- 二期:观战(match → battle,设计文档 §10) ----
// 观众路由只填 session/gate/zone 字段(scene 字段留 0:观众无结算,battle 不会
// 向观众的 scene 发任何事件);match 从 player:session:{id} 组装。
message AddObserverRequest {
  uint64 battle_id = 1;
  uint64 observer_player_id = 2;
  BattleRouting routing = 3;
  string observer_name = 4;   // 日志/后续观众列表展示用
}

message AddObserverResponse {
  TipInfoMessage error_message = 1;  // 房间不存在/观众已满/观众是参战者
}

message RemoveObserverRequest {
  uint64 battle_id = 1;
  uint64 observer_player_id = 2;
  string reason = 3;   // 日志用(玩家去排队被互斥清退等)
}

// ---- 票据补签(match → battle;client-rpc-router.md / turn-based-battle-server.md §18 D25) ----
// 客户端丢票经大厅会话调 MatchService.RequestBattleTicket,match 定位房间所在 battle 节点后调本 RPC。
// 仅当 player_id 仍是该房间的参战者或观众时才签;否则 error_message 非零且 assignment 为空。
// 内部 RPC:player_id 由 match 从会话 metadata 取得后填入,battle 只核对名单不再鉴权。
message IssueBattleTicketRequest {
  uint64 battle_id = 1;
  uint64 player_id = 2;
}

message IssueBattleTicketResponse {
  TipInfoMessage error_message = 1;
  BattleAssignedS2C assignment = 2;
}

service BattleNode {
  rpc CreateBattle (CreateBattleRequest) returns (CreateBattleResponse);
  rpc DestroyBattle (DestroyBattleRequest) returns (Empty);
  rpc AddObserver (AddObserverRequest) returns (AddObserverResponse);
  rpc RemoveObserver (RemoveObserverRequest) returns (Empty);
  rpc IssueBattleTicket (IssueBattleTicketRequest) returns (IssueBattleTicketResponse);
}
