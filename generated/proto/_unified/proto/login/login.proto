syntax = "proto3";

option go_package = "proto/login";

import "proto/db/proto_option.proto";
import "proto/common/base/tip.proto";
import "proto/common/base/user_accounts.proto";
import "proto/common/base/common.proto";

package loginpb;

message LoginSessionInfo {
  string account = 1;
  uint64 role_id = 2;
  uint32 session_id = 3;
  uint64 gate_id = 4;
  string device_id = 5;
  int64 login_time = 6;
}

message AccountSimplePlayerWrapper
{
  AccountSimplePlayer player = 1;
}

message LoginRequest
{
  string account = 1;
  string password = 2;
  string auth_type = 3;   // Auth provider type: "password" (default), "wechat", "qq", "netease", "satoken"
  string auth_token = 4;  // Third-party auth code/token (used when auth_type is not "password")
}

message LoginResponse
{
  TipInfoMessage error_message = 1;
  repeated AccountSimplePlayerWrapper players = 2;
  string access_token = 3;           // Opaque access token (2h TTL), use as auth_type="access_token" for reconnect
  string refresh_token = 4;          // Opaque refresh token (30d TTL), use RefreshToken RPC to renew
  int64 access_token_expire = 5;     // Unix seconds when access_token expires
  int64 refresh_token_expire = 6;    // Unix seconds when refresh_token expires
}

message TestResponse
{
  TipInfoMessage error_message = 1;
  repeated AccountSimplePlayerWrapper players = 2;
  repeated string teststring = 3;
  repeated int32 testint = 4;
}

message CreatePlayerRequest
{
  uint32 class_id = 1;  // 职业(Class 配表 id);0 = 兼容旧客户端,取配表第一个职业
  uint32 gender = 2;    // 1=男 2=女;0 = 兼容旧客户端,默认 1
  // 角色名。正式客户端建角界面必填(长度 / 字符集按 RoleNameRule 配表,当前 2–12 字);
  // 空串 = 服务端生成「前缀 + 随机后缀」,只服务机器人与无 UI 的调试路径。
  // 名字全服唯一,真源是 data_service 的 player_name 表:login 先 ReservePlayerName
  // 成功再建角(fail-closed),建角失败走 ReleasePlayerName 补偿。
  // 见 docs/design/guild-phase2/03-names.md §3.9 / §3.11。
  string name = 3;
  // 稳定人物资源 ID，独立于职业/性别；空值兼容旧客户端的外观映射。
  string appearance_id = 4;
}

message CreatePlayerResponse
{
  TipInfoMessage error_message = 1;
  repeated AccountSimplePlayerWrapper players = 2;
}

message EnterGameRequest
{
  uint64 player_id  = 1;

  // Client-generated idempotent request ID (must reuse for retries of the same request)
  string request_id = 2;
}

message EnterGameResponse
{
  TipInfoMessage error_message = 1;
  uint64 player_id  = 2;

  // 3 / 4 是合服一次性提示:合服不再碰玩家数据,这两个字段没有来源,已删除。
  reserved 3, 4;
}

message LeaveGameRequest
{
}

message LoginNodeDisconnectRequest
{
  // 只做一致性核对:login 以 gate 签名的会话头 SessionDetails.session_id 为准,这里填了且与会话头不同就整条拒绝
  // (InvalidArgument)。gate 合成时填同一个值;0 = 没填,按会话头处理(docs/design/client-request-ordering.md §6.2)。
  uint32 session_id = 1;
}

message LoginEmptyResponse
{
}

message RefreshTokenRequest
{
  string refresh_token = 1;  // Current refresh token
}

message RefreshTokenResponse
{
  TipInfoMessage error_message = 1;
  string access_token = 2;           // New access token
  string refresh_token = 3;          // Rotated refresh token (old one is invalidated)
  int64 access_token_expire = 4;     // Unix seconds when new access_token expires
  int64 refresh_token_expire = 5;    // Unix seconds when new refresh_token expires
}

// gate 排空时为本连接要一张去同 zone 另一台 gate 的票据(docs/design/gate-drain-session-migration.md §4.4)。
// 只有 gate 合成,客户端不得发起。身份全在 gate 签名的 SessionDetails 里:游戏中的连接带 player_id,
// 停在选角界面的连接 player_id 为 0。
message GateMigrationRequest
{
}

// 签票结果。首值 0 按失败处理(proto3 enum 首值必须是 0)。
enum GateMigrationResult
{
  GATE_MIGRATION_RESULT_UNSPECIFIED = 0;
  GATE_MIGRATION_RESULT_OK = 1;            // 已签票,下面五个字段有效
  GATE_MIGRATION_RESULT_NOT_DRAINING = 2;  // 调用方 gate 不是本 zone 正在排空的 gate:gate 停止本轮迁移
  GATE_MIGRATION_RESULT_NO_TARGET = 3;     // 同 zone 没有合格的目标 gate(不回落):这个连接留在原地,稍后再试
  GATE_MIGRATION_RESULT_DISABLED = 4;      // login 上 GateDrain.Migrate.Enabled 为 false:gate 停止本轮迁移
}

// 字段与 RedirectToGateEvent 同名同型:gate 用同一段代码推 msg 124。
// 票据 GateTokenPayload 的 target_zone_id 恒为 0:到达时的 EnterGame 走租约内重连,scene_manager 派回原场景。
message GateMigrationResponse
{
  GateMigrationResult result = 1;
  string target_gate_ip = 2;    // 目标 gate 的客户端可达地址(clientendpoint.Select 的结果)
  uint32 target_gate_port = 3;
  bytes  token_payload = 4;     // 序列化的 GateTokenPayload
  bytes  token_signature = 5;   // HMAC-SHA256 签名(小写 hex)
  int64  token_deadline = 6;    // 票据到期时刻,Unix 秒
}

// gate 为仍然连着的连接续租它在 login 的按连接记录(docs/design/gate-online-identity.md §10.4):
// 登录态、账号设备集里的成员、已绑定角色的会话栅栏。这些记录的寿命只是「连接断了、Disconnect 又没送到」时的回收兜底,
// 不该比活着的连接先到期。只有 gate 合成,客户端不得发起;连接身份全在 gate 签名的 SessionDetails 里,请求体为空。
message RenewSessionRequest
{
}

message RenewSessionResponse
{
  // true = 这条连接在 login 还有记录(登录态,或已绑定的角色),已续期。
  // false = 已没有可续的记录(离开游戏之后、连接已按断线处理、或记录已过期):gate 停止为它续租,直到这条连接再次登录成功。
  bool renewed = 1;
  // 下一次续租的间隔(秒)。login 按登录态寿命的三分之一给出,gate 不另配寿命;renewed 为 false 时为 0。
  uint32 renew_after_seconds = 2;
}

service ClientPlayerLogin  {
  option (OptionIsClientProtocolService) = true;

  rpc Login (LoginRequest) returns (LoginResponse);
  rpc CreatePlayer (CreatePlayerRequest) returns (CreatePlayerResponse);
  rpc EnterGame (EnterGameRequest) returns (EnterGameResponse);
  rpc LeaveGame (LeaveGameRequest) returns (LoginEmptyResponse);
  rpc Disconnect (LoginNodeDisconnectRequest) returns (LoginEmptyResponse) { option (OptionClientRpcKind) = CLIENT_RPC_SERVER_ONLY; }
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse);
  // gate 排空时为本连接签迁移票据。与 Disconnect 一样只有 gate 合成,客户端发这个号要被 gate 按非法包拒收
  // (gate 侧 login_admission.h IsGateSynthesizedOnly,随迁移的 gate 批次加入)。
  rpc RequestGateMigration (GateMigrationRequest) returns (GateMigrationResponse) { option (OptionClientRpcKind) = CLIENT_RPC_SERVER_ONLY; }
  // gate 为仍然连着的连接续租登录态。同样只有 gate 合成,客户端发这个号被 gate 按非法包拒收(login_admission.h IsGateSynthesizedOnly)。
  rpc RenewSession (RenewSessionRequest) returns (RenewSessionResponse) { option (OptionClientRpcKind) = CLIENT_RPC_SERVER_ONLY; }
}

// ── Pre-connection RPCs (called before connecting to Gate) ──────

message AssignGateRequest {
  uint32 zone_id = 1;
  // Re-entry by a client already in the queue: server validates the token,
  // skips capacity check, and returns the current rank (or admit token if
  // dispatcher already promoted this entry). Empty on first call.
  string queue_token = 2;
  // 3 是客户端自报的 account,2026-11-12 删除:它没有经过鉴权,报出别人的账号名就能免排队、冒用排队身份。
  // 账号现在只从 access_token 解出。
  reserved 3;
  reserved "account";
  string device_id = 4;
  // /api/login 签发的 access token。login 用它鉴权并解出账号,免排队判定(已有在线会话)与排队身份都只认这个账号。
  // 不带(排队重入带 queue_token 的除外)= 匿名分配,只在旧 gate 凭据登录还开着(LegacyGateLoginEnabled)时允许;
  // 带了却无效回 status=4。
  string access_token = 5;
}

// AssignGateStatus mirrors AssignGateResponse.status / QueryQueueStatusResponse.status.
// Kept as raw uint32 in the messages for lite-runtime compatibility, documented here.
//   0 = ADMITTED  (gate token populated; client connects to gate)
//   1 = QUEUEING  (queue_token + queue_rank populated; client polls QueryQueueStatus)
//   2 = ERROR     (error field populated)
//   3 = EXPIRED   (queue_token expired or unknown — client must restart from /assign-gate)
//   4 = UNAUTHENTICATED (AssignGate only: access_token invalid, or missing while anonymous assignment is off —
//                        client must log in again; never returned by QueryQueueStatus)

message AssignGateResponse {
  string ip = 1;
  uint32 port = 2;
  bytes token_payload = 3;    // serialized GateTokenPayload — pass to ClientTokenVerifyRequest.payload
  bytes token_signature = 4;  // HMAC-SHA256 signature — pass to ClientTokenVerifyRequest.signature
  int64 token_deadline = 5;   // unix seconds when token expires (informational for client)
  string error = 6;           // non-empty on failure (no gate available, etc.)

  // Queue protocol (added 2026-05). status=0 means the legacy fields above
  // are populated and the client connects directly. status=1 means the client
  // is in the queue and must poll QueryQueueStatus.
  uint32 status = 7;
  string queue_token = 8;     // opaque token, present when status=1
  uint32 queue_rank = 9;      // 0-based position; 0 = "you are next"
  uint32 queue_total = 10;    // total queue length for this zone (for UI)
  uint32 retry_after_ms = 11; // suggested poll interval (e.g. 2000)
}

message QueryQueueStatusRequest {
  string queue_token = 1;
}

message QueryQueueStatusResponse {
  uint32 status = 1;          // 0=ADMITTED, 1=QUEUEING, 3=EXPIRED
  // status=0: gate token (same shape as AssignGateResponse)
  string ip = 2;
  uint32 port = 3;
  bytes token_payload = 4;
  bytes token_signature = 5;
  int64 token_deadline = 6;
  // status=1
  uint32 queue_rank = 7;
  uint32 queue_total = 8;
  uint32 retry_after_ms = 9;
  // status=3 or any error
  string error = 10;
}

service LoginPreGate {
  // Login picks a Gate for the given zone (two random choices on the reported
  // player counts, skipping gates that stopped rewriting their registration or
  // sit at 90% of their max_connections; see
  // docs/design/gate-load-balancing-design.md), signs a one-time
  // HMAC token. Client TCP-connects to the assigned gate and sends the
  // token as a ClientTokenVerifyRequest (first message after connect).
  //
  // When the zone is over capacity, AssignGate enqueues the caller and
  // returns status=QUEUEING with a queue_token. The client then polls
  // QueryQueueStatus until it receives a gate token.
  rpc AssignGate (AssignGateRequest) returns (AssignGateResponse);
  rpc QueryQueueStatus (QueryQueueStatusRequest) returns (QueryQueueStatusResponse);
  // 本区一共建过多少角色(转问 data_service.CountZoneRoles)。网关里每个区的负责副本按区服目录的角色上限
  // (zone_config.role_capacity)定时来问,到了就关上本区的创角开关(docs/design/zone-full-handling.md §6)。只读,可重试。
  rpc GetZoneRoleCount (ZoneRoleCountRequest) returns (ZoneRoleCountResponse);
}

message ZoneRoleCountRequest {
  // 必须是本 login 所在的区,否则回 InvalidArgument:网关按区选路,问到别区的 login 是选路错了,不能拿别区的数开关本区。
  uint32 zone_id = 1;
}

message ZoneRoleCountResponse {
  uint64 roles = 1; // 按合服之后的最终区算,删角不减;读不到时回 Unavailable,不回 0
}

// ── Admin-only RPCs (internal, not client-facing) ──────────────

// 孤儿 = 目录里有归属、路由还在、player_store 里没有写权行的角色:进不了场,白占账号的角色名额。
// 墓碑不可逆,所以证明不了是孤儿的回 NOT_ORPHAN,什么都不改。
enum RemovePlayerOutcome {
  REMOVE_PLAYER_UNSPECIFIED = 0;
  REMOVE_PLAYER_REMOVED = 1;     // 已写墓碑,或 dry_run 时确认可以摘
  REMOVE_PLAYER_NOT_FOUND = 2;   // 目录里没有,或已经删过了
  REMOVE_PLAYER_NOT_ORPHAN = 3;  // 有存档,或者路由缺失证明不了
  REMOVE_PLAYER_CONFLICT = 4;    // 有未结束的业务(资产指令、帮会、组队),或归属变了,或还在线。令牌已清,处理掉再重跑
  REMOVE_PLAYER_RETRY = 5;       // 这次没做完(读失败、参与者不可达、本次预算用完),同参数重跑。重跑幂等
}

message RemovePlayerResult {
  uint64 player_id = 1;
  RemovePlayerOutcome outcome = 2;
}

message RemovePlayersFromAccountsRequest {
  repeated uint64 player_ids = 1; // 候选孤儿,一次最多 100 个
  string operator = 2;            // 必填,≤ 64 字节
  string reason = 3;              // 必填,≤ 256 字节
  bool dry_run = 4;               // true = 只核对,不写墓碑
}

message RemovePlayersFromAccountsResponse {
  uint32 removed_count = 1;    // 已写墓碑(dry_run 时是可以摘的个数)
  uint32 not_found_count = 2;  // 目录里没有,或已经删过了
  uint32 failed_count = 3;     // CONFLICT + RETRY,看 results
  uint32 not_orphan_count = 4;
  repeated RemovePlayerResult results = 5; // 按请求去重后的顺序
}

service LoginAdmin {
  // 摘孤儿角色:走目录的删角流程(data_service.RemoveAccountRoles,全部参与者通过才写墓碑)。
  // 只给运维工具用,要 x-admin-token;login 没配 AdminToken 就停用。名字由 data_service 在墓碑提交之后释放
  // (删角收尾,docs/design/guild-phase2/03-names.md §3.4a),这里不用另外调 ReleasePlayerName。
  rpc RemovePlayersFromAccounts (RemovePlayersFromAccountsRequest) returns (RemovePlayersFromAccountsResponse);
}
