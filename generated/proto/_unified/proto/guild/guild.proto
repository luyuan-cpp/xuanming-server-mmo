syntax = "proto3";
package guildpb;

option go_package = "proto/guild";

import "proto/db/proto_option.proto";
import "proto/common/base/tip.proto";
import "proto/common/base/empty.proto";

// ── Guild basic data ─────────────────────────────────────────────

message GuildMember {
  uint64 player_id            = 1;
  uint32 role                 = 2;  // 0=成员 1=长老 3=帮主(2 不启用);权限比较一律走 go/guild constants.Rank
  uint64 join_time_ms         = 3;
  uint64 last_active_ms       = 4;
  // 5 号原为 contribution,2026-09 拆成 total / balance 两个字段。
  // 开发期本可直接复用 5 号,但 reserved 更安全:它让"后续批次误用 5 号"在
  // protoc 阶段就报错,而不是等旧客户端按新语义解出一个看似合法的数字。
  reserved 5;
  bool   online               = 6;  // 是否在线(读 player:session,不入库)
  string name                 = 7;  // 展示名(不入库;B3b 起由 data_service BatchGetPlayerName 填,B2 恒空)
  uint64 contribution_total   = 8;  // 累计帮贡,只增(B5 起写入)
  uint64 contribution_balance = 9;  // 可消费帮贡(B5 起写入)
}

message GuildInfo {
  uint64 guild_id       = 1;
  string name           = 2;
  uint64 leader_id      = 3;
  uint32 level          = 4;
  string announcement   = 5;
  uint64 create_time_ms = 6;
  uint32 max_members    = 7;
  repeated GuildMember members = 8;  // 按 player_id 升序(B1 起 ORDER BY player_id)
  uint32 zone_id        = 9;  // Zone this guild belongs to
  uint64 funds                      = 10;  // 帮会资金(B5 起写入)
  uint32 max_officers               = 11;  // GuildLevel[level].max_officers
  uint32 officer_count              = 12;  // members 中 role=1 的人数
  uint64 upgrade_cost_funds         = 13;  // GuildLevel[level].upgrade_cost_funds;0 = 满级
  string leader_name                = 14;  // 展示用(B3b 填,B2 恒空)
  // pending_application_count 只对本帮长老 / 帮主非 0:待审数量是管理侧信息,
  // 对普通成员与外人一律回 0,不把帮会内部状态泄给任意查询者。
  uint32 pending_application_count  = 15;
}

// ── Request/Response ────────────────────────────────────────────────

message CreateGuildRequest {
  uint64 player_id = 1;
  string name      = 2;
  uint32 zone_id   = 3;  // Zone where the guild is created
}

message CreateGuildResponse {
  TipInfoMessage error_message = 1;
  GuildInfo guild = 2;
}

message GetGuildRequest {
  uint64 guild_id = 1;
}

message GetGuildResponse {
  TipInfoMessage error_message = 1;
  GuildInfo guild = 2;
}

message GetPlayerGuildRequest {
  uint64 player_id = 1;
}

message GetPlayerGuildResponse {
  TipInfoMessage error_message = 1;
  GuildInfo guild = 2;
}

message LeaveGuildRequest {
  uint64 player_id = 1;
}

message LeaveGuildResponse {
  TipInfoMessage error_message = 1;
}

message DisbandGuildRequest {
  uint64 player_id = 1;
}

message DisbandGuildResponse {
  TipInfoMessage error_message = 1;
}

message SetAnnouncementRequest {
  uint64 guild_id     = 1;
  uint64 player_id    = 2;
  string announcement = 3;
}

message SetAnnouncementResponse {
  TipInfoMessage error_message = 1;
  GuildInfo guild = 2;  // 成功时为提交前事务内读到的权威快照(含新公告)
}

// ── 成员管理(B2)────────────────────────────────────────────────
// 以下请求都不带 player_id:操作者一律取 gate 会话,无会话的内部调用直接拒绝
// (go/guild/internal/logic)。把操作者放进请求体等于让客户端自报身份。

message SetGuildMemberRoleRequest {
  uint64 target_player_id = 1;
  uint32 role             = 2;  // 只允许 0(成员)/ 1(长老)
}
message SetGuildMemberRoleResponse {
  TipInfoMessage error_message = 1;
  GuildInfo guild = 2;  // 成功时为提交后的权威快照
}

message KickGuildMemberRequest {
  uint64 target_player_id = 1;
}
message KickGuildMemberResponse {
  TipInfoMessage error_message = 1;
  GuildInfo guild = 2;
}

message TransferGuildLeaderRequest {
  uint64 target_player_id = 1;
}
message TransferGuildLeaderResponse {
  TipInfoMessage error_message = 1;
  GuildInfo guild = 2;
}

// ── 入帮申请(B2)────────────────────────────────────────────────

message ApplyJoinGuildRequest {
  uint64 guild_id = 1;
}
message ApplyJoinGuildResponse {
  TipInfoMessage error_message = 1;  // 同帮重复申请 = 刷新有效期并成功
}

message CancelGuildApplicationRequest {
  uint64 guild_id = 1;
}
message CancelGuildApplicationResponse {
  TipInfoMessage error_message = 1;
}

// 申请人视角的一条待审申请。
message GuildApplicationView {
  uint64 guild_id     = 1;
  string guild_name   = 2;
  uint32 level        = 3;
  uint32 member_count = 4;
  uint32 max_members  = 5;
  uint64 leader_id    = 6;
  string leader_name  = 7;  // B3b 填,B2 恒空
  uint64 apply_ms     = 8;  // 最近一次申请 / 刷新时刻(服务端时钟,Unix 毫秒)
  uint64 expire_ms    = 9;  // 过期时刻(服务端时钟);客户端只用于展示
}

message ListMyGuildApplicationsRequest {}
message ListMyGuildApplicationsResponse {
  TipInfoMessage error_message = 1;
  repeated GuildApplicationView applications = 2;  // 按 apply_ms 降序、guild_id 升序
}

// 审批人视角的一位申请人。
message GuildApplicantView {
  uint64 player_id = 1;
  string name      = 2;  // B3b 填,B2 恒空
  bool   online    = 3;  // 读 player:session,不入库
  uint64 apply_ms  = 4;
  uint64 expire_ms = 5;
}

message ListGuildApplicationsRequest {}
message ListGuildApplicationsResponse {
  TipInfoMessage error_message = 1;
  // 按 apply_ms 升序、player_id 升序,至多 GuildRule.max_pending_applications_per_guild 条
  repeated GuildApplicantView applicants = 2;
}

message ReviewGuildApplicationRequest {
  uint64 applicant_player_id = 1;
  bool   approve             = 2;
}
message ReviewGuildApplicationResponse {
  TipInfoMessage error_message = 1;
  GuildInfo guild = 2;  // 成功(通过或拒绝)时为审批人所在帮会的权威快照
}

// ── 推送(B2)────────────────────────────────────────────────────
// 至多一次;客户端收到只触发拉取(GetPlayerGuild 等),拉取结果才是真相。
// 枚举值名在 proto3 里是**包级**符号,本文件与 guild_db.proto 同在 package guildpb,
// 不带前缀会在包内撞名,所以每个值都带 GUILD_CHANGE_KIND_ 前缀。
enum GuildChangeKind {
  GUILD_CHANGE_KIND_UNSPECIFIED          = 0;
  GUILD_CHANGE_KIND_MEMBER_JOINED        = 1;
  GUILD_CHANGE_KIND_MEMBER_LEFT          = 2;
  GUILD_CHANGE_KIND_MEMBER_KICKED        = 3;
  GUILD_CHANGE_KIND_ROLE_CHANGED         = 4;
  GUILD_CHANGE_KIND_LEADER_TRANSFERRED   = 5;
  GUILD_CHANGE_KIND_DISBANDED            = 6;
  GUILD_CHANGE_KIND_APPLICATION_RECEIVED = 7;
  GUILD_CHANGE_KIND_APPLICATION_REJECTED = 8;
  GUILD_CHANGE_KIND_FUNDS_CHANGED        = 9;   // B5
  GUILD_CHANGE_KIND_LEVEL_UP             = 10;  // B5
  GUILD_CHANGE_KIND_ANNOUNCEMENT_CHANGED = 11;
  GUILD_CHANGE_KIND_ACTIVITY_CHANGED     = 12;  // B6
  GUILD_CHANGE_KIND_DELIVERY_DONE        = 13;  // B5
}

message GuildChangedS2C {
  GuildChangeKind kind    = 1;
  uint64 guild_id         = 2;
  uint64 actor_player_id  = 3;  // 发起者;系统触发为 0
  uint64 target_player_id = 4;  // 被操作者;无则 0
}

// ── 帮会经济(B5):捐献 / 升级 / 商店 ─────────────────────────────
// 以下请求同样不带 player_id / guild_id:操作者与所在帮会一律取 gate 会话。
// "结算中 / 待发放"不是错误:它用视图里的 status 表达,**不进** error_message ——
// 客户端遇到任何非 0 tip 都会中断后续刷新,PENDING 塞进去会让一笔正常的单看起来像失败。

// 客户端可见的资产订单状态。guild_db.proto 的 GuildAssetOpStatus 是库内状态、不下发客户端,
// 这里另起一个;两者数值逐项相同,服务端按值直接转换(新增状态必须两边同加)。
enum GuildAssetOrderStatus {
  GUILD_ASSET_ORDER_STATUS_UNSPECIFIED     = 0;
  GUILD_ASSET_ORDER_STATUS_PENDING         = 1;  // 结算中 / 待发放
  GUILD_ASSET_ORDER_STATUS_APPLIED         = 2;
  GUILD_ASSET_ORDER_STATUS_REJECTED        = 3;
  GUILD_ASSET_ORDER_STATUS_ABORTED         = 4;  // 超时或人工撤销
  GUILD_ASSET_ORDER_STATUS_APPLIED_PARTIAL = 5;  // 已部分发放,转人工补偿(90 清单 X-15)
}

// 一笔捐献(DonateToGuild 的回包;GetGuildDonateOptions 的待结算列表与最近结果)。
message GuildDonationView {
  uint64 op_id                 = 1;
  uint32 donate_id             = 2;  // GuildDonate.id
  GuildAssetOrderStatus status = 3;
  uint32 currency_type         = 4;  // 0 银两 / 1 灵石
  uint64 cost_amount           = 5;
  uint64 contribution_gain     = 6;
  uint64 funds_gain            = 7;
  uint32 reason_tip_id         = 8;  // PENDING:最近一次暂时原因(资产段 tip,0 = 刚提交);REJECTED:拒绝原因
  uint64 created_ms            = 9;
}

// 捐献页的一个选项(配表行 + 本人今日用量)。客户端不加载配表,选项只能由服务端下发。
message GuildDonateOptionView {
  uint32 donate_id         = 1;
  string name              = 2;
  uint32 currency_type     = 3;
  uint64 cost_amount       = 4;
  uint64 contribution_gain = 5;
  uint64 funds_gain        = 6;
  uint32 daily_limit       = 7;
  uint32 used_today        = 8;   // 含结算中的占用
  uint32 min_guild_level   = 9;
  bool   unlocked          = 10;  // 帮会等级 >= min_guild_level
}

message GuildShopGoodsView {
  uint32 goods_id             = 1;
  string name                 = 2;
  uint32 category             = 3;   // 1 修行补给 / 2 帮会珍藏 / 3 节庆好礼
  uint32 item_id              = 4;
  uint32 item_count           = 5;   // 每份物品数
  uint64 cost_contribution    = 6;   // 每份帮贡
  uint32 required_guild_level = 7;
  bool   unlocked             = 8;
  uint32 limit_period         = 9;   // 0 不限 / 1 每游戏日 / 2 每周
  uint32 limit_count          = 10;  // limit_period=0 时为 0
  uint32 used_count           = 11;  // 本周期已兑换份数(含待发放)
  uint32 max_buy_count        = 12;  // 单次最多份数(服务端按物品堆叠上限算出;堆叠 1 的物品恒为 1)
}

message GuildShopOrderView {
  uint64 op_id                 = 1;
  uint32 goods_id              = 2;
  uint32 count                 = 3;  // 份数
  GuildAssetOrderStatus status = 4;
  uint64 cost_contribution     = 5;  // 本单总帮贡
  uint32 reason_tip_id         = 6;
  uint64 created_ms            = 7;
}

message GetGuildDonateOptionsRequest {}
message GetGuildDonateOptionsResponse {
  TipInfoMessage error_message                 = 1;
  repeated GuildDonateOptionView options       = 2;  // 按 donate_id 升序
  repeated GuildDonationView pending_donations = 3;  // 本人本帮 PENDING,按 (stream_epoch, seq) 升序,<=16
  uint64 contribution_total                    = 4;
  uint64 contribution_balance                  = 5;
  uint64 next_daily_reset_ms                   = 6;  // 下一个游戏日切点(UTC+8 05:00),Unix 毫秒
  repeated GuildDonationView recent_results    = 7;  // 本人 10 分钟内进入终态的捐献,<=5,新的在前
}

message DonateToGuildRequest {
  uint32 donate_id = 1;
}
message DonateToGuildResponse {
  TipInfoMessage error_message = 1;
  GuildDonationView donation   = 2;  // 已写入指令时必填(含 REJECTED)
  GuildInfo guild              = 3;  // 请求者仍在帮时必填(含 PENDING)
}

// expected_level:客户端看到的当前等级。与库里不一致 = 已被他人升级,
// 回成功 + 最新 GuildInfo,不再扣资金(重复点击不会连升两级)。
message UpgradeGuildRequest {
  uint32 expected_level = 1;
}
message UpgradeGuildResponse {
  TipInfoMessage error_message = 1;
  GuildInfo guild              = 2;  // 请求者仍在帮时必填(含业务失败,如资金不足)
}

message GetGuildShopRequest {}
message GetGuildShopResponse {
  TipInfoMessage error_message               = 1;
  repeated GuildShopGoodsView goods          = 2;  // 按 category、goods_id 升序
  uint64 contribution_balance                = 3;
  repeated GuildShopOrderView pending_orders = 4;  // 本人 SHOP 类 PENDING,<=16
  uint64 next_daily_reset_ms                 = 5;
  uint64 next_weekly_reset_ms                = 6;  // 下一个周切点(UTC+8 周一 05:00),Unix 毫秒
  repeated GuildShopOrderView recent_orders  = 7;  // 本人 10 分钟内进入终态的兑换,<=5,新的在前
}

message BuyGuildShopGoodsRequest {
  uint32 goods_id = 1;
  uint32 count    = 2;  // 份数,1..GuildShopGoodsView.max_buy_count
}
message BuyGuildShopGoodsResponse {
  TipInfoMessage error_message = 1;
  GuildShopOrderView order     = 2;
  uint64 contribution_balance  = 3;  // 提交后的余额(REJECTED 时已退回)
}

// ── Ranking ───────────────────────────────────────────────────

// Guild summary in ranking (without full member list)
message GuildRankEntry {
  uint64 guild_id       = 1;
  string name           = 2;
  uint64 leader_id      = 3;
  uint32 level          = 4;
  uint32 member_count   = 5;
  int64  score          = 6;  // Ranking score
  uint32 rank           = 7;  // Rank (1-based)
  string leader_name    = 8;  // 展示用(B3b 填,B2 恒空)
}

message UpdateGuildScoreRequest {
  uint64 guild_id = 1;
  int64  score    = 2;  // New ranking score
  uint32 zone_id  = 3;  // Zone for per-zone ranking (0 = update global only)
}

message UpdateGuildScoreResponse {
  TipInfoMessage error_message = 1;
}

message GetGuildRankRequest {
  uint32 page      = 1;  // Page number (1-based)
  uint32 page_size = 2;  // Items per page
  uint32 zone_id   = 3;  // 0 = global ranking, >0 = per-zone ranking
}

message GetGuildRankResponse {
  TipInfoMessage error_message = 1;
  repeated GuildRankEntry entries = 2;
  uint32 total_count = 3;  // Total guilds in ranking
  uint32 page        = 4;
  uint32 page_size   = 5;
}

message GetGuildRankByGuildRequest {
  uint64 guild_id = 1;
  uint32 zone_id  = 2;  // 0 = global ranking, >0 = per-zone ranking
}

message GetGuildRankByGuildResponse {
  TipInfoMessage error_message = 1;
  GuildRankEntry entry = 2;  // Guild info in ranking (including rank)
}

// ── Service definition ─────────────────────────────────────────────────────

// 客户端经 gate → client_rpc_router 到达(只承诺路由服模式)。
// 身份与 zone 一律由服务端决定:请求体里的 player_id / zone_id 只对内部调用(无会话)生效。
// 本开关是服务级的,UpdateGuildScore 也会进 gate 白名单与路由表;
// 它对客户端的拒绝在 go/guild/internal/session 的方法白名单里(port-decisions D-9)。
service GuildService {
  option (OptionIsClientProtocolService) = true;

  rpc CreateGuild (CreateGuildRequest) returns (CreateGuildResponse);
  rpc GetGuild (GetGuildRequest) returns (GetGuildResponse);
  rpc GetPlayerGuild (GetPlayerGuildRequest) returns (GetPlayerGuildResponse);
  rpc LeaveGuild (LeaveGuildRequest) returns (LeaveGuildResponse);
  rpc DisbandGuild (DisbandGuildRequest) returns (DisbandGuildResponse);
  rpc SetAnnouncement (SetAnnouncementRequest) returns (SetAnnouncementResponse);

  // 成员管理(B2)
  rpc SetGuildMemberRole (SetGuildMemberRoleRequest) returns (SetGuildMemberRoleResponse);
  rpc KickGuildMember (KickGuildMemberRequest) returns (KickGuildMemberResponse);
  rpc TransferGuildLeader (TransferGuildLeaderRequest) returns (TransferGuildLeaderResponse);

  // 入帮申请(B2;取代直接入帮 JoinGuild)
  rpc ApplyJoinGuild (ApplyJoinGuildRequest) returns (ApplyJoinGuildResponse);
  rpc CancelGuildApplication (CancelGuildApplicationRequest) returns (CancelGuildApplicationResponse);
  rpc ListMyGuildApplications (ListMyGuildApplicationsRequest) returns (ListMyGuildApplicationsResponse);
  rpc ListGuildApplications (ListGuildApplicationsRequest) returns (ListGuildApplicationsResponse);
  rpc ReviewGuildApplication (ReviewGuildApplicationRequest) returns (ReviewGuildApplicationResponse);

  // 推送占位(B2):只为分配 message id;服务端实现恒返回 Empty。
  // **不进** go/guild session.ClientMethods —— 客户端发这个 id 会被 PermissionDenied。
  rpc NotifyGuildChanged (GuildChangedS2C) returns (Empty);

  // Ranking
  rpc UpdateGuildScore (UpdateGuildScoreRequest) returns (UpdateGuildScoreResponse);
  rpc GetGuildRank (GetGuildRankRequest) returns (GetGuildRankResponse);
  rpc GetGuildRankByGuild (GetGuildRankByGuildRequest) returns (GetGuildRankByGuildResponse);

  // 帮会经济(B5)。五个都是客户端方法,已进 go/guild session.ClientMethods;
  // 身份一律取会话,无会话的内部调用由 logic 拒绝。B5a 只落协议,实现在 B5b(此前回 Unimplemented)。
  rpc GetGuildDonateOptions (GetGuildDonateOptionsRequest) returns (GetGuildDonateOptionsResponse);
  rpc DonateToGuild (DonateToGuildRequest) returns (DonateToGuildResponse);
  rpc UpgradeGuild (UpgradeGuildRequest) returns (UpgradeGuildResponse);
  rpc GetGuildShop (GetGuildShopRequest) returns (GetGuildShopResponse);
  rpc BuyGuildShopGoods (BuyGuildShopGoodsRequest) returns (BuyGuildShopGoodsResponse);
}
