syntax = "proto3";
package match;

import "proto/db/proto_option.proto";
import "proto/common/base/empty.proto";
import "proto/common/base/tip.proto";
import "proto/battle/player_battle.proto";
import "proto/battle/battle_data.proto";
import "proto/battle/battle_script.proto";
import "proto/match/match_network.proto";

option go_package = "proto/match";
option (OptionFileDefaultNode) = NODE_MATCH;

// MatchService:统一开局入口(回合制战斗一期启用,设计文档 turn-based-battle-server.md D3)。
// 客户端经 gate 按文件路由选项直达 match 服务(照 login 模式,权威 player_id 取自
// session metadata,请求内 player_id 仅内部调用使用)。
// 凑单成功后走 gather 协议:scene.PrepareBattle 收快照 -> battle.CreateBattle,
// 失败按补偿矩阵回滚(设计文档 §3.2)。
service MatchService {
  option (OptionIsClientProtocolService) = true;

  // 获取受信地域探测端点；提交端点签名回执后才允许全球排队。
  rpc GetNetworkProbePlan(GetNetworkProbePlanRequest) returns (GetNetworkProbePlanResponse) {}
  rpc CommitNetworkProbe(CommitNetworkProbeRequest) returns (CommitNetworkProbeResponse) {}

  // Player requests to join a match queue.
  rpc JoinQueue(JoinQueueRequest) returns (JoinQueueResponse) {}

  // Player cancels their queued match request.
  rpc CancelQueue(CancelQueueRequest) returns (Empty) {}

  // Query current queue status for a player.
  rpc GetQueueStatus(GetQueueStatusRequest) returns (GetQueueStatusResponse) {}

  // ---- 场景发起 PK(切磋):点名成局入口,与队列匹配汇入同一条 gather 开局管线 ----
  rpc ChallengePlayer(ChallengePlayerRequest) returns (ChallengePlayerResponse) {}
  rpc RespondChallenge(RespondChallengeRequest) returns (RespondChallengeResponse) {}
  rpc NotifyChallengeInvite(ChallengeInviteS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc NotifyChallengeResult(ChallengeResultS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }

  // ---- 二期:观战匹配(设计文档 §10) ----
  // battle_id=0 表示随机观战(从活跃战斗索引里随机挑一场);成功后由 battle 节点
  // 经 Kafka 推 NotifySpectateState 首帧,客户端收到首帧才算进入观战。
  rpc WatchBattle(WatchBattleRequest) returns (WatchBattleResponse) {}

  // ---- 战斗票据补签(客户端丢票 / 冷启动;turn-based-battle-server.md §18 D25) ----
  // 大厅会话唯一的补签入口:match 按 SQL 成局记录定位房间所在 battle 节点,
  // 调 BattleNode.IssueBattleTicket 由 battle 本地核对名单并自签;仅参战者 / 观众可得票。
  // 曾是 BattleClientPlayer.RequestBattleTicket(gate→battle gRPC);gate 收成只连路由服后 gate 不再
  // 认识 battle 节点,补签改由 match 转,请求 / 响应消息复用 player_battle.proto 里的定义。
  rpc RequestBattleTicket(RequestBattleTicketRequest) returns (RequestBattleTicketResponse) {}
  rpc ListWatchableBattles(ListWatchableBattlesRequest) returns (ListWatchableBattlesResponse) {}

  // ---- 战报回放(battle-report-replay.md):每名玩家保留最近 100 场 PVP 战报 ----
  // 请求都不带 player_id,只认会话本人。列表新的在前,一次全给(最多 100 条)。
  rpc ListBattleReports(ListBattleReportsRequest) returns (ListBattleReportsResponse) {}
  // 取一局的回放正文:只有列表里还有这一局的玩家能取。
  rpc GetBattleReport(GetBattleReportRequest) returns (GetBattleReportResponse) {}

  // ---- 战斗剧本(docs/design/battle-script.md §7):请求都不带 player_id,只认会话本人 ----
  // 官方剧本 + 本人的剧本(含审核状态)+ 本人的选用,一次全给。
  rpc ListBattleScripts(ListBattleScriptsRequest) returns (ListBattleScriptsResponse) {}
  // 新建或改写本人的剧本:校验通过即存为新版本、进入待审;审核通过前对局继续用上一份通过版。
  rpc SubmitBattleScript(SubmitBattleScriptRequest) returns (SubmitBattleScriptResponse) {}
  // 删除本人的剧本,选用了它的条目同一事务清掉。
  rpc DeleteBattleScript(DeleteBattleScriptRequest) returns (DeleteBattleScriptResponse) {}
  // 为某种对局选用剧本(官方剧本或本人已通过审核的剧本),或清除这条选用。
  rpc SetBattleScriptLoadout(SetBattleScriptLoadoutRequest) returns (SetBattleScriptLoadoutResponse) {}

  // ---- 论剑排位首发 V1(docs/design/ranked-play-season-ui-candidate.md):请求只认会话本人 ----
  rpc GetRankedProfile(GetRankedProfileRequest) returns (GetRankedProfileResponse) {}
  rpc SaveRankedPreset(SaveRankedPresetRequest) returns (SaveRankedPresetResponse) {}
  rpc UpdateRankedCosmetic(UpdateRankedCosmeticRequest) returns (UpdateRankedCosmeticResponse) {}
  rpc GetRankedBattleResult(GetRankedBattleResultRequest) returns (GetRankedBattleResultResponse) {}

  // ---- 全服赛季战队锦标赛《群仙问道赛》V1(docs/design/season-team-tournament-v1.md):请求只认会话本人 ----
  rpc GetTournamentOverview(GetTournamentOverviewRequest) returns (GetTournamentOverviewResponse) {}
  rpc CreateTournamentSquad(CreateTournamentSquadRequest) returns (CreateTournamentSquadResponse) {}
  rpc InviteTournamentMember(InviteTournamentMemberRequest) returns (InviteTournamentMemberResponse) {}
  rpc RespondTournamentInvite(RespondTournamentInviteRequest) returns (RespondTournamentInviteResponse) {}
  rpc LeaveTournamentSquad(LeaveTournamentSquadRequest) returns (LeaveTournamentSquadResponse) {}
  rpc UpdateTournamentLineup(UpdateTournamentLineupRequest) returns (UpdateTournamentLineupResponse) {}
  rpc RegisterTournamentSquad(RegisterTournamentSquadRequest) returns (RegisterTournamentSquadResponse) {}
  rpc ListTournamentStandings(ListTournamentStandingsRequest) returns (ListTournamentStandingsResponse) {}
  rpc StartTournamentMatch(StartTournamentMatchRequest) returns (StartTournamentMatchResponse) {}
  rpc CheerTournamentSquad(CheerTournamentSquadRequest) returns (CheerTournamentSquadResponse) {}
  rpc ClaimTournamentReward(ClaimTournamentRewardRequest) returns (ClaimTournamentRewardResponse) {}

  // ---- 全服赛季战队锦标赛《群仙问道赛》V2(docs/planning/season-team-tournament-v2.md):请求只认会话本人 ----
  // 原 506=SaluteTournamentChampion（每日免费观道致敬）已彻底移除，消息号 506 永久保留不复用。
  rpc SendTournamentSpectateCheer(SendTournamentSpectateCheerRequest) returns (SendTournamentSpectateCheerResponse) {}
  rpc GetTournamentSpectateCheer(GetTournamentSpectateCheerRequest) returns (GetTournamentSpectateCheerResponse) {}

  // ---- 全服赛季战队锦标赛《群仙问道赛》V3(docs/planning/season-team-tournament-v3.md):请求只认会话本人 ----
  rpc UpdateTournamentSquadEmblem(UpdateTournamentSquadEmblemRequest) returns (UpdateTournamentSquadEmblemResponse) {}
  rpc StartTournamentWarmup(StartTournamentWarmupRequest) returns (StartTournamentWarmupResponse) {}
  rpc PredictTournamentMatch(PredictTournamentMatchRequest) returns (PredictTournamentMatchResponse) {}
  rpc GetTournamentPredictionBoard(GetTournamentPredictionBoardRequest) returns (GetTournamentPredictionBoardResponse) {}

  // ---- 全服赛季战队锦标赛《群仙问道赛》V4(docs/planning/season-team-tournament-v4.md):请求只认会话本人 ----
  rpc BanTournamentLeyline(BanTournamentLeylineRequest) returns (BanTournamentLeylineResponse) {}
  rpc GetTournamentHighlights(GetTournamentHighlightsRequest) returns (GetTournamentHighlightsResponse) {}

  // ---- 江湖恩怨与天墉生死状一期(docs/design/battle-jianghu-grudge-duel-bounty-v1.md):请求只认会话本人 ----
  rpc CreateJianghuDuelInvite(CreateJianghuDuelInviteRequest) returns (CreateJianghuDuelInviteResponse) {}
  rpc ConfirmJianghuDuelMember(ConfirmJianghuDuelMemberRequest) returns (ConfirmJianghuDuelMemberResponse) {}
  rpc RespondJianghuDuelInvite(RespondJianghuDuelInviteRequest) returns (RespondJianghuDuelInviteResponse) {}
  rpc ListJianghuGrudges(ListJianghuGrudgesRequest) returns (ListJianghuGrudgesResponse) {}
  rpc DismissJianghuGrudge(DismissJianghuGrudgeRequest) returns (DismissJianghuGrudgeResponse) {}
  rpc NotifyJianghuDuelInvite(JianghuDuelInviteS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc NotifyJianghuDuelStatus(JianghuDuelStatusS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }

  // ---- 五行试炼志 V3：好友约战帖与受控 PVE 录像播放(docs/planning/trial-journal-v3-wild-bosses-vows-replay-share.md) ----
  // 均为只认会话本人（Create 校验参战者身份；Get 与 GetSharedReplay 凭有效未过期 card_id 放行，不破坏既有 GetBattleReport 隐私边界）。
  rpc CreateTrialChallengeCard(CreateTrialChallengeCardRequest) returns (CreateTrialChallengeCardResponse) {}
  rpc GetTrialChallengeCard(GetTrialChallengeCardRequest) returns (GetTrialChallengeCardResponse) {}
  rpc GetSharedTrialReplay(GetSharedTrialReplayRequest) returns (GetSharedTrialReplayResponse) {}

  // ---- 万象残局坊（UGC 回合解谜工坊 V1，docs/planning/tactical-puzzle-workshop-v1.md）----
  // 均为只认会话本人；出题文本必经 ContentGuard 拦截；自证通关后钉住标准解回放；0 数值通胀、0 日常打卡。
  rpc ListTacticalPuzzles(ListTacticalPuzzlesRequest) returns (ListTacticalPuzzlesResponse) {}
  rpc GetTacticalPuzzle(GetTacticalPuzzleRequest) returns (GetTacticalPuzzleResponse) {}
  rpc SaveTacticalPuzzleDraft(SaveTacticalPuzzleDraftRequest) returns (SaveTacticalPuzzleDraftResponse) {}
  rpc DeleteTacticalPuzzle(DeleteTacticalPuzzleRequest) returns (DeleteTacticalPuzzleResponse) {}
  rpc StartTacticalPuzzleBattle(StartTacticalPuzzleBattleRequest) returns (StartTacticalPuzzleBattleResponse) {}
  rpc LikeTacticalPuzzle(LikeTacticalPuzzleRequest) returns (LikeTacticalPuzzleResponse) {}
  rpc GetTacticalPuzzleSolutionReplay(GetTacticalPuzzleSolutionReplayRequest) returns (GetTacticalPuzzleSolutionReplayResponse) {}
}

// ----- Match mode config -----

// Match mode determines team size, player count, and map config.
enum MatchMode {
  MATCH_MODE_UNSPECIFIED = 0;
  MATCH_MODE_5V5         = 1; // 回合制 PVP 5v5(二期启用):FIFO 凑 10 人,前 5 后 5 各一队
  MATCH_MODE_3V3         = 2; // 6 players total(未开放)
  MATCH_MODE_1V1         = 3; // 2 players total(回合制 PVP,一期启用)
  MATCH_MODE_PVE_SOLO    = 4; // 回合制 PVE 单人,即时开战(伪匹配)
  MATCH_MODE_PVE_TEAM    = 5; // 回合制 PVE 组队:按 JoinQueueRequest.team_size 的人数档 FIFO 凑满(1 人档即时开战)
  MATCH_MODE_PVP_CHALLENGE = 6; // 场景发起 PK(切磋):点名成局,不入队
  MATCH_MODE_PVP_TEAM = 7; // 真人人数档PVP：每侧1..5人，整支队伍保持同侧，等待真人对手（真实养成，正式计分）。
  MATCH_MODE_POLARITY_5V5 = 8; // 轮换娱乐场·物法易势 5V5：每侧 5 人、10 人公平团战，使用 6 套免费预设，不计正式评分。
  MATCH_MODE_GUILD_WAR_PVP = 9; // 帮会全天帮战 V2·真人直打(docs/design/guild-play-v2.md):无匹配池,本人真实养成,公开观战,录回放,胜15/合格负平10。
  MATCH_MODE_GUILD_WAR_SIEGE = 10; // 帮会全天帮战 V2·守旗阵踢馆/灵脉守卫(docs/design/guild-play-v2.md):无匹配池,守方 AI 快照托管,公开观战,胜10/负0。
  MATCH_MODE_SEASON_TOURNAMENT = 11; // 全服赛季战队锦标赛《群仙问道赛》:本人真实养成、公开 L2 观战、强制录回放、不进常规 Elo 榜。
  MATCH_MODE_JIANGHU_DUEL = 12; // 江湖恩怨·天墉生死状(docs/design/battle-jianghu-grudge-duel-bounty-v1.md):1V1-5V5 真实养成,公开观战,录回放,0 材料,0 Elo。
}

// ----- Join queue -----

message JoinQueueRequest {
  uint64 player_id = 1;               // Initiating player
  MatchMode mode = 2;                 // Desired match mode (5v5, 3v3, 1v1)
  uint32 map_config_id = 3;           // Map template config ID (maps to scene_config_id)
  // 从未生效(joinqueuelogic.go 只打一行日志后照单人入队);整队开战的唯一入口是
  // ClientPlayerTeam.StartTeamMatch(docs/design/team-system.md DV-4)。字段号 4 保留不复用(AGENTS §4)。
  repeated uint64 party_member_ids = 4 [deprecated = true];
  uint32 zone_id = 5;                 // Player's current zone
  uint32 battle_config_id = 6;        // 回合制战斗配置(DungeonTable id:怪物组/人数/回合上限)
  // 人数档：PVE_TEAM 为同场玩家数，PVP_TEAM 为每侧玩家数(1..5)。
  // PVP_TEAM 的0按单人档处理；已有队伍由 StartTeamMatch 读取权威名单，不从本请求信任成员数组。
  // 以下副本人数上限规则仅用于PVE_TEAM(docs/design/pve-team-size-matching.md)。
  // 怪物只数跟着实际参战人数走(每人一整组怪:单人打一组,N 人打 N 组)。
  //   0        = 该副本的人数上限(加这个字段之前的行为;老客户端不填就是它)
  //   1        = 不排队,即时开战
  //   2..上限  = 进这个人数档的队列,凑满即开
  //   超过上限 = 拒绝(kMatchModeNotOpen)
  // 上限 = match 配置 PveTeamSizeByConfigId[battle_config_id],且不超过引擎每队上限 5。
  uint32 team_size = 7;
  // 同一玩家意图重放必须复用；为空只允许未启用全球权威的开发兼容模式。
  string request_id = 8;
  string network_plan_id = 9;
  // 论剑排位单排预设(PVP_TEAM 时有效;0 = 使用已保存的个人预设或官方默认破阵 101 / 护主 203)。
  uint32 character_preset_id = 10;
  uint32 pet_preset_id = 11;
  // 排位规则版本号(非 0 时与当前赛季规则版本比对,不符回 kMatchRankedRuleVersionMismatch)。
  uint32 ranked_rule_version = 12;
  // true = 五行幻境周常爬塔单人开战（仅 PVE_SOLO 有效，真实层数与符印由 Scene 从玩家权威状态注入）。
  bool is_wuxing_tower = 13;
  // 五行试炼志 V3 自选试炼誓约位图（bit0 禁控 / bit1 单宝 / bit2 无宠 / bit3 紧缩回合，有效值 0..0x0F）。
  // 仅允许常驻试炼志 PVE 首领副本单人直开；其余模式非 0 一律拒绝。
  uint32 trial_vow_mask = 14;
}

message JoinQueueResponse {
  uint32 error_code = 1;              // 0 = success
  string queue_ticket = 2;            // Ticket ID for tracking / cancellation
  TipInfoMessage error_message = 3;
}

// ----- Cancel queue -----

message CancelQueueRequest {
  uint64 player_id = 1;
  string queue_ticket = 2;            // Ticket to cancel
  // 对未知结果的 Join 也能撤销；与原 Join 共用编号，服务端永久阻止该意图迟到入队。
  string request_id = 3;
}

// ----- Queue status -----

message GetQueueStatusRequest {
  uint64 player_id = 1;
  string request_id = 2; // 查询本次 Join 的撤销提交证据；不改变当前票据身份。
}

message GetQueueStatusResponse {
  QueueState state = 1;
  uint32 estimated_wait_seconds = 2;  // Server-estimated wait time
  uint32 queued_seconds = 3;          // How long the player has been waiting
  string queue_ticket = 4;
  uint64 battle_id = 5;
  uint32 selected_region = 6;
  uint32 retry_after_ms = 7;
  // 上述 request_id 不会再入队：它的 SQL 撤销墓碑已提交，或它的原件属于角色此前的归属（过户前留下，现主人不能沿它入队）。
  // NOT_QUEUED 单独不构成此证据。
  bool request_cancelled = 8;
  // 论剑排位等待提示阈值秒数(首测=120,客户端排队超过此值弹出继续等或取消提示)。
  uint32 wait_prompt_seconds = 9;
  // 当前等待时间对应的排位分差窗口(评分点:100/200/300;非排位为 0)。
  uint32 current_rating_spread = 10;
  // 当前排队每侧人数档(1..5;未排队或非人数档为 0)。
  uint32 team_size = 11;
  // 当前排位票所属赛季号(非排位为 0)。
  uint32 season_id = 12;
}

enum QueueState {
  QUEUE_STATE_UNSPECIFIED = 0;
  QUEUE_STATE_QUEUED      = 1;  // Waiting for match
  QUEUE_STATE_MATCHED     = 2;  // Match found, instance being created
  QUEUE_STATE_READY       = 3;  // Instance created, waiting for player confirm
  QUEUE_STATE_ENTERING    = 4;  // Players entering scene
  QUEUE_STATE_NOT_QUEUED  = 5;  // Player is not in any queue
}

// ----- 场景发起 PK(切磋) -----
// challenge_id 由 match 服务从发号器领号(biz_tag=battle,与 battle_id / team_id 共用号段;只当身份用,不能解析);挑战记录存 match 的 SQL 表 match_challenge_invitation,
// 有效期 ChallengeTTLSeconds(默认 60 秒),过了 expires_ms(按库时钟判)自动作废。
// 应战成功后与队列匹配共用 gather 开局管线(PrepareBattle -> CreateBattle),
// 双方 battle:lock 校验在应战时刻做(发起时只做咨询性检查)。

message ChallengePlayerRequest {
  uint64 player_id = 1;          // 发起者(权威身份以 session metadata 为准)
  uint64 target_player_id = 2;   // 被挑战者(客户端从场景 AOI 拿到)
  uint32 battle_config_id = 3;   // PK 规则/场地配置(0 = 默认切磋规则)
  CustomDuelRules custom_rules = 4; // 道友切磋坊自定义规则（可空=默认真养成私密切磋）
}

message ChallengePlayerResponse {
  uint64 challenge_id = 1;
  TipInfoMessage error_message = 2;  // 对方不在线/在战斗中/自我挑战等拒绝原因
}

message RespondChallengeRequest {
  uint64 player_id = 1;          // 应战者(权威身份以 session metadata 为准)
  uint64 challenge_id = 2;
  bool accept = 3;
  uint32 responder_character_preset_id = 4; // 公平模板切磋时应战者所选人物预设（0=默认 101）
  uint32 responder_pet_preset_id = 5;       // 公平模板切磋时应战者所选灵宠预设（0=默认 203）
}

message RespondChallengeResponse {
  TipInfoMessage error_message = 1;  // 挑战已过期/发起者已进入其它战斗等
}

// 推给被挑战者的弹窗
message ChallengeInviteS2C {
  uint64 challenge_id = 1;
  uint64 challenger_id = 2;
  string challenger_name = 3;
  uint32 battle_config_id = 4;
  uint64 expires_at_ms = 5;      // Unix 毫秒,过期客户端自动收起弹窗
  CustomDuelRules custom_rules = 6; // 发起者勾选的自定义切磋规则（弹窗明示给应战者）
}

// 推给发起者(以及拒绝时推给双方)的结果
message ChallengeResultS2C {
  uint64 challenge_id = 1;
  bool accepted = 2;             // false = 拒绝或超时
  uint64 responder_id = 3;
}

// ----- 二期:观战匹配(设计文档 §10) -----
// 活跃战斗索引由 match 维护:gather 开局成功后 ZADD 本局所在的桶 spectate:battles:active:{sba:<battle_id % 16>}(观战记录由 SQL 成局组出);
// 清理靠到期剔除 + 观战失败(battle 节点报房间不存在)时懒剔除,battle 节点不碰 Redis。

message WatchBattleRequest {
  uint64 player_id = 1;      // 权威身份以 session metadata 为准
  uint64 battle_id = 2;      // 0 = 随机观战
  string request_id = 3; // 全球模式原观战意图UUID，重试复用；已关闭原件不能复活或清退后来的观战。
}

// 观战帧的投递方式(battle-spectate-tiered-fanout.md §15.2,D94/D95)。
enum eSpectateDelivery {
  SPECTATE_DELIVERY_NONE = 0;    // 未进入观战(error_message 非零)
  SPECTATE_DELIVERY_DIRECT = 1;  // L0:等 NotifyBattleAssigned,凭票直连 battle,首帧 161 经直连下发
  SPECTATE_DELIVERY_LOBBY = 2;   // L1 / L2:不建直连;把 spectate_ticket 原样交给 gate 的 SubscribeSpectate,
                                 //   观战帧 161 / 158 / 166 经大厅连接下发
}

message WatchBattleResponse {
  uint64 battle_id = 1;      // 实际观战的战斗(随机模式回填)
  TipInfoMessage error_message = 2;  // 无可观战战斗/本人在战斗或队列中/战斗已结束
  string spectator_operation_id = 3;
  eSpectateDelivery delivery = 4;
  bytes spectate_ticket = 5; // LOBBY 时非空:match 签发的观战订阅凭证(不透明字节,客户端不解析、不持久)
}

message ListWatchableBattlesRequest {
  uint64 player_id = 1;
  uint32 limit = 2;          // 0 = 服务端默认条数
}

message ListWatchableBattlesResponse {
  repeated BattleWatchSummary battles = 1;
}

// 客户端观战列表条目(摘要在开局时刻生成,不含实时回合数)
message BattleWatchSummary {
  uint64 battle_id = 1;
  MatchMode mode = 2;
  uint32 battle_config_id = 3;
  repeated string player_names = 4;
  uint64 created_at_ms = 5;
  bool featured = 6;         // 运营标记的赛事局(列表排在最前,优先升全服广播)
  // 论剑 V7 正式高段排位实时围观元数据（非正式排位为 0）。
  uint32 ranked_team_size = 7;
  int64 ranked_peak_rating_centi = 8;
}

// 内部记录(由 SQL 成局组出,含路由所需的 battle 节点 id,不下发客户端)
message SpectateBattleRecord {
  BattleWatchSummary summary = 1;
  uint32 battle_node_id = 2;
  // 与 CreateBattleRequest.spectate_visibility 同值(建房原件冻结)。非 PUBLIC 的记录
  // 只用来给丢票补签定位 battle 节点,不进观战活跃索引 spectate:battles:active:{sba:<k>},也不能被 WatchBattle 指定观战。
  eSpectateVisibility visibility = 3;
  // 以下三项由 match 在观战准入时维护(§15.6):档位以独立键 spectate:tier:{id} 为准(Lua 只升不降),
  // 这里只是建房时的初值;实例与期限来自 battle 的 AttachRelayGate / PromoteSpectateBroadcast 回包。
  eSpectateTier tier = 4;
  string battle_instance_id = 5;
  uint64 deadline_ms = 6;
  // 取自成局原件 MatchFormationRecord.release_track:这场所在 battle 节点的发布轨道,观战列表按它给 stable 观众过滤。
  string release_track = 7;
}

// ----- Server-internal: match result (used between MatchService and SceneManager) -----

// MatchResult is produced internally when matchmaking completes.
// MatchService uses this to call SceneManager.CreateScene.
message MatchResult {
  string match_id = 1;                // Unique match identifier
  MatchMode mode = 2;
  uint32 map_config_id = 3;           // scene_config_id for CreateScene
  uint32 dungeon_config_id = 4;       // dungeon_config_id for CreateScene
  repeated MatchTeam teams = 5;
  uint32 zone_id = 6;
}

message MatchTeam {
  uint32 team_index = 1;              // 0 = team A, 1 = team B
  repeated uint64 player_ids = 2;
}

// ----- 战报回放(battle-report-replay.md)-----

// 列表里的一名真人参战者:开战时的快照,不含宝宝和怪物。
message BattleReportMember {
  uint64 player_id = 1;
  uint32 team_index = 2;  // 0 = A 方(进攻),1 = B 方
  string name = 3;
  uint32 level = 4;
  uint32 class_id = 5;
}

// 战报列表的一条。终局提交时由 match 生成,之后不变。
message BattleReportSummary {
  uint64 battle_id = 1;
  MatchMode mode = 2;
  uint32 battle_config_id = 3;
  uint64 finished_at_ms = 4;               // 与 BattleResultEvent.finished_at_ms 同值(Unix 毫秒)
  eBattleOutcome outcome = 5;              // 本人胜负看本人在 members 里的 team_index
  uint32 total_rounds = 6;
  repeated BattleReportMember members = 7; // 按 team_index、player_id 升序
  bool has_replay = 8;                     // false = 回放正文没存下来(录制被丢弃),GetBattleReport 回 kMatchBattleReportNotFound
}

message ListBattleReportsRequest {}

message ListBattleReportsResponse {
  TipInfoMessage error_message = 1;
  repeated BattleReportSummary reports = 2;  // 新的在前,最多 100 条
}

message GetBattleReportRequest {
  uint64 battle_id = 1;
}

message GetBattleReportResponse {
  TipInfoMessage error_message = 1;  // 0 = 成功;不在本人列表里 / 没存回放 / 不存在,统一回 kMatchBattleReportNotFound
  BattleReplayEnvelope replay = 2;   // 成功时非空,就是存库的那一份
}

// ----- 战斗剧本(docs/design/battle-script.md §7) -----

// 玩家剧本当前提交版的审核状态
enum BattleScriptReviewState {
  BATTLE_SCRIPT_REVIEW_UNSPECIFIED = 0;
  BATTLE_SCRIPT_REVIEW_PENDING = 1;   // 待审
  BATTLE_SCRIPT_REVIEW_APPROVED = 2;  // 已通过
  BATTLE_SCRIPT_REVIEW_REJECTED = 3;  // 已驳回,原因看 reject_reason
}

// 本人的一份剧本
message PlayerBattleScriptView {
  uint64 script_id = 1;
  uint32 revision = 2;                       // 当前提交版;改写、删除都要带它
  BattleScript content = 3;                  // 当前提交版正文
  BattleScriptReviewState review_state = 4;  // 当前提交版的审核状态
  uint32 approved_revision = 5;              // 对局实际用的那一版;0 = 从未通过,不能选用
  string reject_reason = 6;
  uint64 submitted_ms = 7;                   // 当前版本的提交时刻(Unix 毫秒,match 库时间)
}

// 一条选用:某种对局用哪份剧本。模式 / 副本为 0 表示任意;建房按 具体 → 通用 取第一条
message BattleScriptLoadoutEntry {
  uint32 match_mode = 1;        // MatchMode 数值;0 = 任意模式
  uint32 battle_config_id = 2;  // Dungeon 表 id;0 = 任意副本
  eBattleScriptOrigin origin = 3;
  uint32 official_script_id = 4;  // origin = 官方
  uint64 player_script_id = 5;    // origin = 玩家:只能是本人已通过审核的剧本
}

message ListBattleScriptsRequest {}

message ListBattleScriptsResponse {
  TipInfoMessage error_message = 1;
  repeated BattleScript official_scripts = 2;      // 按 script_id 升序
  repeated PlayerBattleScriptView my_scripts = 3;  // 新提交的在前
  repeated BattleScriptLoadoutEntry loadout = 4;   // 按 (match_mode, battle_config_id) 升序
  uint32 max_scripts = 5;                          // 每人最多几份剧本
  uint32 max_script_bytes = 6;                     // 单份剧本序列化后的上限(gate 对客户端消息的 1KB 包长上限决定)
}

message SubmitBattleScriptRequest {
  uint64 script_id = 1;          // 0 = 新建
  uint32 expected_revision = 2;  // 改写时必须等于当前 revision;新建填 0
  BattleScript script = 3;       // 正文;其中的 script_id 一律按 0 存
}

message SubmitBattleScriptResponse {
  TipInfoMessage error_message = 1;   // 剧本不合法回 kMatchBattleScriptInvalid,位置看 invalid_detail
  PlayerBattleScriptView script = 2;  // 成功时为刚存下的这一版
  string invalid_detail = 3;          // 校验失败的位置与原因(英文,如 "script 0 role 2 rule 10: unknown skill 4242")
}

message DeleteBattleScriptRequest {
  uint64 script_id = 1;
  uint32 expected_revision = 2;
}

message DeleteBattleScriptResponse {
  TipInfoMessage error_message = 1;
}

message SetBattleScriptLoadoutRequest {
  BattleScriptLoadoutEntry entry = 1;  // origin = UNSPECIFIED 表示清除 (match_mode, battle_config_id) 这条选用
}

message SetBattleScriptLoadoutResponse {
  TipInfoMessage error_message = 1;
  repeated BattleScriptLoadoutEntry loadout = 2;  // 改完之后本人的全部选用
}

// ----- 论剑排位首发 V1(docs/design/ranked-play-season-ui-candidate.md) -----

enum RankedTier {
  RANKED_TIER_UNSPECIFIED = 0; // 本季未亮段
  RANKED_TIER_CHUSHI = 1;      // 初试: [0, 1520)（新号 1500 起步，净胜 2 场破冰升青锋）
  RANKED_TIER_QINGFENG = 2;    // 青锋: [1520, 1600)
  RANKED_TIER_YUNZHANG = 3;    // 云章: [1600, 1720)（封榜起享段位徽章与赛季称号）
  RANKED_TIER_TIANSHU = 4;     // 天枢: [1720, 1850)
  RANKED_TIER_WUSHUANG = 5;    // 无双: [1850, +∞)
}

enum RankedSeasonState {
  RANKED_SEASON_STATE_UNSPECIFIED = 0;
  RANKED_SEASON_STATE_ACTIVE = 1;    // 赛季进行中
  RANKED_SEASON_STATE_SETTLING = 2;  // 上季结算中(停招/排空/封榜/落奖)
  RANKED_SEASON_STATE_CLOSED = 3;    // 已封榜结案
}

enum RankedRewardKind {
  RANKED_REWARD_KIND_UNSPECIFIED = 0;
  RANKED_REWARD_AVATAR_PATTERN = 1;       // 累计 4 场: 主题头像纹样
  RANKED_REWARD_CARD_BACKGROUND = 2;      // 累计 8 场: 名片底纹
  RANKED_REWARD_TALISMAN = 3;             // 累计 12 场: 永久青云玉符
  RANKED_REWARD_TIER_BADGE = 4;           // 最高段位徽章(云章/天枢/无双)
  RANKED_REWARD_TIER_TITLE = 5;           // 赛季称号(云章/天枢/无双)
  RANKED_REWARD_CHAMPION_INSCRIPTION = 6; // 封榜第 1 且终分达到无双: 榜首题名
  RANKED_REWARD_WIN_MILESTONE = 7;        // 本季累计 6 胜: 永久「锋芒」赛季称号（可佩戴于称号栏）
}

enum RankedMatchRatingStatus {
  RANKED_MATCH_RATING_UNSPECIFIED = 0;
  RANKED_MATCH_RATING_PENDING = 1;    // 评分、场次与权益仍在异步权威落账
  RANKED_MATCH_RATING_CONFIRMED = 2;  // 已在 match SQL 权威落账完成
  RANKED_MATCH_RATING_VOID = 3;       // 本局作废(ABORT/VOID),无评分与场次变化
  RANKED_MATCH_RATING_ZERO_ROUND = 4; // 0 回合结束,无评分与场次变化
}

message RankedPresetView {
  uint32 preset_id = 1;
  uint32 role_kind = 2;            // 1 人物 / 2 宝宝
  string code = 3;
  string name = 4;
  string role_tag = 5;
  uint32 pet_table_id = 6;         // 仅宝宝预设非 0 (3 金猊 / 1 灵狐 / 2 石灵)
  repeated uint32 weights = 7;     // [体质, 灵力, 力量, 敏捷]
  repeated uint32 skill_ids = 8;
  repeated uint32 pet_entry_ids = 9;
  repeated uint32 pet_entry_points = 10;
  uint32 sort = 11;
  string desc = 12;
}

message RankedRewardEntitlement {
  uint32 season_id = 1;
  RankedRewardKind kind = 2;
  uint32 tier_value = 3;   // 里程碑场次(4/8/12)或 RankedTier(4=天枢,5=无双)
  string item_code = 4;    // 稳定展示资源代号(如 "s1_qingyun_talisman")
  uint64 granted_at_ms = 5;
}

message RankedCosmeticLoadout {
  string equipped_talisman_code = 1;       // "" = 隐藏或未拥有;默认佩戴最新已解锁玉符
  string equipped_avatar_pattern_code = 2; // "" = 不佩戴
  string equipped_card_bg_code = 3;        // "" = 不佩戴
  string equipped_title_code = 4;          // "" = 不佩戴
  bool hide_talisman = 5;                  // true = 显式隐藏玉符
}

message RankedSeasonInfo {
  uint32 season_id = 1;
  string season_key = 2;            // 排行榜 RankBoardKey.period(如 "s1")
  string season_name = 3;
  uint64 rank_generation = 4;       // 排行榜 RankBoardKey.generation
  uint32 rule_version = 5;
  RankedSeasonState state = 6;
  uint64 start_ms = 7;              // [start_ms, end_ms) 左闭右开 UTC 毫秒
  uint64 end_ms = 8;
  uint32 battle_config_id = 9;      // 排位专用模板 Dungeon.id(=5, time_limit=720)
  uint32 wait_prompt_seconds = 10;  // 120
  uint32 spread_tier1_seconds = 11; // 30
  uint32 spread_tier1_points = 12;  // 100
  uint32 spread_tier2_seconds = 13; // 90
  uint32 spread_tier2_points = 14;  // 200
  uint32 spread_tier3_points = 15;  // 300
  uint64 champion_player_id = 16;   // 封榜后填;无达标者为 0(空缺)
  string champion_name = 17;
  int64 champion_rating_centi = 18;
  bool rank_board_sealed = 19;
  // 服务端当前开放的正式会武每侧人数档（来自 PlayMode.allowed_team_sizes，如首测 [1, 3]，在线达标后放开 [1, 3, 5]）。
  repeated uint32 allowed_team_sizes = 20;
  // true = 正式人宠会武使用本人真实养成（装备/词条/法宝/技能/宝宝），免费预设仅用于轮换娱乐场。
  bool uses_own_progression = 21;
  // 常驻正式会武主力档全集（如 [1, 3, 5]），用于客户端区分主力待开放档与特殊玩法档。
  repeated uint32 primary_team_sizes = 22;
  // 归属特殊玩法开关的人数档（如 [2, 4]，对应帮会 2V2 会武 / 主题 4V4 特殊赛）。
  repeated uint32 special_team_sizes = 23;
  // 权威五段下限（×100，客户端直读用于展示“距下一段还差 X 分”，严禁硬编码）。
  uint32 tier_qingfeng_centi = 24;
  uint32 tier_yunzhang_centi = 25;
  uint32 tier_tianshu_centi = 26;
  uint32 tier_wushuang_centi = 27;
  // 本季胜场锋芒称号里程碑门槛（V2=6）。
  uint32 milestone_win_matches = 28;
}

message RankedPlayerSeasonSummary {
  uint32 season_id = 1;
  string season_key = 2;
  bool qualified = 3;              // 本季是否已完成首场有效参与(亮段且上榜)
  int64 rating_centi = 4;          // 当前或终局分(×100;前端按 floor(rating_centi/100) 展示)
  RankedTier current_tier = 5;     // 未亮段为 UNSPECIFIED
  int64 peak_rating_centi = 6;     // 本季最高有效分(×100)
  RankedTier peak_tier = 7;        // 本季最高段位
  uint32 valid_matches = 8;        // 本季跨规模有效参与场次
  uint32 wins = 9;
  uint32 losses = 10;
  uint32 draws = 11;
  uint64 qualified_at_ms = 12;     // 本季首次亮段时刻
  uint32 milestone_bits = 13;      // bit0=4场头像纹样, bit1=8场名片底纹, bit2=12场青云玉符, bit3=6胜锋芒称号
  uint64 final_rank = 14;          // 封榜后最终名次;0=未上榜或未封榜
  bool champion_awarded = 15;      // 封榜第 1 且终分达到无双
  uint32 current_win_streak = 16;  // 本季当前有效连胜场次（胜+1、负归0、平/作废不变；纯荣誉）
  uint32 best_win_streak = 17;     // 本季最高连胜纪录（纯荣誉）
}

message RankedBattleSettlementView {
  uint64 battle_id = 1;
  uint32 season_id = 2;
  uint32 team_size = 3;
  RankedMatchRatingStatus status = 4;
  eBattleOutcome outcome = 5;
  uint32 player_team_index = 6;
  uint32 total_rounds = 7;
  bool participated = 8;           // 本人是否达成有效参与
  bool fled = 9;
  int64 rating_before_centi = 10;
  int64 rating_after_centi = 11;
  sint64 rating_delta_centi = 12;
  RankedTier tier_before = 13;     // 本季首场亮段前为 UNSPECIFIED
  RankedTier tier_after = 14;
  bool newly_qualified = 15;       // 本局是否首次完成本季亮段
  uint32 season_valid_matches_after = 16;
  repeated RankedRewardEntitlement newly_unlocked_rewards = 17;
  uint64 settled_at_ms = 18;
  uint32 character_preset_id = 19;
  uint32 pet_preset_id = 20;
  uint32 win_streak_after = 21;      // 本局结算后的当前连胜数
  uint32 ended_opponent_streak = 22; // 若本方获胜并终结了 >=3 连胜对手，记录被终结的最高连胜数（否则 0）
  bool revenged_rival = 23;          // 论剑 V6：本局是否触发「雪耻复仇」荣誉印章
  string revenged_opponent_name = 24;// 论剑 V6：雪耻复仇对手名
  uint32 revenged_wins_after = 25;   // 论剑 V6：含本局后的对阵胜场
  uint32 revenged_losses_after = 26; // 论剑 V6：含本局后的对阵负场
}

// 论剑 V6 个人宿敌账本摘要（用于大厅/赛季记录展示常遇宿敌战绩）。
message RankedRivalrySummary {
  uint64 opponent_id = 1;
  string opponent_name = 2;
  uint32 wins = 3;
  uint32 losses = 4;
  uint32 draws = 5;
  uint32 last_outcome = 6; // 1 胜 / 2 负 / 3 平
  uint64 last_battle_id = 7;
  uint64 updated_ms = 8;
}

// 论剑 V6 大厅「问道名局」高段热门流派卡片（支持公开战报回放观摩 + 一键套用赛季印与首发宠）。
message RankedFeaturedBuildView {
  string build_key = 1;
  uint32 season_seal_id = 2;
  uint32 starter_pet_table_id = 3;
  repeated uint32 core_skill_ids = 4; // 最多 4 招
  uint32 appearances = 5;
  uint32 wins = 6;
  uint32 high_tier_wins = 7;          // 达到青锋及以上段位的胜场数
  uint64 featured_battle_id = 8;      // 可直接调用 GetBattleReport 观摩的高段真实名局战报 ID
  uint64 featured_player_id = 9;
  string featured_player_name = 10;
  int64 featured_rating_centi = 11;
  uint32 featured_team_size = 12;
  uint32 featured_total_rounds = 13;
  uint64 updated_ms = 14;
}

message GetRankedProfileRequest {
  bool include_history = 1; // true 同时返回往季记录与已解锁权益
}
message GetRankedProfileResponse {
  TipInfoMessage error_message = 1;
  RankedSeasonInfo current_season = 2;
  RankedPlayerSeasonSummary current_progress = 3;
  RankedPresetSelection selected_presets = 4;        // 单排默认预设(默认 101 破阵 + 203 护主)
  RankedCosmeticLoadout cosmetic_loadout = 5;
  repeated RankedPresetView presets = 6;             // 当前生效的 6 套正式预设
  repeated RankedRewardEntitlement entitlements = 7; // 全部永久/赛季展示权益
  repeated RankedPlayerSeasonSummary history = 8;    // 往季记录(season_id 降序)
  repeated RankedSeasonInfo past_seasons = 9;        // 往季赛季摘要(含封榜/榜首题名)
  uint64 server_time_ms = 10;
  repeated RankedFeaturedBuildView featured_builds = 11; // 论剑 V6：本季问道名局高段热门流派（Top 5）
  repeated RankedRivalrySummary top_rivals = 12;         // 论剑 V6：本人本季宿敌恩怨账本（Top 8）
}

message SaveRankedPresetRequest {
  uint32 character_preset_id = 1;
  uint32 pet_preset_id = 2;
  uint32 rule_version = 3;
}
message SaveRankedPresetResponse {
  TipInfoMessage error_message = 1;
  RankedPresetSelection selected_presets = 2;
  uint32 rule_version = 3;
}

message UpdateRankedCosmeticRequest {
  RankedCosmeticLoadout loadout = 1;
}
message UpdateRankedCosmeticResponse {
  TipInfoMessage error_message = 1;
  RankedCosmeticLoadout loadout = 2;
}

message GetRankedBattleResultRequest {
  uint64 battle_id = 1; // 0 = 查询本人最近一局排位结果
}
message GetRankedBattleResultResponse {
  TipInfoMessage error_message = 1;
  RankedBattleSettlementView result = 2;
}

// ----- 全服赛季战队锦标赛《群仙问道赛》V1(docs/design/season-team-tournament-v1.md) -----

enum TournamentStage {
  TOURNAMENT_STAGE_UNSPECIFIED  = 0;
  TOURNAMENT_STAGE_REGISTRATION = 1; // 报名建队与阵容锁定期
  TOURNAMENT_STAGE_QUALIFIER    = 2; // 宽时间窗海选积分赛
  TOURNAMENT_STAGE_KNOCKOUT     = 3; // 全服单败淘汰赛与总决赛
  TOURNAMENT_STAGE_SETTLED      = 4; // 封榜领奖与冠军殿堂展示期
}

enum TournamentSquadState {
  TOURNAMENT_SQUAD_STATE_UNSPECIFIED = 0;
  TOURNAMENT_SQUAD_STATE_DRAFT       = 1; // 筹备中(未锁定,可增删改成员)
  TOURNAMENT_SQUAD_STATE_REGISTERED  = 2; // 已锁定本赛季报名(海选/淘汰中有效)
  TOURNAMENT_SQUAD_STATE_ELIMINATED  = 3; // 已淘汰或海选未晋级
  TOURNAMENT_SQUAD_STATE_CHAMPION    = 4; // 本赛季全服总冠军
  TOURNAMENT_SQUAD_STATE_DISBANDED   = 5; // 报名期已解散或截止未达人数作废
}

enum TournamentMemberRole {
  TOURNAMENT_MEMBER_ROLE_UNSPECIFIED = 0;
  TOURNAMENT_MEMBER_ROLE_CAPTAIN     = 1; // 队长(默认首发)
  TOURNAMENT_MEMBER_ROLE_STARTER     = 2; // 首发队员
  TOURNAMENT_MEMBER_ROLE_SUBSTITUTE  = 3; // 替补队员
}

enum TournamentMatchPhase {
  TOURNAMENT_MATCH_PHASE_UNSPECIFIED = 0;
  TOURNAMENT_MATCH_PHASE_QUALIFIER   = 1; // 海选积分赛
  TOURNAMENT_MATCH_PHASE_KNOCKOUT    = 2; // 淘汰赛/总决赛
  TOURNAMENT_MATCH_PHASE_WARMUP      = 3; // V3: 赛前零积分热身约战
}

enum TournamentSquadEmblem {
  TOURNAMENT_SQUAD_EMBLEM_UNSPECIFIED = 0; // 未选(服务端归一化为 1 青剑)
  TOURNAMENT_SQUAD_EMBLEM_SWORD       = 1; // 青剑(诛邪剑)
  TOURNAMENT_SQUAD_EMBLEM_TAIJI       = 2; // 太极(两仪图)
  TOURNAMENT_SQUAD_EMBLEM_FURNACE     = 3; // 丹炉(金丹炉)
  TOURNAMENT_SQUAD_EMBLEM_LOTUS       = 4; // 青莲(玉清莲)
  TOURNAMENT_SQUAD_EMBLEM_CRANE       = 5; // 玄鹤(仙鹤印)
  TOURNAMENT_SQUAD_EMBLEM_THUNDER     = 6; // 雷印(五雷诀)
  TOURNAMENT_SQUAD_EMBLEM_BAGUA       = 7; // 八卦(先天卦)
  TOURNAMENT_SQUAD_EMBLEM_CAULDRON    = 8; // 云鼎(玄天鼎)
}

enum TournamentMatchState {
  TOURNAMENT_MATCH_STATE_UNSPECIFIED      = 0;
  TOURNAMENT_MATCH_STATE_WAITING_OPPONENT = 1; // 海选等待匹配对手 / 淘汰赛等待对阵双方就绪
  TOURNAMENT_MATCH_STATE_READY            = 2; // 双方已配对/待备战开打
  TOURNAMENT_MATCH_STATE_IN_BATTLE        = 3; // 激战中(支持全服 L2 公开观战)
  TOURNAMENT_MATCH_STATE_FINISHED         = 4; // 已决胜负/平局
  TOURNAMENT_MATCH_STATE_BYE              = 5; // 轮空自动晋级
  TOURNAMENT_MATCH_STATE_FORFEIT          = 6; // 超时弃权裁决
  TOURNAMENT_MATCH_STATE_INTERMISSION     = 7; // V2: BO3 局间灵脉公示与 60 秒换阵倒计时中
}

enum TournamentRewardTierKind {
  TOURNAMENT_REWARD_TIER_UNSPECIFIED = 0;
  TOURNAMENT_REWARD_TIER_CHAMPION    = 1; // 冠军(第1名)
  TOURNAMENT_REWARD_TIER_RUNNER_UP   = 2; // 亚军(第2名)
  TOURNAMENT_REWARD_TIER_TOP4        = 3; // 四强(第3-4名)
  TOURNAMENT_REWARD_TIER_TOP8        = 4; // 八强(第5-8名)
  TOURNAMENT_REWARD_TIER_TOP16       = 5; // 十六强(第9-16名)
  TOURNAMENT_REWARD_TIER_PARTICIPANT = 6; // 参赛保底(全队完赛>=2场)
  TOURNAMENT_REWARD_TIER_CHEER       = 7; // 免费助威命中(所选队进四强/夺冠)
  TOURNAMENT_REWARD_TIER_THIRD_PLACE = 8; // V3: 季军(第3名,启用季军争夺战时独立发放)
  TOURNAMENT_REWARD_TIER_PREDICTION  = 9; // V3: 神机竞猜达标纪念礼(零成本免费预测命中达标)
}

enum TournamentRewardDeliveryState {
  TOURNAMENT_REWARD_DELIVERY_UNSPECIFIED = 0;
  TOURNAMENT_REWARD_DELIVERY_CLAIMABLE   = 1; // 已结算待领取/待投递
  TOURNAMENT_REWARD_DELIVERY_CLAIMED     = 2; // 已领取/已发至邮箱
  TOURNAMENT_REWARD_DELIVERY_ABANDONED   = 3; // 异常放弃待人工核查
}

message TournamentSeasonView {
  uint32 season_id = 1;
  string season_key = 2;
  string season_name = 3;
  uint32 rule_version = 4;
  TournamentStage stage = 5;
  bool enabled = 6;
  uint32 battle_team_size = 7;          // 单场出战人数(首测=3)
  uint32 roster_max_size = 8;           // 名册上限(首测=4)
  uint32 min_level = 9;                 // 最低等级要求(首测=15)
  uint32 qualifier_max_matches = 10;    // 海选最多场次(首测=6)
  uint32 participation_min_matches = 11;// 保底完赛场次(首测=2)
  uint32 knockout_max_teams = 12;       // 最大淘汰席位(首测=16)
  uint32 knockout_team_count = 13;      // 本季实际动态淘汰席位(0/2/4/8/16)
  uint32 registered_squad_count = 14;   // 当前全服已报名锁定战队数
  uint64 registration_start_ms = 15;
  uint64 qualifier_start_ms = 16;
  uint64 knockout_start_ms = 17;
  uint64 settle_start_ms = 18;
  uint64 end_ms = 19;
  uint64 champion_squad_id = 20;
  string champion_squad_name = 21;
  string champion_member_summary = 22;  // 冠军成员摘要(供冠军殿堂展示)
  reserved 23, 24;                      // 原 champion_salute_count / saluted_today（每日观道致敬已移除）
  reserved "champion_salute_count", "saluted_today";
  repeated TournamentMemberView champion_members = 25; // V2: 冠军战队成员外观快照
  uint32 champion_emblem_id = 26;                     // V3: 冠军战队队徽(1..8)
  uint64 third_place_squad_id = 27;                   // V3: 季军战队 ID(0=无季军战或未决出)
  string third_place_squad_name = 28;                 // V3: 季军战队名
  uint32 third_place_emblem_id = 29;                  // V3: 季军战队队徽(1..8)
  uint64 final_mvp_player_id = 30;                    // V3: 总决赛问鼎之星(MVP)玩家 ID
  string final_mvp_player_name = 31;                  // V3: 总决赛 MVP 角色名
  uint32 final_mvp_score = 32;                        // V3: 总决赛 MVP 综合战功分
  uint32 champion_honor_bits = 33;                    // V4: 冠军战队赛季荣耀铭牌位图(bit 0..5)
}

message TournamentMemberView {
  uint64 player_id = 1;
  string player_name = 2;
  uint32 zone_id = 3;
  TournamentMemberRole role = 4;
  uint32 starter_slot = 5; // 1..battle_team_size 为首发位,0 为替补
  uint64 joined_ms = 6;
  uint32 class_id = 7;        // V2: 门派/职业表 ID(0=未知,客户端回落中性青玉剪影)
  uint32 gender = 8;          // V2: 性别(0=未知)
  string appearance_id = 9;   // V2: 外观立绘标识(空=按 class_id+gender 解析)
}

message TournamentSquadView {
  uint64 squad_id = 1;
  uint32 season_id = 2;
  string name = 3;
  uint64 captain_player_id = 4;
  TournamentSquadState state = 5;
  uint32 member_count = 6;
  uint32 qualifier_points = 7;
  uint32 qualifier_played = 8;
  uint32 qualifier_wins = 9;
  uint32 qualifier_losses = 10;
  uint32 qualifier_draws = 11;
  uint32 seed_rank = 12;   // 海选定档名次(1起,0=未定档)
  uint32 final_rank = 13;  // 赛季最终名次(1起,0=未定档)
  uint32 cheer_count = 14; // 全服免费助威票数
  uint64 registered_ms = 15;
  repeated TournamentMemberView members = 16;
  uint32 emblem_id = 17;  // V3: 官方预设道家队徽(1..8)
  uint32 honor_bits = 18; // V4: 战队赛季荣耀铭牌位图(bit 0..5)
}

message TournamentInviteView {
  uint64 squad_id = 1;
  uint32 season_id = 2;
  string squad_name = 3;
  uint64 inviter_player_id = 4;
  string inviter_name = 5;
  uint32 current_member_count = 6;
  uint32 roster_max_size = 7;
  uint64 created_ms = 8;
  uint64 expires_ms = 9;
}

message TournamentMatchView {
  uint64 match_id = 1;
  uint32 season_id = 2;
  TournamentMatchPhase phase = 3;
  uint32 round_index = 4;        // 海选轮次/淘汰赛轮次(1起)
  uint32 slot_index = 5;         // 淘汰赛对阵槽位(0起)
  uint64 squad_a_id = 6;
  string squad_a_name = 7;
  uint32 squad_a_seed = 8;
  uint64 squad_b_id = 9;         // 0 表示轮空或海选待配对
  string squad_b_name = 10;
  uint32 squad_b_seed = 11;
  bool ready_a = 12;
  bool ready_b = 13;
  TournamentMatchState state = 14;
  uint64 battle_id = 15;         // 开战后非 0,可直接传给 WatchBattle / GetBattleReport
  uint64 winner_squad_id = 16;
  eBattleOutcome outcome = 17;
  bool featured_spectate = 18;   // true 表示已标全服 L2 推荐观战
  uint64 scheduled_start_ms = 19;
  uint64 deadline_ms = 20;
  uint64 finished_ms = 21;
  uint32 best_of = 22;                                       // V2: 1=BO1, 3=BO3
  uint32 current_game_index = 23;                            // V2: 当前小局序号(1..best_of)
  uint32 wins_a = 24;                                        // V2: A 队小局胜场
  uint32 wins_b = 25;                                        // V2: B 队小局胜场
  TournamentLeylineElement current_leyline_element = 26;     // V2: 当前/下一小局五行灵脉阵眼
  repeated TournamentLeylineElement leyline_sequence = 27;   // V2: BO3 全部灵脉公示顺序(不重复)
  uint64 intermission_deadline_ms = 28;                      // V2: BO3 局间换阵截止时刻(Unix 毫秒)
  bool public_replay_available = 29;                         // V2: 是否向全服公开战报回放
  repeated uint64 game_battle_ids = 30;                      // V2: 已开战各小局 battle_id 列表(按局序)
  uint32 squad_a_emblem_id = 31;                             // V3: A 队队徽(1..8)
  uint32 squad_b_emblem_id = 32;                             // V3: B 队队徽(1..8)
  bool is_third_place = 33;                                  // V3: true=季军争夺战(铜牌战)
  uint64 mvp_player_id = 34;                                 // V3: 本场问鼎之星(MVP)玩家 ID(0=未评出)
  string mvp_player_name = 35;                               // V3: 本场 MVP 角色名
  uint64 mvp_squad_id = 36;                                  // V3: 本场 MVP 所属战队 ID
  uint32 mvp_score = 37;                                     // V3: 本场 MVP 综合战功分
  uint64 mvp_damage = 38;                                    // V3: 本场 MVP 累计伤害
  uint64 mvp_healing = 39;                                   // V3: 本场 MVP 累计治疗与护盾
  uint32 mvp_controls = 40;                                  // V3: 本场 MVP 累计成功硬控次数
  uint64 my_predicted_squad_id = 41;                         // V3: 当前查询玩家对本场淘汰赛的免费预测战队 ID(0=未预测)
  uint32 predict_count_a = 42;                               // V3: 全服预测 A 队胜票数
  uint32 predict_count_b = 43;                               // V3: 全服预测 B 队胜票数
  TournamentLeylineElement banned_leyline_a = 44;            // V4: BO3 赛前 A 队队长禁选的灵脉(0=未禁)
  TournamentLeylineElement banned_leyline_b = 45;            // V4: BO3 赛前 B 队队长禁选的灵脉(0=未禁)
}

message TournamentRewardItem {
