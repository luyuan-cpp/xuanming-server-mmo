syntax = "proto3";
option go_package = "login/proto/common/database";

import "proto/db/proto_option.proto";
import "proto/common/rollback/transaction_log.proto";
import "proto/common/rollback/player_snapshot.proto";
import "proto/common/base/role_admission.proto";

// ============================================================================
// Transaction Log — append-only audit trail for all bidirectional operations.
// ============================================================================
message transaction_log
{
  option(OptionTableName) = "transaction_log";
  option(OptionPrimaryKey) = "tx_id";
  // 与 data_service 手写 DDL(transaction_log_store.go)逐条对齐的四条联合索引。
  // proto2mysql 语义:分号分隔多索引、逗号 = 联合索引;原来的单串
  // "from_player,to_player,item_uuid,timestamp" 会被解释成一条 4 列联合索引,
  // 对按 to_player / tx_type 单独过滤的查询没用。
  option(OptionIndex) = "from_player,timestamp_sec;to_player,timestamp_sec;item_config_id,timestamp_sec;tx_type,timestamp_sec";
  // 雪花主键 + 全服最高频追加写,按 §D3 处方 NONCLUSTERED + 打散(global-data-layer-tidb-decision.md)
  option(OptionTiDBNonclusteredPK) = true;
  option(OptionTiDBShardRowIDBits) = 4;
  option(OptionTiDBPreSplitRegions) = 4;

  uint64 tx_id = 1;
  // 列名与手写 DDL 统一为 timestamp_sec(Unix 秒)。proto2mysql 按 pb:N 字段号识别列,
  // 改名不需要 OptionOldName;且改名时全仓尚无一行数据。
  uint64 timestamp_sec = 2;
  uint32 tx_type = 3;           // TransactionType enum
  uint64 from_player = 4;
  uint64 to_player = 5;
  uint64 item_uuid = 6;
  uint32 item_config_id = 7;
  uint32 item_quantity = 8;
  uint32 currency_type = 9;
  int64 currency_delta = 10;
  uint64 balance_before = 11;
  uint64 balance_after = 12;
  uint64 correlation_id = 13;
  // proto2mysql 把 string 映射成 MEDIUMTEXT,已比手写 DDL 的 VARCHAR(1024) 宽,无需额外选项。
  string extra = 14;
  // 记录时所在的 zone,镜像 TransactionLogEntry.zone_id(transaction_log.proto 字段 15)。
  // 表已定在全局库一处,没有这一列就分不清同一 tx 来自哪个 zone;
  // data_service 的 Kafka 消费者按列名自动探测,老表缺列时按 0 写入,不需要迁移开关。
  uint32 zone_id = 15;
}

// ============================================================================
// Player snapshot table (for rollback) — 从 mysql_database_table.proto 移入:
// 导表器按那个文件的 message 成员生成 zone 库建表清单
// (generated/data/mysql_database_table_list.json),而本表只该存在于全局库
// (data_service)一处。决策见 docs/design/node-id-overhaul-plan-20260908.md。
// ============================================================================
message player_snapshot
{
  option(OptionTableName) = "player_snapshot";
  option(OptionPrimaryKey) = "id";
  // 分号 = 两条独立索引(proto2mysql 语义:分号分隔多索引,逗号 = 联合索引)。
  // snapshot_guid 刻意用普通 INDEX 而不是 UNIQUE:GM/data_service 产生的行没有 guid,
  // proto2mysql 的 nullable 选项只去掉 NOT NULL、仍保留 DEFAULT 0,且写入路径对未设置的
  // 标量一律绑 0 —— UNIQUE 会让第二条 GM 行就撞键。去重责任在消费者:落库前按
  // snapshot_guid 先查后插(check-then-insert),见 docs/design/node-id-overhaul-plan-20260908.md §2.0c。
  // (zone_id, created_at) 是 RollbackZone 的扫描键(GetSnapshotPlayerIDsByZone:
  // WHERE zone_id=? AND created_at<=?)。此前只存在于手写 DDL,proto 里漏了,
  // 于是 store 侧靠 extraIndexes 兜底建它 —— 补进来之后那段兜底会自行失效
  // (它按"想要的索引已被覆盖"判断)。
  option(OptionIndex) = "player_id;snapshot_guid;zone_id,created_at";
  // 主键是应用向发号器申请的打散行号(player-data-tidb-scaling-plan.md §6.4),不依赖库的自增。
  // 行数据按 _tidb_rowid 存,所以 §D3 的 NONCLUSTERED + 打散照旧保留。
  option(OptionTiDBNonclusteredPK) = true;
  option(OptionTiDBShardRowIDBits) = 4;
  option(OptionTiDBPreSplitRegions) = 4;

  uint64 id = 1;             // 行号,biz_tag = snapshot_row。打散、不连续、不代表先后,排序看 created_at
  uint64 player_id = 2;      // Player this snapshot belongs to
  uint32 zone_id = 3;        // Player's home zone at snapshot time
  uint32 snapshot_type = 4;  // SnapshotType enum value
  uint64 created_at = 5;     // Unix timestamp of snapshot creation
  string reason = 6;         // Reason / description
  string operator = 7;       // GM operator who created it
  bytes  data = 8;           // Serialized snapshot data (proto SnapshotData)
  // C++ scene 经 Kafka 送来的 PlayerSnapshotEntry.snapshot_id(SnowFlake)。GM 行为 0。
  // 不改主键:rollback_audit_log.snapshot_id_used 引用的是 id,换主键等于篡改历史审计。
  uint64 snapshot_guid = 9;
  // 来源:0 = GM/data_service 直接写入(data 列是 Redis 字段图 JSON),
  //       1 = C++ scene Kafka 落库(data 列是 PlayerSnapshotEntry 的两个 proto blob)。
  // 两种格式不兼容,回滚读路径在学会解 proto blob 之前必须先过滤 source=0。
  uint32 source = 10;
}

// ============================================================================
// Rollback audit log — 同 player_snapshot,只在全局库(data_service)一处。
// ============================================================================
message rollback_audit_log
{
  option(OptionTableName) = "rollback_audit_log";
  option(OptionPrimaryKey) = "id";
  // 主键是应用向发号器申请的打散行号(player-data-tidb-scaling-plan.md §6.4),不依赖库的自增。
  // 行数据按 _tidb_rowid 存,所以 §D3 的 NONCLUSTERED + 打散照旧保留。
  option(OptionTiDBNonclusteredPK) = true;
  option(OptionTiDBShardRowIDBits) = 4;
  option(OptionTiDBPreSplitRegions) = 4;

  uint64 id = 1;                 // 行号,biz_tag = rollback_audit。不代表先后,排序看 created_at
  uint64 player_id = 2;          // 0 for zone/server rollback
  uint32 zone_id = 3;            // 0 for server-wide rollback
  uint32 rollback_type = 4;      // 1=player, 2=zone, 3=server
  uint64 snapshot_id_used = 5;   // Which snapshot was restored (single-player only)
  uint64 pre_rollback_snapshot_id = 6;  // Safety snapshot before rollback
  uint64 target_time = 7;        // Target rollback timestamp
  uint32 players_affected = 8;
  uint32 players_failed = 9;
  string reason = 10;
  string operator = 11;          // GM operator
  uint64 created_at = 12;        // When the rollback was executed
  // 收口 DDL/proto 漂移:data_service 手写 DDL(snapshot_store.go)早已有此列,proto 一直缺。
  uint32 orphans_cleaned = 13;   // RollbackZone 清理掉的孤儿玩家数
}

// ============================================================================
// Player Debt — deferred-clawback (补缴) records; separate from CurrencyComp
// so GM tool can query/manage offline.
//
// 【已弃用,2026-10-15,docs/design/player-inbox-service.md D9】不再接任何读写,新代码禁止引用。
// - 欠款与封锁的唯一事实源是玩家存档里的 CurrencyComp.debts / blocked_types(proto/common/component/currency_comp.proto),
//   随 player_database 落盘;本表全仓没有任何读写方,再接一份就是第二份事实源(DRY)。
// - GM 挂欠款 / 封锁获取走玩家收件箱:PlayerInboxAdmin.GmSanctionPlayer 入箱 → owner scene 执行 CurrencySystem::AttachDebt 等。
// - 本批只加注释、保留定义(不改字段,不动生成产物的结构);是否删除另行评审。
// ============================================================================
message player_debt
{
  option(OptionTableName) = "player_debt";
  option(OptionPrimaryKey) = "player_id,currency_type";
  option(OptionIndex) = "player_id";

  uint64 player_id = 1;
  uint32 currency_type = 2;
  uint64 owed_amount = 3;
  uint64 paid_amount = 4;
  bool frozen = 5;              // GM freeze — pauses auto-deduction
  string reason = 6;
  string gm_operator = 7;
  uint64 created_at = 8;
  uint64 expires_at = 9;        // 0 = never
  uint64 completed_at = 10;     // 0 = not yet completed
}

// ============================================================================
// Rollback Audit — every rollback operation is logged for accountability.
// ============================================================================
message rollback_audit
{
  option(OptionTableName) = "rollback_audit";
  option(OptionPrimaryKey) = "audit_id";
  option(OptionIndex) = "player_id";

  uint64 audit_id = 1;
  uint64 player_id = 2;
  uint64 snapshot_id = 3;       // Which snapshot was used
  uint64 target_time = 4;       // The time the player was rolled back to
  uint64 executed_at = 5;       // When the rollback was executed
  string gm_operator = 6;
  string reason = 7;
  string scope = 8;             // "full" or comma-separated service names (e.g. "currency,bag")
  uint32 items_restored = 9;
  uint32 items_skipped = 10;    // Skipped due to transfer records
  uint32 currencies_restored = 11;
  uint32 currencies_skipped = 12;
  string diff_json = 13;        // Serialized SnapshotDiff for human review
}

// ============================================================================
// Player Name — 玩家名字注册表(全服唯一)。
// 放在本文件而不是 mysql_database_table.proto:导表器按那个文件的 message 成员生成
// go/db 的 zone 库建表清单(generated/data/mysql_database_table_list.json),而名字
// 唯一性只有"全服一张表"才成立 —— 每个 zone 一份就变成"区内唯一",跨区重名。
// 真源在这里;zone 库 player_database.profile_component 与账号记录
// AccountSimplePlayer.name 都只是只读副本,可能缺失,读侧回源 BatchGetPlayerName。
//
// 【为什么这张表不靠 proto2mysql 建】proto2mysql v0.1.0 把 string 渲染成 MEDIUMTEXT
// (proto2mysql.go:259),而 TEXT 列上建 UNIQUE KEY 会被 MySQL 以 1170(BLOB/TEXT
// column used in key specification without a key length)拒掉。所以本表走
// store/schema.go 的 bootstrap DDL(name/name_norm 建成 VARCHAR),本 message
// 只作为列漂移校验的事实源 —— 改了这里就必须同步改 bootstrap DDL,否则启动校验会报。
// VARCHAR 长度 < 191,唯一键覆盖整列,不需要 D-14 §2 的 191 前缀写法。
//
// D-14 §2 复核:主键是整数列 player_id;全表只有一个唯一键(name_norm);
// 按 §D3 声明 NONCLUSTERED + 打散(雪花 player_id 做主键 = 写热点)。
// 设计见 docs/design/guild-phase2/03-names.md §3.2 / §3.3。
// ============================================================================
message player_name
{
  option(OptionTableName) = "player_name";
  option(OptionPrimaryKey) = "player_id";
  option(OptionUniqueKey) = "name_norm";
  option(OptionTiDBNonclusteredPK) = true;
  option(OptionTiDBShardRowIDBits) = 4;
  option(OptionTiDBPreSplitRegions) = 4;

  uint64 player_id  = 1;
  // NFKC 归一 + 去首尾空白后的展示名(保留大小写),下发客户端的就是这一份。
  string name       = 2;
  // name 再转小写;唯一性只看它。展示名与唯一键分列是为了"显示保留大小写、
  // 判重忽略大小写",两列必须由同一套规则包(go/shared/playername)一起算出来。
  string name_norm  = 3;
  // 登记时刻 Unix 毫秒(data_service 进程时钟)。ReleasePlayerName 的无 token 分支
  // 只删落在 PlayerName.ReleaseWindow 内的行(login 建角失败的补偿),
  // 超窗的孤儿行只能由运维带 x-admin-token 清 —— 没有这一列就没法区分两者。
  uint64 created_ms = 4;
}

// ============================================================================
// 路由表(玩家归属与落点映射持久化 D1,docs/design/player-route-mapping-durability-proposal.md §3.2 / §13)。
//
// 下面五个 message **只作列漂移守卫的事实源**(与 player_name 同一模式):
// 表由 go/data_service/internal/store/schema.go 的 bootstrap DDL 预建(要 VARCHAR、可空列、CHECK、
// 带片前缀的二级索引,proto2mysql 都生成不了),**不交给 proto2mysql 建表或同步**。迁移期按这里的字段名
// 查线上表的列齐不齐、按 OptionPrimaryKey 查主键列序(schema.go 的 assertRouteTableShapes)。
// 所以:改了这里必须同步改 bootstrap DDL,反之亦然,否则启动期迁移直接拒绝。
//
// 字段号:player_route 沿用 DDL 列注释里预留的 pb:1..10(route_shard 是 10,player_id 仍是 1);
// 另外四张的字段号按 DDL 列序新定,并同步写进 DDL 的列注释 pb:N(route_store_test 钉住两边一致)。
// 与 §4.3 同规矩:上线后不复用,删字段写 reserved。
// 库里可为 NULL 的列在这里用零值表达(0 / 空串 = NULL),与 store.RouteRow 的约定一致;
// 本 message 不是读写载体,读写只在 store 的 SQL 里,所以不用 optional。
// 主键是聚簇的(TiDB CLUSTERED,见 schema.go 注释),不声明 OptionTiDBNonclusteredPK;
// 二级索引只写在 DDL 里,这里不声明 OptionIndex(这几张表不跑 ensureIndexes)。
// 放在本文件而不是 mysql_database_table.proto 的原因:路由表只在全局库。
// ============================================================================

// player_route:每个玩家一行,home 与落点同行。
message player_route
{
  option(OptionTableName) = "player_route";
  option(OptionPrimaryKey) = "route_shard,player_id";

  uint64 player_id         = 1;
  uint32 home_zone         = 2;  // 0 = NULL(没有归属区)
  uint32 storage_id        = 3;  // 0 = NULL;与 placement_version 同 NULL(chk_route_place)
  uint64 placement_version = 4;  // 0 = NULL;有落点时 >= 1
  string frozen_run_id     = 5;  // 空串 = NULL;非空 = 搬库冻结态
  uint64 rev               = 6;  // 本行任一列变化 +1,是行版本
  string updated_by        = 7;  // 写者标识(ASCII,<= 96)
  uint64 created_at_ms     = 8;  // 库时钟 Unix 毫秒
  uint64 updated_at_ms     = 9;  // 库时钟 Unix 毫秒
  uint32 route_shard       = 10; // = player_id % 64(placement.RouteRowShards,chk_route_shard)
}

// zone_merged_into:合服映射(源区 → 目标区)的永久记录,归属解析的真源(别名合服)。
message zone_merged_into
{
  option(OptionTableName) = "zone_merged_into";
  option(OptionPrimaryKey) = "src_zone";

  uint32 src_zone     = 1;
  uint32 dst_zone     = 2;
  string run_id       = 3;
  uint64 merged_at_ms = 4;  // 库时钟 Unix 毫秒
}

// route_meta:开关表,单行(id=1),库世代与可写开关。
message route_meta
{
  option(OptionTableName) = "route_meta";
  option(OptionPrimaryKey) = "id";

  uint32 id         = 1;
  string generation = 2;  // 1..32 位 hex
  uint32 writable   = 3;  // 0 = 全体映射写者拒写
  uint64 writer_epoch = 4;
  uint64 catalog_revision = 5;
  bytes freeze_run_id = 6;
}

// 全局账号角色目录；不含认证凭据。短字符串主键由 data_service 的 bootstrap
// DDL 建为 VARBINARY(191)，本 proto 同时是列与主键形状守卫的事实源。
message account_directory {
  option(OptionTableName) = "account_directory";
  option(OptionPrimaryKey) = "account";
  string account = 1;
  uint64 created_ms = 2;
}

message account_role {
  option(OptionTableName) = "account_role";
  option(OptionPrimaryKey) = "player_id";
  option(OptionTiDBNonclusteredPK) = true;
  option(OptionTiDBShardRowIDBits) = 4;
  option(OptionTiDBPreSplitRegions) = 4;
  uint64 player_id = 1;
  string account = 2;
  bytes role_proto = 3; // AccountSimplePlayer 原件，保留未知字段。
  uint64 owner_revision = 4; // 账号归属修订号，绝不等同 scene owner_epoch。
  uint64 updated_ms = 5;
  uint64 trade_listing_id = 6; // 0 表示无交易锁；非零时入场、身份补齐和删除均拒绝。
  // 仅首次目录与两张玩家行同事务提交为 1；旧角色及导入保持 0。
  uint64 initial_player_commit = 7;
}

// listing 级永久冻结收据；取消后保留，旧冻结请求重放不能再次冻结。
message account_role_trade {
  option(OptionTableName) = "account_role_trade";
  option(OptionPrimaryKey) = "listing_id";
  option(OptionTiDBNonclusteredPK) = true;
  option(OptionTiDBShardRowIDBits) = 4;
  option(OptionTiDBPreSplitRegions) = 4;
  uint64 listing_id = 1;
  uint64 player_id = 2;
  string seller_account = 3;
  uint64 seller_owner_revision = 4;
  bytes request_digest = 5;
  uint32 state = 6; // data_service.AccountRoleTradeState。
  bytes freeze_evidence = 7; // 仅服务端 SQL 验证器产生的 AccountRoleFreezeEvidence 原件。
  uint64 created_ms = 8;
  uint64 updated_ms = 9;
  uint64 required_owner_epoch = 10; // 包括已普通退出但 SQL 尚未追上的历史下限。
  uint64 required_save_seq = 11;
}

// tx_id 级永久过户收据，保存原角色原件与原返回修订，不随后续过户改变。
message account_role_transfer_receipt {
  option(OptionTableName) = "account_role_transfer_receipt";
  option(OptionPrimaryKey) = "tx_id";
  option(OptionTiDBNonclusteredPK) = true;
  option(OptionTiDBShardRowIDBits) = 4;
  option(OptionTiDBPreSplitRegions) = 4;
  uint64 tx_id = 1;
  bytes request_digest = 2;
  uint64 listing_id = 3;
  uint64 player_id = 4;
  string seller_account = 5;
  string buyer_account = 6;
  uint64 seller_owner_revision = 7;
  uint64 buyer_owner_revision = 8;
  uint64 created_ms = 9;
  bytes role_proto = 10;
}

// 每角色/scene 进程一行，登录不 append；终态水位不得按 TTL 丢弃。
message account_role_admission {
  option(OptionTableName) = "account_role_admission";
  option(OptionPrimaryKey) = "player_id,scene_instance_id";
  uint64 player_id = 1;
  string scene_instance_id = 2;
  uint64 highest_generation = 3;
  uint64 closed_through = 4;
  bytes identity_proto = 5; // RoleAdmissionIdentity 原件。
  bytes request_digest = 6;
  uint64 required_owner_epoch = 7;
  uint64 required_save_seq = 8;
  bytes close_digest = 9; // 仅最新关闭水位可同原请求重放，较旧请求明确拒绝。
  uint64 updated_ms = 10;
}

// 原 listing 的 holder 固定集合；成功 ACK 原件永久判重。
message account_role_trade_holder {
  option(OptionTableName) = "account_role_trade_holder";
  option(OptionPrimaryKey) = "listing_id,scene_instance_id";
  uint64 listing_id = 1;
  string scene_instance_id = 2;
  bytes seal_proto = 3;
  uint32 drained = 4;
  bytes ack_digest = 5;
  uint64 updated_ms = 6;
}

// 永久SQL写资格；本段只作正规typed原件及DDL形状守卫，不交通用proto2mysql建表。
message sql_writer_registry {
  option(OptionTableName) = "writer_registry";
  option(OptionPrimaryKey) = "writer_key";
  bytes writer_key = 1;
  string generation = 2;
  bytes instance_id = 3;
  bytes sql_principal = 4; // VARBINARY(288)，永久UNIQUE；每boot主体不得重用。
  bytes registration_digest = 5;
  enum State { STATE_UNKNOWN = 0; ACTIVE = 1; REVOKED = 2; }
  State state = 6;
  uint64 registered_ms = 7;
  bytes retirement_request_id = 8;
  bytes retirement_digest = 9;
  uint64 retired_ms = 10;
}
message sql_writer_slot {
  option(OptionTableName) = "writer_slot";
  option(OptionPrimaryKey) = "writer_key,slot";
  bytes writer_key = 1;
  uint32 slot = 2; // 精确0..63；缺片拒绝，不补片。
  string generation = 3;
  uint64 writer_epoch = 4;
  sql_writer_registry.State state = 5;
  uint32 lock_touch = 6; // 仅0/1同步列，绝无权限含义；8.5.8备选锁写须先真库验证。
}
message sql_writer_lifecycle_receipt {
  option(OptionTableName) = "writer_lifecycle_receipt";
  option(OptionPrimaryKey) = "request_id";
  option(OptionIndex) = "kind,request_digest;catalog_revision,request_id";
  bytes request_id = 1;
  enum Kind { KIND_UNKNOWN = 0; REGISTER = 1; RETIRE = 2; reserved 3, 4, 5; }
  Kind kind = 2; // freeze/release/DDL事实统一追加sql_writer_maintenance_receipt，不复制owner。
  string generation = 3;
  bytes request_digest = 4;
  bytes request_proto = 5; // 下列Request的完整确定性编码；只存摘要不足以审计。
  uint64 previous_epoch = 6;
  uint64 resulting_epoch = 7;
  uint64 catalog_revision = 8;
  message Request {
    bytes request_id = 1;
    Kind kind = 2;
    sql_writer_registry writer = 3;
    uint64 expected_epoch = 4;
    uint64 expected_catalog_revision = 5;
    string authority_schema = 6;
    repeated string protected_schemas = 7;
    bytes deployment_digest = 8;
    bytes maintenance_run_id = 9; // REGISTER仅同run SQL_RELEASED后fresh注册；RETIRE绑定本轮P1根闭合或P3 relay闭合永久事实。普通生命周期为空。
    string deployment_id = 10; // 必须非空且进入永久请求摘要；init绑定真实PodUID，重放不得换部署。
    sql_writer_boot_grant.LockPrimitive lock_primitive = 11;
    bytes lock_qualification_sha256 = 12; // 同REGISTER原件永久绑定，必须精确等boot grant15/16；无I3资格不发grant。
  }
}
// 本地启动授权文件的唯一正规消息；不是SQL表。proto JSON用lowerCamelCase，bytes用标准base64。
// registrar先固定永久registry/64片；normal启动原子消费privateEmptyDir marker，不持registrar凭据。
message sql_writer_boot_grant {
  string format = 1; // 必须SQL_WRITER_BOOT_V1。
  bytes writer_key = 2;
  bytes instance_id = 3;
  string generation = 4;
  string authority_schema = 5;
  repeated string protected_schemas = 6;
  bytes sql_principal = 7;
  bytes registration_digest = 8;
  string deployment_id = 9; // Kubernetes Pod UID或本地启动器一次固定bootID。
  bytes grant_id = 10;
  uint64 granted_ms = 11;
  string permission = 12; // runtime严格NORMAL；控制principal不借此文件提升。
  bytes physical_authority_sha256 = 13; // 独立PD物理身份原件摘要，不能从客户端SQL变量冒充。
  bytes maintenance_run_id = 14; // 非空只准同run SQL_RELEASED的prepare-only启动；不授权root admission。
  enum LockPrimitive { LOCK_PRIMITIVE_UNKNOWN = 0; SELECT_ONLY = 1; LOCK_TOUCH = 2; }
  LockPrimitive lock_primitive = 15;
  bytes lock_qualification_sha256 = 16; // 必须32字节，操作者真实I3原件SHA；无资格拒启动，不自探针或扩权。
}

// r3唯一schema候选，不执行生成。正式落地前核即时源/字段号，沿no-unity正规生成。
// 仅服务端内部；Java用自己的正式源实现语义，不经ContractSync复制。
message sql_writer_drain_run {
  option(OptionTableName) = "sql_writer_drain_run";
  option(OptionPrimaryKey) = "operation_id";
  bytes operation_id = 1;
  bytes request_digest = 2;
  string generation = 3;
  uint64 attempt_revision = 4;
  bytes manifest_proto = 5; // 正规typed完整目录原件；摘要不能代替正文。
  bytes manifest_digest = 6;
  enum Phase {
    UNKNOWN = 0;
    PLAN_FIXED = 1;
    reserved 2; // r2探索CUTOFF_REQUESTED未落canonical；r3不使用此阶段，保数值不漂。
    ROOTS_CLOSED = 3;
    DRAINING = 4;
    NON_SQL_CLOSED = 5;
    FREEZE_AUTHORIZED = 6; // DRAIN_READY仅逻辑别名，不增enum。
    SQL_FROZEN = 7;
    RELEASE_READY = 8;
    SQL_RELEASED = 9;
    PUBLICATION_REOPENED = 10;
    ABORTED_CLOSED = 11;
    EMERGENCY_FROZEN_HOLD = 12;
  }
  Phase phase = 7;
  bytes latest_receipt_digest = 8;
  bytes frozen_request_id = 9;
  uint64 updated_ms = 10;
  bytes latest_receipt_id = 11;
}

message sql_writer_freeze_ticket {
  option(OptionTableName) = "sql_writer_freeze_ticket";
  option(OptionPrimaryKey) = "ticket_id";
  bytes ticket_id = 1;
  bytes operation_id = 2;
  uint64 attempt_revision = 3;
  string generation = 4;
  bytes manifest_digest = 5;
  bytes non_sql_receipt_digest = 6; // NORMAL必须同attempt的NON_SQL_CLOSED；EMERGENCY不能伪填成功闭合。
  bytes freeze_request_id = 7;
  bytes freeze_request_digest = 8;
  uint64 not_before_ms = 9;
  uint64 expires_ms = 10; // 只限制授权新尝试，不自动解开publication/revival fence。
  enum State {
    STATE_UNKNOWN = 0;
    AVAILABLE = 1;
    CONSUMED = 2;
    REVOKED = 3;
  }
  State state = 11;
  bytes consumed_receipt_digest = 12;
  bytes revocation_digest = 13;
  uint64 updated_ms = 14;
  enum AuthorizationKind {
    AUTHORIZATION_UNKNOWN = 0;
    NORMAL_DRAIN_FREEZE = 1;
    EMERGENCY_HOLD_FREEZE = 2;
  }
  AuthorizationKind authorization_kind = 15;
  bytes grant_receipt_id = 16;
  bytes grant_receipt_digest = 17;
}

// 这是对root既有候选同名message的合并全文，不另创建阶段fact/maintenance_run表。
// PK和1..10原字段保留；所有阶段/授权/取消/危险事实只INSERT此owner的唯一request_id。
message sql_writer_maintenance_receipt {
  option(OptionTableName) = "sql_writer_maintenance_receipt";
  option(OptionPrimaryKey) = "request_id";
  bytes request_id = 1;
  bytes request_digest = 2;
  bytes run_id = 3;
  string generation = 4;
  uint64 before_epoch = 5;
  uint64 after_epoch = 6;
  uint64 catalog_revision = 7;
  enum Phase {
    PHASE_UNKNOWN = 0;
    FROZEN = 1;
    RELEASED = 2;
  }
  Phase phase = 8; // 只表示正常最终freeze/release结局；阶段fact/紧急HOLD不得伪写FROZEN。
  bytes plan_proto = 9;
  uint64 committed_ms = 10;
  enum Kind {
    KIND_UNKNOWN = 0;
    FREEZE = 1;
    RELEASE = 2;
    PHASE_EVENT = 3;
    ROLE_CLOSED = 4;
    RELAY_QUIESCED = 5;
    TICKET_GRANTED = 6;
    TICKET_REVOKED = 7;
    EMERGENCY_FREEZE = 8;
  }
  Kind kind = 11;
  sql_writer_drain_run.Phase run_phase = 12;
  uint64 attempt_revision = 13;
  bytes prior_receipt_id = 14; // FREEZE固定grant之前已知NON_SQL_CLOSED（emergency为danger），经ticket核实际grant后消费；避免grant/freeze摘要循环。
  bytes prior_receipt_digest = 15;
  Evidence evidence = 16;
  bytes receipt_digest = 17; // 除本字段外全原件确定性编码摘要；只能同request只读认重。
  message Plan {
    bytes physical_cluster_identity = 1;
    string authority_schema = 2;
    repeated string protected_schemas = 3;
    repeated bytes active_writer_keys = 4;
    uint64 before_epoch = 5;
    uint64 catalog_revision = 6;
    bytes run_id = 7;
    bytes prior_freeze_request_id = 8;
    reserved 9; // 原 recovery_audit_digest:恢复审计原件已删除。
    repeated IssuerClosure root_issuers = 10; // P0精确预期logical role/boot，不是事后发现。
    repeated IssuerClosure queue_mutators = 11;
    repeated KafkaPartitionClosure kafka_partitions = 12; // 全历史topic ID/group/partition/baseline全集。
    repeated RedisTargetClosure redis_targets = 13; // 实际物理目标/DB/固定与动态前缀目录。
    repeated SourcePin source_pins = 14;
    repeated LaunchClosure launchers = 15;
    // P6冻结维护工具的有限单次boot目录；不是P1/P3已经关闭的旧业务发行者。
    repeated IssuerClosure maintenance_issuers = 16;
    repeated ManualConsumerAssignment manual_assignments = 17; // P0实际manual owner配置和物理位置基线。
  }
  message LaunchClosure {
    bytes launcher_id = 1;
    repeated SourcePin source_pins = 2;
    bytes permanent_fence_id = 3;
  }
  message SourcePin {
    string absolute_path = 1;
    bytes sha256 = 2;
  }
  message IssuerClosure {
    bytes issuer_id = 1;
    bytes instance_id = 2;
    bytes physical_writer_key = 3; // 同process可兼任逻辑root/relay，P1不能提前retire此key。
    string logical_role = 4;
    bytes permanent_revival_fence_id = 5;
    uint64 accepting_closed_ms = 6;
    uint64 accepted_settled_ms = 7;
    bytes accepted_frontier_digest = 8;
    uint64 unresolved_publications = 9; // 成功ROLE_CLOSED/QUIESCED必须0，不以TTL猜测。
    repeated SourcePin source_evidence = 10;
  }
  message KafkaPartitionClosure {
    bytes cluster_id = 1;
    bytes topic_id = 2;
    string topic_name = 3;
    string group = 4;
    uint32 partition = 5;
    int64 protected_committed_floor = 6;
    int64 initial_earliest = 7;
    int64 final_earliest = 8;
    int64 final_exclusive_end = 9;
    int64 final_committed = 10;
  }
  message RedisKeyClosure {
    string key = 1;
    string kind = 2;
    string topic = 3;
    string redis_type = 4;
    int64 pttl_ms = 5;
    uint64 count = 6;
    repeated bytes members = 7;
    repeated bytes values = 8;
    bytes dump_sha256 = 9;
  }
  message RedisTargetClosure {
    string role = 1;
    string address = 2;
    int32 db = 3;
    bytes server_run_id = 4;
    bytes maintenance_nonce = 5;
    repeated uint32 zones = 6;
    repeated RedisKeyClosure observations = 7;
    repeated SourcePin scan_source_evidence = 8; // 完整cursor0→0原件，固定64桶+动态前缀等集交叉。
  }
  message PublicationEvidence {
    repeated IssuerClosure logical_roles = 1;
    bytes issuer_inventory_digest = 2;
    repeated SourcePin source_evidence = 3; // 实际app IssuerClosure报告原件，不能只抄字段或自pin自身。
  }
  message NonSqlClosureEvidence {
    repeated IssuerClosure queue_mutators = 1;
    repeated KafkaPartitionClosure kafka_partitions = 2;
    repeated RedisTargetClosure redis_targets = 3;
    bytes root_closed_receipt_id = 4;
    bytes root_closed_receipt_digest = 5;
    bytes relay_quiesced_receipt_id = 6;
    bytes relay_quiesced_receipt_digest = 7;
    bytes historical_inventory_digest = 8;
    uint64 observed_start_ms = 9;
    uint64 observed_end_ms = 10;
    repeated SourcePin source_evidence = 11;
    repeated ManualConsumerEvidence manual_consumers = 12;
  }
  message TicketEvidence {
    bytes ticket_id = 1;
    bytes bound_request_id = 2;
    bytes bound_request_digest = 3;
    bytes authority_operation_id = 4;
    bytes ticket_request_digest = 5; // ticket原请求确定性SHA：清SQL-owned grant/updated/consumed/revocation字段；时间窗必须被授权请求绑定。
  }
  message EmergencyEvidence {
    string reason = 1;
    bytes danger_receipt_id = 2;
    bytes danger_receipt_digest = 3;
    repeated SourcePin source_evidence = 4;
    TicketEvidence authorization = 5; // 只在紧急grant绑定完整ticket请求；freeze用SQL ticket原freeze_request_id/digest，避免摘要自引用。
  }
  message ReleaseReadiness {
    bytes original_freeze_receipt_id = 1;
    bytes original_freeze_receipt_digest = 2;
    reserved 3, 6; // 原 recovery_audit 与 route_watermark_floor_ms:路由表只有 SQL 一份,解冻不需要比对别的副本。
    bytes non_sql_closed_receipt_id = 4;
    bytes non_sql_closed_receipt_digest = 5;
    // 同P0维护工具全集逐个永久关闭、真实SQL/Redis/回调join，并pin实际应用报告。
    PublicationEvidence maintenance_publication = 7;
  }
  // 实际consumer-group代次原件；P8按group聚合各boot的assignment，不能要求单副本独占全组。
  message ConsumerGroupReadiness {
    bytes operation_id = 1;
    bytes manifest_digest = 2;
    bytes issuer_id = 3;
    bytes instance_id = 4;
    string group = 5;
    int32 generation_id = 6;
    string member_id = 7;
    repeated KafkaPartitionClosure expected_partitions = 8; // 本consumer配置group/topics在P0中的完整目录。
    // 实际Generation.Assignments子集；final_committed是已确认next offset，final_earliest/end来自真实leader。
    repeated KafkaPartitionClosure assigned_partitions = 9;
  }
  // 手动assign不加入group、不提交broker offset；其本机位置与目标boot单独证明。
  message ManualConsumerAssignment {
    bytes issuer_id = 1;
    bytes instance_id = 2;
    string consumer_id = 3;
    bytes cluster_id = 4;
    bytes topic_id = 5;
    string topic_name = 6;
    uint32 partition_count = 7;
    uint32 partition = 8;
    uint32 target_node_id = 9;
    bytes target_instance_id = 10;
    uint64 assignment_revision = 11; // 本机owner修订，不是Kafka group generation。
    int64 start_offset = 12; // 实际assign的绝对offset，禁止OFFSET_END占位。
    int64 position = 13; // native实际next position。
    int64 earliest = 14;
    int64 exclusive_end = 15;
    uint64 observed_ms = 16;
  }
  message ManualConsumerEvidence {
    bytes operation_id = 1;
    bytes manifest_digest = 2; // P0基线为空以免Plan摘要自引用；P3/P8绑定原manifest。
    repeated ManualConsumerAssignment assignments = 3;
    bool accepting_closed = 4; // P3永久停收；P8暂停fetch等待同owner开放。
    bool callbacks_joined = 5; // P3包括poller退出和loop callback返回；P8无已接收工作。
    uint64 accepted = 6;
    uint64 settled = 7;
    uint64 unresolved_publications = 8;
    repeated SourcePin source_pins = 9;
  }
  message ConsumerReadiness {
    repeated ConsumerGroupReadiness groups = 1; // 一个boot全部配置消费者的实际报告；不能省略失败owner。
    repeated ManualConsumerEvidence manual_assignments = 2;
  }
  message IssuerReadiness {
    bytes issuer_id = 1;
    bytes instance_id = 2;
    bytes physical_writer_key = 3;
    string logical_role = 4;
    bytes registration_receipt_id = 5;
    bytes registration_receipt_digest = 6;
    uint64 prepared_closed_ms = 7;
    bytes consumer_ready_frontier_digest = 8;
    repeated SourcePin source_pins = 9;
  }
  // source_open_acks的每个SourcePin指向此正式protojson；准备就绪不是实际开放ACK。
  message SourceOpenAck {
    bytes issuer_id = 1;
    bytes instance_id = 2;
    bytes physical_writer_key = 3;
    string logical_role = 4;
    bytes registration_receipt_id = 5;
    bytes registration_receipt_digest = 6;
    bytes operation_id = 7;
    bytes manifest_digest = 8;
    uint64 opened_ms = 9;
    bytes open_request_id = 10;
    bytes accepted_frontier_digest = 11;
    repeated SourcePin source_pins = 12;
  }
  message PublicationReadiness {
    bytes release_receipt_id = 1;
    bytes release_receipt_digest = 2;
    repeated IssuerReadiness prepared_boots = 3;
    repeated SourcePin source_open_acks = 4; // 外部实际幂等open后的ACK原件，不能以prepared代已开。
  }
  message Evidence {
    bytes operation_id = 1;
    bytes manifest_digest = 2;
    oneof detail {
      PublicationEvidence publication = 10;
      NonSqlClosureEvidence non_sql_closure = 11;
      TicketEvidence ticket = 12;
      EmergencyEvidence emergency = 13;
      ReleaseReadiness release_readiness = 14;
      PublicationReadiness publication_readiness = 15;
    }
  }
}

// init受限有限授权roster；每entry的身份/主体全预固定，不铸新UUID或复制runtime秘密进grant。
message sql_writer_boot_roster {
  string format = 1; // SQL_WRITER_BOOT_ROSTER_V1。
  repeated Entry entries = 2; // 至多现有issuer预算1024，duplicate key/instance/principal/request拒绝。
  message Entry {
    sql_writer_lifecycle_receipt.Request request = 1;
    string runtime_config_path = 2; // 只在受限init input-root内解析，normal只挂选中副本。
    bytes runtime_config_sha256 = 3;
    repeated RuntimeEnvironment runtime_environment = 4; // 仅固定SQL环境变量白名单；原件只存私有文件路径/SHA，不存秘密值。
  }
  message RuntimeEnvironment {
    string name = 1;
    string value_path = 2;
    bytes value_sha256 = 3;
  }
}
