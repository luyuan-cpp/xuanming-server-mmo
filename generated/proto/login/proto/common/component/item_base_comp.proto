syntax = "proto3";
option go_package = "login/proto/common/component";



// 一条装备随机属性(设计文档 docs/design/equipment-attributes.md §3.1)。
//
// 实例层只写「是什么」:上限、名称、百分比标记等能由配表重算的量**不入库**
// (AGENTS §11.6「显示态不进持久化记录」),显示时按 (attr_id, 装备等级) 现查。
message EquipAffix
{
	uint32 attr_id = 1;	// EquipAttribute 表 id
	uint32 tier = 2;	// 颜色档:1 蓝 / 2 粉 / 3 黄 / 4 绿(预留,本期不掷)
	uint32 value = 3;	// 当前值
	// 档内序号(0 起)。显示顺序 = (tier, seq);repeated 的下标不承载语义,
	// 序列化 / 合并 / 跨服迁移中任何一环打乱下标都不影响显示。
	uint32 seq = 4;
}

// 一颗已镶嵌的宝石(设计文档 docs/design/equipment-enhance-inlay.md §3.1)。
//
// 记 config 不记 guid:宝石是可叠加物品,guid 不是稳定身份(嵌入时销毁一颗、取下时另铸一颗)。
// 属性值不入库:按 EquipGem 表现查,改表立即对已镶嵌的宝石生效。
message EquipGem
{
	uint32 socket = 1;	// 孔位号(0 起)。显式字段,repeated 下标不承载语义(AGENTS §11.6)
	uint32 gem_config_id = 2;	// 宝石的 Item 表 id(= EquipGem 表主键)
}

// 装备实例数据。只有装备实例才有这一段。
//
// 强化等级与宝石也放在这里(不启用 ItemEntry 预留的 6 号 enchant_level / 8 号 gem_uuids):
// 这一段随 ItemComp.equip / ItemEntry.equip 整份搬运,穿脱、存档、跨区都不用再逐字段跟。
// 强化 / 镶嵌只改 has_equip() 的实例;不要为了写这两个字段对未初始化的实例调 mutable_equip()
// —— 那会把「没掷过属性」变成「已初始化」。
message EquipInstanceData
{
	repeated EquipAffix affixes = 1;
	uint32 enhance_level = 2;	// 强化等级(+N),0 = 未强化。入库的只有「+几」,加成按 EquipEnhance 表现查
	repeated EquipGem gems = 3;	// 已镶嵌宝石;同一 socket 至多一条
}

message ItemComp
{
	uint64 item_id = 1;
	uint32 config_id = 2;
	uint32 size = 3;

	// 入包序号:同一个背包内单调递增,越小越早进包。
	//
	// 包内实例序按它排(ItemStore::AcquiredBefore):遍历与存盘的顺序、并堆与扣除先动哪一堆、整理的平局。
	// 2026-11-12 前临时格的先进先出淘汰也按它排,背包的淘汰已整条删除。**不能用 item_id 代替** ——
	// item_id 是发号器 item 号段的号(经 MixGuid 打散),不单调,大小与先后无关;跨服迁移带回来的实例、
	// 沿用调用方**预设 guid** 的邮件附件,号更是别处早就铸好的。按 item_id 排,"先进包的先动"就会动错堆。
	//
	// 由 ItemStore 在实例入库时统一盖(见 item_store.h 的 nextAcquireSeq_),
	// 跨服 / 快照随 ItemEntry.acquire_seq 原样带走,还原时恢复水位。
	// 0 = 未盖章(旧存档),此时退回按 item_id 排序(只为顺序确定,不代表先后),与本字段落地前的行为一致。
	uint64 acquire_seq = 4;

	// 装备实例数据(随机属性、强化等级、已镶嵌宝石)。仅装备实例有。
	//
	// **has_equip() == true 表示「已完成初始化」**,即使一条属性都没掷出 ——
	// 搬运(穿脱 / 邮件回流 / 交易退回)靠它保证不重掷。所以存盘 / 读盘必须保留
	// presence:只在 has_equip() 时拷贝,不要无条件 mutable_equip()。
	// 镜像 ItemEntry.equip(字段 14),两边必须同改(bag_marshal 的转换函数)。
	EquipInstanceData equip = 5;
}
