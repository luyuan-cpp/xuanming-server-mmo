syntax = "proto3";
option go_package = "login/proto/common/component";



message BuffContextComp
{
  float damage_value = 1;
}

message BuffPeriodicBuffComp
{
  double periodic_timer = 1;
  uint32 ticks_done = 2;
}

message BuffComp
{
  uint64 buff_id = 1;
  uint32 buff_table_id = 2;
  uint32 ability_id = 3;
  uint64 parent_entity = 4;
  uint32 layer = 5;
  uint64 caster = 6;
  bool triggerdamage = 7;
  uint64 processed_caster = 8; // Caster after table processing
  bytes data = 9; // Various buff type data
  BuffPeriodicBuffComp  periodic = 10;
  map<uint64, bool> sub_buff_list_id = 11;
  bool has_added_sub_buff = 12;
}

// 下线保留的 Buff 的存档条目(Buff 表 keep_on_logout = 1,docs/design/realtime-cooldown-buff-persistence.md)。
// 只记「是哪个 Buff、几层、什么时候到期」,不记施法者、实例号、子 Buff 关系这些运行时句柄:恢复后按系统施加处理。
message SavedBuffComp
{
  uint32 buff_table_id = 1;
  uint32 layer = 2;
  uint64 expire_at_ms = 3;  // 到期的 UTC 毫秒;0 = 永久
}

message DamageEventComp
{
  uint64 skill_id = 1;
  uint64 attacker_id = 2;
  uint64 target = 3;
  double damage = 4;
  uint32 damage_type = 5;
}

message BuffNoDamageOrSkillHitInLastSecondsComp
{
  uint64 last_time = 1;
}
