syntax = "proto3";
option go_package = "login/proto/common/component";



message MissionComp
{
	enum eMissionStatus
	{
	    E_MISSION_NORMAL = 0;
	    E_MISSION_ACHIEVEMENT = 1;
	    E_MISSION_COMPLETE = 2;
	    E_MISSION_TIME_OUT = 3;
	    E_MISSION_FAILD = 4;
	};
	uint32 id = 1;
	uint32 status = 2;
	repeated uint32 progress = 3;
	bytes data = 4; // Various buff data
}

message MissionListComp
{
	enum eMissionScope
	{
		kPlayerMission = 0;// Normal missions
		kPlayerAchievment = 1;// Achievements
		kPlayerDailyActivity = 2;// Daily activities
		kPlayerMissionSize = 3;// Max enum value
	}
	map<uint32, MissionComp> missions = 1;
	bytes complete_missions = 2;
	map<uint32, uint64> mission_begin_time = 3;
	uint32 type = 4;
    // 活动完成事实与任务、背包同属玩家快照；追踪偏好不进入这里。
    PlayerActivityLedger activity_ledger = 5;
}

message PlayerActivityPointSource {
  uint32 mission_scope = 1;
  uint32 mission_id = 2;
  uint32 rule_id = 3;
  uint64 configuration_revision = 4;
  uint64 period_id = 5;
  uint32 points = 6;
}

message PlayerActivityClaimRecord {
  uint32 rule_id = 1;
  uint64 configuration_revision = 2;
  uint64 period_id = 3;
  uint32 threshold_id = 4;
  string request_id = 5;
  uint32 reward_id = 6;
  uint64 claimed_at_ms = 7;
}

message PlayerActivityLedger {
  repeated PlayerActivityPointSource sources = 1;
  repeated PlayerActivityClaimRecord claims = 2;
}

message RewardListComp
{
	map<uint32, bool> can_reward_mission_id = 1;
}
