syntax = "proto3";
option go_package = "login/proto/scene";

import "proto/db/proto_option.proto";
import "proto/common/base/tip.proto";

option cc_generic_services = true;
option (OptionFileDefaultNode) = NODE_SCENE;

enum PlayerActivityStatus {
  PLAYER_ACTIVITY_UNSCHEDULED = 0;
  PLAYER_ACTIVITY_UPCOMING = 1;
  PLAYER_ACTIVITY_OPEN = 2;
  PLAYER_ACTIVITY_ENDED = 3;
}

message PlayerActivityInfo {
  uint32 activity_id = 1;
  uint32 mission_id = 2;
  string name = 3;
  string description = 4;
  string icon_key = 5;
  PlayerActivityStatus status = 6;
  uint64 starts_at_ms = 7;
  uint64 ends_at_ms = 8;
  bool can_participate = 9;
  string unavailable_reason = 10;
  uint32 reward_id = 11;
}

message GetActivityListRequest {}
message GetActivityListResponse {
  TipInfoMessage error_message = 1;
  repeated PlayerActivityInfo activities = 2;
  uint64 server_time_ms = 3;
}

service SceneActivityClientPlayer {
  option (OptionIsPlayerService) = true;
  option (OptionIsClientProtocolService) = true;
  // 目录只读取 MissionTable.mission_type=2；无运营时间配置时一律未排期。
  rpc GetActivityList (GetActivityListRequest) returns (GetActivityListResponse);
}
