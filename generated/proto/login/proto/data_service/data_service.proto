syntax = "proto3";
package data_service;

import "google/protobuf/empty.proto";
// 本文件第一次 import 仓内 proto(docs/design/guild-phase2/07-rollback-fail-closed.md §7.11-U4)。
// 生成链能解析:Go 统一生成把整棵 proto/ 拷进暂存区、以其父目录为 --proto_path;C++ 以仓库根为
// --proto_path,且 asset_op_ledger_comp.pb.cc 早已登记在 cpp/generated/proto 工程里。
import "proto/common/component/asset_op_ledger_comp.proto";
// 玩家收件箱对账读已落盘账本(docs/design/player-inbox-service.md §5.1、§9.3);生成链口径同上一行。
import "proto/common/component/player_inbox_ledger_comp.proto";
// 运维查询单玩家物品获取封禁表(docs/design/player-inbox-service.md §2.2);生成链口径同上一行。
import "proto/common/component/player_item_gain_block_comp.proto";
import "proto/common/base/user_accounts.proto";
import "proto/common/base/service_call_auth.proto";
import "proto/common/base/role_admission.proto";
import "proto/role_fence/role_fence.proto";

option go_package = "login/proto/data_service";

// DataService: Cross-realm transparent data proxy.
// Scene Server calls this service with player_id only;
service DataService {
  // 全球账号角色目录；只接受已签名的 login 调用，不使用 Redis 归属降级。
  rpc ReadAccountDirectory(ReadAccountDirectoryRequest) returns (AccountDirectoryResponse) {}
  rpc CreateAccountRole(CreateAccountRoleRequest) returns (AccountDirectoryResponse) {}
  rpc LookupAccountRole(LookupAccountRoleRequest) returns (AccountRoleOwnership) {}
  rpc RepairAccountRole(RepairAccountRoleRequest) returns (AccountDirectoryResponse) {}
  rpc RemoveAccountRoles(RemoveAccountRolesRequest) returns (google.protobuf.Empty) {}
  // 角色寄售控制仅允许独立 trade 证明；Begin 只阻新入场，不等于在线实体已冻结。
  rpc BeginAccountRoleTrade(BeginAccountRoleTradeRequest) returns (AccountRoleTradeReceipt) {}
  // 请求不接受 caller proof。只有装配的服务端 SQL 验证器能确认 FROZEN；未装配时拒绝。
  rpc ConfirmAccountRoleTradeFreeze(ConfirmAccountRoleTradeFreezeRequest) returns (AccountRoleTradeReceipt) {}
  rpc CancelAccountRoleTrade(CancelAccountRoleTradeRequest) returns (AccountRoleTradeReceipt) {}
  rpc TransferAccountRole(TransferAccountRoleRequest) returns (AccountRoleTransferReceipt) {}
  // 买家账号的角色名额满了没有(docs/design/horizontal-scale-logical-db.md §5.4),强读。trade 在买家付款前和进交付前挡一下,不算数:
  // 名额的判定在过户第 1 步。读不到回 retry=true,不走 gRPC 错误:只读,没有结局未知。
  rpc CheckAccountRoleSlot(CheckAccountRoleSlotRequest) returns (CheckAccountRoleSlotResponse) {}
  // 角色护栏的权威状态(docs/design/horizontal-scale-logical-db.md §3.6),强读。参与者自愈、chat 校验用。
  // 已删除的角色回 account 为空的状态;目录里没有这个角色回 found=false。读不到回 retry=true,不走 gRPC 错误:只读,没有结局未知。
  rpc GetRoleFenceState(GetRoleFenceStateRequest) returns (GetRoleFenceStateResponse) {}
  // 入场登记是否仍然有效(docs/design/horizontal-scale-logical-db.md §3.7),强读。目录只有 data_service 连,
  // match、player_inbox 不再跨库读 account_role_admission。调用方与 GetRoleFenceState 相同,事务外调用。
  rpc VerifyRoleAdmission(VerifyRoleAdmissionRequest) returns (VerifyRoleAdmissionResponse) {}
  // scene 专用强鉴权；SQL 未登记前禁止实体复用、异步加载完成和激活。
  rpc RegisterRoleAdmission(RegisterRoleAdmissionRequest) returns (RegisterRoleAdmissionResponse) {}
  // 只在本实例 <= through 的全部实体与迟到回调都已结束后关闭；无 TTL 自动关闭。
  rpc CloseRoleAdmissions(CloseRoleAdmissionsRequest) returns (CloseRoleAdmissionsResponse) {}
  // 原 listing 的本地墓碑与排空 ACK；不是 caller 自报的冻结完成证明。
  rpc AckRoleTradeDrain(AckRoleTradeDrainRequest) returns (google.protobuf.Empty) {}
  // 持有节点已判死:同一个事务里抬写权行的代次、清持有者、置 released=1,旧持有者恢复之后的写被挡住
  // (docs/design/player-save-direct-commit.md §6)。只有 scene_manager 能调。
  rpc ReleaseDeadPlayerStoreHolder(ReleaseDeadPlayerStoreHolderRequest) returns (google.protobuf.Empty) {}
  // 判死释放的第一步:普通读写权行判持有者用的三列,scene_manager 拿去复核持有实例仍不在册,再按读到的值比较并写
  // (ReleaseDeadPlayerStoreHolderRequest.seen,docs/design/player-save-direct-commit.md §5.5)。只有 scene_manager 能调。
  rpc ReadPlayerStoreHolder(ReadPlayerStoreHolderRequest) returns (ReadPlayerStoreHolderResponse) {}

  // ── Player-zone mapping (registration / lookup) ───────────────
  rpc RegisterPlayerZone(RegisterPlayerZoneRequest) returns (google.protobuf.Empty) {}
  rpc GetPlayerHomeZone(GetPlayerHomeZoneRequest) returns (GetPlayerHomeZoneResponse) {}
  rpc BatchGetPlayerHomeZone(BatchGetPlayerHomeZoneRequest) returns (BatchGetPlayerHomeZoneResponse) {}
  // 全部合服映射。没有全局库连接的服务(guild、trade)用它重建 placement.MergedZones,定时重读
  // (docs/design/player-data-tidb-scaling-plan.md §7.1)。映射还没读到时回 Unavailable。
  rpc GetMergedZones(google.protobuf.Empty) returns (GetMergedZonesResponse) {}
  // 一个区一共建过多少角色(player_route 行数;删角只在账号目录写墓碑,不减),按合服之后的最终区算:合进来的源区一起数,
  // zone_id 自己已被合走时按它的最终区回答。网关按区服目录的角色上限自动暂停创角时经 login 调
  // (docs/design/zone-full-handling.md §6)。zone_id 为 0 或越界回 InvalidArgument;合服映射没读到或库故障回 Unavailable,
  // 不回 0:0 会被当成「远没到上限」。
  rpc CountZoneRoles(CountZoneRolesRequest) returns (CountZoneRolesResponse) {}
  // 玩家的落点(docs/design/horizontal-scale-logical-db.md §7),强读玩家所在分片。go/db 选库用,它不再连目录。
  // 没有路由行或没有落点回 found=false;目录读不到回 retry=true,都不走 gRPC 错误:只读,没有结局未知。只有 go/db 能调,密钥 MMORPG_ROLE_FENCE_SECRET_DB。
  rpc GetPlayerRoute(GetPlayerRouteRequest) returns (GetPlayerRouteResponse) {}

  // ── Snapshot ──────────────────────────────────────
  rpc ListPlayerSnapshots(ListPlayerSnapshotsRequest) returns (ListPlayerSnapshotsResponse) {}

  // ── Batch Recall / Anomaly ──────────────────
  // 以下五个全部要 x-admin-token,没配 AdminToken 就停用。方案见 docs/design/exploit_loss_prevention_zh.md。
  rpc BatchRecallItems(BatchRecallItemsRequest) returns (BatchRecallItemsResponse) {}
  rpc GetRecallBatch(GetRecallBatchRequest) returns (BatchRecallItemsResponse) {}
  rpc CancelRecallBatch(CancelRecallBatchRequest) returns (BatchRecallItemsResponse) {}
  rpc ResolveRecallOp(ResolveRecallOpRequest) returns (ResolveRecallOpResponse) {}
  // 把一条 needs_review 指令登记为交人工处置:它此刻的全部流水按已消费记进 gm_recall_source,以后的批次不再自动扣它。
  rpc RegisterRecallReviewHandled(RegisterRecallReviewHandledRequest) returns (RegisterRecallReviewHandledResponse) {}
  rpc QueryTransactionLog(QueryTransactionLogRequest) returns (QueryTransactionLogResponse) {}

  // ── ID segment allocation (Leaf-segment) ────────────────────
  // 永久 ID(player_id、item guid 等)的号段经这里领取,发号器见 go/data_service/internal/idissuer。
  // 见 docs/design/player-data-tidb-scaling-plan.md §6。
  rpc AllocateIdSegment(AllocateIdSegmentRequest) returns (AllocateIdSegmentResponse) {}

  // ── Player name registry(角色名全服唯一)──────────────────────
  // 真源是全局库 player_name 表(rollback_database_table.proto);
  // player_store 的 profile 片段与 AccountSimplePlayer.name 都只是副本。
  // 唯一性只有"全服一张表"才成立,所以登记必须过 data_service,不能各 zone 自己判重。
  // 设计见 docs/design/guild-phase2/03-names.md §3.1。
  rpc ReservePlayerName(ReservePlayerNameRequest) returns (ReservePlayerNameResponse) {}
  // 只释放预留态的名字:不带 x-admin-token 时只认 login 签名的建角回滚,带合法 token 是运维清孤儿;
  // 已绑定的名字一律拒绝,预留态的先在玩家片证明角色永远不会提交(§3.4a)。删角之后的释放不走这里。
  rpc ReleasePlayerName(ReleasePlayerNameRequest) returns (google.protobuf.Empty) {}
  rpc BatchGetPlayerName(BatchGetPlayerNameRequest) returns (BatchGetPlayerNameResponse) {}
  // 玩家展示资料:名字、等级、职业、性别、外观,读 player_store。
  // 好友列表、在线目录、队伍视图用。只读、不鉴权,与 BatchGetPlayerName 同级。
  rpc BatchGetPlayerDisplay(BatchGetPlayerDisplayRequest) returns (BatchGetPlayerDisplayResponse) {}

  // ── 资产通道:已落盘账本 ─────────────────────────────────
  // 读 player_store 资产行(kind=ASSET)的 asset_op_ledger 子字段,和写权行出自同一条语句。只读、不鉴权
  // (与 BatchGetPlayerName 同级)。实现 go/shared/assetop 的 LedgerReader / SQLCommitLedgerReader / StoreLedgerReader。
  // 设计见 docs/design/guild-phase2/07-rollback-fail-closed.md §7.8。
  rpc GetPlayerAssetOpLedger(GetPlayerAssetOpLedgerRequest) returns (GetPlayerAssetOpLedgerResponse) {}

  // ── 玩家收件箱:已落盘账本只读 ──────────────────────────────
  // 读同一行的 inbox_ledger 子字段,读法与错误语义照 GetPlayerAssetOpLedger。
  // 调用方是 go/player_inbox 的对账(定时作业与运维 ReconcilePlayer),不是 scene。
  // 设计见 docs/design/player-inbox-service.md §5.1、§9.3。
  rpc GetPlayerInboxLedger(GetPlayerInboxLedgerRequest) returns (GetPlayerInboxLedgerResponse) {}

  // ── 单玩家物品获取封禁:已落盘封禁表只读 ──────────────────────────
  // 读 player_store 资料行(kind=PROFILE)的 item_gain_block 子字段,和写权行出自同一条语句。只读、不鉴权,
  // 与 GetPlayerInboxLedger 同级:内容只是物品配置号列表。调用方是 go/player_inbox 的运维查询
  // PlayerInboxAdmin.GetItemGainBlocks(那一层校验 x-admin-token),不是 scene。
  // 设计见 docs/design/player-inbox-service.md §2.2。
  rpc GetPlayerItemGainBlock(GetPlayerItemGainBlockRequest) returns (GetPlayerItemGainBlockResponse) {}
}

message AccountDirectoryResponse {
  AccountSimplePlayerList players = 1;
}
message AccountRoleOwnership {
  string account = 1;
  AccountSimplePlayer role = 2;
  uint64 owner_revision = 3;
  uint64 trade_listing_id = 4; // 最终冻结令牌。入场和归属判定只看它
  uint64 prepare_token = 5;    // 还在投票的准备令牌。只给目录内部和护栏判定用,LookupAccountRole 恒回 0
  // account_role.initial_player_commit=1:现行建角流程提交的,初始存档行先于角色行写进了存档库。只有 LookupAccountRole 回填。
  // 这样的角色缺写权行只可能是存档库的恢复点早于建角写初始行(docs/ops/mysql-backup-pitr-runbook.md §4.1a),摘孤儿据此拒绝写墓碑。
  bool initial_player_commit = 6;
}
message AccountRoleVersion { uint64 player_id = 1; uint64 owner_revision = 2; }
message ReadAccountDirectoryRequest {
  string account = 1;
  bool create_if_missing = 2;
  common.base.ServiceCallAuth auth = 3;
}
message CreateAccountRoleRequest {
  string account = 1;
  AccountSimplePlayer role = 2;
  common.base.ServiceCallAuth auth = 3;
}
message LookupAccountRoleRequest {
  uint64 player_id = 1;
  common.base.ServiceCallAuth auth = 2;
}
message ReleaseDeadPlayerStoreHolderRequest {
  uint64 player_id = 1;
  uint64 owner_epoch = 2;              // 判死时 location 这一代;库里已比它新就不动
  common.base.ServiceCallAuth auth = 3;
  // 非空时与交易判死同一口径比较并写:写权行还是 ReadPlayerStoreHolder 读到的这三列才释放,变了回 FAILED_PRECONDITION
  // (读之后有人认领过,同实例同代次重登只有 claim_seq 变)。LeaveScene 判死释放恒带;为空只按代次判(无资格撤销之后的补释放)。
  PlayerStoreHolder seen = 4;
}
// PlayerStoreHolder 是 player_store 写权行里判持有者用的三列。
message PlayerStoreHolder {
  uint64 owner_epoch = 1;
  bytes holder_instance = 2;           // 持有者的 scene_instance_id;空 = 没有持有者(建角初行、已被判死释放)
  uint64 claim_seq = 3;                // 每次认领加 1,同实例同代次重新认领也加
}
message ReadPlayerStoreHolderRequest {
  uint64 player_id = 1;
  common.base.ServiceCallAuth auth = 2;
}
message ReadPlayerStoreHolderResponse {
  bool found = 1;                      // false = 没有路由或写权行(角色不存在或未建完),没有东西要释放
  PlayerStoreHolder holder = 2;        // found 时非空
}
message RepairAccountRoleRequest {
  string account = 1;
  AccountSimplePlayer role = 2;
  uint64 expected_owner_revision = 3;
  common.base.ServiceCallAuth auth = 4;
}
message RemoveAccountRolesRequest {
  string account = 1;
  repeated AccountRoleVersion roles = 2;
  common.base.ServiceCallAuth auth = 3;
}

enum AccountRoleTradeState {
  ACCOUNT_ROLE_TRADE_STATE_UNSPECIFIED = 0;
  ACCOUNT_ROLE_TRADE_STATE_FREEZING = 1;
  ACCOUNT_ROLE_TRADE_STATE_FROZEN = 2;
  ACCOUNT_ROLE_TRADE_STATE_CANCELLED = 3;
  ACCOUNT_ROLE_TRADE_STATE_TRANSFERRED = 4;
  ACCOUNT_ROLE_TRADE_STATE_CANCEL_PENDING = 5;
  // 目录已写冻结令牌,还在等全部参与者冻结。Begin 只在离开这个状态后才回收据。
  ACCOUNT_ROLE_TRADE_STATE_PREPARING = 6;
}
enum AccountRoleFreezeEvidenceKind {
  ACCOUNT_ROLE_FREEZE_EVIDENCE_KIND_UNSPECIFIED = 0;
  ACCOUNT_ROLE_FREEZE_EVIDENCE_KIND_NO_ADMISSION = 1;
  ACCOUNT_ROLE_FREEZE_EVIDENCE_KIND_SCENE = 2;
  // 真实初始 SQL 提交，不代表存在 scene actor 或 holder。
  ACCOUNT_ROLE_FREEZE_EVIDENCE_KIND_INITIAL_COMMIT = 3;
}
// 服务端验证器的返回证据，不是 Confirm 请求入参。owner_epoch/save_seq 不能替代 owner_revision。
message AccountRoleFreezeEvidence {
  uint64 player_id = 1;
  uint64 listing_id = 2;
  uint64 owner_revision = 3;
  uint64 owner_epoch = 4;
  uint64 save_seq = 5;
  bytes persisted_digest = 6;
  AccountRoleFreezeEvidenceKind kind = 7;
}
message AccountRoleTradeHolder {
  common.base.RoleTradeSeal seal = 1;
  bool drained = 2;
}
message AccountRoleTradeReceipt {
  uint64 listing_id = 1;
  uint64 player_id = 2;
  string seller_account = 3;
  uint64 seller_owner_revision = 4;
  AccountRoleTradeState state = 5;
  AccountRoleFreezeEvidence freeze_evidence = 6;
  repeated AccountRoleTradeHolder holders = 7; // 原固定集合，重试不得换上界。
}
message AccountRoleTransferReceipt {
  uint64 tx_id = 1;
  uint64 listing_id = 2;
  uint64 player_id = 3;
  string seller_account = 4;
  string buyer_account = 5;
  uint64 seller_owner_revision = 6;
  uint64 buyer_owner_revision = 7;
  AccountSimplePlayer role = 8;
  uint64 created_ms = 9;
}
message BeginAccountRoleTradeRequest {
  uint64 listing_id = 1;
  uint64 player_id = 2;
  string seller_account = 3;
  uint64 expected_owner_revision = 4;
  common.base.ServiceCallAuth auth = 5;
}
message ConfirmAccountRoleTradeFreezeRequest {
  uint64 listing_id = 1;
  uint64 player_id = 2;
  string seller_account = 3;
  uint64 expected_owner_revision = 4;
  common.base.ServiceCallAuth auth = 5;
}
message CancelAccountRoleTradeRequest {
  uint64 listing_id = 1;
  uint64 player_id = 2;
  string seller_account = 3;
  uint64 expected_owner_revision = 4;
  common.base.ServiceCallAuth auth = 5;
}
message TransferAccountRoleRequest {
  uint64 tx_id = 1;
  uint64 listing_id = 2;
  uint64 player_id = 3;
  string seller_account = 4;
  string buyer_account = 5;
  uint64 expected_owner_revision = 6;
  common.base.ServiceCallAuth auth = 7;
}
message CheckAccountRoleSlotRequest {
  string account = 1;
  common.base.ServiceCallAuth auth = 2;
}
message CheckAccountRoleSlotResponse {
  bool full = 1;  // 这个账号的存活角色数已到上限
  bool retry = 2; // 这一次没读成,不能当成有名额
}
message GetRoleFenceStateRequest {
  uint64 player_id = 1;
  common.base.ServiceCallAuth auth = 2;
}
message GetRoleFenceStateResponse {
  bool found = 1;                     // false = 目录确定没有这名角色。已删除的角色是 true,account 为空
  rolefence.RoleFenceState state = 2;
  bool retry = 3;                     // 这一次没读成,不能当成没有
}
message VerifyRoleAdmissionRequest {
  common.base.RoleAdmissionIdentity admission = 1;
  common.base.ServiceCallAuth auth = 2;
}
message VerifyRoleAdmissionResponse {
  // 这份原件就是该实例当前最高世代的登记,而且没有关闭。缺行、世代落后、已关闭、原件不等都是 false。
  bool valid = 1;
  bool retry = 2; // 这一次没读成,不能当成登记失效
}

message RegisterRoleAdmissionRequest {
  common.base.RoleAdmissionIdentity identity = 1;
  common.base.ServiceCallAuth auth = 2;
}
message RegisterRoleAdmissionResponse {
  common.base.RoleAdmissionIdentity identity = 1;
  uint64 closed_through = 2;
}
// required 两字段为本节点最终完整存盘版本下限；0/0 只代表没有新的激活实体存盘，
// 绝不清除已保存在登记行里的历史下限。异步 SQL 尚未追上也应先持久记录此下限。
message CloseRoleAdmissionsRequest {
  uint64 player_id = 1;
  string scene_instance_id = 2;
  uint64 owner_revision = 3;
  uint64 through_generation = 4;
  uint64 required_owner_epoch = 5;
  uint64 required_save_seq = 6;
  common.base.ServiceCallAuth auth = 7;
}
message CloseRoleAdmissionsResponse { uint64 closed_through = 1; }
message AckRoleTradeDrainRequest {
  common.base.RoleTradeSeal seal = 1;
  uint64 required_owner_epoch = 2;
  uint64 required_save_seq = 3;
  common.base.ServiceCallAuth auth = 4;
}

// ── Zone mapping ───────────────────────────────────────────────

message RegisterPlayerZoneRequest {
  uint64 player_id = 1;
  uint32 home_zone_id = 2;
  // 与归属在 player_route 的同一行里原子钉上落点(storage_id,placement_version = 1)
  // (player-storage-placement.md §8.1)。必填:go/db 对没有落点的角色一律拒绝认领。
  uint32 storage_id = 3;
}

message GetPlayerHomeZoneRequest {
  uint64 player_id = 1;
}

message GetPlayerHomeZoneResponse {
  // 已解析到最终区(别名合服:合服只写 zone_merged_into,玩家的原始 home_zone 不变,
  // docs/design/player-data-tidb-scaling-plan.md §7.1)。
  uint32 home_zone_id = 1;
  reserved 2; // 原 home_zone_merging:合服围栏已删除
}

message BatchGetPlayerHomeZoneRequest {
  repeated uint64 player_ids = 1;
}

message BatchGetPlayerHomeZoneResponse {
  map<uint64, uint32> player_zone_map = 2; // player_id → home_zone_id(同 GetPlayerHomeZoneResponse,已解析到最终区)
}

message GetMergedZonesResponse {
  map<uint32, uint32> merged_into = 1; // 源区 → 目标区(zone_merged_into 的原始映射,没有沿链解析)
}

message CountZoneRolesRequest {
  uint32 zone_id = 1; // 1..999999(player_route.home_zone 的取值范围)
}

message CountZoneRolesResponse {
  uint64 roles = 1; // 解析到 zone_id 最终区的全部原始区一共建过的角色数
}

message GetPlayerRouteRequest {
  uint64 player_id = 1;
  common.base.ServiceCallAuth auth = 2;
}

message GetPlayerRouteResponse {
  uint32 storage_id = 1;               // 建角后不变
  uint32 home_zone = 2;                // 原始值,没有解析合服映射
  bool found = 3;                      // false = 目录确定没有路由行或没有落点,go/db 据此拒绝认领
  bool retry = 4;                      // 这一次没读成,不能当成没有落点
}

// ── Snapshot ────────────────────────────────────────

enum SnapshotType {
  SNAPSHOT_MANUAL          = 0; // GM-triggered
  SNAPSHOT_PERIODIC        = 1; // Scheduled (cron)
  SNAPSHOT_PRE_MAINTENANCE = 2; // Before server maintenance
  SNAPSHOT_PRE_ROLLBACK    = 3; // Auto-created before any rollback
  SNAPSHOT_LOGIN           = 4; // On player login
}

// ── Snapshot management ────────────────────────────────────────

message ListPlayerSnapshotsRequest {
  uint64 player_id = 1;
  uint64 before_time = 2; // only snapshots before this time (0 = no filter)
  uint32 limit = 3;       // max results (0 = default 20)
}

message SnapshotInfo {
  uint64 snapshot_id = 1;
  uint64 player_id = 2;
  uint32 zone_id = 3;
  SnapshotType type = 4;
  uint64 created_at = 5;
  string reason = 6;
  string operator = 7;
  uint32 data_size_bytes = 8;
  repeated string fields = 9; // field names in this snapshot
}

message ListPlayerSnapshotsResponse {
  uint32 error_code = 1;
  repeated SnapshotInfo snapshots = 2;
}

// ── Batch Recall ───────────────────────────────────────────────
//
// 方案见 docs/design/exploit_loss_prevention_zh.md「BatchRecallItems 执行方案」。
// 先 dry_run 拿 plan_digest,人审过再带着它执行。执行是异步的:响应只说明计划已冻结,进度用 GetRecallBatch 查。

enum RecallKind {
  RECALL_KIND_UNSPECIFIED = 0;
  RECALL_KIND_CURRENCY = 1;
  RECALL_KIND_ITEM = 2;
}

message BatchRecallItemsRequest {
  repeated uint64 player_ids = 1;      // 只回收这些玩家收到的资产;空 = 不限玩家。上限 1000
  uint32 item_config_id = 2;           // recall_kind=ITEM 时必填
  uint32 currency_type = 3;            // recall_kind=CURRENCY 时的币种。0 是银两,所以种类由 recall_kind 决定
  uint64 time_start = 4;               // transaction time range start (unix sec)
  uint64 time_end = 5;                 // transaction time range end (unix sec)
  repeated uint32 tx_types = 6;        // filter by TransactionType (e.g. TX_SYSTEM_GRANT)
  string reason = 7;                   // dry_run=false 必填,≤ 191 字
  string operator = 8;                 // dry_run=false 必填,≤ 64 字
  bool dry_run = 9;                    // true = 只算计划,不写库
  RecallKind recall_kind = 10;         // 必填
  uint64 request_id = 11;              // dry_run=false 必填。运维工具按工单生成一次,重试原样带回
  string expected_plan_digest = 12;    // dry_run=false 必填。预览回的 plan_digest,重算不相等就拒绝
}

// 一行回收指令的现状。预览时只有 player_id、资产、amount。
message RecallResult {
  uint64 player_id = 1;
  reserved 2;                          // 曾是 item_uuid:现在按 (玩家, 资产) 汇总,实例号见 transaction_log
  uint32 item_config_id = 3;
  uint64 amount = 4;                   // 要回收的数量(requested)
  bool   success = 5;                  // 只有 scene 已提交且全额兜底才为 true
  string error_detail = 6;
  uint64 op_id = 7;                    // 同时是 scene 流水的 correlation_id
  uint32 currency_type = 8;
  uint32 status = 9;                   // GmRecallOpStatus;预览为 0
  uint64 taken = 10;                   // 实际扣走
  uint64 debt = 11;                    // 转成补缴欠款
  uint64 shortfall = 12;               // 没扣到、也没有欠款兜底
}

message BatchRecallItemsResponse {
  uint32 error_code = 1;
  uint32 total_matched = 2;            // 预览:流水候选条数;批次:冻结时消费的流水条数
  uint32 total_recalled = 3;           // 全额兜底的行数(预览为 0)
  uint32 total_failed = 4;             // 有缺口或没有回收结果的行数
  repeated RecallResult results = 5;
  string plan_digest = 6;              // 十六进制 sha256
  uint32 total_pending = 7;            // 还没有结局的行数。不为 0 时别当事故已处置
  uint64 request_id = 8;
  uint32 batch_state = 9;              // GmRecallBatchState;预览为 0
  uint64 amount_requested = 10;
  uint64 amount_taken = 11;
  uint64 amount_debt = 12;
  uint64 amount_shortfall = 13;
  uint64 cancelled_ms = 14;
  repeated RecallReviewRow needs_review = 15;  // 只有预览回:没进自动回收、要人工核对的流水
}

// 一条流水为什么没进自动回收。流水在内存改动时就发出、早于存盘提交,只是线索;
// 只有玩家已提交的资产账本(player_store)能证明一条收益真的落了盘、只落了一次。
enum RecallReviewReason {
  RECALL_REVIEW_REASON_UNSPECIFIED = 0;
  RECALL_REVIEW_NO_CORRELATION = 1;      // 流水没有指令号(correlation_id = 0),和已提交账本对不上
  RECALL_REVIEW_NO_PLAYER_STORE = 2;     // 玩家没有已提交的存档
  RECALL_REVIEW_NOT_IN_LEDGER = 3;       // 已提交账本里没有这条指令:不是资产通道发的(掉落、任务、战斗结算、GM 直发),或已滑出账本窗口,或从未落盘
  RECALL_REVIEW_LEDGER_AMBIGUOUS = 4;    // 已提交账本里不止一条收据带这个指令号
  RECALL_REVIEW_LEDGER_REJECTED = 5;     // 已提交账本记的是拒绝:这笔收益从没落盘,不该回收
  RECALL_REVIEW_LEDGER_PARTIAL = 6;      // 已提交账本记的是部分应用:落盘了多少说不清
  RECALL_REVIEW_LEDGER_NOT_APPLIED = 7;  // 已提交账本有这条指令的收据,但没有已应用的结局
  RECALL_REVIEW_ROWS_DISAGREE = 8;       // 账本证实只应用了一次,这条指令的几条流水却还原不成同一次发放
}

// 待人工核对的一条流水。
message RecallReviewRow {
  uint64 player_id = 1;                // 收到这笔收益的玩家(to_player)
  uint64 tx_id = 2;
  uint64 correlation_id = 3;
  uint32 tx_type = 4;
  uint64 amount = 5;                   // 这条流水记的收益:货币是 currency_delta,道具是 item_quantity
  uint64 item_uuid = 6;
  uint64 timestamp = 7;                // 流水时间(Unix 秒)
  RecallReviewReason reason = 8;
}

message GetRecallBatchRequest {
  uint64 request_id = 1;
}

// 取消只拦还没生效的行:scene 见过的 seq 照实记成已应用。
message CancelRecallBatchRequest {
  uint64 request_id = 1;
  string operator = 2;                 // 必填,≤ 64 字
  string reason = 3;                   // 必填,≤ 191 字
}

// 人工终结一行卡死的指令(scene 反复回 UNKNOWN,或一直投不出去)。证据只认这名玩家已提交的资产账本(player_store),
// 判据与 trade、guild 的 assetopfix 同一份;transaction_log 只是线索。放行对表见 exploit_loss_prevention_zh.md「人工终结」。
message ResolveRecallOpRequest {
  uint64 op_id = 1;
  uint32 final_status = 2;             // GmRecallOpStatus:只收 REJECTED、ABORTED、PARTIAL;收不收看证据(error_code 39)
  string operator = 3;                 // 必填,≤ 64 字
  string reason = 4;                   // 必填,≤ 191 字
}

// error_code:0 且 resolved = 终结了;0 且未 resolved = 这一行已不是 PENDING,现状见 status;39 = 证据不支持所选结局;
// 40 = 读证据之后这一行被领过、发过或已终结,重新调用;34 = 没有这个 op_id;11 = 读不到账本或库故障。除 0 且 resolved 外都没改数据。
message ResolveRecallOpResponse {
  uint32 error_code = 1;
  bool resolved = 2;                   // true = 本次终结了这一行
  uint32 status = 3;                   // GmRecallOpStatus:终结了是新状态;不是 PENDING 时是现状;其余是读证据时的 PENDING
  string evidence = 4;                 // 证据说明(读过账本才有):recall_accepts = 这条证据下能收的结局,其后是结论、来源和原因
}

// 把一条 needs_review 指令登记为交人工处置(exploit_loss_prevention_zh.md「待人工核对的流水」)。先登记、再处置:
// 登记之后这条指令的全部流水按已消费记进 gm_recall_source,以后的批次与预览都把它剔除,人工扣过的不会再被自动扣一次。
// 只收此刻确实在 needs_review 里的指令:tx_ids 与 review_reason 要和服务端按同一份计划代码重算的一致。
// 资产按 recall_kind 与 item_config_id / currency_type 区分,一条指令发了几种资产就分别登记。
message RegisterRecallReviewHandledRequest {
  RecallKind recall_kind = 1;              // 必填,与预览同
  uint32 item_config_id = 2;               // recall_kind=ITEM 时必填
  uint32 currency_type = 3;                // recall_kind=CURRENCY 时的币种,0 是银两
  uint64 player_id = 4;                    // needs_review 行的 player_id(收到这笔收益的玩家)
  uint64 correlation_id = 5;               // needs_review 行的 correlation_id,必须非 0:没有指令号的流水不会进自动回收,不用登记
  repeated uint64 tx_ids = 6;              // 预览 needs_review 里这条指令的全部 tx_id,不重复,上限 10000
  RecallReviewReason review_reason = 7;    // 预览里这条指令的原因
  string operator = 8;                     // 必填,≤ 64 字
  string reason = 9;                       // 必填,≤ 191 字:工单号与处置方式(例如 GmSanctionPlayer 挂了多少欠款)
}

// error_code:0 且 registered = 本次登记;0 且未 registered = 这条指令早已登记过,什么都没改;
// 32 = 它此刻不在 needs_review 里(账本已证实、能自动扣,已被回收批次消费,或 tx_ids / review_reason 与重算的对不上),重新预览;
// 34 = 没有这条指令的收益流水;17 = 流水超过上限;11 = 读不到账本或库故障。除 0 且 registered 外都没改数据。
message RegisterRecallReviewHandledResponse {
  uint32 error_code = 1;
  bool registered = 2;                     // true = 本次登记
  uint32 source_rows = 3;                  // 本次按已消费写进 gm_recall_source 的流水条数
  RecallReviewReason review_reason = 4;    // 服务端重算的原因;账本已证实、能自动扣时为 0
}

// ── Transaction Log Query ──────────────────────────────────────
//
// PostCrashReplay usage (cross-server-rollback-gap-fixes.md §2.4 B2):
//   Scene calls this with player_id + time_start=last_save_ms +
//   tx_types=[TX_ITEM_AWARD, TX_QUEST_COMPLETE, TX_LEVEL_UP, TX_BUFF_GAIN]
//   to fetch the "additive" ops the player earned between persistence
//   checkpoint and crash. Each returned row's tx_id is the dedup key
//   the replay tool tracks so a second replay of the same window is a
//   no-op. See transaction_log.proto's TX_ITEM_AWARD..TX_BUFF_GAIN doc.

message QueryTransactionLogRequest {
  uint64 player_id = 1;                // 0 = query all players
  uint64 time_start = 2;
  uint64 time_end = 3;
  repeated uint32 tx_types = 4;        // empty = all types
  uint32 item_config_id = 5;           // 0 = no item filter
  uint32 currency_type = 6;            // 0 = no currency filter
  uint32 limit = 7;                    // max results (default 100)
  uint64 offset = 8;                   // pagination offset
}

message TransactionLogRow {
  uint64 tx_id = 1;
  uint64 timestamp = 2;
  uint32 tx_type = 3;
  uint64 from_player = 4;
  uint64 to_player = 5;
  uint64 item_uuid = 6;
  uint32 item_config_id = 7;
  uint32 item_quantity = 8;
  uint32 currency_type = 9;
  int64  currency_delta = 10;
  uint64 balance_before = 11;
  uint64 balance_after = 12;
  uint64 correlation_id = 13;
  string extra = 14;
}

message QueryTransactionLogResponse {
  uint32 error_code = 1;
  repeated TransactionLogRow rows = 2;
  uint32 total_count = 3;              // total matching rows (for pagination)
}

// ── ID segment allocation ──────────────────────────────────────

message AllocateIdSegmentRequest {
  string biz_tag = 1;   // 种类:"player" / "guild" / "item"
  uint32 step = 2;      // 0 = 用发号器的默认长度;>0 = 本次希望领取的段长(服务端可能截短)
}

// 返回半开区间 [lo, hi):调用方独占这一段,服务端一经返回即视为已发出、绝不重发。
// 调用方段内发号完毕(或进程退出)剩余的号直接作废,不回收。
// lo、hi 是计数器值,调用方发号时要过一遍打散函数(go/shared/idsegment 的 MixID、C++ 的 MixGuid)。
// error_code 沿用本文件约定:0 = 成功,其余取值来自 data_service 自己的错误码轴
// (go/data_service/internal/constants/error_codes.go),不在 tip 码轴上,proto 里不写数字。
message AllocateIdSegmentResponse {
  uint32 error_code = 1;
  uint64 lo = 2;        // inclusive
  uint64 hi = 3;        // exclusive
}

// ── Player name registry ───────────────────────────────────────
//
// 三个 RPC 的共同前提:名字全服唯一,写入点只有建角(login),v1 不支持改名。
// 登记侧 fail-closed(登记不成功就不建角),读取侧 fail-open(拿不到名字照常放行)。

message ReservePlayerNameRequest {
  uint64 player_id = 1;
  // 调用方(login)已按 RoleNameRule 归一化并校验过;服务端再校验一遍,
  // 因为"规则包版本不一致"时必须以服务端为准,否则会写进唯一键一个不合规的名字。
  string name = 2;
}

// result 走自己的小常量轴(go/shared/playername),不是 tip 码、也不是 error_code:
//   0 = 成功(含"同 player_id 同名"的幂等重试)
//   1 = 已被别人占用
//   2 = 不合规(长度 / 字符集 / 敏感词)
// 常量定义在 go/shared/playername,data_service 与 login 共用,proto 里不写数字。
message ReservePlayerNameResponse {
  uint32 result = 1;
  // 仅 result=1 时填占用者 player_id。只给 login 判"是不是我自己丢了响应后的重试",
  // **不得下发客户端**:把占用者 id 透出去等于给了一条按名字查人的旁路。
  uint64 owner_player_id = 2;
}

// 条件删除:player_id 与 name 归一化后的 name_norm 都匹配才删 —— 只带 player_id 会
// 在"建角失败补偿"与"后来重登记了别的名字"撞车时删错行。
// 不带 x-admin-token:auth 必须是 login 的签名(密钥 MMORPG_ACCOUNT_DIRECTORY_SECRET_LOGIN),
// 只删 created_ms 落在 PlayerName.ReleaseWindow 内的行(login 建角补偿);
// 带合法 x-admin-token:不限登记时间(运维按日志清孤儿)。
// 两条路径都只删预留态的行:已绑定的回 FAILED_PRECONDITION;删之前在玩家片证明这名角色永远不会提交,
// 角色已提交同样回 FAILED_PRECONDITION(docs/design/guild-phase2/03-names.md §3.4a)。
message ReleasePlayerNameRequest {
  uint64 player_id = 1;
  string name = 2;
  common.base.ServiceCallAuth auth = 3;
}

// 一次最多 500 个 id;超了返回 InvalidArgument,不做截断 —— 静默截断会让调用方
// 把"没返回"当成"没登记",给玩家显示空名。
message BatchGetPlayerNameRequest {
  repeated uint64 player_ids = 1;
}

// 缺席的 id(未登记 / 已释放)不出现在 map 里,不是错误(与 BatchGetPlayerHomeZone 同口径)。
// 但 SQL 失败时不回部分结果:半份结果无法与"这些 id 确实没名字"区分。
message BatchGetPlayerNameResponse {
  map<uint64, string> names = 1;
}

message BatchGetPlayerDisplayRequest {
  repeated uint64 player_ids = 1;      // 最多 1024 个
}

message PlayerDisplay {
  string name = 1;
  uint32 level = 2;                    // 还没存过盘的新角色是 0
  uint32 class_id = 3;
  uint32 gender = 4;
  string appearance_id = 5;
}

// 缺席的 id(角色不存在)不出现在 map 里,不是错误。
message BatchGetPlayerDisplayResponse {
  map<uint64, PlayerDisplay> players = 1;
}

// ── 资产通道:已落盘账本 ───────────────────────────────────────
//
// 语义:读 player_store 的资产行(kind=ASSET)和写权行,出自同一条语句,看到的是已提交的最新值。
// 读不成一律走 gRPC 错误,**绝不**用 found=false 顶替:
//   - 库读失败、片段损坏 → Internal;
//   - player_id = 0 → InvalidArgument。

message GetPlayerAssetOpLedgerRequest {
  uint64 player_id = 1;
}

message GetPlayerAssetOpLedgerResponse {
  bool found = 1;                          // false = 这个玩家没有写权行(从未建角)
  PlayerAssetOpLedgerComp ledger = 2;      // found=true 且玩家从未有过资产操作时为空消息(不是缺席)
  bool player_released = 3;                // 写权行 released=1:持有者已最终存盘并释放,或者没有人认领过
}

// ── 玩家收件箱:已落盘账本 ─────────────────────────────────────
//
// 语义与错误口径同上面的资产通道账本:读 player_store 资产行里的 inbox_ledger。
// 响应形状同 GetPlayerAssetOpLedgerResponse:只有 found 与 ledger,不带 error_code 也不带 tip(设计 §1.4 注)。

message GetPlayerInboxLedgerRequest { uint64 player_id = 1; }

message GetPlayerInboxLedgerResponse {
  bool found = 1;                          // false = 这个玩家没有写权行(从未建角)
  PlayerInboxLedgerComp ledger = 2;        // found=true 且玩家从未消费过收件箱时为空消息(不是缺席)
}

// ── 单玩家物品获取封禁:已落盘封禁表 ───────────────────────────────
//
// 语义与错误口径同上面两本账本,只是读的是资料行(kind=PROFILE)里的 item_gain_block。封禁表与收件箱账本
// 不在同一行,但由 scene 的同一次存盘、同一个事务提交(docs/design/player-save-direct-commit.md §1.1)。
// 响应形状同 GetPlayerInboxLedgerResponse:只有 found 与封禁表,不带 error_code 也不带 tip。

message GetPlayerItemGainBlockRequest { uint64 player_id = 1; }

message GetPlayerItemGainBlockResponse {
  bool found = 1;                          // false = 这个玩家没有写权行(从未建角)
  PlayerItemGainBlockComp block = 2;       // found=true 且从未被封过时为空消息(不是缺席)
}
