syntax = "proto3";
option go_package = "db/proto/common/database";

import "proto/db/proto_option.proto";
import "proto/common/base/user_accounts.proto";
import "proto/common/component/asset_op_ledger_comp.proto";
import "proto/common/component/player_inbox_ledger_comp.proto";
import "proto/common/component/player_battle_result_comp.proto";
import "proto/common/component/player_attribute_comp.proto";
import "proto/common/component/player_mystery_merchant_comp.proto";
import "proto/common/component/player_pet_comp.proto";
import "proto/common/component/player_scene_comp.proto";
import "proto/common/component/actor_comp.proto";
import "proto/common/component/player_comp.proto";
import "proto/common/component/player_skill_comp.proto";
import "proto/common/component/currency_comp.proto";
import "proto/common/component/player_item_gain_block_comp.proto";
import "proto/common/component/client_request_ledger_comp.proto";
import "proto/common/component/player_item_hold_comp.proto";
import "proto/common/component/player_mail_outbox_comp.proto";
import "proto/common/database/bag_quest_mail_data.proto";

// ------------------- User basic info table -------------------
message user
{
  option(OptionTableName) = "user";
  option(OptionPrimaryKey) = "id";
  option(OptionIndex) = "last_login";  // Index on last_login

  uint64 id = 1;                 // Globally unique user ID
  string display_name = 2;       // Nickname, may be empty
  bool is_guest = 3;             // Whether guest
  uint64 create_time = 4;        // Creation timestamp
  uint64 last_login = 5;         // Last login timestamp
}

// ------------------- Third-party OAuth binding table -------------------
message user_oauth
{
  option(OptionTableName) = "user_oauth";
  option(OptionPrimaryKey) = "user_id,provider";           // PK = user_id + provider
  option(OptionUniqueKey) = "provider,provider_id";       // UNIQUE(provider, provider_id)

  uint64 user_id = 1;           // FK -> user.id
  string provider = 2;          // weixin/google/apple/qq
  string provider_id = 3;       // openid/sub
  uint64 create_time = 4;       // Creation timestamp
}

// ------------------- Phone binding table -------------------
message user_phone
{
  option(OptionTableName) = "user_phone";
  option(OptionPrimaryKey) = "user_id";                   // One record per user
  option(OptionUniqueKey) = "phone";                      // UNIQUE(phone)

  uint64 user_id = 1;           // FK -> user.id
  string phone = 2;             // Phone number
  uint64 create_time = 3;       // Creation timestamp
}

// ------------------- Password table -------------------
message user_password
{
  option(OptionTableName) = "user_password";
  option(OptionPrimaryKey) = "user_id";

  uint64 user_id = 1;           // FK -> user.id
  string hash = 2;              // Password hash
  uint64 create_time = 3;       // Creation timestamp
}

message user_accounts
{
  option(OptionTableName) = "user_accounts";
  option(OptionPrimaryKey) = "account";
  string account = 1;
  string password = 2;
  AccountSimplePlayerList simple_players = 3;
}

message account_share_database
{
  option(OptionTableName) = "account_share_database";
  option(OptionPrimaryKey) = "account";
  string account = 1;
}

// Centre-specific player data
message player_centre_database
{
  option(OptionTableName) = "player_centre_database";
  option(OptionPrimaryKey) = "player_id";
  option(OptionAutoIncrementKey) = "player_id";
  // 雪花主键 + TiDB 聚簇表 = 写热点,按 §D3 处方打散(global-data-layer-tidb-decision.md)
  option(OptionTiDBNonclusteredPK) = true;
  option(OptionTiDBShardRowIDBits) = 4;
  option(OptionTiDBPreSplitRegions) = 4;
  uint64 player_id = 1;
  PlayerSceneContextComp scene_info = 2;
}

// 玩家存档的内存形状:没有 OptionTableName,不建表。落库的是 player_store 里按行投影出来的片段
// (docs/design/player-save-direct-commit.md §1.1)。每个字段都用 OptionPersistGroup 声明属于哪一行,
// 取值是 playerstore.PlayerStoreKind 的数值:
//   9 = LOCATION(位置,只顺带写)  6 = CHARACTER(等级、基础属性与当前血蓝)  7 = WALLET(货币与账本)
//   8 = BAG(背包)  3 = GROWTH(技能、加点、宠物、任务)  4 = PROFILE(职业、注册时间、身份等小而少变的字段)
//   0 = 元数据,不进片段。
// 新字段不标、标到退役的 1 / 2 / 5 或不存在的行,scene 都拒绝启动。
// 选哪一行只看大小、变化频率、和谁一起变:一次存盘的所有脏行同事务、同一个整笔序号,
// 所以「必须同一次提交」的不变量(I3、IB-3)不要求同一行。
message player_database
{
  option (OptionIsPlayerDatabase) = true;
  // 10 是合服标记,17 是旧战斗结算账本,18 / 19 是旧存盘围栏,都已删除。
  reserved 10, 17, 18, 19;
  uint64 player_id = 1 [(OptionPersistGroup) = 0];
  Transform transform = 2 [(OptionPersistGroup) = 9];  // LOCATION
  // 注册时间:建角后只在首次进场写一次。
  PlayerUint64Comp uint64_pb_component = 3 [(OptionPersistGroup) = 4];  // PROFILE
  PlayerSkillListComp skill_list = 4 [(OptionPersistGroup) = 3];  // GROWTH
  // 职业:建角事务里和名字、外观、性别一起写进 PROFILE 行。
  PlayerUint32Comp uint32_pb_component = 5 [(OptionPersistGroup) = 4];  // PROFILE
  // 字段名沿用旧名:装的是基础属性和当前血蓝(BaseAttributesComp);真正的派生属性 DerivedAttributesComp 不落库,加载时重算。
  BaseAttributesComp derived_attributes_component = 6 [(OptionPersistGroup) = 6];  // CHARACTER
  LevelComp level_component = 7 [(OptionPersistGroup) = 6];  // CHARACTER
  CurrencyComp currency = 8 [(OptionPersistGroup) = 7];  // WALLET
  // Stress-test instrumentation. Empty during normal play. See
  // PlayerStressTestProbe for the verification contract.
  // scene 每次真正写盘时重新打探针、不读回加载值,所以标 OptionPersistUncarried
  // (docs/design/mixed-version-persist-field-protection.md §3.2)。
  PlayerStressTestProbe stress_test_probe = 9 [(OptionPersistUncarried) = true, (OptionPersistGroup) = 4];
  // 属性加点(方案/已分配点/额外点/外部加成),设计文档 player-attribute-allocation.md
  PlayerAttributeComp attribute_component = 11 [(OptionPersistGroup) = 3];
  // 宝宝(宠物):实例列表 + 出战中的宝宝,设计文档 player-pet.md
  PlayerPetComp pet_component = 12 [(OptionPersistGroup) = 3];
  // 背包资产与任务领取权随同一次存盘提交保存(不同行、同一事务)。背包是最大的一行,单独成行,
  // 改货币、账本时不用重写整个背包。
  BagAllData bag_component = 13 [(OptionPersistGroup) = 8];  // BAG
  QuestAllData mission_component = 14 [(OptionPersistGroup) = 3];
  // 角色名副本,见 player_comp.proto PlayerProfileComp。
  // 真源是 data_service 全局库的 player_name 表(全服唯一);这里只是随 player_database
  // 走的只读副本 —— login 首次入场补齐,scene 只读、只原样存回。副本允许"缺失"
  // (entergame self-heal 恢复出的空记录、早于首次入场的回档快照),读侧一律回源
  // BatchGetPlayerName,不要把空名当成"这个角色没有名字"。
  //
  // 【加列纪律】player_database 新字段一律取"落码当时的下一个空闲号",并声明在 message 末尾。
  PlayerProfileComp profile_component = 15 [(OptionPersistGroup) = 4];
  // 通用资产通道账本(每流 seq 窗口),docs/design/guild-phase2/04-asset-channel.md §4.3.4。
  // 必须与 currency / bag_component 同一次提交:账本与资产一起落盘、一起丢,
  // 否则会出现"资产落了账本没落"的中间态,同一笔指令被重复应用(不变量 I3)。同一次存盘的脏行同事务,所以不要求同一行。
  PlayerAssetOpLedgerComp asset_op_ledger = 16 [(OptionPersistGroup) = 7];  // WALLET
  // 玩家收件箱消费端账本(docs/design/player-inbox-service.md §4.4):每域「已按 seq 处理到哪」+ 最近 32 条结局。
  // 与 asset_op_ledger 同一条不变量 I3(收件箱侧记作 IB-3):必须与 currency / bag_component 同一次落盘 ——
  // GM 处置的效果(封锁 / 欠款随 CurrencyComp 落盘)和它的账本要么一起在盘上,要么一起没有;
  // 否则「效果落了账本没落」会让不幂等的 AttachDebt 被重复执行,「账本落了效果没落」会把没生效的处置确认成已执行。
  PlayerInboxLedgerComp inbox_ledger = 20 [(OptionPersistGroup) = 7];  // WALLET
  // 覆盖世代(docs/design/mixed-version-persist-field-protection.md §3.3):这份记录里该世代及以前定义的字段,值都是真实的。
  // 由 scene 存盘时盖章 max(本二进制世代, 加载世代);go/db 据此判定超前延后 / 倒退拒写(§6.2)。
  // 0 = 未盖戳(机制上线前写入或 login 新号种子),所有比较先按 1 处理。世代号由 proto 生成器按
  // proto/persist_schema_gen.txt 发放,不要手写数字。
  // 按加列纪律取 20 之后的下一个空闲号 21,声明在末尾、不留空洞。
  uint32 persist_schema_gen = 21 [(OptionPersistGroup) = 0];
  // 神秘商人的个人限购记录(docs/design/mystery-merchant.md §5.3)。与上面几本账本同一条不变量 I3:
  // 必须与 currency / bag_component 同一次落盘 —— 「钱、货、已购数」要么一起在盘上,要么一起回档,
  // 否则回档后会出现「货没了名额却用掉了」或「货还在名额却清零可再买」。
  // 与覆盖世代合并后取下一个空闲号 22；项目尚未上线，下一个新字段从 23 起。
  PlayerMysteryMerchantComp mystery_merchant = 22 [(OptionPersistGroup) = 7];  // WALLET
  // 近期战斗结果(docs/design/battle-result-recovery.md §4):结算应用的同一帧写入,与奖励、收件箱账本同一次存盘提交。
  // 一次存盘的所有脏行同事务、同一个整笔序号(docs/design/player-save-direct-commit.md §1.1),所以不必与资产同组;
  // 放 PROFILE 组:列表只在结算与客户端确认时变,放 ASSET 会让每一次资产写入都带上它。
  // 取下一个空闲号 23;下一个新字段从 24 起。
  PlayerBattleResultComp battle_results = 23 [(OptionPersistGroup) = 4];
  // 单玩家物品获取封禁(docs/design/player-inbox-service.md §2.2):GM 处置的效果状态,由收件箱 GM 域执行器写。
  // 与执行账本 inbox_ledger 同一次存盘提交(IB-3):一次存盘的所有脏行同事务(player-save-direct-commit.md §1.1),
  // 所以不必与 inbox_ledger 同一行;它小、只在 GM 处置时变,放 PROFILE 行,不让每一次货币写入都带上它。
  // 加载时无条件挂组件、存盘时缺组件整份拒存(持久数据,ecs-component-access-rules.md)。
  // 取下一个空闲号 24;下一个新字段从 25 起。
  PlayerItemGainBlockComp item_gain_block = 24 [(OptionPersistGroup) = 4];  // PROFILE
  // 客户端请求幂等键账本(docs/design/client-request-idempotency.md §5.3):强化、神秘商人购买、新建加点方案
  // 执行成功后记一条「键 -> 参数指纹 + 首次结果」,同键重发只回首次结果。与上面几本账本同一条不变量 I3:
  // 必须与 currency / bag_component 同一次存盘提交 —— 「效果落了、记录没落」会让带原键的重发再执行一次。
  // 放 WALLET 组:带键的操作都会改货币,这一行本来就要写,不会让存盘多写一行。
  // 加载时无条件挂组件、校验不过挂失效标签(带键请求一律 fail-closed),存盘缺它整份拒存(持久数据)。
  // 取下一个空闲号 25;下一个新字段从 26 起。
  ClientRequestLedgerComp client_request_ledger = 25 [(OptionPersistGroup) = 7];  // WALLET
  // 物品数量预留(docs/design/battle-item-reservation.md):备战时把带进战斗的道具按配置号与数量占住,结算只从这里扣,
  // 作废或取消时释放。必须与 bag_component 同一次存盘提交 —— 「预留落了、背包没落」会把玩家的东西占住而没有对应的战斗,
  // 「背包落了、预留没落」会让晚到的结算按持有量夹紧(药白喝)。一次存盘的所有脏行同事务(player-save-direct-commit.md §1.1),
  // 所以不必与背包同组;它小、只在备战与结算时变,放 PROFILE 行,不让每一次背包写入都带上它。
  // 加载时无条件挂组件、存盘时缺它整份拒存(持久数据,ecs-component-access-rules.md)。
  // 取下一个空闲号 26;下一个新字段从 27 起。
  PlayerItemHoldComp item_holds = 26 [(OptionPersistGroup) = 4];  // PROFILE
  // 待寄邮件(docs/design/battle-overflow-mail.md):战斗结算两包都放不下时整批改投邮件,还没交到邮件服务的那几封。
  // 必须与扣消耗、入账同一次存盘提交 —— 「结算落了、待寄没落」物品就没了,「待寄落了、结算没落」结算重做时会再发一份。
  // 一次存盘的所有脏行同事务(player-save-direct-commit.md §1.1),所以不必与背包同组;它是欠玩家的资产,与 asset_op_ledger、
  // inbox_ledger 一样放 WALLET 行。正常为空,只在改投与寄出时变。
  // 加载时无条件挂组件、存盘时缺它整份拒存(持久数据,ecs-component-access-rules.md)。
  // 取下一个空闲号 27;下一个新字段从 28 起。
  PlayerMailOutboxComp mail_outbox = 27 [(OptionPersistGroup) = 7];  // WALLET
}

// 玩家存档的新表(docs/design/player-save-direct-commit.md §1)。同一玩家的所有行挨在一起:
// kind 0 是写权行,其余每个 kind 一行(player_store.PlayerStoreKind),payload 是 player_database
// 按字段投影出来的一段序列化结果。一条语句就能读出一个玩家的全部行。
// proto2mysql 只负责建表,读写在 go/db/internal/playerstore 里手写。
// ID 是打散过的,主键不会形成写热点,所以用默认的聚簇主键,点查不用回表。
message player_store
{
  option(OptionTableName) = "player_store";
  option(OptionPrimaryKey) = "player_id,kind";
  uint64 player_id = 1;
  uint32 kind = 2;
  uint64 owner_epoch = 3;      // 写权行:当前代次;数据行:最后写入时的代次
  uint64 save_seq = 4;         // 写权行:最后提交的整笔序号;数据行:最后写入时的序号
  uint32 schema_gen = 5;       // 写权行:写过的最高世代;数据行:写入时世代
  bytes holder_instance = 6;   // 只写权行用:持有者的 scene_instance_id
  uint32 released = 7;         // 只写权行用:1 = 持有者已最终存盘并释放
  bytes payload = 8;
  uint64 claim_seq = 9;        // 只写权行用:每次认领加 1。同实例同代次重新认领时 (owner_epoch, holder_instance) 不变,判死靠它比得出来
}

// 审计发件箱(docs/design/player-audit-outbox.md,断线重连 R13):和 player_store 在同一个存档库。
// go/db 在提交一笔存档的同一个事务里写入随这一笔交来的审计记录,转发循环投 Kafka、broker 确认之后按主键删除。
// 「这里有这条」等于「它描述的改动已提交」。只有 go/db 读写;读写语句在 go/db/internal/playerstore 与 internal/auditoutbox 里手写。
// 主键片内按时间排:插入即删的队列在 TiDB 里留 MVCC 墓碑,转发从「上一轮最老的未投记录」附近往后扫,跨不过整片的墓碑(设计 §3、§7.2)。
message player_audit_outbox
{
  option(OptionTableName) = "player_audit_outbox";
  option(OptionPrimaryKey) = "shard,kind,created_ms,player_id,record_id";
  uint32 shard = 1;        // player_id % 16:转发按 (存档库, 片) 分工、按片扫描
  uint32 kind = 2;         // playerstore.PlayerAuditKind:1 流水、2 快照
  uint64 created_ms = 3;   // 写入它的 go/db 在提交事务里取的墙钟毫秒;片内按它扫,积压年龄按它算
  uint64 player_id = 4;    // Kafka key
  uint64 record_id = 5;    // tx_id 或 snapshot_id
  uint64 save_seq = 6;     // 带它提交的那一笔存盘的序号,只供排查
  bytes payload = 7;       // Kafka 消息体原样:序列化的 TransactionLogEntry / PlayerSnapshotEntry
}

// player_database_1 已于 2026-11-05 删除(docs/design/player-save-direct-commit.md §1.2):它只剩 player_id、压测探针、
// 覆盖世代,后两个 player_database 里都有。玩家持久数据只有 player_database 一个消息;不要再按「重要 / 不重要」开第二张子表,
// 存储位置由 OptionPersistGroup 选行。持久 schema 台账里它的字段行按「类型已不可达」保留,不复用。

// player_snapshot / rollback_audit_log 已移到 rollback_database_table.proto:导表器按本文件的 message 成员生成 zone 库建表清单(generated/data/mysql_database_table_list.json),而这两张表只该存在于全局库(data_service)一处。

