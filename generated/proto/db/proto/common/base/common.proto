syntax = "proto3";
option go_package = "db/proto/common/base";



message EndpointComp
{
  string ip = 1;
  uint32 port = 2;
}

// 节点可分配状态（NodeInfo.admission，R6，docs/design/global-match-hierarchical-pools.md §5.1）。
// 取值上线后不复用；废弃时写 `reserved` 并注明原因（AGENTS.md §4.3）。
enum NodeAdmission {
  NODE_ADMISSION_UNSPECIFIED = 0; // 未上报：非 battle 节点，或不认识本字段的旧版本
  NODE_ADMISSION_OPEN = 1;        // 接新房间（仍须过 battle 的建房准入闸与 Agones 分配许可）
  NODE_ADMISSION_CLOSED = 2;      // 不接新房间：启动未完成、Agones 排空或未就绪、停机或维护关闸
}

message NodeInfo {
  uint32 node_id = 1;
  uint32 node_type = 2;
  uint64 launch_time = 3;
  uint32 scene_node_type = 4;
  EndpointComp endpoint = 5;
  uint32 zone_id = 6;
  uint32 protocol_type = 7; // Node communication protocol type
  string node_uuid = 8;
  uint32 player_count = 9; // Current online player/connection count (for load balancing)
  EndpointComp grpc_endpoint = 10; // gRPC server endpoint (for Go services to connect)
  // 客户端可达地址（advertised address，语义同 Kafka advertised.listeners）。
  // 只由客户端面节点（gate / battle）在 etcd 发布前自报。
  // 缺失（未设置或不可用，判据见下）时：消费方 require=false 回落 endpoint（podip 模式）；
  // require=true 跳过该节点 / 拒签（external 模式纵深防御）。require 即 login / scene_manager 的
  // RequireClientEndpoint、battle 的 CLIENT_ENDPOINT_REQUIRED（docs/design/k8s-client-entry.md D78 / D79）。
  // 只用于下发给客户端：login CandidatesForZone / scene_manager RedirectToGate / battle BuildAssignment。
  // 不参与端口 CAS、节点间对端校验、gRPC 拨号、FindNodeByPodIP —— 这些永远用 endpoint / grpc_endpoint。
  // ip 可以是 IPv4 字面量或 DNS 名；port 是客户端连接端口（可能是 NodePort / hostPort，与 endpoint.port 不同）。
  // 可用 = ip 非空且 port 在 1..65535；半填（只有 ip 或只有 port）视为缺失。
  // 字段号 11 上线后不复用；废弃时写 `reserved 11;`（AGENTS.md §4.3）。
  EndpointComp client_endpoint = 11;
  // 真实机房身份，由部署注入。0 = 未声明，不能用于跨地域匹配。
  uint32 physical_region = 12;
  // 客户端连接上限：gate 启动时自报它的 GateMaxConnections（etc/base_deploy_config.yaml），与 player_count 同一单位。
  // 0 = 未声明（非 gate 节点、dev 下不设上限的 gate），消费方不按上限过滤。
  // login 挑 gate 时剔除人数到上限 90% 的 gate（docs/design/gate-load-balancing-design.md「满载与停写的 gate」）。
  // 字段号 13 上线后不复用；废弃时写 `reserved 13;`（AGENTS.md §4.3）。
  uint32 max_connections = 13;
  // 可分配状态（R6）：此刻接不接新工作。battle 与 scene 填写，其它节点留 0（UNSPECIFIED）。
  // - battle：新房间。etcd 首次发布前填 CLOSED；建房准入闸打开且 Agones 放行许可后改 OPEN；排空、停机或维护关闸时改回 CLOSED。
  //   match 选点排除 CLOSED。
  // - scene：新场景、新玩家与疏散落点。平时留 UNSPECIFIED（按开放处理）；计划排空开始时改 CLOSED，之后不再打开
  //   （docs/design/scene-node-planned-drain.md §4.2）。scene_manager 选点排除 CLOSED，不影响它是不是活着、是不是场景属主。
  // 只在变化时写 etcd，并按 watch 回读到的自身登记对账（cpp/libs/engine/core/node/system/node/node_admission_advertise.h），稳态零写入。
  // 负载不放这里：房间数随 CreateBattleResponse.room_count 捎回，不周期写注册信息（写放大与读量随进程数平方增长）。
  // UNSPECIFIED 视为可选（旧节点 / 未上报）。只是提示，能否建房、建场景仍由节点自己的准入判定。
  // 字段号 14 上线后不复用；废弃时写 `reserved 14;`（AGENTS.md §4.3）。
  NodeAdmission admission = 14;
  // 发布轨道（docs/design/release-track-gray-canary.md §2.1）："stable" 或 "canary"。
  // 由部署经环境变量 MMORPG_RELEASE_TRACK 注入，进程存续期间不变；生产者只写这两个值。
  // 消费方把空串（没写轨道的节点）当 stable，其他值当无效节点跳过。
  // 用字符串不用枚举：发现方按 protojson 宽松解析，未知的枚举名会被静默丢成 0，将来新增的轨道会被误当成 stable。
  // 字段号 15 上线后不复用；废弃时写 `reserved 15;`（AGENTS.md §4.3）。
  string release_track = 15;
  // 部署构建标识（docs/design/scene-node-planned-drain.md §4.6）：与 Pod 标签 mmorpg.io/build 同一个值，
  // 部署经环境变量 MMORPG_BUILD_LABEL 注入，进程存续期间不变；空串 = 没上报（本机开发）。
  // 只用于选点偏好：scene_manager 把「本 zone 里有排空中节点的构建」当作外出构建，落点优先选别的构建。
  // 不参与任何提交判定，也不是发布轨道（release_track）。
  // 字段号 16 上线后不复用；废弃时写 `reserved 16;`（AGENTS.md §4.3）。
  string build = 16;
}

message NetworkAddress
{
  string ip = 1;
  uint32 port = 2;
}

