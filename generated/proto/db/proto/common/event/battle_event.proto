syntax = "proto3";
option go_package = "db/proto/common/event";

import "proto/battle/battle_data.proto";

// 回合制战斗事件(经 SceneCommand{DispatchEvent} 进 scene 节点进程内分发)。
// Kafka 投递要求:topic = scene-{node_id},key = player_id(保序),
// target_instance_id = 快照 BattleRouting.scene_instance_id(防僵尸,宪法 §7 不变量 2)。

// battle -> scene:战斗结算。scene 是唯一应用者:
// 校验 InBattleComp.battle_id 匹配 -> 应用 -> 摘 InBattleComp + DEL battle:lock;
// 不匹配丢弃并告警;玩家不在场 -> 写 battle:settlement:pending:{player_id}(TTL 7d)。
message BattleSettlementEvent {
  BattleSettlementData settlement = 1;
}

// battle -> scene:CreateBattle 成功后每个参战玩家一条。scene 校验 InBattleComp.battle_id 匹配且
// state==PREPARING -> state=FIGHTING、deadline_ms=event.deadline_ms、battle:lock 按正式期限续期;
// 不匹配 / 已 FIGHTING / 玩家不在线(锁值匹配则只续期)一律幂等处理。
// 目的:备战期用短 prepare_deadline_ms 解冻,match 在 gather 中崩溃时已冻结成员不再等整场战斗时限。
message BattleConfirmedEvent {
  uint64 battle_id = 1;
  uint64 player_id = 2;
  uint64 deadline_ms = 3;  // 正式战斗作废期限(= CreateBattleRequest.deadline_ms)
}
