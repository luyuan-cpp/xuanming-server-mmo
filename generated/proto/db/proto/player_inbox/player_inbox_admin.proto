syntax = "proto3";
package player_inbox;

option go_package = "db/proto/player_inbox";
option cc_generic_services = false;

import "proto/common/base/tip.proto";
import "proto/player_inbox/player_inbox.proto";

// 玩家收件箱运维接口(docs/design/player-inbox-service.md §5.2、§1.6)。
//
// 鉴权:每个方法都要求 metadata `x-admin-token`,口令取服务配置 PlayerInbox.AdminToken,常数时间比较;
// 口令为空 = 整个运维面停用(fail-closed)。写操作同库同事务记 player_inbox_audit,审计记调用方自报的
// operator 与对端地址(地址是唯一不可伪造的部分)。
// 节点类型:不写 OptionFileDefaultNode(理由见 player_inbox.proto 文件头);服务名 PlayerInboxAdmin 不在
// eNodeType 里,protogen 按 package player_inbox 回落到 PlayerInboxNodeService。
// 内部服务:不标 OptionIsClientProtocolService,不进客户端 gen_proto.ps1 清单。
// v0.1 的 RequeueItem / ResetFence / RebaseAfterRestore 已删除(设计 §5.2),不要加回。
// 所有 id、时间、epoch 一律 uint64(AGENTS §4)。

service PlayerInboxAdmin {
  // GM 处置入箱(幂等)。v1 唯一的生产方(设计 §6.1)。
  rpc GmSanctionPlayer(GmSanctionPlayerRequest) returns (GmSanctionPlayerResponse) {}
  // 按玩家列出各域流的概况;max_fence_epoch 供 epoch-raise 取最大值(设计 §7.8、C4)。
  rpc GetSummary(GetPlayerInboxSummaryRequest) returns (GetPlayerInboxSummaryResponse) {}
  // 按 player_id + domain + state 过滤列条目,after_seq 翻页。
  rpc ListItems(ListPlayerInboxItemsRequest) returns (ListPlayerInboxItemsResponse) {}
  // (player_id, producer_kind, request_id) → 条目与结局。
  rpc LookupByRequest(LookupPlayerInboxRequest) returns (LookupPlayerInboxResponse) {}
  // 未投递 → VOIDED;已投递 → 只挂 VOID 指令,由消费方裁决(IB-5)。
  // 强制模式(mode=FORCE_MISMATCH)只为解开 scene 回放核对判 MISMATCH 之后的永久停用,见 PlayerInboxVoidMode。
  rpc VoidItem(VoidPlayerInboxItemRequest) returns (VoidPlayerInboxItemResponse) {}
  // 单个玩家比对收件箱与已落盘账本(设计 §9.3)。第 4 批实现,此前服务端回 UNIMPLEMENTED。
  rpc ReconcilePlayer(ReconcilePlayerInboxRequest) returns (ReconcilePlayerInboxResponse) {}
  // 单玩家物品获取封禁的查询(设计 §2.2):已落盘的本人封禁表,加上还没生效的物品封禁 / 解封单。只读,不写审计。
  rpc GetItemGainBlocks(GetPlayerItemGainBlocksRequest) returns (GetPlayerItemGainBlocksResponse) {}
}

// ── GmSanctionPlayer ─────────────────────────────────────────────────────

// 生产方契约(写进 runbook):request_id 与 issued_at_ms 按工单只生成一次,重试原样带回;
// issued_at_ms 进内容摘要,刷新它重试会得到 kPlayerInboxIdempotencyConflict(设计 §6.2)。
message GmSanctionPlayerRequest {
  uint64 player_id = 1;
  uint64 request_id = 2;                // 运维工具按工单生成一次,重试原样带回;必须非 0
  uint64 issued_at_ms = 3;              // 同上;只接受 [now-7d, now+5min];进入内容摘要(IB-2)
  oneof action {
    GmCurrencyGainPayload block_gain = 4;     // → PLAYER_INBOX_MSG_GM_BLOCK_CURRENCY_GAIN
    GmCurrencyGainPayload unblock_gain = 5;   // → PLAYER_INBOX_MSG_GM_UNBLOCK_CURRENCY_GAIN
    GmCurrencyDebtPayload attach_debt = 6;    // → PLAYER_INBOX_MSG_GM_ATTACH_CURRENCY_DEBT;gm_operator 由服务端用 operator 覆盖
    // 7 / 8 是下面的 reason / operator,oneof 成员接着取 9 起。
    GmItemGainPayload block_item_gain = 9;    // → PLAYER_INBOX_MSG_GM_BLOCK_ITEM_GAIN:本玩家今后不能获得该配置的物品
    GmItemGainPayload unblock_item_gain = 10; // → PLAYER_INBOX_MSG_GM_UNBLOCK_ITEM_GAIN
  }
  string reason = 7;                    // 必填,≤ 256B,UTF-8;进审计
  string operator = 8;                  // 必填,≤ 64B,UTF-8;进审计与条目 operator_name
}

message GmSanctionPlayerResponse {
  TipInfoMessage error_message = 1;
  uint64 seq = 2;                       // 新建或已存在条目的 seq
  bool created = 3;                     // false = DUPLICATE(同键同摘要),返回原 seq 与当前状态
  PlayerInboxItemState state = 4;
}

// ── GetSummary ───────────────────────────────────────────────────────────

message GetPlayerInboxSummaryRequest {
  uint64 player_id = 1;
}

message PlayerInboxStreamSummary {
  PlayerInboxDomain domain = 1;
  uint32 open_count = 2;                // PENDING 条数
  uint64 next_seq = 3;
  uint64 fence_epoch = 4;               // owner_epoch 高水位
  uint32 delivered_unacked_count = 5;   // PENDING 且 delivery_count > 0
  uint64 oldest_pending_created_ms = 6; // 最老未决条目的入箱时刻;0 = 无未决
  uint64 notify_due_ms = 7;             // 0 = 无待补提醒
}

message GetPlayerInboxSummaryResponse {
  TipInfoMessage error_message = 1;
  uint64 player_id = 2;
  repeated PlayerInboxStreamSummary streams = 3;  // 按 domain 升序;没有流时为空
  uint64 max_fence_epoch = 4;           // 各流 fence_epoch 的最大值;epoch-raise 的取最大值来源之一
}

// ── ListItems / LookupByRequest ──────────────────────────────────────────

// 运维视图:条目的全部列。载荷原样返回,由运维工具按 msg_type 的 payload_message 解码。
message PlayerInboxItemView {
  PlayerInboxDomain domain = 1;
  uint64 seq = 2;
  PlayerInboxMessageType msg_type = 3;
  PlayerInboxProducerKind producer_kind = 4;
  uint64 request_id = 5;
  bytes payload = 6;
  PlayerInboxItemState state = 7;
  PlayerInboxDirective directive = 8;
  PlayerInboxVoidReason void_reason = 9;
  uint32 delivery_count = 10;
  uint64 last_delivered_epoch = 11;
  uint64 last_delivered_ms = 12;
  uint32 outcome_reason = 13;           // 消费方给的 tip id;APPLIED 时为 0
  PlayerInboxFinalizer finalized_by = 14;
  uint64 decided_epoch = 15;
  uint64 issued_at_ms = 16;
  uint64 created_ms = 17;
  uint64 updated_ms = 18;
  string operator_name = 19;
  string note = 20;
}

message ListPlayerInboxItemsRequest {
  uint64 player_id = 1;
  PlayerInboxDomain domain = 2;         // 必须非 UNSPECIFIED
  PlayerInboxItemState state = 3;       // UNSPECIFIED = 不按状态过滤
  uint64 after_seq = 4;                 // 只返回 seq > after_seq;0 = 从头
  uint32 limit = 5;                     // 0 → 50,上限 200
}

message ListPlayerInboxItemsResponse {
  TipInfoMessage error_message = 1;
  repeated PlayerInboxItemView items = 2;  // 按 seq 升序
  bool has_more = 3;                    // true 时以最后一条的 seq 作下一页的 after_seq
}

message LookupPlayerInboxRequest {
  uint64 player_id = 1;
  PlayerInboxProducerKind producer_kind = 2;
  uint64 request_id = 3;
}

message LookupPlayerInboxResponse {
  TipInfoMessage error_message = 1;     // 查不到 → kPlayerInboxItemNotFound
  PlayerInboxItemView item = 2;
}

// ── VoidItem ─────────────────────────────────────────────────────────────

// 作废模式。
enum PlayerInboxVoidMode {
  // 原语义(IB-5):未投递 → VOIDED;已投递 → 只挂 VOID 指令,由消费方裁决。
  PLAYER_INBOX_VOID_MODE_NORMAL = 0;
  // 强制终结一条「已投递、仍 PENDING」的行,只用于解开 scene 回放核对判 MISMATCH 之后的永久停用
  // (已投递的行只能挂指令,而 scene 先做回放核对、后看指令,挂了也照样每次登录都停用)。
  // 服务端先经 data_service.GetPlayerInboxLedger 读该玩家**已落盘**的账本,证明:该域 decided_through ≥ seq,
  // 且最近结局环里同 seq 那一条记的是**另一个** request_id —— 消费方在这个 seq 上裁决的是别的条目,
  // 本行在这一消费方谱系上从未执行,以后投递到也只会判 MISMATCH。证明成立才在流行锁下复读、仍 PENDING
  // 才改 VOIDED(finalized_by=ADMIN),同事务写审计(action=FORCE_VOID)。
  // 证明不成立或账本缺失 → kPlayerInboxItemStateConflict,force_verdict 给出原因,行不变;
  // 读账本失败 → kPlayerInboxStoreUnavailable(可重试)。环里同 seq 同 request_id(回放)、
  // 水位已过而环里没有该 seq(UNKNOWN 一类)都可能已执行,一律拒绝(IB-4 / IB-9)。
  PLAYER_INBOX_VOID_MODE_FORCE_MISMATCH = 1;
}

// 强制模式的账本证明结论。普通模式恒为 UNSPECIFIED。
enum PlayerInboxForceVoidVerdict {
  PLAYER_INBOX_FORCE_VOID_UNSPECIFIED = 0;        // 普通模式,或条目不存在 / 已是终态(看 error_message)
  PLAYER_INBOX_FORCE_VOID_PROVEN = 1;             // 证明成立,已终结为 VOIDED
  PLAYER_INBOX_FORCE_VOID_NOT_DELIVERED = 2;      // 从未投递:改用普通模式直接作废
  PLAYER_INBOX_FORCE_VOID_LEDGER_ABSENT = 3;      // 读不到已落盘存档:无从证明
  PLAYER_INBOX_FORCE_VOID_NOT_DECIDED = 4;        // 账本水位没到这个 seq:消费方还没裁决它,停用原因不是 MISMATCH
  PLAYER_INBOX_FORCE_VOID_SEQ_NOT_IN_RING = 5;    // 水位已过但环里没有这个 seq(UNKNOWN 一类):原结局已挤出环,可能已执行
  PLAYER_INBOX_FORCE_VOID_REQUEST_IN_LEDGER = 6;  // 环里出现过本行的 request_id(同 seq = 回放或类型不符,或别的 seq):可能已执行
  // 账本结构不合法,整份检查、与 scene 判账本损坏同口径(任一域:domain 为 0 或重复 / 环超过 32 条 /
  // 环非严格升序 / seq 为 0 / 越过水位 / 结局不可记;另加 request_id 为 0)。这种账本 scene 侧整份停用,不会走到 MISMATCH。
  PLAYER_INBOX_FORCE_VOID_LEDGER_INVALID = 7;
}

message VoidPlayerInboxItemRequest {
  uint64 player_id = 1;
  PlayerInboxDomain domain = 2;
  uint64 seq = 3;
  PlayerInboxVoidReason reason = 4;     // 必须非 UNSPECIFIED;强制模式写进行的 void_reason
  string operator = 5;                  // 必填,≤ 64B
  string note = 6;                      // ≤ 256B;强制模式必填(进审计 reason,写工单号与依据)
  PlayerInboxVoidMode mode = 7;         // 缺省 NORMAL = 原语义
}

// 兼容提示:不认识 mode 的旧版服务端会按普通模式处理(已投递只挂指令,回 void_requested=true)。
// 调用方判定强制终结成功,一律以 force_verdict == PROVEN 且 state == VOIDED 为准。
message VoidPlayerInboxItemResponse {
  TipInfoMessage error_message = 1;     // 条目不存在 → kPlayerInboxItemNotFound;已是终态 / 强制证明不成立 → kPlayerInboxItemStateConflict
  PlayerInboxItemState state = 2;       // 处理后的状态:未投递 → VOIDED;已投递 → 仍为 PENDING;强制终结 → VOIDED
  bool void_requested = 3;              // true = 已投递,只挂了 VOID 指令,等消费方裁决(强制模式恒为 false)
  PlayerInboxForceVoidVerdict force_verdict = 4;  // 只在强制模式、行仍 PENDING 时填写
}

// ── ReconcilePlayer(第 4 批)────────────────────────────────────────────

enum PlayerInboxReconcileDiffKind {
  PLAYER_INBOX_RECONCILE_DIFF_UNSPECIFIED = 0;
  // 收件箱已由消费方终结,已落盘账本里却没有它的结局:可能回档或 Redis 丢数据。三种形态都报这一个值
  // (服务端日志的 gap= 区分):账本水位没到这个 seq;水位已过、seq 落在最近结局环该覆盖的范围内
  // (环不满 32 条,或 seq 不早于环头)却查无此 seq —— 丢掉的结局被之后的条目掩盖;环里同 seq 记的是
  // 另一条(request_id / msg_type 不同)或另一个结局。SETTLED_UNKNOWN 只比水位;管理员终结的行不比对。
  PLAYER_INBOX_RECONCILE_FINAL_NOT_IN_LEDGER = 1;
  PLAYER_INBOX_RECONCILE_PENDING_BUT_DECIDED = 2;    // 收件箱仍 PENDING,账本已处理过:确认丢了且玩家一直离线
}

message ReconcilePlayerInboxRequest {
  uint64 player_id = 1;
  PlayerInboxDomain domain = 2;         // UNSPECIFIED = 该玩家的全部域
}

message PlayerInboxReconcileDiff {
  PlayerInboxDomain domain = 1;
  uint64 seq = 2;
  PlayerInboxReconcileDiffKind kind = 3;
  PlayerInboxItemState state = 4;       // 收件箱侧的行状态
  uint64 request_id = 5;
}

message PlayerInboxReconcileCursor {
  PlayerInboxDomain domain = 1;
  uint64 ledger_decided_through = 2;    // 已落盘账本的水位;账本里没有该域时为 0
  uint64 inbox_next_seq = 3;
}

message ReconcilePlayerInboxResponse {
  TipInfoMessage error_message = 1;
  bool ledger_found = 2;                // false = 读不到已落盘存档,结论为 unknown,不比对
  repeated PlayerInboxReconcileCursor cursors = 3;
  repeated PlayerInboxReconcileDiff diffs = 4;
}

// ── GetItemGainBlocks ────────────────────────────────────────────────────
//
// 回答「这名玩家今后哪些物品拿不到」里单人封禁的那一部分(设计 §2.2)。两份来源,不是同一时刻的快照:
//   - blocked_item_config_ids:玩家**已落盘**存档里的本人封禁表,经 data_service.GetPlayerItemGainBlock 读,
//     和 scene 下一次加载这名玩家时拿到的是同一份;
//   - pending:收件箱 SCENE_GM_SANCTION 域里仍 PENDING 的物品封禁 / 解封单,scene 会按 seq 升序执行。
//     已投递(delivery_count > 0)的单可能已在 scene 内存里执行、正等落盘之后确认,这时它的效果也可能已经出现在
//     blocked_item_config_ids 里;封禁与解封天然幂等,两边同时出现不矛盾。
// 刚下的封禁单在玩家上线并出战斗之前只出现在 pending 里:只看封禁表会误以为「没封上」。
// 不含全服封禁:那是 scene 节点上的线程级集合(GainBlockService 的全服集合),不在玩家存档里。

message GetPlayerItemGainBlocksRequest {
  uint64 player_id = 1;
}

// 一条还没生效的物品封禁 / 解封单(收件箱条目的运维视图,载荷已解开)。
message PlayerItemGainSanctionPending {
  uint64 seq = 1;
  PlayerInboxMessageType msg_type = 2;  // PLAYER_INBOX_MSG_GM_BLOCK_ITEM_GAIN 或 PLAYER_INBOX_MSG_GM_UNBLOCK_ITEM_GAIN
  // 从载荷解出的物品配置号。0 = 载荷解不开(入箱时校验过,只可能是数据损坏):scene 会判 REJECTED,这条不会生效。
  uint32 item_config_id = 3;
  uint64 request_id = 4;
  PlayerInboxDirective directive = 5;   // VOID = 已挂作废指令,等消费方裁决
  uint32 delivery_count = 6;            // 0 = 还没投递过(玩家不在线,或在战斗中)
  uint64 created_ms = 7;
  string operator_name = 8;
  string note = 9;                      // 处置理由(GmSanctionPlayer 的 reason)
}

message GetPlayerItemGainBlocksResponse {
  TipInfoMessage error_message = 1;     // 读存档或收件箱库失败 → kPlayerInboxStoreUnavailable(可重试)
  uint64 player_id = 2;
  // false = 读不到已落盘存档(从未建角,或角色还没建完):这时 blocked_item_config_ids 为空不代表「没封」。
  bool found = 3;
  // 已落盘的本人封禁表,按存档原样返回(写入侧保持升序、无重复)。
  repeated uint32 blocked_item_config_ids = 4;
  // 按 seq 升序。found=false 时照样列出。
  repeated PlayerItemGainSanctionPending pending = 5;
}
