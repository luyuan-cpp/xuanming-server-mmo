syntax = "proto3";
package player_inbox;

option go_package = "db/proto/player_inbox";
option cc_generic_services = false;

import "google/protobuf/descriptor.proto";
import "proto/common/base/tip.proto";
import "proto/common/base/role_admission.proto";
import "proto/common/base/service_call_auth.proto";

// 玩家持久收件箱:scene 侧消费协议与类型注册表(docs/design/player-inbox-service.md §3.2、§5.1)。
//
// 节点类型:本文件**刻意没有** `option (OptionFileDefaultNode)`:proto/db/proto_option.proto 的 NodeType
// 枚举里没有收件箱,写了就编不过(照 proto/friend/friend.proto、proto/guild/guild_internal.proto)。
// protogen 按服务名 PlayerInbox 直接解析到 PlayerInboxNodeService(proto/common/base/node.proto = 30)。
//
// 内部服务:刻意不标 OptionIsClientProtocolService,不进客户端 gen_proto.ps1 清单(照 proto/trade/trade_admin.proto)。
// 所有响应只用 TipInfoMessage error_message,不带 uint32 error_code(设计 §1.4);tip 段 player_inbox_error = 29000。
// 字段号上线后不复用,删字段写 reserved(AGENTS §4)。

// ── 类型注册表(唯一事实源,设计 §3.2)────────────────────────────────────
// 规格写在枚举值选项上,Go 启动时用 protoreflect 读成注册表并自检、C++ 用描述符读域规格。
// 只放 v1 用得到的字段;消费方种类、回档策略、过期许可、生产方白名单出现第二种取值时再追加。
// 入箱开关不在这里:只由服务配置 PlayerInbox.EnqueueTypes 白名单决定(设计 §3.3)。

// 消息分级。v1 只登记持久类;合并类 / 瞬时类触发时再追加(设计 §3.1)。
enum PlayerInboxClass {
  PLAYER_INBOX_CLASS_UNSPECIFIED = 0;
  PLAYER_INBOX_CLASS_DURABLE = 1;     // 有明确结局之前一直保留
}

// 生产方种类,与 request_id 组成幂等键 (producer_kind, request_id)(IB-2)。
enum PlayerInboxProducerKind {
  PLAYER_INBOX_PRODUCER_UNSPECIFIED = 0;
  PLAYER_INBOX_PRODUCER_GM = 1;       // PlayerInboxAdmin.GmSanctionPlayer
  PLAYER_INBOX_PRODUCER_MATCH = 2;    // Match SQL 永久终局来源，独立内部签名
}

// 域规格:挂在 PlayerInboxDomain 的枚举值上。
message PlayerInboxDomainSpec {
  uint32 max_pending = 1;             // 每 (玩家, 域) 未终结条目上限,挂作废指令的也计入(设计 §3.4)
  bool requires_out_of_battle = 2;    // true = 消费方在 InBattleComp 期间延后执行(设计 §7.5)
}

// 类型规格:挂在 PlayerInboxMessageType 的枚举值上。
message PlayerInboxTypeSpec {
  PlayerInboxDomain domain = 1;       // 所属域,必须非 UNSPECIFIED
  PlayerInboxClass klass = 2;         // v1 只允许 DURABLE
  string payload_message = 3;         // 载荷消息全名,如 "player_inbox.GmCurrencyGainPayload";启动时必须能解析
  uint32 max_payload_bytes = 4;       // 序列化后载荷上限;硬上限 16KiB(设计 §3.4)
}

// 扩展号 420001 / 420002:全仓 EnumValueOptions 扩展此前只有 proto/etcd/version.proto 的 50003。
extend google.protobuf.EnumValueOptions {
  PlayerInboxDomainSpec OptionPlayerInboxDomain = 420001;
  PlayerInboxTypeSpec OptionPlayerInboxType = 420002;
}

// 目标域 = 消费方。每个 (player, domain) 是一条有序邮箱,同一时刻只有 owner scene 一个消费者。
enum PlayerInboxDomain {
  PLAYER_INBOX_DOMAIN_UNSPECIFIED = 0;
  // GM 处置:由玩家当前 owner scene 在接管完成后严格按 seq 执行(封锁与解封的先后不能颠倒,设计 §2.2)。
  PLAYER_INBOX_DOMAIN_SCENE_GM_SANCTION = 1 [(OptionPlayerInboxDomain) = {
    max_pending: 64
    requires_out_of_battle: true
  }];
  PLAYER_INBOX_DOMAIN_SCENE_BATTLE_SETTLEMENT = 2 [(OptionPlayerInboxDomain) = {
    max_pending: 1
    requires_out_of_battle: false
  }];
}

// 消息类型。新增类型 = 追加枚举值并写全规格;号上线后不复用。
enum PlayerInboxMessageType {
  PLAYER_INBOX_MSG_UNSPECIFIED = 0;
  // 封锁某货币的获取 → CurrencySystem::BlockCurrency(天然幂等)。
  PLAYER_INBOX_MSG_GM_BLOCK_CURRENCY_GAIN = 1 [(OptionPlayerInboxType) = {
    domain: PLAYER_INBOX_DOMAIN_SCENE_GM_SANCTION
    klass: PLAYER_INBOX_CLASS_DURABLE
    payload_message: "player_inbox.GmCurrencyGainPayload"
    max_payload_bytes: 64
  }];
  // 解除封锁 → CurrencySystem::UnblockCurrency(天然幂等)。
  PLAYER_INBOX_MSG_GM_UNBLOCK_CURRENCY_GAIN = 2 [(OptionPlayerInboxType) = {
    domain: PLAYER_INBOX_DOMAIN_SCENE_GM_SANCTION
    klass: PLAYER_INBOX_CLASS_DURABLE
    payload_message: "player_inbox.GmCurrencyGainPayload"
    max_payload_bytes: 64
  }];
  // 挂补缴欠款 → CurrencySystem::AttachDebt。**不幂等**,只靠消费端账本去重(设计 §2.2、§4.4)。
  PLAYER_INBOX_MSG_GM_ATTACH_CURRENCY_DEBT = 3 [(OptionPlayerInboxType) = {
    domain: PLAYER_INBOX_DOMAIN_SCENE_GM_SANCTION
    klass: PLAYER_INBOX_CLASS_DURABLE
    payload_message: "player_inbox.GmCurrencyDebtPayload"
    max_payload_bytes: 1024
  }];
  PLAYER_INBOX_MSG_BATTLE_SETTLEMENT = 4 [(OptionPlayerInboxType) = {
    domain: PLAYER_INBOX_DOMAIN_SCENE_BATTLE_SETTLEMENT
    klass: PLAYER_INBOX_CLASS_DURABLE
    payload_message: "BattleSettlementData"
    max_payload_bytes: 16384
  }];
}

// ── 条目状态与结局(设计 §4.3)──────────────────────────────────────────

enum PlayerInboxItemState {
  PLAYER_INBOX_ITEM_UNSPECIFIED = 0;
  PLAYER_INBOX_ITEM_PENDING = 1;          // 唯一的非终态
  PLAYER_INBOX_ITEM_APPLIED = 2;
  PLAYER_INBOX_ITEM_REJECTED = 3;
  PLAYER_INBOX_ITEM_VOIDED = 4;
  PLAYER_INBOX_ITEM_SETTLED_UNKNOWN = 5;  // 消费方水位已过但原结局已不在环里;同时告警
}

// 服务端挂在已投递条目上的指令。服务端不单方面终结已投递的条目,只挂指令由消费方裁决(IB-5)。
enum PlayerInboxDirective {
  PLAYER_INBOX_DIRECTIVE_NONE = 0;
  PLAYER_INBOX_DIRECTIVE_VOID = 1;
}

enum PlayerInboxVoidReason {
  PLAYER_INBOX_VOID_UNSPECIFIED = 0;
  PLAYER_INBOX_VOID_CANCELLED = 1;        // 运维取消
  PLAYER_INBOX_VOID_QUARANTINED = 2;      // 运维隔离疑似毒消息(D11:v1 不做自动隔离)
}

enum PlayerInboxFinalizer {
  PLAYER_INBOX_FINALIZER_UNSPECIFIED = 0;
  PLAYER_INBOX_FINALIZER_CONSUMER = 1;
  PLAYER_INBOX_FINALIZER_ADMIN = 2;       // 只用于从未投递过的条目被作废
}

// 消费方报告的结局。
enum PlayerInboxOutcome {
  PLAYER_INBOX_OUTCOME_UNSPECIFIED = 0;
  PLAYER_INBOX_OUTCOME_APPLIED = 1;
  PLAYER_INBOX_OUTCOME_REJECTED = 2;      // reason = 消费方给的 tip id
  PLAYER_INBOX_OUTCOME_SKIPPED = 3;       // 只对挂了 VOID 指令的条目合法;reason = PlayerInboxVoidReason
  PLAYER_INBOX_OUTCOME_UNKNOWN = 4;       // 账本水位已过这一条、但原结局已被挤出最近结局环(设计 §7.6、§7.7)
}

// owner_epoch 围栏判定(设计 §7.8)。
enum PlayerInboxFenceVerdict {
  PLAYER_INBOX_FENCE_UNSPECIFIED = 0;
  PLAYER_INBOX_FENCE_NO_STREAM = 1;       // 流行不存在,绝大多数玩家走这里
  PLAYER_INBOX_FENCE_FIRST = 2;           // fence == 0 且 req ≤ R:fence = req
  PLAYER_INBOX_FENCE_MATCH = 3;           // req == fence
  PLAYER_INBOX_FENCE_ADVANCE = 4;         // fence < req ≤ R:fence = req
  PLAYER_INBOX_FENCE_STALE = 5;           // req < fence:拒绝,不投递、不终结
  PLAYER_INBOX_FENCE_EPOCH_REQUIRED = 6;  // req == 0:拒绝(fail-closed)
  PLAYER_INBOX_FENCE_EPOCH_AHEAD = 7;     // req > fence 且 req > R:拒绝并告警(IB-8)
}

// Ack 的逐条结果(设计 §7.8 Ack 表)。
enum PlayerInboxAckResult {
  PLAYER_INBOX_ACK_UNSPECIFIED = 0;
  PLAYER_INBOX_ACK_FINALIZED = 1;
  PLAYER_INBOX_ACK_ALREADY_SAME = 2;
  PLAYER_INBOX_ACK_CONFLICT = 3;          // 终态与报告不一致,永不翻转(IB-4)
  PLAYER_INBOX_ACK_UNKNOWN_SEQ = 4;
  PLAYER_INBOX_ACK_NOT_DELIVERED = 5;
  PLAYER_INBOX_ACK_SKIP_NOT_REQUESTED = 6;
  PLAYER_INBOX_ACK_MISMATCH = 7;          // request_id 与报告不一致(IB-9)
}

// ── 载荷(按类型规格的 payload_message 解码)─────────────────────────────

// GM_BLOCK_CURRENCY_GAIN / GM_UNBLOCK_CURRENCY_GAIN。
message GmCurrencyGainPayload {
  uint32 currency_type = 1;           // CurrencyType 枚举值
}

// GM_ATTACH_CURRENCY_DEBT。入箱时先用服务端认定的 operator 覆盖 gm_operator,再对最终载荷做大小与解码校验(设计 §3.4)。
message GmCurrencyDebtPayload {
  uint32 currency_type = 1;           // CurrencyType 枚举值
  uint64 owe_amount = 2;              // 货币用 uint64(AGENTS §4);入箱校验 ∈ (0, INT64_MAX](AttachDebt 参数是 int64_t)
  string reason = 3;                  // ≤ 256B,UTF-8;随 CurrencyDebtEntry 永久进玩家存档
  string gm_operator = 4;             // 服务端用请求的 operator 覆盖,≤ 64B
  uint64 expires_at = 5;              // Unix 秒(UTC),与 CurrencyDebtEntry.expires_at 同单位;0 = 永不过期
}

// Scene 分方法签名后拉取/确认；Match 用独立签名专门入箱/查询永久结算原收据。

service PlayerInbox {
  // 按 seq 升序拉 PENDING 条目,同时推进 owner_epoch 围栏。无流时只是一次不加锁的主键点读。
  rpc FetchItems(FetchPlayerInboxRequest) returns (FetchPlayerInboxResponse) {}
  // 报告**已落盘**的结局(设计 §7.7)。不受 consumer_enabled 等前置闸限制。
  rpc AckItems(AckPlayerInboxRequest) returns (AckPlayerInboxResponse) {}
  rpc EnqueueBattleSettlement(BattleSettlementInboxRequest) returns (BattleSettlementInboxResponse);
  rpc LookupBattleSettlement(BattleSettlementInboxRequest) returns (BattleSettlementInboxResponse);
}

// 固定原归属与签发时间；重投只能重签 auth，不得刷新正文或借当前目录补权。
message BattleSettlementInboxRequest {
  uint64 player_id = 1;
  uint64 battle_id = 2;
  string expected_owner_account = 3;
  uint64 expected_owner_revision = 4;
  uint64 issued_at_ms = 5;
  bytes settlement_payload = 6;
  common.base.ServiceCallAuth auth = 7;
}
message BattleSettlementInboxResponse {
  TipInfoMessage error_message = 1;
  uint64 player_id = 2;
  uint64 battle_id = 3;
  uint64 seq = 4;
  PlayerInboxItemState state = 5;
  bytes content_sha256 = 6;
  string request_digest = 7;
  common.base.ServiceCallAuth auth = 8;
}

message FetchPlayerInboxRequest {
  uint64 player_id = 1;
  PlayerInboxDomain domain = 2;
  uint64 owner_epoch = 3;               // 必须非 0(EPOCH_REQUIRED)
  uint64 correlation_id = 4;            // 本节点单调递增,回包原样回显
  uint32 max_items = 5;                 // 0 → 16,上限 16
  uint64 consumer_decided_through = 6;  // 账本水位;用于 CursorAhead 检测(设计 §7.8)
  uint32 scene_node_id = 7;             // 只用于日志
  common.base.RoleAdmissionIdentity admission = 8; // SQL已登记的原入场世代，必须与玩家/E完全一致
  common.base.ServiceCallAuth auth = 9; // scene内部签名，绑定整份请求
}

message PlayerInboxItem {
  uint64 seq = 1;
  PlayerInboxMessageType msg_type = 2;
  bytes payload = 3;                    // directive != NONE 时为空:作废路径不解码载荷
  PlayerInboxDirective directive = 4;
  PlayerInboxVoidReason void_reason = 5;
  uint64 request_id = 6;                // 回放前核对(IB-9)
  uint32 delivery_count = 7;            // 含本次
  uint64 created_ms = 8;
}

message FetchPlayerInboxResponse {
  TipInfoMessage error_message = 1;     // 只用 tip(设计 §1.4)
  uint64 player_id = 2;                 // 原样回显,回包关联用(设计 §7.11)
  PlayerInboxDomain domain = 3;         // 原样回显
  uint64 correlation_id = 4;            // 原样回显
  PlayerInboxFenceVerdict fence = 5;
  repeated PlayerInboxItem items = 6;   // 按 seq 升序,只含 PENDING
  bool has_more = 7;
}

message PlayerInboxDecisionReport {
  uint64 seq = 1;
  PlayerInboxOutcome outcome = 2;
  uint32 reason = 3;                    // REJECTED:tip id;SKIPPED:PlayerInboxVoidReason;其余为 0
  uint64 request_id = 4;                // 服务端核对(IB-9)
}

message AckPlayerInboxRequest {
  uint64 player_id = 1;
  PlayerInboxDomain domain = 2;
  uint64 owner_epoch = 3;
  uint64 correlation_id = 4;
  repeated PlayerInboxDecisionReport decisions = 5;  // ≤ 32 条,按 seq 升序
  // 只用于日志(同 FetchPlayerInboxRequest.scene_node_id):服务端把它与 gRPC 对端地址一起打进围栏 / Ack 异常的
  // ERROR 日志,值班按它定位发送方(评审 L10)。不参与任何判定;0 = 旧版 scene 没填。
  uint32 scene_node_id = 6;
  common.base.RoleAdmissionIdentity admission = 7;
  common.base.ServiceCallAuth auth = 8;
}

message PlayerInboxAckItem {
  uint64 seq = 1;
  PlayerInboxAckResult result = 2;
  PlayerInboxItemState state = 3;       // 处理后的行状态;UNKNOWN_SEQ 时为 UNSPECIFIED
}

message AckPlayerInboxResponse {
  TipInfoMessage error_message = 1;
  uint64 player_id = 2;                 // 原样回显
  PlayerInboxDomain domain = 3;         // 原样回显
  uint64 correlation_id = 4;            // 原样回显
  PlayerInboxFenceVerdict fence = 5;
  repeated PlayerInboxAckItem results = 6;  // 围栏放行时与请求的 decisions 按序一一对应;围栏拒绝时为空
}
