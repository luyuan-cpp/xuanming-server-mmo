syntax = "proto3";
package match;
option go_package = "db/proto/match";
import "proto/db/proto_option.proto";
import "proto/match/match_network.proto";
import "proto/match/match_internal.proto";

message MatchNetworkProfile {
  string plan_id = 1;
  string session_binding = 2;
  repeated NetworkProbeReceipt receipts = 3;
  string owner_account = 4; // 服务端捕获的原会话账号；不得由当前目录反查补权。
  uint64 owner_revision = 5;
}

// 全局观战占用与匹配票在同P事务内互斥；时间到期不意味着远端已取消。
message MatchSpectatorRecord {
  option (OptionTableName) = "match_spectator";
  option (OptionPrimaryKey) = "player_id";
  option (OptionIndex) = "updated_ms,player_id;state,player_id";
  uint64 player_id = 1;
  string operation_id = 2;
  uint64 battle_id = 3;
  string target_endpoint = 4;
  string target_instance_id = 5;
  uint32 state = 6; // 1待Add、2已准入、3待Cancel、4结果未知、5已证实关闭。
  bytes request_payload = 7; // 原WatchBattleRequest，随机选场结果不能重选。
  string owner_account = 8;
  uint64 owner_revision = 9;
  bytes add_request = 10; // 原AddObserverRequest，截止/路由/op不可重写。
  uint64 updated_ms = 11;
  uint64 request_high = 12;
  uint64 request_low = 13;
}
message MatchSpectatorIntentRecord {
  option (OptionTableName) = "match_spectator_intent";
  option (OptionPrimaryKey) = "player_id,request_high,request_low";
  uint64 player_id = 1;
  uint64 request_high = 2;
  uint64 request_low = 3;
  bytes original = 4; // 永久原MatchSpectatorRecord，终态更新同当前占用事务提交。
  bytes request_payload = 5; // 选场前即持久原请求，旧handler不能成为新意图。
  string owner_account = 6;
  uint64 owner_revision = 7;
  uint32 state = 8; // 1尚未发出Add、2已绑定current原件、5已关闭；未知一律拒绝。
  uint32 close_tip = 9; // 关闭原因(客户端tip)，先写为准，同request_id重放回同一结论；0=未记录原因，state1必须为0。
}
message MatchSpectatorHeadRecord {
  option (OptionTableName) = "match_spectator_head";
  option (OptionPrimaryKey) = "player_id";
  uint64 player_id = 1;
  string operation_id = 2; // 最新已接纳请求UUID；切换head也必须先持P。
}

// 仅服务端存储契约；全部副本必须连接同一 TiDB 事务域。
message MatchNetworkProfileRecord {
  option (OptionTableName) = "match_network_profile";
  option (OptionPrimaryKey) = "player_id";
  uint64 player_id = 1;
  bytes payload = 2;
  uint64 expires_ms = 3;
}

message MatchAuthorityTicketRecord {
  option (OptionTableName) = "match_authority_ticket";
  option (OptionPrimaryKey) = "player_id";
  option (OptionIndex) = "state,mode,config_id,team_size,enqueued_ms;formation_id;state,enqueued_ms,player_id;state,mode,team_id,enqueued_ms,player_id";
  uint64 player_id = 1;
  string ticket = 2;
  string request_id = 3;
  uint32 mode = 4;
  uint32 config_id = 5;
  uint32 team_size = 6;
  uint32 state = 7; // 1排队、2成局、3已建房、4终态；禁止 TTL 自动释放成局成员。
  uint64 enqueued_ms = 8;
  uint64 not_before_ms = 9;
  uint32 zone_id = 10;
  int64 rating_centi = 11;
  uint64 formation_id = 12;
  uint64 team_id = 13;
  bytes network_profile = 14;
  uint64 expires_ms = 15;
  uint32 selected_region = 16;
  uint32 preferred_region = 17; // 签名测量最低RTT机房；同RTT按机房编号，不随节点暂时下线改本区。
  string owner_account = 18;
  uint64 owner_revision = 19;
}

// 仅作可重建候选索引，票与完整签名profile仍是提交点真相。
// 同原票锁更新/清理；查询必须JOIN当前ticket代次，最终Claim复核原profile和原角色身份。
message MatchTicketRegionRecord {
  option (OptionTableName) = "match_ticket_region";
  option (OptionPrimaryKey) = "player_id,physical_region";
  option (OptionIndex) = "physical_region,mode,config_id,team_size,preferred_region,enqueued_ms,player_id;physical_region,mode,config_id,team_size,enqueued_ms,player_id;expires_ms,player_id,physical_region;physical_region,mode,config_id,team_size,home_zone,preferred_region,enqueued_ms,player_id;physical_region,mode,config_id,team_size,home_zone,enqueued_ms,player_id";
  option (OptionTiDBNonclusteredPK) = true;
  option (OptionTiDBShardRowIDBits) = 4;
  option (OptionTiDBPreSplitRegions) = 4;
  uint64 player_id = 1;
  uint32 physical_region = 2;
  string ticket = 3;
  uint32 mode = 4;
  uint32 config_id = 5;
  uint32 team_size = 6;
  uint32 preferred_region = 7;
  uint64 enqueued_ms = 8;
  int64 rating_centi = 9;
  uint32 rtt_ms = 10;
  uint64 expires_ms = 11;
  uint32 home_zone = 12; // 来自原票的SQL home；整队禁止跨home时在LIMIT前过滤。
}

// 不能随当前票据覆盖或过期：否则旧 Join 在新一轮结束后重放会复活。
message MatchJoinIntentRecord {
  option (OptionTableName) = "match_join_intent";
  option (OptionPrimaryKey) = "player_id,request_high,request_low";
  option (OptionIndex) = "state,player_id,request_high,request_low";
  uint64 player_id = 1;
  string request_id = 2;
  bytes ticket_record = 3; // 首次已接纳的 MatchAuthorityTicketRecord；先撤销的未知请求为空。
  bool cancelled = 4;
  uint64 request_high = 5; // UUID 的前64位原值；整数复合主键符合 D-14，不截断哈希。
  uint64 request_low = 6;
  string owner_account = 7;
  uint64 owner_revision = 8;
  bytes spectator_exit = 9; // 首次Join在同P内捕获的原观战；空表示当时没有观战。
  bool exit_prepared = 10; // 原件已固定；禁止重放现场捕获当前观战。
  bytes request_payload = 11; // 原JoinQueueRequest规范字节，重试不可改探测/参数。
  uint32 state = 12; // 1等待原观战退出、2已提交原票、3已取消；仅1进入恢复游标。
}

// 整队/活动/挑战接受与全组占用、成局行在同一 SQL 事务提交。
message MatchDirectIntentRecord {
  option (OptionTableName) = "match_direct_intent";
  option (OptionPrimaryKey) = "kind,owner_id,request_high,request_low";
  option (OptionIndex) = "exit_prepared,cancelled,battle_id,kind,owner_id,request_high,request_low";
  uint32 kind = 1; // 1整队、2活动、3挑战。
  uint64 owner_id = 2; // 整队的发起玩家、活动的帮会、挑战的应战玩家。
  uint64 request_high = 3;
  uint64 request_low = 4;
  bytes payload = 5; // 无随机节点/票号的规范业务载荷，重试逐字节核对。
  uint64 battle_id = 6;
  bool cancelled = 7; // 仅活动kind=2：与成局共用原意图主键锁的持久不再开战墓碑。
  string owner_account = 8; // kind1/3的原客户端actor；kind2由Guild永久launch原件授权。
  uint64 owner_revision = 9;
  repeated MatchSpectatorRecord spectator_exits = 10;
  bool exit_prepared = 11;
  bytes start_original = 12; // MatchDirectStartOriginal；待提交时不能用当前资料替换。
}
message MatchDirectStartOriginal {
  MatchFormationRecord formation = 1;
  repeated MatchAuthorityTicketRecord tickets = 2;
}

// 邀请正文是SQL原件，Redis仅推送/缓存；新邀请在全员P锁下捕获对端，重放不换主。
message MatchChallengeInvitationRecord {
  option (OptionTableName) = "match_challenge_invitation";
  option (OptionPrimaryKey) = "challenge_id";
  option (OptionIndex) = "target_player_id,state,expires_ms,challenge_id;challenger_player_id,state,expires_ms,challenge_id";
  option (OptionTiDBNonclusteredPK) = true;
  option (OptionTiDBShardRowIDBits) = 4;
  option (OptionTiDBPreSplitRegions) = 4;
  uint64 challenge_id = 1;
  uint64 challenger_player_id = 2;
  uint64 target_player_id = 3;
  uint32 config_id = 4;
  string challenger_account = 5;
  uint64 challenger_revision = 6;
  string target_account = 7;
  uint64 target_revision = 8;
  uint64 created_ms = 9;
  uint64 expires_ms = 10;
  uint32 state = 11; // 1待应答、2已成局、3已拒绝、4已接受待退出、5已安全关闭；原件不删除。
  uint64 battle_id = 12;
}

// 同事务域全部副本使用相同撮合策略；新进程不能覆盖已准入策略。
message MatchGlobalPolicyRecord {
  option (OptionTableName) = "match_global_policy";
  option (OptionPrimaryKey) = "policy_id";
  uint32 policy_id = 1;
  bytes contract_digest = 2;
}

message MatchFormationMember {
  uint64 player_id = 1;
  string ticket = 2;
}
message MatchFormationRecord {
  option (OptionTableName) = "match_formation";
  option (OptionPrimaryKey) = "battle_id";
  option (OptionIndex) = "state,retry_at_ms";
  uint64 battle_id = 1;
  string operation_id = 2;
  uint32 state = 3; // 1待备战、2已持久化创建请求、3结果未知、4成功、5已安全中止。
  uint32 physical_region = 4;
  uint32 target_node_id = 5;
  string target_instance_id = 6;
  string target_endpoint = 7;
  uint32 mode = 8;
  uint32 config_id = 9;
  repeated MatchFormationMember members = 10;
  bytes create_request = 11;
  uint64 created_ms = 12;
  uint64 deadline_ms = 13;
  uint64 retry_at_ms = 14;
  bytes activity_context = 15; // 备战前崩溃恢复也保留活动归属，内容为BattleActivityContext。
  bool requeue_on_failure = 16; // 排队失败保持原票号与最早等待；整队/点名不能拆散回队。
  repeated MatchPreparedEndpoint prepared = 17; // 备战时真实端点；恢复取消不能重新猜玩家当前所在场景。
  uint32 outcome_protocol_version = 18;
  uint32 preflight_supported_version = 19;
  string preflight_instance_id = 20; // 发任何Create之前与完整version1正文同事务保存。
  uint32 adopted_outcome_protocol_version = 21; // 独立保存真实Create/PRESENT回执，不能由能力推算。
  bool adopted_outcome_observed = 22; // 未回包与原身份明确回显0不同；首个实际回执永久不变。
}
message MatchPreparedEndpoint {
  uint64 player_id = 1;
  string endpoint = 2;
}

message MatchRatingRecord {
  option (OptionTableName) = "match_rating";
  option (OptionPrimaryKey) = "player_id";
  uint64 player_id = 1;
  int64 rating_centi = 2;
  uint64 games = 3;
  uint64 updated_ms = 4;
}
message MatchRatingAppliedRecord {
  option (OptionTableName) = "match_rating_applied";
  option (OptionPrimaryKey) = "battle_id";
  uint64 battle_id = 1;
  bytes payload_digest = 2;
  uint64 applied_ms = 3;
}
// 停写标记与最终游标和每次评分事务争同一行锁；不依赖墙钟猜最后一批。
message MatchRankSourceRecord {
  option (OptionTableName) = "match_rank_source";
  option (OptionPrimaryKey) = "source_epoch";
  uint64 source_epoch = 1;
  uint64 produced_cursor = 2;
  uint64 committed_cursor = 3;
  uint64 board_id = 4;
  bool stopped = 5;
}
message MatchRankOutboxRecord {
  option (OptionTableName) = "match_rank_outbox";
  option (OptionPrimaryKey) = "source_epoch,source_cursor";
  uint64 source_epoch = 1;
  uint64 source_cursor = 2;
  uint64 request_id = 3;
  bytes entries = 4; // 确定性序列化 SubmitRankScoresRequest（未签名）；重投只重签 auth。
}

enum MatchBattleCompletionSourceKind {
  MATCH_BATTLE_COMPLETION_SOURCE_UNSPECIFIED = 0;
  MATCH_BATTLE_COMPLETION_SOURCE_KAFKA = 1;
  MATCH_BATTLE_COMPLETION_SOURCE_BATTLE_RPC = 2;
}

// 唯一终局与原结果outbox；RPC来源不伪造Kafka位点。
message MatchBattleCompletionRecord {
  option (OptionTableName) = "match_battle_completion";
  option (OptionPrimaryKey) = "battle_id";
  option (OptionIndex) = "decision,result_published,next_retry_ms,battle_id";
  uint64 battle_id = 1;
  bytes raw_payload = 2;
  bytes payload_digest = 3;
  uint32 format_version = 4;
  uint64 archived_ms = 5;
  string source_topic = 6;
  int32 source_partition = 7;
  int64 source_offset = 8;
  BattleOutcomeDecision decision = 9;
  MatchBattleCompletionSourceKind source_kind = 10;
  string placement_operation_id = 11;
  string target_instance_id = 12;
  uint32 outcome_protocol_version = 13;
  bool result_published = 14;
  uint64 next_retry_ms = 15;
}

// 与整局原件同一事务登记；稳定身份为battle_id+player_id，保留到显式迁移/恢复流程接管。
message MatchBattleSettlementSourceRecord {
  option (OptionTableName) = "match_battle_settlement_source";
  option (OptionPrimaryKey) = "battle_id,player_id";
  option (OptionIndex) = "dispatch_state,next_retry_ms,battle_id,player_id";
  uint64 battle_id = 1;
  uint64 player_id = 2;
  bytes settlement_proto = 3;
  bytes payload_digest = 4;
  uint64 archived_ms = 5;
  string owner_account = 6;
  uint64 owner_revision = 7;
  uint64 issued_at_ms = 8;
  uint64 inbox_seq = 9;
  uint32 inbox_state = 10;
  uint32 dispatch_state = 11; // 0旧归档、1待入箱/核原收据、2已确认APPLIED。
  uint64 next_retry_ms = 12;
}
