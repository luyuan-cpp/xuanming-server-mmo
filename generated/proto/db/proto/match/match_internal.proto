syntax = "proto3";
package match;

import "proto/db/proto_option.proto";
import "proto/battle/battle_data.proto";
import "proto/common/base/service_call_auth.proto";

option go_package = "db/proto/match";
option cc_generic_services = false;
option (OptionFileDefaultNode) = NODE_MATCH;

// match 内部服务(帮会同道历练,docs/design/guild-phase2/06-activities.md §6.16–§6.18)。
// Start/Cancel 的调用方为 Guild；Commit 的调用方为 Battle。
// 按完整方法分别核固定签名白名单，缺密钥拒绝；客户端与组队服务不得直接调用。
// 照 proto/trade/trade_admin.proto 的隔离做法:
//   - 刻意不标 OptionIsClientProtocolService,且与客户端协议 match_service.proto 分文件:
//     gate 的 IsClientMessageId 不收这些消息号,客户端发来直接丢弃;
//   - 路由服对 ClientProtocol=false 的条目回信封拒绝;
//   - match 的会话拦截器对"带会话 metadata 调 MatchInternal.*"回 gRPC PermissionDenied;
//   - 内部签名由 shared/serviceauth 核验，NetworkPolicy 只是额外网络边界；
//   - 客户端 tools/gen_proto.ps1 不列本文件,内部 schema 不进客户端包。

// 拒绝原因。业务拒绝一律走响应里的 reject,不回 gRPC 错误;
// gRPC 错误只用于 PermissionDenied(带会话调用)与传输层故障,guild 统一映射为 GuildTrialServiceBusy。
enum ActivityBattleReject {
  ACTIVITY_BATTLE_REJECT_NONE = 0;               // 成功:battle_id 非 0,gather 已异步启动
  ACTIVITY_BATTLE_REJECT_INVALID_ARGUMENT = 1;   // 人数越界 / 0 或重复 id / battle_config_id 为 0 / 上下文缺失或字段为 0 / 发起人不在首位
  ACTIVITY_BATTLE_REJECT_MEMBER_OFFLINE = 2;     // offender 无在线会话
  ACTIVITY_BATTLE_REJECT_MEMBER_IN_BATTLE = 3;   // offender 持有 battle:lock(已在战斗中)
  ACTIVITY_BATTLE_REJECT_MEMBER_NOT_READY = 4;   // offender 无场景位置 / 有未自愈的在途票据 / 建 matched 票失败
  ACTIVITY_BATTLE_REJECT_INTERNAL = 5;           // match 内部故障:发号失败 / Redis 读写出错(guild 映射为 GuildTrialServiceBusy)
}

message StartActivityBattleRequest {
  uint32 battle_config_id = 1;                 // DungeonTable id(= GuildActivity.dungeon_id);非 0
  // 站位顺序即队伍顺序,发起人在首位;1..kMaxBattleTeamSize(5)人、非 0、不重复。
  // 名单是 guild 邀请房间里全员已同意的同帮成员,match 只做在线 / 战斗锁 / 位置 / 在途票的只读预检,不复核帮会归属。
  repeated uint64 member_player_ids = 2;
  // 活动上下文:kind 必须非 NONE,guild_id / activity_id / period_key / guild_period_key 非 0,
  // initiator_player_id == member_player_ids[0]。match 深拷贝后原样放进 CreateBattleRequest.activity_context。
  BattleActivityContext activity_context = 3;
  uint64 request_id = 4; // 调用方持久的邀请房间/业务操作号；全球模式为0拒绝，重试必须复用。
}

message StartActivityBattleResponse {
  ActivityBattleReject reject = 1;
  uint64 offender_player_id = 2;   // reject 为 MEMBER_OFFLINE / MEMBER_IN_BATTLE / MEMBER_NOT_READY 时非 0(名单顺序里第一个不满足的人);其余为 0
  // reject == NONE 时非 0:match 同步生成(shared/snowflake,battle_id 唯一生产者)并已为全员建好 matched 票、
  // 异步启动 gather;guild 据此登记 guild_trial_battle。gather 之后失败时全员删票、不回队列,
  // 该 battle_id 不会产生结果事件,由 guild 巡检器兜底判 EXPIRED。
  uint64 battle_id = 3;
  uint32 formation_state = 4; // 全球SQL成局状态1..5；不独自作为可安全撤销的证明。
}

// 取消必须绑定整份原Start；未知结果只能按原request重放，不能换名单或活动上下文。
message CancelActivityBattleRequest {
  StartActivityBattleRequest original = 1;
  common.base.ServiceCallAuth auth = 2;
}
message CancelActivityBattleResponse {
  uint64 battle_id = 1;
  bool request_cancelled = 2; // true且battle_id=0：持久墓碑已提交，迟到Start不能再开战。
  uint32 formation_state = 3;
  common.base.ServiceCallAuth auth = 4;
  string request_digest = 5; // 清空原Cancel.auth后请求摘要；签名回复必须与本请求原件匹配。
  BattleOutcomeDecision terminal_decision = 6;
}

enum BattleOutcomeDecision {
  BATTLE_OUTCOME_DECISION_UNKNOWN = 0;
  BATTLE_OUTCOME_DECISION_COMPLETE = 1;
  BATTLE_OUTCOME_DECISION_ABORT = 2;
}

// 完整原事件在个人副作用前提交；相同局只接受相同字节，未知提交重放原件。
message CommitBattleOutcomeRequest {
  uint64 battle_id = 1;
  string placement_operation_id = 2;
  string target_instance_id = 3;
  bytes raw_result_payload = 4;
  common.base.ServiceCallAuth auth = 5;
}
message CommitBattleOutcomeResponse {
  BattleOutcomeDecision decision = 1;
  string request_digest = 2;
  common.base.ServiceCallAuth auth = 3;
}

service MatchInternal {
  rpc StartActivityBattle(StartActivityBattleRequest) returns (StartActivityBattleResponse);
  rpc CancelActivityBattle(CancelActivityBattleRequest) returns (CancelActivityBattleResponse);
  rpc CommitBattleOutcome(CommitBattleOutcomeRequest) returns (CommitBattleOutcomeResponse);
}
