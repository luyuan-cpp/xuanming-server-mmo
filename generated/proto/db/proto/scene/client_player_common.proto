syntax = "proto3";
option go_package = "db/proto/scene";

import "proto/db/proto_option.proto";
import "proto/common/base/tip.proto";
import "proto/common/base/empty.proto";

option cc_generic_services = true;
option (OptionFileDefaultNode) = NODE_SCENE;


message GameKickPlayerRequest {
  TipInfoMessage reason = 1;
  string operator = 2;
}

// Server tells client to disconnect and reconnect to a different Gate (cross-zone transition).
message RedirectToGateNotify {
  string target_ip = 1;
  uint32 target_port = 2;
  bytes  token_payload = 3;    // serialized GateTokenPayload for target gate
  bytes  token_signature = 4;  // HMAC-SHA256 signature
  int64  token_deadline = 5;   // unix seconds
  // 目标 gate 的 WebSocket 地址:小游戏客户端连它,原生客户端仍连 target_ip / target_port;空串 = 目标 gate 不接小游戏
  // (docs/design/minigame-websocket-gate.md W7)。
  string target_ws_url = 6;
}

// 角色改名(docs/design/rename-and-content-safety.md §4.3)。应答只表示「已受理」或「立即拒绝」:
// error_message 为空 = 已受理,最终结局经 NotifyPlayerRenamed 推送(名字要送内容安全、再到全服名字表登记,等不了一个回包)。
// 需要背包里有改名卡(配表 RoleNameRule.rename_item_id);受理后这张卡被占住,改名成功才扣,不成原样还给玩家。
message RenamePlayerRequest {
  string name = 1;
}

message RenamePlayerResponse {
  TipInfoMessage error_message = 1;
}

// 改名的最终结局。error_message 为空 = 成功,name 是新名(规范化后的写法),next_rename_time 是最早可以再改的时刻(Unix 秒)。
// 失败时 error_message 是原因,name 为空;改名卡已经解除占用。
message PlayerRenamedNotify {
  TipInfoMessage error_message = 1;
  string name = 2;
  uint64 next_rename_time = 3;
}

// 主角权威状态互斥标志即时同步(只发给主角本人,不广播旁观者)。
// 任何行为状态(ActorActionState: bit0=Combat, bit1=TeamFollow, bit2=Mounted)或
// 战斗异常状态(ActorCombatState: bit1=Silence 等)发生实际位变化时立即单播给主角,
// 供客户端刷新 UI 禁用与本地角色状态机纠偏;入场 / 重连落地若存在非零态也会补推一次。
message SelfActorStateFlagsS2C {
  uint64 action_state_mask = 1; // 位 i = eActorState(i)
  uint64 combat_state_mask = 2; // 位 i = eActorCombatState(i)
  uint64 state_seq = 3;         // 单次进场内单调递增序号(仅位变化或重推时递增,防乱序覆盖)
}

service SceneClientPlayerCommon 
{
  option (OptionIsPlayerService) = true;
  option (OptionIsClientProtocolService) = true;
  
  rpc SendTipToClient (TipInfoMessage) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc KickPlayer (GameKickPlayerRequest) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc RedirectToGate (RedirectToGateNotify) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc RenamePlayer (RenamePlayerRequest) returns (RenamePlayerResponse);
  rpc NotifyPlayerRenamed (PlayerRenamedNotify) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc NotifySelfActorStateFlags (SelfActorStateFlagsS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
}
