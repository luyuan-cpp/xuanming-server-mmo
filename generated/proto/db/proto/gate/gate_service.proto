syntax = "proto3";
option go_package = "db/proto/gate";

import "proto/db/proto_option.proto";
import "proto/common/base/empty.proto";
import "proto/common/base/message.proto";
import "proto/common/base/gm_admin.proto";

option cc_generic_services = true;
option (OptionFileDefaultNode) = NODE_GATE;

message BindSessionToGateRequest {
  uint32 session_id = 1;
  uint64 player_id = 2;
  uint32 session_version = 3; 
}

message BindSessionToGateResponse {
  uint32 session_id = 1;
  uint64 player_id = 2;
  uint32 session_version = 3; 
}

message BroadcastToPlayersRequest
{
  repeated uint32 session_list = 1;
  MessageContent message_content = 2;
  // Bitmap encoding: more compact than session_list when many sessions on one gate.
  // bit N set in session_bitmap means session (session_bitmap_base + N) is included.
  uint32 session_bitmap_base = 3;
  bytes session_bitmap = 4;
  // 目标玩家身份栅栏(routing-identity-audit-20260908.md R13),与 NodeMessageHeader
  // .target_player_id 同一理由:session_id 的高位是**立刻复用**的 gate node_id,
  // 低 17 位序号在单个 gate 实例内也会回绕,单靠 session_id 会把 A 的广播写进
  // 另一个玩家的 socket。
  //
  // **顺序即契约**:player_list[i] 对应"按 session_id 升序"的第 i 个目标。
  //   - session_list 形态:发送方按升序填 session_list,两个列表逐项对应;
  //   - bitmap 形态:gate 按 bit 序(= session_id 升序)遍历,第 i 个置位的
  //     session 对应 player_list[i]。
  // 两种形态都归结为同一条规则,不存在第二种解释。
  // 留空 = 老发送方(灰度窗口),gate 放行不校验。
  repeated uint64 player_list = 5;
}

message BroadcastToSceneRequest
{
  uint64 scene_id = 1;
  MessageContent message_content = 2;
}

message BroadcastToAllRequest
{
  MessageContent message_content = 1;
}

service Gate {
  rpc PlayerEnterGameNode (RegisterGameNodeSessionRequest) returns (RegisterGameNodeSessionResponse);
  rpc SendMessageToPlayer (NodeRouteMessageRequest) returns (Empty);
  rpc RouteNodeMessage (RouteMessageRequest) returns (RouteMessageResponse);
  rpc RoutePlayerMessage (RoutePlayerMessageRequest) returns (RoutePlayerMessageResponse);
  rpc BroadcastToPlayers (BroadcastToPlayersRequest) returns (Empty);
  rpc BroadcastToScene (BroadcastToSceneRequest) returns (Empty);
  rpc BroadcastToAll (BroadcastToAllRequest) returns (Empty);
  rpc NodeHandshake(NodeHandshakeRequest) returns (NodeHandshakeResponse);
  rpc BindSessionToGate(BindSessionToGateRequest) returns (BindSessionToGateResponse);
  rpc GmGracefulShutdown (GmGracefulShutdownRequest) returns (GmGracefulShutdownResponse);
}
