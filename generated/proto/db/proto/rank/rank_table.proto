syntax = "proto3";
package rankpb;
option go_package = "db/proto/rank";
import "proto/db/proto_option.proto";

// SQL是写分、代次、封榜和奖励意图的唯一权威；Redis至多是可重建展示投影。
message RankBoardRecord {
  option (OptionTableName) = "rank_board";
  option (OptionPrimaryKey) = "board_id";
  option (OptionUniqueKey) = "board_type,scope,scope_id,period,generation";
  uint64 board_id = 1;
  uint32 board_type = 2;
  uint32 scope = 3;
  uint64 scope_id = 4;
  string period = 5;
  uint64 generation = 6;
  string producer = 7;
  uint64 source_epoch = 8;
  uint64 committed_cursor = 9; // 本代已落账的批次总数(各片之和),封榜按它核齐;各片游标看 rank_input_receipt。
  uint32 ascending = 10;
  uint32 state = 11;
  uint64 settlement_id = 12;
  uint64 open_request_id = 13;
  string open_request_hash = 14;
  uint64 created_ms = 15;
  uint64 sealed_ms = 16;
  uint64 deleted_ms = 17;
  // 本代榜上现有的实体数(2026-11-05,缺口清单第 18 条):Submit 新增实体时加、Remove 删行时减,都在榜行锁里改,
  // 与 rank_score 同事务提交。读路径的总数直接取它,不再对全榜 COUNT。
  uint64 entries = 18;
}
message RankScoreRecord {
  option (OptionTableName) = "rank_score";
  option (OptionPrimaryKey) = "board_id,generation,entity_id";
  // 名次顺序索引(2026-11-05 起按 order_key,缺口清单第 18 条):降序榜原来是「score DESC, achieved_ms ASC」混合方向,
  // 单向索引用不上,分页、求名次、封榜取前 N 都要整榜排序。order_key 把两种榜统一成同一方向,三处都顺着索引走。
  option (OptionIndex) = "board_id,generation,order_key,achieved_ms,entity_id";
  uint64 board_id = 1;
  uint64 generation = 2;
  uint64 entity_id = 3;
  int64 score = 4;
  uint64 achieved_ms = 5;
  uint64 source_cursor = 6;
  uint64 score_version = 7; // 最后写入这一行的批次版本,0 = 生产者不带版本。
  // 名次越靠前越小的排序键:升序榜 = score,降序榜 = ^score(按位取反,即 -score-1,单调递减且覆盖整个 int64 不溢出)。
  // 只由 go/rank 写(data.orderKey),与 score 同一条语句写入,不单独改。
  int64 order_key = 8;
}
// 每一片每一游标的完整请求摘要保留至本代保留窗结束，晚重试不能冒充新一批。
message RankInputReceiptRecord {
  option (OptionTableName) = "rank_input_receipt";
  option (OptionPrimaryKey) = "board_id,generation,source_shard,source_cursor";
  uint64 board_id = 1;
  uint64 generation = 2;
  uint64 source_cursor = 3;
  uint64 request_id = 4;
  string request_hash = 5;
  uint64 committed_ms = 6;
  uint32 source_shard = 7;
}
message RankSettlementRecord {
  option (OptionTableName) = "rank_settlement";
  option (OptionPrimaryKey) = "settlement_id";
  option (OptionUniqueKey) = "board_id,generation";
  uint64 settlement_id = 1;
  uint64 board_id = 2;
  uint64 generation = 3;
  uint64 source_epoch = 4;
  uint64 final_cursor = 5;
  uint64 request_id = 6;
  string request_hash = 7;
  uint64 winner_count = 8;
  uint64 sealed_ms = 9;
}
message RankSnapshotRecord {
  option (OptionTableName) = "rank_snapshot";
  option (OptionPrimaryKey) = "settlement_id,rank";
  uint64 settlement_id = 1;
  uint64 rank = 2;
  uint64 entity_id = 3;
  int64 score = 4;
  uint64 achieved_ms = 5;
}
// 与seal及所有快照同事务插入。工作器只投MailAdmin，不直接发资产。
message RankMailRewardRecord {
  option (OptionTableName) = "rank_mail_reward";
  option (OptionPrimaryKey) = "reward_id";
  option (OptionUniqueKey) = "settlement_id,player_id";
  option (OptionIndex) = "status,next_attempt_ms";
  uint64 reward_id = 1;
  uint64 settlement_id = 2;
  uint64 player_id = 3;
  uint64 rank = 4;
  bytes attachments = 5;
  // 1 = 待投;2 = 已投(mail_id 非 0);3 = 放弃(终态:邮件明确拒收且已过期或尝试次数到顶,工作器不再投,
  // 行原样保留供人工核对重投,见 docs/design/leaderboard-system.md「2026-11-05 奖励邮件过期写定、放弃终态与人工重投」节)。
  // 取值定义在 go/rank/internal/data/rewards.go。
  uint32 status = 6;
  uint64 mail_id = 7;
  uint64 next_attempt_ms = 8;
  uint64 lease_until_ms = 9;
  uint64 lease_token = 10;
  uint32 attempts = 11; // 已完成的投递尝试次数,含结果未知。
  uint64 created_ms = 12;
  uint64 updated_ms = 13;
  // 奖励邮件的过期时刻,封榜时写定为 封榜时刻 + min(30 天, 邮件个人邮件最大有效期)。每次重投原样带上,
  // 载荷摘要因此不变;邮件在过期之后对同一请求只会回原邮件或明确拒收,不会再新建。
  uint64 expire_ms = 14;
}
message RankMutationRecord {
  option (OptionTableName) = "rank_mutation";
  option (OptionPrimaryKey) = "board_id,generation,request_id";
  string request_hash = 1;
  uint64 board_id = 2;
  uint64 generation = 3;
  uint64 request_id = 4;
  uint64 created_ms = 5;
}
// 本代被移除的实体。只删 rank_score 的行会连版本一起丢,迟到的旧批次能把人带回榜上,所以留这条墓碑,本代内一直有效。
message RankRemovedEntryRecord {
  option (OptionTableName) = "rank_removed_entry";
  option (OptionPrimaryKey) = "board_id,generation,entity_id";
  uint64 board_id = 1;
  uint64 generation = 2;
  uint64 entity_id = 3;
  uint64 removed_ms = 4;
}
