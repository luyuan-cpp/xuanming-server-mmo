syntax = "proto3";
option go_package = "db/proto/battle";

import "proto/db/proto_option.proto";
import "proto/common/base/tip.proto";
import "proto/common/base/empty.proto";
import "proto/battle/battle_data.proto";
import "proto/battle/player_battle.proto";

// 本契约由 muduo_grpc 承载，只生成普通 Protobuf 消息，不启用 cc_generic_services。
// C++ 服务骨架继承 muduo_grpc::Service，不依赖官方 gRPC 插件或服务桩。
option (OptionFileDefaultNode) = NODE_BATTLE;

// 非战斗服务在角色首锁内首次捕获的退出原件；只可取消此op，不得重读当前观战补齐。
message ObserverExitOriginal {
  uint64 player_id = 1;
  string owner_account = 2;
  uint64 owner_revision = 3;
  string operation_id = 4;
  string head_request_id = 5;
  AddObserverRequest add = 6;
  string rpc_host = 7;
  uint32 rpc_port = 8;
  uint32 node_id = 9;
  string instance_id = 10;
}

// battle 节点内部 gRPC 契约(match 服务调用)。
// battle_id 由 match 服务用 shared/snowflake(17-bit worker 布局)生产,是该 ID 的唯一生产者
// (SnowFlake 节点隔离不变量,宪法 §7)。
// 设计依据:docs/design/turn-based-battle-server.md §3.1、§5.4。

message CreateBattleRequest {
  uint64 battle_id = 1;
  uint32 battle_config_id = 2;             // DungeonTable id(怪物组/回合上限来源)
  repeated BattlePlayerSnapshot players = 3;
  uint64 seed = 4;                         // 确定性 RNG 种子(match 生成)
  uint32 match_mode = 5;                   // MatchMode 数值(PVE/PVP 区分,决定逃跑等规则)
  uint64 created_at_ms = 6;                // Unix 毫秒
  uint64 deadline_ms = 7;                  // 战斗最长期限,超时 battle 强制平局收尾
  string table_fingerprint = 8;            // match 确认的全员一致指纹;battle 与自身指纹不一致按配置拒开局/告警
  // 活动对局上下文(帮会同道历练,docs/design/guild-phase2/06-activities.md §6.17/§6.19)。
  // 可空:普通对局不填(等价 kind == NONE)。match 的 RunActivityGather 原样填入;battle 存进房间,
  // 结算时回显进 BattleResultEvent.activity_context,并且 kind != NONE 时先落 SharedRedis
  // battle:activity_result:{battle_id} 再发 Kafka(未被 guild 销账就重发)。battle 不解释其余字段。
  BattleActivityContext activity_context = 9;
  uint32 required_physical_region = 10;
  string placement_operation_id = 11;
  string target_instance_id = 12;
  // 首次创建必须早于备战截止；重复同操作只查询/重放既有结果，不能在备战自愈后重新建房。
  uint64 admit_before_ms = 13;
  // 1：个人副作用之前必须先取得 Match SQL 的 COMPLETE；0 保持旧协议且不得追认。
  uint32 outcome_protocol_version = 14;
}

// error_message 非零 = 未建房。签不出参战票据时回 kServiceUnavailable(turn-based §22 D70 fail-closed):
// battle 保证没有建房、没有推送、没有发确认事件,match 按通用补偿回滚(DestroyBattle 幂等 → CancelBattlePrepare)。
message CreateBattleResponse {
  uint64 battle_id = 1;
  TipInfoMessage error_message = 2;
  uint32 adopted_outcome_protocol_version = 3;
  string target_instance_id = 4;
}

message DestroyBattleRequest {
  uint64 battle_id = 1;
  string reason = 2;   // 补偿路径记录用(gather 回滚 / 管理指令)
  // 全球放置时三项必须与创建意图相同；销毁先登记本实例操作墓碑，拒绝迟到的 Create。
  string placement_operation_id = 3;
  string target_instance_id = 4;
}

message QueryBattleCreationRequest {
  uint64 battle_id = 1;
  string placement_operation_id = 2;
  string target_instance_id = 3;
}
enum BattleCreationState {
  BATTLE_CREATION_UNKNOWN = 0;
  BATTLE_CREATION_PRESENT = 1;
  BATTLE_CREATION_ABSENT = 2;
  BATTLE_CREATION_ABORTED = 3;
}
message QueryBattleCreationResponse {
  BattleCreationState state = 1;
  string target_instance_id = 2;
  // ABSENT 也回显节点能力；PRESENT 的 adopted 只取原创建原件，不按现能力追认。
  uint32 supported_outcome_protocol_version = 3;
  uint32 adopted_outcome_protocol_version = 4;
}

// ---- 二期:观战(match → battle,设计文档 §10) ----
// 观众路由只填 session/gate/zone 字段(scene 字段留 0:观众无结算,battle 不会
// 向观众的 scene 发任何事件);match 从 player:session:{id} 组装。
message AddObserverRequest {
  uint64 battle_id = 1;
  uint64 observer_player_id = 2;
  BattleRouting routing = 3;
  string observer_name = 4;   // 日志/后续观众列表展示用
  string spectator_operation_id = 5; // 原SQL观战意图UUID；重试复用，不能只按player_id覆盖。
  uint64 admit_before_ms = 6; // 原准入截止，至多未来30秒；取消墓碑至少保留到此时。
  string target_instance_id = 7; // 固定战斗实例；进程重启不能继承旧准入。
}

// 房间不存在(kEntityIsNull)/观众已满/观众是参战者/签不出观战票据(kServiceUnavailable)。
// 签票失败时 battle 保证该观众不在名单里(新观众不登记;幂等重推路径摘除已登记的观众并关其直连,
// turn-based §22 D70),与 match 收到任何错误即 DEL 观战标记的回滚一致。
message AddObserverResponse {
  TipInfoMessage error_message = 1;
}

message RemoveObserverRequest {
  uint64 battle_id = 1;
  uint64 observer_player_id = 2;
  string reason = 3;   // 日志用(玩家去排队被互斥清退等)
  string spectator_operation_id = 4;
  uint64 admit_before_ms = 5; // 必须与原Add相同，先取消后到达的Add也不能生效。
  string target_instance_id = 6;
}
message RemoveObserverResponse {
  bool cancelled = 1; // 对应原operation的迟到Add已被永久拒绝，且该operation不在房内。
  string spectator_operation_id = 2;
  string target_instance_id = 3;
}
enum ObserverAdmissionState {
  OBSERVER_ADMISSION_UNKNOWN = 0;
  OBSERVER_ADMISSION_ACTIVE = 1;
  OBSERVER_ADMISSION_ABSENT = 2; // 当前没有原op，不能独自作为迟到Add已被封闭的证明。
}
message QueryObserverRequest {
  uint64 battle_id = 1;
  uint64 observer_player_id = 2;
  string spectator_operation_id = 3;
  string target_instance_id = 4;
}
message QueryObserverResponse {
  ObserverAdmissionState state = 1;
  string spectator_operation_id = 2;
  string target_instance_id = 3;
}

// ---- 票据补签(match → battle;client-rpc-router.md / turn-based-battle-server.md §18 D25) ----
// 客户端丢票经大厅会话调 MatchService.RequestBattleTicket,match 定位房间所在 battle 节点后调本 RPC。
// 仅当 player_id 仍是该房间的参战者或观众时才签;否则 error_message 非零且 assignment 为空。
// 内部 RPC:player_id 由 match 从会话 metadata 取得后填入,battle 只核对名单不再鉴权。
message IssueBattleTicketRequest {
  uint64 battle_id = 1;
  uint64 player_id = 2;
  string spectator_operation_id = 3; // 观众必填原operation，参战者必须为空。
  string target_instance_id = 4;
}

message IssueBattleTicketResponse {
  TipInfoMessage error_message = 1;
  BattleAssignedS2C assignment = 2;
}

service BattleNode {
  rpc QueryObserver(QueryObserverRequest) returns (QueryObserverResponse);
  rpc QueryBattleCreation(QueryBattleCreationRequest) returns (QueryBattleCreationResponse);
  rpc CreateBattle (CreateBattleRequest) returns (CreateBattleResponse);
  rpc DestroyBattle (DestroyBattleRequest) returns (Empty);
  rpc AddObserver (AddObserverRequest) returns (AddObserverResponse);
  rpc RemoveObserver (RemoveObserverRequest) returns (RemoveObserverResponse);
  rpc IssueBattleTicket (IssueBattleTicketRequest) returns (IssueBattleTicketResponse);
}
