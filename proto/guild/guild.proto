}

message GuildWarStreakBountyView {
  uint64 player_id = 1;
  string player_name = 2;
  uint64 guild_id = 3;
  string guild_name = 4;
  uint32 streak = 5;
  uint64 bonus_contribution = 6;
  uint64 bonus_silver = 7;
  bool   in_battle = 8;
  uint64 battle_id = 9;
}

message GuildWarLiveTargetView {
  uint64 player_id = 1;
  string player_name = 2;
  uint64 guild_id = 3;
  string guild_name = 4;
  uint32 level = 5;
  string pet_name = 6;
  uint32 party_size = 7;
  uint32 streak = 8;
  bool   in_battle = 9;
  uint64 battle_id = 10;
  uint32 leyline_id = 11;
  bool   is_rival_guild = 12;
