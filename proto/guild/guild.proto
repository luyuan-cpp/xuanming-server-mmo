syntax = "proto3";
package guildpb;

option go_package = "guild/proto/guild";

import "proto/db/proto_option.proto";
import "proto/common/base/tip.proto";
import "proto/common/base/empty.proto";

// ── Guild basic data ─────────────────────────────────────────────

message GuildMember {
  uint64 player_id            = 1;
  uint32 role                 = 2;  // 0=成员 1=长老 3=帮主(2 不启用);权限比较一律走 go/guild constants.Rank
  uint64 join_time_ms         = 3;
  uint64 last_active_ms       = 4;
  // 5 号原为 contribution,2026-09 拆成 total / balance 两个字段。
  // 开发期本可直接复用 5 号,但 reserved 更安全:它让"后续批次误用 5 号"在
  // protoc 阶段就报错,而不是等旧客户端按新语义解出一个看似合法的数字。
  reserved 5;
  bool   online               = 6;  // 是否在线(读 player:session,不入库)
  string name                 = 7;  // 展示名(不入库;B3b 起由 data_service BatchGetPlayerName 填,B2 恒空)
  uint64 contribution_total   = 8;  // 累计帮贡,只增(B5 起写入)
  uint64 contribution_balance = 9;  // 可消费帮贡(B5 起写入)
}

message GuildInfo {
  uint64 guild_id       = 1;
  string name           = 2;
  uint64 leader_id      = 3;
  uint32 level          = 4;
  string announcement   = 5;
  uint64 create_time_ms = 6;
  uint32 max_members    = 7;
  repeated GuildMember members = 8;  // 按 player_id 升序(B1 起 ORDER BY player_id)
  uint32 zone_id        = 9;  // Zone this guild belongs to
  uint64 funds                      = 10;  // 帮会资金(B5 起写入)
  uint32 max_officers               = 11;  // GuildLevel[level].max_officers
  uint32 officer_count              = 12;  // members 中 role=1 的人数
  uint64 upgrade_cost_funds         = 13;  // GuildLevel[level].upgrade_cost_funds;0 = 满级
  string leader_name                = 14;  // 展示用(B3b 填,B2 恒空)
  // pending_application_count 只对本帮长老 / 帮主非 0:待审数量是管理侧信息,
  // 对普通成员与外人一律回 0,不把帮会内部状态泄给任意查询者。
  uint32 pending_application_count  = 15;
  uint64 renamed_ms                 = 16;  // 上一次帮会改名时刻 Unix 毫秒;0 = 未改过名
}

// ── Request/Response ────────────────────────────────────────────────

// 建帮者与所在区一律取会话与服务端归属,请求体不带身份(docs/design/gate-online-identity.md §9.6)。
message CreateGuildRequest {
  reserved 1, 3;  // 原 player_id / zone_id:服务端从不采信,上线前删除
  string name = 2;
}

message CreateGuildResponse {
  TipInfoMessage error_message = 1;
  GuildInfo guild = 2;
}

message GetGuildRequest {
  uint64 guild_id = 1;
}

message GetGuildResponse {
  TipInfoMessage error_message = 1;
  GuildInfo guild = 2;
}

message GetPlayerGuildRequest {
  uint64 player_id = 1;
}

message GetPlayerGuildResponse {
  TipInfoMessage error_message = 1;
  GuildInfo guild = 2;
}

// ── expected_guild_id(LeaveGuild / DisbandGuild / SetGuildMemberRole / KickGuildMember / TransferGuildLeader)──
// 客户端发出请求时**看到的本人帮会**(docs/design/client-request-ordering.md O14 / §6.4)。
// 0 = 旧客户端:按服务端此刻查到的本人帮会执行,行为与加字段之前完全相同。
// 非 0:只对该帮生效,与写入在同一个事务里复核。操作者此刻不在该帮(在别的帮、已离帮、该帮已解散)
// 一律回 kGuildNotInGuild、不写入;回包有 guild 字段的方法附上操作者**当前**所在帮会的快照(不在任何帮则不填)。
// 它防的是超时后晚到的旧请求作用到玩家新加入的帮会上(退出新帮、解散新帮、在新帮里踢人 / 转让 / 任免)。
// 注意退帮:expected_guild_id 非 0 而玩家已不在任何帮时同样回 kGuildNotInGuild(它回答的是「你不在该帮」),
// 不按幂等成功处理;客户端收到后拉 GetPlayerGuild 刷新即可。

message LeaveGuildRequest {
  reserved 1;  // 原 player_id:身份只取会话,上线前删除
  uint64 expected_guild_id = 2;  // 见上方 expected_guild_id 说明
}

message LeaveGuildResponse {
  TipInfoMessage error_message = 1;
}

message DisbandGuildRequest {
  reserved 1;  // 原 player_id:身份只取会话,上线前删除
  uint64 expected_guild_id = 2;  // 见上方 expected_guild_id 说明
}

message DisbandGuildResponse {
  TipInfoMessage error_message = 1;
}

message SetAnnouncementRequest {
  reserved 2;  // 原 player_id:身份只取会话,上线前删除
  uint64 guild_id     = 1;
  string announcement = 3;
}

message SetAnnouncementResponse {
  TipInfoMessage error_message = 1;
  GuildInfo guild = 2;  // 成功时为提交前事务内读到的权威快照(含新公告)
}

// 帮会改名(docs/design/rename-and-content-safety.md §5):仅帮主可发起,扣帮会资金,旧名进入保护期。
message RenameGuildRequest {
  uint64 guild_id = 1;
  string name     = 2;
}

message RenameGuildResponse {
  TipInfoMessage error_message    = 1;
  GuildInfo guild                 = 2;  // 成功时为事务内权威快照(含新帮名与扣后资金)
  uint64 next_rename_time         = 3;  // 最早可再次改名的时刻 Unix 秒(成功或冷却中时填写)
}

// ── 成员管理(B2)────────────────────────────────────────────────
// 以下请求都不带 player_id:操作者一律取 gate 会话,无会话的内部调用直接拒绝
// (go/guild/internal/logic)。把操作者放进请求体等于让客户端自报身份。

message SetGuildMemberRoleRequest {
  uint64 target_player_id  = 1;
  uint32 role              = 2;  // 只允许 0(成员)/ 1(长老)
  uint64 expected_guild_id = 3;  // 见 LeaveGuildRequest 上方的 expected_guild_id 说明
}
message SetGuildMemberRoleResponse {
  TipInfoMessage error_message = 1;
  // 成功时为提交后的权威快照;expected_guild_id 不符被拒(kGuildNotInGuild)时为操作者当前所在帮会的快照,不在任何帮则不填
  GuildInfo guild = 2;
}

message KickGuildMemberRequest {
  uint64 target_player_id  = 1;
  uint64 expected_guild_id = 2;  // 见 LeaveGuildRequest 上方的 expected_guild_id 说明
}
message KickGuildMemberResponse {
  TipInfoMessage error_message = 1;
  GuildInfo guild = 2;  // 同 SetGuildMemberRoleResponse.guild
}

message TransferGuildLeaderRequest {
  uint64 target_player_id  = 1;
  uint64 expected_guild_id = 2;  // 见 LeaveGuildRequest 上方的 expected_guild_id 说明
}
message TransferGuildLeaderResponse {
  TipInfoMessage error_message = 1;
  GuildInfo guild = 2;  // 同 SetGuildMemberRoleResponse.guild
}

// ── 入帮申请(B2)────────────────────────────────────────────────

message ApplyJoinGuildRequest {
  uint64 guild_id = 1;
}
message ApplyJoinGuildResponse {
  TipInfoMessage error_message = 1;  // 同帮重复申请 = 刷新有效期并成功
}

message CancelGuildApplicationRequest {
  uint64 guild_id = 1;
}
message CancelGuildApplicationResponse {
  TipInfoMessage error_message = 1;
}

// 申请人视角的一条待审申请。
message GuildApplicationView {
  uint64 guild_id     = 1;
  string guild_name   = 2;
  uint32 level        = 3;
  uint32 member_count = 4;
  uint32 max_members  = 5;
  uint64 leader_id    = 6;
  string leader_name  = 7;  // B3b 填,B2 恒空
  uint64 apply_ms     = 8;  // 最近一次申请 / 刷新时刻(服务端时钟,Unix 毫秒)
  uint64 expire_ms    = 9;  // 过期时刻(服务端时钟);客户端只用于展示
}

message ListMyGuildApplicationsRequest {}
message ListMyGuildApplicationsResponse {
  TipInfoMessage error_message = 1;
  repeated GuildApplicationView applications = 2;  // 按 apply_ms 降序、guild_id 升序
}

// 审批人视角的一位申请人。
message GuildApplicantView {
  uint64 player_id = 1;
  string name      = 2;  // B3b 填,B2 恒空
  bool   online    = 3;  // 读 player:session,不入库
  uint64 apply_ms  = 4;
  uint64 expire_ms = 5;
}

message ListGuildApplicationsRequest {}
message ListGuildApplicationsResponse {
  TipInfoMessage error_message = 1;
  // 按 apply_ms 升序、player_id 升序,至多 GuildRule.max_pending_applications_per_guild 条
  repeated GuildApplicantView applicants = 2;
}

message ReviewGuildApplicationRequest {
  uint64 applicant_player_id = 1;
  bool   approve             = 2;
}
message ReviewGuildApplicationResponse {
  TipInfoMessage error_message = 1;
  GuildInfo guild = 2;  // 成功(通过或拒绝)时为审批人所在帮会的权威快照
}

// ── 推送(B2)────────────────────────────────────────────────────
// 至多一次;客户端收到只触发拉取(GetPlayerGuild 等),拉取结果才是真相。
// 枚举值名在 proto3 里是**包级**符号,本文件与 guild_db.proto 同在 package guildpb,
// 不带前缀会在包内撞名,所以每个值都带 GUILD_CHANGE_KIND_ 前缀。
enum GuildChangeKind {
  GUILD_CHANGE_KIND_UNSPECIFIED          = 0;
  GUILD_CHANGE_KIND_MEMBER_JOINED        = 1;
  GUILD_CHANGE_KIND_MEMBER_LEFT          = 2;
  GUILD_CHANGE_KIND_MEMBER_KICKED        = 3;
  GUILD_CHANGE_KIND_ROLE_CHANGED         = 4;
  GUILD_CHANGE_KIND_LEADER_TRANSFERRED   = 5;
  GUILD_CHANGE_KIND_DISBANDED            = 6;
  GUILD_CHANGE_KIND_APPLICATION_RECEIVED = 7;
  GUILD_CHANGE_KIND_APPLICATION_REJECTED = 8;
  GUILD_CHANGE_KIND_FUNDS_CHANGED        = 9;   // B5
  GUILD_CHANGE_KIND_LEVEL_UP             = 10;  // B5
  GUILD_CHANGE_KIND_ANNOUNCEMENT_CHANGED = 11;
  GUILD_CHANGE_KIND_ACTIVITY_CHANGED     = 12;  // B6
  GUILD_CHANGE_KIND_DELIVERY_DONE        = 13;  // B5
  GUILD_CHANGE_KIND_RENAMED              = 14;  // 帮会改名
  GUILD_CHANGE_KIND_WAR_UPDATED          = 15;  // 帮会全天帮战 V2 状态变动
}

message GuildChangedS2C {
  GuildChangeKind kind    = 1;
  uint64 guild_id         = 2;
  uint64 actor_player_id  = 3;  // 发起者;系统触发为 0
  uint64 target_player_id = 4;  // 被操作者;无则 0
}

// ── 帮会经济(B5):捐献 / 升级 / 商店 ─────────────────────────────
// 以下请求同样不带 player_id / guild_id:操作者与所在帮会一律取 gate 会话。
// "结算中 / 待发放"不是错误:它用视图里的 status 表达,**不进** error_message ——
// 客户端遇到任何非 0 tip 都会中断后续刷新,PENDING 塞进去会让一笔正常的单看起来像失败。

// 客户端可见的资产订单状态。guild_db.proto 的 GuildAssetOpStatus 是库内状态、不下发客户端,
// 这里另起一个;数值 1..5 与库内逐项相同。库内 ABANDONED(6,自动放弃)是库内专用状态,
// 由 logic.orderViewOf 显式映射为 ABORTED,不新增客户端枚举;服务端不按值转换,库内新增状态时在那里显式补映射。
enum GuildAssetOrderStatus {
  GUILD_ASSET_ORDER_STATUS_UNSPECIFIED     = 0;
  GUILD_ASSET_ORDER_STATUS_PENDING         = 1;  // 结算中 / 待发放
  GUILD_ASSET_ORDER_STATUS_APPLIED         = 2;
  GUILD_ASSET_ORDER_STATUS_REJECTED        = 3;
  GUILD_ASSET_ORDER_STATUS_ABORTED         = 4;  // 超时或人工撤销
  GUILD_ASSET_ORDER_STATUS_APPLIED_PARTIAL = 5;  // 已部分发放,转人工补偿(90 清单 X-15)
}

// 一笔捐献(DonateToGuild 的回包;GetGuildDonateOptions 的待结算列表与最近结果)。
message GuildDonationView {
  uint64 op_id                 = 1;
  uint32 donate_id             = 2;  // GuildDonate.id
  GuildAssetOrderStatus status = 3;
  uint32 currency_type         = 4;  // 0 银两 / 1 灵石
  uint64 cost_amount           = 5;
  uint64 contribution_gain     = 6;
  uint64 funds_gain            = 7;
  uint32 reason_tip_id         = 8;  // PENDING:最近一次暂时原因(资产段 tip,0 = 刚提交);REJECTED:拒绝原因
  uint64 created_ms            = 9;
}

// 捐献页的一个选项(配表行 + 本人今日用量)。客户端不加载配表,选项只能由服务端下发。
message GuildDonateOptionView {
  uint32 donate_id         = 1;
  string name              = 2;
  uint32 currency_type     = 3;
  uint64 cost_amount       = 4;
  uint64 contribution_gain = 5;
  uint64 funds_gain        = 6;
  uint32 daily_limit       = 7;
  uint32 used_today        = 8;   // 含结算中的占用
  uint32 min_guild_level   = 9;
  bool   unlocked          = 10;  // 帮会等级 >= min_guild_level
}

message GuildShopGoodsView {
  uint32 goods_id             = 1;
  string name                 = 2;
  uint32 category             = 3;   // 1 修行补给 / 2 帮会珍藏 / 3 节庆好礼
  uint32 item_id              = 4;
  uint32 item_count           = 5;   // 每份物品数
  uint64 cost_contribution    = 6;   // 每份帮贡
  uint32 required_guild_level = 7;
  bool   unlocked             = 8;
  uint32 limit_period         = 9;   // 0 不限 / 1 每游戏日 / 2 每周
  uint32 limit_count          = 10;  // limit_period=0 时为 0
  uint32 used_count           = 11;  // 本周期已兑换份数(含待发放)
  uint32 max_buy_count        = 12;  // 单次最多份数(服务端按物品堆叠上限算出;堆叠 1 的物品恒为 1)
}

message GuildShopOrderView {
  uint64 op_id                 = 1;
  uint32 goods_id              = 2;
  uint32 count                 = 3;  // 份数
  GuildAssetOrderStatus status = 4;
  uint64 cost_contribution     = 5;  // 本单总帮贡
  uint32 reason_tip_id         = 6;
  uint64 created_ms            = 7;
}

message GetGuildDonateOptionsRequest {}
message GetGuildDonateOptionsResponse {
  TipInfoMessage error_message                 = 1;
  repeated GuildDonateOptionView options       = 2;  // 按 donate_id 升序
  repeated GuildDonationView pending_donations = 3;  // 本人本帮 PENDING,按 (stream_epoch, seq) 升序,<=16
  uint64 contribution_total                    = 4;
  uint64 contribution_balance                  = 5;
  uint64 next_daily_reset_ms                   = 6;  // 下一个游戏日切点(UTC+8 05:00),Unix 毫秒
  repeated GuildDonationView recent_results    = 7;  // 本人 10 分钟内进入终态的捐献,<=5,新的在前
}

// ── client_request_id(DonateToGuild / BuyGuildShopGoods 的客户端幂等键)──
// 设计:docs/design/guild-phase2/05-economy.md 顶部「客户端幂等键」覆盖块。
// 0 = 旧客户端:不去重,行为与加字段之前完全相同(超时后重发会再扣一次)。
// 非 0:玩家每发起一次捐献 / 兑换生成一个新键;这一次操作的所有重发(超时、信封 1003、断线重连、kGuildBusyRetry)
// 都带**同一个**键,收到带订单视图(donation / order)的回包或其它业务拒绝之后才换键。键在同一玩家的两个方法之间共用一个空间。
// 服务端按 (玩家, 键) 去重:同一个键至多写成一笔指令;重发回首次那笔指令的**当前**视图(op_id 相同,status 可能已从结算中变为终态),
// 不再发号、不再扣。同一个键换了参数(另一个 donate_id / goods_id / count,或跨方法复用)回 kInvalidParameter(1005)、不写入。
// 去重记录与指令同事务写入;只有写成了指令的请求才留记录(被拒绝的请求没有副作用,用同一个键重发会重新判定)。
// 记录保留 AssetOp.TerminalRetentionDays(默认 30 天、下限 7 天),之后同一个键会被当成新请求 —— 键必须在这段时间内不重复。

message DonateToGuildRequest {
  uint32 donate_id = 1;
  uint64 client_request_id = 2;  // 见上方 client_request_id 说明
  uint64 expected_guild_id = 3;  // 非0绑定发起时的帮会；未提交的旧请求不得在换帮后首次执行
}
message DonateToGuildResponse {
  TipInfoMessage error_message = 1;
  GuildDonationView donation   = 2;  // 已写入指令时必填(含 REJECTED)
  GuildInfo guild              = 3;  // 请求者仍在帮时必填(含 PENDING)
}

// expected_level:客户端看到的当前等级。与库里不一致 = 已被他人升级,
// 回成功 + 最新 GuildInfo,不再扣资金(重复点击不会连升两级)。
message UpgradeGuildRequest {
  uint32 expected_level = 1;
}
message UpgradeGuildResponse {
  TipInfoMessage error_message = 1;
  GuildInfo guild              = 2;  // 请求者仍在帮时必填(含业务失败,如资金不足)
}

message GetGuildShopRequest {}
message GetGuildShopResponse {
  TipInfoMessage error_message               = 1;
  repeated GuildShopGoodsView goods          = 2;  // 按 category、goods_id 升序
  uint64 contribution_balance                = 3;
  repeated GuildShopOrderView pending_orders = 4;  // 本人 SHOP 类 PENDING,<=16
  uint64 next_daily_reset_ms                 = 5;
  uint64 next_weekly_reset_ms                = 6;  // 下一个周切点(UTC+8 周一 05:00),Unix 毫秒
  repeated GuildShopOrderView recent_orders  = 7;  // 本人 10 分钟内进入终态的兑换,<=5,新的在前
}

message BuyGuildShopGoodsRequest {
  uint32 goods_id          = 1;
  uint32 count             = 2;  // 份数,1..GuildShopGoodsView.max_buy_count
  uint64 client_request_id = 3;  // 见 DonateToGuildRequest 上方的 client_request_id 说明;count=0 与 count=1 视为同一参数
  uint64 expected_guild_id = 4;  // 非0绑定原帮会，事务仍按该帮会复核成员；0兼容旧端
}
message BuyGuildShopGoodsResponse {
  TipInfoMessage error_message = 1;
  GuildShopOrderView order     = 2;
  uint64 contribution_balance  = 3;  // 提交后的余额(REJECTED 时已退回)
}

// ── 帮会活动(B6a / B6b):元宵灯会 / 中秋团圆 / 同道历练 ─────────────────
// 设计:docs/design/guild-phase2/06-activities.md §6.4。
// - 五个 RPC 在 B6a 一次加齐:消息号、gate 白名单、路由表、MessageLimiter、客户端 MessageIds 只需各处理一次。
//   StartGuildTrial / RespondGuildTrialInvite 在 B6b 落地前固定回 kGuildActivityNotOpen,视图里历练恒为 DISABLED。
// - 请求体同样不带 player_id / guild_id:身份一律取 gate 会话,无会话回 gRPC PermissionDenied(与 B5 同口径)。
// - 周期口径(README §3 U1):个人次数按游戏日(UTC+8 每天 05:00 重置);帮会级进度(点灯阈值、团圆锁存、
//   资金只发一次)按活动档期。两个键都下发(period_key / guild_period_key),客户端不自己算切点。
// - 写 RPC 成功只回本活动的视图;帮贡、资金变了由客户端排队再拉 GetPlayerGuild(06 §6.49 #4)。
// - 刻意不 import asset_op.proto:奖励物品用本段的 GuildRewardItem,免得把内部资产通道的 schema 带进客户端包。
// - 与 B5 相同,"物品待发放"不是错误,用视图字段表达,不进 error_message。

enum GuildActivityType {
  GUILD_ACTIVITY_TYPE_UNSPECIFIED = 0;
  GUILD_ACTIVITY_TYPE_LANTERN     = 1;  // 元宵灯会
  GUILD_ACTIVITY_TYPE_REUNION     = 2;  // 中秋团圆
  GUILD_ACTIVITY_TYPE_TRIAL       = 3;  // 同道历练
}

// 数值与 go/guild/internal/activity 的 State 常量一致(服务端按值直接转换)。
enum GuildActivityState {
  GUILD_ACTIVITY_STATE_UNSPECIFIED = 0;
  GUILD_ACTIVITY_STATE_DISABLED    = 1;  // 配表关闭(界面显示"未开放")
  GUILD_ACTIVITY_STATE_UPCOMING    = 2;  // 档期未到
  GUILD_ACTIVITY_STATE_OPEN        = 3;
  GUILD_ACTIVITY_STATE_ENDED       = 4;  // 档期已过
}

enum GuildTrialLobbyState {
  GUILD_TRIAL_LOBBY_STATE_UNSPECIFIED = 0;
  GUILD_TRIAL_LOBBY_STATE_PENDING     = 1;  // 等待被邀请人确认
  GUILD_TRIAL_LOBBY_STATE_LAUNCHING   = 2;  // 全员已同意,正在开战(≤5s)
  GUILD_TRIAL_LOBBY_STATE_LAUNCHED    = 3;  // 已开战,battle_id 有效
  GUILD_TRIAL_LOBBY_STATE_ENDED       = 4;  // 已解散(拒绝 / 超时 / 开战失败),原因见 end_tip_id
}

// 视图里的一项奖励物品(由配表 reward_id 展开、按 item_id 合并后升序)。
message GuildRewardItem {
  uint32 item_id = 1;
  uint32 count   = 2;
}

// 同道历练的邀请房间(B6b)。历练改为邀请确认制:StartGuildTrial 只建房,
// 被邀请人亲自同意后才开战,任何成员都不能把别人强拉进战斗(06 §6.49 #2)。
message GuildTrialLobbyView {
  uint64 lobby_id                    = 1;
  uint64 initiator_player_id         = 2;
  repeated uint64 member_player_ids   = 3;  // 含发起人,发起人在首位
  repeated uint64 accepted_player_ids = 4;  // 已同意者(发起人建房即同意)
  GuildTrialLobbyState state         = 5;  // 服务端已按 expire / launch 截止时刻折算成有效状态,客户端不再自己判超时
  uint64 expire_at_ms                = 6;  // PENDING 截止时刻(服务端时钟,Unix 毫秒)
  uint64 battle_id                   = 7;  // LAUNCHED 时非 0
  // ENDED 原因:kGuildTrialInviteDeclined / kGuildTrialInviteExpired / kGuildTrialTeamInvalid /
  // kGuildTrialServiceBusy / kGuildActivityAlreadyClaimed / kGuildActivityNotOpen
  uint32 end_tip_id                  = 8;
  repeated string end_parameters     = 9;  // 原因 tip 的参数
}

// 一个活动的完整视图(配表行 + 帮会进度 + 本人状态)。客户端不加载配表,一切展示数据只能由服务端下发。
message GuildActivityView {
  uint32 activity_id            = 1;   // GuildActivity.id;写 RPC 必须回传它
  GuildActivityType type        = 2;
  string name                   = 3;
  GuildActivityState state      = 4;
  uint64 start_at_ms            = 5;   // start / end 都为 0 = 常开(仅开发配表)
  uint64 end_at_ms              = 6;
  uint32 min_guild_level        = 7;
  uint32 period_key             = 8;   // 当前游戏日 YYYYMMDD(个人次数键)
  uint64 next_reset_ms          = 9;   // 下一次游戏日切点(UTC+8 05:00),Unix 毫秒
  uint64 server_time_ms         = 10;  // 生成视图时的服务端时钟;客户端倒计时以它为基准,不信本机时钟
  uint64 personal_contribution  = 11;  // 每次参与(点灯 / 领奖 / 历练胜利)个人所得帮贡
  uint64 guild_funds            = 12;  // 灯会 / 团圆:本档期达阈值时发一次;历练:每个计资金的胜场发一次
  uint32 guild_threshold        = 13;  // 团圆为生效值(已套 GuildRule 兜底);历练为每日计资金胜场上限
  repeated GuildRewardItem reward_items = 14;
  uint32 daily_limit            = 15;  // 每人每游戏日可参与(得奖)次数
  uint32 my_used_count          = 16;  // 本人本游戏日已参与(得奖)次数
  uint32 progress               = 17;  // 灯会:本档期点灯人次;团圆:锁存前为当前合格在线人数,锁存后为 0;历练:今日已计资金胜场
  bool   threshold_reached      = 18;  // 灯会 / 团圆:本档期已达阈值(团圆一经达成即锁存,之后不必再凑人)
  bool   funds_granted          = 19;  // 灯会 / 团圆:本档期资金已发
  uint32 blocked_tip_id         = 20;  // 0 = 本人现在可参与(不含在线、战斗等瞬时条件);否则为第一个不满足项的 tip
  uint32 dungeon_id             = 21;  // 仅历练:DungeonTable id
  uint32 team_size_min          = 22;  // 仅历练:含发起人的人数范围
  uint32 team_size_max          = 23;
  uint64 my_trial_battle_id     = 24;  // 本人 battle:lock 指向的、仍为 STARTED 的历练对局;0 = 无
  // 本人本活动仍在发放中的物品奖励数(PENDING 指令行 + 历练待入队行)。背包满时奖励保持待发放、腾出空间后
  // 自动到账,所以这里只报"还在路上",不报错。
  uint32 my_pending_reward_count      = 25;
  uint32 my_pending_reason_tip_id     = 26;  // 最早一条待发放行最近一次的暂时原因(如 kAssetBagFull);0 = 正常排队
  uint32 my_last_reward_reject_tip_id = 27;  // 近 24h 最近一次永久拒绝(封禁 / 非法包)的原因;0 = 无
  uint32 join_min_hours         = 28;  // 参与所需最短入帮时长(GuildRule.activity_join_min_hours)
  uint32 guild_period_key       = 29;  // 帮会进度键:灯会 / 团圆 = 档期键;历练 = 游戏日键
  GuildTrialLobbyView trial_lobby = 30;  // 仅历练:本人所在、属于本活动的房间;无则不填
}

message GetGuildActivitiesRequest {}
message GetGuildActivitiesResponse {
  TipInfoMessage error_message         = 1;
  repeated GuildActivityView activities = 2;  // 每种类型至多一条,按 type 升序
}

message LightGuildLanternRequest {
  uint32 activity_id = 1;
}
message LightGuildLanternResponse {
  TipInfoMessage error_message = 1;
  GuildActivityView activity   = 2;  // 本活动提交后的视图
}

message ClaimGuildReunionRequest {
  uint32 activity_id = 1;
}
message ClaimGuildReunionResponse {
  TipInfoMessage error_message = 1;
  GuildActivityView activity   = 2;
}

// 建邀请房间(不直接开战);member_player_ids 须含发起人。
message StartGuildTrialRequest {
  uint32 activity_id                = 1;
  repeated uint64 member_player_ids = 2;
}
message StartGuildTrialResponse {
  TipInfoMessage error_message = 1;
  GuildActivityView activity   = 2;
}

// 被邀请人同意 / 拒绝;发起人 accept=false = 取消房间。
message RespondGuildTrialInviteRequest {
  uint64 lobby_id = 1;
  bool   accept   = 2;
}
message RespondGuildTrialInviteResponse {
  TipInfoMessage error_message = 1;
  GuildActivityView activity   = 2;
}

// ── Ranking ───────────────────────────────────────────────────

// Guild summary in ranking (without full member list)
message GuildRankEntry {
  uint64 guild_id       = 1;
  string name           = 2;
  uint64 leader_id      = 3;
  uint32 level          = 4;
  uint32 member_count   = 5;
  int64  score          = 6;  // Ranking score
  uint32 rank           = 7;  // Rank (1-based)
  string leader_name    = 8;  // 展示用(B3b 填,B2 恒空)
}

message UpdateGuildScoreRequest {
  uint64 guild_id = 1;
  int64  score    = 2;  // New ranking score
  uint32 zone_id  = 3;  // 调用方认为的区,只用于不一致日志;进哪张分区榜以 MySQL 里帮会的区为准(没有全服榜)
}

message UpdateGuildScoreResponse {
  TipInfoMessage error_message = 1;
}

// 帮会榜只有本区榜:区取请求者的归属区,没有全服榜(docs/design/gate-online-identity.md §9.6)。
message GetGuildRankRequest {
  reserved 3;  // 原 zone_id:服务端一律用归属区,上线前删除
  uint32 page      = 1;  // Page number (1-based)
  uint32 page_size = 2;  // Items per page, clamped to MaxRankPageSize
}

message GetGuildRankResponse {
  TipInfoMessage error_message = 1;
  repeated GuildRankEntry entries = 2;
  uint32 total_count = 3;  // Total guilds in ranking
  uint32 page        = 4;
  uint32 page_size   = 5;
}

// 查的是请求者归属区榜上的名次;别区的帮会在本区榜上不存在。
message GetGuildRankByGuildRequest {
  reserved 2;  // 原 zone_id:服务端一律用归属区,上线前删除
  uint64 guild_id = 1;
}

message GetGuildRankByGuildResponse {
  TipInfoMessage error_message = 1;
  GuildRankEntry entry = 2;  // Guild info in ranking (including rank)
}

// ── Service definition ─────────────────────────────────────────────────────

// 客户端经 gate → client_rpc_router 到达(只承诺路由服模式)。
// 身份与 zone 一律由服务端决定:客户端方法的请求体里没有玩家与区字段,只认会话与服务端归属;
// 唯一带 player_id 的是 GetPlayerGuild,只在不带会话的内部只读调用(mail 领附件读所在帮)时采信
// (docs/design/gate-online-identity.md §7.5、§9.6)。
// 本开关是服务级的,整个服务都登记在路由表;gate 上行白名单按方法方向收号,只收 REQUEST / ONE_WAY
// (docs/design/client-rpc-callback.md §7 R4)。UpdateGuildScore 标了 CLIENT_RPC_SERVER_ONLY,仍登记在路由表,
// 但不进 gate 上行白名单,客户端发上来在 gate 按非法包丢弃(计一次非法包、不回包,到不了路由服与 guild);
// 推送号(NotifyGuildChanged 等 CLIENT_RPC_PUSH)同理。
// guild 的入口准入按生成的客户端方法集合(shared/generated/clientrpc,与 gate 上行白名单同源)是第二道防线。
service GuildService {
  option (OptionIsClientProtocolService) = true;

  rpc CreateGuild (CreateGuildRequest) returns (CreateGuildResponse);
  rpc GetGuild (GetGuildRequest) returns (GetGuildResponse);
  rpc GetPlayerGuild (GetPlayerGuildRequest) returns (GetPlayerGuildResponse);
  rpc LeaveGuild (LeaveGuildRequest) returns (LeaveGuildResponse);
  rpc DisbandGuild (DisbandGuildRequest) returns (DisbandGuildResponse);
  rpc SetAnnouncement (SetAnnouncementRequest) returns (SetAnnouncementResponse);
  rpc RenameGuild (RenameGuildRequest) returns (RenameGuildResponse);

  // 成员管理(B2)
  rpc SetGuildMemberRole (SetGuildMemberRoleRequest) returns (SetGuildMemberRoleResponse);
  rpc KickGuildMember (KickGuildMemberRequest) returns (KickGuildMemberResponse);
  rpc TransferGuildLeader (TransferGuildLeaderRequest) returns (TransferGuildLeaderResponse);

  // 入帮申请(B2;取代直接入帮 JoinGuild)
  rpc ApplyJoinGuild (ApplyJoinGuildRequest) returns (ApplyJoinGuildResponse);
  rpc CancelGuildApplication (CancelGuildApplicationRequest) returns (CancelGuildApplicationResponse);
  rpc ListMyGuildApplications (ListMyGuildApplicationsRequest) returns (ListMyGuildApplicationsResponse);
  rpc ListGuildApplications (ListGuildApplicationsRequest) returns (ListGuildApplicationsResponse);
  rpc ReviewGuildApplication (ReviewGuildApplicationRequest) returns (ReviewGuildApplicationResponse);

  // 推送占位(B2):只为分配 message id;服务端实现恒返回 Empty。
  // 标了 CLIENT_RPC_PUSH:不进 gate 上行白名单,客户端经 gate 发这个 id 按非法包丢弃(client-rpc-callback.md §7 R4);
  // 也不在生成的客户端方法集合里,即使到了 guild 也会被入口准入 PermissionDenied(第二道防线)。
  rpc NotifyGuildChanged (GuildChangedS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }

  // Ranking
  rpc UpdateGuildScore (UpdateGuildScoreRequest) returns (UpdateGuildScoreResponse) { option (OptionClientRpcKind) = CLIENT_RPC_SERVER_ONLY; }
  rpc GetGuildRank (GetGuildRankRequest) returns (GetGuildRankResponse);
  rpc GetGuildRankByGuild (GetGuildRankByGuildRequest) returns (GetGuildRankByGuildResponse);

  // 帮会经济(B5)。五个都是客户端方法(在生成的客户端方法集合里);
  // 身份一律取会话,无会话的内部调用由 logic 拒绝。B5a 只落协议,实现在 B5b(此前回 Unimplemented)。
  rpc GetGuildDonateOptions (GetGuildDonateOptionsRequest) returns (GetGuildDonateOptionsResponse);
  rpc DonateToGuild (DonateToGuildRequest) returns (DonateToGuildResponse);
  rpc UpgradeGuild (UpgradeGuildRequest) returns (UpgradeGuildResponse);
  rpc GetGuildShop (GetGuildShopRequest) returns (GetGuildShopResponse);
  rpc BuyGuildShopGoods (BuyGuildShopGoodsRequest) returns (BuyGuildShopGoodsResponse);

  // 帮会活动(B6a 一次加齐五个)。都是客户端方法(在生成的客户端方法集合里);身份一律取会话。
  // 历练两个在 B6b 落地前固定回 kGuildActivityNotOpen(占好消息号,B6b 不再动协议与白名单)。
  rpc GetGuildActivities (GetGuildActivitiesRequest) returns (GetGuildActivitiesResponse);
  rpc LightGuildLantern (LightGuildLanternRequest) returns (LightGuildLanternResponse);
  rpc ClaimGuildReunion (ClaimGuildReunionRequest) returns (ClaimGuildReunionResponse);
  rpc StartGuildTrial (StartGuildTrialRequest) returns (StartGuildTrialResponse);
  rpc RespondGuildTrialInvite (RespondGuildTrialInviteRequest) returns (RespondGuildTrialInviteResponse);

  // 帮会全天帮战 V2(docs/design/guild-play-v2.md):无匹配池直打、三座灵脉、守旗阵、4 层奖励与江湖追杀令。
  rpc GetGuildWarOverview (GetGuildWarOverviewRequest) returns (GetGuildWarOverviewResponse);
  rpc SetGuildWarStance (SetGuildWarStanceRequest) returns (SetGuildWarStanceResponse);
  rpc RegisterGuildWarGarrison (RegisterGuildWarGarrisonRequest) returns (RegisterGuildWarGarrisonResponse);
  rpc StartGuildWarBattle (StartGuildWarBattleRequest) returns (StartGuildWarBattleResponse);
  rpc ClaimGuildWarMilestone (ClaimGuildWarMilestoneRequest) returns (ClaimGuildWarMilestoneResponse);
  rpc ClaimGuildWarDividend (ClaimGuildWarDividendRequest) returns (ClaimGuildWarDividendResponse);
  rpc PostGuildWarBounty (PostGuildWarBountyRequest) returns (PostGuildWarBountyResponse);
  rpc TrackGuildWarBounty (TrackGuildWarBountyRequest) returns (TrackGuildWarBountyResponse);
  rpc GetGuildWarBattleResult (GetGuildWarBattleResultRequest) returns (GetGuildWarBattleResultResponse);
  rpc NotifyGuildWarAlert (GuildWarAlertS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc InspectFieldWarTargets (InspectFieldWarTargetsRequest) returns (InspectFieldWarTargetsResponse);
  // 帮会全天帮战 V2.5 · 宿敌约战战书(2 小时全帮约战 + 实时比分)
  rpc IssueGuildWarFeud (IssueGuildWarFeudRequest) returns (IssueGuildWarFeudResponse);
  rpc RespondGuildWarFeud (RespondGuildWarFeudRequest) returns (RespondGuildWarFeudResponse);

  // 江湖恩怨·帮派生死状恩怨墙(docs/design/battle-jianghu-grudge-duel-bounty-v1.md §2.2):仅本帮成员可读。
  rpc GetGuildJianghuGrudgeWall (GetGuildJianghuGrudgeWallRequest) returns (GetGuildJianghuGrudgeWallResponse);
}

// ── 帮会全天帮战 V2(docs/design/guild-play-v2.md) ─────────────────────────────

enum GuildWarTargetKind {
  GUILD_WAR_TARGET_KIND_UNSPECIFIED = 0;
  GUILD_WAR_TARGET_KIND_QUICK_AUTO = 1;       // 一键快速开战:优先在线迎战活人,无活人 0 秒打守旗阵
  GUILD_WAR_TARGET_KIND_LIVE_PLAYER = 2;      // 界面直打在线挂牌/战区异帮活人
  GUILD_WAR_TARGET_KIND_LEYLINE_GARRISON = 3; // 攻打指定灵脉守旗阵或无主灵脉守卫
  GUILD_WAR_TARGET_KIND_BOUNTY = 4;           // 追杀榜直打挂牌中的追杀目标
  GUILD_WAR_TARGET_KIND_FIELD_PLAYER = 5;     // 野外三图现场点选任意异帮玩家直打
}

enum GuildWarBattleKind {
  GUILD_WAR_BATTLE_KIND_UNSPECIFIED = 0;
  GUILD_WAR_BATTLE_KIND_PANEL_PVP = 1;        // 帮会界面真人直打
  GUILD_WAR_BATTLE_KIND_GARRISON_SIEGE = 2;   // 守旗阵踢馆 / 灵脉守卫战(AI 托管)
  GUILD_WAR_BATTLE_KIND_FIELD_ROAD = 3;       // 野外路上任意异帮点战
  GUILD_WAR_BATTLE_KIND_LEYLINE_PVP = 4;      // 灵脉现场真人攻防
  GUILD_WAR_BATTLE_KIND_BOUNTY_HUNT = 5;      // 追杀令结单战
}

enum GuildWarBountyTier {
  GUILD_WAR_BOUNTY_TIER_UNSPECIFIED = 0;
  GUILD_WAR_BOUNTY_TIER_NORMAL_SILVER = 1;    // 5,000 银两(10% 税,4,500 入赏金池)
  GUILD_WAR_BOUNTY_TIER_HEAVY_SILVER = 2;     // 15,000 银两(10% 税,13,500 入赏金池)
  GUILD_WAR_BOUNTY_TIER_GUILD_PUBLIC = 3;     // 帮会公费(2,000 帮会资金,每日限 2 张)
}

enum GuildWarBountyStatus {
  GUILD_WAR_BOUNTY_STATUS_UNSPECIFIED = 0;
  GUILD_WAR_BOUNTY_STATUS_ESCROW_PENDING = 1; // 扣款确认中
  GUILD_WAR_BOUNTY_STATUS_ACTIVE = 2;         // 追杀中
  GUILD_WAR_BOUNTY_STATUS_COMPLETED = 3;      // 追杀成功已销单
  GUILD_WAR_BOUNTY_STATUS_TORN_BY_TARGET = 4; // 目标反杀 2 人撕单
  GUILD_WAR_BOUNTY_STATUS_EXPIRED = 5;        // 24h 到期,托管原路退回:银两档退发布者、公费档退发单帮;发布者暂时收不了时退款排队晚到,发布者角色已注销时银两退款作废
  GUILD_WAR_BOUNTY_STATUS_ESCROW_FAILED = 6;  // 预扣银两没扣成(被拒 / 中止 / 放弃),追杀令作废,没有托管可退
}

enum GuildWarAlertKind {
  GUILD_WAR_ALERT_KIND_UNSPECIFIED = 0;
  GUILD_WAR_ALERT_KIND_LEYLINE_UNDER_SIEGE = 1; // 本帮灵脉正被踢馆
  GUILD_WAR_ALERT_KIND_LEYLINE_CAPTURED = 2;    // 灵脉易主广播
  GUILD_WAR_ALERT_KIND_PURSUER_ENTERED_MAP = 3; // 追兵踏入目标所在野外图
  GUILD_WAR_ALERT_KIND_BOUNTY_RESOLVED = 4;     // 追杀雪耻或反杀撕单播报
  GUILD_WAR_ALERT_KIND_STREAK_BOUNTY = 5;       // 连胜悬赏挂牌或终结播报
  GUILD_WAR_ALERT_KIND_FEUD_CHALLENGE = 6;      // 收到异帮宿敌约战战书
  GUILD_WAR_ALERT_KIND_FEUD_STARTED = 7;        // 2 小时宿敌约战正式打响
  GUILD_WAR_ALERT_KIND_FEUD_ENDED = 8;          // 宿敌约战收官捷报
}

enum GuildWarFeudStatus {
  GUILD_WAR_FEUD_STATUS_UNSPECIFIED = 0;
  GUILD_WAR_FEUD_STATUS_PENDING = 1;            // 已下战书，待对方管理 15 分钟内应战
  GUILD_WAR_FEUD_STATUS_ACTIVE = 2;             // 2 小时宿敌约战激战中
  GUILD_WAR_FEUD_STATUS_FINISHED = 3;           // 约战已收官结算
  GUILD_WAR_FEUD_STATUS_DECLINED = 4;           // 对方婉拒或发起方撤回
  GUILD_WAR_FEUD_STATUS_EXPIRED = 5;            // 应战窗超时流局
}

message GuildWarFeudView {
  uint64 feud_id = 1;
  uint64 issuer_guild_id = 2;
  string issuer_guild_name = 3;
  uint64 target_guild_id = 4;
  string target_guild_name = 5;
  GuildWarFeudStatus status = 6;
  uint32 issuer_wins = 7;
  uint32 target_wins = 8;
  uint64 issuer_merit = 9;
  uint64 target_merit = 10;
  uint64 created_at_ms = 11;
  uint64 accept_deadline_ms = 12;
  uint64 started_at_ms = 13;
  uint64 ends_at_ms = 14;
  uint64 winner_guild_id = 15;
}

message GuildWarStanceView {
  bool   peace_mode = 1;
  uint64 peace_ready_at_ms = 2;
  bool   open_challenge = 3;
  uint64 protect_until_ms = 4;
  uint32 my_streak = 5;
  uint64 my_weekly_merit = 6;
  uint32 my_bounty_payouts_today = 7;
  uint32 my_bounty_payout_limit = 8;
  uint64 bounty_protect_until_ms = 9;
  uint64 next_garrison_refresh_ms = 10;
  uint64 next_track_at_ms = 11;
}

message GuildWarBannerHonorView {
  uint32 occupied_leyline_id = 1;
  repeated string weekly_mvps = 2;
  repeated string first_win_names = 3;
  uint64 first_win_at_ms = 4;
  repeated uint64 rival_guild_ids = 5;  // 本周宿敌帮会 ID 列表(交战 +20% 帮贡战功)
  repeated string rival_guild_names = 6;
}

message GuildWarLeylineView {
  uint32 leyline_id = 1;
  string name = 2;
  uint32 scene_config_id = 3;
  uint64 owner_guild_id = 4;
  string owner_guild_name = 5;
  uint32 banner_hp = 6;
  uint32 banner_max_hp = 7;
  uint64 shield_until_ms = 8;
  uint32 active_battle_count = 9;
  bool   under_siege = 10;
  uint64 featured_watch_battle_id = 11;
  bool   is_gold_leyline = 12;          // 当前小时 1.5x 金脉(全服自然聚堆热点)
  uint32 garrison_count = 13;           // 占领帮当前登记守旗槽数
  uint64 recommended_scene_id = 14;     // 该灵脉推荐聚人分线 scene_id(前往灵脉直接 EnterScene)
  uint32 recommended_channel_no = 15;   // 推荐分线号
}

message GuildWarMilestoneView {
  uint32 milestone_id = 1;
  uint64 required_merit = 2;
  uint64 guild_merit = 3;
  bool   claimed = 4;
  bool   claimable = 5;
  string reward_preview = 6;
