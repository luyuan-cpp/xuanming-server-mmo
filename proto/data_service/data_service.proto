syntax = "proto3";
package data_service;

import "google/protobuf/empty.proto";
// 本文件第一次 import 仓内 proto(docs/design/guild-phase2/07-rollback-fail-closed.md §7.11-U4)。
// 生成链能解析:Go 统一生成把整棵 proto/ 拷进暂存区、以其父目录为 --proto_path;C++ 以仓库根为
// --proto_path,且 asset_op_ledger_comp.pb.cc 早已登记在 cpp/generated/proto 工程里。
import "proto/common/component/asset_op_ledger_comp.proto";

option go_package = "data_service/data_service";

// DataService: Cross-realm transparent data proxy.
// Scene Server calls this service with player_id only;
// DataService internally routes to the player's home-realm Redis.
service DataService {
  // ── Player lifecycle data ─────────────────────────────────────
  rpc LoadPlayerData(LoadPlayerDataRequest) returns (LoadPlayerDataResponse) {}
  rpc SavePlayerData(SavePlayerDataRequest) returns (SavePlayerDataResponse) {}

  // ── Fine-grained key/value access ────────────────────────────
  rpc GetPlayerField(GetPlayerFieldRequest) returns (GetPlayerFieldResponse) {}
  rpc SetPlayerField(SetPlayerFieldRequest) returns (SetPlayerFieldResponse) {}

  // ── Player-zone mapping (registration / merge) ───────────────
  rpc RegisterPlayerZone(RegisterPlayerZoneRequest) returns (google.protobuf.Empty) {}
  rpc GetPlayerHomeZone(GetPlayerHomeZoneRequest) returns (GetPlayerHomeZoneResponse) {}
  rpc BatchGetPlayerHomeZone(BatchGetPlayerHomeZoneRequest) returns (BatchGetPlayerHomeZoneResponse) {}
  // Remap every player:zone:* mapping that points at source_zone_id to target_zone_id (server merge).
  rpc RemapHomeZoneForMerge(RemapHomeZoneForMergeRequest) returns (RemapHomeZoneForMergeResponse) {}

  // ── Cleanup / merge ──────────────────────────────────────────
  rpc DeletePlayerData(DeletePlayerDataRequest) returns (DeletePlayerDataResponse) {}

  // ── Snapshot / Rollback ──────────────────────────────────────
  rpc CreatePlayerSnapshot(CreatePlayerSnapshotRequest) returns (CreatePlayerSnapshotResponse) {}
  rpc ListPlayerSnapshots(ListPlayerSnapshotsRequest) returns (ListPlayerSnapshotsResponse) {}
  rpc GetPlayerSnapshotDiff(GetPlayerSnapshotDiffRequest) returns (GetPlayerSnapshotDiffResponse) {}
  rpc RollbackPlayer(RollbackPlayerRequest) returns (RollbackPlayerResponse) {}
  rpc RollbackZone(RollbackZoneRequest) returns (RollbackZoneResponse) {}
  rpc RollbackAll(RollbackAllRequest) returns (RollbackAllResponse) {}

  // ── Batch Recall / Anomaly / Event Snapshot ──────────────────
  rpc BatchRecallItems(BatchRecallItemsRequest) returns (BatchRecallItemsResponse) {}
  rpc QueryTransactionLog(QueryTransactionLogRequest) returns (QueryTransactionLogResponse) {}
  rpc CreateEventSnapshot(CreateEventSnapshotRequest) returns (CreateEventSnapshotResponse) {}

  // ── ID segment allocation (Leaf-segment) ────────────────────
  // C++ scene 没有 MySQL 客户端,永久 ID(item guid 等)的号段经这里从 id_segment 表领取。
  // 见 docs/design/node-id-overhaul-plan-20260908.md §6。
  rpc AllocateIdSegment(AllocateIdSegmentRequest) returns (AllocateIdSegmentResponse) {}

  // ── Player name registry(角色名全服唯一)──────────────────────
  // 真源是全局库 player_name 表(rollback_database_table.proto);zone 库
  // player_database.profile_component 与 AccountSimplePlayer.name 都只是副本。
  // 唯一性只有"全服一张表"才成立,所以登记必须过 data_service,不能各 zone 自己判重。
  // 设计见 docs/design/guild-phase2/03-names.md §3.1。
  rpc ReservePlayerName(ReservePlayerNameRequest) returns (ReservePlayerNameResponse) {}
  rpc ReleasePlayerName(ReleasePlayerNameRequest) returns (google.protobuf.Empty) {}
  rpc BatchGetPlayerName(BatchGetPlayerNameRequest) returns (BatchGetPlayerNameResponse) {}

  // ── 资产通道:已落盘账本只读 ─────────────────────────────────
  // 读 zone Redis 里 scene 写的 PlayerAllData blob 的 asset_op_ledger 子字段。只读、不鉴权(与
  // BatchGetPlayerName 同级)。实现 go/shared/assetop 的 LedgerReader。
  // 设计见 docs/design/guild-phase2/07-rollback-fail-closed.md §7.8。
  rpc GetPlayerAssetOpLedger(GetPlayerAssetOpLedgerRequest) returns (GetPlayerAssetOpLedgerResponse) {}
}

// ── Load / Save ────────────────────────────────────────────────

message LoadPlayerDataRequest {
  uint64 player_id = 1;
  repeated string fields = 2; // optional: specific fields to load; empty = all
}

message LoadPlayerDataResponse {
  uint32 error_code = 1;
  map<string, bytes> data = 2; // field_name → serialised value
  uint64 version = 3;          // optimistic-lock version
}

message SavePlayerDataRequest {
  uint64 player_id = 1;
  map<string, bytes> data = 2;
  uint64 expected_version = 3; // 0 = skip version check
}

message SavePlayerDataResponse {
  uint32 error_code = 1;
  uint64 new_version = 2;
}

// ── Field-level access ─────────────────────────────────────────

message GetPlayerFieldRequest {
  uint64 player_id = 1;
  string field = 2;
}

message GetPlayerFieldResponse {
  uint32 error_code = 1;
  bytes value = 2;
}

message SetPlayerFieldRequest {
  uint64 player_id = 1;
  string field = 2;
  bytes value = 3;
  uint64 expected_version = 4; // 0 = skip version check
}

message SetPlayerFieldResponse {
  uint32 error_code = 1;
  uint64 new_version = 2;
}

// ── Zone mapping ───────────────────────────────────────────────

message RegisterPlayerZoneRequest {
  uint64 player_id = 1;
  uint32 home_zone_id = 2;
  // 非 0:与 player:zone 同一段 Lua 原子钉上 player:placement:{id} = "{storage_id}:1"
  // (player-storage-placement.md §8.1);0 = 不钉落点(旧行为,有效落点 = home_zone)。
  uint32 storage_id = 3;
}

message GetPlayerHomeZoneRequest {
  uint64 player_id = 1;
}

message GetPlayerHomeZoneResponse {
  uint32 home_zone_id = 1;
  // home_zone 正处于合服围栏内(merge:in_progress:{home_zone_id} 存在),与 home_zone 同一段 Lua 读出。
  // scene_manager 据此拒绝进场:合服窗口里源区归属玩家不得从任何 zone 进场,否则存盘会写进已排空的
  // 源 topic(player-storage-placement.md §8 / §12 A16)。旧版 data_service 不填 = false。
  bool home_zone_merging = 2;
}

message BatchGetPlayerHomeZoneRequest {
  repeated uint64 player_ids = 1;
}

message BatchGetPlayerHomeZoneResponse {
  map<uint64, uint32> player_zone_map = 2; // player_id → home_zone_id
}

message RemapHomeZoneForMergeRequest {
  uint32 source_zone_id = 1;
  uint32 target_zone_id = 2;
  bool   dry_run = 3; // if true, only count; no SET
}

message RemapHomeZoneForMergeResponse {
  uint32 error_code = 1;
  uint32 players_matched = 2; // home_zone == source_zone_id
  uint32 players_updated = 3;  // same as matched unless dry_run (then 0)
}

// ── Delete / Cleanup ───────────────────────────────────────────

message DeletePlayerDataRequest {
  uint64 player_id = 1;
  bool   delete_zone_mapping = 2; // also remove player→zone mapping?
}

message DeletePlayerDataResponse {
  uint32 error_code = 1;
  uint32 keys_deleted = 2;
}

// ── Snapshot / Rollback ────────────────────────────────────────

enum SnapshotType {
  SNAPSHOT_MANUAL          = 0; // GM-triggered
  SNAPSHOT_PERIODIC        = 1; // Scheduled (cron)
  SNAPSHOT_PRE_MAINTENANCE = 2; // Before server maintenance
  SNAPSHOT_PRE_ROLLBACK    = 3; // Auto-created before any rollback
  SNAPSHOT_LOGIN           = 4; // On player login
}

enum RollbackScope {
  ROLLBACK_FULL    = 0; // Restore all fields
  ROLLBACK_PARTIAL = 1; // Restore selected fields only
}

// ── Snapshot management ────────────────────────────────────────

message CreatePlayerSnapshotRequest {
  uint64 player_id = 1;
  SnapshotType type = 2;
  string reason = 3;
  string operator = 4; // GM operator name
}

message CreatePlayerSnapshotResponse {
  uint32 error_code = 1;
  uint64 snapshot_id = 2;
  uint64 created_at = 3; // unix timestamp
}

message ListPlayerSnapshotsRequest {
  uint64 player_id = 1;
  uint64 before_time = 2; // only snapshots before this time (0 = no filter)
  uint32 limit = 3;       // max results (0 = default 20)
}

message SnapshotInfo {
  uint64 snapshot_id = 1;
  uint64 player_id = 2;
  uint32 zone_id = 3;
  SnapshotType type = 4;
  uint64 created_at = 5;
  string reason = 6;
  string operator = 7;
  uint32 data_size_bytes = 8;
  repeated string fields = 9; // field names in this snapshot
}

message ListPlayerSnapshotsResponse {
  uint32 error_code = 1;
  repeated SnapshotInfo snapshots = 2;
}

// ── Snapshot diff (soft rollback support) ──────────────────────

message GetPlayerSnapshotDiffRequest {
  uint64 player_id = 1;
  uint64 snapshot_id = 2;    // specific snapshot; 0 = use target_time
  uint64 target_time = 3;    // find latest snapshot before this time
}

message FieldDiff {
  string field = 1;
  bytes  snapshot_value = 2;  // value in snapshot (empty if field didn't exist)
  bytes  current_value = 3;   // current live value (empty if field doesn't exist)
  bool   only_in_snapshot = 4;
  bool   only_in_current = 5;
}

message GetPlayerSnapshotDiffResponse {
  uint32 error_code = 1;
  uint64 snapshot_id_used = 2;
  uint64 snapshot_time = 3;
  repeated FieldDiff diffs = 4; // only fields that differ
}

// ── Single player rollback ─────────────────────────────────────

// ── 回档的帮会资产闸(docs/design/guild-phase2/07-rollback-fail-closed.md)──────────
//
// 三个 Rollback* 在写任何玩家数据(含回档前安全快照)之前,先问 guild:"这些玩家自各自快照时刻以来,
// 有没有已经终结为已应用的帮会资产操作?"有 → 默认拒绝(error_code = RollbackGuildDivergence);问不到
// → 同样拒绝且放行无效(RollbackGuildCheckFailed)。错误码走本服务自己的码轴
// (go/data_service/internal/constants/error_codes.go),proto 里不写数字。
//
// 鉴权:三个 Rollback* 一律要求 metadata `x-admin-token`(07 §7.6.3 Q2 = ②),与 RemapHomeZoneForMerge
// 同一套 AdminToken;没配 AdminToken = 回档 RPC 整体停用。
//
// 放行(accept_guild_divergence = true)只覆盖"guild 答了,答案是有分歧 / 快照早于保留期证明不了",
// 不覆盖"guild 没答";且要求 reason 与 operator 非空。放行时每一条分歧先以 ERROR 日志写出
// (`[Rollback][GuildDivergence] accepted …`),供事后按 op_id 人工补偿。

// 回档被帮会资产分歧拦下(或被放行)时的摘要行。与 guildpb.GuildAssetOpBrief 同义;刻意不 import
// guild 的 proto,避免 data_service 的 C++/Go 生成闭包依赖 guild。kind / status 是 guild_db.proto 里
// GuildAssetOpKind / GuildAssetOpStatus 的数值(status 只会是 APPLIED 或 APPLIED_PARTIAL)。
message RollbackGuildDivergence {
  uint64 op_id = 1;
  uint64 player_id = 2;
  uint64 guild_id = 3;              // 发起时绑定的帮会;该帮会可能已解散
  uint32 kind = 4;
  uint32 status = 5;
  uint64 funds_delta = 6;
  uint64 contribution_delta = 7;
  uint64 updated_ms = 8;            // guild 侧终结时刻(毫秒,guild 的墙钟)
}

message RollbackPlayerRequest {
  uint64 player_id = 1;
  uint64 snapshot_id = 2;    // specific snapshot; 0 = use target_time
  uint64 target_time = 3;    // rollback to latest snapshot before this time
  RollbackScope scope = 4;
  repeated string fields = 5; // only for ROLLBACK_PARTIAL
  string reason = 6;
  string operator = 7;
  // true = 明知帮会资产有分歧(或快照早于帮会流水保留期、无法证明)仍要回档;要求 reason 与 operator 非空。
  // 默认 false = 有分歧即拒绝。ROLLBACK_PARTIAL 同样过闸。
  bool accept_guild_divergence = 8;
}

message RollbackPlayerResponse {
  uint32 error_code = 1;
  uint64 snapshot_id_used = 2;
  uint64 pre_rollback_snapshot_id = 3; // safety snapshot created before rollback
  repeated string fields_restored = 4;
  // 帮会资产分歧条数(已按逐玩家快照时刻过滤)。error_code = RollbackGuildDivergedAfterWrite 时是写后复查
  // 新发现的条数。
  uint32 guild_divergence_count = 5;
  repeated RollbackGuildDivergence guild_divergences = 6; // 按 op_id 升序的前 20 条
  // 快照早于帮会流水保留期、无法证明的玩家数(是谁看 `[Rollback][GuildDivergence] unprovable` 日志)。
  uint32 guild_unprovable_player_count = 7;
}

// ── Zone rollback ──────────────────────────────────────────────

message RollbackZoneRequest {
  uint32 zone_id = 1;
  uint64 target_time = 2;
  string reason = 3;
  string operator = 4;
  bool accept_guild_divergence = 5;  // 语义同 RollbackPlayerRequest.accept_guild_divergence
}

message RollbackZoneResponse {
  uint32 error_code = 1;
  uint32 players_affected = 2;
  uint32 players_failed = 3;
  repeated uint64 failed_player_ids = 4;
  // Compatibility name: players currently mapped to the zone but without a
  // snapshot at or before target_time. Candidates are reported only; no player
  // data, zone mapping, or account relationship is deleted.
  repeated uint64 orphan_player_ids = 5;
  uint32 orphans_cleaned = 6;
  uint32 guild_divergence_count = 7;                       // 语义同 RollbackPlayerResponse
  repeated RollbackGuildDivergence guild_divergences = 8;  // 按 op_id 升序的前 20 条
  uint32 guild_unprovable_player_count = 9;
}

// ── Full server rollback ───────────────────────────────────────

message RollbackAllRequest {
  uint64 target_time = 1;
  string reason = 2;
  string operator = 3;
  bool accept_guild_divergence = 4;  // 语义同 RollbackPlayerRequest.accept_guild_divergence
}

message RollbackAllResponse {
  uint32 error_code = 1;
  uint32 zones_processed = 2;
  uint32 players_affected = 3;
  uint32 players_failed = 4;
  uint32 guild_divergence_count = 5;                       // 全部 zone 合并检查一次(语义同 RollbackPlayerResponse)
  repeated RollbackGuildDivergence guild_divergences = 6;  // 按 op_id 升序的前 20 条
  uint32 guild_unprovable_player_count = 7;
}

// ── Batch Recall ───────────────────────────────────────────────

message BatchRecallItemsRequest {
  repeated uint64 player_ids = 1;      // target players (empty = use query filter)
  uint32 item_config_id = 2;           // 0 = currency recall, >0 = item recall
  uint32 currency_type = 3;            // only when item_config_id == 0
  uint64 time_start = 4;               // transaction time range start (unix sec)
  uint64 time_end = 5;                 // transaction time range end (unix sec)
  repeated uint32 tx_types = 6;        // filter by TransactionType (e.g. TX_SYSTEM_GRANT)
  string reason = 7;
  string operator = 8;
  bool dry_run = 9;                    // true = report only, don't modify
}

message RecallResult {
  uint64 player_id = 1;
  uint64 item_uuid = 2;                // 0 for currency recalls
  uint32 item_config_id = 3;
  uint64 amount = 4;                   // quantity or currency amount recalled
  bool   success = 5;
  string error_detail = 6;
}

message BatchRecallItemsResponse {
  uint32 error_code = 1;
  uint32 total_matched = 2;            // transactions matching the filter
  uint32 total_recalled = 3;           // actually recalled (0 if dry_run)
  uint32 total_failed = 4;
  repeated RecallResult results = 5;
}

// ── Transaction Log Query ──────────────────────────────────────
//
// PostCrashReplay usage (cross-server-rollback-gap-fixes.md §2.4 B2):
//   Scene calls this with player_id + time_start=last_save_ms +
//   tx_types=[TX_ITEM_AWARD, TX_QUEST_COMPLETE, TX_LEVEL_UP, TX_BUFF_GAIN]
//   to fetch the "additive" ops the player earned between persistence
//   checkpoint and crash. Each returned row's tx_id is the dedup key
//   the replay tool tracks so a second replay of the same window is a
//   no-op. See transaction_log.proto's TX_ITEM_AWARD..TX_BUFF_GAIN doc.

message QueryTransactionLogRequest {
  uint64 player_id = 1;                // 0 = query all players
  uint64 time_start = 2;
  uint64 time_end = 3;
  repeated uint32 tx_types = 4;        // empty = all types
  uint32 item_config_id = 5;           // 0 = no item filter
  uint32 currency_type = 6;            // 0 = no currency filter
  uint32 limit = 7;                    // max results (default 100)
  uint64 offset = 8;                   // pagination offset
}

message TransactionLogRow {
  uint64 tx_id = 1;
  uint64 timestamp = 2;
  uint32 tx_type = 3;
  uint64 from_player = 4;
  uint64 to_player = 5;
  uint64 item_uuid = 6;
  uint32 item_config_id = 7;
  uint32 item_quantity = 8;
  uint32 currency_type = 9;
  int64  currency_delta = 10;
  uint64 balance_before = 11;
  uint64 balance_after = 12;
  uint64 correlation_id = 13;
  string extra = 14;
}

message QueryTransactionLogResponse {
  uint32 error_code = 1;
  repeated TransactionLogRow rows = 2;
  uint32 total_count = 3;              // total matching rows (for pagination)
}

// ── Event-Triggered Snapshot ───────────────────────────────────

enum SnapshotEventType {
  EVENT_LARGE_TRANSACTION  = 0;  // Currency/item above threshold
  EVENT_RECHARGE           = 1;  // Real-money purchase
  EVENT_PRE_MAINTENANCE    = 2;  // Scheduled maintenance
  EVENT_LEVEL_UP           = 3;  // Milestone level-up
  EVENT_FIRST_LOGIN        = 4;  // First login of the day
}

message CreateEventSnapshotRequest {
  uint64 player_id = 1;
  SnapshotEventType event_type = 2;
  string event_detail = 3;             // human-readable context
  string operator = 4;
}

message CreateEventSnapshotResponse {
  uint32 error_code = 1;
  uint64 snapshot_id = 2;
  uint64 created_at = 3;
}

// ── ID segment allocation ──────────────────────────────────────

message AllocateIdSegmentRequest {
  string biz_tag = 1;   // id_segment.biz_tag:"player" / "guild" / "item"
  uint32 step = 2;      // 0 = 用表里配置的 step;>0 = 本次希望领取的段长(服务端可钳制)
}

// 返回半开区间 [lo, hi):调用方独占这一段,服务端一经返回即视为已发出、绝不重发。
// 调用方段内发号完毕(或进程退出)剩余的号直接作废,不回收。
// error_code 沿用本文件约定:0 = 成功,其余取值来自 data_service 自己的错误码轴
// (go/data_service/internal/constants/error_codes.go),不在 tip 码轴上,proto 里不写数字。
message AllocateIdSegmentResponse {
  uint32 error_code = 1;
  uint64 lo = 2;        // inclusive
  uint64 hi = 3;        // exclusive
}

// ── Player name registry ───────────────────────────────────────
//
// 三个 RPC 的共同前提:名字全服唯一,写入点只有建角(login),v1 不支持改名。
// 登记侧 fail-closed(登记不成功就不建角),读取侧 fail-open(拿不到名字照常放行)。

message ReservePlayerNameRequest {
  uint64 player_id = 1;
  // 调用方(login)已按 RoleNameRule 归一化并校验过;服务端再校验一遍,
  // 因为"规则包版本不一致"时必须以服务端为准,否则会写进唯一键一个不合规的名字。
  string name = 2;
}

// result 走自己的小常量轴(go/shared/playername),不是 tip 码、也不是 error_code:
//   0 = 成功(含"同 player_id 同名"的幂等重试)
//   1 = 已被别人占用
//   2 = 不合规(长度 / 字符集 / 敏感词)
// 常量定义在 go/shared/playername,data_service 与 login 共用,proto 里不写数字。
message ReservePlayerNameResponse {
  uint32 result = 1;
  // 仅 result=1 时填占用者 player_id。只给 login 判"是不是我自己丢了响应后的重试",
  // **不得下发客户端**:把占用者 id 透出去等于给了一条按名字查人的旁路。
  uint64 owner_player_id = 2;
}

// 条件删除:player_id 与 name 归一化后的 name_norm 都匹配才删 —— 只带 player_id 会
// 在"建角失败补偿"与"后来重登记了别的名字"撞车时删错行。
// 不带 x-admin-token:只删 created_ms 落在 PlayerName.ReleaseWindow 内的行(login 建角补偿);
// 带合法 x-admin-token:不限登记时间(运维按日志清孤儿)。
message ReleasePlayerNameRequest {
  uint64 player_id = 1;
  string name = 2;
}

// 一次最多 500 个 id;超了返回 InvalidArgument,不做截断 —— 静默截断会让调用方
// 把"没返回"当成"没登记",给玩家显示空名。
message BatchGetPlayerNameRequest {
  repeated uint64 player_ids = 1;
}

// 缺席的 id(未登记 / 已释放)不出现在 map 里,不是错误(与 BatchGetPlayerHomeZone 同口径)。
// 但 SQL 失败时不回部分结果:半份结果无法与"这些 id 确实没名字"区分。
message BatchGetPlayerNameResponse {
  map<uint64, string> names = 1;
}

// ── 资产通道:已落盘账本 ───────────────────────────────────────
//
// 语义(07 §7.8.2):读的是 `<PlayerAllData 全名>:{player_id}`(scene 存盘写的那份 blob),
// **不是** data_service 自己那套 player:{id}:<field>(那里没有账本)。不回退读 MySQL:MySQL
// 落库是异步 DBTask,可能更旧,会把已记账的 seq 误判为未见。
// 读不成一律走 gRPC 错误,**绝不**用 found=false 顶替:
//   - home_zone 查不到(无映射 / 映射库出错 / zone 未配 Redis)→ Unavailable;
//   - zone Redis 读失败 → Internal;blob 在但反序列化失败、或 player_id 与请求不符 → Internal;
//   - player_id = 0 → InvalidArgument。

message GetPlayerAssetOpLedgerRequest { uint64 player_id = 1; }

message GetPlayerAssetOpLedgerResponse {
  bool found = 1;                          // false = 该玩家在 zone Redis 里没有 blob(从未入场,或 Redis 丢数据)
  PlayerAssetOpLedgerComp ledger = 2;      // found=true 且玩家从未有过资产操作时为空消息(不是缺席)
}
