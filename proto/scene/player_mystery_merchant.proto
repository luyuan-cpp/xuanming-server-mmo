syntax = "proto3";
option go_package = "scene";

import "proto/db/proto_option.proto";
import "proto/common/base/tip.proto";
import "proto/common/base/empty.proto";
import "proto/common/component/base_comp.proto";
import "proto/scene/player_bag.proto";

option cc_generic_services = true;
option (OptionFileDefaultNode) = NODE_SCENE;

// 神秘商人:每隔一段时间(默认每个整点)随机出现在某张大世界地图的某一条分线上,停留一段时间
// (默认 30 分钟),出售一批打 6 / 5 / 4 折的商品。设计文档:docs/design/mystery-merchant.md。
//
// 分工:
//   - scene_manager 的领导者是唯一的调度者:决定「哪一轮、哪条线、站在哪、卖什么、各打几折」,
//     把整份结果写成下面的 MysteryMerchantState 放进 Redis;
//   - scene 节点只读这份记录:据此回答客户端的查询、校验并执行购买、向本节点的玩家发出现公告。
// 服务端没有 NPC 实体:商人的形象由客户端按 MysteryMerchantInfo 里的坐标自己画。

// 货架上的一件商品(一轮内不变)。
message MysteryMerchantShelfEntry
{
	uint32 goods_id = 1;         // MysteryMerchantGoods 表 id
	uint32 discount_percent = 2; // 折后价占原价的百分比:60 = 6 折、50 = 5 折、40 = 4 折
}

// 一轮神秘商人的权威记录。
//
// 它是 scene_manager 写进 Redis 的读模型:HASH `mystery_merchant:zone:{zone}`,field `state` 的值就是
// 本消息的序列化字节(另一个 field `v` 是 round_id * 1000 + revision,供写入脚本做「只进不退」的比较)。
// **跨语言契约**:Go 侧常量在 go/scene_manager/internal/logic/mystery_merchant.go,
// C++ 侧在 cpp/libs/services/scene/player/system/player_mystery_merchant.cpp,改一边必须改另一边。
//
// 本消息不直接发给客户端(客户端看到的是 MysteryMerchantInfo)。
message MysteryMerchantState
{
	uint32 zone_id = 1;
	// 轮次号 = 这一轮出现时刻的 Unix 秒(与 appear_at_ms / 1000 同值)。同一轮内不变。
	// 用出现时刻而不是「第几个间隔」:它只跟墙钟走,间隔不变时逐轮递增(版本号、限购记录都靠它)。
	// 运维改了出现间隔的那一刻,对齐点会变,新一轮的 round_id 可能比上一轮小(只这一次):
	// 写入方强制覆盖旧记录,scene 节点在手里那一轮结束后采纳(mystery_merchant_rules.h ShouldDiscardAsStale)。
	uint64 round_id = 2;
	// 同一轮内的换线次数,从 1 起。只有商人所在的线被回收 / 销毁时才会 +1(货架与限购不受影响)。
	uint32 revision = 3;
	uint32 scene_config_id = 4;  // 所在地图
	uint64 scene_id = 5;         // 所在分线的场景实例 id
	uint32 channel_no = 6;       // 线号(从 1 起),只用于展示
	uint32 spot_id = 7;          // MysteryMerchantSpot 表 id
	Vector3 position = 8;        // 站位(服务器坐标);写入时从 spot 表拷出,读侧不再查表
	uint64 appear_at_ms = 9;     // 出现时刻(含)
	uint64 expire_at_ms = 10;    // 离开时刻(不含);购买的最终截止线
	uint32 interval_seconds = 11; // 两次出现的间隔;读侧据此推算下一次出现时刻
	repeated MysteryMerchantShelfEntry shelf = 12; // 顺序即货架展示顺序;同一 goods_id 至多一条
	uint64 updated_at_ms = 13;   // 写入时刻(scene_manager 墙钟),仅排障用
}

// 一件商品对客户端可见的全部信息。客户端零配表:名称、图标、价格全部由服务器下发。
message MysteryMerchantGoodsInfo
{
	uint32 goods_id = 1;
	uint32 item_config_id = 2;   // 买到的物品(Item 表 id)
	uint32 item_count = 3;       // 每份含几个物品
	string name = 4;             // 商品表有名字用商品表的,否则用物品表的;都没有则为空,客户端不许编造
	string description = 5;
	string icon_key = 6;
	uint32 currency_type = 7;    // 结算货币:0 银两 / 1 灵石 / 2 绑定灵石(与 CurrencyComp.values 下标一致)
	uint64 original_price = 8;   // 每份原价
	uint64 price = 9;            // 每份折后价(购买时原样回传,见 BuyMysteryMerchantGoodsRequest.expected_price)
	uint32 discount_percent = 10; // 60 / 50 / 40
	uint32 limit_count = 11;     // 每人每轮限购份数
	uint32 bought_count = 12;    // 请求者本轮已买份数
}

// 神秘商人对客户端可见的状态。
message MysteryMerchantInfo
{
	// true = 此刻有商人在场(server_time_ms 落在 [appear_at_ms, expire_at_ms))。
	// false 时除 next_appear_at_ms / server_time_ms 外的字段都不可用。
	bool active = 1;
	uint64 round_id = 2;
	uint32 scene_config_id = 3;
	uint64 scene_id = 4;         // 商人所在分线;「前往」= EnterScene(scene_config_id, 这个 scene_id)
	uint32 channel_no = 5;       // 线号,只用于文案(「3 线」)
	Vector3 position = 6;        // 站位(服务器坐标)
	uint64 appear_at_ms = 7;
	uint64 expire_at_ms = 8;
	// 下一次出现的时刻;0 = 未知(服务端还没有任何一轮的记录)。active 时指下一轮。
	uint64 next_appear_at_ms = 9;
	uint64 server_time_ms = 10;  // 服务器当前时刻;客户端用它校正本地时钟来显示倒计时
	// true = 商人就在请求者当前所在的这条线上。
	// 广播公告(NotifyMysteryMerchant)对所有人发同一份,此字段恒为 false,客户端自己比 scene_id。
	bool here = 11;
	// 货架。仅 here 为 true 时下发(不在同一条线的玩家只知道「在几线」,看不到卖什么)。
	repeated MysteryMerchantGoodsInfo goods = 12;
	// 购买时允许离商人多远(服务器坐标单位);客户端据此决定走到多近再开店。
	uint32 interact_range = 13;
}

message GetMysteryMerchantInfoRequest {}

message GetMysteryMerchantInfoResponse
{
	TipInfoMessage error_message = 1;
	MysteryMerchantInfo info = 2;
}

message BuyMysteryMerchantGoodsRequest
{
	uint64 round_id = 1;       // 客户端看到的那一轮;与服务端当前轮不同 = 货架已换,拒绝
	uint32 goods_id = 2;
	uint32 count = 3;          // 买几份(1..99)
	// 以下四项是「报价防呆」:客户端原样回传它在货架上看到的这件商品,服务端现算的有任何一项不一致
	// (配表热更改了价格 / 货币 / 物品 / 每份数量),就拒绝并让客户端刷新 —— 玩家付出的和拿到的,
	// 永远是他点下购买时看到的那一份。
	uint64 expected_price = 4;          // 每份折后价
	uint32 expected_currency_type = 5;  // 结算货币
	uint32 expected_item_config_id = 6; // 买到的物品
	uint32 expected_item_count = 7;     // 每份含几个
	// 客户端幂等键(docs/design/client-request-idempotency.md)。玩家每点一次「购买」生成一个非 0 的随机 64 位数;
	// 这一次购买拿到明确结果(成功,或带 tip 的拒绝)之前的所有重发 —— 超时、断线重连、gate 回 1003、
	// 回包没到时玩家又点了同一件同样的份数 —— 都带同一个键,其余字段原样不变。
	// scene 按 (玩家, 键) 去重:同键同参数的重发不再买第二份,回当前货架与背包并标 replayed;同键换了参数
	// (另一件、另一个份数、另一轮或另一份报价)回 kInvalidParameter,不执行。0 = 旧客户端,不去重。
	// 键随玩家存档落盘(每名玩家最近 32 个,player_database.client_request_ledger):下线重登、换节点、scene 重启之后照样认得。
	uint64 client_request_id = 8;
}

message BuyMysteryMerchantGoodsResponse
{
	TipInfoMessage error_message = 1;
	// 以下两项仅成功时下发,客户端整体覆盖本地缓存。
	MysteryMerchantInfo info = 2; // 最新货架(已购数已更新)
	BagInfo bag = 3;              // 人物背包全量(含货币余额)
	// true = 这一次是重发(client_request_id 命中了已成交的那一笔):没有再买,info / bag 是此刻的状态。
	// 客户端按「首次那一笔已经成交」处理,不要再提示失败。
	bool replayed = 4;
}

// 出现公告:新的一轮开始、或同一轮内商人换了线时,scene 节点向本节点的全部在线玩家各推一次。
message MysteryMerchantNotify
{
	MysteryMerchantInfo info = 1; // 不带 goods、here 恒为 false
}

service SceneMysteryMerchantClientPlayer
{
	option (OptionIsPlayerService) = true;
	option (OptionIsClientProtocolService) = true;

	// 查询当前状态。纯读取:进场、收到公告、打开商店时各调一次。
	rpc GetMysteryMerchantInfo (GetMysteryMerchantInfoRequest) returns (GetMysteryMerchantInfoResponse);
	// 购买。必须与商人在同一条线、站在 interact_range 以内;战斗中、跨区冻结中拒绝。
	rpc BuyMysteryMerchantGoods (BuyMysteryMerchantGoodsRequest) returns (BuyMysteryMerchantGoodsResponse);
	// S2C 推送:出现公告。
	rpc NotifyMysteryMerchant (MysteryMerchantNotify) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
	// ── 以下只许在末尾追加:生成的 CallMethod 按 method index 分发 ──
}
