syntax = "proto3";
option go_package = "scene";

import "proto/db/proto_option.proto";
import "proto/common/base/tip.proto";
import "proto/common/base/empty.proto";

option cc_generic_services = true;
option (OptionFileDefaultNode) = NODE_SCENE;

// 角色形象永久收藏衣柜、形象卡永久解锁（10 元）与一小时免费试用（bit 位图存储）。
// 设计文档: docs/design/character-appearance-switch.md。
//
// 业务规则:
//   1. 每个角色持有永久已拥有形象集合(PlayerProfileComp.appearance_owned_bits + 当前永久形象 appearance_id):
//      已拥有的形象可随时 0 消耗免费切换;未拥有且配表允许兑换(card_unlockable=1)的形象,消耗 1 张角色形象卡
//      (Item 3402,官方商城售价 10 元 CNY)即可永久解锁入柜并切换,原永久形象同步保留在衣柜中。
//   2. 每个尚未拥有的可选形象每角色可免费试用 1 小时(AppearanceRule.trial_duration_seconds = 3600),
//      试用标记按 CharacterAppearance 表的 (cfg_bit_index) 紧凑位图存储在 PlayerProfileComp.appearance_trial_used_bits;
//      试用与永久拥有位图完全独立,试用绝不授予永久权。
//   3. 试用期间大世界 AOI 与战斗快照展示试用形象,不覆盖选角永久形象;支持提前取消或覆盖试用其他未试用形象,
//      到期后服务端自动还原永久形象并广播。

message CharacterAppearanceEntry
{
	uint32 config_id = 1;     // CharacterAppearance.id(永久主键)
	string appearance_id = 2; // 稳定资源外观 ID(如 "00_reference_topright_boy")
	string name = 3;          // 中文展示名
	uint32 sort_order = 4;    // 界面排序(升序)
	bool trial_used = 5;      // 由玩家 appearance_trial_used_bits 对应 bit 算出
	bool owned = 6;           // 是否已永久拥有(含当前永久形象;已拥有可 0 消耗免费切换)
	bool card_unlockable = 7; // 未拥有时是否允许消耗角色形象卡永久解锁(CharacterAppearance.card_unlockable)
	uint32 series_id = 8;     // 所属人物收藏系列 ID(AppearanceSeries.id,0 = 未归册;纯外观与叙事分册,零属性加成)
}

// 角色收藏系列图鉴进度(由服务端按权威拥有位图与配表实时派生,不单独落盘;纯外观印章与合篇故事,零属性加成)。
message CharacterAppearanceSeriesProgress
{
	uint32 series_id = 1;                    // AppearanceSeries.id
	string series_key = 2;                   // 稳定系列标识符(如 "lantern_courtyard")
	string name = 3;                         // 系列中文名
	uint32 sort_order = 4;                   // 图鉴展示排序(升序)
	uint32 owned_count = 5;                  // 该系列当前已永久拥有的现役成员数(试用不计入)
	uint32 total_count = 6;                  // 该系列当前启用的现役成员总数
	bool completed = 7;                      // total_count > 0 && owned_count >= total_count(集齐即点亮印章与解锁合篇)
	string completion_badge_name = 8;        // 集齐印章/铭牌展示名(纯装饰,无数值)
	string epilogue_title = 9;               // 集齐解锁合篇故事篇名(正文由客户端查 AppearanceSeries 本地配表)
	repeated string member_appearance_ids = 10; // 该系列当前启用的成员 appearance_id(按 sort_order 升序)
	uint32 missing_unlockable_count = 11;       // 该系列中当前缺失且可卡换解锁的成员数
	uint64 bundle_original_diamond = 12;        // 补齐缺失成员折前原价(真实灵石)
	uint64 bundle_discount_diamond = 13;        // Steam 式按缺口补齐折后总价(真实灵石，向上取整防 0 元)
	uint32 bundle_discount_bps = 14;            // 补齐折扣万分比（如 8500 = 8.5 折；0 = 不支持补齐）
	repeated string missing_appearance_ids = 15;// 当前缺失且可补齐的 appearance_id（排序去重，客户端下单原样回传做报价防呆）
}

message PlayerAppearanceInfo
{
	string permanent_appearance_id = 1;               // 当前永久使用的形象
	string active_appearance_id = 2;                  // 此刻实际生效展示的形象(试用中为试用形象,否则为永久形象)
	string trial_appearance_id = 3;                   // 当前正在试用的形象;空串 = 未试用
	uint64 trial_expires_at = 4;                      // 试用到期 Unix 秒;0 = 未试用
	uint64 server_now = 5;                            // 服务器墙钟 Unix 秒(客户端据此算倒计时,不信本机墙钟)
	uint32 card_item_id = 6;                          // 形象卡道具 ID(AppearanceRule.card_item_id, 默认 3402)
	uint32 card_item_count = 7;                       // 每次解锁消耗张数(默认 1)
	uint32 owned_card_count = 8;                      // 玩家人物背包当前可用形象卡张数(已扣预留)
	uint32 trial_duration_seconds = 9;                // 免费试用时长秒数(默认 3600)
	uint64 mall_sku_id = 10;                          // 商城对应 SKU ID(快捷跳转购买用)
	uint64 mall_price_fen = 11;                       // 商城标价(人民币分, 默认 1000 = 10 元)
	bytes trial_used_bits = 12;                       // 试用紧凑位图原样(低位在前,与 CharacterAppearance bit_index 对应)
	repeated CharacterAppearanceEntry appearances = 13; // 当前可用形象列表(按 sort_order 升序)
	bytes owned_bits = 14;                            // 已永久拥有紧凑位图(低位在前,含当前永久形象对应位,保留未知高位)
	repeated CharacterAppearanceSeriesProgress series_progress = 15; // 收藏系列图鉴进度(按 sort_order 升序,纯外观零属性)
	bytes pet_cosmetic_owned_bits = 16;               // 已永久拥有的灵宠幻化位图(低位在前,与 PetCosmetic bit_index 对应)
	repeated PetCosmeticEntry pet_cosmetics = 17;     // 当前开放的灵宠幻化目录(按 sort_order 升序,纯外观零数值)
	repeated PetEquippedCosmetic equipped_pet_cosmetics = 18; // 当前玩家各灵宠实例实际穿戴的幻化映射
	bytes skill_vfx_owned_bits = 19;                  // 已永久拥有的技能特效位图(低位在前,与 SkillVfxCosmetic bit_index 对应)
	repeated SkillVfxCosmeticEntry skill_vfx_cosmetics = 20; // 当前开放的技能特效目录(按 sort_order 升序,纯画面零数值)
	map<uint32, uint32> equipped_skill_vfx = 21;      // 当前实际生效的技能特效映射(skill_table_id -> SkillVfxCosmetic.id)
	uint32 light_card_trial_quota = 22;               // 仙途轻享卡本周额外随心试穿额度（未生效 0 / 生效 3）
	uint32 light_card_trial_used = 23;                // 仙途轻享卡本周已用随心试穿次数
	uint64 diamond_balance = 24;                      // 玩家当前真实充值灵石余额（系列补齐包仅扣真实灵石）
	uint64 bind_diamond_balance = 25;                 // 玩家当前绑定灵石余额（只供展示，不可抵扣系列补齐包）
	bytes showcase_cosmetic_owned_bits = 26;          // 已永久拥有的排面外观位图（CosmeticShowcase bit_index）
	repeated ShowcaseCosmeticEntry showcase_cosmetics = 27; // 当前开放的排面装饰目录（阵纹/入场/气泡/分享卡，纯视觉零数值）
	map<uint32, uint32> equipped_showcase_cosmetics = 28;   // 当前穿戴的排面装饰（slot_kind -> CosmeticShowcase.id）
	uint32 celebration_bind_gold_claimed = 29;        // 本周全城同乐已领绑定银两（上限 3000）
	uint32 celebration_bind_gold_weekly_cap = 30;     // 本周全城同乐绑定银两周上限（3000）
	uint32 cosmetic_gift_sent_this_week = 31;         // 本周已送出的好友纯外观/手记赠礼笔数
	uint32 cosmetic_gift_weekly_limit = 32;           // 每周好友赠礼上限（5）
}

// 战斗排面与社交外观目录项（阵纹/入场横幅/聊天气泡/分享卡底纹，纯视觉零数值）。
message ShowcaseCosmeticEntry
{
	uint32 config_id = 1;             // CosmeticShowcase.id
	string cosmetic_key = 2;
	uint32 slot_kind = 3;             // 1=脚底阵纹 2=入场/胜利横幅 3=聊天气泡 4=分享卡底纹 5=名片底纹
	string name = 4;
	string asset_key = 5;
	string secondary_asset_key = 6;
	uint32 sort_order = 7;
	bool owned = 8;
	uint32 card_item_id = 9;          // 3417 排面装饰券；0=仅专属获取
	uint32 card_item_count = 10;
	uint32 owned_card_count = 11;
	uint32 spirit_shop_goods_id = 12; // 默认 305
	string acquire_hint = 13;
	string desc = 14;
}

// 灵宠幻化目录项（纯外观表现，零战斗/成长属性）。
message PetCosmeticEntry
{
	uint32 config_id = 1;            // PetCosmetic.id(永久主键)
	string cosmetic_key = 2;         // 稳定外观标识键
	string name = 3;                 // 中文展示名
	uint32 target_pet_table_id = 4;  // 适用灵宠种类 ID(0 = 通用)
	uint32 visual_pet_table_id = 5;  // 表现复用灵宠种类 ID
	string visual_art_key = 6;       // 客户端外观资源键
	uint32 sort_order = 7;           // 展示排序(升序)
	bool owned = 8;                  // 是否已永久拥有
	uint64 mall_sku_id = 9;          // 官方商城永久衣柜对应 SKU ID(0 = 非直售/未上架)
	string acquire_hint = 10;        // 未拥有且未上架时展示的取得条件
	string desc = 11;                // 外观简述
	uint32 card_item_id = 12;        // 解锁券道具 ID(0 = 仅专属获取;非 0 = 允许耗券永久解锁)
	uint32 card_item_count = 13;     // 每次解锁消耗券张数
	uint32 owned_card_count = 14;    // 玩家背包当前可用解锁券张数(已扣预留)
	uint32 spirit_shop_goods_id = 15; // 灵石百宝阁快捷跳转商品 ID(0 = 非百宝阁售卖)
}

// 单只灵宠实例当前的权威幻化穿戴状态。
message PetEquippedCosmetic
{
	uint64 pet_id = 1;               // 灵宠实例永久 ID
	uint32 cosmetic_id = 2;          // 当前生效的 PetCosmetic.id(0 = 原形)
}

// 技能特效目录项（纯战斗画面表现，零数值/机制变更）。
message SkillVfxCosmeticEntry
{
	uint32 config_id = 1;            // SkillVfxCosmetic.id(永久主键)
	string vfx_key = 2;              // 稳定特效标识键
	string name = 3;                 // 中文展示名
	uint32 skill_table_id = 4;       // 适用技能 ID(Skill.id)
	string fx_id = 5;                // 主特效帧条 ID
	string projectile_fx_id = 6;     // 可选飞行段帧条 ID
	string telegraph_fx_id = 7;      // 可选预示段帧条 ID
	string tint_hex = 8;             // 可选色调覆盖(#RRGGBB)
	uint32 sort_order = 9;           // 展示排序(升序)
	bool owned = 10;                 // 是否已永久拥有
	uint64 mall_sku_id = 11;         // 官方商城永久衣柜对应 SKU ID(0 = 非直售/未上架)
	string acquire_hint = 12;        // 未拥有且未上架时展示的取得条件
	string desc = 13;                // 特效简述
	uint32 card_item_id = 14;        // 解锁券道具 ID(0 = 仅专属获取;非 0 = 允许耗券永久解锁)
	uint32 card_item_count = 15;     // 每次解锁消耗券张数
	uint32 owned_card_count = 16;    // 玩家背包当前可用解锁券张数(已扣预留)
	uint32 spirit_shop_goods_id = 17; // 灵石百宝阁快捷跳转商品 ID(0 = 非百宝阁售卖)
}

// 为指定灵宠实例穿戴或清除幻化外观（cosmetic_id = 0 表示恢复原形；未拥有且 expect_free_equip=false 且配表开放券解锁时原子耗券解锁并穿戴）。
message EquipPetCosmeticRequest
{
	uint64 client_request_id = 1;    // 必须非 0
	uint64 pet_id = 2;               // 目标灵宠实例永久 ID
	uint32 cosmetic_id = 3;          // 目标 PetCosmetic.id；0 = 恢复原形
	bool expect_free_equip = 4;      // true = 仅限已拥有免费穿戴(未拥有拒回,绝不误扣券); false = 允许耗券解锁并穿戴
}

message EquipPetCosmeticResponse
{
	TipInfoMessage error_message = 1;
	PlayerAppearanceInfo info = 2;
	uint64 pet_id = 3;
	uint32 equipped_cosmetic_id = 4;
	bool replayed = 5;
}

// 为指定技能启用或恢复默认特效（cosmetic_id = 0 表示恢复默认；未拥有且 expect_free_equip=false 且配表开放券解锁时原子耗券解锁并穿戴）。
message EquipSkillVfxRequest
{
	uint64 client_request_id = 1;    // 必须非 0
	uint32 skill_table_id = 2;       // 目标技能 ID(Skill.id)
	uint32 cosmetic_id = 3;          // 目标 SkillVfxCosmetic.id；0 = 恢复默认
	bool expect_free_equip = 4;      // true = 仅限已拥有免费启用(未拥有拒回,绝不误扣券); false = 允许耗券解锁并启用
}

message EquipSkillVfxResponse
{
	TipInfoMessage error_message = 1;
	PlayerAppearanceInfo info = 2;
	uint32 skill_table_id = 3;
	uint32 equipped_cosmetic_id = 4;
	bool replayed = 5;
}

message GetAppearanceInfoRequest {}

message GetAppearanceInfoResponse
{
	TipInfoMessage error_message = 1;
	PlayerAppearanceInfo info = 2;
}

// 切换永久形象(已拥有则 0 消耗免费切换;未拥有且允许卡换则消耗角色形象卡永久解锁并切换;带幂等键)。
message SwitchAppearanceRequest
{
	uint64 client_request_id = 1; // 必须非 0;同一次操作重发带同一键
	string appearance_id = 2;     // 目标形象稳定 ID
	bool expect_free_switch = 3;  // true = 仅限已拥有免费切换(未拥有则拒绝,绝不误扣形象卡); false = 允许扣卡永久解锁并切换
}

message SwitchAppearanceResponse
{
	TipInfoMessage error_message = 1;
	PlayerAppearanceInfo info = 2;
	bool replayed = 3;
}

// 开启 1 小时免费试用(每个形象每角色限 1 次,写入 bit 标记)。
message StartAppearanceTrialRequest
{
	uint64 client_request_id = 1; // 必须非 0
	string appearance_id = 2;     // 目标形象稳定 ID
}

message StartAppearanceTrialResponse
{
	TipInfoMessage error_message = 1;
	PlayerAppearanceInfo info = 2;
	bool replayed = 3;
}

// 手动提前结束当前试用,立即恢复永久形象。
message CancelAppearanceTrialRequest {}

message CancelAppearanceTrialResponse
{
	TipInfoMessage error_message = 1;
	PlayerAppearanceInfo info = 2;
}

// 场景内某玩家生效展示形象变更广播(发给本人 + AOI 视野内可见观察者)。
message ActorAppearanceChangedS2C
{
	uint64 entity = 1;           // 场景内不透明 actor 网络号(同 ActorCreateS2C.entity)
	uint64 player_id = 2;        // 玩家永久 ID(同 ActorCreateS2C.guid)
	string appearance_id = 3;    // 变更后的生效展示形象
	bool is_trial = 4;           // true = 正在试用, false = 永久形象
	uint64 trial_expires_at = 5; // 试用到期 Unix 秒(非试用为 0)
}

// 本人试用到期自动还原或状态变化推送(单播给本人)。
message AppearanceStateNotify
{
	PlayerAppearanceInfo info = 1;
	bool trial_expired = 2; // true = 因 1 小时试用到期自动还原
}

// Steam 式按缺口 8.5 折一键补齐收藏系列缺失角色（仅扣真实充值灵石，强制幂等键与报价防呆）。
message BuyAppearanceSeriesBundleRequest
{
	uint64 client_request_id = 1;                  // 必须非 0
	uint32 series_id = 2;                          // AppearanceSeries.id
	repeated string expected_missing_appearance_ids = 3; // 客户端预览的缺失角色 ID 列表（防并发已获导致多扣）
	uint64 expected_price_diamond = 4;             // 客户端预览的折后灵石总价
}

message BuyAppearanceSeriesBundleResponse
{
	TipInfoMessage error_message = 1;
	PlayerAppearanceInfo info = 2;
	bool replayed = 3;
	uint32 unlocked_count = 4;
	uint64 spent_diamond = 5;
}

// 为指定排面槽位穿戴或卸下外观（cosmetic_id=0 恢复默认；未拥有且 expect_free_equip=false 且允许券换时原子耗券解锁并穿戴）。
message EquipShowcaseCosmeticRequest
{
	uint64 client_request_id = 1; // 必须非 0
	uint32 slot_kind = 2;         // 1..5
	uint32 cosmetic_id = 3;       // 目标 CosmeticShowcase.id；0 = 卸下恢复默认
	bool expect_free_equip = 4;   // true = 仅限已拥有免费切换，绝不误扣券
}

message EquipShowcaseCosmeticResponse
{
	TipInfoMessage error_message = 1;
	PlayerAppearanceInfo info = 2;
	uint32 slot_kind = 3;
	uint32 equipped_cosmetic_id = 4;
	bool replayed = 5;
}

// 主城和平分线施放「全城同乐」社交气氛耗材（3418 天墉灵灯 / 3419 庆功烟花 / 3420 仙茶同乐席）。
message CastCityCelebrationRequest
{
	uint64 client_request_id = 1; // 必须非 0
	uint32 item_config_id = 2;    // 3418 / 3419 / 3420
}

message CityCelebrationView
{
	uint64 celebration_id = 1;
	uint64 caster_player_id = 2;
	string caster_name = 3;
	uint32 item_config_id = 4;
	uint32 bind_gold_reward = 5;
	uint64 started_at_sec = 6;
	uint64 expires_at_sec = 7;
	uint32 scene_config_id = 8;
	bool claimed_by_me = 9;
}

message CastCityCelebrationResponse
{
	TipInfoMessage error_message = 1;
	CityCelebrationView celebration = 2;
	bool replayed = 3;
}

// 同分线 >= 10 级玩家点击正在进行的全城同乐演出领取绑定银两（CURRENCY_TYPE_BIND_GOLD=3，每场限 1 次，周上限 3000）。
message ClaimCityCelebrationGiftRequest
{
	uint64 client_request_id = 1; // 必须非 0
	uint64 celebration_id = 2;
}

message ClaimCityCelebrationGiftResponse
{
	TipInfoMessage error_message = 1;
	uint64 celebration_id = 2;
	uint32 granted_bind_gold = 3;
	uint32 weekly_claimed_total = 4;
	uint32 weekly_cap = 5;
	bool replayed = 6;
}

// 全城同乐分线内广播（纯演出与路人领礼入口，绝不阻塞战斗）。
message CityCelebrationNotify
{
	CityCelebrationView celebration = 1;
	uint32 active_count_in_scene = 2;
}

// 好友赠礼目标类别白名单（严格仅限永久绑定纯外观与手记典藏，永久禁止材料/银两/月卡）。
enum CosmeticGiftTargetKind
{
	COSMETIC_GIFT_TARGET_UNSPECIFIED = 0;
	COSMETIC_GIFT_TARGET_CHARACTER = 1;     // target_id_str = CharacterAppearance.appearance_id
	COSMETIC_GIFT_TARGET_PET_COSMETIC = 2;  // target_id_u32 = PetCosmetic.id
	COSMETIC_GIFT_TARGET_SKILL_VFX = 3;     // target_id_u32 = SkillVfxCosmetic.id
	COSMETIC_GIFT_TARGET_TRAVEL_PASS = 4;   // target_id_u32 = TravelPassSeason.id
	COSMETIC_GIFT_TARGET_SHOWCASE = 5;      // target_id_u32 = CosmeticShowcase.id
}

// 好友间真实灵石纯外观/手记典藏赠礼（仅扣真实充值灵石，强制 7 天好友无拉黑、周上限 5 笔与报价防呆）。
message SendCosmeticGiftRequest
{
	uint64 client_request_id = 1;          // 必须非 0
	uint64 target_player_id = 2;           // 受赠好友 player_id
	CosmeticGiftTargetKind target_kind = 3;
	uint32 target_id_u32 = 4;
	string target_id_str = 5;
	uint64 expected_price_diamond = 6;     // 报价防呆：与服务端实时标价不一致即拒
}

message SendCosmeticGiftResponse
{
	TipInfoMessage error_message = 1;
	uint64 gift_order_id = 2;
	uint64 spent_diamond = 3;
	uint64 diamond_balance = 4;
	uint32 sent_this_week = 5;
	uint32 weekly_limit = 6;
	bool replayed = 7;
}

