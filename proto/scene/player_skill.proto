syntax = "proto3";
option go_package = "scene";

import "proto/db/proto_option.proto";
import "proto/common/base/tip.proto";
import "proto/common/component/base_comp.proto";
import "proto/common/base/empty.proto";
import "proto/common/component/player_skill_comp.proto";
import "proto/common/component/player_craft_comp.proto";
import "proto/common/component/actor_comp.proto";
import "proto/common/component/support_effects.proto";

option cc_generic_services = true;
option (OptionFileDefaultNode) = NODE_SCENE;

message ReleaseSkillRequest {
  uint32 skill_table_id = 1;
  uint64 target_id = 2; // 服务端下发的不透明 actor 网络号；0 表示无目标，不得填玩家 GUID 或本地 ECS 句柄。
  Vector3 position = 3;  
  Rotation rotation = 4;
}

message ReleaseSkillResponse {
  TipInfoMessage error_message = 1;  
}

message SkillInterruptedS2C
{
  uint64 entity = 1; // 施法者的不透明 actor 网络号。
  uint64 target_entity = 2; // 目标的不透明 actor 网络号；0 表示无目标。
  uint32 skill_table_id = 3;
  uint32 reason_code = 4;
  uint64 skill_id = 5;
}

message SkillUsedS2C
{
  uint64 entity = 1; // 施法者的不透明 actor 网络号。
  repeated uint64 target_entity = 2; // 目标的不透明 actor 网络号列表，不是玩家 GUID 或本地 ECS 句柄。
  uint32 skill_table_id = 3;
  Vector3 position = 4;
  uint64 time_stamp = 5;
}

// List skills request
message ListSkillsRequest {
  uint64 pet_id = 1; // 0 查人物；非 0 查会话所属宝宝的完整技能目录。
}

// List skills response
// 3..6 是四职业技能书(2026-10-19,docs/design/class-skills.md §4):服务端按当前职业现算的完整目录 + 角色等级 + 余额。
// skill_list 仍是"已拥有"的原样列表(robot / 旧客户端只读它);catalog 只列当前职业的职业技能,未学的也在里面(rank = 0)。
message ListSkillsResponse {
  TipInfoMessage error_message = 1;  
  PlayerSkillListComp skill_list = 2;
  repeated SkillCatalogEntry catalog = 3;   // 按 skill_table_id 升序
  uint32 player_level = 4;
  uint32 class_id = 5;
  uint64 currency_balance = 6;              // 修习货币余额(CurrencySystem kCurrencyGold,客户端称"银两")
  uint64 pet_id = 7; // 返回本次目录主体，防止切换人物/宝宝后的迟到响应覆盖界面。
  SkillLoadoutSnapshot loadout = 8; // 仅人物（pet_id == 0）填充：战法构筑 3 方案与槽位上限。
}

// 技能书的一行:配置表的展示投影 + 本角色的等级与可修习性。数值真源是 Skill 表与服务端规则,
// 客户端只展示,不得据此推算、也不回传这些派生值。
message SkillCatalogEntry {
  uint32 skill_table_id = 1;
  string name = 2;
  string description = 3;
  string icon_key = 4;            // Unity Resources 相对键,不带扩展名、不带 Assets/Resources/ 前缀(如 "UI/Skills/1101")
  uint32 class_id = 5;
  string category = 6;            // 表里的分类文案(主动 / 被动 …),只用于展示
  bool passive = 7;
  uint32 target_team = 8;         // 1 = 敌方,2 = 友方,3 = 自身(class_skill_rules.h TargetTeam)
  uint32 max_targets = 9;
  uint32 unlock_level = 10;
  uint32 max_rank = 11;
  uint32 rank = 12;               // 已学等级;0 = 未学
  uint32 rank_limit = 13;         // 按当前角色等级能修到的最高重;未到解锁等级为 0
  double mana_percent = 14;       // 耗蓝比例(0.03 = 最大法力的 3%,战斗内向上取整、至少 1)
  uint32 cooldown_rounds = 15;
  uint64 next_rank_cost = 16;     // 再修一重的价格;已满重为 0
  uint32 upgrade_block_tip_id = 17; // 0 = 现在可以修习一重;否则为不能修习的原因(tip 码,skill_error 段)
  uint32 duration_rounds = 18;    // 附带增益 / 减益的持续回合;没有为 0
  bool allow_dead_target = 19; // 仅复生类配置允许选择倒地单位，普通治疗不能选尸体。
  uint32 ability_kind = 20; // 1主动、2被动、3追击、4开场。
  uint32 caster_mask = 21; // 1人物、2宝宝；按施法者资格区分。
  uint32 action_tags = 22; // 攻击、治疗、辅助、障碍分类位，与 SkillTable 同源。
  SupportSkillPreview support_preview = 23; // 服务端中立参考值，缺省表示没有权威预览。
  uint32 season_id = 24; // 0 = 常驻永久技能；> 0 = 本季免费限定技能（无需消耗银两修习，随角色等级自动生效）。
  uint32 scroll_id = 25; // 所属永久制书卷宗（SkillScrollCraft.id；0 = 非卷宗制书技）。
  uint32 rarity_tier = 26; // 0 = 常规（90%）；1 = 稀世绝学（<=10%）。
  bool craft_unlock_required = 27; // true = 当前服开启了制书解锁门槛，需研习技能书后方可修习。
  bool unlocked_by_book = 28; // true = 已通过技能书永久解锁（跨赛季永不重置）。
  uint32 secondary_target_policy = 29; // 副目标定向策略：0随机/1物攻最高/2法攻最高/3气血数值最低/4气血比例最低/5物防最低/6法防最低/7排速最低。
  uint32 exclusive_group = 30; // 互斥组：0无互斥；>0同组战法不可同时装配。
  bool equipped = 31; // 在当前生效战法构筑方案中是否已装配生效（主动技默认随习得生效）。
}

// ── 人物战法构筑装配方案（1 开场 + 3 被动 + 1 追击，3 套流派方案一键切换）──

message SkillLoadoutSchemeInfo {
  uint32 scheme_id = 1;                   // 1..6（1..3 永久免费；4..6 仙途轻享卡生效期可用）
  uint32 role_tag = 2;                    // 0默认 / 1输出 / 2控场 / 3辅助
  repeated uint32 passive_skill_ids = 3;  // 已装配被动战法 ID（按升序）
  repeated uint32 pursuit_skill_ids = 4;  // 已装配追击战法 ID
  repeated uint32 opening_skill_ids = 5;  // 已装配开场战法 ID
}

message SkillLoadoutSnapshot {
  bool custom_enabled = 1;                // false = 尚未自定义保存（兼容全量非互斥模式）；true = 严格按当前方案生效
  uint32 active_scheme_id = 2;            // 当前选中流派方案号（1..6）
  uint64 state_version = 3;               // 乐观锁版本号
  uint32 max_passive_slots = 4;           // 被动槽位上限（固定 3）
  uint32 max_pursuit_slots = 5;           // 追击槽位上限（固定 1）
  uint32 max_opening_slots = 6;           // 开场槽位上限（固定 1）
  repeated SkillLoadoutSchemeInfo schemes = 7; // 已解锁方案及历史已存扩展方案（按 scheme_id 升序）
  string last_request_id = 8;
  uint32 unlocked_schemes = 9;            // 当前已解锁的方案槽位数（免费 3；仙途轻享卡生效 6）
  uint32 max_schemes = 10;                // 方案槽位总上限（含轻享卡扩展，固定 6）
}

message SaveSkillLoadoutRequest {
  uint32 scheme_id = 1;                   // 1..3
  uint32 role_tag = 2;                    // 0..3
  repeated uint32 passive_skill_ids = 3;
  repeated uint32 pursuit_skill_ids = 4;
  repeated uint32 opening_skill_ids = 5;
  uint64 state_version = 6;
  string request_id = 7;                  // 16-64字节ASCII标识
}

message SaveSkillLoadoutResponse {
  TipInfoMessage error_message = 1;
  ListSkillsResponse state = 2;           // 返回最新完整技能书与装配快照
  string request_id = 3;
  bool replayed = 4;
}

message SwitchSkillLoadoutRequest {
  uint32 scheme_id = 1;                   // 1..3
  uint64 state_version = 2;
  string request_id = 3;                  // 16-64字节ASCII标识
}

message SwitchSkillLoadoutResponse {
  TipInfoMessage error_message = 1;
  ListSkillsResponse state = 2;
  string request_id = 3;
  bool replayed = 4;
}

// ── 率土式分卷宗技能制书、轻量化手艺熟练度与主城原子代打（docs/design/equipment-quality-and-skill-crafting-v1.md）──

message SkillCraftMasterySnapshot {
  uint32 tier = 1;                 // 1学徒、2巧匠、3宗师。
  string tier_name = 2;
  uint32 exp = 3;
  uint32 next_tier_exp = 4;        // 满级宗师为 0。
  uint32 bonus_rate_bps = 5;       // 铸器：极品率（500/700/1000）；制卷：额外返页概率（0/500/1000）。
}

message SkillScrollCatalogInfo {
  uint32 scroll_id = 1;
  string name = 2;
  string description = 3;
  uint32 rarity_tier = 4;          // 0 常规卷宗 / 1 稀世绝学卷宗。
  uint32 fragment_item_id = 5;
  uint32 random_fragment_count = 6;
  uint64 random_gold_cost = 7;
  uint32 targeted_fragment_count = 8;
  uint64 targeted_gold_cost = 9;
  uint32 dismantle_fragment_count = 10;
  uint32 rare_scroll_item_id = 11;
  uint32 rare_scroll_count = 12;
  uint32 rare_ink_item_id = 13;
  uint32 rare_ink_count = 14;
  uint64 rare_gold_cost = 15;
  repeated uint32 skill_table_ids = 16; // 本卷宗包含的永久技能列表（按 ID 升序）。
}

message SkillCraftingStateSnapshot {
  uint64 scroll_craft_revision = 1;
  SkillCraftMasterySnapshot forge_mastery = 2;
  SkillCraftMasterySnapshot scroll_mastery = 3;
  repeated SkillScrollCatalogInfo scrolls = 4;
  repeated CraftedSkillBookEntry skill_books = 5;
  repeated uint32 book_unlocked_skill_ids = 6;
  uint64 gold_balance = 7;
  uint64 fragment_owned = 8;       // 3406 悟道残页持有量。
  uint64 rare_scroll_owned = 9;    // 3407 绝学残卷持有量。
  uint64 rare_ink_owned = 10;      // 3408 天工秘墨持有量。
  bool proxy_stall_open = 11;
  uint64 proxy_forge_fee_gold = 12;
  uint64 proxy_scroll_fee_gold = 13;
  bool craft_unlock_gate_enabled = 14; // true = 当前环境已开启“须制书解锁”门槛。
  // ── V2 名匠江湖口碑与零属性雅号 ──
  uint32 proxy_orders_completed = 15;
  uint32 supreme_forged_count = 16;
  uint32 rare_books_crafted_count = 17;
  uint32 master_showcase_tag = 18;
  uint32 equipped_craft_title_id = 19;
  repeated uint32 unlocked_craft_title_ids = 20;
  // ── V4/V5 藏经阁里程碑位图、情义免税代打与本人悬赏求书单 ──
  bool team_free_proxy = 21;
  bytes claimed_scroll_milestone_bits = 22;
  repeated SkillBookWantedOrderInfo my_wanted_orders = 23;
}

message GetSkillCraftingStateRequest {}
message GetSkillCraftingStateResponse {
  TipInfoMessage error_message = 1;
  SkillCraftingStateSnapshot state = 2;
}

message CraftSkillBookRequest {
  enum CraftMode {
    CRAFT_MODE_UNSPECIFIED = 0;
    RANDOM_REGULAR = 1;   // 常规卷宗随机拓印（20残页+50银两）。
    TARGETED_REGULAR = 2; // 常规卷宗定向拓印（40残页+100银两）。
    TARGETED_RARE = 3;    // 稀世卷宗双轨定向制书（1绝学残卷+1绑定天工秘墨+100银两）。
  }
  CraftMode mode = 1;
  uint32 scroll_id = 2;
  uint32 target_skill_table_id = 3; // TARGETED_REGULAR / TARGETED_RARE 必填；RANDOM_REGULAR 为 0。
  uint64 expected_revision = 4;
  uint64 client_request_id = 5;     // 必须非 0。
  uint64 proxy_master_player_id = 6; // 可选：主城宗师原子代制摊主 ID（0 = 亲自制书）。
}

message CraftSkillBookResponse {
  TipInfoMessage error_message = 1;
  uint64 client_request_id = 2;
  bool replayed = 3;
  CraftedSkillBookEntry crafted_book = 4;
  uint32 bonus_fragments_granted = 5; // 巧匠/宗师额外返还的绑定悟道残页数。
  SkillCraftingStateSnapshot state = 6;
}

message LearnSkillBookRequest {
  uint64 book_id = 1;
  uint64 pet_id = 2; // 0 = 人物研习；非 0 = 本人所属宝宝研习。
  uint64 expected_revision = 3;
  uint64 client_request_id = 4;
}

message LearnSkillBookResponse {
  TipInfoMessage error_message = 1;
  uint64 client_request_id = 2;
  bool replayed = 3;
  uint32 learned_skill_table_id = 4;
  SkillCraftingStateSnapshot state = 5;
}

message DismantleSkillBookRequest {
  uint64 book_id = 1;
  uint64 expected_revision = 2;
  uint64 client_request_id = 3;
}

message DismantleSkillBookResponse {
  TipInfoMessage error_message = 1;
  uint64 client_request_id = 2;
  bool replayed = 3;
  uint32 refunded_fragments = 4; // 固定返还 16 通用悟道残页（80%）。
  SkillCraftingStateSnapshot state = 5;
}

// 书架内未绑定常规技能书封卷入包（生成可交易 3414 封卷道籍实体道具，可上架聚宝斋/集市或面对面交易）。
message SealSkillBookRequest {
  uint64 book_id = 1;
  uint64 expected_revision = 2;
  uint64 client_request_id = 3;
}

message SealSkillBookResponse {
  TipInfoMessage error_message = 1;
  uint64 client_request_id = 2;
  bool replayed = 3;
  uint64 item_id = 4;        // 新生成的背包 3414 封卷道籍实例 ID。
  uint32 skill_table_id = 5; // 封存的 SkillTable.id。
  SkillCraftingStateSnapshot state = 6;
}

// 背包中的 3414 封卷道籍开卷回书架（继承原物品绑定性，防洗白）。
message UnsealSkillBookRequest {
  uint64 item_id = 1;
  uint64 expected_revision = 2;
  uint64 client_request_id = 3;
}

message UnsealSkillBookResponse {
  TipInfoMessage error_message = 1;
  uint64 client_request_id = 2;
  bool replayed = 3;
  CraftedSkillBookEntry unsealed_book = 4;
  SkillCraftingStateSnapshot state = 5;
}

message SetCraftProxyStallRequest {
  bool open = 1;
  uint64 proxy_forge_fee_gold = 2;  // 合法范围 50..100 银两（关摊时可填 0）。
  uint64 proxy_scroll_fee_gold = 3; // 合法范围 50..100 银两（关摊时可填 0）。
  uint32 master_showcase_tag = 4;   // V2 预设安全招牌枚举（0..4）。
  uint32 equipped_craft_title_id = 5; // V2 佩戴的已解锁零属性宗师雅号 ID（0..6）。
  bool team_free_proxy = 6;         // V5 true = 对同队玩家实行情义 0 费原子代打/代制。
}

message SetCraftProxyStallResponse {
  TipInfoMessage error_message = 1;
  SkillCraftingStateSnapshot state = 2;
}

message CraftProxyStallInfo {
  uint64 master_player_id = 1;
  string master_name = 2;
  uint32 forge_mastery_tier = 3;
  uint32 scroll_mastery_tier = 4;
  uint32 top_quality_rate_bps = 5;
  uint32 scroll_bonus_rate_bps = 6;
  uint64 proxy_forge_fee_gold = 7;
  uint64 proxy_scroll_fee_gold = 8;
  // ── V2 名匠江湖口碑与雅号 ──
  uint32 proxy_orders_completed = 9;
  uint32 supreme_forged_count = 10;
  uint32 rare_books_crafted_count = 11;
  uint32 master_showcase_tag = 12;
  uint32 equipped_craft_title_id = 13;
  // ── V5 同队情义零费代打 ──
  bool team_free_proxy = 14;
  bool viewer_gets_free_proxy = 15; // true = 当前查询者与该宗师同队且可享受 0 银两情义代打。
}

message ListCraftProxyStallsRequest {}
message ListCraftProxyStallsResponse {
  TipInfoMessage error_message = 1;
  repeated CraftProxyStallInfo stalls = 2;
}

// ── V4 典籍藏经阁：卷宗收集里程碑（小成 >=50% 领 20 绑定残页；圆满 100% 领 40 绑定残页） ──
message ClaimScrollCollectionMilestoneRequest {
  uint32 scroll_id = 1;
  uint32 milestone_tier = 2; // 1 = 小成(>=50%)，2 = 圆满(100%)。
  uint64 expected_revision = 3;
  uint64 client_request_id = 4;
}

message ClaimScrollCollectionMilestoneResponse {
  TipInfoMessage error_message = 1;
  uint64 client_request_id = 2;
  bool replayed = 3;
  uint32 rewarded_fragments = 4; // 实际发放的绑定 3406 悟道残页数（20 或 40）。
  SkillCraftingStateSnapshot state = 5;
}

// ── V4 批量安全拆页：一次拆解 1..20 本未学常规书（严禁稀世绝学），一次性返还绑定残页 ──
message BatchDismantleSkillBooksRequest {
  repeated uint64 book_ids = 1;
  uint64 expected_revision = 2;
  uint64 client_request_id = 3;
}

message BatchDismantleSkillBooksResponse {
  TipInfoMessage error_message = 1;
  uint64 client_request_id = 2;
  bool replayed = 3;
  uint32 dismantled_count = 4;
  uint32 refunded_fragments = 5;
  SkillCraftingStateSnapshot state = 6;
}

// ── V5 西市常规技能书悬赏求购板（原子托管非绑银两，零骗局交卷扣 5% 集市税） ──
message SkillBookWantedOrderInfo {
  uint64 order_id = 1;
  uint64 poster_player_id = 2;
  string poster_name = 3;
  uint32 skill_table_id = 4;
  string skill_name = 5;
  uint32 scroll_id = 6;
  string scroll_name = 7;
  bool require_master_signature = 8;
  uint64 reward_gold = 9;
  uint64 seller_net_gold = 10; // 扣 5% 集市银两税后揭榜卖家实得净银两。
  uint64 created_at_sec = 11;
}

message PostSkillBookWantedOrderRequest {
  uint32 skill_table_id = 1;
  bool require_master_signature = 2;
  uint64 reward_gold = 3; // 100..50000 非绑定银两。
  uint64 expected_revision = 4;
  uint64 client_request_id = 5;
}

message PostSkillBookWantedOrderResponse {
  TipInfoMessage error_message = 1;
  uint64 client_request_id = 2;
  bool replayed = 3;
  SkillBookWantedOrderInfo order = 4;
  SkillCraftingStateSnapshot state = 5;
}

message CancelSkillBookWantedOrderRequest {
  uint64 order_id = 1;
  uint64 expected_revision = 2;
  uint64 client_request_id = 3;
}

message CancelSkillBookWantedOrderResponse {
  TipInfoMessage error_message = 1;
  uint64 client_request_id = 2;
  bool replayed = 3;
  uint64 refunded_gold = 4;
  SkillCraftingStateSnapshot state = 5;
}

message ListSkillBookWantedOrdersRequest {
  uint32 filter_skill_table_id = 1; // 0 = 全部常规技能；非 0 = 仅看该技能求购。
  bool only_mine = 2;               // true = 仅看本人悬赏单。
}

message ListSkillBookWantedOrdersResponse {
  TipInfoMessage error_message = 1;
  repeated SkillBookWantedOrderInfo orders = 2;
}

message FulfillSkillBookWantedOrderRequest {
  uint64 poster_player_id = 1;
  uint64 order_id = 2;
  uint64 sealed_item_id = 3;    // 二选一：背包中匹配的未绑定 3414 封卷道籍实例 ID。
  uint64 bookshelf_book_id = 4; // 二选一：书架中匹配的未绑定常规技能书 book_id。
  uint64 expected_revision = 5;
  uint64 client_request_id = 6;
}

message FulfillSkillBookWantedOrderResponse {
  TipInfoMessage error_message = 1;
  uint64 client_request_id = 2;
  bool replayed = 3;
  uint64 order_id = 4;
  uint64 seller_net_gold = 5;
  SkillCraftingStateSnapshot state = 6;
}

// 修习(学习 = 从 0 升到 1)。修习者由服务端会话确定,请求里没有角色身份。
message UpgradeSkillRequest {
  uint32 skill_table_id = 1;
  uint32 expected_rank = 2;       // 客户端看到的当前等级;与服务端不一致整笔拒绝(旧请求重放不会再扣一次)
  uint32 count = 3;               // 只收 1 或 10;10 次在满重 / 等级上限 / 余额不足处提前停
  uint64 pet_id = 4; // 0 修习人物技能；非 0 必须属于当前会话玩家。
}

message UpgradeSkillResponse {
  TipInfoMessage error_message = 1; // 整笔拒绝(一重都没修成)时才填;部分成功不填
  ListSkillsResponse state = 2;     // 处理完之后的完整技能书(拒绝时也带,客户端据此整体替换)
  uint32 upgraded_count = 3;        // 实际修成的重数
  uint32 stop_tip_id = 4;           // 少于 count 时的停止原因(tip 码);按请求次数全部修成为 0
}

service SceneSkillClientPlayer { 
  option (OptionIsPlayerService) = true;
  option (OptionIsClientProtocolService) = true;
  
  rpc ReleaseSkill (ReleaseSkillRequest) returns (ReleaseSkillResponse);
  rpc NotifySkillUsed (SkillUsedS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc NotifySkillInterrupted (SkillInterruptedS2C) returns (Empty) { option (OptionClientRpcKind) = CLIENT_RPC_PUSH; }
  rpc ListSkills (ListSkillsRequest) returns (ListSkillsResponse);
  rpc UpgradeSkill (UpgradeSkillRequest) returns (UpgradeSkillResponse);
  // ── 以下按 method index 顺序追加，不可重排 ──
  rpc GetSkillCraftingState (GetSkillCraftingStateRequest) returns (GetSkillCraftingStateResponse);
  rpc CraftSkillBook (CraftSkillBookRequest) returns (CraftSkillBookResponse);
