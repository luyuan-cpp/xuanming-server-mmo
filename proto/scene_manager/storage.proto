syntax = "proto3";
package storage;

option go_package = "scene_manager/internal/storage";

// Redis: scene:{id}:info
message SceneInfo {
  uint64 scene_id = 1;
  uint64 scene_conf_id = 2;
  string node_id = 3;
  int64 create_time = 4;
  // 1 = main world, 2 = instance
  uint32 scene_type = 5;
}

// Redis: player:{id}:location
message PlayerLocation {
  uint64 scene_id = 1;
  string node_id = 2;
  uint64 update_time = 3;
  // Zone where the player's current scene resides.
  // Used on reconnect to determine cross-zone redirect need.
  uint32 zone_id = 4;
  // 写入这条 location 时的归属 epoch(与 sidecar 键 player:{id}:owner_epoch 同一 Lua 原子写入)。
  // node_id 为空且 owner_epoch != 0 表示「跨 zone 交接已放行、等待目标 zone 落点」,此时没有节点持有该玩家。
  uint64 owner_epoch = 5;
  // 只在「等待落点」里有意义:跨 zone 传送时玩家指定的目标地图(EnterSceneRequest.scene_conf_id)。
  // 第一条腿放行时写入,第二条腿(目标 zone 的 login 发来的 EnterScene 不带地图)由 scene_manager
  // 自己读出来选频道。不经票据 / login / 客户端转手,目标地图不会被持票者改写。0 = 默认大世界。
  uint64 pending_scene_conf_id = 6;
  // 路由 / 重定向投递失败后的回滚回执(GO-2 根治,cross-zone-scene-travel.md §12.8)。
  // - 只由 scene_manager 的回滚 Lua(owner_epoch.go luaRollbackPlayerPlacement)写入,值为被回滚那次
  //   铸造所凭的 handoff 标记原文 "{epoch}:{saved_at_ms}"。
  // - 与这条恢复出来的 location、INCR 之后的 owner_epoch 在同一段 Lua 里原子写入;此时本条的
  //   owner_epoch 字段等于 INCR 后的键值。
  // - 空值 = 不是回滚恢复出来的,或被回滚的那次铸造不凭标记。任何新落点都整条重写 location,回执随之
  //   消失;不铸造的回滚(keep)按原字节恢复,可能带回更早的回执 —— 那份回执对不上任何在途交接
  //   (每次交接的 saved_at_ms 都是新值),无害。
  // - 唯一消费者是源 scene 的 ResolveTravelOutcome:只认与自己本次交接标记原文逐字节相同的回执。
  //   其它读 location 的服务一律忽略这个字段。
  // - GO-3 不再需要新字段:改用持有进程在交接资格里自己盖的实例号判「已被顶替」(cross-zone-scene-travel.md §13.10)。
  //   以后要加字段从 10 起取(8 / 9 已被会话身份占用)。
  string rollback_receipt = 7;
  // 最近一次被 scene_manager 放行、并写入或确认这条 location 的 EnterScene 所代表的会话
  // (docs/design/scene-enter-chain-residuals.md §3 / §5)。0 / 0 = 无身份(旧版 scene_manager 写入或请求不带会话),
  // 所有比较退回旧行为。只由落点 Lua 写入;bump 回滚克隆旧值、keep 回滚恢复原字节,两者都保留身份。
  uint32 session_id = 8;
  uint64 login_generation = 9;
}
