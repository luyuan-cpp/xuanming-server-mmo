syntax = "proto3";
option go_package = "common/asset";

import "proto/common/base/tip.proto";
// 聚宝斋 P2 追加(AssetSnapshot 用):交易需要把"扣出/入账的那一份库存"原样回给调用方。
import "proto/common/component/player_pet_comp.proto";
import "proto/common/database/bag_quest_mail_data.proto";

// 通用资产通道(docs/design/guild-phase2/04-asset-channel.md §S4)。
//
// 一句话:Go 服务先在自己库里写一行"待办资产指令"并拿到该 (玩家, 流) 的递增 seq,
// 再按 player:{id}:location 找到玩家所在 scene,调 SceneNodeGrpc.AssetDebit /
// AssetCredit / AssetAbortDebit;scene 在 loop 线程同一次处理里做
// "查账本 → 闸门 → 改资产 → 记账本 → 触发存盘",账本与资产同在 player_database
// 一条记录里,一起落盘、一起丢(不变量 I3)。
//
// 枚举值带前缀:本文件无 package,C++ 枚举值落在全局作用域,裸 UNKNOWN/APPLIED
// 会与他处冲突。

// 流:每条流只有一个服务分配 seq(不变量 I6 流独占)。
enum AssetOpStream {
  ASSET_OP_STREAM_UNSPECIFIED = 0;
  ASSET_OP_STREAM_GUILD_DEBIT = 1;    // guild 独占
  ASSET_OP_STREAM_GUILD_CREDIT = 2;   // guild 独占
  ASSET_OP_STREAM_TRADE_DEBIT = 3;    // trade 独占(聚宝斋 P2)
  ASSET_OP_STREAM_TRADE_CREDIT = 4;   // trade 独占(聚宝斋 P2)
  ASSET_OP_STREAM_SYSTEM_CREDIT = 5;  // 预留:邮件/GM 发物(D1)
}

enum AssetOpOutcome {
  ASSET_OP_OUTCOME_UNKNOWN = 0;   // 请求畸形 / 验签失败 / 纪元过期 / 跳号过远 / seq 已滑出窗口:Go 告警,不终结
  ASSET_OP_OUTCOME_APPLIED = 1;   // 可能带 partial=true(部分发放)
  ASSET_OP_OUTCOME_REJECTED = 2;
  ASSET_OP_OUTCOME_RETRY = 3;     // 暂时条件(冻结/战斗/背包满/退出中),未记账
  ASSET_OP_OUTCOME_NOT_HERE = 4;  // 玩家不在本节点,未记账
}

message CurrencyAmount { uint32 currency_type = 1; uint64 amount = 2; }
message ItemGrant      { uint32 config_id = 1;     uint32 count = 2; }

// 资产包。已有字段号不改,扩展一律追加。
message AssetBundle {
  repeated CurrencyAmount currencies = 1;
  repeated ItemGrant items = 2;

  // ---- 聚宝斋 P2 追加(帮会不使用,帮会一律留空)----
  // 按 guid 全或无扣出:列出的每个 item_uuid 都必须在背包里、且属于**不可叠加**
  // 物品(装备一类,stack_size 恒为 1),少一个就整批拒,不做部分扣出。
  // 可叠加物品按 config_id + count 走 items 字段,不进本字段。
  repeated uint64 item_uuids = 3;
  // 按 guid 扣出/入账一只宝宝;0 = 不涉及宝宝。
  uint64 pet_id = 4;
}

// 调用方签名(§4.32,不变量 I9)。放在消息体里:生成的 gRPC 包装读不到 metadata
// (grpc_handler_gen.go:125 把 context 参数注释掉了)。
message AssetOpAuth {
  string caller = 1;          // "guild" / "trade";按流白名单
  uint64 timestamp_ms = 2;    // 签名时刻;与 scene 时钟偏差须 <= 300000
  string signature_hex = 3;   // lowercase-hex(HMAC-SHA256(调用方密钥, canonical))
}

message AssetOpRequest {
  uint64 player_id = 1;
  AssetOpStream stream = 2;
  uint64 seq = 3;             // 从 1 开始;0 非法
  uint64 correlation_id = 4;  // 进 transaction_log.correlation_id(帮会 = op_id)
  uint32 tx_type = 5;         // TransactionType 数值;按流白名单校验
  AssetBundle bundle = 6;     // AssetAbortDebit 不使用,但仍进签名串
  uint64 stream_epoch = 7;    // 流纪元(建 seq 行时的毫秒);0 非法
  AssetOpAuth auth = 8;
}

// ---- 聚宝斋 P2 追加(帮会不使用)----
// 这一次指令实际动到的那份库存,交易侧用它做"寄售快照 / 收货确认"的展示与对账。
// 帮会的 Debit/Credit 不填此字段(scene 只在 TRADE_* 流上填充)。
message AssetSnapshot {
  // 本次扣出(Debit)或入账(Credit)的物品条目,含 item_uuid / config_id /
  // stack_size,形状与 player_database.bag_component 里的一致。
  repeated ItemEntry items = 1;
  // 本次扣出/入账的宝宝(AssetBundle.pet_id 非 0 时填);未涉及时 pet_id 为 0。
  PetInstance pet = 2;
  // 本次扣出/入账的货币合计(单币种;多币种时取 AssetBundle.currencies 原样)。
  CurrencyAmount currency = 3;
}

message AssetOpResponse {
  AssetOpOutcome outcome = 1;
  TipInfoMessage reason = 2;  // asset_error 段码;无原因时 id=0
  bool durable = 3;           // 该 seq 的结局已在"最后一次成功写入 Redis 的玩家数据"里
  bool partial = 4;           // APPLIED 但只发放了一部分(reason=kAssetPartialApplied);Go 不做对侧入账,转人工补偿
  // ---- 聚宝斋 P2 追加字段从 5 起(帮会不使用)----
  AssetSnapshot snapshot = 5; // 交易库存快照;只在 TRADE_* 流上填充,其余流留空
}
