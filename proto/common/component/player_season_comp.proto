syntax = "proto3";
option go_package = "common/component";

// 角色单季赛季印（单槽赛季装备栏）持久状态（设计见 docs/design/season-skills-and-seal-design.md）。
// 换季不删除历史赛季记录（留作纪念与对账），运行期仅按当前激活赛季 ID 读取对应记录。
message PlayerSeasonSealRecord {
  uint32 season_id = 1;
  uint32 equipped_seal_id = 2; // 当前佩戴的赛季印 ID（0 = 使用当季默认赛季印）
  uint32 progress_points = 3;  // 本季累计进度点（战斗 + 快捷追赶，运行期按 SeasonRule.seal_max_points 夹取）
  uint32 battle_points = 4;    // 其中通过正规排位 / PVE 战斗获得的点数
  uint32 catchup_points = 5;   // 其中通过小额快捷追赶补齐的点数
  uint64 revision = 6;         // 本季写操作修订号（切印 / 追赶递增）
  uint32 last_term = 7;        // 最近写入本记录所属的全局赛季届号（0=历史遗留第1届，跨届自动重置当届12点轻进度）
}

// 五行幻境 V2·五行奇策轻肉鸽秘境持久化状态（6 关分岔探索，出图清空局内奇策，位图记录首通，AGENTS.md §13）。
message WuxingTowerCompState {
  uint32 week_key = 1;                         // 当前本周统计周键（周一 05:00 换周）
  bool run_active = 2;                         // 是否处于一轮进行中的幻境探索（跨周保留不清空）
  uint64 run_id = 3;                           // 单调递增轮次号，防重复结算与确定性抽策
  uint32 current_floor = 4;                    // 当前待推进关卡（V2 为 1..6；兼容旧字段名）
  uint32 run_total_rounds = 5;                 // 本轮已累计胜利回合数
  repeated uint32 active_sigil_ids = 6;        // 本轮已选局内奇策/符印（V2 为 601..643，出图清空）
  repeated uint32 pending_offer_sigil_ids = 7; // 待三选一奇策候选（非空时须先选策）
  uint32 weekly_cleared_mask = 8;              // 本周首通关位图（bit (node-1)）
  uint32 weekly_best_floor = 9;                // 本周本人流派最高通关关数
  uint32 weekly_best_rounds = 10;              // 本周本人流派全通最少总回合数（0=未全通）
  uint64 revision = 11;                        // 写操作递增修订号
  uint32 run_week_key = 12;                    // 本轮开局冻结周键（跨周不作废在途轮次，仅用于当周榜归属）
  uint32 realm_version = 13;                   // 2=V2 6关分岔奇策秘境（0/1=旧版）
  bool use_free_preset = 14;                   // true=公平 3x3 试炼模式；false=本人真实流派
  uint32 character_preset_id = 15;             // 公平模式所选人物预设（101..103）
  uint32 pet_preset_id = 16;                   // 公平模式所选灵宠预设（201..203）
  uint32 current_node_kind = 17;               // 当前节点类型（0=待选分岔,1=普通,2=精英,3=首领,4=奇遇,5=休整）
  uint32 pending_event_kind = 18;              // 待抉择非战斗事件（0=无,1=第2关奇遇,2=第4关休整）
  uint32 event_reroll_count = 19;              // 本轮休整寻策计数（参与确定性种子防 SL）
  uint32 best_rounds_self = 20;                // 历史个人最速全通回合（本人流派，跨周永久保留）
  uint32 best_rounds_preset = 21;              // 历史个人最速全通回合（公平试炼，跨周永久保留）
  uint32 weekly_best_floor_preset = 22;        // 本周公平试炼最高通关关数
  uint32 weekly_best_rounds_preset = 23;       // 本周公平试炼全通最少总回合数
  uint32 route_choice_mask = 24;               // 本轮分岔轨迹位图（bit0=第2关右路奇遇, bit1=第4关右路休整）
}

// 战报一键收藏的公开脱敏配装条（最多保存 12 条，仅存公开构筑摘要，不含私密属性概率）。
message SavedBattleBuildBookmark {
  uint64 bookmark_id = 1;
  string title = 2;
  uint64 source_battle_id = 3;
  uint64 source_player_id = 4;
  string source_player_name = 5;
  uint32 class_id = 6;
  uint32 formation_id = 7;
  uint32 season_seal_id = 8;
  uint32 active_pet_table_id = 9;
  string active_pet_name = 10;
  repeated uint32 skill_table_ids = 11;
  repeated uint32 wuxing_sigil_ids = 12;
  uint64 saved_at_ms = 13;
}

// 玩家赛季进度持久化组件（player_database 字段 30，GROWTH 分组）。
// records 下标不承载任何业务顺序语义（AGENTS.md §11.6），按 season_id 定位。
message PlayerSeasonComp {
  repeated PlayerSeasonSealRecord records = 1;
  uint32 equipped_formation_id = 2;               // 五行阵法（0=无/默认，1..5 免费切换）
  WuxingTowerCompState wuxing_tower = 3;          // 五行幻境周常爬塔状态
  repeated SavedBattleBuildBookmark saved_builds = 4; // 战报配装收藏夹（上限 12 条）
  repeated uint64 unlocked_honor_words = 5;           // 永久零数值纪念徽章动态位图（word=(season_id-1)/64, bit=(season_id-1)%64，永不收回）
  uint32 retro_honor_target_season_id = 6;            // 玩家手动指定的往季徽章追忆目标赛季 ID（0=自动顺延首个未解锁往季）
  map<uint32, uint32> retro_honor_progress = 7;       // 未解锁往季的免费追忆溢出点数（满 12 点解锁后删除）
}
