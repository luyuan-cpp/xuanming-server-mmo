syntax = "proto3";
option go_package = "common/component";

// 客户端请求幂等键账本(scene 侧玩家实体组件,**落库**)。设计文档:docs/design/client-request-idempotency.md。
//
// 客户端每发起一次扣资源的操作(强化、神秘商人购买、新建加点方案……)生成一个 client_request_id,
// 这一次操作的所有重发都带同一个键。scene 按 (玩家, 键) 去重:执行成功后在这里记一条;
// 之后同键同参数的请求不再执行,回首次结果并标 replayed;同键换了参数拒绝。
//
// 为什么落在玩家存档里(负责人 2026-11-06 定,取代 11-05 的「只放内存」):
//   - 它必须与 currency / bag_component 同在 player_database、同一次存盘提交(与 asset_op_ledger
//     是同一条不变量 I3):效果和记录要么一起在盘上,要么一起没有。只放内存的话,崩溃时可能出现
//     「效果已随上次存盘落库、记录却丢了」,重启后带原键的重发会再执行一次。
//   - 下线重登、跨节点迁移、回档时记录跟着存档走,不会因为换了实体就忘掉。
//
// 大小有界:每名玩家最多 32 条(client_request_ledger::kCapacity),满了淘汰 seq 最小的那条。
// 只有带键的请求执行成功才会写这里,所以它只随货币一起变,不会让存盘多写一行(放 WALLET 组)。

message ClientRequestRecord {
  uint64 key = 1;          // 客户端生成的幂等键,非 0
  // 请求种类(C++ ClientRequestKind 的值)。值随存档落盘,**不可重排、不可复用**;删掉的种类留空号。
  // 存 uint32 而不是 proto 枚举:本版本不认识的种类(新版本写进来的)要原样携带,不能被解析成 0。
  uint32 kind = 2;
  // 参数指纹:请求清掉 client_request_id 之后做确定性序列化,取 SHA-256 的前 16 字节。
  // 算法随存档落盘,是契约,不能改;同一个键的重发指纹不同 = 客户端把旧键用在了新操作上。
  bytes fingerprint = 3;
  // 账本内单调递增的序号(从 1 起),只用来挑最旧的那条淘汰。records 的下标不承载顺序(AGENTS §11.6)。
  uint64 seq = 4;
  // ── 首次结果里,重放要回、却从当前状态推不出来的部分。只对注释里的种类有意义,其余保持默认值 ──
  bool enhance_success = 5;      // 强化:那一次掷骰成没成
  uint32 enhance_level = 6;      // 强化:那一次之后的等级
  uint32 created_scheme_id = 7;  // 新建加点方案:那一次建出来的方案号
  uint64 equipment_item_id = 8; // 装备打造/装条：首次成功对应的实例。
  uint64 forge_revision = 9;    // 装备打造/装条：首次成功后的业务水位。
  uint64 material_reward_revision = 10; // 材料自选：首次成功后的独立水位。
  uint32 crafting_material_count = 11;  // 材料自选首次实际领取的打造材料数。
  uint32 enhancement_stone_count = 12;  // 材料自选首次实际领取的强化石数。
  uint32 season_catchup_points = 13;    // 赛季印追赶：首次实际补齐的进度点数。
  uint64 season_catchup_spent = 14;     // 赛季印追赶：首次实际扣除的货币数。
  uint32 trial_milestone_id = 15;            // 五行试炼志里程碑领取：首次领取的里程碑 ID。
  uint32 trial_milestone_sand_count = 16;    // 五行试炼志里程碑领取：首次发放的仅自用重铸砂数量。
  uint32 trial_milestone_voucher_count = 17; // 五行试炼志里程碑领取：首次发放的仅自用法宝拓印数量。
  uint64 redeemed_artifact_item_id = 18;     // 五行试炼志拓印兑换：首次产出的仅自用法宝实例 ID。
  uint32 redeemed_artifact_config_id = 19;   // 五行试炼志拓印兑换：首次兑换的法宝模板 ID。
  uint32 enhance_pity_count = 20;            // 强化：那一次操作后的保底累计次数（用于 +11 顶格概率强化的幂等重放）。
  uint32 crafting_tradable_count = 21;       // 材料自选：首次实际发放的可交易打造材料数。
  uint32 enhancement_tradable_count = 22;    // 材料自选：首次实际发放的可交易百炼石数。
  uint32 equipment_quality_tier = 23;        // 装备装条/打磨：首次操作后的品相档位（1..5）。
  uint32 equipment_polish_pity_count = 24;   // 装备打磨：首次操作后的单条保底计数。
  bool equipment_guaranteed_by_pity = 25;    // 装备打磨：首次是否由硬保底或定星符触发极品。
  uint64 crafted_skill_book_id = 26;         // 技能制书：首次产出的未学技能书 ID。
  uint32 crafted_skill_table_id = 27;        // 技能制书：首次产出的技能表 ID。
  uint64 scroll_craft_revision = 28;         // 技能制书/拆页：首次成功后的水位。
  uint32 scroll_bonus_fragments = 29;        // 技能制书/拆页：首次额外返还或拆解得到的残页数。
  uint32 travel_pass_claimed_count = 30;        // 游历手记领奖：首次实际领取的档位轨数。
  uint32 equip_loadout_unlocked_count = 31;     // 装备流派方案扩容：首次解锁后的已解锁套数（2..5）。
  uint32 equip_loadout_used_item_id = 32;       // 装备流派方案扩容：首次消耗的扩容符道具 ID（3413；未用符为 0）。
  uint64 equip_loadout_spent_bind_diamond = 33; // 装备流派方案扩容：首次消耗的绑定灵石数。
  uint64 equip_loadout_spent_diamond = 34;      // 装备流派方案扩容：首次消耗的非绑灵石数。
  uint32 rewarded_ad_currency_type = 35;        // 激励视频领奖：首次实际发放币种（默认 3 = 绑定银两）。
  uint64 rewarded_ad_amount = 36;               // 激励视频领奖：首次实际发放金额。
}

// 与战斗结算、物品和请求回执同属完整玩家存档。未领取余额不随周期重置。
// 来源防重由战斗收件箱的永久消费水位负责；不能用近期结果列表充当去重账本。
// 合入 A 两阶段模型（docs/design/season-pvp-pve-economy-unified-v1.md）：
//   阶段一（lifetime_earned < 660）：无每日/周清打卡，永久累计至 660 份，其中胜局基础含至多 60 份可交易；
//   阶段二（lifetime_earned >= 660）：开启 +11 顶格周平滑精进池，每周 100 份绑定自选（UTC+8 周一 05:00 重置）。
message EquipmentMaterialRewardLedger {
  uint64 day_starts_at_ms = 1; // 历史日账字段（旧档兼容保留）。
  uint32 earned_today = 2;
  uint64 available_units = 3;
  uint64 revision = 4; // 仅成功领取+1；入账不改变领取水位，饱和时拒绝领取，永不回退。
  uint32 lifetime_earned = 5;           // 阶段一永久首套累计已获份数（上限 660）。
  uint32 tradable_earned_total = 6;     // 阶段一累计已获可交易份数（上限 60）。
  uint64 available_tradable_units = 7;  // 当前未领余额中可交易子集（不变量：<= available_units）。
  uint64 week_starts_at_ms = 8;         // 阶段二当前游戏周起点（UTC+8 周一 05:00）。
  uint32 earned_this_week = 9;          // 阶段二本周已获份数（上限 150）。
  bool migrated_to_v2 = 10;             // 标记已进入两阶段新账（旧档历史余额全额保留为自用，不抵扣新 660）。
  uint32 stage1_tradable_confirmed = 11; // 已由 data_service 账号目录确认的本角色阶段一可交易份数（<= tradable_earned_total）。
}

// 战斗成长经济周账本（docs/planning/player-leveling-and-battle-economy-v1.md §2.2）：
// 与 CurrencyComp、EquipmentMaterialRewardLedger 同在 WALLET 存盘组，同帧原子提交。
// 每周 UTC+8 周一 05:00 重置（抗时钟回拨），控制常规战斗银两周软/硬上限，不截断经验升级。
message BattleEconomyLedger {
  uint64 week_starts_at_ms = 1;       // 当前游戏周起点（UTC+8 周一 05:00）
  uint64 battle_silver_this_week = 2; // 本周战斗结算累计实际入账银两
  uint64 battle_exp_this_week = 3;    // 本周战斗累计入账经验（统计监控用）
}

// 激励视频广告日账本与短效挂起会话（docs/design/rewarded-ad-system.md §3.4）：
// 与 CurrencyComp 同在 WALLET 存盘组原子提交，抗 30 秒全屏视频暂停心跳引发的断线重连丢会话。
message RewardedAdLedger {
  uint64 day_starts_at_ms = 1;         // 当前游戏日起点（UTC+8 05:00，抗时钟回拨）
  uint32 claimed_today = 2;            // 今日已成功领取次数
  uint64 last_claim_at_ms = 3;         // 最近一次成功领取时间（UTC 毫秒）
  uint64 total_claimed_lifetime = 4;   // 终身累计成功次数（仅监控统计）
  uint64 active_session_id = 5;        // 当前待核销的短效会话号（0 = 无）
  uint64 active_session_issued_ms = 6; // 会话签发时刻（UTC 毫秒）
  uint32 active_session_slot_id = 7;   // 会话对应广告位 ID
}

message ClientRequestLedgerComp {
  // 条目之间无序,按 key 找;同一个 key 至多一条。
  repeated ClientRequestRecord records = 1;
  // 下一条的 seq。0 = 从没记过(旧存档没有这个字段),按 1 处理。
  uint64 next_seq = 2;
  // 装备打造/首次装词条共用的持久防重水位，初始0，每次成功+1；饱和时拒绝。
  // 与records的淘汰序号独立；即使旧回执被淘汰，旧水位请求也不能再次扣料或造物。
  uint64 forge_revision = 3;
  EquipmentMaterialRewardLedger material_reward = 4;
  BattleEconomyLedger battle_economy = 5;
  RewardedAdLedger rewarded_ad = 6;
}
