syntax = "proto3";
package match;
option go_package = "match/match";
import "proto/db/proto_option.proto";
import "proto/match/match_network.proto";
import "proto/match/match_internal.proto";

message MatchNetworkProfile {
  string plan_id = 1;
  string session_binding = 2;
  repeated NetworkProbeReceipt receipts = 3;
  string owner_account = 4; // 服务端捕获的原会话账号；不得由当前目录反查补权。
  uint64 owner_revision = 5;
  // 写计划时服务端按会话轨道记下（x-release-track，取值 "stable" / "canary"；空串是本字段之前的档案，按 stable 算）。
  // 回执提交沿用计划里的值，不接受客户端自带。成局时全员都是 canary 才放 canary battle（docs/design/release-track-gray-canary.md §2.6）。
  string release_track = 6;
}

// 全局观战占用与匹配票在同P事务内互斥；时间到期不意味着远端已取消。
message MatchSpectatorRecord {
  option (OptionTableName) = "match_spectator";
  option (OptionPrimaryKey) = "player_id";
  option (OptionIndex) = "updated_ms,player_id;state,player_id";
  uint64 player_id = 1;
  string operation_id = 2;
  uint64 battle_id = 3;
  string target_endpoint = 4;
  string target_instance_id = 5;
  uint32 state = 6; // 1待Add、2已准入、3待Cancel、4结果未知、5已证实关闭。
  bytes request_payload = 7; // 原WatchBattleRequest，随机选场结果不能重选。
  string owner_account = 8;
  uint64 owner_revision = 9;
  bytes add_request = 10; // 原AddObserverRequest，截止/路由/op不可重写。
  uint64 updated_ms = 11;
  uint64 request_high = 12;
  uint64 request_low = 13;
}
message MatchSpectatorIntentRecord {
  option (OptionTableName) = "match_spectator_intent";
  option (OptionPrimaryKey) = "player_id,request_high,request_low";
  // 保留期清理按 (created_ms, 主键) 翻页读已关闭的行(authority.PurgeClosedSpectatorIntents)，只索引读，不扫全表。
  option (OptionIndex) = "state,created_ms,player_id,request_high,request_low";
  uint64 player_id = 1;
  uint64 request_high = 2;
  uint64 request_low = 3;
  bytes original = 4; // 永久原MatchSpectatorRecord，终态更新同当前占用事务提交。
  bytes request_payload = 5; // 选场前即持久原请求，旧handler不能成为新意图。
  string owner_account = 6;
  uint64 owner_revision = 7;
  uint32 state = 8; // 1尚未发出Add、2已绑定current原件、5已关闭；未知一律拒绝。
  uint32 close_tip = 9; // 关闭原因(客户端tip)，先写为准，同request_id重放回同一结论；0=未记录原因，state1必须为0。
  // eSpectateDelivery 数值(match_service.proto)。L1 / L2 观众不占 match_spectator 行，意图直接以 LOBBY 结案
  // (state=5、close_tip=0、delivery=2)；重放时重新做幂等的中继 / 广播准入并签新凭证(battle-spectate-tiered-fanout.md §15.6)。
  // 0 = 未以 LOBBY 结案(L0 观众与业务拒绝)。
  uint32 delivery = 10;
  // 意图创建时刻(TiDB 时钟，Unix 毫秒)。只供保留期清理：state=5、不是请求头、超过保留期的行分批删除。
  uint64 created_ms = 11;
}
message MatchSpectatorHeadRecord {
  option (OptionTableName) = "match_spectator_head";
  option (OptionPrimaryKey) = "player_id";
  uint64 player_id = 1;
  string operation_id = 2; // 最新已接纳请求UUID；切换head也必须先持P。
}

// 仅服务端存储契约；全部副本必须连接同一 TiDB 事务域。
message MatchNetworkProfileRecord {
  option (OptionTableName) = "match_network_profile";
  option (OptionPrimaryKey) = "player_id";
  uint64 player_id = 1;
  bytes payload = 2;
  uint64 expires_ms = 3;
}

message MatchAuthorityTicketRecord {
  option (OptionTableName) = "match_authority_ticket";
  option (OptionPrimaryKey) = "player_id";
  // 三条二级索引，各有读者（docs/design/global-match-hierarchical-pools.md §5.2.1 第 6 条、§6）：
  //   1. 按池读单排票（authority.SliceTickets 的整池段与跨机房段）：池 = (mode, config_id, team_size)，team_id=0 只取单排；
  //   2. 已建房票巡检（ReadyAfter，state=3 按入队序翻页）；
  //   3. 按首选机房读（机房段、子池段）；子池号在索引项上按 player_id 取模过滤。
  // 2026-11-12 删掉没有读者的 formation_id 与 (state,mode,team_id,enqueued_ms,player_id) 两条（§6），少维护两份索引项。
  option (OptionIndex) = "state,mode,config_id,team_size,team_id,enqueued_ms,player_id;state,enqueued_ms,player_id;state,mode,config_id,team_size,team_id,pool_region,enqueued_ms,player_id";
  uint64 player_id = 1;
  string ticket = 2;
  string request_id = 3;
  uint32 mode = 4;
  uint32 config_id = 5;
  uint32 team_size = 6;
  uint32 state = 7; // 1排队、2成局、3已建房、4终态；禁止 TTL 自动释放成局成员。
  uint64 enqueued_ms = 8;
  uint64 not_before_ms = 9;
  uint32 zone_id = 10;
  int64 rating_centi = 11;
  uint64 formation_id = 12;
  uint64 team_id = 13;
  bytes network_profile = 14;
  uint64 expires_ms = 15;
  uint32 selected_region = 16;
  // 17 原为 preferred_region：首选机房只给机房投影表用，投影随按池撮合退役（2026-11-05，未上线）。
  // 撮合与提交点都从 network_profile 现算（authority.PreferredRegion），不再持久化派生值。
  reserved 17;
  reserved "preferred_region";
  string owner_account = 18;
  uint64 owner_revision = 19;
  // 首选机房（docs/design/global-match-hierarchical-pools.md §5.2.1 热池拆分），只给撮合读页分段用，提交点不读。
  // 入队（Join）时按刚落库的 network_profile 现算（authority.PreferredRegion），探测刷新（CommitProfile）时同一条 UPDATE 重算，
  // 所以始终等于撮合与提交点现算的值。它不是上面退役的字段 17：那一列只喂两张投影表。
  // 只对 team_id=0 的单排票有意义（整队按 team_launch.pool_region 读）；Go 侧 ticketColumns 不读它，也不进占用判定。
  uint32 pool_region = 20;
  // 单排排位票冻结的 RankedMatchContext(仅单人预设/赛季/规则版本);非排位为空。
  bytes ranked_context = 21;
}

// 帮会历练的战斗入口占用(docs/design/horizontal-scale-logical-db.md §4)。写者都先持本库 role_fence 行锁，
// 和入场、冻结同一个串行点。到期视为空闲；开局之后留到 guild 释放或到期，票终局之后结算之前也不放新入场。
message MatchRoleOccupancyRecord {
  option (OptionTableName) = "match_role_occupancy";
  option (OptionPrimaryKey) = "player_id";
  option (OptionIndex) = "owner_kind,owner_id,player_id";
  uint64 player_id = 1;
  uint32 owner_kind = 2;  // 1 帮会历练大厅
  uint64 owner_id = 3;    // 大厅号
  string account = 4;
  uint64 owner_revision = 5;
  uint64 expires_ms = 6;  // match 库的时钟
}

// 不能随当前票据覆盖或过期：否则旧 Join 在新一轮结束后重放会复活。
message MatchJoinIntentRecord {
  option (OptionTableName) = "match_join_intent";
  option (OptionPrimaryKey) = "player_id,request_high,request_low";
  option (OptionIndex) = "state,player_id,request_high,request_low";
  uint64 player_id = 1;
  string request_id = 2;
  bytes ticket_record = 3; // 首次已接纳的 MatchAuthorityTicketRecord；先撤销的未知请求为空。
  bool cancelled = 4;
  uint64 request_high = 5; // UUID 的前64位原值；整数复合主键符合 D-14，不截断哈希。
  uint64 request_low = 6;
  string owner_account = 7;
  uint64 owner_revision = 8;
  bytes spectator_exit = 9; // 首次Join在同P内捕获的原观战；空表示当时没有观战。
  bool exit_prepared = 10; // 原件已固定；禁止重放现场捕获当前观战。
  bytes request_payload = 11; // 原JoinQueueRequest规范字节，重试不可改探测/参数。
  uint32 state = 12; // 1等待原观战退出、2已提交原票、3已取消；仅1进入恢复游标。
}

// 整队/活动/挑战接受与全组占用、成局行在同一 SQL 事务提交。
message MatchDirectIntentRecord {
  option (OptionTableName) = "match_direct_intent";
  option (OptionPrimaryKey) = "kind,owner_id,request_high,request_low";
  option (OptionIndex) = "exit_prepared,cancelled,battle_id,kind,owner_id,request_high,request_low";
  uint32 kind = 1; // 1整队、2活动、3挑战。
  uint64 owner_id = 2; // 整队的发起玩家、活动的帮会、挑战的应战玩家。
  uint64 request_high = 3;
  uint64 request_low = 4;
  bytes payload = 5; // 无随机节点/票号的规范业务载荷，重试逐字节核对。
  uint64 battle_id = 6;
  bool cancelled = 7; // 仅活动kind=2：与成局共用原意图主键锁的持久不再开战墓碑。
  string owner_account = 8; // kind1/3的原客户端actor；kind2由Guild永久launch原件授权。
  uint64 owner_revision = 9;
  repeated MatchSpectatorRecord spectator_exits = 10;
  bool exit_prepared = 11;
  bytes start_original = 12; // MatchDirectStartOriginal；待提交时不能用当前资料替换。
}
message MatchDirectStartOriginal {
  MatchFormationRecord formation = 1;
  repeated MatchAuthorityTicketRecord tickets = 2;
}

// 邀请正文是SQL原件，Redis仅推送/缓存；新邀请在全员P锁下捕获对端，重放不换主。
message MatchChallengeInvitationRecord {
  option (OptionTableName) = "match_challenge_invitation";
  option (OptionPrimaryKey) = "challenge_id";
  option (OptionIndex) = "target_player_id,state,expires_ms,challenge_id;challenger_player_id,state,expires_ms,challenge_id";
  option (OptionTiDBNonclusteredPK) = true;
  option (OptionTiDBShardRowIDBits) = 4;
  option (OptionTiDBPreSplitRegions) = 4;
  uint64 challenge_id = 1;
  uint64 challenger_player_id = 2;
  uint64 target_player_id = 3;
  uint32 config_id = 4;
  string challenger_account = 5;
  uint64 challenger_revision = 6;
  string target_account = 7;
  uint64 target_revision = 8;
  uint64 created_ms = 9;
  uint64 expires_ms = 10;
  uint32 state = 11; // 1待应答、2已成局、3已拒绝、4已接受待退出、5已安全关闭；原件不删除。
  uint64 battle_id = 12;
  bytes custom_rules_payload = 13; // 确定性序列化 CustomDuelRules（默认空=常规切磋）
}

// 同事务域全部副本使用相同撮合策略；新进程不能覆盖已准入策略。
message MatchGlobalPolicyRecord {
  option (OptionTableName) = "match_global_policy";
  option (OptionPrimaryKey) = "policy_id";
  uint32 policy_id = 1;
  bytes contract_digest = 2;
}

message MatchFormationMember {
  uint64 player_id = 1;
  string ticket = 2;
  uint32 team_index = 3; // PVP_TEAM成局时持久化0/1分边，恢复不能重新排序或拆散原队伍。
  // 整队开局的发起人(该队队长)。成局时由撮合按 TeamLaunchRecord.actor_id 写入,单排成员恒为 false;
  // 建房时每一方的战斗剧本按队长的选用,没有队长按阵位第一的成员(docs/design/battle-script.md §5.2)。
  bool captain = 4;
}
message MatchFormationRecord {
  option (OptionTableName) = "match_formation";
  option (OptionPrimaryKey) = "battle_id";
  option (OptionIndex) = "state,retry_at_ms;ranked_season_id,state,battle_id";
  uint64 battle_id = 1;
  string operation_id = 2;
  uint32 state = 3; // 1待备战、2已持久化创建请求、3结果未知、4成功、5已安全中止。
  uint32 physical_region = 4;
  uint32 target_node_id = 5;
  string target_instance_id = 6;
  string target_endpoint = 7;
  uint32 mode = 8;
  uint32 config_id = 9;
  repeated MatchFormationMember members = 10;
  bytes create_request = 11;
  uint64 created_ms = 12;
  uint64 deadline_ms = 13;
  uint64 retry_at_ms = 14;
  bytes activity_context = 15; // 备战前崩溃恢复也保留活动归属，内容为BattleActivityContext。
  bool requeue_on_failure = 16; // 排队失败保持原票号与最早等待；整队/点名不能拆散回队。
  repeated MatchPreparedEndpoint prepared = 17; // 备战时真实端点；恢复取消不能重新猜玩家当前所在场景。
  uint32 outcome_protocol_version = 18;
  uint32 preflight_supported_version = 19;
  string preflight_instance_id = 20; // 发任何Create之前与完整version1正文同事务保存。
  uint32 adopted_outcome_protocol_version = 21; // 独立保存真实Create/PRESENT回执，不能由能力推算。
  bool adopted_outcome_observed = 22; // 未回包与原身份明确回显0不同；首个实际回执永久不变。
  // 这局所在 battle 节点的发布轨道（"stable" / "canary"），选点时按选中节点记下，之后不变（docs/design/release-track-gray-canary.md §2.6）。
  // 观战入口、观战列表与随机选场按它判 stable 观众能不能看，不看实时节点镜像。空串（本字段之前的原件，迁移补列后读出 NULL）按 stable。
  string release_track = 23;
  // 论剑排位在成局提交点冻结的完整 RankedMatchContext(赛季/规则版本/规模/指纹/全员预设);非排位为空。
  bytes ranked_context = 24;
  // 论剑排位赛季编号(索引列,供换季排空查询本季已接纳对局;非排位为 0)。
  uint32 ranked_season_id = 25;
  // 锦标赛 V2 在成局提交点冻结的 TournamentBattleContext(BO3 局分与五行灵脉);非锦标赛为空。
  bytes tournament_context = 26;
  // 道友切磋坊冻结的 CustomDuelRules 字节载荷（非自定义切磋为空）。
  bytes custom_duel_rules = 27;
  // true = 五行幻境周常爬塔开战（PrepareBattle 注入权威层数与已选符印）。
  bool is_wuxing_tower = 28;
  // 天墉生死状在成局提交点冻结的 JianghuDuelBattleContext 字节载荷（非生死状为空）。
  bytes jianghu_duel_context = 29;
  // 五行试炼志 V3 自选试炼誓约位图（bit0..3，非试炼誓约局为 0）。
  uint32 trial_vow_mask = 30;
  // 万象残局坊在成局提交点冻结的 TacticalPuzzleBattleContext 字节载荷（非残局坊为空）。
  bytes tactical_puzzle_context = 31;
}
message MatchPreparedEndpoint {
  uint64 player_id = 1;
  string endpoint = 2;
}

// 评分按 (玩家, 计分模式) 分开存(docs/design/global-match-hierarchical-pools.md §8):每个计分模式一条评分轨道,
// 各自的分、各自的局数,打 1V1 不动 5V5 的分。只有计分模式(ratingrule.Rated)有行;PVP_TEAM 各档每侧人数共用一行。
message MatchRatingRecord {
  option (OptionTableName) = "match_rating";
  option (OptionPrimaryKey) = "player_id,mode";
  uint64 player_id = 1;
  int64 rating_centi = 2;
  uint64 games = 3; // 本模式打过的计分局数;投榜批次的 score_version = 入账后的 games(这名玩家在本模式第几局)
  uint64 updated_ms = 4;
  uint64 score_changed_ms = 5; // 分数最后一次变化的时刻,进批次的 achieved_ms。榜上同分决胜用它,不看批次到达顺序
  uint32 mode = 6; // MatchMode 数值,计分模式之一
}
message MatchRatingAppliedRecord {
  option (OptionTableName) = "match_rating_applied";
  option (OptionPrimaryKey) = "battle_id";
  uint64 battle_id = 1;
  bytes payload_digest = 2;
  uint64 applied_ms = 3;
}
// 评级投榜来源,按 (计分模式, 对局 id) 拆片:每个计分模式一张榜、自己的 64 片(shard = battle_id % 64,片数建表后不可改),
// 每局只锁本模式的那一片;游标按 (epoch, mode, shard) 各自从 1 连续。榜按模式分开是因为批次的 score_version 是
// 「这名玩家在本模式第几局」,两种模式混在一张榜上会互相当成新旧版本(global-match-hierarchical-pools.md §8)。
// 停写标记与最终游标和本片的评分事务争同一行锁；停写按模式逐片取锁，不依赖墙钟猜最后一批。
message MatchRankSourceRecord {
  option (OptionTableName) = "match_rank_source";
  option (OptionPrimaryKey) = "source_epoch,mode,shard";
  uint64 source_epoch = 1;
  uint64 produced_cursor = 2;
  uint64 committed_cursor = 3;
  uint64 board_id = 4; // 本模式那张榜(rank 的 board_id);同一模式各片必须相同
  bool stopped = 5;
  uint32 shard = 6;
  uint32 mode = 7; // MatchMode 数值,计分模式之一
}
message MatchRankOutboxRecord {
  option (OptionTableName) = "match_rank_outbox";
  option (OptionPrimaryKey) = "source_epoch,mode,shard,source_cursor";
  uint64 source_epoch = 1;
  uint64 source_cursor = 2;
  uint64 request_id = 3;
  bytes entries = 4; // 确定性序列化 SubmitRankScoresRequest（未签名）；重投只重签 auth。
  uint32 shard = 5;
  uint32 mode = 6; // MatchMode 数值,与来源行一致
}
// 删角之后要从评级榜摘掉的玩家(docs/design/account-deletion.md §6.2):删角收尾删评分行的同一事务里,按他有评分的计分模式
// 各写一行;投榜循环向 rank 调 RemoveRankEntry(rank 同一事务立墓碑,迟到的旧批次不会把人带回榜上),确认之后删行。
// 摘完即删,不留历史。
message MatchRankRemovalRecord {
  option (OptionTableName) = "match_rank_removal";
  option (OptionPrimaryKey) = "mode,player_id";
  uint32 mode = 1;       // MatchMode 数值,计分模式之一
  uint64 player_id = 2;
  uint64 created_ms = 3; // match 库时间,只给排障看积压
}

enum MatchBattleCompletionSourceKind {
  MATCH_BATTLE_COMPLETION_SOURCE_UNSPECIFIED = 0;
  MATCH_BATTLE_COMPLETION_SOURCE_KAFKA = 1;
  MATCH_BATTLE_COMPLETION_SOURCE_BATTLE_RPC = 2;
  // Match 在权威截止加终局提交宽限之后自己写的 ABORT：没有任何 Battle 原字节，该行 format_version 为 0。
  // 审计据此区分「Battle 提交的终局」与「Match 截止裁决」，不能再把 ABORT 行误读成 BATTLE_RPC 来源。
  MATCH_BATTLE_COMPLETION_SOURCE_MATCH_DEADLINE_ABORT = 3;
  // Match 在截止之前提前写的 ABORT（2026-11-05）：原件准入期限加时钟余量已过，原执行实例对原操作立了拒收墓碑并回
  // ABORTED，证明这份 Create 没建、以后也不会再建。同样没有 Battle 原字节，format_version 为 0。
  MATCH_BATTLE_COMPLETION_SOURCE_MATCH_NO_ROOM_ABORT = 4;
  // 运维经人工处置工具写的 ABORT（2026-11-05，go/match/cmd/formationfix，docs/ops/match-formation-manual-abort-runbook.md）：
  // 只给过了截止加宽限、没有任何终局行、持久 Create 原件过不了终局核对的成局；同一事务另写一行 match_manual_resolution 审计。
  // 同样没有 Battle 原字节，format_version 为 0。
  MATCH_BATTLE_COMPLETION_SOURCE_MANUAL_ABORT = 5;
  // 原执行实例提交的终局原件内容本身不合格、永远提交不了 COMPLETE 时，Match 在权威截止加终局提交宽限之后、
  // 收到它的下一次重放时写的 ABORT（2026-11-11，go/match/internal/authority/rejected_original_abort.go）。
  // battle 冻结的终局只会原样重放，这份原件被确定性规则拒收就不会再有别的结果；版本错位类拒收（未知字段等）不算。
  // 同样没有 Battle 原字节，format_version 为 0。
  MATCH_BATTLE_COMPLETION_SOURCE_MATCH_REJECTED_ORIGINAL_ABORT = 6;
  // 原执行进程确定已不在时 Match 提前写的 ABORT（2026-11-11，go/match/internal/authority/instance_gone.go，
  // docs/design/battle-instance-loss-early-abort.md §4）：两次确定证据（原地址上是另一个实例 / 原端口拒连 /
  // K8s 里原 IP 已没有 Pod）相隔不少于复核间隔，期间原实例从没亲口应答过。截止之前也可以写。
  // 同样没有 Battle 原字节，format_version 为 0。
  MATCH_BATTLE_COMPLETION_SOURCE_MATCH_INSTANCE_GONE_ABORT = 7;
}

// 唯一终局与原结果outbox；RPC来源不伪造Kafka位点。
message MatchBattleCompletionRecord {
  option (OptionTableName) = "match_battle_completion";
  option (OptionPrimaryKey) = "battle_id";
  option (OptionIndex) = "decision,result_published,next_retry_ms,battle_id";
  uint64 battle_id = 1;
  bytes raw_payload = 2;
  bytes payload_digest = 3;
  uint32 format_version = 4;
  uint64 archived_ms = 5;
  string source_topic = 6;
  int32 source_partition = 7;
  int64 source_offset = 8;
  BattleOutcomeDecision decision = 9;
  MatchBattleCompletionSourceKind source_kind = 10;
  string placement_operation_id = 11;
  string target_instance_id = 12;
  uint32 outcome_protocol_version = 13;
  bool result_published = 14;
  uint64 next_retry_ms = 15;
}

// 与整局原件同一事务登记；稳定身份为battle_id+player_id，保留到显式迁移/恢复流程接管。
message MatchBattleSettlementSourceRecord {
  option (OptionTableName) = "match_battle_settlement_source";
  option (OptionPrimaryKey) = "battle_id,player_id";
  option (OptionIndex) = "dispatch_state,next_retry_ms,battle_id,player_id";
  uint64 battle_id = 1;
  uint64 player_id = 2;
  bytes settlement_proto = 3;
  bytes payload_digest = 4;
  uint64 archived_ms = 5;
  string owner_account = 6;
  uint64 owner_revision = 7;
  uint64 issued_at_ms = 8;
  uint64 inbox_seq = 9;
  uint32 inbox_state = 10;
  uint32 dispatch_state = 11; // 0旧归档、1待入箱/核原收据、2已确认APPLIED。
  uint64 next_retry_ms = 12;
}

// 人工处置永久 UNKNOWN 全球成局的审计（2026-11-05，docs/ops/match-formation-manual-abort-runbook.md）。
// 与 ABORT（match_battle_completion.source_kind=MANUAL_ABORT）同一事务写入，主键 battle_id 保证一局只人工处置一次。
// 只增不改，不参与任何运行期判定；常驻账号只需 DML。
message MatchManualResolutionRecord {
  option (OptionTableName) = "match_manual_resolution";
  option (OptionPrimaryKey) = "battle_id";
  uint64 battle_id = 1;
  StrandedFormationMode action = 2;           // 现只有 ABORT
  StrandedFormationClass formation_class = 3; // 处置时这一局属于哪一类永久 UNKNOWN
  string failed_check = 4;                    // 第一项不通过的原件核对（ASCII 原因码）
  string operator_name = 5;                   // ≤64 字节，不含控制字符
  string reason = 6;                          // ≤191 字节：工单号与核对结论
  uint64 resolved_ms = 7;                     // TiDB 时刻
  string formation_digest_before = 8;         // 处置前成局行确定性序列化的 SHA-256（hex），即操作员核对过的 expect_digest
  bytes formation_before = 9;                 // 处置前成局行 MatchFormationRecord 的确定性序列化
  // 处置前全员原票。列里存只含本字段的本消息的确定性序列化（与 match_formation.members 同一做法）
  repeated MatchAuthorityTicketRecord tickets_before = 10;
  uint64 effective_deadline_ms = 11;          // max(成局截止, 原件截止, 原件准入期限)
  string replica_instance = 12;               // 执行这次处置的 match 副本（主机名）
  // 后台双人复核的批准号与批准人(2026-11-26,docs/design/admin-identity-and-dual-control.md §5.8);发起人就是 operator_name,不重复存。
  // 只有部署打开 GlobalMatch.ManualResolutionAllowUnapproved 时才会是空串。
  string approval_id = 13;
  string approver = 14;
}

// 战报回放正文(docs/design/battle-report-replay.md)。与 match_battle_completion 同一事务写,只写 COMPLETE 的局。
// ref_count = 还在列出这一局的 match_player_battle_report 行数;列表行被挤出时同一事务减一,减到 0 删掉本行。
// 只有终局事务改本表,读路径只读。
message MatchBattleReportRecord {
  option (OptionTableName) = "match_battle_report";
  option (OptionPrimaryKey) = "battle_id";
  uint64 battle_id = 1;
  uint64 created_ms = 2;        // match 库时间 now(tx)
  uint32 match_mode = 3;        // 运维统计用,读路径不看
  uint32 battle_config_id = 4;  // 同上
  bytes envelope = 5;           // 确定性序列化的 BattleReplayEnvelope(player_battle.proto)
  bytes envelope_digest = 6;    // sha256(envelope),重放核对用
  uint32 ref_count = 7;
}

// 每名玩家最近 100 场 PVP 战报的列表(battle-report-replay.md BR-10)。与终局同一事务写入;
// 同一事务里删掉超出 100 条的最旧行,并给对应正文的 ref_count 减一。玩家同一时刻只有一场战斗,所以一名玩家的行
// 只被他自己那一局的终局事务改。
message MatchPlayerBattleReportRecord {
  option (OptionTableName) = "match_player_battle_report";
  option (OptionPrimaryKey) = "player_id,created_ms,battle_id";
  uint64 player_id = 1;
  uint64 created_ms = 2;  // match 库时间 now(tx);列表按它倒序,同一时刻按 battle_id 倒序
  uint64 battle_id = 3;
  bytes summary = 4;      // 确定性序列化的 BattleReportSummary(match_service.proto)
}

// ---- 战斗剧本(docs/design/battle-script.md §6) ----

// 玩家上传的剧本:一份一行,只存「当前提交版」与「审核通过版」两份正文。
// 改一次 = 新版本、重新待审;审过之前对局一直用上一份通过版(approved_*),审核看的永远是 content 那一版。
// 正文都是确定性序列化的 battle.BattleScript(script_id 恒为 0,身份是本行 script_id)。
message MatchBattleScriptRecord {
  option (OptionTableName) = "match_battle_script";
  option (OptionPrimaryKey) = "script_id";
  option (OptionIndex) = "owner_player_id,script_id;review_state,submitted_ms,script_id";
  uint64 script_id = 1;          // 发号器永久 ID(只当身份用,不比大小)
  uint64 owner_player_id = 2;
  uint32 revision = 3;           // 每次提交 +1,从 1 起;客户端改、删、审核都按它做 CAS
  bytes content = 4;             // 当前提交版正文
  uint32 review_state = 5;       // BattleScriptReviewState(match_service.proto):当前提交版的审核状态
  uint32 approved_revision = 6;  // 最近一次通过的版本号;0 = 从未通过,不能选用
  bytes approved_content = 7;    // 最近一次通过的那一版正文;建房只用它
  string reject_reason = 8;      // 最近一次驳回的原因(给作者看)
  uint64 submitted_ms = 9;       // match 库时间:当前版本提交时刻;待审列表按它排
  uint64 reviewed_ms = 10;
}

// 审核流水:每审一次一行,与剧本行的状态变更同一事务写入,只增不改(审计、追责、事后核对审的是哪一版正文)。
// 保留期按 reviewed_ms 算(match 配置 BattleScript.ReviewRetentionDays,缺省 180 天),到期由保留期清理按
// (reviewed_ms, 主键) 翻页分批删除(authority.PurgeExpiredBattleScriptReviews),只索引读,不扫全表。
message MatchBattleScriptReviewRecord {
  option (OptionTableName) = "match_battle_script_review";
  option (OptionPrimaryKey) = "script_id,revision";
  option (OptionIndex) = "reviewed_ms,script_id,revision";
  uint64 script_id = 1;
  uint32 revision = 2;
  uint64 owner_player_id = 3;
  bool approved = 4;
  string reviewer = 5;      // 审核员名,≤64 字节
  string reason = 6;        // 驳回原因或通过备注,≤191 字节
  uint64 reviewed_ms = 7;   // match 库时间
  bytes content = 8;        // 审的那一版正文
}

// 玩家对某种对局选用的剧本:(玩家, 模式, 副本) 一行,模式 / 副本为 0 表示任意;查找按 具体 → 通用 取第一条。
// 只记引用,不存正文:官方剧本随 match 发布,玩家剧本建房时读审核通过版。
message MatchBattleScriptLoadoutRecord {
  option (OptionTableName) = "match_battle_script_loadout";
  option (OptionPrimaryKey) = "player_id,match_mode,battle_config_id";
  uint64 player_id = 1;
  uint32 match_mode = 2;
  uint32 battle_config_id = 3;
  uint32 origin = 4;               // battle.eBattleScriptOrigin:1 官方 / 2 玩家
  uint32 official_script_id = 5;   // origin = 官方
  uint64 player_script_id = 6;     // origin = 玩家:只能是本人的剧本
  uint64 updated_ms = 7;
}

// ---- 论剑排位首发 V1 权威表(docs/design/ranked-play-season-ui-candidate.md) ----

// 赛季周期与可恢复换季状态机(单赛季一行)。
message MatchRankedSeasonRecord {
  option (OptionTableName) = "match_ranked_season";
  option (OptionPrimaryKey) = "season_id";
  option (OptionIndex) = "state,season_id";
  uint32 season_id = 1;
  string season_key = 2;            // 如 "s1"
  string season_name = 3;
  uint64 rank_generation = 4;       // 排行榜 generation(=season_id)
  uint64 source_epoch = 5;          // match_rank_source / match_rank_outbox 的 source_epoch(=season_id)
  uint32 rule_version = 6;
  uint32 state = 7;                 // RankedSeasonState: 1 ACTIVE / 2 SETTLING / 3 CLOSED
  uint32 rollover_stage = 8;        // 0 NONE / 1 ADMISSION_STOPPED / 2 FORMATIONS_DRAINED / 3 RATINGS_DRAINED / 4 RANK_STOPPED / 5 RANK_DRAINED / 6 BOARD_SEALED / 7 HONORS_SNAPSHOT / 8 DONE
  uint64 start_ms = 9;              // [start_ms, end_ms) 左闭右开 UTC 毫秒
  uint64 end_ms = 10;
  uint64 rank_board_id = 11;
  uint64 expected_rank_cursor = 12; // StopRankSource 返回的本季各片游标之和
  uint64 champion_player_id = 13;   // 封榜第 1 且终分达到无双的玩家;空缺为 0
  string champion_name = 14;
  int64 champion_rating_centi = 15;
  uint64 updated_ms = 16;
}

// 玩家排位默认预设与展示权益佩戴偏好。
message MatchRankedPlayerPrefsRecord {
  option (OptionTableName) = "match_ranked_player_prefs";
  option (OptionPrimaryKey) = "player_id";
  uint64 player_id = 1;
  uint32 character_preset_id = 2; // 默认 101 破阵
  uint32 pet_preset_id = 3;       // 默认 203 护主
  uint32 rule_version = 4;
  bytes cosmetic_loadout = 5;     // 确定性序列化 RankedCosmeticLoadout
  uint64 updated_ms = 6;
}

// 玩家单赛季进度(亮段/有效场次/胜负平/最高段位/封榜名次)。跨季新季不继承本表行,Elo 仍在 match_rating 继承。
message MatchRankedPlayerSeasonRecord {
  option (OptionTableName) = "match_ranked_player_season";
  option (OptionPrimaryKey) = "season_id,player_id";
  option (OptionIndex) = "player_id,season_id";
  uint32 season_id = 1;
  uint64 player_id = 2;
  bool qualified = 3;
  uint64 qualified_at_ms = 4;
  int64 rating_centi = 5;
  int64 peak_rating_centi = 6;
  uint32 peak_tier = 7;
  uint32 valid_matches = 8;
  uint32 wins = 9;
  uint32 losses = 10;
  uint32 draws = 11;
  uint32 milestone_bits = 12; // bit0=4场头像纹样, bit1=8场名片底纹, bit2=12场青云玉符
  uint32 honor_bits = 13;     // bit0=天枢/无双徽章, bit1=赛季称号, bit2=榜首题名
  uint64 final_rank = 14;
  uint64 updated_ms = 15;
  uint32 current_win_streak = 16;
  uint32 best_win_streak = 17;
}

// 玩家排位展示权益账(主键去重,跨季永久留存)。
message MatchRankedRewardRecord {
  option (OptionTableName) = "match_ranked_reward";
  option (OptionPrimaryKey) = "player_id,season_id,reward_kind";
  uint64 player_id = 1;
  uint32 season_id = 2;
  uint32 reward_kind = 3; // RankedRewardKind
  uint32 tier_value = 4;
  string item_code = 5;
  uint64 granted_at_ms = 6;
}

// 单局排位权威结算摘要(与 ApplyRating / commitAbortTx 同一事务提交,供结算屏与重登查询)。
message MatchRankedBattleRecord {
  option (OptionTableName) = "match_ranked_battle";
  option (OptionPrimaryKey) = "battle_id,player_id";
  option (OptionIndex) = "player_id,settled_at_ms,battle_id";
  uint64 battle_id = 1;
  uint64 player_id = 2;
  uint32 season_id = 3;
  uint64 settled_at_ms = 4;
  bytes summary = 5; // 确定性序列化 RankedBattleSettlementView
}

// 论剑 V6 宿敌交手账本（单赛季每对玩家各存一条主视角行，用于战前宿敌提示、雪耻复仇判定与大厅宿敌列表）。
message MatchRankedRivalryRecord {
  option (OptionTableName) = "match_ranked_rivalry";
  option (OptionPrimaryKey) = "season_id,player_id,opponent_id";
  option (OptionIndex) = "season_id,player_id,updated_ms";
  uint32 season_id = 1;
  uint64 player_id = 2;
  uint64 opponent_id = 3;
  string opponent_name = 4;
  uint32 wins = 5;
  uint32 losses = 6;
  uint32 draws = 7;
  uint32 last_outcome = 8; // 1 胜 / 2 负 / 3 平
  uint64 last_battle_id = 9;
  uint64 updated_ms = 10;
}

// 论剑 V6 问道名局高段热门流派汇总表（按 (season_id, build_key) 幂等汇聚；整数复合主键符合 D-14，唯一键兜底精确去重，featured_battle_id 建索引供公开回放鉴权）。
message MatchRankedFeaturedBuildRecord {
  option (OptionTableName) = "match_ranked_featured_build";
  option (OptionPrimaryKey) = "season_id,build_key_high,build_key_low";
  option (OptionUniqueKey) = "season_id,build_key";
  option (OptionIndex) = "season_id,high_tier_wins,wins,featured_rating_centi;featured_battle_id";
  uint32 season_id = 1;
  string build_key = 2;
  uint32 season_seal_id = 3;
  uint32 starter_pet_table_id = 4;
  string core_skill_ids = 5; // 逗号分隔有序技能表 ID（最多 4 招）
  uint32 appearances = 6;
  uint32 wins = 7;
  uint32 high_tier_wins = 8;
  uint64 featured_battle_id = 9;
  uint64 featured_player_id = 10;
  string featured_player_name = 11;
  int64 featured_rating_centi = 12;
  uint32 featured_team_size = 13;
  uint32 featured_total_rounds = 14;
  uint64 updated_ms = 15;
  uint64 build_key_high = 16; // build_key 的 SHA-256 前 64 位；与 build_key_low 构成 D-14 整数复合主键
  uint64 build_key_low = 17;  // build_key 的 SHA-256 次 64 位
}

// ---- 全服赛季战队锦标赛《群仙问道赛》V1 权威表(docs/design/season-team-tournament-v1.md) ----

// 锦标赛赛季与四阶段状态机(单赛季一行)。
message MatchTournamentSeasonRecord {
  option (OptionTableName) = "match_tournament_season";
  option (OptionPrimaryKey) = "season_id";
  option (OptionIndex) = "stage,season_id";
  uint32 season_id = 1;
  string season_key = 2;
  string season_name = 3;
  uint32 rule_version = 4;
  uint32 stage = 5; // TournamentStage: 1 REGISTRATION / 2 QUALIFIER / 3 KNOCKOUT / 4 SETTLED
  uint64 registration_start_ms = 6;
  uint64 qualifier_start_ms = 7;
  uint64 knockout_start_ms = 8;
  uint64 settle_start_ms = 9;
  uint64 end_ms = 10;
  uint32 battle_team_size = 11;
  uint32 roster_max_size = 12;
  uint32 knockout_team_count = 13;
  uint64 champion_squad_id = 14;
  string champion_squad_name = 15;
  string champion_member_summary = 16;
  uint64 settled_ms = 17;
  uint64 updated_ms = 18;
  bytes champion_members_blob = 19; // V2: 确定性序列化 MatchTournamentChampionMembersBlob
  reserved 20;                      // 原 champion_salute_count（每日观道致敬已移除）
  reserved "champion_salute_count";
  uint32 champion_emblem_id = 21;   // V3: 冠军战队队徽(1..8)
  uint64 third_place_squad_id = 22; // V3: 季军战队 ID
  string third_place_squad_name = 23; // V3: 季军战队名
  uint32 third_place_emblem_id = 24;  // V3: 季军战队队徽(1..8)
  uint64 final_mvp_player_id = 25;    // V3: 总决赛问鼎之星(MVP)玩家 ID
  string final_mvp_player_name = 26;  // V3: 总决赛 MVP 角色名
  uint32 final_mvp_score = 27;        // V3: 总决赛 MVP 综合战功分
  uint32 champion_honor_bits = 28;    // V4: 冠军战队赛季荣耀铭牌位图
}

message MatchTournamentChampionMembersBlob {
  repeated MatchTournamentMemberRecord members = 1;
}

// 全服报名战队(主键 squad_id 由 BattleIDGen 永久发号;同赛季归一化名唯一)。
message MatchTournamentSquadRecord {
  option (OptionTableName) = "match_tournament_squad";
  option (OptionPrimaryKey) = "squad_id";
  option (OptionUniqueKey) = "season_id,name_norm";
  option (OptionIndex) = "season_id,state,qualifier_points,squad_id;season_id,final_rank,squad_id";
  uint64 squad_id = 1;
  uint32 season_id = 2;
  string name = 3;
  string name_norm = 4; // 归一化队名(TrimSpace+NFKC+Lower),同赛季唯一
  uint64 captain_player_id = 5;
  uint32 state = 6; // TournamentSquadState
  uint32 member_count = 7;
  uint32 qualifier_points = 8;
  uint32 qualifier_played = 9;
  uint32 qualifier_wins = 10;
  uint32 qualifier_losses = 11;
  uint32 qualifier_draws = 12;
  uint32 seed_rank = 13;
  uint32 final_rank = 14;
  uint32 cheer_count = 15;
  uint64 registered_ms = 16;
  uint64 updated_ms = 17;
  uint32 emblem_id = 18;  // V3: 官方预设道家队徽(1..8)
  uint32 honor_bits = 19; // V4: 战队赛季荣耀铭牌位图(bit 0..5)
}

// 战队成员名册(主键 (season_id, player_id) 物理保证一人一季仅隶属一支战队)。
message MatchTournamentMemberRecord {
  option (OptionTableName) = "match_tournament_member";
  option (OptionPrimaryKey) = "season_id,player_id";
  option (OptionIndex) = "squad_id,player_id";
  uint32 season_id = 1;
  uint64 player_id = 2;
  uint64 squad_id = 3;
  uint32 role = 4;         // TournamentMemberRole
  uint32 starter_slot = 5; // 1..battle_team_size 为首发,0 为替补
  string player_name = 6;
  uint32 zone_id = 7;
  uint64 joined_ms = 8;
  uint32 class_id = 9;
  uint32 gender = 10;
  string appearance_id = 11;
}

// 跨区战队邀请(待应答列表按受邀者查询)。
message MatchTournamentInviteRecord {
  option (OptionTableName) = "match_tournament_invite";
  option (OptionPrimaryKey) = "squad_id,invitee_player_id";
  option (OptionIndex) = "invitee_player_id,state,expires_ms,squad_id";
  uint64 squad_id = 1;
  uint64 invitee_player_id = 2;
  uint32 season_id = 3;
  uint64 inviter_player_id = 4;
  uint32 state = 5; // 1 待应答 / 2 已接受 / 3 已拒绝 / 4 已过期取消
  uint64 created_ms = 6;
  uint64 expires_ms = 7;
}

// 赛程对局表(海选约战配对 + 淘汰赛对阵树)。
message MatchTournamentMatchRecord {
  option (OptionTableName) = "match_tournament_match";
  option (OptionPrimaryKey) = "match_id";
  option (OptionIndex) = "season_id,phase,round_index,slot_index;battle_id;season_id,phase,state,match_id";
  uint64 match_id = 1;
  uint32 season_id = 2;
  uint32 phase = 3;          // TournamentMatchPhase
  uint32 round_index = 4;
  uint32 slot_index = 5;
  uint64 squad_a_id = 6;
  uint64 squad_b_id = 7;     // 0 = 海选等待对手或淘汰赛轮空
  bytes lineup_a = 8;        // 逗号分隔 uint64 成员 ID 或 protobuf 编码
  bytes lineup_b = 9;
  bool ready_a = 10;
  bool ready_b = 11;
  uint32 state = 12;         // TournamentMatchState
  uint64 battle_id = 13;
  uint64 winner_squad_id = 14;
  uint32 outcome = 15;       // battle.eBattleOutcome
  bool featured_spectate = 16;
  uint64 scheduled_start_ms = 17;
  uint64 deadline_ms = 18;
  uint64 finished_ms = 19;
  uint64 updated_ms = 20;
  uint32 best_of = 21;                  // V2: 1=BO1, 3=BO3
  uint32 current_game_index = 22;       // V2: 当前小局序号(1..best_of)
  uint32 wins_a = 23;                   // V2: A 队小局胜场
  uint32 wins_b = 24;                   // V2: B 队小局胜场
  uint32 current_leyline_element = 25;  // V2: 当前/下一小局五行灵脉(TournamentLeylineElement)
  string leyline_sequence = 26;         // V2: 逗号分隔灵脉序号如 "1,4,2"
  uint64 intermission_deadline_ms = 27; // V2: BO3 局间换阵截止时刻(Unix 毫秒)
  bool is_third_place = 28;             // V3: true=四强季军争夺战(铜牌战)
  uint64 mvp_player_id = 29;            // V3: 本场问鼎之星(MVP)玩家 ID
  string mvp_player_name = 30;          // V3: 本场 MVP 角色名
  uint64 mvp_squad_id = 31;             // V3: 本场 MVP 所属战队 ID
  uint32 mvp_score = 32;                // V3: 本场 MVP 综合战功分
  uint64 mvp_damage = 33;               // V3: 本场 MVP 累计伤害
  uint64 mvp_healing = 34;              // V3: 本场 MVP 累计治疗与护盾
  uint32 mvp_controls = 35;             // V3: 本场 MVP 累计成功硬控次数
  uint32 banned_leyline_a = 36;         // V4: BO3 赛前 A 队队长禁选灵脉(0..5)
  uint32 banned_leyline_b = 37;         // V4: BO3 赛前 B 队队长禁选灵脉(0..5)
}

// V2: 锦标赛小局战果归档与幂等去重表(主键 (match_id, game_index), battle_id 唯一, 防止 Kafka 重投重复加胜场, 同时支持淘汰赛全服公开回放鉴权)。
message MatchTournamentMatchGameRecord {
  option (OptionTableName) = "match_tournament_match_game";
  option (OptionPrimaryKey) = "match_id,game_index";
  option (OptionUniqueKey) = "battle_id";
  option (OptionIndex) = "season_id,battle_id";
  uint64 match_id = 1;
  uint32 game_index = 2;
  uint32 season_id = 3;
  uint32 phase = 4;               // TournamentMatchPhase
  uint64 battle_id = 5;
  uint32 leyline_element = 6;     // TournamentLeylineElement
  uint64 winner_squad_id = 7;
  uint32 outcome = 8;             // battle.eBattleOutcome
  uint64 finished_ms = 9;
}

// 全服免费助威(主键 (season_id, player_id) 物理防重复助威,零消费零押注)。
message MatchTournamentCheerRecord {
  option (OptionTableName) = "match_tournament_cheer";
  option (OptionPrimaryKey) = "season_id,player_id";
  option (OptionIndex) = "season_id,squad_id,player_id";
  uint32 season_id = 1;
  uint64 player_id = 2;
  uint64 squad_id = 3;
  bool rewarded = 4;
  uint64 created_ms = 5;
}

// 赛季锦标赛奖励账与幂等发件箱(主键 (season_id, player_id, tier_kind) 物理防重发)。
message MatchTournamentRewardRecord {
  option (OptionTableName) = "match_tournament_reward";
  option (OptionPrimaryKey) = "season_id,player_id,tier_kind";
  option (OptionIndex) = "player_id,season_id,tier_kind;delivery_state,updated_ms,reward_id";
  uint32 season_id = 1;
  uint64 player_id = 2;
  uint32 tier_kind = 3;      // TournamentRewardTierKind
  uint64 reward_id = 4;      // 发号器永久 ID,作为 MailAdmin.SendPersonalMail 的幂等 request_id
  uint64 squad_id = 5;
  uint32 final_rank = 6;
  uint32 tier_id = 7;        // TournamentReward 表行 id
  uint64 gold_amount = 8;
  bytes attachments = 9;     // 确定性序列化的 mailpb.MailAttachments(仅自用绑定)
  string title_code = 10;
  string badge_code = 11;
  uint32 delivery_state = 12;// TournamentRewardDeliveryState: 1 待领/待发 / 2 已发/已领 / 3 放弃
  uint64 mail_id = 13;
  uint64 claimed_ms = 14;
  uint64 updated_ms = 15;
  // 结算时冻结的领奖邮件标题与正文(取当时的 TournamentReward 配表,空则缺省文案)。领奖重发只用这两列,
  // 同一条奖励每次的邮件请求逐字节相同,mail 按 (sender_kind, request_id) 判重回原 mail_id
  // (群仙问道赛设计 V1 第七节,数据覆写审计 r2 第 4 轮)。
  string mail_title = 16;
  string mail_body = 17;
}

// V3: 淘汰赛免费神机竞猜表(主键 (season_id, player_id, match_id) 物理保证一人一场一票,零消费零押注)。
message MatchTournamentPredictionRecord {
  option (OptionTableName) = "match_tournament_prediction";
  option (OptionPrimaryKey) = "season_id,player_id,match_id";
  option (OptionIndex) = "season_id,match_id,predicted_squad_id;season_id,result_state,player_id";
  uint32 season_id = 1;
  uint64 player_id = 2;
  uint64 match_id = 3;
  uint64 predicted_squad_id = 4;
  uint32 round_index = 5;
  bool is_third_place = 6;
  string player_name = 7;
  uint32 result_state = 8; // 0 待结算 / 1 命中 / 2 未中
  uint32 earned_points = 9;
  uint64 created_ms = 10;
  uint64 updated_ms = 11;
}

// ---- 江湖恩怨与天墉生死状一期权威表(docs/design/battle-jianghu-grudge-duel-bounty-v1.md) ----

message MatchJianghuDuelInvitationRecord {
  option (OptionTableName) = "match_jianghu_duel_invitation";
  option (OptionPrimaryKey) = "duel_invite_id";
  option (OptionIndex) = "target_captain_id,state,expires_ms,duel_invite_id;challenger_captain_id,state,expires_ms,duel_invite_id";
  option (OptionTiDBNonclusteredPK) = true;
  option (OptionTiDBShardRowIDBits) = 4;
  option (OptionTiDBPreSplitRegions) = 4;

  uint64 duel_invite_id = 1;
  uint32 writ_tier = 2;             // JianghuWritTier
  uint32 team_size = 3;             // 1..5
  uint32 state = 4;                 // JianghuDuelInviteState
  uint64 challenger_captain_id = 5;
  uint64 target_captain_id = 6;
  string challenger_account = 7;
  uint64 challenger_revision = 8;
  string target_account = 9;
  uint64 target_revision = 10;
  uint32 zone_id = 11;
  uint64 side_a_guild_id = 12;
  string side_a_guild_name = 13;
  uint64 side_b_guild_id = 14;
  string side_b_guild_name = 15;
  bytes members_payload = 16;       // 确定性序列化双队成员与确认态快照(JianghuDuelInviteView.challenger/target_members)
  uint64 created_ms = 17;
  uint64 expires_ms = 18;
  uint64 confirm_deadline_ms = 19;
  uint64 battle_id = 20;
  uint64 updated_ms = 21;
}

message MatchJianghuDuelCooldownRecord {
  option (OptionTableName) = "match_jianghu_duel_cooldown";
  option (OptionPrimaryKey) = "challenger_player_id,target_player_id";
  option (OptionIndex) = "challenger_player_id,day_key";
  option (OptionTiDBNonclusteredPK) = true;
  option (OptionTiDBShardRowIDBits) = 4;
  option (OptionTiDBPreSplitRegions) = 4;

  uint64 challenger_player_id = 1;
  uint64 target_player_id = 2;      // 0 = 角色每日未成局总次数计数行；非 0 = 同目标 5 分钟冷却行
  uint64 cooldown_until_ms = 3;
  uint32 day_key = 4;               // UTC+8 05:00 游戏日 YYYYMMDD
  uint32 daily_unmatched_count = 5;
  uint64 updated_ms = 6;
}

message MatchGrudgeRelationRecord {
  option (OptionTableName) = "match_grudge_relation";
  option (OptionPrimaryKey) = "player_id,owner_revision,peer_player_id";
  option (OptionIndex) = "player_id,owner_revision,last_battle_ms";
  option (OptionTiDBNonclusteredPK) = true;
  option (OptionTiDBShardRowIDBits) = 4;
  option (OptionTiDBPreSplitRegions) = 4;

  uint64 player_id = 1;
  uint64 owner_revision = 2;        // 过户换人递增后旧持有者恩怨自动隔离清空
  uint64 peer_player_id = 3;
  string peer_name = 4;
  uint32 wins = 5;
  uint32 losses = 6;
  uint32 draws = 7;
  uint32 win_streak = 8;
  uint32 lose_streak = 9;
  uint64 last_battle_ms = 10;
  bool dismissed = 11;              // 单向一笔勾销（再交手时自动重新显现）
}

message MatchGrudgeLogRecord {
  option (OptionTableName) = "match_grudge_log";
  option (OptionPrimaryKey) = "player_id,owner_revision,peer_player_id,battle_id";
  option (OptionIndex) = "player_id,owner_revision,peer_player_id,finished_ms";
  option (OptionTiDBNonclusteredPK) = true;
  option (OptionTiDBShardRowIDBits) = 4;
  option (OptionTiDBPreSplitRegions) = 4;

  uint64 player_id = 1;
  uint64 owner_revision = 2;
  uint64 peer_player_id = 3;
  uint64 battle_id = 4;
  uint32 outcome_for_self = 5;      // 1=胜, 2=负, 3=平
  uint32 total_rounds = 6;
  uint32 writ_tier = 7;
  uint32 team_size = 8;
  uint64 finished_ms = 9;
}

// 个人恩怨录的入账闸门:一局一行,记「这一局已经入过恩怨录」(jianghu_grudge.go 的 ApplyJianghuDuelBattleResult)。
// 去重键不能放在 match_grudge_log 里:那张表每对宿敌只留最近 20 条、每人只留最近 50 位宿敌,主键还带处理时刻取的 owner_revision,
// 被裁掉或过户之后重投的旧结果查不到行,会把胜负与连胜再算一遍、再发一遍播报(数据覆写审计 r2 第 4 轮 r2-jh#3)。
// 本表不裁剪、不按玩家删(删角也保留,同 match_rating_applied):删了重放会给对手再算一次。
message MatchGrudgeAppliedRecord {
  option (OptionTableName) = "match_grudge_applied";
  option (OptionPrimaryKey) = "battle_id";

  uint64 battle_id = 1;
  uint64 applied_ms = 2;            // 入账时刻(库时钟),只供排查与日后按保留期清理
}

// 五行试炼志 V3：好友约战帖权威存储（最多每人 10 张，14 天有效，与 match_battle_report.ref_count 联动钉住录像）。
message MatchTrialChallengeCardRecord {
  option (OptionTableName) = "match_trial_challenge_card";
  option (OptionPrimaryKey) = "card_id";
  option (OptionIndex) = "owner_player_id,created_ms,card_id;expires_ms,card_id";
  option (OptionTiDBNonclusteredPK) = true;
  option (OptionTiDBShardRowIDBits) = 4;
  option (OptionTiDBPreSplitRegions) = 4;

  uint64 card_id = 1;
  uint64 owner_player_id = 2;
  uint64 battle_id = 3;
  uint32 journal_entry_id = 4;
  uint32 vow_mask = 5;
  uint32 total_rounds = 6;
  uint64 created_ms = 7;
  uint64 expires_ms = 8;
  bytes card_view = 9; // 确定性序列化 TrialChallengeCardView
}

// 万象残局坊（UGC 回合解谜工坊 V1）：玩家自创残局主表（每人最多 10 题，编辑已发布题递增 spec_revision 并退回草稿重新自证）。
message MatchTacticalPuzzleRecord {
  option (OptionTableName) = "match_tactical_puzzle";
  option (OptionPrimaryKey) = "puzzle_id";
  option (OptionIndex) = "author_player_id,updated_ms,puzzle_id;state,like_count,clear_count,puzzle_id;state,published_ms,puzzle_id";
  option (OptionTiDBNonclusteredPK) = true;
  option (OptionTiDBShardRowIDBits) = 4;
  option (OptionTiDBPreSplitRegions) = 4;

  uint64 puzzle_id = 1;
  uint64 author_player_id = 2;
  string author_name = 3;
  uint32 state = 4;              // 1=DRAFT 待自证, 2=PUBLISHED 已发布
  uint32 spec_revision = 5;      // 题面修订号（从 1 递增）
  string title = 6;              // 4..20 字符（已过 ContentGuard）
  string hint_text = 7;          // 0..40 字符破局思路提示（已过 ContentGuard）
  uint32 tag_mask = 8;           // bit0破盾 bit1控场 bit2驱散 bit3反杀 bit4极限回合 bit5残血翻盘
  bytes spec_payload = 9;        // 确定性序列化 battle.TacticalPuzzleSpec
  uint64 verified_battle_id = 10;// 作者自证通关并钉住的标准解回放 battle_id（DRAFT 为 0）
  uint32 author_best_rounds = 11;// 作者自证通关回合数
  uint32 attempt_count = 12;     // 全服累计挑战人次
  uint32 clear_count = 13;       // 全服累计独立通关人数
  uint32 global_best_rounds = 14;// 全服最少通关回合数
  uint32 like_count = 15;        // 全服点赞数（仅通关非作者可赞）
  uint64 created_ms = 16;
  uint64 published_ms = 17;
  uint64 updated_ms = 18;
}

// 万象残局坊：玩家单题挑战 / 通关 / 最少回合 / 点赞记录表（合并 1 表防多表膨胀）。
message MatchTacticalPuzzleClearRecord {
  option (OptionTableName) = "match_tactical_puzzle_clear";
  option (OptionPrimaryKey) = "puzzle_id,player_id";
  option (OptionIndex) = "player_id,cleared,updated_ms,puzzle_id";
  option (OptionTiDBNonclusteredPK) = true;
  option (OptionTiDBShardRowIDBits) = 4;
  option (OptionTiDBPreSplitRegions) = 4;

  uint64 puzzle_id = 1;
  uint64 player_id = 2;
  uint32 attempts = 3;
  bool cleared = 4;
  uint32 best_rounds = 5;        // 0=未通关
  bool liked = 6;
  uint64 first_cleared_ms = 7;
  uint64 updated_ms = 8;
}
