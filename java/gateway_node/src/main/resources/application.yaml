# Gateway Node Service
server:
  port: 8081

spring:
  application:
    name: gateway-node
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:mysql://localhost:3306/mmorpg?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: appuser
    password: apppass123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379

# etcd
etcd:
  endpoints:
    - http://127.0.0.1:2379
  dial-timeout-ms: 5000

# Gate assignment
gate:
  token-secret: "change-me-in-production-use-a-strong-random-key"
  token-ttl-seconds: 300
  discovery-timeout-ms: 5000
  rate-limit:
    # Master switch — leave OFF until ops verifies the Bucket4j wiring against staging Redis.
    enabled: false
    zone-default-rps: 500
    zone-default-burst: 1000
    ip-rps: 5
    ip-burst: 20
    account-cooldown-ms: 5000
    queue-timeout-ms: 300000
    # Per-zone overrides example (commented):
    # zone-overrides:
    #   1: { rps: 2000, burst: 5000 }
    wave:
      enabled: false
      # Wave clock baseline; 0 = use gateway boot time.
      start-epoch-sec: 0
      schedule: []
      # Example for an open-server day:
      # schedule:
      #   - { offset-sec: 0,   allow-zones: [1, 2] }
      #   - { offset-sec: 30,  allow-zones: [3, 4] }
      #   - { offset-sec: 120, allow-zones: [-1] }   # -1 = all zones

# go-zero login.rpc client
#
# Multi-zone stress 2026-05: each zone runs its own login.rpc instance with
# ListenOn shifted by (zone-1)*1000. dev start-zones launches:
#   z1_login = 127.0.0.1:53000 (base 53000 + 0)
#   z2_login = 127.0.0.1:54000 (base 53000 + 1000)
#   z3_login = 127.0.0.1:55000 (base 53000 + 2000)
#
# Endpoint syntax: "<zoneId>=host:port" pins the channel to a zone (used by
# AssignGate / Login / queue-status, all of which know their target zone).
# Bare "host:port" only joins the round-robin pool used by RefreshToken because
# its token currently carries no zone. Login / AssignGate / queue-status require
# an exact tagged mapping and fail before network I/O when it is missing.
#
# Why zone-pinning matters: each go-zero login.rpc only watches its own zone's
# gate registrations in etcd. A round-robin client misroutes 2-in-3
# AssignGate calls to a wrong-zone instance and gets "no gate available for
# requested zone" — see docs/design/stress-3zone-2026-05-23-postmortem.md §I.
# 多节点自动发现(2026-08):discovery-enabled=true 时,网关每
# discovery-interval-ms 从 etcd 拉 LoginNodeService.rpc/ 的注册,按 zone
# 建立动态 channel 池(同 zone 多实例轮询,重试自动换实例);上面的静态
# endpoints 只作为「etcd 里查不到该 zone」时的兜底,新增 zone / login
# 扩缩容不再需要改这份配置或重启网关。
login:
  grpc:
    endpoints: "1=127.0.0.1:53000,2=127.0.0.1:54000,3=127.0.0.1:55000"
    timeout-ms: 3000
    retry: 1
    discovery-enabled: true
    discovery-interval-ms: 5000

# Zone health probe
zone-probe:
  interval-ms: 5000
  # 探测失败时只在此 TTL 内提供最近一次完整成功快照；冷启动与过期快照
  # 都显式返回 UNKNOWN，不能伪装成全区 DOWN/维护。
  status-ttl-ms: 15000
  gate-stale-threshold-seconds: 30

# CDN
cdn:
  base-url: "https://cdn.example.com"
  sign-ttl-seconds: 3600

# Admin API security
admin:
  api-key: "change-me-in-production"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  # K8s 探针分组。/actuator/health 是**复合**健康:classpath 上有 JPA 与 Redis,它会把 db、redis
  # 两个指示器一起算进去。三个探针都打它的话,所有副本共享的 MySQL 或 Redis 一挂,每个网关副本
  # 同时 NotReady 并被 liveness 反复杀 —— replicas 2 对最常见的故障形态完全失效,还叠加重启风暴。
  # 所以单独开两个分组,都**不含外部依赖**:
  #   liveness  只回答「进程本身还活着吗」,外部系统的死活与是否该重启本进程无关;
  #   readiness 只回答「应用完成启动、可以接流量了吗」。共享依赖放进来 = 一挂全体下线、Service 后面
  #             一个端点都不剩;留在外面则 MySQL 故障时 assign-gate 自己回 5xx,恢复后立即可用。
  #             Redis 更不该进来:网关只拿它做限流(gate.rate-limit 默认关,且 fail-open)。
  # /actuator/health 保持原样不动:本机 start_game.ps1 与人工排障仍靠它看 db / redis 的真实状态。
  # probes.enabled 显式写 true:Spring 只在检测到 K8s 环境时才自动开,写死后本机也能 curl 到这两个端点。
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

# 日志:控制台按 logstash 风格输出一行一条 JSON(@timestamp / level / logger_name /
# thread_name / message / stack_trace),与 Go 侧 go-zero 的 JSON 一致,由
# deploy/observability/alloy/config.alloy 采进 Loki(见 docs/ops/grafana-loki-local-logs.md)。
# 想临时恢复人类可读的文本格式:启动时加 --logging.structured.format.console=
logging:
  structured:
    format:
      console: logstash
# CI smoke: this trailing comment exists only to dirty the file enough
# to fire .github/workflows/login-path-tests.yml on a verification PR.
# It can be reverted before merge — content is documentation-only.
