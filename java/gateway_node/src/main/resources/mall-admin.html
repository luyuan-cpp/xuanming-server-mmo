<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商城目录管理</title>
  <link rel="stylesheet" href="mall-admin.css">
  <script src="mall-admin.js" defer></script>
</head>
<body>
  <header><div><p class="eyebrow">运营工作台</p><h1>商城目录管理</h1><p>维护新订单的商品条款，核对库存与原订单。</p></div><span class="badge">受限命令</span></header>
  <main>
    <section class="access"><label>运维令牌<input id="admin-key" type="password" autocomplete="off" spellcheck="false" placeholder="仅在当前页面使用"></label><button id="forget-key" type="button" class="secondary">清除令牌</button><p>商品改价保留旧订单金额。库存只能按差额调整，不能占用未付款订单的预留数量。</p></section>
    <div class="columns">
      <section><h2>查询目录</h2><form id="list-form"><label>从 SKU ID 之后开始<input name="afterSkuId" value="0" inputmode="numeric" required></label><label>条数<input name="limit" type="number" min="1" max="100" value="20" required></label><button>查询</button></form>
        <h2>核对订单</h2><form id="order-form"><label>订单号<input name="orderId" maxlength="36" placeholder="订单 UUID" required></label><button class="secondary">查询原订单</button></form>
      </section>
      <section><h2>商品条款</h2><form id="terms-form">
        <label>操作<select name="mode"><option value="create">新增 SKU</option><option value="update">修改 SKU 条款</option></select></label>
        <div class="pair"><label>SKU ID<input name="skuId" inputmode="numeric" required></label><label>当前管理修订<input name="expectedRevision" value="0" inputmode="numeric" required></label></div>
        <div class="pair"><label>商品 ID<input name="productId" inputmode="numeric" required></label><label>SKU 编码<input name="skuCode" maxlength="64" required></label></div>
        <label>名称<input name="title" maxlength="128" required></label>
        <div class="pair"><label>价格（最小货币单位）<input name="priceMinor" inputmode="numeric" required></label><label>币种<input name="currency" value="CNY" maxlength="16" required></label></div>
        <label>发放类型<select name="grantKind"><option value="item">游戏物品</option><option value="currency">游戏货币（充值包）</option></select></label>
        <div class="pair"><label>物品配置 ID（物品类必填，货币类填 0）<input name="itemConfigId" type="number" min="0" max="2147483647" value="1" required></label><label>每份物品数（物品类 1..4096，货币类填 0）<input name="countPerUnit" type="number" min="0" max="4096" value="1" required></label></div>
        <div class="pair"><label>货币种类（货币类：0 银两 / 1 灵石 / 2 绑定灵石）<input name="currencyType" type="number" min="0" max="2" value="0" required></label><label>每份货币额（货币类必填，物品类填 0）<input name="currencyAmount" inputmode="numeric" value="0" required></label></div>
        <div class="pair"><label>新增时的初始库存<input name="stock" type="number" min="0" max="2147483647" value="0" required></label><label>发布状态<select name="published"><option value="false">未发布</option><option value="true">发布</option></select></label></div>
        <label>请求号<input name="requestId" maxlength="128" required></label><div class="actions"><button>提交条款</button><button type="button" class="secondary new-request">生成新请求号</button></div>
      </form></section>
      <section><h2>调整库存</h2><form id="stock-form"><label>SKU ID<input name="skuId" inputmode="numeric" required></label><label>当前管理修订<input name="expectedRevision" inputmode="numeric" required></label><label>数量差额<input name="delta" type="number" min="-2147483648" max="2147483647" required placeholder="例如 +10 或 -2"></label><label>请求号<input name="requestId" maxlength="128" required></label><div class="actions"><button>提交差额</button><button type="button" class="secondary new-request">生成新请求号</button></div></form><p class="hint">收到超时或响应不明时，保留原请求号与参数重查、重放。修改参数前生成新请求号。</p></section>
    </div>
    <div class="columns">
      <section><h2>查询人工待办（MANUAL）</h2><form id="manual-list-form">
        <label>订单游标（可空）<input name="afterOrderId" maxlength="36" placeholder="订单 UUID"></label>
        <label>寄售游标（可空）<input name="afterListingId" maxlength="20" placeholder="寄售 ID"></label>
        <label>退款游标（可空）<input name="afterRefundCursor" maxlength="256" placeholder="r1:order:channel:txn"></label>
        <label>每类条数<input name="limit" type="number" min="1" max="100" value="20" required></label>
        <button>查询人工单</button>
      </form></section>
      <section><h2>处置官方人工订单</h2><form id="manual-order-form">
        <label>订单号<input name="orderId" maxlength="36" required placeholder="订单 UUID"></label>
        <label>动作<select name="action"><option value="RETRY_REVERSAL">重试扣回（RETRY_REVERSAL）</option><option value="MARK_REVERSED">确认已扣回（MARK_REVERSED）</option><option value="MARK_DELIVERED">确认已交付（MARK_DELIVERED）</option><option value="CREATE_REFUND">转自动退款（CREATE_REFUND）</option></select></label>
        <label>处置原因<input name="reason" maxlength="256" required placeholder="工单号与核实结论"></label>
        <label>请求号<input name="requestId" maxlength="128" required></label>
        <div class="actions"><button>提交订单处置</button><button type="button" class="secondary new-request">生成新请求号</button></div>
      </form></section>
      <section><h2>处置人工退款 / 寄售</h2><form id="manual-refund-form">
        <label>订单号<input name="orderId" maxlength="36" required placeholder="订单 UUID"></label>
        <div class="pair"><label>渠道<input name="channel" maxlength="32" required placeholder="如 apple / wechatpay"></label><label>原付款流水号<input name="paymentTransactionId" maxlength="128" required></label></div>
        <label>退款动作<select name="action"><option value="RETRY_REFUND">重试渠道退款（RETRY_REFUND）</option><option value="MARK_REFUNDED">登记线下已退（MARK_REFUNDED）</option><option value="MARK_REVOKED">确认渠道已撤（MARK_REVOKED）</option></select></label>
        <label>线下退款流水号（仅 MARK_REFUNDED 必填）<input name="externalRefundId" maxlength="128"></label>
        <label>处置原因<input name="reason" maxlength="256" required placeholder="工单号与核实结论"></label>
        <label>请求号<input name="requestId" maxlength="128" required></label>
        <div class="actions"><button>提交退款处置</button><button type="button" class="secondary new-request">生成新请求号</button></div>
      </form>
      <form id="manual-consignment-form">
        <label>寄售编号<input name="listingId" maxlength="20" required placeholder="uint64 寄售 ID"></label>
        <label>寄售动作<select name="action"><option value="RETURN_TO_SELLER">退还托管资产（RETURN_TO_SELLER）</option><option value="UNFREEZE_INCOME">解冻卖家收入（UNFREEZE_INCOME）</option><option value="FORFEIT_INCOME">扣罚争议收入（FORFEIT_INCOME）</option></select></label>
        <label>处置原因<input name="reason" maxlength="256" required placeholder="工单号与核实结论"></label>
        <label>请求号<input name="requestId" maxlength="128" required></label>
        <div class="actions"><button>提交寄售处置</button><button type="button" class="secondary new-request">生成新请求号</button></div>
      </form></section>
    </div>
    <section class="result"><div class="result-title"><h2>操作结果</h2><span id="status" role="status" aria-live="polite">尚未请求</span></div><pre id="result" tabindex="0">查询后显示服务端原始 JSON；大整数保留原字节。</pre></section>
  </main>
</body>
</html>
