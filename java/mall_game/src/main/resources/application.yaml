server:
  address: ${COMMERCE_BIND_ADDRESS:127.0.0.1}
  port: ${COMMERCE_PORT:18120}
  shutdown: graceful
  tomcat:
    connection-timeout: 5s
    keep-alive-timeout: 30s
  error:
    include-message: never
    include-stacktrace: never
# 链路追踪(docs/design/distributed-tracing.md §7):接住 trade、网关带来的 traceparent,日志带同一个 traceId。
# 商城只在内网、调用方都经 HMAC 认证,所以照常接收传播头(公网入口的网关才藏掉)。
# actuator 只暴露 health 及 K8s 探针分组(livenessState / readinessState,不含 DB 指示器,避免共享库抖动把两副本同时判死);
# HmacAuthentication 只对 /actuator/health/readiness 与 /actuator/health/liveness 的无正文 GET 放行,复合 /actuator/health 与业务接口仍须 HMAC。
management:
  tracing:
    sampling:
      probability: 1.0
  # span 导出(阶段三,设计 §10.3):OTLP/HTTP 发本机 Alloy;Alloy 没起时丢批并打 WARN,不影响业务。
  # 不想导出就设 management.otlp.tracing.export.enabled=false。
  otlp:
    tracing:
      endpoint: http://127.0.0.1:4318/v1/traces
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
# 控制台一行一条 JSON(logstash 风格,与 gateway_node 一致):Micrometer 放进 MDC 的 traceId / spanId 成为顶层字段。
logging:
  structured:
    format:
      console: logstash
spring:
  lifecycle:
    timeout-per-shutdown-phase: 25s
  task:
    scheduling:
      pool:
        size: 2
  sql:
    init:
      mode: never
  datasource:
    url: ${COMMERCE_JDBC_URL}
    username: ${MMORPG_SQL_USERNAME}
    password: ${MMORPG_SQL_PASSWORD}
commerce:
  run-mode: ${COMMERCE_RUN_MODE:prod}
  require-tidb: ${COMMERCE_REQUIRE_TIDB:true}
  gateway-secret: ${COMMERCE_GATEWAY_SECRET}
  payment-secret: ${COMMERCE_PAYMENT_SECRET}
  delivery-secret: ${COMMERCE_DELIVERY_SECRET:}
  payment-subject: ${COMMERCE_PAYMENT_SUBJECT:payment-adapter}
  admin-secret: ${COMMERCE_ADMIN_SECRET:}
  admin-subject: ${COMMERCE_ADMIN_SUBJECT:mall-admin}
  mock-payment-enabled: ${COMMERCE_MOCK_PAYMENT_ENABLED:false}
  allowed-payment-channels: ${COMMERCE_ALLOWED_PAYMENT_CHANNELS:}
  consignment:
    notice-ms: ${COMMERCE_CONSIGNMENT_NOTICE_MS:172800000}
    sale-ms: ${COMMERCE_CONSIGNMENT_SALE_MS:604800000}
    cooling-ms: ${COMMERCE_CONSIGNMENT_COOLING_MS:259200000}
    fee-bps: ${COMMERCE_CONSIGNMENT_FEE_BPS:500}
    currencies: ${COMMERCE_CONSIGNMENT_CURRENCIES:0}

# 每boot独立NORMAL主体；启动grant缺失时拒启。
mmorpg:
  run-mode: ${MMORPG_RUN_MODE:prod}
  sql:
    require-tidb: ${MMORPG_SQL_REQUIRE_TIDB:true}
