server:
  address: ${COMMERCE_BIND_ADDRESS:127.0.0.1}
  port: ${COMMERCE_PORT:18120}
  error:
    include-message: never
    include-stacktrace: never
spring:
  sql:
    init:
      mode: never
  datasource:
    url: ${COMMERCE_JDBC_URL}
    username: ${MMORPG_SQL_USERNAME}
    password: ${MMORPG_SQL_PASSWORD}
commerce:
  run-mode: ${COMMERCE_RUN_MODE:prod}
  require-tidb: ${COMMERCE_REQUIRE_TIDB:true}
  gateway-secret: ${COMMERCE_GATEWAY_SECRET}
  payment-secret: ${COMMERCE_PAYMENT_SECRET}
  delivery-secret: ${COMMERCE_DELIVERY_SECRET:}
  payment-subject: ${COMMERCE_PAYMENT_SUBJECT:payment-adapter}
  admin-secret: ${COMMERCE_ADMIN_SECRET:}
  admin-subject: ${COMMERCE_ADMIN_SUBJECT:mall-admin}
  mock-payment-enabled: ${COMMERCE_MOCK_PAYMENT_ENABLED:false}
  allowed-payment-channels: ${COMMERCE_ALLOWED_PAYMENT_CHANNELS:}
  consignment:
    notice-ms: ${COMMERCE_CONSIGNMENT_NOTICE_MS:172800000}
    sale-ms: ${COMMERCE_CONSIGNMENT_SALE_MS:604800000}
    cooling-ms: ${COMMERCE_CONSIGNMENT_COOLING_MS:259200000}
    fee-bps: ${COMMERCE_CONSIGNMENT_FEE_BPS:500}
    currencies: ${COMMERCE_CONSIGNMENT_CURRENCIES:0}

# 每boot独立NORMAL主体；启动grant缺失时拒启。
mmorpg:
  run-mode: ${MMORPG_RUN_MODE:prod}
  sql:
    require-tidb: ${MMORPG_SQL_REQUIRE_TIDB:true}
