server:
  address: ${GM_HTTP_ADDRESS:127.0.0.1}
  port: ${GM_HTTP_PORT:18090}
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 25s
  main:
    lazy-initialization: true
  quartz:
    auto-startup: false
  flyway:
    enabled: false
  datasource:
    druid:
      stat-view-servlet:
        enabled: false
    dynamic:
      datasource:
        master:
          url: ${GM_JDBC_URL}
          username: ${GM_DB_USER}
          password: ${GM_DB_PASSWORD}
  data:
    redis:
      host: ${GM_REDIS_HOST:127.0.0.1}
      port: ${GM_REDIS_PORT:16391}
      password: ${GM_REDIS_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
jeecg:
  shiro:
    # 企业登录的三个入口发生在拿到会话之前，必须对 Shiro 匿名开放；它们的访问保护在 GmInstallation 与 GmOidcLogin。
    excludeUrls: /gm/sso/config,/gm/sso/authorize,/gm/sso/token
  path:
    upload: ${GM_UPLOAD_PATH}
    webapp: ${GM_UPLOAD_PATH}
logging:
  level:
    org.jeecg.modules.system.controller.LoginController: WARN
    org.jeecg.config.shiro: WARN
gm:
  bootstrap-password: ${GM_BOOTSTRAP_PASSWORD:}
  identity:
    # oidc：生产用，登录走外部身份提供方，原生口令登录与原生管理页关闭。
    # native：本机开发用，口令在后台自己库里；监听地址不是回环就拒绝启动。
    mode: ${GM_IDENTITY_MODE:native}
  oidc:
    issuer: ${GM_OIDC_ISSUER:}
    client-id: ${GM_OIDC_CLIENT_ID:}
    client-secret: ${GM_OIDC_CLIENT_SECRET:}
    # 必须与在身份提供方登记的回调地址逐字相同，指向后台前端的登录页。
    redirect-uri: ${GM_OIDC_REDIRECT_URI:}
    scope: ${GM_OIDC_SCOPE:openid profile}
    # 当操作人标识用的声明；必须稳定、不会换人，且只含字母数字和 . _ @ -，最长 64 个字符。
    subject-claim: ${GM_OIDC_SUBJECT_CLAIM:sub}
    groups-claim: ${GM_OIDC_GROUPS_CLAIM:groups}
    name-claim: ${GM_OIDC_NAME_CLAIM:name}
    # JSON 对象：身份提供方的分组名 → 后台角色编码，例如 {"gm-admins":"admin"}。角色每次登录按它整体替换。
    role-mapping: '${GM_OIDC_ROLE_MAPPING_JSON:{}}'
    # 会话上限（小时），到期不续，需要重新登录。
    session-hours: ${GM_OIDC_SESSION_HOURS:12}
  dual-control:
    # 双人复核：流水里的写命令要另一名管理员批准才执行。oidc 模式恒开（设成 false 会拒绝启动）；
    # native 模式缺省关，一个人能跑通；设成 true 可以用两个本地账号测。
    enforce: ${GM_DUAL_CONTROL_ENFORCE:}
    # 申请多久没人批准就作废（小时）。玩家 GM 另有五分钟的草稿时限，邮件另受自身到期时间约束。
    approval-ttl-hours: ${GM_DUAL_CONTROL_APPROVAL_TTL_HOURS:24}
  game:
    gateway-url: ${GM_GATEWAY_URL:http://127.0.0.1:8081}
    gateway-admin-key: ${GM_GATEWAY_ADMIN_KEY:}
    data-target: ${GM_DATA_TARGET:}
    locator-target: ${GM_LOCATOR_TARGET:}
    plaintext: ${GM_GAME_PLAINTEXT:true}
    mail-target: ${GM_MAIL_TARGET:}
    mail-admin-secret: ${GM_MAIL_ADMIN_SECRET:}
    scene-targets-json: '${GM_SCENE_TARGETS_JSON:{}}'
    scene-etcd-url: ${GM_SCENE_ETCD_URL:}
    scene-admin-secret: ${GM_SCENE_ADMIN_SECRET:}
    # 交易人工处置(TradeAdmin):trade 的 gRPC 地址,与 trade 配置 Commerce.ManualResolutionSecretEnv 指名的同一把密钥(调用方 ops-commerce)。
    # 这把密钥只挂给后台这个工作负载,不发给个人;任一项为空时交易人工处置页只读不可用。
    trade-target: ${GM_TRADE_TARGET:}
    trade-admin-secret: ${GM_TRADE_ADMIN_SECRET:}
    # 商城管理入口(java/mall_game /internal/admin/*,运营处置页的商城部分):HTTPS 或本机回环 HTTP 的根地址(含商城的部署前缀),
    # 与商城 commerce.admin-secret / commerce.admin-subject 同值。密钥只挂给后台这个工作负载;任一项为空时商城部分只读不可用。
    mall-url: ${GM_MALL_URL:}
    mall-admin-secret: ${GM_MALL_ADMIN_SECRET:}
    mall-admin-subject: ${GM_MALL_ADMIN_SUBJECT:mall-admin}
    # 运营处置的 gRPC 下游(双人复核批 5):地址 host:port;口令 / 密钥与各服务的管理入口同值,只挂给后台工作负载,任一项为空则该下游不可用。
    # login LoginAdmin 与 player_inbox PlayerInboxAdmin、data_service 回收认 metadata x-admin-token;
    # rank RankAdmin 认调用方 admin 的 ServiceCallAuth(与 rank 的 RANK_PRODUCER_SECRET_ADMIN 同值),
    # match 滞留阵容认调用方 ops-formation(与 match 的 GlobalMatch.ManualResolutionSecretEnv 指名的那把同值)。
    login-target: ${GM_LOGIN_TARGET:}
    login-admin-token: ${GM_LOGIN_ADMIN_TOKEN:}
    data-admin-token: ${GM_DATA_ADMIN_TOKEN:}
    inbox-target: ${GM_INBOX_TARGET:}
    inbox-admin-token: ${GM_INBOX_ADMIN_TOKEN:}
    rank-target: ${GM_RANK_TARGET:}
    rank-admin-secret: ${GM_RANK_ADMIN_SECRET:}
    match-target: ${GM_MATCH_TARGET:}
    match-formation-secret: ${GM_MATCH_FORMATION_SECRET:}
