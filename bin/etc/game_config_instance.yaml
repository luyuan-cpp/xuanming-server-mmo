# 副本/战场 scene node 示例配置
#
# 使用方式（任选其一）：
#   1. 启动前设置 GAME_CONFIG_PATH=etc/game_config_instance.yaml
#   2. 或在 K8s Deployment 层单独挂载 ConfigMap 到此路径
#   3. 或保留默认 game_config.yaml 并通过 SCENE_NODE_TYPE=1 覆盖角色字段
#
# 与 game_config.yaml 的唯一区别是 SceneNodeType: 1 (kSceneNode)，
# 其他字段保持与主世界节点完全一致。

SceneNodeType: 1
ZoneId: 1

# 控制集群 Redis,写法与含义同 game_config.yaml 的 control_redis 段;玩家域没写 player_redis 段时沿用它。
control_redis:
  mode: standalone
  seeds: ["127.0.0.1:6379"]
  password: ""  # 空 = 不认证;带口令的环境用环境变量 CONTROL_REDIS_PASSWORD 注入
