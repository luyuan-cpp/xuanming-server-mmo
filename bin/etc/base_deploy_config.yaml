# Etcd 配置，存储服务发现相关信息（分布式键值存储，用于服务注册/发现、配置共享）
Etcd:
  Hosts:
    - "127.0.0.1:2379" # Etcd 集群节点地址（单机部署填1个，集群需填所有节点IP:端口）
  KeepaliveInterval: 1 # 服务心跳间隔(单位:秒):当前服务向 Etcd 发送"存活信号"的频率
  NodeTTLSeconds: 180 # 服务存活超时(单位:秒):超过该时间无心跳,Etcd 标记服务"下线"
  # 2026-05-24 stress: 60s TTL 在 45k 开服浪涌时容易因为 keepalive
  # goroutine 被 grpc/IO 抢占导致一帧 keepalive 应答超过 60s,触发
  # NodeIdConflictReason::kLeaseExpiredByEtcd FATAL(见 z1_scene_1 22:52
  # 自杀,postmortem §A)。改 180s 给热点路径留 3 倍 buffer,等业务
  # 进入稳态再追根因。
  # NodeRemovalGraceSeconds: 300 # 节点下线宽限期(单位:秒):etcd DELETE 后延迟移除,断点调试时节点不会立即被摘除。生产环境设为 0
# 表格数据目录配置（存储静态配置表、业务数据表等文件的根路径）
TableDataDirectory: "../generated/tables/" # 路径可自定义（相对路径/绝对路径均可）
# 示例说明：若配置为 "./data/table"，则角色配置表可能存于 "./data/table/role_config.xlsx"，道具表存于 "./data/table/item_config.json"

# 表格数据加载格式: "json" (默认) 或 "binary" (加载 .pb 文件，启动更快)
TableDataFormat: "binary"

# 数据文件根目录（导航网格等），nav bin 路径 = DataRootDirectory + 表中 nav_bin_file 字段
# 本地开发: "../"   K8s 容器: "/app/"
DataRootDirectory: "../"

# 日志配置（控制日志输出级别）
LogLevel: 2 # 日志级别编码（通常约定：0=DEBUG，1=INFO，2=WARN，3=ERROR，4=FATAL，具体需结合业务代码定义）

# 健康检查相关配置（定期检测服务存活状态）
HealthCheckInterval: 1 # 健康检查间隔（单位：秒）：定期请求下方services列表中的健康检查接口

# 服务列表（需进行健康检查的目标服务，通常是当前系统依赖的其他微服务）
services:
  - name: "service1" # 服务名称（自定义标识，用于日志和监控区分）
    url: "http://localhost:8081/v1/health/service/service1" # service1的健康检查接口地址
  - name: "service2"
    url: "http://localhost:8082/v1/catalog/service/service2" # service2的健康检查/服务目录接口地址

# 服务发现前缀（Etcd中存储特定类型服务的“目录前缀”，用于快速筛选服务）
# 示例：所有网关服务（GateNodeService.rpc）的注册信息会存在 Etcd 的 "/GateNodeService.rpc/" 路径下
service_discovery_prefixes:
  - "SceneNodeService.rpc" # 场景节点服务（RPC类型）的Etcd存储前缀
  - "GateNodeService.rpc" # 网关节点服务（RPC类型）的Etcd存储前缀
  - "LoginNodeService.rpc" # 登录节点服务（RPC类型）的Etcd存储前缀
  - "FriendNodeService.rpc" # 好友服务（Go-Zero gRPC）的Etcd存储前缀
  - "GuildNodeService.rpc" # 公会服务（Go-Zero gRPC）的Etcd存储前缀
  - "SceneManagerNodeService.rpc" # 场景管理服务（Go-Zero gRPC）的Etcd存储前缀
  - "BattleNodeService.rpc" # 回合制战斗节点（C++ gRPC，全局池不分 zone；gate 据此发现 battle 建 gRPC channel，match 的 Go 侧自行 watch）
  - "ClientRpcRouterNodeService.rpc" # 客户端 RPC 路由服(Go-Zero,全局池):GATE_CLIENT_RPC_ROUTER=1 时 gate 唯一的 gRPC 目标,客户端消息按 message_id 经它不透明转发到 login/match/… (docs/design/client-rpc-router.md)
  - "MatchNodeService.rpc" # 匹配服务（Go-Zero gRPC，全局池不分 zone：不在 IsZoneScopedNodeType，gate 连全 zone 的 match 实例随机路由；排队池全服共享，见 docs/design/cross-zone-matchmaking.md）：gate 按 NODE_MATCH 路由 JoinQueue/WatchBattle 等客户端消息，缺此前缀会报 "Node not found ... message id: 157"（2026-09-01 冒烟补）
  - "DataServiceNodeService.rpc" # 全局数据服务（Go-Zero gRPC，全局池不分 zone）：scene 经它的 AllocateIdSegment 领 item / txlog / snapshot 三种永久 guid 的号段（IdSegments 里启用的种类领到首段是启动硬依赖）。前提：data_service 须按 C++ 约定把 NodeInfo 注册到本前缀下（同 scene_manager 的 noderegistry），只注册 go-zero 的 dataservice.rpc 是发现不到的

# Kafka 配置（分布式消息队列，用于异步通信、日志收集、事件分发等）
Kafka:
  Brokers:
    - "localhost:9092" # Kafka 集群 Broker 地址（单机填1个，集群需填所有Broker IP:端口）
  Topics:
    - "game-events" # 默认消息主题（如游戏内事件：角色升级、道具交易等）
  # Kafka consumer group ID.
  #
  # Empty string on purpose: when blank, the cpp engine falls back to
  # `<groupPrefix>-<node_id>` per instance (see
  # cpp/libs/engine/core/node/system/node/node_kafka_command_handler.h:150).
  # Sharing one group across the entire fleet (every gate + scene + ...) was
  # the original behavior, but it made Kafka rebalance happily hand a
  # `gate-{N}` partition to a process that wasn't actually gate-N — so a
  # zone-2 BindSession could land on z1_gate, where ValidateCommandTarget
  # silently dropped it because target_gate_id != node.GetNodeId(). Stress
  # 2026-05-24 saw this surface as z2/z3 `scene_notified=1` ratios at 5%
  # while z1 was at 100%; see docs/design/stress-3zone-2026-05-23-postmortem.md
  # §J.6.
  #
  # Per-instance groupId means every node only competes for partitions of
  # its own topic, which is what we always wanted: gate-N's group consumes
  # gate-N. ValidateCommandTarget then only ever sees correctly-routed
  # commands.
  GroupID: ""
  EnableAutoCommit: true
  AutoOffsetReset: "earliest"

  # ---- 控制面命令 topic 的分区契约 ----
  # docs/design/control-plane-topic-partitioning-20260908.md
  #
  # 上面那段关于 per-instance groupId 的说明只对**旧的**一节点一 topic 路径成立,
  # 而且它只解决了"跨 zone 错路由",没有解决同一个 node_id 被回收后
  # 前任僵尸与继任者共用 `gate-group-5` 的分区争夺(P1)。新路径不再进 group:
  # 命令走 `gate-cmd_g1` / `scene-cmd_g1`,partition = node_id % CommandTopicPartitions,
  # 每个进程 assign 自己那一个分区。
  #
  # 三个数是**部署级常量**,必须与下列各处同时改(改分区数一律走换代号,绝不原地扩):
  #   go/shared/kafkautil/command_topic.go 的默认值 / 环境变量
  #   deploy/docker-compose.yml 的 kafka-topic-init
  #   deploy/k8s/manifests/infra/kafka-topic-init.yaml(值由 k8s_deploy.ps1 从本文件读)
  CommandTopicPartitions: 256
  CommandTopicGeneration: 2
  # 迁移窗口开关。true = 不再消费旧的 `gate-<node_id>` / `scene-<node_id>`。
  # 生产者(含 Go login)全部切到新 topic 之前必须保持 false,否则命令全丢。
  #
  # 2026-09-08:**生产者侧前置条件已全部满足** —— 全仓已无旧主题的生产者
  # (C++ 四处走 ResolveCommandRoute;Go 的 friend/guild/match/scene_manager/
  # player_locator/login 全部切完;唯一残留的 LegacyPerNodeTopic() 只被消费端引用)。
  # 但**仍保持 false**:翻这个开关只关掉旧的消费路径,必须等新版本 gate/scene
  # 滚更全部完成、且旧 topic 的写入速率与积压都读到 0 之后,由运维显式翻。
  # 滚更窗口里提前翻 = 老版本生产者发出的命令没人消费。
  # 顺序见 docs/design/control-plane-topic-partitioning-20260908.md §迁移顺序 第 4 步。
  DisableLegacyPerNodeTopic: false

# Gate 连接令牌 HMAC 共享密钥（Login 签发，Gate 验证）
# 必须与 Go Login 的 GateTokenSecret 保持一致。
# 空值时 Gate 跳过令牌验证（开发/测试模式）。
# 2026-08-18 与 go/login/etc/login.yaml Secrets.GateToken 同步(login 侧已切新密钥)
GateTokenSecret: "local-dev-gate-token-secret-0123456789abcdef"

# Gate 并发客户端连接上限。生产必须在 1..131071 内取值;
# 0 仅允许显式 GATE_RUN_MODE=dev|test 的本地调试,表示关闭运维阈值,
# 但 session-id 的 131071 硬上限仍然生效;prod 会拒绝启动。
#
# gate 是唯一对公网开放的端口,而 muduo 的 TcpServer 无条件 accept ——
# 没有这条上限时,不需要任何凭证,只要一直建连就能把 gate 的 fd、SessionMap
# 和每连接读写缓冲吃光(token 校验发生在建连之后,拦不住)。
# 超限的新连接在分配 session 之前就被拒掉。
#
# 取值:按本 gate 期望承载的在线数留出余量(握手中、将断未断的连接都占额度),
# 并确保不超过进程的 fd 上限(ulimit -n 要大于本值 + 节点间连接 + 日志等)。
# 20000 是单 gate 的保守默认;真实容量要靠压测定,别照抄。
# 上界 131071 为所有 node_id 保留 UINT32_MAX 拒连哨兵,也避免 session-id
# 空间占满后碰撞重试永久自旋。
GateMaxConnections: 20000

# battle 节点客户端直连票据 HMAC 共享密钥(battle 节点签发并校验,见
# docs/design/turn-based-battle-server.md §18 D24)。全部 battle 实例必须一致;
# 刻意与 GateTokenSecret 不同(分域:任一泄露不影响另一侧)。
# 空值处置看 BATTLE_RUN_MODE:dev/test 放行并打 SECURITY WARNING,prod 拒绝启动。
BattleTokenSecret: "local-dev-battle-token-secret-fedcba9876543210"

# battle 节点客户端面并发直连上限(语义同 GateMaxConnections;0 仅 dev/test 允许)。
# 回合制房间人数有界:参战 ≤10 + 观众 ≤20 每房,按单节点期望房间数留余量。
BattleMaxConnections: 4096

# 审计 topic(流水 / 快照)的世代号,进有效 topic 名:transaction_log_topic_g<N> / player_snapshot_topic_g<N>。
# 基名是 C++ 常量(cpp/libs/modules/transaction_log/transaction_log_system.h、
# cpp/libs/modules/snapshot/snapshot_system.h),后缀由本键拼(0 = 1)。
#
# **必须与 go/data_service/etc/data_service.yaml 的 Kafka.TopicGeneration 相等**:
# C++ scene 是这两个 topic 唯一的生产者,go/data_service 的两条落库消费者是唯一的消费者,
# topic 名是两边唯一的会合点。不一致不会有任何报错 —— 生产者往一个没人消费的 topic 写,
# 流水 / 快照静默积压到保留期(默认 30 天)被删。
#
# 为什么第一代就带后缀:broker 开着 auto.create.topics.enable + num.partitions=1
# (deploy/docker-compose.yml KAFKA_NUM_PARTITIONS=1),生产者一发消息就把**裸名字**的 topic
# 自动建成 1 分区;消费端 kafkautil.EnsureTopics 拿 6 / 3 的分区契约去比,得到的永远是
# "partition contract mismatch",两条消费者一条都起不来,唯一症状是每 30s 一条 Error 日志。
# 带代号的名字与那两个被自动建出来的裸名 topic 互不相干,第一次就能按契约建成 6 / 3 分区。
#
# 换代(= 改分区数,绝不原地扩分区:扩分区会重映射 key=player_id 的哈希,同一玩家的流水顺序就断了)
# 必须同一次提交改两处并重出/重滚镜像:本键 + data_service.yaml 的 Kafka.TopicGeneration。
# K8s 上 node ConfigMap 里的这一键由 k8s_deploy.ps1 从 data_service.yaml 镜像生成(不抄这份)。
AuditTopicGeneration: 1

# 集群号(0..31):部署级常量,运维一次性设定,策划不碰。只有 Go 的 snowflake 槽位协议
# (login-player / guild / scene-manager / match)消费它,作为 17 位 worker 字段的高 5 位;
# C++ 侧 2026-09-08 起没有消费者(scene 的永久 guid 走号段,不编码集群),这里只是同一份口径。
# 本地/单集群保持 0;第二套集群才需要改。见 docs/design/node-id-overhaul-plan-20260908.md §5 / §7.5。
ClusterId: 0

# 永久 guid 号段(Leaf-segment,docs/design/node-id-overhaul-plan-20260908.md §6 / §7.5)。
# item guid / tx_id / snapshot_id 三种**全部**走号段:scene 经 DataService.AllocateIdSegment 从全局库
# id_segment 表领 [lo, hi) 双 buffer 发号,值域 [1, 2^55) 与存量 snowflake 号(≥ 6.7e16)不相交,
# 新旧号在同一张表 / 玩家 blob 里共存、不迁数据。scene 不再参与任何 snowflake 槽位协议。
# 一种 GUID 一个客户端实例(各自的段 / 预取 / 退避 / 指标),共用一条到 data_service 的 gRPC 路径。
# 只有 scene 读;gate / battle 不铸永久 guid。
#
# 启动:每个启用的种类领到首段是硬依赖(DependencyGate "id segments ready":没领到不放玩家进来);
# 运行期是弱依赖(手里两段能顶 data_service 不可用一段时间)。没有 snowflake 回退:没段就 fail-closed
# (背包整批拒绝、零写入;流水不发;快照跳过),都记 ERROR。
# 前提:service_discovery_prefixes 里有 DataServiceNodeService.rpc,且 data_service 按 C++ 约定注册 NodeInfo;
# id_segment 表里每个 Kind 有一行(迁移显式创建,生产不自动补种)。
#
# 动态 step(Leaf 口径):一段不到 15 分钟用完 → 下次 step ×2(≤ MaxStep);超过 30 分钟才用完 → ÷2(≥ MinStep)。
# 每天重启一次浪费 ≤ 2×step;2^55 个号在 10 万台每天重启下仍可撑两万年以上,这里只为把浪费压到最小。
# 加一种 guid(pet / guild …)= C++ GUID_SEGMENT_KIND_LIST 加一行 + 这里加一块 + id_segment 表加一行种子。
IdSegments:
  # item guid:拾取 / 发放 / 邮件附件每新建一个物品实例铸一个号。用户拍板的默认值:初值 20,000,区间 [1,000, 1,000,000]。
  - Kind: item
    Enabled: true
    InitialStep: 20000
    MinStep: 1000
    MaxStep: 1000000
  # tx_id:交易流水,每条一个号。调用点 9 处 —— 每新建 / 销毁 / 转移一个物品实例各一条(bag_service),
  # 每次货币增减 / 延迟追缴各一条(currency_system);货币操作比物品铸号更频繁,估算 tx 峰值 ≈ 2~3 倍 item 铸号率,
  # 所以初值与上限都取 item 的 2~2.5 倍:初值 50,000,区间 [2,000, 2,000,000]。
  - Kind: txlog
    Enabled: true
    InitialStep: 50000
    MinStep: 2000
    MaxStep: 2000000
  # snapshot_id:玩家快照,调用点 2 处(SNAPSHOT_LOGIN / SNAPSHOT_LOGOUT)≈ 每个会话 2 个号。
  # 峰值在开服 / 维护后回流的登录洪峰:按单节点几千玩家在几分钟内进来、10 分钟峰值 ≈ 1 万估,
  # 初值 2,000(浪费 ≤ 4,000/次重启,可忽略),区间 [200, 100,000];空闲节点一段撑过 30 分钟会自动缩到 200。
  - Kind: snapshot
    Enabled: true
    InitialStep: 2000
    MinStep: 200
    MaxStep: 100000
