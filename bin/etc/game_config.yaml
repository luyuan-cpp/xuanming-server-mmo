# 游戏场景配置 (main world / 主世界 host)
# 场景节点角色 (eSceneNodeType):
#   0 = kMainSceneNode       主世界宿主 (persistent, pre-created by SceneManager)
#   1 = kSceneNode           副本/战场宿主 (on-demand, lifecycle-managed)
#   2 = kMainSceneNodeCross  主世界跨服宿主
#   3 = kSceneNodeCross      副本跨服宿主
# 环境变量 SCENE_NODE_TYPE 可在 K8s Deployment 层覆盖此值，
# 以便同一镜像在主世界与副本两个 Deployment 中复用。
SceneNodeType: 0
ZoneId: 1

# 战斗配表指纹校验模式(仅 battle 节点读取;scene/gate 忽略此键)。
# CreateBattleRequest.table_fingerprint / players[i].table_fingerprint 非空时与 battle 自身
# 六张战斗表指纹比对(设计 docs/design/cross-zone-matchmaking.md §10):
#   warn    = 不一致只记结构化日志 metric=battle_table_fingerprint_mismatch,照常开局(默认)
#   enforce = 不一致拒绝 CreateBattle(kFeatureUnavailable),metric=battle_table_fingerprint_reject
#   off     = 不校验
# 环境变量 BATTLE_TABLE_FINGERPRINT_MODE 可覆盖(K8s 灰度用)。
battle_table_fingerprint_mode: warn

# Zone redis 配置
zoneredis:
  host: "127.0.0.1"        # Redis 服务器地址
  port: 6379               # Redis 服务器端口
  password: ""             # 空 = 不认证(本机无口令 Redis);带口令的环境用环境变量 ZONE_REDIS_PASSWORD 注入,值不进日志
  db: 0                    # 使用的 Redis 数据库编号
  timeout: 3000            # 连接 Redis 的超时时间（毫秒）
  max_connections: 100     # 最大连接数
  retry_interval: 1000     # 连接重试间隔时间（毫秒）

# 玩家域 Redis(docs/design/redis-player-store-cluster.md §5.1、§5.6),只有 scene 连它;上面的 zoneredis 是控制域。
# 整段缺失 = standalone,地址与口令沿用 zoneredis,开发环境不用改。上集群时打开:
#   mode      standalone | cluster,其它取值 scene 拒绝启动
#   seeds     host:port 列表。主机名只在启动时解析一次。standalone 恰好一个;cluster 至少一个,只用来拿拓扑
#   password  空 = 不认证;带口令的环境用环境变量 PLAYER_REDIS_PASSWORD 注入,值不进日志
# player_redis:
#   mode: cluster
#   seeds: ["10.0.0.1:6379", "10.0.0.2:6379", "10.0.0.3:6379"]
#   password: ""

# 玩家持久收件箱的 scene 消费端(docs/design/player-inbox-service.md §3.3、§7.3、§11.7)。
#   consumer_enabled        false = 不发 Fetch,账本字段照常随存档往返(回滚下限)。仓库默认开:全球成局的结算只经收件箱到玩家,
#                           go/player_inbox/etc/player_inbox.yaml 的 EnqueueTypes 默认列了 Battle 结算,这里关着 k8s_deploy.ps1 的写前门禁拒绝部署。
#   periodic_fetch_minutes  在线有界兜底周期(分钟,±20% 抖动),0 = 关闭。整段或此键缺失时加载器取 30。
player_inbox:
  consumer_enabled: true
  periodic_fetch_minutes: 30

# 进场、离场的审计快照(整档发 Kafka,data_service 落 player_snapshot)。只影响审计证据,不影响存盘。
# 整段或单键缺失时加载器取下面的默认值;K8s 的 node-config 从这里整段复制。
#   login_enabled / logout_enabled  两个触发点各自的开关。
#   sample_per_mille               千分比,1000 = 全量,按 player_id 稳定抽样,同一玩家的进退场快照成对。
audit_snapshot:
  login_enabled: true
  logout_enabled: true
  sample_per_mille: 1000
